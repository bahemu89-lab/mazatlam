<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Juegos de Mazatlam</title>
<link rel="stylesheet" href="common.css">
<style>
  body { overflow: hidden; }
  .menubar { flex: 0 0 auto; display: flex; align-items: center; gap: 10px; padding: 8px 14px; position: relative; z-index: 5;
             background: linear-gradient(180deg, #62cdf0 0%, #33a6d6 100%);
             box-shadow: 0 4px 0 #1f7fae, 0 10px 18px rgba(0,40,80,.25), inset 0 2px 0 rgba(255,255,255,.55); }
  .menubar::after { content: ""; position: absolute; left: 0; right: 0; top: 0; height: 45%; background: linear-gradient(180deg, rgba(255,255,255,.35), rgba(255,255,255,0)); pointer-events: none; }
  .menubar h1 { flex: 1; margin: 0; font-size: 32px; text-align: center; }
  .menubar .total { font-size: 22px; background: linear-gradient(180deg, #fff7d6, #ffe08a); color: #7a4b00; border-radius: 30px; padding: 6px 16px; white-space: nowrap;
                    box-shadow: 0 3px 0 #d9a520, 0 5px 10px rgba(0,0,0,.2), inset 0 1px 0 #fff; }
  .menubar .logo { font-size: 36px; animation: float 3s ease-in-out infinite; }
  .grid { flex: 1 1 auto; overflow-y: auto; -webkit-overflow-scrolling: touch; padding: 18px 16px 30px; display: grid; gap: 18px;
          grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); align-content: start; }
  .tile { --a: #ff9ccb; --b: #f0569a; --d: #b8306f;
          position: relative; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px;
          aspect-ratio: 1 / 1; border-radius: 30px; color: #fff; text-decoration: none; font-weight: 900; font-size: 20px;
          background: radial-gradient(circle at 30% 20%, rgba(255,255,255,.45), rgba(255,255,255,0) 45%), linear-gradient(160deg, var(--a) 0%, var(--b) 100%);
          border: 3px solid rgba(255,255,255,.7);
          box-shadow: 0 8px 0 var(--d), 0 16px 24px rgba(0,30,80,.28), inset 0 2px 0 rgba(255,255,255,.6), inset 0 -4px 0 rgba(0,0,0,.08);
          transition: transform .1s, box-shadow .1s; text-align: center; padding: 6px; line-height: 1.1; }
  .tile::before { content: ""; position: absolute; left: 6%; right: 6%; top: 4%; height: 40%; border-radius: 30px; pointer-events: none;
                  background: linear-gradient(180deg, rgba(255,255,255,.5), rgba(255,255,255,0)); }
  .tile .gloss { position: absolute; inset: 0; border-radius: 27px; overflow: hidden; pointer-events: none; }
  .tile .gloss::after { content: ""; position: absolute; top: -20%; bottom: -20%; width: 30%; left: 0;
                 background: linear-gradient(90deg, rgba(255,255,255,0), rgba(255,255,255,.4), rgba(255,255,255,0)); transform: translateX(-140%) skewX(-20deg); }
  .tile.shine .gloss::after { animation: shine 1.1s ease-in-out; }
  .tile:active { transform: scale(.95) translateY(6px); box-shadow: 0 2px 0 var(--d), 0 6px 10px rgba(0,30,80,.25), inset 0 2px 0 rgba(255,255,255,.6); }
  .tile .emoji { font-size: 60px; filter: drop-shadow(0 6px 6px rgba(0,0,0,.3)); transition: transform .15s; }
  .tile:active .emoji { transform: scale(1.1); }
  .tile span.name { text-shadow: 0 2px 0 rgba(0,0,0,.25), 0 4px 8px rgba(0,0,0,.2); padding: 2px 10px; border-radius: 14px; background: rgba(0,0,0,.12); }
  @media (min-width: 900px) { .grid { grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 22px; } .tile .emoji { font-size: 76px; } .tile { font-size: 24px; } }
  .c1{--a:#ff9ccb;--b:#f0569a;--d:#b8306f}.c2{--a:#7dd0ff;--b:#2f95e8;--d:#1a63a8}.c3{--a:#8ef0b0;--b:#24b36c;--d:#14784a}.c4{--a:#ffc077;--b:#ff7a1a;--d:#b8500a}
  .c5{--a:#b39cff;--b:#7f5af0;--d:#5232b3}.c6{--a:#ff8fb1;--b:#e53170;--d:#a11f4e}.c7{--a:#7fe3e0;--b:#00a8a8;--d:#00706f}.c8{--a:#ffe98a;--b:#ffb703;--d:#c47f00;color:#6a3f00}
  .c8 span.name{text-shadow:0 1px 0 rgba(255,255,255,.5);background:rgba(255,255,255,.25)}
  .hero { grid-column: 1 / -1; display: flex; align-items: center; gap: 14px; padding: 10px 16px; margin-bottom: 4px; }
  .hero .hi { font-size: 22px; color: #ff6f61; font-weight: 900; }
  .hero .reto-ttl { font-size: 16px; color: #7a4b00; margin-top: 2px; }
  .hero .reto { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 4px; }
  .hero .reto a { display: inline-flex; align-items: center; gap: 6px; padding: 6px 12px; border-radius: 16px; background: linear-gradient(180deg, #fff7d6, #ffe08a); color: #7a4b00; text-decoration: none; font-size: 16px; box-shadow: 0 3px 0 #d9a520; }
  .hero .reto a.done { background: linear-gradient(180deg, #d8f3dc, #9fe0b0); color: #14784a; box-shadow: 0 3px 0 #3fa864; }
  .hero .hero-tx { flex: 1; }
  .hero .hero-btns { display: flex; flex-direction: column; gap: 8px; }
  .hero .hero-btns .btn { font-size: 18px; min-height: 52px; padding: 6px 16px; text-decoration: none; }
  @media (max-width: 640px) { .hero { flex-wrap: wrap; } .hero .hero-btns { flex-direction: row; width: 100%; } .hero .hero-btns .btn { flex: 1; } .hero .mz svg { width: 70px; height: 70px; } }
  .grid h2.sec { grid-column: 1 / -1; margin: 10px 0 0; font-size: 26px; text-align: left; padding-left: 6px; }
  .tile .lv { position: absolute; top: 8px; left: 10px; font-size: 16px; filter: drop-shadow(0 2px 2px rgba(0,0,0,.35)); }
  .tile .sg { position: absolute; top: 6px; right: 10px; font-size: 14px; background: rgba(0,0,0,.25); padding: 2px 8px; border-radius: 12px; }
  .menubar .total { cursor: pointer; }
  .footer { flex: 0 0 auto; text-align: center; font-size: 14px; color: #fff; text-shadow: 0 1px 2px rgba(0,0,0,.4); padding: 4px; position: relative; z-index: 2; }
</style>
</head>
<body>
  <div class="menubar">
    <div class="logo emoji">🎈</div>
    <h1 class="title-outline">¡A jugar!</h1>
    <a class="total" id="total" href="progreso.html">⭐ 0</a>
  </div>
  <div class="grid" id="grid">
    <div class="hero panel">
      <div class="mz" id="mz"></div>
      <div class="hero-tx"><div class="hi" id="hi">¡Hola! Soy Mazi 🦊</div><div class="reto-ttl">🌟 Reto del día</div><div class="reto" id="reto"></div></div>
      <div class="hero-btns"><a class="btn purple" href="album.html" id="album-btn">📒 Álbum</a><a class="btn blue" href="progreso.html">📊 Progreso</a></div>
    </div>
  </div>
  <div class="footer">Juegos de Mazatlam · sin internet</div>
<script src="common.js"></script>
<script>
  var secciones = [
    { t: '🧠 Lógica y pensamiento', juegos: [
      { f: 'sudoku',       n: 'Sudoku',           e: '🔢', c: 'c5' },
      { f: 'robot',        n: 'Programa al robot', e: '🤖', c: 'c2' },
      { f: 'hanoi',        n: 'Torre',            e: '🗼', c: 'c4' },
      { f: 'quien',        n: '¿Quién es?',       e: '🕵️', c: 'c6' },
      { f: 'matrices',     n: 'La pieza que falta', e: '🧩', c: 'c7' },
      { f: 'patrones',     n: '¿Qué sigue?',      e: '🔵', c: 'c3' },
      { f: 'intruso',      n: 'El intruso',       e: '🔍', c: 'c1' },
      { f: 'diferencias',  n: 'Diferencias',      e: '👀', c: 'c5' },
      { f: 'memoria',      n: 'Memoria',          e: '🐵', c: 'c1' },
      { f: 'simon',        n: 'Simón dice',       e: '🟢', c: 'c4' }
    ]},
    { t: '➕ Matemáticas', juegos: [
      { f: 'numeros',      n: 'Números',          e: '🔢', c: 'c6' },
      { f: 'sumas',        n: 'Sumas y restas',   e: '➕', c: 'c4' },
      { f: 'balanza',      n: 'La balanza',       e: '⚖️', c: 'c2' },
      { f: 'tienda',       n: 'La tiendita',      e: '🪙', c: 'c8' },
      { f: 'reloj',        n: 'El reloj',         e: '🕒', c: 'c7' },
      { f: 'reparte',      n: 'Reparte igual',    e: '🍕', c: 'c1' },
      { f: 'formas',       n: 'Formas y colores', e: '🔺', c: 'c7' }
    ]},
    { t: '🔤 Letras y palabras', juegos: [
      { f: 'letras',       n: 'Letras',           e: '🔤', c: 'c5' },
      { f: 'palabras',     n: 'Forma la palabra', e: '✏️', c: 'c2' },
      { f: 'rimas',        n: 'Rimas',            e: '🎵', c: 'c1' },
      { f: 'adivinanzas',  n: 'Adivinanzas',      e: '❓', c: 'c6' },
      { f: 'historia',     n: 'Cuenta la historia', e: '📖', c: 'c3' }
    ]},
    { t: '🎨 Creatividad y espacio', juegos: [
      { f: 'tangram',      n: 'Tangram',          e: '🔷', c: 'c4' },
      { f: 'simetria',     n: 'Espejo',           e: '🪞', c: 'c2' },
      { f: 'bloques',      n: 'Construye',        e: '🧱', c: 'c8' },
      { f: 'rompecabezas', n: 'Rompecabezas',     e: '🧩', c: 'c3' },
      { f: 'colorear',     n: 'Colorear',         e: '🎨', c: 'c2' },
      { f: 'dibujar',      n: 'Dibujar',          e: '🖍️', c: 'c1' },
      { f: 'monstruo',     n: 'Crea tu monstruo', e: '👾', c: 'c8' },
      { f: 'vestir',       n: 'Vestir',           e: '👗', c: 'c6' },
      { f: 'piano',        n: 'Piano',            e: '🎹', c: 'c5' },
      { f: 'sombras',      n: 'Sombras',          e: '🐘', c: 'c8' }
    ]},
    { t: '🏃 Acción y cuidado', juegos: [
      { f: 'laberinto',    n: 'Laberinto',        e: '🐰', c: 'c6' },
      { f: 'carrera',      n: 'Carrera',          e: '🏃', c: 'c2' },
      { f: 'pesca',        n: 'Pesca',            e: '🎣', c: 'c7' },
      { f: 'globos',       n: 'Globos',           e: '🎈', c: 'c4' },
      { f: 'atrapa',       n: 'Atrapa al topo',   e: '🐹', c: 'c3' },
      { f: 'alimenta',     n: 'Alimenta',         e: '🍌', c: 'c5' },
      { f: 'mascota',      n: 'Mi mascota',       e: '🐶', c: 'c6' },
      { f: 'gato',         n: 'Tres en raya',     e: '🐱', c: 'c7' }
    ]}
  ];
  var grid = document.getElementById('grid');
  var starsGame = {}, done = {};
  try { starsGame = JSON.parse(localStorage.getItem('kg-stars-game') || '{}'); done = JSON.parse(localStorage.getItem('kg-done') || '{}'); } catch (e) {}
  var tiles = [];
  secciones.forEach(function (sec) {
    var h = document.createElement('h2'); h.className = 'sec title-outline'; h.textContent = sec.t; grid.appendChild(h);
    sec.juegos.forEach(function (j) {
      var a = document.createElement('a');
      a.className = 'tile ' + j.c; a.href = 'games/' + j.f + '.html';
      var d = done[j.f] || {}; var lv = (d[4] ? '🏆' : d[3] ? '⭐⭐⭐' : d[2] ? '⭐⭐' : d[1] ? '⭐' : '');
      a.innerHTML = '<span class="gloss"></span><span class="emoji">' + j.e + '</span><span class="name">' + j.n + '</span>' +
        (lv ? '<span class="lv">' + lv + '</span>' : '') + (starsGame[j.f] ? '<span class="sg">⭐ ' + starsGame[j.f] + '</span>' : '');
      a.addEventListener('pointerdown', function () { KidsGame.sound.tap(); });
      grid.appendChild(a); tiles.push(a);
    });
  });
  // Mascota, reto del día y saludo
  document.getElementById('mz').innerHTML = KidsGame.mascot(96);
  var names = {}; secciones.forEach(function (sec) { sec.juegos.forEach(function (j) { names[j.f] = j; }); });
  var dailyDone = {}; try { dailyDone = (JSON.parse(localStorage.getItem('kg-daily') || '{}'))[new Date().toISOString().slice(0, 10)] || {}; } catch (e) {}
  var retoEl = document.getElementById('reto');
  KidsGame.dailyGames().forEach(function (f) { var j = names[f]; if (!j) return; var a = document.createElement('a'); a.href = 'games/' + f + '.html'; a.className = dailyDone[f] ? 'done' : ''; a.innerHTML = '<span class="emoji">' + j.e + '</span>' + j.n + (dailyDone[f] ? ' ✅' : ''); a.addEventListener('pointerdown', function () { KidsGame.sound.tap(); }); retoEl.appendChild(a); });
  var h = new Date().getHours(); var saludo = h < 12 ? '¡Buenos días!' : h < 19 ? '¡Hola!' : '¡Buenas noches!';
  var nst = Object.keys(KidsGame.stickers.owned()).length; document.getElementById('album-btn').textContent = '📒 Álbum ' + nst + '/' + KidsGame.stickers.all().length;
  document.getElementById('hi').textContent = saludo + ' Soy Mazi 🦊';
  document.getElementById('mz').addEventListener('pointerdown', function () { KidsGame.sound.pop(); KidsGame.fx.burstAt(document.getElementById('mz'), { chars: ['⭐', '💛', '✨'] }); KidsGame.say(KidsGame.pick(['¡Hola! ¿A qué jugamos hoy?', '¡Vamos a pensar mucho!', 'El reto del día te da stickers extra', '¡Tú puedes con el nivel experto!'])); });
  // Transición al abrir un juego
  grid.addEventListener('click', function (ev) { var a = ev.target.closest('a'); if (a && a.getAttribute('href')) { ev.preventDefault(); KidsGame.go(a.getAttribute('href')); } });
  // Destello aleatorio en los mosaicos
  setInterval(function () { var t = tiles[KidsGame.rand(tiles.length)]; if (!t) return; t.classList.remove('shine'); void t.offsetWidth; t.classList.add('shine'); }, 1400);
  try { document.getElementById('total').textContent = '⭐ ' + (localStorage.getItem('kg-total-stars') || 0); } catch (e) {}
</script>
</body>
</html>
