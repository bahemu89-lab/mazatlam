<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Álbum</title>
<link rel="stylesheet" href="common.css">
<style>
  .wrap { flex: 1 1 auto; overflow-y: auto; -webkit-overflow-scrolling: touch; padding: 14px 16px 30px; }
  .hero { display: flex; align-items: center; gap: 14px; padding: 12px 18px; margin-bottom: 14px; }
  .hero .tx { flex: 1; }
  .hero .big { font-size: 30px; font-weight: 900; color: #ff6f61; text-shadow: 0 2px 0 #fff; }
  .hero .sub { color: #6b7a99; font-size: 16px; }
  .bar { height: 18px; border-radius: 10px; background: #e6ebf5; overflow: hidden; box-shadow: inset 0 2px 4px rgba(0,0,0,.15); margin-top: 6px; }
  .bar i { display: block; height: 100%; background: linear-gradient(180deg, #ffe98a, #ffb703); border-radius: 10px; box-shadow: inset 0 2px 0 #fff; transition: width .8s; }
  h2.sec { margin: 16px 0 8px; font-size: 24px; display: flex; justify-content: space-between; align-items: center; }
  h2.sec small { font-size: 16px; color: #6b7a99; font-weight: 700; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)); gap: 12px; }
  .st { aspect-ratio: 1; border-radius: 20px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; font-size: 13px; color: #2b3a67; text-align: center; padding: 6px;
        background: linear-gradient(180deg, #fff, #f1f4fb); border: 3px solid #fff; box-shadow: 0 5px 0 #c9d2e6, 0 10px 16px rgba(20,40,90,.18); animation: pop .4s ease-out backwards; }
  .st .emoji { font-size: 44px; }
  .st.lock { background: #e9edf6; box-shadow: inset 0 3px 6px rgba(0,0,0,.12); border-color: #e9edf6; color: #a3adc7; }
  .st.lock .emoji { filter: grayscale(1) brightness(.25) opacity(.35); }
  .st.gold { background: linear-gradient(180deg, #fff3b0, #ffd54a); border-color: #fff; box-shadow: 0 5px 0 #c47f00, 0 0 16px rgba(255,200,0,.5); }
  .st.new { outline: 4px solid #2cb67d; outline-offset: 2px; }
  .tip { font-size: 15px; color: #6b7a99; margin-top: 18px; text-align: center; }
</style>
</head>
<body>
<div class="wrap">
  <div class="panel hero"><div id="mz"></div><div class="tx"><div class="big" id="ttl">Mi álbum</div><div class="sub" id="sub"></div><div class="bar"><i id="bar" style="width:0"></i></div></div></div>
  <div id="cols"></div>
  <div class="tip">Cada nivel que terminas te da un sticker. En <b>Experto 🏆</b> son dorados. Los juegos del <b>Reto del día</b> dan uno extra.</div>
</div>
<script src="common.js"></script>
<script>
  KidsGame.init({ title: 'Álbum de stickers', showStars: false });
  var g = document.querySelector('.game'); if (g) g.remove();
  document.querySelector('.topbar .btn').onclick = function () { KidsGame.sound.tap(); KidsGame.go('index.html'); };
  document.getElementById('mz').innerHTML = KidsGame.mascot(96);
  var all = KidsGame.stickers.all(), owned = KidsGame.stickers.owned();
  var n = Object.keys(owned).length;
  document.getElementById('sub').textContent = n + ' de ' + all.length + ' stickers';
  setTimeout(function () { document.getElementById('bar').style.width = Math.round(100 * n / all.length) + '%'; }, 100);
  var recent = Date.now() - 1000 * 60 * 10;
  var cols = {}; all.forEach(function (s) { (cols[s.col] = cols[s.col] || []).push(s); });
  var cont = document.getElementById('cols'), k = 0;
  Object.keys(cols).forEach(function (name) {
    var have = cols[name].filter(function (s) { return owned[s.id]; }).length;
    var h = document.createElement('h2'); h.className = 'sec'; h.innerHTML = name + ' <small>' + have + ' / ' + cols[name].length + (have === cols[name].length ? ' ✅ ¡Completa!' : '') + '</small>'; cont.appendChild(h);
    var grid = document.createElement('div'); grid.className = 'grid';
    cols[name].forEach(function (s) {
      var o = owned[s.id]; var d = document.createElement('div');
      d.className = 'st' + (o ? (o.gold ? ' gold' : '') + (o.t > recent ? ' new' : '') : ' lock');
      d.style.animationDelay = (k++ * 25) + 'ms';
      d.innerHTML = '<span class="emoji">' + s.e + '</span><span>' + (o ? s.n : '?') + '</span>';
      if (o) d.onclick = function () { KidsGame.sound.pop(); KidsGame.fx.burstAt(d, { chars: [s.e, '✨'] }); KidsGame.say(s.n); };
      grid.appendChild(d);
    });
    cont.appendChild(grid);
  });
  if (n === 0) KidsGame.say('Termina un nivel de cualquier juego para ganar tu primer sticker');
</script>
</body>
</html>
