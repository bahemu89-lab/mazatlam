<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<link rel="stylesheet" href="../common.css">
<title>Alimenta</title>
<style>
  /* ===== Mundo: "El zoológico" — cielo, arbolitos, cerca y recintos con caritas de animales en SVG que abren la boca ===== */
  .game { display: flex; flex-direction: column; padding: 8px; gap: 8px; touch-action: none;
    background:
      radial-gradient(ellipse 120% 70% at 50% 100%, rgba(0,80,0,.18), rgba(0,0,0,0) 60%),
      radial-gradient(ellipse 30% 18% at 15% 36%, #5fbf5a 0 60%, rgba(0,0,0,0) 61%),
      radial-gradient(ellipse 26% 16% at 85% 34%, #4fae4c 0 60%, rgba(0,0,0,0) 61%),
      radial-gradient(ellipse 36% 20% at 50% 38%, #74cc68 0 60%, rgba(0,0,0,0) 61%),
      linear-gradient(180deg, #9fdcff 0%, #d7f1ff 34%, #a8e07a 36%, #7cc95a 70%, #5fb04a 100%); }
  .game::before { content: ""; position: absolute; left: 0; right: 0; top: 36%; height: 7%; z-index: 0; pointer-events: none; opacity: .9;
    background: linear-gradient(180deg, rgba(0,0,0,0) 28%, #e3b574 28%, #b9843f 44%, rgba(0,0,0,0) 44%, rgba(0,0,0,0) 62%, #e3b574 62%, #b9843f 78%, rgba(0,0,0,0) 78%),
      linear-gradient(90deg, rgba(0,0,0,0) 0 10px, #d9a764 10px 22px, #b8853f 22px 28px, rgba(0,0,0,0) 28px 60px) 0 0 / 60px 100% repeat-x; }
  .deco { position: absolute; z-index: 0; pointer-events: none; font-size: 40px; filter: drop-shadow(0 4px 3px rgba(0,0,0,.25)); line-height: 1; font-family: "Noto Color Emoji", "Apple Color Emoji", "Segoe UI Emoji", sans-serif; animation: float 3.6s ease-in-out infinite; }
  .sign { position: absolute; left: 50%; top: 2px; transform: translateX(-50%); z-index: 0; pointer-events: none; padding: 2px 16px 4px; border-radius: 10px; font-size: 18px; font-weight: 900; letter-spacing: 3px; color: #fff7d6;
    background: linear-gradient(180deg, #a26b35, #6b4320); box-shadow: 0 3px 0 #3f2510, 0 6px 10px rgba(0,0,0,.3); text-shadow: 0 1px 0 #3f2510; display: none; }
  .hud { flex: 0 0 auto; display: flex; align-items: center; justify-content: center; gap: 10px; font-size: 22px; position: relative; z-index: 3; }
  .hud .lvl { background: linear-gradient(180deg, #ffffff, #eef3ff); border-radius: 30px; padding: 6px 18px; border: 3px solid #fff; font-weight: 900; color: #1f2f6b; box-shadow: 0 5px 0 #c9d2e6, 0 10px 16px rgba(20,40,90,.22), inset 0 2px 0 #fff; }
  .hud .lvbtn { width: 56px; height: 56px; min-width: 56px; min-height: 56px; padding: 0; font-size: 26px; border-radius: 50%; pointer-events: auto; }
  .hud .dish { font-size: 30px; }
  .animals { flex: 1 1 0; min-height: 0; display: flex; flex-wrap: wrap; align-items: center; justify-content: center; align-content: center; gap: 14px; position: relative; z-index: 1; transition: transform .35s cubic-bezier(.2,1.3,.4,1), opacity .3s; }
  .game.sw .animals, .game.sw .tray { transform: scale(.92); opacity: 0; }
  /* Recinto del animal: tarjeta con marco de madera y pasto */
  .animal {
    position: relative; width: var(--as); height: var(--as); flex-direction: column; gap: 0; border-radius: 28px; border: 4px solid #e2b06a;
    background: radial-gradient(ellipse 80% 40% at 50% 100%, #8fd25a 0, #b9ec84 60%, rgba(185,236,132,0) 61%), linear-gradient(170deg, #ffffff 0%, #f6f1e6 60%, #ead9bf 100%);
    box-shadow: 0 7px 0 #9c6b35, 0 14px 22px rgba(40,60,20,.28), inset 0 2px 0 #fff;
    transition: transform .18s, background .25s, box-shadow .25s;
  }
  .animal::after { display: none; }
  .animal .gs { position: absolute; left: 10%; right: 10%; bottom: -22px; height: 26px; border-radius: 50%; pointer-events: none; background: radial-gradient(ellipse at 50% 50%, rgba(0,0,0,.28), rgba(0,0,0,0) 70%); }
  .animal .medal {
    position: relative; z-index: 1; display: flex; align-items: center; justify-content: center;
    width: calc(var(--as) * .66); height: calc(var(--as) * .66); border-radius: 50%; margin-top: calc(var(--as) * .05);
    background: radial-gradient(circle at 35% 28%, #ffffff 0, #fff7df 40%, #ffe3a3 78%, #f2bf5a 100%);
    box-shadow: 0 6px 0 #c98f2a, 0 12px 16px rgba(0,0,0,.2), inset 0 3px 0 rgba(255,255,255,.9), 0 0 0 4px #fff, 0 0 0 7px rgba(242,191,90,.45);
  }
  .animal:not(.fed) .medal { animation: breathe 2.8s ease-in-out infinite; }
  .animal:nth-child(2) .medal { animation-delay: -.7s; } .animal:nth-child(3) .medal { animation-delay: -1.4s; }
  .animal:nth-child(4) .medal { animation-delay: -2.1s; } .animal:nth-child(5) .medal { animation-delay: -.35s; }
  @keyframes breathe { 0%,100%{transform:scale(1,1) translateY(0)} 50%{transform:scale(1.03,.98) translateY(2px)} }
  .animal .face { width: 84%; height: 84%; display: block; position: relative; z-index: 1; overflow: visible; }
  .animal .face .mo { transform-box: fill-box; transform-origin: 50% 0; transform: scaleY(0); transition: transform .12s; }
  .animal .face .sm { transition: opacity .12s; }
  .animal .face .eyes { transform-box: fill-box; transform-origin: 50% 50%; animation: ablink 4.6s infinite; }
  @keyframes ablink { 0%,94%,100% { transform: scaleY(1); } 97% { transform: scaleY(.1); } }
  .animal .hint { font-size: calc(var(--as) * .16); position: relative; z-index: 1; margin-top: calc(var(--as) * .02); }
  .animal .want {
    position: absolute; top: -10px; right: -10px; z-index: 3; display: flex; align-items: center; justify-content: center; gap: 4px;
    min-width: calc(var(--as) * .34); height: calc(var(--as) * .34); padding: 0 6px; border-radius: 40px;
    background: linear-gradient(180deg, #ffffff 0%, #fff4c9 100%); border: 3px solid #ffb703;
    box-shadow: 0 4px 0 #d9a520, 0 8px 12px rgba(0,0,0,.2), inset 0 2px 0 #fff;
    font-size: calc(var(--as) * .2); animation: wantbob 2s ease-in-out infinite;
  }
  .animal .want::after { content: ""; position: absolute; left: 10px; bottom: -12px; width: 12px; height: 12px; border-radius: 50%; background: #fff4c9; border: 3px solid #ffb703; box-shadow: -6px 8px 0 -3px #fff4c9, -6px 8px 0 0 #ffb703; }
  @keyframes wantbob { 0%,100%{transform:translateY(0) rotate(0)} 50%{transform:translateY(-4px) rotate(3deg)} }
  .animal .want .w { position: relative; transition: transform .25s, opacity .25s; }
  .animal .want .w.done { opacity: .35; filter: grayscale(.8); transform: scale(.75); }
  .animal .want .w.done::after { content: "✔"; position: absolute; right: -6px; top: -8px; font-size: 55%; color: #2cb67d; filter: none; }
  .animal .want .w.now { transform: scale(1.15); }
  .animal .want .sep { font-size: 60%; color: #b48200; }
  .animal.two .want { top: -22px; right: -6px; font-size: calc(var(--as) * .17); height: calc(var(--as) * .3); }
  .animal.two .medal { margin-top: calc(var(--as) * .12); width: calc(var(--as) * .58); height: calc(var(--as) * .58); }
  .animal.three .want { top: -24px; left: -6px; right: -6px; height: calc(var(--as) * .27); font-size: calc(var(--as) * .15); padding: 0 4px; gap: 2px; }
  .animal.three .want .sep { font-size: 55%; }
  .animal.three .medal { margin-top: calc(var(--as) * .12); width: calc(var(--as) * .56); height: calc(var(--as) * .56); }
  .animal .want .cnt { font-size: 70%; color: #b48200; font-weight: 900; }
  .animal .nope { position: absolute; left: -8px; bottom: -8px; z-index: 3; display: none; align-items: center; font-size: calc(var(--as) * .15); padding: 2px 8px; border-radius: 30px; background: #fff; border: 3px solid #e63946; box-shadow: 0 4px 0 #8f1a24, 0 8px 12px rgba(0,0,0,.2); }
  .animal.three .nope { display: inline-flex; }
  .animal.three.fed .nope { display: none; }
  .animal .nope.shake { animation: shake .4s; }
  .hud .hintbtn { display: none; }
  .hud .hintbtn.show { display: inline-flex; }
  .hud .hintbtn.off { opacity: .5; filter: grayscale(.6); }
  .hud .budget { display: none; align-items: center; gap: 4px; font-size: 22px; font-weight: 900; color: #7a4b00; padding: 4px 12px; border-radius: 20px; background: linear-gradient(180deg, #fff7d6, #ffe08a); box-shadow: 0 3px 0 #d9a520, 0 6px 10px rgba(0,0,0,.2), inset 0 1px 0 #fff; }
  .hud .budget.show { display: inline-flex; }
  .animal.over { transform: scale(1.08); box-shadow: 0 7px 0 #9c6b35, 0 14px 24px rgba(0,0,0,.25), 0 0 0 6px rgba(255,209,102,.7), inset 0 2px 0 #fff; }
  .animal.fed { background: radial-gradient(ellipse 80% 40% at 50% 100%, #8fd25a 0, #b9ec84 60%, rgba(185,236,132,0) 61%), linear-gradient(160deg, #eefff0, #c9f3d0); border-color: #6fdc8c; box-shadow: 0 7px 0 #3fa864, 0 12px 20px rgba(20,120,60,.28), 0 0 0 5px rgba(111,220,140,.5), inset 0 2px 0 #fff; }
  .animal.fed .medal { background: radial-gradient(circle at 35% 28%, #ffffff 0, #dfffe6 40%, #8ee6a5 78%, #2cb67d 100%); box-shadow: 0 6px 0 #1c8a53, 0 12px 16px rgba(0,0,0,.22), inset 0 3px 0 rgba(255,255,255,.9), 0 0 0 4px #fff; }
  .animal.fed .want { display: none; }
  .animal .ok { display: none; position: absolute; top: -12px; right: -12px; z-index: 3; width: calc(var(--as) * .3); height: calc(var(--as) * .3); border-radius: 50%; align-items: center; justify-content: center; font-size: calc(var(--as) * .16); color: #fff;
    background: radial-gradient(circle at 35% 28%, #a8f0c0, #2cb67d 70%); box-shadow: 0 4px 0 #1c8a53, 0 8px 12px rgba(0,0,0,.25), inset 0 2px 0 rgba(255,255,255,.7), 0 0 0 4px #fff; }
  .animal.fed .ok { display: flex; animation: pop .45s ease-out; }
  .animal.nam .face { animation: nam .7s ease-out; }
  .animal.no { animation: nono .5s ease-in-out; }
  @keyframes nam { 0%{transform:scale(1)} 30%{transform:scale(1.3,1.15) rotate(-8deg)} 60%{transform:scale(1.15,1.25) rotate(8deg)} 100%{transform:scale(1)} }
  @keyframes nono { 0%,100%{transform:rotate(0)} 20%{transform:rotate(-14deg)} 40%{transform:rotate(12deg)} 60%{transform:rotate(-10deg)} 80%{transform:rotate(8deg)} }
  /* Carrito de comida del cuidador */
  .tray {
    position: relative; flex: 0 0 auto; display: flex; flex-wrap: wrap; justify-content: center; align-items: center; align-content: center; gap: 12px; z-index: 2;
    padding: 12px 14px; min-height: calc(var(--fs) + 28px); border-radius: 26px; border: 4px solid #efcf8f; transition: transform .35s cubic-bezier(.2,1.3,.4,1), opacity .3s;
    background:
      repeating-linear-gradient(90deg, rgba(255,255,255,.07) 0 5px, rgba(0,0,0,0) 5px 9px, rgba(60,30,0,.07) 9px 14px, rgba(0,0,0,0) 14px 22px),
      linear-gradient(180deg, #e0ab66 0%, #c68542 55%, #a6652c 100%);
    box-shadow: 0 9px 0 #7a4418, 0 18px 26px rgba(0,0,0,.32), inset 0 5px 12px rgba(60,30,0,.35), inset 0 -2px 0 rgba(255,255,255,.25);
  }
  .tray::before { content: ""; position: absolute; left: 6px; right: 6px; top: 4px; height: 18px; border-radius: 20px; pointer-events: none; background: linear-gradient(180deg, rgba(255,255,255,.28), rgba(255,255,255,0)); }
  .food {
    width: var(--fs); height: var(--fs); font-size: calc(var(--fs) * .58); border-radius: 50%; border: 0;
    background: radial-gradient(circle at 50% 42%, #ffffff 0 52%, #e9eef7 53% 66%, #ffffff 67% 100%);
    box-shadow: 0 5px 0 #b9c3d8, 0 10px 14px rgba(0,0,0,.35), inset 0 -3px 0 rgba(0,0,0,.05), inset 0 2px 0 #fff;
    display: flex; align-items: center; justify-content: center; touch-action: none; transition: transform .12s;
  }
  .food::after { top: 6%; left: 18%; right: 18%; height: 30%; border-radius: 50%; }
  .food:active { transform: scale(1.08); }
  .food.ghost { opacity: .3; }
  .food.gone { display: none; }
  .drag { position: fixed; left: 0; top: 0; z-index: 30; pointer-events: none; transform: translate(-50%, -50%) scale(1.25); box-shadow: 0 14px 0 rgba(0,0,0,.08), 0 26px 30px rgba(0,0,0,.4); }
  .drag.back { transition: transform .3s ease-in, opacity .3s; }
  .heart { position: fixed; z-index: 35; pointer-events: none; font-size: 34px; animation: heart 1.1s ease-out forwards; }
  @keyframes heart { 0%{transform:translate(-50%,0) scale(.6);opacity:1} 100%{transform:translate(-50%,-150px) scale(1.4) rotate(15deg);opacity:0} }
  .banner { position: absolute; left: 50%; top: 42%; z-index: 12; pointer-events: none; padding: 10px 32px; border-radius: 40px; white-space: nowrap;
    font-size: 34px; font-weight: 900; color: #fff; text-shadow: 0 2px 0 #1b8a4c, 0 4px 8px rgba(0,0,0,.3);
    background: linear-gradient(180deg, #8ef0b0, #24b36c); border: 3px solid #fff; box-shadow: 0 6px 0 #14784a, 0 14px 24px rgba(0,0,0,.35), inset 0 2px 0 rgba(255,255,255,.6);
    transform: translate(-50%,-50%) scale(.5); opacity: 0; transition: transform .35s cubic-bezier(.2,1.5,.4,1), opacity .25s; }
  .banner.show { transform: translate(-50%,-50%) scale(1); opacity: 1; }
  .banner.gold { background: linear-gradient(180deg, #ffe98a, #ffb703); color: #6a3f00; text-shadow: 0 1px 0 rgba(255,255,255,.6); box-shadow: 0 6px 0 #c47f00, 0 14px 24px rgba(0,0,0,.35); }
  @media (orientation: landscape) {
    .game { flex-direction: row; }
    .hud { position: absolute; left: 0; right: 0; top: 4px; z-index: 3; pointer-events: none; }
    .animals { padding-top: 44px; }
    .tray { flex-direction: column; flex-wrap: wrap; max-height: 100%; min-width: calc(var(--fs) + 32px); min-height: 0; padding: 12px;
      background:
        repeating-linear-gradient(180deg, rgba(255,255,255,.07) 0 5px, rgba(0,0,0,0) 5px 9px, rgba(60,30,0,.07) 9px 14px, rgba(0,0,0,0) 14px 22px),
        linear-gradient(90deg, #e0ab66 0%, #c68542 55%, #a6652c 100%); }
  }
</style>

<script>

(function () {

    '🐨': { b: '#a9aeb8', l: '#dde0e8', d: '#6c7180', ears: 'bigfluff', inner: '#e9c4c9', nose: 'koala', x: '' },
    '🐘': { b: '#a9b4c4', l: '#d4dce8', d: '#6c7a92', ears: 'elephant', inner: '#d9b8c0', nose: 'trunk', x: '' },

    '🐷': { b: '#ffb3c7', l: '#ffd6e0', d: '#d9768f', ears: 'pointy', inner: '#ff8fb1', nose: 'snout', x: '' },
    '🐭': { b: '#b8bdd1', l: '#e3e6f0', d: '#7a8099', ears: 'round', inner: '#ffb3c7', nose: 'pink', x: 'whiskers' },
    '🐻': { b: '#a86b3c', l: '#d9a06c', d: '#6b3f1e', ears: 'round', inner: '#e8b98f', nose: 'black', x: 'muzzle' },
    '🦁': { b: '#e0a040', l: '#ffd080', d: '#a86a14', ears: 'round', inner: '#f2c97a', nose: 'black', x: 'lion' },
    '🐢': { b: '#7fc26a', l: '#b8e8a3', d: '#4a8a3a', ears: 'none', inner: '#fff', nose: 'dots', x: 'turtle' },
    '🦜': { b: '#e63946', l: '#ff8a90', d: '#9c1f2a', ears: 'none', inner: '#fff', nose: 'hook', x: 'parrot' },
    '🦊': { b: '#ff8a3c', l: '#ffc89a', d: '#b8541a', ears: 'pointy', inner: '#fff', nose: 'black', x: 'muzzlew' },
    '🐸': { b: '#7fd25a', l: '#c6f5a8', d: '#3f8f2a', ears: 'none', inner: '#fff', nose: 'none', x: 'frog' },
    '🐑': { b: '#f2e6d6', l: '#fff', d: '#bfae9f', ears: 'side', inner: '#e9c4c9', nose: 'pink', x: 'wool' },
    '🐹': { b: '#f2c88a', l: '#ffe8c4', d: '#c48a46', ears: 'round', inner: '#ffb3c7', nose: 'pink', x: 'cheeks' }
  };
  function faceSVG(em) {
    var K = FACES[em], id = 'fa' + Math.abs(em.charCodeAt(0) * 31 + (em.charCodeAt(1) || 0)), s = '';
    s += '<svg class="face" viewBox="0 0 100 100" aria-hidden="true"><defs><radialGradient id="' + id + '" cx="38%" cy="30%" r="75%"><stop offset="0" stop-color="' + K.l + '"/><stop offset=".55" stop-color="' + K.b + '"/><stop offset="1" stop-color="' + K.d + '"/></radialGradient></defs>';
    var F = 'url(#' + id + ')', st = ' stroke="' + K.d + '" stroke-width="2.5" stroke-linejoin="round"';
    if (K.x === 'lion') { s += '<g fill="#b8651a">'; for (var i = 0; i < 12; i++) { var a = i * Math.PI / 6; s += '<circle cx="' + (50 + Math.cos(a) * 38) + '" cy="' + (50 + Math.sin(a) * 38) + '" r="13"/>'; } s += '</g>'; }
    if (K.x === 'wool') { s += '<g fill="#fff" stroke="#d9cdbf" stroke-width="2">'; for (var j = 0; j < 10; j++) { var aa = j * Math.PI / 5; s += '<circle cx="' + (50 + Math.cos(aa) * 36) + '" cy="' + (50 + Math.sin(aa) * 36) + '" r="13"/>'; } s += '</g>'; }
    if (K.x === 'turtle') s += '<path d="M12 70 Q 50 100 88 70 Q 88 92 50 98 Q 12 92 12 70 Z" fill="#8a6a3a" stroke="#5a4320" stroke-width="2"/>';
    if (K.x === 'parrot') s += '<path d="M44 20 Q 50 -4 56 18 M50 18 Q 62 -2 66 18 M38 22 Q 36 2 48 16" stroke="#2f95e8" stroke-width="6" fill="none" stroke-linecap="round"/><path d="M50 18 Q 62 -2 66 18" stroke="#ffd23f" stroke-width="4" fill="none" stroke-linecap="round"/>';
    if (K.ears === 'long') s += '<ellipse cx="36" cy="16" rx="10" ry="24" fill="' + F + '"' + st + ' transform="rotate(-8 36 16)"/><ellipse cx="64" cy="16" rx="10" ry="24" fill="' + F + '"' + st + ' transform="rotate(8 64 16)"/><ellipse cx="36" cy="18" rx="4.5" ry="16" fill="' + K.inner + '" transform="rotate(-8 36 16)"/><ellipse cx="64" cy="18" rx="4.5" ry="16" fill="' + K.inner + '" transform="rotate(8 64 16)"/>';
    if (K.ears === 'round') s += '<circle cx="22" cy="26" r="13" fill="' + (K.earc || F) + '"' + st + '/><circle cx="78" cy="26" r="13" fill="' + (K.earc || F) + '"' + st + '/><circle cx="22" cy="26" r="6.5" fill="' + K.inner + '"/><circle cx="78" cy="26" r="6.5" fill="' + K.inner + '"/>';
    if (K.ears === 'bigfluff') s += '<circle cx="18" cy="40" r="19" fill="' + F + '"' + st + '/><circle cx="82" cy="40" r="19" fill="' + F + '"' + st + '/><circle cx="18" cy="40" r="10" fill="' + K.inner + '"/><circle cx="82" cy="40" r="10" fill="' + K.inner + '"/>';

    clone.style.width = r.width + 'px'; clone.style.height = r.height + 'px'; clone.style.fontSize = getComputedStyle(f).fontSize;
    document.body.appendChild(clone);
    drag = { src: f, el: clone, id: ev.pointerId, over: null, home: { x: r.left + r.width / 2, y: r.top + r.height / 2 } };
    f.classList.add('ghost');
    move(ev);
    try { tray.setPointerCapture(ev.pointerId); } catch (e) {}
    KidsGame.sound.pop();
  });
  function move(ev) {
    if (!drag || ev.pointerId !== drag.id) return;
    var p = point(ev);
    drag.el.style.transform = 'translate(' + p.x + 'px,' + p.y + 'px) translate(-50%,-50%) scale(1.25)';
    var t = targetAt(p.x, p.y);
    if (t && t.classList.contains('fed')) t = null;
    if (t !== drag.over) { if (drag.over) drag.over.classList.remove('over'); drag.over = t; if (t) t.classList.add('over'); }

  }
  tray.addEventListener('pointermove', function (ev) { if (drag) { ev.preventDefault(); move(ev); } });

    closeMouths();
    var t = d.over, food = d.src.dataset.food;
    if (t && t._wants && t._wants[t._idx] === food) {
      d.el.remove(); d.src.classList.remove('ghost'); d.src.classList.add('gone');
      t._idx++; t._miss = 0; budget--; renderBudget();
      t.classList.remove('nam'); void t.offsetWidth; t.classList.add('nam');
      KidsGame.sound.ok(); KidsGame.addStar(); KidsGame.vibrate(40);
      hearts(t); KidsGame.fx.ring(t.querySelector('.medal')); KidsGame.fx.burstAt(t.querySelector('.medal'), { n: 12, chars: ['✨', '⭐', '🌟'] });
      var r = t.getBoundingClientRect(); KidsGame.fx.floatText(r.left + r.width / 2, r.top + 10, '+1 ¡Ñam!', 'good');
      streak++;
      if (streak === 3 || (streak > 3 && streak % 5 === 0)) setTimeout(function () { KidsGame.fx.floatText(r.left + r.width / 2, r.top - 40, '¡Racha x' + streak + '!'); }, 250);
      if (streak % 5 === 0) setTimeout(function () { KidsGame.addStar(); banner('⭐ ¡Bonus de racha!', true, 1100); KidsGame.sound.win(); }, 500);
      if (t._idx >= t._wants.length) {
        t.classList.add('fed'); t.querySelector('.hint').textContent = '😊'; fedCount++;
        renderWant(t);
        KidsGame.say('¡Ñam ñam!');
        if (fedCount === animals.length) setTimeout(finish, 900);
      } else { renderWant(t); KidsGame.say('¡Ñam! ¿Y ahora?'); }
    } else {
      if (t) streak = 0;
      if (t && t._no === food) {
        var np = t.querySelector('.nope'); if (np) { np.classList.remove('shake'); void np.offsetWidth; np.classList.add('shake'); }
        t.classList.remove('no'); void t.offsetWidth; t.classList.add('no');
        KidsGame.sound.wrong(); KidsGame.say('¡No! Eso no lo come'); KidsGame.toast('🚫 ¡Eso no lo come!', 1200);
      } else if (t) {
        t.classList.remove('no'); void t.offsetWidth; t.classList.add('no'); KidsGame.sound.wrong();
        if (menuHidden) { t._miss++; if (t._miss >= 2) { t._miss = 0; renderWant(t, true); (function (a) { setTimeout(function () { renderWant(a); }, 1200); })(t); } }
      }
      d.el.classList.add('back');
      d.el.style.transform = 'translate(' + d.home.x + 'px,' + d.home.y + 'px) translate(-50%,-50%) scale(1)';
      d.el.style.opacity = '0';
      (function (el, src) { setTimeout(function () { el.remove(); src.classList.remove('ghost'); }, 300); })(d.el, d.src);
    }
  }
  tray.addEventListener('pointerup', drop); tray.addEventListener('pointercancel', drop);

  function hearts(t) {
    var r = t.getBoundingClientRect();
    for (var i = 0; i < 5; i++) {
      var h = document.createElement('div'); h.className = 'heart emoji'; h.textContent = KidsGame.pick(['💕', '💖', '❤️', '💗']);
      h.style.left = (r.left + r.width * (0.2 + Math.random() * 0.6)) + 'px'; h.style.top = (r.top + r.height * 0.3) + 'px';
      h.style.animationDelay = (i * 0.12) + 's';
      document.body.appendChild(h);
      (function (el) { setTimeout(function () { el.remove(); }, 1800); })(h);
    }
  }
  function finish() {
    clearTimeout(memoTimer);
    KidsGame.levelDone(nivel); syncDeco();
    banner('🎉 ¡Todos comieron!', true, 1200);
    setTimeout(function () {
      KidsGame.celebrate({
        sub: '¡Todos comieron! ' + animals.map(function (p) { return p[0]; }).join(' '),
        onNext: function () { round++; game.classList.add('sw'); setTimeout(newRound, 320); },
        onAgain: function () { game.classList.add('sw'); setTimeout(newRound, 320); }
      });
    }, 500);
  }

  window.addEventListener('resize', layout);
  // Estado y acciones para pruebas
  window.__alimenta = function () { return { nivel: nivel, round: round, hidden: menuHidden, budget: budget, hints: hintLeft, streak: streak,
    animals: Array.prototype.map.call(animalsEl.children, function (a) { return { face: a.dataset.animal, wants: a._wants, idx: a._idx, no: a._no, fed: a.classList.contains('fed'), mouth: a._t }; }),
    tray: Array.prototype.map.call(tray.children, function (f) { return { food: f.dataset.food, gone: f.classList.contains('gone') }; }) }; };
  window.__alimentaDrop = function (food, idx) {
    var f = tray.querySelector('.food[data-food="' + food + '"]:not(.gone)'), a = animalsEl.children[idx]; if (!f || !a) return null;
    var fr = f.getBoundingClientRect(), ar = a.getBoundingClientRect();
    function ev(t, x, y) { return new PointerEvent(t, { bubbles: true, pointerId: 11, clientX: x, clientY: y, pointerType: 'touch', isPrimary: true }); }
    f.dispatchEvent(ev('pointerdown', fr.left + fr.width / 2, fr.top + fr.height / 2));
    var tx = ar.left + ar.width / 2, ty = ar.top + ar.height * 0.45;
    f.dispatchEvent(ev('pointermove', (fr.left + tx) / 2, (fr.top + ty) / 2)); f.dispatchEvent(ev('pointermove', tx, ty));
    var open = a._t; f.dispatchEvent(ev('pointerup', tx, ty));
    return { fed: a.classList.contains('fed'), idx: a._idx, mouth: open };
  };
  showPicker();
})();
