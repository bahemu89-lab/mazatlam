<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<link rel="stylesheet" href="../common.css">
<title>Alimenta</title>
<style>
  .game { display: flex; flex-direction: column; padding: 8px; gap: 8px; touch-action: none; }
  .hud { flex: 0 0 auto; display: flex; align-items: center; justify-content: center; gap: 10px; font-size: 22px; }
  .hud .lvl {
    background: linear-gradient(180deg, #ffffff, #eef3ff); border-radius: 30px; padding: 6px 18px; border: 3px solid #fff; font-weight: 900; color: #1f2f6b;
    box-shadow: 0 5px 0 #c9d2e6, 0 10px 16px rgba(20,40,90,.22), inset 0 2px 0 #fff;
  }
  .hud .lvbtn { width: 56px; height: 56px; min-width: 56px; min-height: 56px; padding: 0; font-size: 26px; border-radius: 50%; pointer-events: auto; }
  .hud .dish { font-size: 30px; }
  .animals { flex: 1 1 0; min-height: 0; display: flex; flex-wrap: wrap; align-items: center; justify-content: center; align-content: center; gap: 14px; }
  /* Tarjeta-medallón del animal: relieve, brillo y sombra en el suelo */
  .animal {
    position: relative; width: var(--as); height: var(--as); flex-direction: column; gap: 0; border-radius: 28px;
    background: linear-gradient(160deg, #ffffff 0%, #f3f6fc 60%, #e6ebf7 100%);
    transition: transform .18s, background .25s, box-shadow .25s;
  }
  .animal .gs { position: absolute; left: 10%; right: 10%; bottom: -22px; height: 26px; border-radius: 50%; pointer-events: none;
    background: radial-gradient(ellipse at 50% 50%, rgba(0,0,0,.28), rgba(0,0,0,0) 70%); }
  .animal .medal {
    position: relative; z-index: 1; display: flex; align-items: center; justify-content: center;
    width: calc(var(--as) * .62); height: calc(var(--as) * .62); border-radius: 50%; margin-top: calc(var(--as) * .06);
    background: radial-gradient(circle at 35% 28%, #ffffff 0, #fff2c2 40%, #ffd166 78%, #f2a900 100%);
    box-shadow: 0 6px 0 #d18f00, 0 12px 16px rgba(0,0,0,.22), inset 0 3px 0 rgba(255,255,255,.9), 0 0 0 4px #fff, 0 0 0 7px rgba(255,209,102,.5);
  }
  .animal .medal::after { content: ""; position: absolute; left: 14%; right: 14%; top: 6%; height: 34%; border-radius: 50%; pointer-events: none;
    background: linear-gradient(180deg, rgba(255,255,255,.85), rgba(255,255,255,0)); }
  .animal .face { font-size: calc(var(--as) * .4); position: relative; z-index: 1; }
  .animal:not(.fed) .medal { animation: breathe 2.6s ease-in-out infinite; }
  .animal:nth-child(2) .medal { animation-delay: -.7s; } .animal:nth-child(3) .medal { animation-delay: -1.4s; }
  .animal:nth-child(4) .medal { animation-delay: -2.1s; } .animal:nth-child(5) .medal { animation-delay: -.35s; }
  @keyframes breathe { 0%,100%{transform:scale(1,1) translateY(0)} 50%{transform:scale(1.04,.97) translateY(2px)} }
  .animal .hint { font-size: calc(var(--as) * .2); position: relative; z-index: 1; margin-top: calc(var(--as) * .03); }
  /* Burbuja de "quiero..." con brillo y colita */
  .animal .want {
    position: absolute; top: -10px; right: -10px; z-index: 3; display: flex; align-items: center; justify-content: center; gap: 4px;
    min-width: calc(var(--as) * .34); height: calc(var(--as) * .34); padding: 0 6px; border-radius: 40px;
    background: linear-gradient(180deg, #ffffff 0%, #fff4c9 100%); border: 3px solid #ffb703;
    box-shadow: 0 4px 0 #d9a520, 0 8px 12px rgba(0,0,0,.2), inset 0 2px 0 #fff;
    font-size: calc(var(--as) * .2); animation: wantbob 2s ease-in-out infinite;
  }
  .animal .want::after { content: ""; position: absolute; left: 10px; bottom: -12px; width: 12px; height: 12px; border-radius: 50%;
    background: #fff4c9; border: 3px solid #ffb703; box-shadow: -6px 8px 0 -3px #fff4c9, -6px 8px 0 0 #ffb703; }
  @keyframes wantbob { 0%,100%{transform:translateY(0) rotate(0)} 50%{transform:translateY(-4px) rotate(3deg)} }
  .animal .want .w { position: relative; transition: transform .25s, opacity .25s; }
  .animal .want .w.done { opacity: .35; filter: grayscale(.8); transform: scale(.75); }
  .animal .want .w.done::after { content: "✔"; position: absolute; right: -6px; top: -8px; font-size: 55%; color: #2cb67d; filter: none; }
  .animal .want .w.now { transform: scale(1.15); }
  .animal .want .sep { font-size: 60%; color: #b48200; }
  .animal.two .want { top: -22px; right: -6px; font-size: calc(var(--as) * .17); height: calc(var(--as) * .3); }
  .animal.two .medal { margin-top: calc(var(--as) * .13); width: calc(var(--as) * .56); height: calc(var(--as) * .56); }
  .animal.two .face { font-size: calc(var(--as) * .36); }
  .animal.over { transform: scale(1.1); background: linear-gradient(160deg, #fffdf1, #fff2bd); box-shadow: 0 6px 0 #d9a520, 0 14px 24px rgba(0,0,0,.25), 0 0 0 6px rgba(255,209,102,.6), inset 0 2px 0 #fff; }
  .animal.fed { background: linear-gradient(160deg, #eefff0, #b9f0c4); border-color: #6fdc8c; box-shadow: 0 6px 0 #3fa864, 0 12px 20px rgba(20,120,60,.28), 0 0 0 5px rgba(111,220,140,.5), inset 0 2px 0 #fff; }
  .animal.fed .medal { background: radial-gradient(circle at 35% 28%, #ffffff 0, #dfffe6 40%, #8ee6a5 78%, #2cb67d 100%); box-shadow: 0 6px 0 #1c8a53, 0 12px 16px rgba(0,0,0,.22), inset 0 3px 0 rgba(255,255,255,.9), 0 0 0 4px #fff; }
  .animal.fed .want { display: none; }
  .animal .ok { display: none; position: absolute; top: -12px; right: -12px; z-index: 3; width: calc(var(--as) * .3); height: calc(var(--as) * .3); border-radius: 50%;
    align-items: center; justify-content: center; font-size: calc(var(--as) * .16); color: #fff;
    background: radial-gradient(circle at 35% 28%, #a8f0c0, #2cb67d 70%); box-shadow: 0 4px 0 #1c8a53, 0 8px 12px rgba(0,0,0,.25), inset 0 2px 0 rgba(255,255,255,.7), 0 0 0 4px #fff; }
  .animal.fed .ok { display: flex; animation: pop .45s ease-out; }
  .animal.nam .face { animation: nam .7s ease-out; }
  .animal.no { animation: nono .5s ease-in-out; }
  @keyframes nam { 0%{transform:scale(1)} 30%{transform:scale(1.35,1.2) rotate(-8deg)} 60%{transform:scale(1.2,1.3) rotate(8deg)} 100%{transform:scale(1)} }
  @keyframes nono { 0%,100%{transform:rotate(0)} 20%{transform:rotate(-14deg)} 40%{transform:rotate(12deg)} 60%{transform:rotate(-10deg)} 80%{transform:rotate(8deg)} }
  /* Bandeja de madera tipo picnic con veta, borde claro y grosor */
  .tray {
    position: relative; flex: 0 0 auto; display: flex; flex-wrap: wrap; justify-content: center; align-items: center; align-content: center; gap: 12px;
    padding: 12px 14px; min-height: calc(var(--fs) + 28px); border-radius: 26px; border: 4px solid #efcf8f;
    background:
      repeating-linear-gradient(90deg, rgba(255,255,255,.07) 0 5px, rgba(0,0,0,0) 5px 9px, rgba(60,30,0,.07) 9px 14px, rgba(0,0,0,0) 14px 22px),
      linear-gradient(180deg, #e0ab66 0%, #c68542 55%, #a6652c 100%);
    box-shadow: 0 9px 0 #7a4418, 0 18px 26px rgba(0,0,0,.32), inset 0 5px 12px rgba(60,30,0,.35), inset 0 -2px 0 rgba(255,255,255,.25);
  }
  .tray::before { content: ""; position: absolute; left: 6px; right: 6px; top: 4px; height: 18px; border-radius: 20px; pointer-events: none;
    background: linear-gradient(180deg, rgba(255,255,255,.28), rgba(255,255,255,0)); }
  /* Cada comida sobre un platito brillante */
  .food {
    width: var(--fs); height: var(--fs); font-size: calc(var(--fs) * .58); border-radius: 50%; border: 0;
    background: radial-gradient(circle at 50% 42%, #ffffff 0 52%, #e9eef7 53% 66%, #ffffff 67% 100%);
    box-shadow: 0 5px 0 #b9c3d8, 0 10px 14px rgba(0,0,0,.35), inset 0 -3px 0 rgba(0,0,0,.05), inset 0 2px 0 #fff;
    display: flex; align-items: center; justify-content: center; touch-action: none; transition: transform .12s;
  }
  .food::after { top: 6%; left: 18%; right: 18%; height: 30%; border-radius: 50%; }
  .food:active { transform: scale(1.08); }
  .food.ghost { opacity: .3; }
  .food.gone { display: none; }
  .drag { position: fixed; left: 0; top: 0; z-index: 30; pointer-events: none; transform: translate(-50%, -50%) scale(1.25); box-shadow: 0 14px 0 rgba(0,0,0,.08), 0 26px 30px rgba(0,0,0,.4); }
  .drag.back { transition: transform .3s ease-in, opacity .3s; }
  .heart { position: fixed; z-index: 35; pointer-events: none; font-size: 34px; animation: heart 1.1s ease-out forwards; }
  @keyframes heart { 0%{transform:translate(-50%,0) scale(.6);opacity:1} 100%{transform:translate(-50%,-150px) scale(1.4) rotate(15deg);opacity:0} }
  .spark { position: fixed; left: 0; top: 0; z-index: 36; pointer-events: none; font-size: 24px; animation: sparkfly .9s ease-out forwards; }
  @keyframes sparkfly { 0%{transform:translate(-50%,-50%) scale(.4);opacity:1} 100%{transform:translate(calc(-50% + var(--dx)), calc(-50% + var(--dy))) scale(1.3) rotate(180deg);opacity:0} }
  @media (orientation: landscape) {
    .game { flex-direction: row; }
    .hud { position: absolute; left: 0; right: 0; top: 4px; z-index: 2; pointer-events: none; }
    .animals { padding-top: 44px; }
    .tray { flex-direction: column; flex-wrap: wrap; max-height: 100%; min-width: calc(var(--fs) + 32px); min-height: 0; padding: 12px;
      background:
        repeating-linear-gradient(180deg, rgba(255,255,255,.07) 0 5px, rgba(0,0,0,0) 5px 9px, rgba(60,30,0,.07) 9px 14px, rgba(0,0,0,0) 14px 22px),
        linear-gradient(90deg, #e0ab66 0%, #c68542 55%, #a6652c 100%); }
  }
</style>
</head>
<body>
<script src="../common.js"></script>
<script>
var game = KidsGame.init({ title: 'Alimenta' });
(function () {
  // [animal, comida favorita, segunda comida]
  var PAIRS = [
    ['🐰', '🥕', '🥬'], ['🐵', '🍌', '🍑'], ['🐱', '🐟', '🥛'], ['🐶', '🦴', '🍖'], ['🐼', '🎋', '🍃'], ['🐨', '🌿', '🍀'],
    ['🐘', '🥜', '🍉'], ['🐿️', '🌰', '🍇'], ['🐝', '🌸', '🌻'], ['🐮', '🌾', '🍎'], ['🐧', '🐠', '🦐'], ['🦒', '🌳', '🍋'],
    ['🐷', '🌽', '🍅'], ['🐭', '🧀', '🍪'], ['🐻', '🍯', '🫐'], ['🦁', '🥩', '🍗'], ['🐢', '🥦', '🍓'], ['🦜', '🍊', '🍒']
  ];
  // Comidas parecidas (distractores del nivel 3)
  var SIMILAR = { '🍊': '🍋', '🍋': '🍊', '🥕': '🌶️', '🍎': '🍅', '🍅': '🍎', '🍇': '🫐', '🫐': '🍇', '🍓': '🍒', '🍒': '🍓', '🥜': '🌰', '🌰': '🥜',
    '🐟': '🐠', '🐠': '🐟', '🌿': '🍀', '🍀': '🌿', '🍃': '🌿', '🍌': '🌽', '🌽': '🍌', '🦴': '🍖', '🍖': '🥩', '🥩': '🍖', '🍗': '🍖', '🧀': '🍕', '🍯': '🥞',
    '🥬': '🥦', '🥦': '🥬', '🌸': '🌼', '🌻': '🌼', '🎋': '🎍', '🌾': '🌱', '🌳': '🌲', '🥛': '🍶', '🍑': '🍊', '🍉': '🍈', '🦐': '🦀', '🍪': '🍩', '🥕': '🌶️' };
  var nivel = 1, round = 0, animals = [], foods = [], fedCount = 0;
  var hud, lvlEl, animalsEl, tray, badgeEl;

  game.innerHTML = '';
  hud = document.createElement('div'); hud.className = 'hud';
  hud.innerHTML = '<span class="lvl">Ronda <b>1</b></span><span class="dish emoji">🍽️</span><button class="btn yellow lvbtn" aria-label="Nivel">🎚️</button>';
  lvlEl = hud.querySelector('b');
  badgeEl = KidsGame.levelBadge(nivel); hud.insertBefore(badgeEl, hud.firstChild);
  animalsEl = document.createElement('div'); animalsEl.className = 'animals';
  tray = document.createElement('div'); tray.className = 'tray';
  game.appendChild(hud); game.appendChild(animalsEl); game.appendChild(tray);
  hud.querySelector('.lvbtn').addEventListener('pointerdown', function (ev) { ev.preventDefault(); KidsGame.sound.tap(); showPicker(); });

  function showPicker() {
    animalsEl.innerHTML = ''; tray.innerHTML = ''; animals = []; foods = [];
    KidsGame.levelPicker({ key: 'alimenta', onPick: function (n) {
      nivel = n; round = 0;
      var nb = KidsGame.levelBadge(nivel); hud.replaceChild(nb, badgeEl); badgeEl = nb;
      newRound();
    } });
  }

  function newRound() {
    // Nivel 1: 2 animales, 1 distractor. Nivel 2: 3-4 animales, 2 distractores.
    // Nivel 3: 4-5 animales, cada uno quiere DOS comidas en orden, 3 distractores parecidos.
    var n = nivel === 1 ? 2 : nivel === 2 ? Math.min(3 + Math.floor(round / 2), 4) : Math.min(4 + Math.floor(round / 2), 5);
    var nd = nivel, two = nivel === 3;
    var pool = KidsGame.shuffle(PAIRS), chosen = [], usedFood = {}, i;
    for (i = 0; i < pool.length && chosen.length < n; i++) {
      var p = pool[i];
      if (usedFood[p[1]] || (two && usedFood[p[2]])) continue;
      usedFood[p[1]] = true; if (two) usedFood[p[2]] = true; chosen.push(p);
    }
    var distract = [];
    if (two) {
      var wanted = KidsGame.shuffle([].concat.apply([], chosen.map(function (p) { return [p[1], p[2]]; })));
      for (i = 0; i < wanted.length && distract.length < nd; i++) { var sm = SIMILAR[wanted[i]]; if (sm && !usedFood[sm]) { usedFood[sm] = true; distract.push(sm); } }
    }
    for (i = 0; i < pool.length && distract.length < nd; i++) {
      if (usedFood[pool[i][1]]) continue;
      usedFood[pool[i][1]] = true; distract.push(pool[i][1]);
    }
    animals = chosen; fedCount = 0;
    foods = KidsGame.shuffle([].concat.apply([], chosen.map(function (p) { return two ? [p[1], p[2]] : [p[1]]; })).concat(distract));
    lvlEl.textContent = String(round + 1);
    animalsEl.innerHTML = ''; tray.innerHTML = '';
    chosen.forEach(function (p, idx) {
      var a = document.createElement('div');
      a.className = 'animal card pop' + (two ? ' two' : ''); a.dataset.food = p[1];
      a._wants = two ? [p[1], p[2]] : [p[1]]; a._idx = 0;
      a.style.animationDelay = (idx * 0.08) + 's';
      a.innerHTML = '<i class="gs"></i><span class="medal"><span class="face emoji">' + p[0] + '</span></span><span class="hint emoji">😋</span><span class="want"></span><span class="ok">✔</span>';
      renderWant(a);
      animalsEl.appendChild(a);
    });
    foods.forEach(function (f, idx) {
      var d = document.createElement('div');
      d.className = 'food card pop'; d.dataset.food = f;
      d.style.animationDelay = (0.3 + idx * 0.06) + 's';
      d.innerHTML = '<span class="emoji">' + f + '</span>';
      tray.appendChild(d);
    });
    layout();
    KidsGame.say(two ? 'Cada animalito quiere dos comidas, en orden' : '¿Qué quiere comer cada animalito?');
  }
  function renderWant(a) {
    var w = a.querySelector('.want'), html = '';
    a._wants.forEach(function (f, i) {
      if (i) html += '<span class="sep">➜</span>';
      html += '<span class="w emoji' + (i < a._idx ? ' done' : i === a._idx ? ' now' : '') + '">' + f + '</span>';
    });
    w.innerHTML = html;
  }

  function layout() {
    var land = window.innerWidth > window.innerHeight;
    var W = game.clientWidth - 16, H = game.clientHeight - 16;
    var n = animals.length, nf = Math.max(1, foods.length), fs, trayCols = 1, trayRows = 1, aw, ah;
    if (land) {
      var avH = H - 28; fs = Math.max(72, Math.min(120, Math.floor(avH / nf) - 12));
      trayCols = Math.max(1, Math.ceil(nf * (fs + 12) / avH));
      aw = W - trayCols * (fs + 12) - 44; ah = H - 44;
    } else {
      var avW = W - 32; fs = Math.max(72, Math.min(120, Math.floor(avW / nf) - 14));
      trayRows = Math.max(1, Math.ceil(nf * (fs + 12) / avW));
      aw = W; ah = H - trayRows * (fs + 12) - 32 - hud.offsetHeight - 16;
    }
    var cols = n <= 2 ? n : n <= 4 ? 2 : 3, rows = Math.ceil(n / cols);
    if (land && n === 3) { cols = 3; rows = 1; }
    if (land && n === 4) { cols = 4; rows = 1; var as4 = Math.min((aw - 14 * 3) / 4, ah); if (as4 < 150) { cols = 2; rows = 2; } }
    if (land && n === 5) { cols = 3; rows = 2; }
    var as = Math.floor(Math.min((aw - 14 * (cols - 1)) / cols, (ah - 22 * rows) / rows, 260));
    game.style.setProperty('--as', Math.max(100, as) + 'px');
    game.style.setProperty('--fs', fs + 'px');
  }

  // --- Arrastrar comida ---
  var drag = null;
  function point(ev) { return { x: ev.clientX, y: ev.clientY }; }
  function targetAt(x, y) {
    var el = document.elementFromPoint(x, y);
    while (el && el !== document.body) { if (el.classList && el.classList.contains('animal')) return el; el = el.parentNode; }
    return null;
  }
  tray.addEventListener('pointerdown', function (ev) {
    var f = ev.target.closest ? ev.target.closest('.food') : null;
    if (!f || drag || f.classList.contains('gone')) return;
    ev.preventDefault();
    var clone = f.cloneNode(true); clone.className = 'food drag';
    var r = f.getBoundingClientRect();
    clone.style.width = r.width + 'px'; clone.style.height = r.height + 'px'; clone.style.fontSize = getComputedStyle(f).fontSize;
    document.body.appendChild(clone);
    drag = { src: f, el: clone, id: ev.pointerId, over: null, home: { x: r.left + r.width / 2, y: r.top + r.height / 2 } };
    f.classList.add('ghost');
    move(ev);
    try { tray.setPointerCapture(ev.pointerId); } catch (e) {}
    KidsGame.sound.pop();
  });
  function move(ev) {
    if (!drag || ev.pointerId !== drag.id) return;
    var p = point(ev);
    drag.el.style.transform = 'translate(' + p.x + 'px,' + p.y + 'px) translate(-50%,-50%) scale(1.25)';
    var t = targetAt(p.x, p.y);
    if (t && t.classList.contains('fed')) t = null;
    if (t !== drag.over) { if (drag.over) drag.over.classList.remove('over'); drag.over = t; if (t) t.classList.add('over'); }
  }
  tray.addEventListener('pointermove', function (ev) { if (drag) { ev.preventDefault(); move(ev); } });
  function drop(ev) {
    if (!drag || ev.pointerId !== drag.id) return;
    var d = drag; drag = null;
    if (d.over) d.over.classList.remove('over');
    var t = d.over;
    if (t && t._wants && t._wants[t._idx] === d.src.dataset.food) {
      // ¡Ñam ñam!
      d.el.remove(); d.src.classList.remove('ghost'); d.src.classList.add('gone');
      t._idx++;
      t.classList.remove('nam'); void t.offsetWidth; t.classList.add('nam');
      KidsGame.sound.ok(); KidsGame.addStar(); KidsGame.vibrate(40);
      hearts(t); sparkles(t);
      if (t._idx >= t._wants.length) {
        t.classList.add('fed'); t.querySelector('.hint').textContent = '😊'; fedCount++;
        KidsGame.say('¡Ñam ñam!');
        if (fedCount === animals.length) setTimeout(finish, 900);
      } else { renderWant(t); KidsGame.say('¡Ñam! ¿Y ahora?'); }
    } else {
      if (t) { t.classList.remove('no'); void t.offsetWidth; t.classList.add('no'); KidsGame.sound.wrong(); }
      // La comida regresa a la bandeja
      d.el.classList.add('back');
      d.el.style.transform = 'translate(' + d.home.x + 'px,' + d.home.y + 'px) translate(-50%,-50%) scale(1)';
      d.el.style.opacity = '0';
      (function (el, src) { setTimeout(function () { el.remove(); src.classList.remove('ghost'); }, 300); })(d.el, d.src);
    }
  }
  tray.addEventListener('pointerup', drop); tray.addEventListener('pointercancel', drop);

  function hearts(t) {
    var r = t.getBoundingClientRect();
    for (var i = 0; i < 5; i++) {
      var h = document.createElement('div'); h.className = 'heart emoji'; h.textContent = KidsGame.pick(['💕', '💖', '❤️', '💗']);
      h.style.left = (r.left + r.width * (0.2 + Math.random() * 0.6)) + 'px'; h.style.top = (r.top + r.height * 0.3) + 'px';
      h.style.animationDelay = (i * 0.12) + 's';
      document.body.appendChild(h);
      (function (el) { setTimeout(function () { el.remove(); }, 1800); })(h);
    }
  }
  function sparkles(t) {
    var r = t.getBoundingClientRect(), cx = r.left + r.width / 2, cy = r.top + r.height * .4;
    for (var i = 0; i < 12; i++) {
      var d = document.createElement('div'); d.className = 'spark emoji'; d.textContent = KidsGame.pick(['✨', '⭐', '🌟']);
      var a = Math.random() * Math.PI * 2, dist = 50 + Math.random() * 70;
      d.style.left = cx + 'px'; d.style.top = cy + 'px';
      d.style.setProperty('--dx', Math.cos(a) * dist + 'px'); d.style.setProperty('--dy', Math.sin(a) * dist - 20 + 'px');
      d.style.animationDelay = (Math.random() * .2) + 's';
      document.body.appendChild(d);
      (function (el) { setTimeout(function () { el.remove(); }, 1300); })(d);
    }
  }
  function finish() {
    KidsGame.celebrate({
      sub: '¡Todos comieron! ' + animals.map(function (p) { return p[0]; }).join(' '),
      onNext: function () { round++; newRound(); },
      onAgain: function () { newRound(); }
    });
  }

  window.addEventListener('resize', layout);
  showPicker();
})();
</script>
</body>
</html>
