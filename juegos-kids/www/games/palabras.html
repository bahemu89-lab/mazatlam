<!DOCTYPE html>
<html lang="es">

<title>Forma la palabra</title>
<style>
  /* Mundo: "El tren de las palabras" — cielo, colinas lejanas, pradera y vías */
  .game {
    background:
      radial-gradient(ellipse 34% 22% at 18% 58%, #8fd37a 0 60%, rgba(0,0,0,0) 61%),

  }
  .game::before { content: ""; position: absolute; left: 0; right: 0; top: 56%; bottom: 0; pointer-events: none; opacity: .9;
    background: radial-gradient(circle at 12% 30%, #ffd166 0 6px, rgba(0,0,0,0) 7px), radial-gradient(circle at 30% 70%, #ff8aa8 0 5px, rgba(0,0,0,0) 6px), radial-gradient(circle at 64% 40%, #fff 0 5px, rgba(0,0,0,0) 6px), radial-gradient(circle at 88% 75%, #ffd166 0 6px, rgba(0,0,0,0) 7px), radial-gradient(circle at 50% 85%, #ff8aa8 0 5px, rgba(0,0,0,0) 6px); }
  .cloud { position: absolute; z-index: 0; pointer-events: none; width: 140px; height: 46px; border-radius: 40px; background: #fff; opacity: .9; box-shadow: 0 6px 10px rgba(0,60,120,.08); animation: drift 40s linear infinite; }
  .cloud::before { content: ""; position: absolute; left: 24px; top: -24px; width: 60px; height: 60px; border-radius: 50%; background: #fff; }
  .cloud::after { content: ""; position: absolute; left: 66px; top: -16px; width: 48px; height: 48px; border-radius: 50%; background: #fff; }
  @keyframes drift { from { transform: translateX(-200px); } to { transform: translateX(110vw); } }
  .screen { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 6px 8px; gap: min(1.6vh, 12px); z-index: 1; }
  .top.jk-in { animation-duration: .5s; }
  .hud { position: absolute; top: 8px; left: 8px; z-index: 3; display: flex; align-items: center; gap: 8px; }
  .hud .btn { font-size: 28px; }
  .tools { position: absolute; top: 8px; right: 8px; z-index: 3; display: flex; gap: 8px; }
  .tools .btn { font-size: 30px; }
  .prog { position: absolute; top: 80px; right: 12px; z-index: 3; display: flex; gap: 5px; flex-direction: column; align-items: flex-end; }
  .dots { display: flex; gap: 5px; }
  .dot { width: 14px; height: 14px; border-radius: 50%; background: linear-gradient(180deg, #fff, #d9dff0); box-shadow: 0 2px 0 #b9c2d9, inset 0 1px 0 #fff; }
  .dot.on { background: radial-gradient(circle at 35% 30%, #fff, #ffd166 40%, #f5a623); box-shadow: 0 2px 0 #c97d0b, 0 0 8px rgba(255,200,80,.8); }
  .count { font-size: 18px; font-weight: 900; color: #7a4b00; background: linear-gradient(180deg, #fff7d6, #ffe08a); padding: 3px 12px; border-radius: 20px; box-shadow: 0 3px 0 #d9a520, inset 0 1px 0 #fff; }
  @media (max-width: 820px) { .prog { top: 8px; right: 50%; transform: translateX(50%); flex-direction: column-reverse; } }

  .top { display: flex; align-items: center; justify-content: center; gap: min(4vw, 36px); flex: 0 0 auto; margin-top: min(6vh, 50px); }
  .medal {
    position: relative; width: min(22vh, 30vw, 170px); height: min(22vh, 30vw, 170px); border-radius: 50%; flex: 0 0 auto;
    display: flex; align-items: center; justify-content: center; cursor: pointer;
    background: radial-gradient(circle at 35% 28%, #ffffff 0%, #fff6d0 32%, #ffd166 70%, #f5a623 100%);
    box-shadow: 0 10px 0 #c97d0b, 0 18px 28px rgba(90,50,0,.3), inset 0 4px 0 rgba(255,255,255,.9), inset 0 -8px 0 rgba(180,110,0,.25), 0 0 0 7px #fff, 0 0 0 11px rgba(255,209,102,.6);
    animation: float 3.6s ease-in-out infinite;
  }
  .medal::before { content: ""; position: absolute; left: 12%; right: 12%; top: 6%; height: 34%; border-radius: 50%; background: linear-gradient(180deg, rgba(255,255,255,.85), rgba(255,255,255,0)); pointer-events: none; }
  .pic { font-size: min(14vh, 19vw, 108px); filter: drop-shadow(0 8px 6px rgba(90,50,0,.35)); }
  .model { display: flex; flex-direction: column; align-items: center; gap: 6px; min-width: min(40vw, 300px); }
  .word { font-size: min(8vh, 9vw, 58px); font-weight: 900; letter-spacing: 3px; white-space: nowrap; color: #fff; text-shadow: 0 3px 0 #1f7fae, 0 6px 10px rgba(0,0,0,.3), -2px -2px 0 #1f7fae, 2px -2px 0 #1f7fae, -2px 2px 0 #1f7fae, 2px 2px 0 #1f7fae; transition: opacity .4s; }
  .word.hidden { opacity: 0; }
  .word.syll { letter-spacing: 1px; font-size: min(6vh, 7vw, 44px); }
  .timer { height: 12px; width: min(40vw, 260px); border-radius: 8px; background: rgba(0,0,0,.15); box-shadow: inset 0 2px 3px rgba(0,0,0,.25); overflow: hidden; }
  .timer i { display: block; height: 100%; width: 100%; border-radius: 8px; background: linear-gradient(180deg, #8ef0b0, #24b36c); box-shadow: inset 0 2px 0 rgba(255,255,255,.6); transform-origin: left; }
  .timer i.run { animation: shrink 3s linear forwards; }
  @keyframes shrink { to { transform: scaleX(0); } }
  .eye { font-size: min(6vh, 40px); filter: drop-shadow(0 4px 4px rgba(0,0,0,.25)); }
  .tip { font-size: min(3.2vh, 22px); color: #6b3f00; font-weight: 900; text-shadow: 0 1px 0 #fff; text-align: center; }

  /* Tren: vagones (casillas) + locomotora sobre las vías */
  .trainwrap { position: relative; width: 100%; display: flex; justify-content: center; padding: 6px 0 22px; flex: 0 0 auto; }
  .rails { position: absolute; left: -4%; right: -4%; bottom: 6px; height: 20px; pointer-events: none;
    background: linear-gradient(180deg, rgba(0,0,0,0) 0 4px, #8a94a6 4px 8px, rgba(0,0,0,0) 8px 12px, #8a94a6 12px 16px, rgba(0,0,0,0) 16px),
      repeating-linear-gradient(90deg, #8b5222 0 16px, rgba(0,0,0,0) 16px 40px); box-shadow: 0 2px 0 rgba(0,0,0,.12); }
  .train { display: flex; align-items: flex-end; gap: 6px; position: relative; z-index: 1; }
  .train.go { animation: trainGo 1.7s ease-in forwards; }
  .train.in { animation: trainIn .8s cubic-bezier(.2,.8,.3,1.05) both; }
  @keyframes trainGo { 0% { transform: translateX(0); } 12% { transform: translateX(-12px); } 100% { transform: translateX(140vw); } }
  @keyframes trainIn { from { transform: translateX(-130vw); } to { transform: translateX(0); } }
  .train.go .wh, .train.in .wh { animation: wspin .5s linear infinite; }
  .wh { transform-box: fill-box; transform-origin: center; }
  @keyframes wspin { to { transform: rotate(360deg); } }
  .loco { flex: 0 0 auto; width: calc(var(--s, 86px) * 1.55); margin-left: 4px; margin-bottom: -4px; filter: drop-shadow(0 6px 6px rgba(0,0,0,.25)); cursor: pointer; position: relative; }
  .loco svg { width: 100%; height: auto; display: block; overflow: visible; }
  .puff { position: absolute; width: 26px; height: 26px; border-radius: 50%; background: radial-gradient(circle at 35% 30%, #fff, #dfe7f2); pointer-events: none; opacity: 0; animation: puff 1.3s ease-out forwards; }
  @keyframes puff { 0% { transform: translate(0,0) scale(.4); opacity: .95; } 100% { transform: translate(-50px,-90px) scale(2.4); opacity: 0; } }
  .slots { display: flex; gap: min(1.2vw, 8px); justify-content: center; flex-wrap: wrap; flex: 0 0 auto; max-width: 78vw; padding: 0 0 14px; }
  .slot {
    --s: min(11vw, 11vh, 86px);
    width: var(--s); height: var(--s); border-radius: 14px 14px 10px 10px; display: flex; align-items: center; justify-content: center; position: relative;
    font-size: calc(var(--s) * .6); font-weight: 900; color: #7a4b00; line-height: 1;
    background: linear-gradient(180deg, #fff8e6, #f1dcb6); border: 4px dashed rgba(122,75,0,.4);
    box-shadow: inset 0 4px 10px rgba(0,0,0,.1), 0 4px 0 #b8863a;
    transition: transform .12s, background .2s, border-color .2s;
  }
  .slot::before, .slot::after { content: ""; position: absolute; bottom: -16px; width: 24px; height: 24px; border-radius: 50%; z-index: -1;
    background: radial-gradient(circle at 35% 30%, #9aa5b8, #2b3445 62%); box-shadow: inset 0 0 0 3px #141a26, 0 2px 2px rgba(0,0,0,.3); }
  .slot::before { left: 12%; } .slot::after { right: 12%; }
  .slot.syl { --s: min(13vw, 11vh, 92px); width: auto; min-width: var(--s); padding: 0 10px; font-size: calc(var(--s) * .5); }
  .slots.long .slot { --s: min(8.6vw, 9vh, 70px); }
  .slots.long .slot.syl { --s: min(10vw, 10vh, 76px); }
  .slot.hot { border-color: #ffb703; background: linear-gradient(180deg, #fff7d6, #ffe6a8); transform: scale(1.08); }
  .slot.full { border-style: solid; border-color: #fff; color: #fff; background: linear-gradient(135deg, var(--a, #bfe6ff), var(--b, #3da9fc) 55%, var(--d, #1a63a8) 130%);
    box-shadow: 0 6px 0 var(--d, #1a63a8), 0 10px 16px rgba(20,40,90,.28), inset 0 3px 0 rgba(255,255,255,.7), inset 0 -4px 0 rgba(0,0,0,.15); text-shadow: 0 3px 0 var(--d, #1a63a8), 0 5px 8px rgba(0,0,0,.3); cursor: pointer; }
  .slot.good { --a: #c6ffd9; --b: #2fd27a; --d: #148a4d; animation: flash .6s; }
  .slot.cursor { border-color: #ffb703; animation: blinkb 1s infinite; }
  @keyframes blinkb { 0%,100% { transform: scale(1); } 50% { transform: scale(1.06); } }
  @keyframes flash { 0% { transform: scale(1); } 40% { transform: scale(1.18); } 100% { transform: scale(1); } }
  .slot.bad { animation: shake .35s; border-color: #ff6f61; }
  .tools .btn.lococ { font-size: 26px; }
  /* ---- Kit de "juice" (racha, banner de ronda, transiciones) ---- */
  .jk-banner { position: fixed; left: 50%; top: 70px; z-index: 44; transform: translate(-50%,0) scale(.6); opacity: 0; pointer-events: none;
    padding: 8px 28px; border-radius: 40px; font-size: 28px; font-weight: 900; color: #fff; white-space: nowrap; border: 4px solid #fff;
    background: linear-gradient(180deg, #ffb703, #ff8906); box-shadow: 0 7px 0 #b85a00, 0 16px 28px rgba(0,0,0,.3), inset 0 2px 0 rgba(255,255,255,.6);
    text-shadow: 0 3px 0 #b85a00, 0 5px 8px rgba(0,0,0,.3); }
  .jk-banner.in { animation: jkb 1.4s ease-in-out forwards; }
  @keyframes jkb { 0% { transform: translate(-50%,0) scale(.6); opacity: 0 } 14% { transform: translate(-50%,0) scale(1.08); opacity: 1 } 24% { transform: translate(-50%,0) scale(1) } 78% { transform: translate(-50%,0) scale(1); opacity: 1 } 100% { transform: translate(-50%,-30px) scale(.9); opacity: 0 } }
  .jk-streak { position: fixed; top: 78px; right: 240px; z-index: 40; padding: 5px 14px; border-radius: 30px; pointer-events: none;
    background: linear-gradient(180deg,#fff7d6,#ffd166); box-shadow: 0 4px 0 #d9a520, 0 8px 14px rgba(0,0,0,.2), inset 0 1px 0 #fff; font-size: 20px; font-weight: 900; color: #7a4b00;
    opacity: 0; transition: opacity .3s; }
  .jk-streak.on { opacity: 1; }
  .jk-streak.hot { animation: jkhot .45s ease-out; }
  @keyframes jkhot { 0% { transform: scale(1) } 40% { transform: scale(1.3) rotate(-4deg) } 100% { transform: scale(1) } }
  @media (max-width: 820px) { .jk-banner { top: 120px; } .jk-streak { top: 148px; left: 8px; right: auto; } }
  .jk-in { animation: jkin .42s cubic-bezier(.2,.9,.3,1.15) both; }
  .jk-out { animation: jkout .24s ease-in forwards; pointer-events: none; }
  @keyframes jkin { from { transform: translateX(70px) scale(.92); opacity: 0 } to { transform: none; opacity: 1 } }
  @keyframes jkout { to { transform: translateX(-70px) scale(.92); opacity: 0 } }
  .jk-blink { transform-box: fill-box; transform-origin: center; }
  .jk-blink.on { transform: scaleY(.12); }
  .jk-press { animation: jkpress .28s ease-out; }
  @keyframes jkpress { 0% { transform: scale(1) } 35% { transform: scale(.9,1.1) } 70% { transform: scale(1.1,.92) } 100% { transform: scale(1) } }

  /* Bandeja de bloques de plástico con bisel */
  .tray { display: flex; flex-wrap: wrap; gap: min(1.6vw, 12px); justify-content: center; align-content: flex-start; flex: 0 0 auto; max-width: 96vw; min-height: min(12vh, 100px); padding: 10px 14px; border-radius: 26px;
    background: linear-gradient(180deg, #d59a52, #b8763a 60%, #a3652e); box-shadow: 0 6px 0 #6b3d12, 0 12px 20px rgba(60,30,0,.3), inset 0 3px 0 rgba(255,235,200,.5), inset 0 -4px 10px rgba(0,0,0,.2); }
  .block {
    --a: #ffd0e4; --b: #f582ae; --d: #b8306f; --s: min(11vw, 11vh, 86px);
    position: relative; width: var(--s); height: var(--s); border-radius: 18px; flex: 0 0 auto;
    display: flex; align-items: center; justify-content: center; cursor: pointer; touch-action: none;
    font-size: calc(var(--s) * .6); font-weight: 900; color: #fff; line-height: 1;
    background: linear-gradient(135deg, var(--a) 0%, var(--b) 55%, var(--d) 130%);
    box-shadow: 0 8px 0 var(--d), 0 14px 20px rgba(20,40,90,.28), inset 0 3px 0 rgba(255,255,255,.7), inset 3px 0 0 rgba(255,255,255,.35), inset 0 -4px 0 rgba(0,0,0,.15), inset -3px 0 0 rgba(0,0,0,.08);
    text-shadow: 0 3px 0 var(--d), 0 6px 8px rgba(0,0,0,.3);
    animation: pop .35s ease-out backwards, float 3.2s ease-in-out infinite;
  }
  .block.syl { width: auto; min-width: var(--s); padding: 0 12px; font-size: calc(var(--s) * .5); }
  .block::before { content: ""; position: absolute; left: 10%; right: 10%; top: 6%; height: 34%; border-radius: 14px 14px 40% 40%; background: linear-gradient(180deg, rgba(255,255,255,.6), rgba(255,255,255,0)); pointer-events: none; }
  .block::after { content: ""; position: absolute; inset: 9%; border-radius: 12px; border: 3px solid rgba(255,255,255,.35); box-shadow: inset 0 2px 4px rgba(0,0,0,.12); pointer-events: none; }
  .block.used { visibility: hidden; animation: none; }
  .block.drag { position: fixed; left: 0; top: 0; z-index: 30; pointer-events: none; animation: none; transform: scale(1.15); transition: none; box-shadow: 0 14px 0 var(--d), 0 26px 30px rgba(20,40,90,.35), inset 0 3px 0 rgba(255,255,255,.7); }
  .block.back { transition: transform .3s ease-out; }
  .block.bad { animation: shake .35s; }

  /* Teclado */
  .kbd { display: flex; flex-direction: column; gap: 8px; align-items: center; flex: 0 0 auto; padding: 10px; max-width: 98vw; border-radius: 26px;
    background: linear-gradient(180deg, rgba(255,255,255,.5), rgba(255,255,255,.25)); box-shadow: inset 0 3px 8px rgba(0,0,0,.12), 0 2px 0 rgba(255,255,255,.5); }
  .krow { display: flex; gap: 7px; justify-content: center; }
  .key { --a: #ffffff; --b: #e4ebf7; --d: #b4bfd6; --s: min(8.4vw, 8.5vh, 84px);
    width: var(--s); height: var(--s); border-radius: 14px; display: flex; align-items: center; justify-content: center; cursor: pointer; touch-action: none; position: relative;
    font-size: calc(var(--s) * .55); font-weight: 900; color: #1f2f6b; line-height: 1;
    background: linear-gradient(180deg, var(--a), var(--b)); box-shadow: 0 6px 0 var(--d), 0 10px 14px rgba(20,40,90,.2), inset 0 2px 0 #fff; text-shadow: 0 1px 0 #fff; transition: transform .06s, box-shadow .06s; }
  .key.down, .key:active { transform: translateY(5px); box-shadow: 0 1px 0 var(--d), 0 3px 6px rgba(20,40,90,.2), inset 0 2px 0 #fff; }
  .key.del { --a: #ffd0e4; --b: #f582ae; --d: #b8306f; color: #fff; text-shadow: 0 2px 0 var(--d); width: calc(var(--s) * 1.25); }
  .key.vow { --a: #fff4c2; --b: #ffe08a; --d: #d9a520; }

  .actions { display: flex; align-items: center; justify-content: center; gap: 18px; flex: 0 0 auto; min-height: 70px; }
  .actions .btn { font-size: 44px; min-width: 150px; min-height: 76px; }
  .actions .btn.off { opacity: .45; filter: saturate(.4); }
  .wrongs { font-size: 28px; font-weight: 900; color: #fff; background: linear-gradient(180deg, #ff9c93, #ff6f61); padding: 8px 18px; border-radius: 30px; box-shadow: 0 5px 0 #b8413a, 0 8px 14px rgba(0,0,0,.25), inset 0 2px 0 rgba(255,255,255,.5); text-shadow: 0 2px 0 rgba(0,0,0,.2); animation: pop .35s; display: none; }
  .wrongs.show { display: block; }
  .spark { position: fixed; width: 14px; height: 14px; border-radius: 50%; pointer-events: none; z-index: 31; background: radial-gradient(circle, #fff 0 30%, var(--c) 32% 60%, rgba(255,255,255,0) 62%); box-shadow: 0 0 8px var(--c); animation: sparkfly .7s ease-out forwards; }
  @keyframes sparkfly { 0% { transform: translate(0,0) scale(1); opacity: 1; } 100% { transform: translate(var(--dx), var(--dy)) scale(.2); opacity: 0; } }
  @media (max-height: 700px) { .top { margin-top: 40px; } .medal { width: min(18vh, 30vw, 170px); height: min(18vh, 30vw, 170px); } .pic { font-size: min(11vh, 19vw, 108px); } }
</style>

    if (level === 3) later(saySlow, 1600);
    if (level === 1 && round === 0 && !JK.store('kg-palabras-hand', 0)) {
      later(function () { var it = null; tray.forEach(function (t) { if (!it && t.v === slots[0].expect) it = t; }); if (it && slots[0].val == null) KidsGame.hand({ from: it.el, to: slots[0].el, timeout: 14000 }); }, 1000);
    }
  }

  /* ---------- Arrastre ---------- */
  var drag = null;
  function makeDraggable(b, item) {
    b.addEventListener('pointerdown', function (e) {
      e.preventDefault(); if (lock || drag || b.classList.contains('used')) return;
      var r = b.getBoundingClientRect();
      drag = { item: item, id: e.pointerId, sx: e.clientX, sy: e.clientY, ox: e.clientX - r.left, oy: e.clientY - r.top, moved: false, ghost: null, w: r.width, h: r.height };
      try { b.setPointerCapture(e.pointerId); } catch (x) {}
    });
    b.addEventListener('pointermove', function (e) {
      if (!drag || drag.id !== e.pointerId || drag.item !== item) return; e.preventDefault();
      if (!drag.moved) { if (Math.abs(e.clientX - drag.sx) + Math.abs(e.clientY - drag.sy) < 8) return; drag.moved = true; startGhost(e); }
      moveGhost(e);
    });
    function end(e) {
      if (!drag || drag.id !== e.pointerId || drag.item !== item) return;
      var d = drag; drag = null;
      if (!d.moved) { KidsGame.sound.tap(); tapPlace(item); return; }
      var hot = slotsEl.querySelector('.slot.hot'); if (hot) hot.classList.remove('hot');
      var target = slotAt(e.clientX, e.clientY);
      d.ghost.remove();
      if (target == null) { KidsGame.sound.pop(); return; }
      place(item, target, true);
    }
    b.addEventListener('pointerup', end); b.addEventListener('pointercancel', end);
  }
  function startGhost(e) {
    var g = drag.item.el.cloneNode(true); g.classList.add('drag'); g.style.width = drag.w + 'px'; g.style.height = drag.h + 'px';
    document.body.appendChild(g); drag.ghost = g; drag.item.el.style.opacity = '.35';
  }
  function moveGhost(e) {
    var g = drag.ghost; g.style.left = (e.clientX - drag.ox) + 'px'; g.style.top = (e.clientY - drag.oy) + 'px';
    var t = slotAt(e.clientX, e.clientY);
    slots.forEach(function (s, i) { s.el.classList.toggle('hot', i === t); });
  }
  function slotAt(x, y) {
    for (var i = 0; i < slots.length; i++) {
      var r = slots[i].el.getBoundingClientRect();
      if (x >= r.left - 6 && x <= r.right + 6 && y >= r.top - 6 && y <= r.bottom + 6 && !slots[i].locked && slots[i].val == null) return i;
    }
    return null;
  }
  function firstEmpty() { for (var i = 0; i < slots.length; i++) if (slots[i].val == null) return i; return null; }
  function tapPlace(item) { var i = firstEmpty(); if (i == null) return; place(item, i, false); }

  // Coloca una pieza en la casilla i. En niveles 1-2 se comprueba al instante.
  function place(item, i, dragged) {
    var s = slots[i]; item.el.style.opacity = '';
    if (level <= 2 && item.v !== s.expect) {
      KidsGame.sound.wrong(); replay(s.el, 'bad'); replay(item.el, 'bad'); misses++; JK.miss(s.el);
      if (level === 2 && misses >= 2 && wordEl.classList.contains('hidden')) { peek(); }
      return;
    }
    s.val = item.v; s.block = item; item.el.classList.add('used');
    s.el.textContent = item.v; s.el.classList.add('full'); paint(s.el, item.pal);
    if (level <= 2) { s.el.classList.add('good'); replay(s.el, 'good'); KidsGame.sound.pop(); sparks(s.el, '#7dffb0'); KidsGame.fx.ring(s.el); JK.press(s.el); if (firstEmpty() == null) complete(); }
    else { KidsGame.sound.pop(); JK.press(s.el); if (firstEmpty() == null) checkBtn.classList.remove('off'); }
  }
  function peek() { misses = 0; wordEl.classList.remove('hidden'); tipEl.textContent = ''; later(function () { wordEl.classList.add('hidden'); tipEl.innerHTML = '<span class="emoji eye">🙈</span>'; }, 1200); }
  // Nivel 3-4: tocar una casilla llena la vacía
  function returnSlot(i) {
    var s = slots[i]; if (lock || s.locked || s.val == null) return;
    KidsGame.sound.tap(); clearSlot(s); if (checkBtn) checkBtn.classList.add('off'); setCursor();
  }
  function clearSlot(s) {
    if (s.block) { s.block.el.classList.remove('used'); replay(s.block.el, 'pop'); }
    s.val = null; s.block = null; s.el.textContent = ''; s.el.classList.remove('full', 'good'); s.el.style.cssText = '';
  }

  /* ---------- Teclado (nivel 4) ---------- */
  function setCursor() { if (level !== 4) return; var i = firstEmpty(); slots.forEach(function (s, j) { s.el.classList.toggle('cursor', j === i); }); }
  function pressKey(L, key) {
    if (lock) return; KidsGame.sound.tap(); replay(key, 'down'); setTimeout(function () { key.classList.remove('down'); }, 120);
    var i = firstEmpty(); if (i == null) return;
    var s = slots[i]; s.val = L; s.el.textContent = L; s.el.classList.add('full'); paint(s.el, PAL[1]);
    setCursor(); if (firstEmpty() == null) checkBtn.classList.remove('off');
  }
  function backspace(key) {
    if (lock) return; KidsGame.sound.pop(); replay(key, 'down'); setTimeout(function () { key.classList.remove('down'); }, 120);
    for (var i = slots.length - 1; i >= 0; i--) if (slots[i].val != null && !slots[i].locked) { clearSlot(slots[i]); break; }
    checkBtn.classList.add('off'); setCursor();
  }

  /* ---------- Comprobar (niveles 3-4) ---------- */
  function check() {
    if (lock || firstEmpty() != null) { if (!lock) { KidsGame.sound.wrong(); replay(checkBtn, 'bad'); } return; }
    var wrong = 0;
    slots.forEach(function (s) {
      if (s.locked) return;
      var ok = level === 3 ? s.val === s.expect : norm(s.val) === norm(s.expect);
      if (ok) { s.locked = true; s.el.classList.add('good'); replay(s.el, 'good'); paint(s.el, PAL[2]); sparks(s.el, '#7dffb0'); }
      else { wrong++; replay(s.el, 'bad'); }
    });
    if (!wrong) { JK.hit(medal, '¡Bien!'); complete(); return; }
    JK.miss(slotsEl);
    KidsGame.sound.wrong(); KidsGame.vibrate(40);
    wrongsEl.textContent = '✘ ' + wrong; replay(wrongsEl, 'pop'); wrongsEl.classList.add('show');
    KidsGame.say(wrong === 1 ? 'Una letra no está bien' : wrong + ' no están bien');
    lock = true;
    later(function () {
      slots.forEach(function (s) { if (!s.locked) clearSlot(s); });
      lock = false; checkBtn.classList.add('off'); setCursor();
    }, 700);
  }

  function complete() {
    lock = true; round++; updateProgress(); JK.put('kg-palabras-hand', 1);
    if (level <= 2) { if (misses === 0) JK.hit(medal, '¡Bien!'); else KidsGame.fx.floatText(window.innerWidth / 2, window.innerHeight * .3, '¡Bien!', 'good'); }
    KidsGame.sound.ok(); KidsGame.addStar(); KidsGame.vibrate(30); sparks(medal, '#ffe066'); replay(picEl, 'bounce');
    wordEl.className = 'word'; wordEl.textContent = cur[1]; tipEl.textContent = '';
    slots.forEach(function (s, i) { setTimeout(function () { replay(s.el, 'good'); }, i * 70); });
    KidsGame.say(cur[1].toLowerCase() + '. ¡Muy bien!');
    later(function () { trainEl.classList.remove('in'); trainEl.classList.add('go'); smoke(); chug(); KidsGame.fx.burstAt(locoEl, { n: 18, chars: ['⭐', '✨', '💨'] }); }, 700);
    later(function () {
      picEl.classList.remove('bounce');
      if (round >= ROUNDS) {
        KidsGame.levelDone(level); unlockLoco();
        KidsGame.celebrate({ sub: '¡' + ROUNDS + ' palabras!', stars: 3,
          onNext: function () { if (level < 4) startLevel(level + 1); else pickLevel(); },
          onAgain: function () { startLevel(level); } });
      } else nextWord();
    }, 2300);
  }

  // Ganchos para pruebas
  window.__palabras = {
    get level() { return level; }, get word() { return cur; }, get round() { return round; },
    slots: function () { return slots.map(function (s) { return s.val; }); },
    solve: function () { slots.forEach(function (s, i) { if (s.val != null) return; if (level === 4) { s.val = norm(s.expect); s.el.textContent = s.val; s.el.classList.add('full'); } else { var it = null; tray.forEach(function (t) { if (!it && !t.el.classList.contains('used') && t.v === s.expect) it = t; }); if (it) place(it, i, false); } }); if (level >= 3) { checkBtn.classList.remove('off'); check(); } },
    place: function (v, i) { var it = null; tray.forEach(function (t) { if (!it && !t.el.classList.contains('used') && t.v === v) it = t; }); if (it) place(it, i == null ? firstEmpty() : i, false); },
    key: function (L) { pressKey(L, trayEl.querySelector('.key')); }, check: check, start: startLevel, get streak() { return JK.streak; }, locos: locosUnlocked
  };
  pickLevel();
})();
</script>
