    try { localStorage.setItem('kg-historia-cuentos', JSON.stringify(list)); } catch (e) {}
    KidsGame.sound.ok(); KidsGame.toast('Cuento guardado 💾', 1200); KidsGame.say('Guardado');
    var sh = wrap.querySelector('.shelf'); if (sh) renderShelf(sh);
  }
  function renderShelf(sh) {
    sh.innerHTML = ''; var list = loadStories();
    for (var i = 0; i < 5; i++) (function (i) { var d = el('div', 'sv', list[i] ? SCENES[list[i].scene].e : '·'); if (list[i]) onTap(d, function () { loadStory(list[i]); }); sh.appendChild(d); })(i);
  }
  function loadStory(s) {
    B = { step: 4, scene: s.scene, chars: s.chars, props: s.props, events: s.events || [], twist: s.twist, text: '', segs: [], actors: [], starred: true, timers: [] };
    wrap.innerHTML = ''; wrap.appendChild(buildStage());
    if (s.pos) s.pos.forEach(function (p) { B.actors.forEach(function (a) { if (a.a.kind === p[0] && a.a.i === p[1]) { a.x = p[2]; a.y = p[3]; a.el.style.left = p[2] + '%'; a.el.style.top = p[3] + '%'; } }); });
    KidsGame.sound.pop(); setTimeout(tell, 300);
  }

  onTap(lvlBtn, function () { KidsGame.sound.tap(); B.timers.forEach(clearTimeout); pickLevel(); });
  onTap(playBtn, checkA);
  onTap(modeBtn, function () { KidsGame.sound.tap(); B.timers.forEach(clearTimeout); if (mode === 'A') startB(); else startA(); });
  window.addEventListener('resize', layoutA);

  window.__hs = {
    get mode() { return mode; }, get level() { return level; }, get story() { return story; }, get slots() { return slots; }, get cards() { return cards; }, get B() { return B; }, get busy() { return busy; },
    cardRect: function (k) { var r = cards[k].el.getBoundingClientRect(); return [r.left + r.width / 2, r.top + r.height / 2]; },
    slotRect: function (k) { var r = slots[k].el.getBoundingClientRect(); return [r.left + r.width / 2, r.top + r.height / 2]; },
    solve: function (wrongOne) { cards.forEach(function (c) { if (c.slot >= 0) toTray(c); }); cards.forEach(function (c) { if (c.d.i >= 0) place(c, slots[c.d.i]); }); if (wrongOne && slots.length > 1) { var a = slots[0].card, b = slots[1].card; toTray(a); toTray(b); place(a, slots[1]); place(b, slots[0]); } },
    check: checkA, startB: startB, startA: startA, tell: tell, save: saveStory, star: giveStar, twist: doTwist,
    setB: function (sc, ch, pr, ev) { B.scene = sc; B.chars = ch; B.props = pr; B.events = ev || []; B.step = 4; renderStep(); },
    set: function (l) { level = l; order = STORIES.slice(); round = 0; startA(); }
  };
  pickLevel();
})();
