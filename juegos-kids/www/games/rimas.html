  .tools { position: absolute; top: 8px; right: 8px; z-index: 3; display: flex; gap: 8px; }

    GROUPS.forEach(function (G, i) { if (i !== g) G.forEach(function (x) { pool.push(x); }); });
    if (typeof firstLetter === 'string') pool = pool.filter(function (x) { return x[0].charAt(0) === firstLetter; });
    else if (firstLetter === false) pool = pool.filter(function (x) { return x[0].charAt(0) !== w.charAt(0); });
    var out = [];
    KidsGame.shuffle(pool).forEach(function (x) { if (out.length < n && seen.indexOf(x[1]) < 0) { out.push(x); seen.push(x[1]); } });
    return out;
  }

  /* ---------- Estado ---------- */
  var level = 1, round = 0, lock = false, timers = [], usedG = [], screen = null, body = null, dotsEl = null, countEl = null, lastQ = '';
  function later(fn, ms) { timers.push(setTimeout(fn, ms)); }
  function clearTimers() { timers.forEach(clearTimeout); timers = []; }
  function pickLevel() {
    clearTimers(); lock = true; game.innerHTML = '';
    KidsGame.levelPicker({ labels: { 1: '¿Cuál rima?', 2: 'Con trampa', 3: 'Parejas y ¿cuál no?', 4: 'Versos e inventar' }, onPick: function (n) { startLevel(n); } });
  }
  function startLevel(n) { level = n; round = 0; usedG = []; buildScreen(); nextRound(); }
  function hud() {
    var h = el('div', 'hud');
    var b = el('button', 'btn round yellow', '🎚️'); b.setAttribute('aria-label', 'Nivel');
    onTap(b, function () { KidsGame.sound.tap(); pickLevel(); });
    h.appendChild(b); h.appendChild(KidsGame.levelBadge(level));
    return h;
  }
  function buildScreen() {
    clearTimers(); game.innerHTML = '';
    screen = el('div', 'screen');
    ['♪', '♫', '♩', '♬', '♪', '♫', '♩'].forEach(function (n, i) {
      var d = el('div', 'note', n); d.style.left = [4, 90, 10, 86, 48, 28, 70][i] + '%'; d.style.top = [22, 28, 78, 80, 92, 92, 92][i] + '%';
      d.style.animationDelay = (-i * 0.9) + 's'; d.style.fontSize = (40 + (i * 13) % 30) + 'px'; screen.appendChild(d);
    });
    screen.appendChild(hud());
    var tools = el('div', 'tools');
    var sayB = el('button', 'btn round blue', '🔊'); sayB.setAttribute('aria-label', 'Repetir');
    onTap(sayB, function () { KidsGame.sound.tap(); if (lastQ) KidsGame.say(lastQ); });
    tools.appendChild(sayB); screen.appendChild(tools);
    var prog = el('div', 'prog'); countEl = el('div', 'count'); dotsEl = el('div', 'dots');
    for (var i = 0; i < ROUNDS; i++) dotsEl.appendChild(el('div', 'dot'));
    prog.appendChild(countEl); prog.appendChild(dotsEl); screen.appendChild(prog);
    body = el('div', 'screen'); body.style.position = 'relative'; body.style.flex = '1 1 auto'; body.style.width = '100%'; body.style.padding = '0';
    screen.appendChild(body); game.appendChild(screen);
  }
  function updateProgress() {
    countEl.textContent = round + ' / ' + ROUNDS;
    Array.prototype.forEach.call(dotsEl.children, function (d, i) { d.classList.toggle('on', i < round); });
  }
  function speak(t) { lastQ = t; KidsGame.say(t); }
  function pickGroup(min) {
    var cands = []; GROUPS.forEach(function (G, i) { if (G.length >= min && usedG.indexOf(i) < 0) cands.push(i); });
    if (!cands.length) { usedG = []; GROUPS.forEach(function (G, i) { if (G.length >= min) cands.push(i); }); }
    var g = KidsGame.pick(cands); usedG.push(g); return g;
  }
  function optCard(w, extra) {
    var c = el('div', 'card opt' + (extra || ''));
    c.innerHTML = '<span class="emoji">' + w[1] + '</span><span class="lbl">' + cap(w[0]) + '</span><div class="spk">🔊</div>';
    c.dataset.w = w[0];
    onTap(c.querySelector('.spk'), function () { KidsGame.sound.tap(); KidsGame.say(w[0]); replay(c.querySelector('.emoji'), 'pop'); });
    return c;
  }

  function nextRound() {
    clearTimers(); lock = false; body.innerHTML = ''; updateProgress();
    if (level === 1 || level === 2) roundChoose();
    else if (level === 3) { if (round % 2 === 0) roundOdd(); else roundPairs(); }
    else { if (round < 5) roundVerse(); else roundInvent(); }
  }
  function win(extraSay) {
    lock = true; round++; updateProgress();
    KidsGame.sound.ok(); KidsGame.addStar(); KidsGame.vibrate(30);
    later(function () {
      if (round >= ROUNDS) {
        KidsGame.levelDone(level);
        KidsGame.celebrate({ sub: '¡' + ROUNDS + ' rimas!', onNext: function () { if (level < 4) startLevel(level + 1); else pickLevel(); }, onAgain: function () { startLevel(level); } });
      } else nextRound();
    }, 1700);
  }

  /* ---------- Niveles 1 y 2: ¿cuál rima? ---------- */
  var current = null;
  function roundChoose() {
    var g = pickGroup(2), G = KidsGame.shuffle(GROUPS[g]);
    var target = G[0], answer = G[1];
    var opts = [answer], seen = [target[1], answer[1]];
    if (level === 2) {
      var trap = others(target[0], 1, target[0].charAt(0), seen);
      if (trap.length) { opts.push(trap[0]); seen.push(trap[0][1]); }
    }
    opts = opts.concat(others(target[0], (level === 1 ? 3 : 4) - opts.length, false, seen));
    opts = KidsGame.shuffle(opts);
    current = { target: target, answer: answer, opts: opts };
    body.appendChild(el('div', 'q', '¿Cuál rima con <b>' + target[0].toUpperCase() + '</b>?'));
    var t = el('div', 'target'); t.innerHTML = '<div class="medal"><span class="emoji">' + target[1] + '</span></div><div class="word">' + target[0].toUpperCase() + '</div>';
    onTap(t, function () { KidsGame.sound.tap(); KidsGame.say(target[0]); replay(t.querySelector('.emoji'), 'pop'); });
    body.appendChild(t);
    var o = el('div', 'opts' + (opts.length === 4 ? ' four' : ''));
    opts.forEach(function (w, i) {
      var c = optCard(w); c.style.animationDelay = (i * 80) + 'ms';
      onTap(c, function () { chooseRhyme(c, w, target); });
      o.appendChild(c);
    });
    body.appendChild(o);
    speak('¿Cuál rima con ' + target[0] + '?');
  }
  function chooseRhyme(c, w, target) {
    if (lock) return;
    if (rhymes(w[0], target[0])) {
      c.classList.add('ok'); sparks(c, '#7dffb0');
      speak(target[0] + '... ' + w[0] + '. ¡Riman!'); win();
    } else { KidsGame.sound.wrong(); replay(c, 'bad'); speak(w[0] + ' no rima con ' + target[0]); }
  }

  /* ---------- Nivel 3a: ¿cuál NO rima? ---------- */
  function roundOdd() {
    var g = pickGroup(3), G = KidsGame.shuffle(GROUPS[g]).slice(0, 3);
    var odd = others(G[0][0], 1, false, G.map(function (w) { return w[1]; }))[0];
    var opts = KidsGame.shuffle(G.concat([odd]));
    current = { odd: odd, opts: opts };
    body.appendChild(el('div', 'q', '¿Cuál <b>NO</b> rima?'));
    var o = el('div', 'opts four');
    opts.forEach(function (w, i) {
      var c = optCard(w); c.style.animationDelay = (i * 80) + 'ms';
      onTap(c, function () {
        if (lock) return;
        if (w === odd) { c.classList.add('ok'); sparks(c, '#7dffb0'); speak(w[0] + ' no rima. ¡Muy bien!'); win(); }
        else { KidsGame.sound.wrong(); replay(c, 'bad'); speak(w[0] + ' sí rima'); }
      });
      o.appendChild(c);
    });
    body.appendChild(o);
    speak('¿Cuál no rima? ' + opts.map(function (w) { return w[0]; }).join(', '));
  }

  /* ---------- Nivel 3b: parejas con línea ---------- */
  var pairState = null;
  function roundPairs() {
    var pairs = [];
    var seen = [];
    for (var k = 0; k < 4; k++) {
      var G = KidsGame.shuffle(GROUPS[pickGroup(2)]).filter(function (w) { return seen.indexOf(w[1]) < 0; });
      if (G.length < 2) { k--; continue; }
      pairs.push([G[0], G[1]]); seen.push(G[0][1], G[1][1]);
    }
    var left = pairs.map(function (p) { return p[0]; }), right = KidsGame.shuffle(pairs.map(function (p) { return p[1]; }));
    current = { pairs: pairs, left: left, right: right, matched: 0 };
    body.appendChild(el('div', 'q', 'Une las que <b>riman</b>'));
    var board = el('div', 'board'), cl = el('div', 'col l'), cr = el('div', 'col r');
    var svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
    function card(w, side, i) {
      var c = el('div', 'card pair'); c.dataset.w = w[0]; c.style.animationDelay = (i * 70) + 'ms';
      c.innerHTML = '<span class="emoji">' + w[1] + '</span><span class="lbl">' + cap(w[0]) + '</span><span class="knob"></span>';
      return c;
    }
    left.forEach(function (w, i) { var c = card(w, 'l', i); cl.appendChild(c); attachDrag(c, w, board, svg, cr); });
    right.forEach(function (w, i) { var c = card(w, 'r', i); cr.appendChild(c); onTap(c, function () { KidsGame.sound.tap(); KidsGame.say(w[0]); replay(c.querySelector('.emoji'), 'pop'); }); });
    board.appendChild(cl); board.appendChild(cr); board.appendChild(svg);
    body.appendChild(board);
    speak('Une las que riman');
  }
  function attachDrag(c, w, board, svg, cr) {
    var line = null, pid = null;
    function pt(e) { var r = board.getBoundingClientRect(); return [e.clientX - r.left, e.clientY - r.top]; }
    function knob() { var k = c.querySelector('.knob').getBoundingClientRect(), r = board.getBoundingClientRect(); return [k.left + k.width / 2 - r.left, k.top + k.height / 2 - r.top]; }
    c.addEventListener('pointerdown', function (e) {
      e.preventDefault(); if (lock || line || c.classList.contains('done')) return;
      pid = e.pointerId; try { c.setPointerCapture(pid); } catch (x) {}
      KidsGame.sound.tap(); KidsGame.say(w[0]);
      line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
      var k = knob(), p = pt(e);
      line.setAttribute('x1', k[0]); line.setAttribute('y1', k[1]); line.setAttribute('x2', p[0]); line.setAttribute('y2', p[1]);
      svg.appendChild(line);
    });
    c.addEventListener('pointermove', function (e) { if (!line || e.pointerId !== pid) return; e.preventDefault(); var p = pt(e); line.setAttribute('x2', p[0]); line.setAttribute('y2', p[1]); });
    function end(e) {
      if (!line || e.pointerId !== pid) return; var L = line; line = null; pid = null;
      var hit = null;
      Array.prototype.forEach.call(cr.children, function (rc) { var r = rc.getBoundingClientRect(); if (!hit && !rc.classList.contains('done') && e.clientX >= r.left - 10 && e.clientX <= r.right + 10 && e.clientY >= r.top - 10 && e.clientY <= r.bottom + 10) hit = rc; });
      if (!hit) { L.remove(); KidsGame.sound.pop(); return; }
      if (rhymes(hit.dataset.w, w[0])) {
        var k = hit.querySelector('.knob').getBoundingClientRect(), r = board.getBoundingClientRect();
        L.setAttribute('x2', k.left + k.width / 2 - r.left); L.setAttribute('y2', k.top + k.height / 2 - r.top); L.classList.add('done');
        c.classList.add('ok', 'done'); hit.classList.add('ok', 'done'); sparks(hit, '#7dffb0'); KidsGame.sound.pop();
        speak(w[0] + '... ' + hit.dataset.w);
        current.matched++;
        if (current.matched === 4) win(); else KidsGame.addStar();
      } else { L.remove(); KidsGame.sound.wrong(); replay(c, 'bad'); replay(hit, 'bad'); speak(w[0] + ' no rima con ' + hit.dataset.w); }
    }
    c.addEventListener('pointerup', end); c.addEventListener('pointercancel', end);
  }

  /* ---------- Nivel 4a: completa el verso ---------- */
  var usedV = [];
  function roundVerse() {
    var cands = VERSES.filter(function (v) { return usedV.indexOf(v) < 0; }); if (!cands.length) { usedV = []; cands = VERSES; }
    var v = KidsGame.pick(cands); usedV.push(v);
    var opts = KidsGame.shuffle([v[1]].concat(v[2]));
    current = { verse: v, opts: opts };
    var ve = el('div', 'verse'); ve.innerHTML = v[0].replace('___', '<span class="gap">?</span>');
    onTap(ve, function () { KidsGame.sound.tap(); speak(v[0].replace('___', '...')); });
    body.appendChild(ve);
    var o = el('div', 'opts');
    opts.forEach(function (w, i) {
      var c = optCard(w); c.style.animationDelay = (i * 80) + 'ms';
      onTap(c, function () {
        if (lock) return;
        if (w === v[1]) {
          c.classList.add('ok'); sparks(c, '#7dffb0');
          var gap = ve.querySelector('.gap'); gap.textContent = w[0]; gap.classList.add('full');
          speak(v[0].replace('___', w[0]) + '. ¡Rima!'); win();
        } else { KidsGame.sound.wrong(); replay(c, 'bad'); speak(w[0] + ' no rima'); }
      });
      o.appendChild(c);
    });
    body.appendChild(o);
    speak(v[0].replace('___', '... ¿qué?'));
  }

  /* ---------- Nivel 4b: inventa un poema ---------- */
  function roundInvent() {
    var tpl = TEMPL[round % TEMPL.length];
    var sel = { A: null, J: null, O: null }, read = false;
    var animals = KidsGame.shuffle(ANIMALS).slice(0, 4), adjs = KidsGame.shuffle(ADJS).slice(0, 4), objs = [];
    current = { tpl: tpl, sel: sel };
    var ve = el('div', 'verse');
    function render() {
      ve.innerHTML = tpl.replace('{A}', part('A', 'A')).replace('{J}', part('J', 'J')).replace('{O}', part('O', 'O'));
      function part(k) { return sel[k] ? '<span class="gap full">' + sel[k][0] + '</span>' : '<span class="gap">?</span>'; }
      var ready = sel.A && sel.J && sel.O;
      playB.classList.toggle('off', !ready); okB.classList.toggle('off', !read);
    }
    function text() { return tpl.replace('{A}', sel.A[0]).replace('{J}', sel.J[0]).replace('{O}', sel.O[0]); }
    body.appendChild(el('div', 'q', '¡Inventa tu <b>poema</b>!'));
    body.appendChild(ve);
    var rows = el('div', 'rows');
    function row(key, icon, items) {
      var r = el('div', 'row'); r.appendChild(el('div', 'tag emoji', icon));
      items.forEach(function (it, i) {
        var c = el('div', 'card chip', '<span class="emoji">' + it[it.length === 3 && key !== 'O' ? 2 : 1] + '</span>' + cap(it[0]));
        c.style.animationDelay = (i * 60) + 'ms';
        onTap(c, function () {
          if (lock) return; KidsGame.sound.tap(); sel[key] = it; read = false;
          Array.prototype.forEach.call(r.querySelectorAll('.chip'), function (x) { x.classList.toggle('sel', x === c); });
          KidsGame.say(it[0]);
          if (key === 'A') fillObjs();
          render();
        });
        r.appendChild(c);
      });
      return r;
    }
    var rA = row('A', '🐾', animals), rJ = row('J', '✨', adjs), rO = el('div', 'row');
    function fillObjs() {
      var rhyme = sel.A ? KidsGame.shuffle(OBJS.filter(function (o) { return o[2] === sel.A[1]; }))[0] : null;
      var rest = KidsGame.shuffle(OBJS.filter(function (o) { return !rhyme || o !== rhyme; })).slice(0, rhyme ? 3 : 4);
      objs = KidsGame.shuffle(rhyme ? [rhyme].concat(rest) : rest);
      var nr = row('O', '🎁', objs); rows.replaceChild(nr, rO); rO = nr; sel.O = null;
    }
    rows.appendChild(rA); rows.appendChild(rJ); rows.appendChild(rO); fillObjs();
    body.appendChild(rows);
    var acts = el('div', 'actions');
    var playB = el('button', 'btn blue off', '▶'), okB = el('button', 'btn green off', '✔');
    onTap(playB, function () {
      if (lock || !(sel.A && sel.J && sel.O)) { KidsGame.sound.wrong(); return; }
      KidsGame.sound.pop(); read = true; render();
      var bonus = sel.O[2] === sel.A[1];
      speak(text() + (bonus ? '. ¡' + sel.A[1] + ' rima con ' + sel.O[0].split(' ').pop() + '!' : ''));
      if (bonus) { sparks(ve, '#ffe066'); KidsGame.confetti(20); ve.classList.add('ok'); } else { replay(ve, 'pop'); }
    });
    onTap(okB, function () { if (lock || !read) { KidsGame.sound.wrong(); return; } if (sel.O[2] === sel.A[1]) KidsGame.addStar(); win(); });
    acts.appendChild(playB); acts.appendChild(okB); body.appendChild(acts);
    render();
    speak('Inventa tu poema. Elige un animal, cómo es, y qué tiene');
  }

  // Ganchos para pruebas
  window.__rimas = { get level() { return level; }, get round() { return round; }, get current() { return current; }, start: startLevel, next: nextRound, groups: GROUPS.length, verses: VERSES.length,
    check: function () { var bad = []; GROUPS.forEach(function (G) { G.forEach(function (w) { if (!w[1]) bad.push(w[0]); }); }); return bad; } };
  pickLevel();
})();
</script>
