<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">

<title>El huerto de Mazi</title>
<style>
  /* ===== Mundo: "El huerto de Mazi" — el tablero es una caja de frutas en el jardín; cada fila, columna y cajón lleva una de cada ===== */
  .game {
    display: flex; flex-direction: column; align-items: center; padding: 10px 12px; gap: 10px;
    background:
      radial-gradient(ellipse 60% 30% at 50% 0%, rgba(255,255,255,.55), rgba(255,255,255,0) 70%),
      linear-gradient(180deg, #9fe0ff 0%, #d4f3ff 38%, #bdf07a 40%, #7fcf5a 70%, #4fae43 100%);
  }
  .garden { position: absolute; inset: 0; z-index: 0; pointer-events: none; width: 100%; height: 100%; }
  .hud { position: relative; z-index: 2; flex: 0 0 auto; display: flex; align-items: center; gap: 10px; padding: 6px 10px 6px 14px; border-radius: 40px; flex-wrap: nowrap; max-width: 100%; }
  .hud .btn.round { width: 64px; height: 64px; font-size: 28px; }
  .hud .btn { font-size: 22px; min-height: 64px; padding: 6px 16px; white-space: nowrap; }
  .hud .btn .n { display: inline-block; margin-left: 6px; min-width: 30px; padding: 2px 8px; border-radius: 14px; background: rgba(255,255,255,.85); color: #5232b3; font-size: 20px; text-shadow: none; }
  .hud .btn.off { opacity: .45; filter: saturate(.3); pointer-events: none; }
  .hud .hero { width: 52px; height: 52px; flex: 0 0 auto; } .hud .hero svg { width: 100%; height: 100%; overflow: visible; }
  .left { display: flex; flex-direction: column; align-items: center; line-height: 1; padding: 0 8px; min-width: 86px; }
  .left .big { font-size: 34px; font-weight: 900; color: #2e8b3a; text-shadow: 0 2px 0 #fff, 0 4px 8px rgba(0,0,0,.15); }
  .left .lbl { font-size: 14px; color: #4a7a2b; font-weight: 800; }
  .hud .streak { display: none; font-size: 18px; font-weight: 900; color: #fff; padding: 4px 12px; border-radius: 20px; white-space: nowrap; background: linear-gradient(180deg, #ff9f43, #ff5e3a); box-shadow: 0 3px 0 #b8300a, 0 5px 10px rgba(0,0,0,.25); text-shadow: 0 1px 0 rgba(0,0,0,.3); animation: pop .4s ease-out; }
  .hud .streak.on { display: inline-block; }

  .stage { position: relative; z-index: 1; flex: 1 1 auto; width: 100%; min-height: 0; display: flex; align-items: center; justify-content: center; }
  .stage.in .board { animation: stin .5s cubic-bezier(.3,1.3,.4,1); }
  @keyframes stin { from { transform: scale(.85) translateY(40px); opacity: 0; } to { transform: none; opacity: 1; } }
  /* Caja de frutas de madera con etiqueta */
  .board {
    position: relative; display: grid; gap: var(--bg); padding: var(--bp); border-radius: 14px;
    background: linear-gradient(180deg, #d9a05a 0%, #b8783a 45%, #9a5f28 100%);
    box-shadow: 0 10px 0 #6e3f12, 0 22px 34px rgba(60,20,0,.4), inset 0 3px 0 rgba(255,255,255,.45), inset 0 -4px 0 rgba(0,0,0,.2);
  }
  .board::before { content: ""; position: absolute; inset: 0; border-radius: inherit; pointer-events: none;
    background: repeating-linear-gradient(0deg, rgba(255,255,255,.07) 0 6px, rgba(0,0,0,.06) 6px 14px); }
  .board .tag { position: absolute; left: 50%; top: -16px; transform: translateX(-50%) rotate(-2deg); padding: 3px 18px; border-radius: 8px; font-size: 16px; font-weight: 900; letter-spacing: 2px; color: #7a4b00; white-space: nowrap; z-index: 4;
    background: linear-gradient(180deg, #fff6d0, #ffe08a); box-shadow: 0 3px 0 #c47f00, 0 5px 8px rgba(0,0,0,.3); border: 2px solid #fff; }
  .board .nail { position: absolute; width: 10px; height: 10px; border-radius: 50%; background: radial-gradient(circle at 35% 30%, #fff, #b9c3d8 60%, #6b7a8a); box-shadow: 0 1px 2px rgba(0,0,0,.4); z-index: 3; }
  .bx {
    position: relative; display: grid; gap: var(--cg); padding: var(--cg); border-radius: 12px;
    background: radial-gradient(circle at 30% 30%, rgba(255,255,255,.08) 0 3px, transparent 4px), linear-gradient(180deg, #6b4423, #4a2c10); background-size: 23px 19px, auto;
    box-shadow: inset 0 4px 8px rgba(0,0,0,.5), inset 0 -1px 0 rgba(255,255,255,.12);
  }
  .cell {
    position: relative; width: var(--cs); height: var(--cs); border-radius: 18%; display: flex; align-items: center; justify-content: center; cursor: pointer;
    background: linear-gradient(180deg, #ffffff 0%, #eef2fa 100%); border: 2px solid #fff;
    box-shadow: 0 5px 0 #b9c3d8, 0 8px 12px rgba(0,0,0,.3), inset 0 2px 0 #fff, inset 0 -3px 0 rgba(0,0,0,.06);
    transition: transform .12s, box-shadow .12s, background .2s;
  }
  .cell::before { content: ""; position: absolute; left: 10%; right: 10%; top: 5%; height: 34%; border-radius: 18% 18% 50% 50%; pointer-events: none; z-index: 2; background: linear-gradient(180deg, rgba(255,255,255,.85), rgba(255,255,255,0)); }
  .cell .emoji { font-size: calc(var(--cs) * .6); filter: drop-shadow(0 4px 4px rgba(0,0,0,.3)); z-index: 1; }
  .cell:empty::after { content: ""; position: absolute; width: 34%; height: 34%; border-radius: 50%; background: radial-gradient(circle at 40% 35%, #c9d2e6, #9aa7c7); opacity: .35; }
  .cell.fixed { background: linear-gradient(180deg, #fff3cf 0%, #ffe3a3 100%); border-color: #fff0c4; cursor: default; box-shadow: 0 2px 0 #d9a520, 0 4px 6px rgba(0,0,0,.25), inset 0 2px 0 #fff; }
  .cell.fixed::before { opacity: .5; }
  .cell.sel { transform: translateY(-3px) scale(1.06); z-index: 3; box-shadow: 0 7px 0 #b9c3d8, 0 12px 16px rgba(0,0,0,.3), 0 0 0 5px #ffe98a, 0 0 0 9px rgba(255,255,255,.7), 0 0 24px 6px rgba(255,233,138,.9), inset 0 2px 0 #fff; }
  .cell.same { background: linear-gradient(180deg, #e2f5ff 0%, #bfe6ff 100%); border-color: #d9f1ff; }
  .cell.conf { animation: conf 1.5s ease-in-out; }
  @keyframes conf { 0%,100% { background: linear-gradient(180deg, #fff, #eef2fa); box-shadow: 0 5px 0 #b9c3d8, 0 8px 12px rgba(0,0,0,.3); }
    20%,60% { background: linear-gradient(180deg, #ffd6d6, #ff8f8f); box-shadow: 0 5px 0 #b33, 0 8px 12px rgba(0,0,0,.3), 0 0 0 5px rgba(255,80,80,.55), 0 0 20px 4px rgba(255,80,80,.7); }
    40%,80% { background: linear-gradient(180deg, #fff, #ffe0e0); box-shadow: 0 5px 0 #b9c3d8, 0 8px 12px rgba(0,0,0,.3); } }

  @keyframes land { 0% { transform: scale(1.5); } 40% { transform: scale(.85, 1.15); } 70% { transform: scale(1.1, .92); } 100% { transform: scale(1); } }
  .cell.win { animation: winpop .6s ease-out backwards; }
  @keyframes winpop { 0% { transform: scale(1); } 50% { transform: scale(1.18) rotate(6deg); background: linear-gradient(180deg, #e9ffe9, #b9f0c4); } 100% { transform: scale(1); } }

  /* Paleta: canastita de frutas */
  .pal { position: relative; z-index: 2; flex: 0 0 auto; display: flex; gap: 12px; padding: 12px 18px 10px; border-radius: 40px; max-width: 100%;
    background: linear-gradient(180deg, #f3d3a0, #d9a860); border: 3px solid #fff3d6; box-shadow: 0 8px 0 #a86a30, 0 16px 28px rgba(60,20,0,.3), inset 0 2px 0 #fff; }
  .pal::before { content: ""; position: absolute; left: 18px; right: 18px; top: -12px; height: 20px; border-radius: 12px; pointer-events: none;
    background: repeating-linear-gradient(90deg, #d9a860 0 14px, #b8783a 14px 22px); box-shadow: 0 3px 0 #7a4a1c, 0 6px 10px rgba(0,0,0,.2), inset 0 2px 0 rgba(255,255,255,.5); }

    position: relative; width: var(--ps); height: var(--ps); border-radius: 50%; cursor: pointer; display: flex; align-items: center; justify-content: center;

  }

  @keyframes cfloat { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-5px); } }
  .sym .emoji { font-size: calc(var(--ps) * .56); filter: drop-shadow(0 5px 5px rgba(0,0,0,.3)); }
  .sym:active { transform: scale(1.1) translateY(2px); animation: none; }
  .sym.on { animation: none; transform: translateY(-6px) scale(1.12); box-shadow: 0 10px 0 #b8500a, 0 16px 22px rgba(60,20,0,.35), 0 0 0 5px #ffe98a, 0 0 0 9px rgba(255,255,255,.7), 0 0 26px 8px rgba(255,233,138,.9), inset 0 3px 0 rgba(255,255,255,.7); }
  .sym.erase { background: radial-gradient(circle at 36% 28%, rgba(255,255,255,.95) 0%, rgba(255,255,255,.4) 18%, rgba(255,255,255,0) 40%), radial-gradient(circle at 50% 50%, #ffd6e8 0%, #f0569a 100%); box-shadow: 0 7px 0 #b8306f, 0 12px 18px rgba(60,20,0,.35), inset 0 3px 0 rgba(255,255,255,.7), inset 0 -6px 0 rgba(0,0,0,.1); }
  .sym.erase.on { box-shadow: 0 10px 0 #b8306f, 0 16px 22px rgba(60,20,0,.35), 0 0 0 5px #ffe98a, 0 0 0 9px rgba(255,255,255,.7), 0 0 26px 8px rgba(255,233,138,.9), inset 0 3px 0 rgba(255,255,255,.7); }
  .sym .cnt { position: absolute; right: -4px; bottom: -4px; min-width: 26px; height: 26px; border-radius: 13px; font-size: 16px; font-weight: 900; color: #fff; display: flex; align-items: center; justify-content: center; padding: 0 6px;
    background: linear-gradient(180deg, #7dd0ff, #2f95e8); box-shadow: 0 2px 0 #1a63a8, 0 3px 6px rgba(0,0,0,.3); }
  .sym .cnt.done { background: linear-gradient(180deg, #8ef0b0, #24b36c); box-shadow: 0 2px 0 #14784a, 0 3px 6px rgba(0,0,0,.3); }
  .btn.nudge { animation: nudge .7s ease-in-out 3; }
  @keyframes nudge { 0%,100% { transform: scale(1); } 50% { transform: scale(1.12); } }
  .banner { position: absolute; left: 50%; top: 40%; z-index: 30; pointer-events: none; opacity: 0; transform: translate(-50%, -50%) scale(.5); padding: 12px 36px; border-radius: 40px; white-space: nowrap;
    font-size: clamp(26px, 4.5vw, 40px); font-weight: 900; color: #fff; background: linear-gradient(180deg, #8ef0b0, #24b36c); text-shadow: 0 3px 0 rgba(0,0,0,.2);
    box-shadow: 0 8px 0 #14784a, 0 18px 30px rgba(0,0,0,.3), inset 0 2px 0 rgba(255,255,255,.6); }
  .banner.show { animation: bannerin 1.6s cubic-bezier(.3,1.4,.4,1) forwards; }
  @keyframes bannerin { 0% { opacity: 0; transform: translate(-50%,-50%) scale(.5); } 16% { opacity: 1; transform: translate(-50%,-50%) scale(1.06); } 26% { transform: translate(-50%,-50%) scale(1); } 76% { opacity: 1; transform: translate(-50%,-50%) scale(1); } 100% { opacity: 0; transform: translate(-50%,-100%) scale(.9); } }
  @media (max-width: 800px) { .hud { gap: 6px; padding: 6px 8px; } .hud .btn { font-size: 18px; padding: 6px 10px; } .left { min-width: 70px; } }

    var base = [], r, c;
    for (r = 0; r < n; r++) { base.push([]); for (c = 0; c < n; c++) base[r].push((bc * (r % br) + Math.floor(r / br) + c) % n); }
    var rows = [], cols = [];

    var sym = KidsGame.shuffle(range(n)), out = [];
    for (r = 0; r < n; r++) { out.push([]); for (c = 0; c < n; c++) out[r].push(sym[base[rows[r]][cols[c]]]); }
    return out;
  }
  function candidates(g, n, br, bc, r, c) {
    var used = {}, i, j;
    for (i = 0; i < n; i++) { if (g[r][i] >= 0) used[g[r][i]] = 1; if (g[i][c] >= 0) used[g[i][c]] = 1; }
    var r0 = Math.floor(r / br) * br, c0 = Math.floor(c / bc) * bc;
    for (i = r0; i < r0 + br; i++) for (j = c0; j < c0 + bc; j++) if (g[i][j] >= 0) used[g[i][j]] = 1;
    var out = []; for (i = 0; i < n; i++) if (!used[i]) out.push(i);
    return out;
  }
  function countSolutions(g, n, br, bc, cap) {
    var count = 0;
    function rec() {

      var br_ = -1, bc_ = -1, best = null, r, c;
      for (r = 0; r < n && (best === null || best.length > 1); r++) for (c = 0; c < n; c++) {

        var cs = candidates(g, n, br, bc, r, c);

    }
    rec(); return count;
  }

    for (var k = 0; k < n; k++) { var ce = symEls[k].querySelector('.cnt'); ce.textContent = counts[k] + '/' + n; ce.className = 'cnt' + (counts[k] >= n ? ' done' : ''); }
  }

  function layout() {
    if (!cfg || !stage) return;

    var k = n + 1, pw = game.clientWidth - 60;
    var ps = Math.floor(Math.min((pw - (k - 1) * 12) / k, game.clientHeight > 800 ? 96 : 66)); ps = Math.max(64, ps);
    pal.style.setProperty('--ps', ps + 'px');
    void pal.offsetHeight;
    var W = stage.clientWidth - 8, H = stage.clientHeight - 22;
    var cg = n > 4 ? 5 : 7, bg = 10, bp = 16;
    var stacks = n / bc, bands = n / br;
    var csW = (W - 2 * bp - (stacks - 1) * bg - stacks * (bc + 1) * cg) / n;
    var csH = (H - 2 * bp - (bands - 1) * bg - bands * (br + 1) * cg) / n;
    var cs = Math.floor(Math.min(csW, csH, 120)); cs = Math.max(48, cs);
    board.style.setProperty('--cs', cs + 'px'); board.style.setProperty('--cg', cg + 'px');
    board.style.setProperty('--bg', bg + 'px'); board.style.setProperty('--bp', bp + 'px');
  }

  function updateLeft() {
    var left = 0;
    for (var r = 0; r < cfg.n; r++) for (var c = 0; c < cfg.n; c++) if (grid[r][c] < 0) left++;

    return left;
  }
  function setSel(r, c) {
    if (selR >= 0 && cellEls[selR] && cellEls[selR][selC]) cellEls[selR][selC].classList.remove('sel');

    markSame(r >= 0 && grid[r][c] >= 0 ? grid[r][c] : (selSym !== null && selSym >= 0 ? selSym : -1));
  }
  function markSame(v) {
    for (var r = 0; r < cfg.n; r++) for (var c = 0; c < cfg.n; c++) cellEls[r][c].classList.toggle('same', v >= 0 && grid[r][c] === v && !(r === selR && c === selC));
  }
  function setSym(i) {
    symEls.forEach(function (b, k) { b.classList.toggle('on', i !== null && ((i < 0 && k === symEls.length - 1) || k === i)); });
    selSym = i;
  }

  function tapCell(r, c, el) {
    if (lock || !running) return;
    if (fixed[r][c]) { KidsGame.sound.tap(); setSel(-1, -1); markSame(grid[r][c]); el.classList.remove('pop'); void el.offsetWidth; el.classList.add('pop'); return; }
    if (selSym !== null) { place(r, c, selSym); markSame(selSym); return; }
    KidsGame.sound.tap();
    if (selR === r && selC === c) { setSel(-1, -1); return; }
    setSel(r, c);
  }
  function tapSym(i, b) {
    if (lock || !running) return;
    KidsGame.sound.tap();
    if (selR >= 0) { place(selR, selC, i); setSym(null); markSame(grid[selR][selC]); return; }
    if (selSym === i) { setSym(null); markSame(-1); return; }
    setSym(i); markSame(i);
    // segunda parte del tutorial: ahora la casilla
    if (tutCell && i === sol[tutCell[0]][tutCell[1]]) { var tc = tutCell; tutCell = null; setTimeout(function () { if (running && grid[tc[0]][tc[1]] < 0) tutHand = KidsGame.hand({ el: cellEls[tc[0]][tc[1]], timeout: 8000 }); }, 150); }
  }
  function place(r, c, v) {
    var el = cellEls[r][c];
    if (v < 0) { if (grid[r][c] >= 0) { grid[r][c] = -1; el.innerHTML = ''; KidsGame.sound.pop(); } updateLeft(); updateCounts(); return; }
    if (grid[r][c] === v) return;
    grid[r][c] = v;
    el.innerHTML = '<span class="emoji">' + syms[v] + '</span>';
    el.classList.remove('put'); void el.offsetWidth; el.classList.add('put');
    KidsGame.sound.pop(); KidsGame.vibrate(15);
    updateCounts();
    var left = updateLeft();
    var rc = el.getBoundingClientRect(), x = rc.left + rc.width / 2, y = rc.top + rc.height / 2;
    if (cfg.check === 'now') {
      var conf = conflictsOf(r, c);
      if (conf.length) { errors++; streak = 0; setStreak(); KidsGame.sound.wrong(); pulse(conf.concat([[r, c]])); KidsGame.fx.shake(el); KidsGame.say('Ese dibujo ya está en esa fila o columna.'); }
      else {
        streak++; setStreak(); KidsGame.fx.ring(el); KidsGame.fx.burst(x, y, { n: 8, r: 45 });
        if (streak >= 3) KidsGame.fx.floatText(x, y - 30, '¡Racha x' + streak + '!', 'good'); else KidsGame.fx.floatText(x, y - 30, '+1', 'good');
        if (streak % 5 === 0) { KidsGame.addStar(1); KidsGame.fx.burst(x, y - 50, { n: 10, chars: ['⭐', '✨'] }); KidsGame.toast('⭐ ¡Bonus de racha!', 1200); }
      }
    } else { KidsGame.fx.burst(x, y, { n: 6, r: 36, colors: ['#fff', '#ffe98a', '#bde4ff'] }); }
    if (left === 0) finishCheck();
  }
  function conflictsOf(r, c) {
    var v = grid[r][c], out = [], i, j, n = cfg.n;
    if (v < 0) return out;
    for (i = 0; i < n; i++) { if (i !== c && grid[r][i] === v) out.push([r, i]); if (i !== r && grid[i][c] === v) out.push([i, c]); }
    var r0 = Math.floor(r / cfg.br) * cfg.br, c0 = Math.floor(c / cfg.bc) * cfg.bc;
    for (i = r0; i < r0 + cfg.br; i++) for (j = c0; j < c0 + cfg.bc; j++) if ((i !== r || j !== c) && grid[i][j] === v && !(i === r || j === c)) out.push([i, j]);
    return out;
  }
  function pulse(list) { list.forEach(function (p) { var el = cellEls[p[0]][p[1]]; el.classList.remove('conf'); void el.offsetWidth; el.classList.add('conf'); }); }
  function review() {
    if (lock || !running) return;
    KidsGame.sound.tap();
    var bad = [], n = cfg.n;
    for (var r = 0; r < n; r++) for (var c = 0; c < n; c++) if (!fixed[r][c] && grid[r][c] >= 0 && conflictsOf(r, c).length) bad.push([r, c]);
    if (bad.length) { KidsGame.sound.wrong(); errors++; streak = 0; setStreak(); pulse(bad); KidsGame.fx.shake(board); KidsGame.say('Las casillas rojas se repiten. Cámbialas.'); }
    else { KidsGame.sound.ok(); KidsGame.fx.burstAt(checkBtn, { n: 10 }); KidsGame.toast('¡Todo bien! 👍'); KidsGame.say('¡Todo bien hasta ahora!'); }
  }
  function isSolved() {
    for (var r = 0; r < cfg.n; r++) for (var c = 0; c < cfg.n; c++) if (grid[r][c] !== sol[r][c]) return false;
    return true;
  }
  function finishCheck() {
    if (isSolved()) { win(); return; }
    if (cfg.check === 'now') return;
    if (cfg.check === 'btn') {
      checkBtn.classList.remove('nudge'); void checkBtn.offsetWidth; checkBtn.classList.add('nudge');
      KidsGame.say('Hay algo mal. Toca revisar.'); KidsGame.toast('Toca ✔ Revisar');

    KidsGame.say('Casi. Las casillas rojas están mal.');
  }
  function hint() {
    if (lock || !running || hintsLeft <= 0) return;
    var empties = [], wrongs = [];
    for (var r = 0; r < cfg.n; r++) for (var c = 0; c < cfg.n; c++) {
      if (fixed[r][c]) continue;
      if (grid[r][c] < 0) empties.push([r, c]); else if (grid[r][c] !== sol[r][c]) wrongs.push([r, c]);
    }
    var pool = wrongs.length ? wrongs : empties;
    if (!pool.length) return;
    var p = (selR >= 0 && !fixed[selR][selC] && grid[selR][selC] !== sol[selR][selC]) ? [selR, selC] : KidsGame.pick(pool);
    hintsLeft--; hintsUsed++;
    hintBtn.querySelector('.n').textContent = hintsLeft;
    if (hintsLeft <= 0) hintBtn.classList.add('off');
    setSel(-1, -1); setSym(null);
    var el = cellEls[p[0]][p[1]];
    grid[p[0]][p[1]] = sol[p[0]][p[1]];
    el.innerHTML = '<span class="emoji">' + syms[grid[p[0]][p[1]]] + '</span>';
    el.classList.remove('put', 'hint'); void el.offsetWidth; el.classList.add('put'); el.classList.add('hint');
    KidsGame.sound.ok();
    KidsGame.fx.burstAt(el, { n: 12, chars: ['💡', '✨'] });
    updateCounts();
    if (updateLeft() === 0) finishCheck();
  }

  function win() {
    lock = true; running = false;
    setSel(-1, -1); setSym(null); markSame(-1);
    KidsGame.sound.ok(); KidsGame.addStar(1);
    var n = cfg.n, k = 0;
    for (var r = 0; r < n; r++) for (var c = 0; c < n; c++) { var el = cellEls[r][c]; el.classList.add('win'); el.style.animationDelay = (k * 40) + 'ms'; k++; }
    var bb = board.getBoundingClientRect(), bx = bb.left + bb.width / 2, by = bb.top + bb.height / 2;
    KidsGame.fx.burst(bx, by, { n: 16, r: 120 }); KidsGame.music.duck(2000);
    setTimeout(function () { KidsGame.fx.burst(bx, by - 30, { n: 12, r: 110, chars: syms.slice(0, 4).concat(['⭐', '✨']) }); }, 450);
    banner('🧺 ¡Cosecha lista!');
    var stars = 3; if (hintsUsed > 0) stars--; if (errors > 3) stars--;
    stars = Math.max(1, stars);
    var lv = nivel;
    setTimeout(function () {
      KidsGame.levelDone(lv);
      var s = unlockSet(lv);
      KidsGame.celebrate({
        sub: '¡Sudoku completo!' + (hintsUsed ? ' (' + hintsUsed + ' pista' + (hintsUsed > 1 ? 's' : '') + ')' : ' ¡Sin pistas!') + (s ? ' · 🎨 Nuevos dibujos: ' + s.n : ''),
        stars: stars,
        onNext: function () { start(Math.min(4, lv + 1)); },
        onAgain: function () { start(lv); }

    }, 1500);
  }

  // ganchos para pruebas automáticas
  window.__sudoku = { get: function () { return { grid: grid, sol: sol, fixed: fixed, cfg: cfg, nivel: nivel, syms: syms, hintsLeft: hintsLeft, streak: streak }; }, place: place, tapCell: tapCell, tapSym: tapSym, review: review, hint: hint, cells: function () { return cellEls; }, pal: function () { return symEls; } };

  window.addEventListener('resize', layout);
  showPicker();
})();
