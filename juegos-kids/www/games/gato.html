<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<link rel="stylesheet" href="../common.css">
<title>Tres en raya</title>
<style>
  .game { display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 8px; gap: 10px; }
  .score { flex: 0 0 auto; display: flex; align-items: center; gap: 14px; padding: 6px 20px; font-size: 24px; border-radius: 30px; border: 3px solid #fff;
    background: linear-gradient(180deg, #ffffff, #eef3ff); box-shadow: 0 5px 0 #c9d2e6, 0 10px 16px rgba(20,40,90,.22), inset 0 2px 0 #fff; }
  .score .p { display: flex; align-items: center; gap: 6px; }
  .score .p .emoji { font-size: 32px; }
  .score .vs { color: #a9b4cc; }
  .turn { flex: 0 0 auto; display: flex; align-items: center; gap: 10px; font-size: 24px; min-height: 56px; padding: 4px 18px; border-radius: 30px;
    color: #fff; font-weight: 900; text-shadow: 0 2px 0 #1f7fae, 0 4px 8px rgba(0,0,0,.25); }
  .turn .emoji { font-size: 42px; display: inline-block; }
  .turn .emoji.bounce { animation: bounce .7s infinite; }
  .boardwrap { flex: 1 1 0; min-height: 0; min-width: 0; width: 100%; display: flex; align-items: center; justify-content: center; }
  /* Tablero de madera gruesa con veta, borde claro y sombra */
  .board { position: relative; display: grid; grid-template-columns: repeat(3, 1fr); grid-template-rows: repeat(3, 1fr); gap: 10px; width: var(--bs); height: var(--bs);
    padding: 14px; border-radius: 28px; border: 4px solid #efcf8f;
    background:
      repeating-linear-gradient(180deg, rgba(255,255,255,.06) 0 6px, rgba(0,0,0,0) 6px 11px, rgba(60,30,0,.07) 11px 16px, rgba(0,0,0,0) 16px 26px),
      linear-gradient(160deg, #e2ad68 0%, #c98a46 50%, #a7672d 100%);
    box-shadow: 0 12px 0 #7a4418, 0 24px 34px rgba(0,0,0,.35), inset 0 3px 0 rgba(255,255,255,.35), inset 0 -4px 8px rgba(60,30,0,.25); }
  /* Casillas hundidas (bisel interior) */
  .cell { position: relative; border-radius: 18px; min-width: 64px; min-height: 64px; font-size: calc(var(--bs) * .2); border: 0;
    background: linear-gradient(180deg, #f6ecd2 0%, #fff9e8 100%);
    box-shadow: inset 0 5px 10px rgba(60,30,0,.32), inset 0 -2px 0 rgba(255,255,255,.9), inset 3px 0 6px rgba(60,30,0,.1), 0 1px 0 rgba(255,255,255,.35);
    transition: transform .12s, box-shadow .12s, background .2s; }
  .cell::after { display: none; }
  .cell:active { transform: none; background: linear-gradient(180deg, #ffe9a8, #fff4cf); box-shadow: inset 0 5px 10px rgba(60,30,0,.28), inset 0 -2px 0 rgba(255,255,255,.9); }
  .cell .emoji { display: block; position: relative; z-index: 1; }
  .cell.filled { cursor: default; }
  .cell.filled::before { content: ""; position: absolute; left: 22%; right: 22%; bottom: 10%; height: 14%; border-radius: 50%;
    background: radial-gradient(ellipse at 50% 50%, rgba(0,0,0,.3), rgba(0,0,0,0) 70%); animation: shadowin .45s ease-out; }
  .cell.filled .emoji { animation: piecein .5s cubic-bezier(.2,1.4,.5,1); }
  @keyframes piecein { 0%{transform:scale(.2) translateY(-60%);opacity:0} 55%{transform:scale(1.2,.85) translateY(4%);opacity:1} 75%{transform:scale(.95,1.08) translateY(-3%)} 100%{transform:scale(1) translateY(0)} }
  @keyframes shadowin { 0%{transform:scale(.3);opacity:0} 100%{transform:scale(1);opacity:1} }
  .cell.win { background: linear-gradient(180deg, #fff2b8, #ffe08a); animation: glow .6s ease-in-out infinite alternate; }
  .cell.win .emoji { animation: bounce .6s infinite; }
  @keyframes glow { from { box-shadow: inset 0 4px 8px rgba(120,80,0,.25), 0 0 0 5px #ffb703, 0 0 14px #ffd166; } to { box-shadow: inset 0 4px 8px rgba(120,80,0,.25), 0 0 0 7px #ff8906, 0 0 34px #ffb703; } }
  .cell.hint { background: #f3efff; }
  /* Nivel Experto: tablero 4x4 "cuatro en raya" con gravedad (las fichas caen) */
  .board.n4 { gap: 8px; padding: 12px; }
  .board.n4 .cell { font-size: calc(var(--bs) * .15); border-radius: 14px; }
  .board.n4 .cell.filled .emoji { animation: piecedrop .5s cubic-bezier(.3,1.2,.5,1); }
  @keyframes piecedrop { 0%{transform:translateY(-320%) scale(.9);opacity:.5} 60%{transform:translateY(0) scale(1.1,.85);opacity:1} 80%{transform:translateY(-14%) scale(.95,1.08)} 100%{transform:translateY(0) scale(1)} }
  .board.n4 .cell.drop { background: linear-gradient(180deg, #ffe9a8, #fff4cf); }
  /* Línea ganadora con brillo */
  .winline { position: absolute; inset: 14px; width: calc(100% - 28px); height: calc(100% - 28px); pointer-events: none; z-index: 2; overflow: visible; display: none; }
  .winline.show { display: block; }
  .winline line { stroke-linecap: round; stroke-dasharray: 1; stroke-dashoffset: 1; animation: drawline .6s ease-out forwards; }
  .winline .glow { stroke: rgba(255,200,40,.45); stroke-width: 34; animation-delay: .05s; }
  .winline .core { stroke: url(#wl); stroke-width: 16; }
  .winline .hi { stroke: rgba(255,255,255,.8); stroke-width: 5; animation-delay: .12s; }
  @keyframes drawline { to { stroke-dashoffset: 0; } }
  .foot { flex: 0 0 auto; display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; align-items: center; }
  .foot .btn { font-size: 20px; min-height: 64px; padding: 6px 16px; }
  .foot .btn.on { box-shadow: 0 0 0 4px #2cb67d, 0 6px 0 var(--d), 0 12px 18px rgba(0,0,0,.22), inset 0 2px 0 rgba(255,255,255,.6); }
  .foot .lvbtn { width: 60px; height: 60px; min-width: 60px; min-height: 60px; padding: 0; font-size: 26px; border-radius: 50%; }
  .spark { position: fixed; left: 0; top: 0; z-index: 45; pointer-events: none; font-size: 26px; animation: sparkfly 1s ease-out forwards; }
  @keyframes sparkfly { 0%{transform:translate(-50%,-50%) scale(.4);opacity:1} 100%{transform:translate(calc(-50% + var(--dx)), calc(-50% + var(--dy))) scale(1.4) rotate(200deg);opacity:0} }
  /* pantalla de elección */
  .pick { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px; z-index: 3;
    background: radial-gradient(circle at 50% 30%, rgba(255,255,255,.55), rgba(255,255,255,0) 60%), linear-gradient(180deg, rgba(143,214,255,.6), rgba(255,250,240,.75)); }
  .pick .box { display: flex; flex-direction: column; align-items: center; gap: 18px; padding: 22px 26px; max-width: 94vw; animation: pop .4s ease-out; }
  .pick h2 { margin: 0; font-size: 30px; text-align: center; color: #ff6f61; text-shadow: 0 2px 0 #fff, 0 4px 8px rgba(0,0,0,.15); }
  .pick .choices { display: flex; gap: 16px; flex-wrap: wrap; justify-content: center; }
  .pick .choice { width: 112px; height: 112px; font-size: 62px; border-radius: 50%; padding: 0; }
  .pick .choice .emoji { animation: float 3s ease-in-out infinite; }
  .pick .choice:nth-child(2) .emoji { animation-delay: -.8s; } .pick .choice:nth-child(3) .emoji { animation-delay: -1.6s; } .pick .choice:nth-child(4) .emoji { animation-delay: -2.4s; }
  .pick .choice.taken { opacity: .3; pointer-events: none; }
  .pick .mode { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
  @media (orientation: landscape) {
    .game { flex-direction: row; justify-content: center; }
    .side { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px; flex: 0 0 auto; width: 320px; padding: 18px 10px; }
    .boardwrap { flex: 1 1 0; align-self: stretch; }
  }
</style>
</head>
<body>
<script src="../common.js"></script>
<script>
var game = KidsGame.init({ title: 'Tres en raya' });
(function () {
  var PIECES = ['🐱', '🐶', '🦄', '🌟'];
  var BOTS = ['🤖', '🐭'];
  var PALS = [ { a: '#ff9ccb', b: '#f0569a', d: '#b8306f' }, { a: '#7dd0ff', b: '#2f95e8', d: '#1a63a8' }, { a: '#8ef0b0', b: '#24b36c', d: '#14784a' }, { a: '#ffe98a', b: '#ffb703', d: '#c47f00' } ];
  // Líneas ganadoras: 3 en raya (3x3) o 4 en raya (4x4)
  function linesFor(n) {
    var L = [], i, j, row, col;

    return L;
  }

  // Nivel del robot: 1 = 15% listo, 2 = 75% listo, 3 = perfecto (empatar es ganar),

  game.innerHTML = '';
  var side = document.createElement('div'); side.className = 'side panel';

  boardEl = document.createElement('div'); boardEl.className = 'board';

  foot.innerHTML = '<button class="btn purple mode-btn">👧👦 Dos jugadores</button><button class="btn blue new-btn">🔄 Nuevo</button><button class="btn yellow lvbtn" aria-label="Nivel">🎚️</button>';
  badgeEl = KidsGame.levelBadge(nivel); foot.insertBefore(badgeEl, foot.firstChild);
  wrap.appendChild(boardEl);
  side.appendChild(scoreEl); side.appendChild(turnEl); side.appendChild(foot);
  game.appendChild(side); game.appendChild(wrap);
  function buildBoard(n) {
    N = n; LINES = linesFor(n); GRAVITY = n === 4;
    cells.forEach(function (c) { c.remove(); }); cells = [];

    boardEl.style.gridTemplateColumns = 'repeat(' + n + ', 1fr)'; boardEl.style.gridTemplateRows = 'repeat(' + n + ', 1fr)';

    }
  }
  buildBoard(3);
  lineSvg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
  lineSvg.setAttribute('class', 'winline'); lineSvg.setAttribute('viewBox', '0 0 300 300'); lineSvg.setAttribute('preserveAspectRatio', 'none');
  lineSvg.innerHTML = '<defs><linearGradient id="wl" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="300" y2="300"><stop offset="0" stop-color="#ffd166"/><stop offset=".5" stop-color="#ff8906"/><stop offset="1" stop-color="#ff5fa0"/></linearGradient></defs>' +
    '<line class="glow" pathLength="1"/><line class="core" pathLength="1"/><line class="hi" pathLength="1"/>';
  boardEl.appendChild(lineSvg);
  pickEl = document.createElement('div'); pickEl.className = 'pick';
  game.appendChild(pickEl);

  function order() {
    // Vertical: marcador, turno, tablero, botones. Horizontal: panel lateral + tablero
    var land = window.innerWidth > window.innerHeight;
    if (land) { if (scoreEl.parentNode !== side) { side.appendChild(scoreEl); side.appendChild(turnEl); side.appendChild(foot); } if (side.parentNode !== game) game.insertBefore(side, wrap); }
    else { game.insertBefore(scoreEl, wrap); game.insertBefore(turnEl, wrap); game.appendChild(foot); if (side.parentNode) side.parentNode.removeChild(side); }
    layout();
  }
  function layout() {
    var W = wrap.clientWidth - 8, H = wrap.clientHeight - 8;
    var s = Math.max(200, Math.min(W, H, 560));

  // --- Elegir ficha ---
  function showPick(who) {
    pickEl.innerHTML = '';
    var box = document.createElement('div'); box.className = 'box panel';
    var h = document.createElement('h2');
    h.textContent = who === 1 ? (twoPlayers ? '👧 Jugador 1: elige tu ficha' : '¿Con cuál quieres jugar?') : '👦 Jugador 2: elige tu ficha';
    var ch = document.createElement('div'); ch.className = 'choices';
    PIECES.forEach(function (e, idx) {
      var b = document.createElement('button'); b.className = 'btn choice'; b.innerHTML = '<span class="emoji">' + e + '</span>';
      if (who === 2 && e === p1) b.classList.add('taken');
      var pal = PALS[idx % PALS.length]; b.style.setProperty('--a', pal.a); b.style.setProperty('--b', pal.b); b.style.setProperty('--d', pal.d);
      b.addEventListener('pointerdown', function (ev) {
        ev.preventDefault(); KidsGame.sound.pop();
        if (who === 1) { p1 = e; if (twoPlayers) showPick(2); else { p2 = KidsGame.pick(BOTS); startGame(); } }
        else { p2 = e; startGame(); }
      });
      ch.appendChild(b);
    });
    box.appendChild(h); box.appendChild(ch);
    if (who === 1) {
      var m = document.createElement('div'); m.className = 'mode';
      var b1 = document.createElement('button'); b1.className = 'btn ' + (twoPlayers ? '' : 'green on'); b1.textContent = '🤖 Contra el robot';
      var b2 = document.createElement('button'); b2.className = 'btn ' + (twoPlayers ? 'green on' : ''); b2.textContent = '👧👦 Dos jugadores';
      b1.style.fontSize = b2.style.fontSize = '20px';
      b1.addEventListener('pointerdown', function (ev) { ev.preventDefault(); KidsGame.sound.tap(); twoPlayers = false; showPick(1); });
      b2.addEventListener('pointerdown', function (ev) { ev.preventDefault(); KidsGame.sound.tap(); twoPlayers = true; showPick(1); });
      m.appendChild(b1); m.appendChild(b2); box.appendChild(m);
    }
    pickEl.appendChild(box);
    pickEl.style.display = 'flex';
    KidsGame.say(who === 1 ? 'Elige tu ficha' : 'Jugador dos, elige tu ficha');
  }

  function startGame() {
    pickEl.style.display = 'none';
    score = [0, 0]; renderScore();
    foot.querySelector('.mode-btn').textContent = twoPlayers ? '🤖 Contra el robot' : '👧👦 Dos jugadores';
    newRound(true);
  }
  function newRound(firstIsP1) {
    board = []; for (var k = 0; k < N * N; k++) board.push(0); over = false; busy = false;
    cells.forEach(function (c) { c.className = 'cell card'; c.firstChild.textContent = ''; });
    lineSvg.classList.remove('show');
    turn = firstIsP1 ? 1 : 2;
    renderTurn();
    if (turn === 2 && !twoPlayers) botMove();
  }
  function renderScore() {
    scoreEl.innerHTML = '<span class="p"><span class="emoji">' + p1 + '</span> ' + stars(score[0]) + '</span><span class="vs">·</span><span class="p"><span class="emoji">' + p2 + '</span> ' + stars(score[1]) + '</span>';
  }
  function stars(n) { return n ? '⭐'.repeat(Math.min(n, 5)) + (n > 5 ? ' ' + n : '') : '–'; }
  function renderTurn() {
    var e = turn === 1 ? p1 : p2;
    var txt = twoPlayers ? 'Turno de ' : (turn === 1 ? (GRAVITY ? '¡Tu turno! 4 en raya' : '¡Tu turno!') : 'Piensa...');
    turnEl.innerHTML = '<span>' + txt + '</span><span class="emoji bounce">' + e + '</span>';
  }

  function onCell(ev) {
    ev.preventDefault();
    if (over || busy) return;
    if (turn === 2 && !twoPlayers) return;
    var i = parseInt(this.dataset.i, 10);
    if (GRAVITY) { var d = dropIndex(board, i % N); if (d < 0) { KidsGame.sound.wrong(); this.classList.remove('bad'); void this.offsetWidth; this.classList.add('bad'); return; } i = d; }
    if (board[i]) { KidsGame.sound.wrong(); this.classList.remove('bad'); void this.offsetWidth; this.classList.add('bad'); return; }
    play(i, turn);
  }
  // Gravedad: la ficha cae a la casilla libre más baja de la columna (-1 si está llena)
  function dropIndex(b, col) { for (var r = N - 1; r >= 0; r--) if (!b[r * N + col]) return r * N + col; return -1; }
  function legalMoves(b) {
    var m = [], i;

    else for (i = 0; i < b.length; i++) if (!b[i]) m.push(i);
    return m;
  }
  function play(i, who) {
    board[i] = who;
    cells[i].classList.add('filled'); cells[i].firstChild.textContent = who === 1 ? p1 : p2;
    KidsGame.sound.pop(); KidsGame.vibrate(20);
    var w = winner();
    if (w) return finish(w);
    if (board.indexOf(0) < 0) return finish(0);

    renderTurn();
    if (turn === 2 && !twoPlayers) botMove();
  }
  function lineOwner(b, l) {
    var w = b[l[0]]; if (!w) return 0;
    for (var j = 1; j < l.length; j++) if (b[l[j]] !== w) return 0;
    return w;
  }
  function winner() {
    for (var k = 0; k < LINES.length; k++) { var w = lineOwner(board, LINES[k]); if (w) return { who: w, line: LINES[k] }; }
    return null;
  }
  // Robot: nivel 1 = 15% listo, nivel 2 = 75% listo (gana o bloquea), nivel 3 = perfecto (minimax),
  // nivel 4 = gana/bloquea y mira 3 jugadas adelante (alfa-beta con heurística)
  function botMove() {
    busy = true;
    setTimeout(function () {
      if (over) return;
      var free = legalMoves(board);
      if (!free.length) return;
      var choice = null;
      if (nivel >= 3) choice = bestMove(2);
      else if (Math.random() < (nivel === 2 ? 0.75 : 0.15)) choice = findLine(2) != null ? findLine(2) : findLine(1);
      if (choice == null) choice = KidsGame.pick(free);
      busy = false;
      play(choice, 2);

  function findLine(who) {
    var legal = legalMoves(board);
    for (var k = 0; k < LINES.length; k++) {
      var l = LINES[k], cnt = 0, empty = -1;
      for (var j = 0; j < l.length; j++) { if (board[l[j]] === who) cnt++; else if (!board[l[j]]) empty = l[j]; }

    return null;
  }
  function winOf(b) {
    for (var k = 0; k < LINES.length; k++) { var w = lineOwner(b, LINES[k]); if (w) return w; }
    return 0;
  }
  // Heurística 4x4: líneas abiertas para el robot cuentan a favor, para la niña en contra
  var HW = [0, 1, 12, 120, 10000];
  function heur(b) {
    var sc = 0;
    for (var k = 0; k < LINES.length; k++) {
      var l = LINES[k], r = 0, h = 0;

      if (r && h) continue;
      sc += HW[r] - HW[h];
    }
    return sc;
  }
  function alphabeta(b, who, depth, alpha, beta) {
    var w = winOf(b);
    if (w === 2) return 10000 + depth; if (w === 1) return -10000 - depth;
    var moves = legalMoves(b);
    if (!moves.length) return 0;
    if (depth === 0) return heur(b);
    var best = who === 2 ? -Infinity : Infinity;
    for (var i = 0; i < moves.length; i++) {
      b[moves[i]] = who; var v = alphabeta(b, who === 2 ? 1 : 2, depth - 1, alpha, beta); b[moves[i]] = 0;
      if (who === 2) { if (v > best) best = v; if (v > alpha) alpha = v; } else { if (v < best) best = v; if (v < beta) beta = v; }

    for (var i = 0; i < 9; i++) {
      if (b[i]) continue;

      if (who === 2 ? v > best : v < best) best = v;

    return best;
  }
  function bestMove(who) {
    who = who || 2;
    var best = -Infinity, moves = [], legal = legalMoves(board), opp = who === 2 ? 1 : 2;
    for (var k = 0; k < legal.length; k++) {
      var i = legal[k], v;
      board[i] = who;
      if (GRAVITY) { v = alphabeta(board, opp, 6, -Infinity, Infinity); if (who === 1) v = -v; }
      else { v = minimax(board, opp, 1); if (who === 1) v = -v; }
      board[i] = 0;
      if (v > best) { best = v; moves = [i]; } else if (v === best) moves.push(i);
    }
    return moves.length ? KidsGame.pick(moves) : null;
  }

  function drawLine(l) {
    var C = N === 4 ? [37.5, 112.5, 187.5, 262.5] : [50, 150, 250], a = l[0], b = l[l.length - 1];
    var x1 = C[a % N], y1 = C[Math.floor(a / N)], x2 = C[b % N], y2 = C[Math.floor(b / N)];
    // alarga un poco la línea hacia afuera de las casillas
    var dx = x2 - x1, dy = y2 - y1, len = Math.sqrt(dx * dx + dy * dy), ex = dx / len * 22, ey = dy / len * 22;
    lineSvg.querySelectorAll('line').forEach(function (ln) {
      ln.setAttribute('x1', x1 - ex); ln.setAttribute('y1', y1 - ey); ln.setAttribute('x2', x2 + ex); ln.setAttribute('y2', y2 + ey);
    });
    lineSvg.classList.remove('show'); void lineSvg.offsetWidth; lineSvg.classList.add('show');
  }
  function burst(els, n) {
    els.forEach(function (el) {
      var r = el.getBoundingClientRect(), cx = r.left + r.width / 2, cy = r.top + r.height / 2;
      for (var i = 0; i < (n || 7); i++) {
        var d = document.createElement('div'); d.className = 'spark emoji'; d.textContent = KidsGame.pick(['✨', '⭐', '🌟', '💫']);
        var a = Math.random() * Math.PI * 2, dist = 60 + Math.random() * 90;
        d.style.left = cx + 'px'; d.style.top = cy + 'px';
        d.style.setProperty('--dx', Math.cos(a) * dist + 'px'); d.style.setProperty('--dy', Math.sin(a) * dist - 30 + 'px');
        d.style.animationDelay = (Math.random() * .3) + 's';
        document.body.appendChild(d);
        (function (el2) { setTimeout(function () { el2.remove(); }, 1500); })(d);
      }
    });
  }

  function finish(w) {
    over = true; busy = true;
    turnEl.innerHTML = '';
    if (w === 0) {
      if (nivel >= 3 && !twoPlayers) {
        // Contra el robot perfecto/experto, empatar es ganar
        KidsGame.sound.win(); KidsGame.addStar(); KidsGame.vibrate(60); burst(cells, 4);
        setTimeout(function () {
          KidsGame.levelDone(nivel);
          KidsGame.celebrate({ msg: '¡Empate! 🤝', sub: nivel === 4 ? '¡Le empataste al robot experto! ¡Eso es ganar!' : '¡Le empataste al robot perfecto! ¡Eso es ganar!', stars: 3, onAgain: function () { newRound(true); } });
        }, 900);
        return;
      }
      KidsGame.toast('¡Empate! 🤝', 1500); KidsGame.addStar(1); KidsGame.sound.ok();
      setTimeout(function () {
        KidsGame.celebrate({ msg: '¡Empate! 🤝', sub: 'Los dos jugaron muy bien', stars: 1, say: false, onAgain: function () { newRound(true); } });
      }, 900);
      return;
    }
    w.line.forEach(function (i) { cells[i].classList.add('win'); });
    drawLine(w.line);
    score[w.who - 1]++; renderScore();
    var pieceWon = w.who === 1 ? p1 : p2;
    if (w.who === 1 || twoPlayers) {
      KidsGame.sound.win(); KidsGame.addStar(); KidsGame.vibrate(60);
      burst(w.line.map(function (i) { return cells[i]; }));
      setTimeout(function () {
        if (!twoPlayers) KidsGame.levelDone(nivel);
        KidsGame.celebrate({
          msg: twoPlayers ? '¡Ganó ' + pieceWon + '!' : '¡Ganaste!', sub: pieceWon + ' hizo ' + (N === 4 ? 'cuatro' : 'tres') + ' en raya',
          onAgain: function () { newRound(w.who !== 1); }
        });
      }, 1100);
    } else {
      // El robot ganó: sin drama, otra vez
      KidsGame.sound.pop(); KidsGame.toast('¡Casi! Otra vez 💪', 1800); KidsGame.say('¡Casi! Otra vez');
      setTimeout(function () { newRound(true); }, 2000);
    }
  }

  foot.querySelector('.mode-btn').addEventListener('pointerdown', function (ev) {
    ev.preventDefault(); KidsGame.sound.tap(); twoPlayers = !twoPlayers; p1 = p2 = null; showPick(1);
  });
  foot.querySelector('.new-btn').addEventListener('pointerdown', function (ev) {
    ev.preventDefault(); KidsGame.sound.tap(); p1 = p2 = null; showPick(1);
  });
  function showPicker() {
    over = true; busy = true; pickEl.style.display = 'none';
    KidsGame.levelPicker({ key: 'gato', labels: LABELS, onPick: function (n) {
      nivel = n;
      var nb = KidsGame.levelBadge(nivel); foot.replaceChild(nb, badgeEl); badgeEl = nb;
      buildBoard(n === 4 ? 4 : 3); layout();
      if (n === 4) { KidsGame.toast('Las fichas caen: ¡4 en raya! 🪂', 2200); }
      p1 = p2 = null; showPick(1);
    } });
  }
  // Expuesto para pruebas
  window.__gato = { state: function () { return { board: board ? board.slice() : null, n: N, turn: turn, over: over, busy: busy, nivel: nivel, twoPlayers: twoPlayers, score: score.slice(), gravity: GRAVITY }; },
    best: function () { return bestMove(1); }, legal: function () { return legalMoves(board); } };
  foot.querySelector('.lvbtn').addEventListener('pointerdown', function (ev) { ev.preventDefault(); KidsGame.sound.tap(); showPicker(); });

  window.addEventListener('resize', order);
  order();
  showPicker();
})();
</script>
</body>
</html>
