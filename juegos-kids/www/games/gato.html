<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">

<title>Tres en raya</title>
<style>
  /* ===== Mundo: "La granja" — cielo, granero, pacas de heno y fichas de animalitos de granja en SVG ===== */
  .game { display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 8px; gap: 10px;

      radial-gradient(ellipse 60% 24% at 20% 40%, #7ccb5e 0 60%, rgba(0,0,0,0) 61%),
      radial-gradient(ellipse 60% 22% at 85% 42%, #6fc256 0 60%, rgba(0,0,0,0) 61%),

  .game::before { content: ""; position: absolute; left: 0; right: 0; top: 41%; height: 6%; z-index: 0; pointer-events: none; opacity: .9;

  .score { flex: 0 0 auto; display: flex; align-items: center; gap: 14px; padding: 6px 20px; font-size: 24px; border-radius: 30px; border: 3px solid #fff; position: relative; z-index: 2;

  .score .p svg { width: 40px; height: 40px; }
  .score .vs { color: #a9b4cc; }
  .turn { flex: 0 0 auto; display: flex; align-items: center; gap: 10px; font-size: 24px; min-height: 56px; padding: 4px 18px; border-radius: 30px; position: relative; z-index: 2;

  .boardwrap { flex: 1 1 0; min-height: 0; min-width: 0; width: 100%; display: flex; align-items: center; justify-content: center; position: relative; z-index: 1; }
  /* Tablero: cerca de madera con casillas de heno (temas desbloqueables) */

    position: relative; display: grid; grid-template-columns: repeat(3, 1fr); grid-template-rows: repeat(3, 1fr); gap: 10px; width: var(--bs); height: var(--bs);
    padding: 14px; border-radius: 28px; border: 4px solid var(--frame);

      repeating-linear-gradient(180deg, rgba(255,255,255,.06) 0 6px, rgba(0,0,0,0) 6px 11px, rgba(60,30,0,.07) 11px 16px, rgba(0,0,0,0) 16px 26px),

    box-shadow: 0 12px 0 var(--edge), 0 24px 34px rgba(0,0,0,.35), inset 0 3px 0 rgba(255,255,255,.35), inset 0 -4px 8px rgba(60,30,0,.25);
    transition: transform .35s cubic-bezier(.2,1.3,.4,1), opacity .3s; }
  .board.out { transform: scale(.9); opacity: 0; }
  .board.t-heno { --bg1: #f2d27a; --bg2: #d9ad4a; --bg3: #b8862a; --edge: #8a6014; --frame: #fff0b8; --c1: #fff6d6; --c2: #fffdf2; }
  .board.t-flores { --bg1: #ffb3d1; --bg2: #ff8fb6; --bg3: #e0608f; --edge: #9c2f5a; --frame: #ffe0ec; --c1: #fff0f6; --c2: #ffffff; --cin: rgba(120,20,60,.28); }
  .board.t-noche { --bg1: #6a5a9e; --bg2: #4a3c7e; --bg3: #2e2456; --edge: #1a1236; --frame: #b8a8ff; --c1: #e6e0ff; --c2: #f7f4ff; --cin: rgba(20,10,60,.4); }
  .board.t-arcoiris { --bg1: #ff8a80; --bg2: #ffd166; --bg3: #7dd0ff; --edge: #5232b3; --frame: #fff; --c1: #f3fff0; --c2: #ffffff; }
  .board.t-arcoiris { background: linear-gradient(135deg, #ff8a80 0%, #ffd166 25%, #8ef0b0 50%, #7dd0ff 75%, #b39cff 100%); }
  .cell { position: relative; border-radius: 18px; min-width: 64px; min-height: 64px; border: 0; padding: 0;
    background: linear-gradient(180deg, var(--c1) 0%, var(--c2) 100%);
    box-shadow: inset 0 5px 10px var(--cin), inset 0 -2px 0 rgba(255,255,255,.9), inset 3px 0 6px rgba(60,30,0,.1), 0 1px 0 rgba(255,255,255,.35);
    transition: transform .12s, box-shadow .12s, background .2s; display: flex; align-items: center; justify-content: center; }
  .cell::after { display: none; }
  .cell:active { transform: none; background: linear-gradient(180deg, #ffe9a8, #fff4cf); }
  .cell svg { width: 78%; height: 78%; display: block; position: relative; z-index: 1; overflow: visible; }

  .cell.win svg { animation: cheer .5s ease-in-out infinite; }

  .cell.hint { background: #f3efff; }
  .board.n4 { gap: 8px; padding: 12px; }

  .winline { position: absolute; inset: 14px; width: calc(100% - 28px); height: calc(100% - 28px); pointer-events: none; z-index: 2; overflow: visible; display: none; }
  .winline.show { display: block; }
  .winline line { stroke-linecap: round; stroke-dasharray: 1; stroke-dashoffset: 1; animation: drawline .6s ease-out forwards; }
  .winline .glow { stroke: rgba(255,200,40,.45); stroke-width: 34; animation-delay: .05s; }
  .winline .core { stroke: url(#wl); stroke-width: 16; }
  .winline .hi { stroke: rgba(255,255,255,.8); stroke-width: 5; animation-delay: .12s; }
  @keyframes drawline { to { stroke-dashoffset: 0; } }
  .foot { flex: 0 0 auto; display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; align-items: center; position: relative; z-index: 2; }

  /* pantalla de elección de ficha */
  .pick { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px; z-index: 3;

  .pick .box { display: flex; flex-direction: column; align-items: center; gap: 18px; padding: 22px 26px; max-width: 94vw; animation: pop .4s ease-out; }

  .pick .choices { display: flex; gap: 16px; flex-wrap: wrap; justify-content: center; }

  .pick .choice.taken { opacity: .3; pointer-events: none; }
  .pick .mode { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
  @media (orientation: landscape) {
    .game { flex-direction: row; justify-content: center; }
    .side { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px; flex: 0 0 auto; width: 320px; padding: 18px 10px; position: relative; z-index: 2; }
    .boardwrap { flex: 1 1 0; align-self: stretch; }
  }
  @media (max-width: 700px) { .barn { width: 120px; height: 106px; } .hay { width: 90px; height: 60px; } }
</style>

  var LABELS = { 1: 'Robot distraído', 2: 'Robot listo', 3: 'Robot perfecto', 4: '4 en raya, fichas caen' };
  var scoreEl, turnEl, wrap, boardEl, foot, pickEl, cells = [], lineSvg, bannerEl;

  game.innerHTML = '<div class="barn">' + barnSVG() + '</div><div class="hay">' + haySVG() + '</div><span class="deco" style="left:14%;bottom:4%">🌻</span><span class="deco" style="right:6%;bottom:6%;animation-delay:-1.5s">🐑</span><span class="deco" style="left:4%;bottom:12%;font-size:34px;animation-delay:-2.5s">🐥</span>';
  var side = document.createElement('div'); side.className = 'side panel';
  scoreEl = document.createElement('div'); scoreEl.className = 'score';
  turnEl = document.createElement('div'); turnEl.className = 'turn';
  wrap = document.createElement('div'); wrap.className = 'boardwrap';
  boardEl = document.createElement('div'); boardEl.className = 'board';
  foot = document.createElement('div'); foot.className = 'foot';
  foot.innerHTML = '<button class="btn purple mode-btn">👧👦 Dos jugadores</button><button class="btn blue new-btn">🔄 Nuevo</button><button class="btn green thbtn" aria-label="Tema">🎨</button><button class="btn yellow lvbtn" aria-label="Nivel">🎚️</button>';
  badgeEl = KidsGame.levelBadge(nivel); foot.insertBefore(badgeEl, foot.firstChild);
  bannerEl = document.createElement('div'); bannerEl.className = 'banner';
  wrap.appendChild(boardEl);
  side.appendChild(scoreEl); side.appendChild(turnEl); side.appendChild(foot);
  game.appendChild(side); game.appendChild(wrap); game.appendChild(bannerEl);
  var bannerT = null;
  function banner(txt, gold, ms) { clearTimeout(bannerT); bannerEl.textContent = txt; bannerEl.className = 'banner show' + (gold ? ' gold' : ''); bannerT = setTimeout(function () { bannerEl.classList.remove('show'); }, ms || 1100); }
  function applyTheme() {
    if (themesUnlocked().map(function (t) { return t.id; }).indexOf(theme) < 0) theme = 'madera';
    THEMES.forEach(function (t) { boardEl.classList.remove('t-' + t.id); }); boardEl.classList.add('t-' + theme);
    try { localStorage.setItem('kg-gato-tema', JSON.stringify({ sel: theme })); } catch (e) {}
  }
  function cycleTheme() {
    var u = themesUnlocked(), k = 0; u.forEach(function (t, i) { if (t.id === theme) k = i; });
    if (u.length < 2) { KidsGame.sound.tap(); KidsGame.toast('🎨 Gana una partida para más tableros', 1600); return; }
    var nt = u[(k + 1) % u.length]; theme = nt.id; applyTheme(); KidsGame.sound.pop(); KidsGame.toast(nt.e + ' Tablero de ' + nt.n.toLowerCase(), 1200); KidsGame.fx.burstAt(boardEl, { n: 10, chars: ['✨'] });
  }
  function checkThemeUnlock(before) { var after = themesUnlocked(); if (after.length > before) { var t = after[after.length - 1]; KidsGame.toast('🎨 ¡Nuevo tablero: ' + t.e + ' ' + t.n + '! Toca 🎨', 2600); } }
  function buildBoard(n) {
    N = n; LINES = linesFor(n); GRAVITY = n === 4;
    cells.forEach(function (c) { c.remove(); }); cells = [];
    boardEl.classList.toggle('n4', n === 4);
    boardEl.style.gridTemplateColumns = 'repeat(' + n + ', 1fr)'; boardEl.style.gridTemplateRows = 'repeat(' + n + ', 1fr)';
    for (var i = 0; i < n * n; i++) {
      var c = document.createElement('div'); c.className = 'cell card'; c.dataset.i = i;
      c.addEventListener('pointerdown', onCell); boardEl.insertBefore(c, lineSvg || null); cells.push(c);
    }
  }
  buildBoard(3);
  lineSvg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
  lineSvg.setAttribute('class', 'winline'); lineSvg.setAttribute('viewBox', '0 0 300 300'); lineSvg.setAttribute('preserveAspectRatio', 'none');
  lineSvg.innerHTML = '<defs><linearGradient id="wl" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="300" y2="300"><stop offset="0" stop-color="#ffd166"/><stop offset=".5" stop-color="#ff8906"/><stop offset="1" stop-color="#ff5fa0"/></linearGradient></defs>' +
    '<line class="glow" pathLength="1"/><line class="core" pathLength="1"/><line class="hi" pathLength="1"/>';
  boardEl.appendChild(lineSvg);
  pickEl = document.createElement('div'); pickEl.className = 'pick';
  game.appendChild(pickEl);
  applyTheme();

  function order() {
    var land = window.innerWidth > window.innerHeight;
    if (land) { if (scoreEl.parentNode !== side) { side.appendChild(scoreEl); side.appendChild(turnEl); side.appendChild(foot); } if (side.parentNode !== game) game.insertBefore(side, wrap); }
    else { game.insertBefore(scoreEl, wrap); game.insertBefore(turnEl, wrap); game.insertBefore(foot, bannerEl); if (side.parentNode) side.parentNode.removeChild(side); }
    layout();
  }
  function layout() {
    var W = wrap.clientWidth - 8, H = wrap.clientHeight - 8;
    var s = Math.max(200, Math.min(W, H, 560));
    game.style.setProperty('--bs', s + 'px');
  }

  // --- Elegir ficha ---
  function showPick(who) {
    pickEl.innerHTML = '';
    var box = document.createElement('div'); box.className = 'box panel';
    var h = document.createElement('h2');
    h.textContent = who === 1 ? (twoPlayers ? '👧 Jugador 1: elige tu ficha' : '¿Con cuál quieres jugar?') : '👦 Jugador 2: elige tu ficha';
    var ch = document.createElement('div'); ch.className = 'choices';
    PLAYER_PIECES.forEach(function (id, idx) {
      var b = document.createElement('button'); b.className = 'btn choice'; b.innerHTML = pieceSVG(id);
      if (who === 2 && id === p1) b.classList.add('taken');
      var pal = PIECES[id].pal; b.style.setProperty('--a', pal.a); b.style.setProperty('--b', pal.b); b.style.setProperty('--d', pal.d);
      b.addEventListener('pointerdown', function (ev) {
        ev.preventDefault(); KidsGame.sound.pop(); KidsGame.fx.burstAt(b, { n: 8, chars: ['✨', '⭐'] });
        if (who === 1) { p1 = id; if (twoPlayers) showPick(2); else { p2 = id === 'gallina' ? 'zorro' : (id === 'zorro' ? 'gallina' : KidsGame.pick(['tractor', id === 'cerdito' ? 'vaquita' : 'cerdito'])); startGame(); } }
        else { p2 = id; startGame(); }
      });
      ch.appendChild(b);
    });
    box.appendChild(h); box.appendChild(ch);
    if (who === 1) {
      var m = document.createElement('div'); m.className = 'mode';
      var b1 = document.createElement('button'); b1.className = 'btn ' + (twoPlayers ? '' : 'green on'); b1.textContent = '🤖 Contra el robot';
      var b2 = document.createElement('button'); b2.className = 'btn ' + (twoPlayers ? 'green on' : ''); b2.textContent = '👧👦 Dos jugadores';
      b1.style.fontSize = b2.style.fontSize = '20px';
      b1.addEventListener('pointerdown', function (ev) { ev.preventDefault(); KidsGame.sound.tap(); twoPlayers = false; showPick(1); });
      b2.addEventListener('pointerdown', function (ev) { ev.preventDefault(); KidsGame.sound.tap(); twoPlayers = true; showPick(1); });
      m.appendChild(b1); m.appendChild(b2); box.appendChild(m);
    }
    pickEl.appendChild(box);
    pickEl.style.display = 'flex';
    KidsGame.say(who === 1 ? 'Elige tu ficha' : 'Jugador dos, elige tu ficha');
  }

  function startGame() {
    pickEl.style.display = 'none';
    score = [0, 0]; renderScore(); games = 0;
    foot.querySelector('.mode-btn').textContent = twoPlayers ? '🤖 Contra el robot' : '👧👦 Dos jugadores';
    newRound(true);
  }
  function newRound(firstIsP1) {
    board = []; for (var k = 0; k < N * N; k++) board.push(0); over = false; busy = false; games++;
    boardEl.classList.add('out');
    setTimeout(function () {
      cells.forEach(function (c) { c.className = 'cell card'; c.innerHTML = ''; });
      lineSvg.classList.remove('show'); boardEl.classList.remove('out');
      turn = firstIsP1 ? 1 : 2;
      renderTurn(); banner('Partida ' + games, false, 900);
      if (turn === 2 && !twoPlayers) botMove();
      else if (nivel === 1 && !handShown && !twoPlayers) { handShown = true; hand = KidsGame.hand({ el: cells[4] }); }
    }, games === 1 ? 0 : 320);
  }
  function renderScore() {
    scoreEl.innerHTML = '<span class="p">' + pieceSVG(p1) + ' ' + stars(score[0]) + '</span><span class="vs">·</span><span class="p">' + pieceSVG(p2) + ' ' + stars(score[1]) + '</span>';
  }
  function stars(n) { return n ? '⭐'.repeat(Math.min(n, 5)) + (n > 5 ? ' ' + n : '') : '–'; }
  function renderTurn() {
    var e = turn === 1 ? p1 : p2;
    var txt = twoPlayers ? 'Turno de ' : (turn === 1 ? (GRAVITY ? '¡Tu turno! 4 en raya' : '¡Tu turno!') : 'Piensa...');
    turnEl.innerHTML = '<span>' + txt + '</span>' + pieceSVG(e).replace('<svg ', '<svg class="bounce" ');
  }

  function onCell(ev) {
    ev.preventDefault();
    if (over || busy) return;
    if (turn === 2 && !twoPlayers) return;
    var i = parseInt(this.dataset.i, 10);
    if (GRAVITY) { var d = dropIndex(board, i % N); if (d < 0) { KidsGame.sound.wrong(); KidsGame.fx.shake(this); return; } i = d; }
    if (board[i]) { KidsGame.sound.wrong(); KidsGame.fx.shake(this); return; }
    play(i, turn);
  }
  function dropIndex(b, col) { for (var r = N - 1; r >= 0; r--) if (!b[r * N + col]) return r * N + col; return -1; }
  function legalMoves(b) {
    var m = [], i;
    if (GRAVITY) { for (i = 0; i < N; i++) { var d = dropIndex(b, i); if (d >= 0) m.push(d); } }
    else for (i = 0; i < b.length; i++) if (!b[i]) m.push(i);
    return m;
  }
  function play(i, who) {
    board[i] = who;
    cells[i].classList.add('filled'); cells[i].innerHTML = pieceSVG(who === 1 ? p1 : p2);
    KidsGame.sound.pop(); KidsGame.vibrate(20);
    if (who === 1 || twoPlayers) KidsGame.fx.burstAt(cells[i], { n: 6, r: 50 });
    var w = winner();
    if (w) return finish(w);
    if (board.indexOf(0) < 0) return finish(0);
    turn = who === 1 ? 2 : 1;
    renderTurn();
    if (turn === 2 && !twoPlayers) botMove();
  }
  function lineOwner(b, l) {
    var w = b[l[0]]; if (!w) return 0;
    for (var j = 1; j < l.length; j++) if (b[l[j]] !== w) return 0;
    return w;
  }
  function winner() {
    for (var k = 0; k < LINES.length; k++) { var w = lineOwner(board, LINES[k]); if (w) return { who: w, line: LINES[k] }; }
    return null;
  }
  function botMove() {
    busy = true;
    setTimeout(function () {
      if (over) return;
      var free = legalMoves(board);
      if (!free.length) return;
      var choice = null;
      if (nivel >= 3) choice = bestMove(2);
      else if (Math.random() < (nivel === 2 ? 0.75 : 0.15)) choice = findLine(2) != null ? findLine(2) : findLine(1);
      if (choice == null) choice = KidsGame.pick(free);
      busy = false;
      play(choice, 2);
    }, 700);
  }
  function findLine(who) {
    var legal = legalMoves(board);
    for (var k = 0; k < LINES.length; k++) {
      var l = LINES[k], cnt = 0, empty = -1;
      for (var j = 0; j < l.length; j++) { if (board[l[j]] === who) cnt++; else if (!board[l[j]]) empty = l[j]; }
      if (cnt === l.length - 1 && empty >= 0 && legal.indexOf(empty) >= 0) return empty;
    }
    return null;
  }
  function winOf(b) {
    for (var k = 0; k < LINES.length; k++) { var w = lineOwner(b, LINES[k]); if (w) return w; }
    return 0;
  }
  var HW = [0, 1, 12, 120, 10000];
  function heur(b) {
    var sc = 0;
    for (var k = 0; k < LINES.length; k++) {
      var l = LINES[k], r = 0, h = 0;
      for (var j = 0; j < l.length; j++) { if (b[l[j]] === 2) r++; else if (b[l[j]] === 1) h++; }
      if (r && h) continue;
      sc += HW[r] - HW[h];
    }
    return sc;
  }
  function alphabeta(b, who, depth, alpha, beta) {
    var w = winOf(b);
    if (w === 2) return 10000 + depth; if (w === 1) return -10000 - depth;
    var moves = legalMoves(b);
    if (!moves.length) return 0;
    if (depth === 0) return heur(b);
    var best = who === 2 ? -Infinity : Infinity;
    for (var i = 0; i < moves.length; i++) {
      b[moves[i]] = who; var v = alphabeta(b, who === 2 ? 1 : 2, depth - 1, alpha, beta); b[moves[i]] = 0;
      if (who === 2) { if (v > best) best = v; if (v > alpha) alpha = v; } else { if (v < best) best = v; if (v < beta) beta = v; }
      if (beta <= alpha) break;
    }
    return best;
  }
  function minimax(b, who, depth) {
    var w = winOf(b);
    if (w === 2) return 10 - depth; if (w === 1) return depth - 10;
    if (b.indexOf(0) < 0) return 0;
    var best = who === 2 ? -99 : 99;
    for (var i = 0; i < 9; i++) {
      if (b[i]) continue;
      b[i] = who; var v = minimax(b, who === 2 ? 1 : 2, depth + 1); b[i] = 0;
      if (who === 2 ? v > best : v < best) best = v;
    }
    return best;
  }
  function bestMove(who) {
    who = who || 2;
    var best = -Infinity, moves = [], legal = legalMoves(board), opp = who === 2 ? 1 : 2;
    for (var k = 0; k < legal.length; k++) {
      var i = legal[k], v;
      board[i] = who;
      if (GRAVITY) { v = alphabeta(board, opp, 6, -Infinity, Infinity); if (who === 1) v = -v; }
      else { v = minimax(board, opp, 1); if (who === 1) v = -v; }
      board[i] = 0;
      if (v > best) { best = v; moves = [i]; } else if (v === best) moves.push(i);
    }
    return moves.length ? KidsGame.pick(moves) : null;
  }

  function drawLine(l) {
    var C = N === 4 ? [37.5, 112.5, 187.5, 262.5] : [50, 150, 250], a = l[0], b = l[l.length - 1];
    var x1 = C[a % N], y1 = C[Math.floor(a / N)], x2 = C[b % N], y2 = C[Math.floor(b / N)];
    var dx = x2 - x1, dy = y2 - y1, len = Math.sqrt(dx * dx + dy * dy), ex = dx / len * 22, ey = dy / len * 22;
    lineSvg.querySelectorAll('line').forEach(function (ln) {
      ln.setAttribute('x1', x1 - ex); ln.setAttribute('y1', y1 - ey); ln.setAttribute('x2', x2 + ex); ln.setAttribute('y2', y2 + ey);
    });
    lineSvg.classList.remove('show'); void lineSvg.offsetWidth; lineSvg.classList.add('show');
  }
  function burst(els) { els.forEach(function (el, k) { setTimeout(function () { KidsGame.fx.burstAt(el, { n: 8, r: 80, chars: ['✨', '⭐', '🌟'] }); }, k * 120); }); }

  function finish(w) {
    over = true; busy = true;
    turnEl.innerHTML = '';
    var before = themesUnlocked().length;
    if (w === 0) {
      if (nivel >= 3 && !twoPlayers) {
        KidsGame.sound.win(); KidsGame.addStar(); KidsGame.vibrate(60); burst(cells.slice(0, 4)); banner('🤝 ¡Empate!', true, 1300);
        setTimeout(function () {
          KidsGame.levelDone(nivel); checkThemeUnlock(before);
          KidsGame.celebrate({ msg: '¡Empate! 🤝', sub: nivel === 4 ? '¡Le empataste al robot experto! ¡Eso es ganar!' : '¡Le empataste al robot perfecto! ¡Eso es ganar!', stars: 3, onAgain: function () { newRound(true); } });
        }, 1000);
        return;
      }
      KidsGame.toast('¡Empate! 🤝', 1500); KidsGame.addStar(1); KidsGame.sound.ok(); banner('🤝 ¡Empate!', false, 1200);
      setTimeout(function () {
        KidsGame.celebrate({ msg: '¡Empate! 🤝', sub: 'Los dos jugaron muy bien', stars: 1, say: false, onAgain: function () { newRound(true); } });
      }, 1000);
      return;
    }
    w.line.forEach(function (i) { cells[i].classList.add('win'); });
    drawLine(w.line);
    score[w.who - 1]++; renderScore();
    var pieceWon = w.who === 1 ? p1 : p2;
    if (w.who === 1 || twoPlayers) {
      KidsGame.sound.win(); KidsGame.addStar(); KidsGame.vibrate(60);
      burst(w.line.map(function (i) { return cells[i]; }));
      banner(twoPlayers ? '🎉 ¡Ganó ' + PIECES[pieceWon].n + '!' : '🎉 ¡Ganaste!', true, 1300);
      if (!twoPlayers) { streak++; var r = boardEl.getBoundingClientRect(); if (streak === 3 || (streak > 3 && streak % 5 === 0)) setTimeout(function () { KidsGame.fx.floatText(r.left + r.width / 2, r.top + 40, '¡Racha x' + streak + '!'); }, 400); if (streak % 5 === 0) setTimeout(function () { KidsGame.addStar(); KidsGame.toast('⭐ ¡Bonus de racha!', 1400); }, 800); }
      setTimeout(function () {
        if (!twoPlayers) { KidsGame.levelDone(nivel); checkThemeUnlock(before); }
        KidsGame.celebrate({
          msg: twoPlayers ? '¡Ganó ' + PIECES[pieceWon].n + '!' : '¡Ganaste!', sub: PIECES[pieceWon].n + ' hizo ' + (N === 4 ? 'cuatro' : 'tres') + ' en raya' + (streak >= 3 && !twoPlayers ? ' · 🔥 racha x' + streak : ''),
          onAgain: function () { newRound(w.who !== 1); }
        });
      }, 1300);
    } else {
      streak = 0;
      KidsGame.sound.pop(); banner('💪 ¡Casi! Otra vez', false, 1500); KidsGame.say('¡Casi! Otra vez');
      setTimeout(function () { newRound(true); }, 2000);
    }
  }

  foot.querySelector('.mode-btn').addEventListener('pointerdown', function (ev) {
    ev.preventDefault(); KidsGame.sound.tap(); twoPlayers = !twoPlayers; p1 = p2 = null; showPick(1);
  });
  foot.querySelector('.new-btn').addEventListener('pointerdown', function (ev) {
    ev.preventDefault(); KidsGame.sound.tap(); p1 = p2 = null; showPick(1);
  });
  foot.querySelector('.thbtn').addEventListener('pointerdown', function (ev) { ev.preventDefault(); ev.stopPropagation(); cycleTheme(); });
  function showPicker() {
    over = true; busy = true; pickEl.style.display = 'none'; if (hand) { hand.stop(); hand = null; }
    KidsGame.levelPicker({ key: 'gato', labels: LABELS, music: 'alegre', art: pieceSVG('gallina').replace('<svg ', '<svg width="60" height="60" '),
      howto: [{ icon: '🐔', text: 'Elige tu animalito de la granja' }, { icon: '👆', text: 'Toca una casilla en tu turno' }, { icon: '3️⃣', text: 'Tres en raya para ganar' }],
      onPick: function (n) {
      nivel = n; streak = 0; handShown = false;
      var nb = KidsGame.levelBadge(nivel); foot.replaceChild(nb, badgeEl); badgeEl = nb;
      buildBoard(n === 4 ? 4 : 3); layout(); applyTheme();
      if (n === 4) { KidsGame.toast('Las fichas caen: ¡4 en raya! 🪂', 2200); }
      p1 = p2 = null; showPick(1);
    } });
  }
  window.__gato = { state: function () { return { board: board ? board.slice() : null, n: N, turn: turn, over: over, busy: busy, nivel: nivel, twoPlayers: twoPlayers, score: score.slice(), gravity: GRAVITY, streak: streak, p1: p1, p2: p2, theme: theme }; },
    best: function () { return bestMove(1); }, legal: function () { return legalMoves(board); } };
  foot.querySelector('.lvbtn').addEventListener('pointerdown', function (ev) { ev.preventDefault(); KidsGame.sound.tap(); showPicker(); });

  window.addEventListener('resize', order);
  order();
  showPicker();
})();
