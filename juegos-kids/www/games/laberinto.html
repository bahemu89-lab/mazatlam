<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<link rel="stylesheet" href="../common.css">
<title>Laberinto</title>
<style>
  .game { display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 8px; gap: 8px; }
  .hud { flex: 0 0 auto; display: flex; align-items: center; gap: 10px; font-size: 22px; }
  .hud .lvl {
    background: linear-gradient(180deg, #ffffff, #eef3ff); border-radius: 30px; padding: 6px 18px; border: 3px solid #fff; font-weight: 900; color: #1f2f6b;
    box-shadow: 0 5px 0 #c9d2e6, 0 10px 16px rgba(20,40,90,.22), inset 0 2px 0 #fff;
  }
  .hud .who { font-size: 30px; display: flex; align-items: center; gap: 4px; }
  .hud .who .m {
    display: inline-flex; align-items: center; justify-content: center; width: 52px; height: 52px; border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, #ffffff 0, #fff4c4 45%, #ffcf5a 100%);
    box-shadow: 0 4px 0 #d9a520, 0 8px 12px rgba(0,0,0,.2), inset 0 2px 0 #fff, 0 0 0 3px #fff;
  }
  .hud .who .arr { font-size: 24px; color: #fff; text-shadow: 0 2px 0 rgba(0,0,0,.25); }
  .area { flex: 1 1 auto; display: flex; align-items: center; justify-content: center; width: 100%; min-height: 0; min-width: 0; }
  .wrap { position: relative; touch-action: none; border-radius: 20px; box-shadow: 0 10px 0 rgba(60,30,0,.28), 0 22px 30px rgba(0,0,0,.3); }
  canvas { display: block; border-radius: 18px; touch-action: none; }
  .piece {
    position: absolute; left: 0; top: 0; display: flex; align-items: center; justify-content: center;
    pointer-events: none; transition: transform .16s ease-out; will-change: transform;
  }
  .piece .emoji { display: block; position: relative; z-index: 1; }
  .piece.char::before {
    content: ""; position: absolute; left: 22%; right: 22%; bottom: 6%; height: 18%; border-radius: 50%;
    background: radial-gradient(ellipse at 50% 50%, rgba(0,0,0,.32), rgba(0,0,0,0) 70%);
  }
  .piece.char .emoji { animation: idle 1.6s ease-in-out infinite; }
  .piece.hop .emoji { animation: hop .5s ease-out 3; }
  .piece .emoji.shake { animation: shake .35s; }
  .piece.goal::before {
    content: ""; position: absolute; inset: 4%; border-radius: 50%;
    background: radial-gradient(circle, rgba(255,250,200,.95) 0, rgba(255,214,80,.6) 45%, rgba(255,190,40,0) 72%);
    animation: goalpulse 1.4s ease-in-out infinite;
  }
  .piece.goal .emoji { animation: wig 1.4s ease-in-out infinite; }
  @keyframes idle { 0%,100%{transform:translateY(0) scale(1,1)} 50%{transform:translateY(-6%) scale(.97,1.04)} }
  @keyframes hop { 0%,100%{transform:translateY(0) scale(1)} 30%{transform:translateY(-32%) scale(1.15,1.25)} 60%{transform:translateY(0) scale(1.2,.85)} }
  @keyframes wig { 0%,100%{transform:rotate(-8deg) scale(1)} 50%{transform:rotate(8deg) scale(1.12)} }
  @keyframes goalpulse { 0%,100%{transform:scale(.85);opacity:.75} 50%{transform:scale(1.15);opacity:1} }
  .pad { flex: 0 0 auto; display: grid; grid-template-columns: repeat(3, 76px); grid-template-rows: repeat(3, 76px); gap: 6px; }
  .pad .btn { width: 76px; height: 76px; min-width: 76px; min-height: 76px; padding: 0; font-size: 34px; border-radius: 24px; }
  .pad .btn svg { width: 46px; height: 46px; overflow: visible; filter: drop-shadow(0 3px 2px rgba(0,0,0,.35)); }
  .pad .btn.up svg { transform: rotate(0deg); }
  .pad .btn.right svg { transform: rotate(90deg); }
  .pad .btn.down svg { transform: rotate(180deg); }
  .pad .btn.left svg { transform: rotate(-90deg); }
  .pad .up { grid-column: 2; grid-row: 1; }
  .pad .left { grid-column: 1; grid-row: 2; }
  .pad .right { grid-column: 3; grid-row: 2; }
  .pad .down { grid-column: 2; grid-row: 3; }
  .pad .mid {
    grid-column: 2; grid-row: 2; display: flex; align-items: center; justify-content: center; font-size: 36px; border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, #ffffff 0, #fff4c4 40%, #ffcf5a 100%);
    box-shadow: 0 5px 0 #d9a520, 0 10px 14px rgba(0,0,0,.22), inset 0 2px 0 #fff, 0 0 0 4px #fff;
  }
  .pad .mid .emoji { animation: float 3s ease-in-out infinite; }
  .spark { position: fixed; left: 0; top: 0; z-index: 45; pointer-events: none; font-size: 26px; animation: sparkfly .9s ease-out forwards; }
  @keyframes sparkfly { 0%{transform:translate(-50%,-50%) scale(.4);opacity:1} 100%{transform:translate(calc(-50% + var(--dx)), calc(-50% + var(--dy))) scale(1.3) rotate(180deg);opacity:0} }
  .side { display: contents; }
  @media (orientation: landscape) {
    .game { flex-direction: row; }
    .area { flex: 1 1 0; align-self: stretch; }
    .side { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px; flex: 0 0 auto; padding: 0 8px; }
    .hud { flex-direction: column; }
  }
</style>
</head>
<body>
<script src="../common.js"></script>
<script>
var game = KidsGame.init({ title: 'Laberinto' });
(function () {
  var LEVELS = [ [5, 5], [7, 7], [9, 9], [11, 9] ];
  var CHARS = [ ['🐰', '🥕'], ['🐱', '🐟'], ['🐶', '🦴'] ];
  var WALLS = ['#f582ae', '#7f5af0', '#3da9fc', '#ff8906', '#2cb67d'];
  var TRAILS = ['#ff5fa0', '#6a4de0', '#1f8fe8', '#ff7a00', '#17a86a'];
  // Paleta de cada pared: claro (luz arriba), medio, oscuro (grosor) y brillo
  function hexRgb(h) { var n = parseInt(h.slice(1), 16); return [(n >> 16) & 255, (n >> 8) & 255, n & 255]; }
  function mix(h, to, t) { var a = hexRgb(h), b = hexRgb(to); return 'rgb(' + a.map(function (v, i) { return Math.round(v + (b[i] - v) * t); }).join(',') + ')'; }
  function rgba(h, al) { return 'rgba(' + hexRgb(h).join(',') + ',' + al + ')'; }

  var level = 0, cols, rows, cells, px, py, gx, gy, trail, done = false, wallColor, trailColor;
  var cell = 40, off = 0;
  var hud, lvlEl, whoEl, area, wrap, canvas, ctx, charEl, goalEl, pad;
  var dragging = false;

  game.innerHTML = '';
  hud = document.createElement('div'); hud.className = 'hud';
  hud.innerHTML = '<span class="lvl">Nivel <b>1</b></span><span class="who"><span class="m emoji"></span><span class="arr">➜</span><span class="m emoji"></span></span>';
  lvlEl = hud.querySelector('b'); whoEl = hud.querySelector('.who');
  area = document.createElement('div'); area.className = 'area';
  wrap = document.createElement('div'); wrap.className = 'wrap';
  canvas = document.createElement('canvas'); ctx = canvas.getContext('2d');
  charEl = document.createElement('div'); charEl.className = 'piece char'; charEl.innerHTML = '<span class="emoji"></span>';
  goalEl = document.createElement('div'); goalEl.className = 'piece goal'; goalEl.innerHTML = '<span class="emoji"></span>';
  wrap.appendChild(canvas); wrap.appendChild(goalEl); wrap.appendChild(charEl);
  area.appendChild(wrap);
  pad = document.createElement('div'); pad.className = 'pad';
  var ARROW = '<svg viewBox="0 0 48 48" aria-hidden="true"><defs><linearGradient id="lbA" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#cfe2ff"/></linearGradient></defs>' +
    '<path d="M24 5 L43 26 H32 V43 H16 V26 H5 Z" fill="url(#lbA)" stroke="#1a63a8" stroke-width="3" stroke-linejoin="round"/>' +
    '<path d="M24 11 L36 24 H29 V38 H19 V24 H12 Z" fill="rgba(255,255,255,.55)"/></svg>';
  pad.innerHTML = '<button class="btn blue up" aria-label="Arriba">' + ARROW + '</button><button class="btn blue left" aria-label="Izquierda">' + ARROW + '</button><div class="mid"><span class="emoji">🧭</span></div><button class="btn blue right" aria-label="Derecha">' + ARROW + '</button><button class="btn blue down" aria-label="Abajo">' + ARROW + '</button>';
  var side = document.createElement('div'); side.className = 'side';
  side.appendChild(hud); side.appendChild(pad);
  game.appendChild(area); game.appendChild(side);
  // En vertical: hud arriba, laberinto en medio, flechas abajo
  function order() {
    var land = window.innerWidth > window.innerHeight;
    if (land) { if (hud.parentNode !== side) { side.insertBefore(hud, pad); } }
    else if (hud.parentNode !== game) { game.insertBefore(hud, area); }
  }
  order();

  // --- Laberinto: recursive backtracker ---
  // Cada celda: bits de paredes: 1=arriba, 2=derecha, 4=abajo, 8=izquierda
  var DX = [0, 1, 0, -1], DY = [-1, 0, 1, 0], OPP = [2, 3, 0, 1];
  function gen(c, r) {
    var i, j, grid = [];
    for (j = 0; j < r; j++) { grid[j] = []; for (i = 0; i < c; i++) grid[j][i] = 15; }
    var seen = [], stack = [[0, 0]];
    for (j = 0; j < r; j++) { seen[j] = []; for (i = 0; i < c; i++) seen[j][i] = false; }
    seen[0][0] = true;
    while (stack.length) {
      var cur = stack[stack.length - 1], x = cur[0], y = cur[1], opts = [];
      for (var d = 0; d < 4; d++) {
        var nx = x + DX[d], ny = y + DY[d];
        if (nx >= 0 && ny >= 0 && nx < c && ny < r && !seen[ny][nx]) opts.push(d);
      }
      if (!opts.length) { stack.pop(); continue; }
      var dir = KidsGame.pick(opts), tx = x + DX[dir], ty = y + DY[dir];
      grid[y][x] &= ~(1 << dir);
      grid[ty][tx] &= ~(1 << OPP[dir]);
      seen[ty][tx] = true;
      stack.push([tx, ty]);
    }
    return grid;
  }
  function open(x, y, d) { return (cells[y][x] & (1 << d)) === 0; }

  function start(newMaze) {
    var cfg = LEVELS[Math.min(level, LEVELS.length - 1)];
    var ch = CHARS[level % CHARS.length];
    if (newMaze) {
      cols = cfg[0]; rows = cfg[1];
      cells = gen(cols, rows);
      wallColor = WALLS[level % WALLS.length]; trailColor = TRAILS[level % TRAILS.length];
    }
    px = 0; py = 0; gx = cols - 1; gy = rows - 1; done = false;
    trail = [[0, 0]];
    lvlEl.textContent = String(level + 1);
    whoEl.firstChild.textContent = ch[0]; whoEl.lastChild.textContent = ch[1];
    charEl.firstChild.textContent = ch[0];
    goalEl.firstChild.textContent = ch[1];
    charEl.classList.remove('hop');
    layout();
  }

  function layout() {
    var W = area.clientWidth - 4, H = area.clientHeight - 4;
    if (W < 40 || H < 40) return;
    // Si la pantalla es vertical y el laberinto es ancho, lo giramos
    if (W < H && cols > rows || W > H && rows > cols) { cells = transpose(cells); var t = cols; cols = rows; rows = t; t = px; px = py; py = t; t = gx; gx = gy; gy = t; trail = trail.map(function (p) { return [p[1], p[0]]; }); }
    cell = Math.floor(Math.min(W / cols, H / rows));
    off = Math.round(cell * 0.12);
    var cw = cell * cols + off * 2, chh = cell * rows + off * 2;
    var dpr = Math.min(window.devicePixelRatio || 1, 2);
    canvas.width = Math.round(cw * dpr); canvas.height = Math.round(chh * dpr);
    canvas.style.width = cw + 'px'; canvas.style.height = chh + 'px';
    wrap.style.width = cw + 'px'; wrap.style.height = chh + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    [charEl, goalEl].forEach(function (el) {
      el.style.width = cell + 'px'; el.style.height = cell + 'px';
      el.firstChild.style.fontSize = Math.round(cell * 0.7) + 'px';
    });
    place(goalEl, gx, gy); place(charEl, px, py);
    draw();
  }
  function transpose(g) {
    var out = [], i, j;
    for (i = 0; i < cols; i++) { out[i] = []; for (j = 0; j < rows; j++) {
      var v = g[j][i], w = 0;
      if (v & 1) w |= 8; if (v & 8) w |= 1; if (v & 2) w |= 4; if (v & 4) w |= 2;
      out[i][j] = w;
    } }
    return out;
  }
  function place(el, x, y) { el.style.transform = 'translate(' + (off + x * cell) + 'px,' + (off + y * cell) + 'px)'; }

  function draw() {
    var w = canvas.width, h = canvas.height, x, y, i;
    ctx.save(); ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.clearRect(0, 0, w, h); ctx.restore();
    var W = cell * cols + off * 2, H = cell * rows + off * 2, lw = off * 1.9;
    // marco de madera (borde exterior)
    var wood = ctx.createLinearGradient(0, 0, 0, H);
    wood.addColorStop(0, '#d9a25f'); wood.addColorStop(.5, '#b8783a'); wood.addColorStop(1, '#8a4f1d');
    ctx.fillStyle = wood; ctx.fillRect(0, 0, W, H);
    // suelo: degradado + baldosas suaves
    var fl = ctx.createLinearGradient(0, off, 0, H - off);
    fl.addColorStop(0, '#fffdf2'); fl.addColorStop(1, '#f6ecc9');
    ctx.fillStyle = fl; rr(off, off, cell * cols, cell * rows, off * 1.2); ctx.fill();
    ctx.save(); rr(off, off, cell * cols, cell * rows, off * 1.2); ctx.clip();
    ctx.fillStyle = 'rgba(120,90,20,.06)';
    for (y = 0; y < rows; y++) for (x = 0; x < cols; x++) if ((x + y) & 1) ctx.fillRect(off + x * cell, off + y * cell, cell, cell);
    // puntitos de textura (hierba) en el centro de cada baldosa
    ctx.fillStyle = 'rgba(120,160,40,.18)';
    for (y = 0; y < rows; y++) for (x = 0; x < cols; x++) {
      var cx0 = off + x * cell + cell / 2, cy0 = off + y * cell + cell / 2, r0 = Math.max(1.2, cell * 0.035);
      ctx.beginPath(); ctx.arc(cx0 - cell * .18, cy0 + cell * .14, r0, 0, 6.3); ctx.arc(cx0 + cell * .2, cy0 - cell * .16, r0, 0, 6.3); ctx.fill();
    }
    // viñeta interior (sombra del marco sobre el suelo)
    var vg = ctx.createRadialGradient(W / 2, H / 2, Math.min(W, H) * .35, W / 2, H / 2, Math.max(W, H) * .75);
    vg.addColorStop(0, 'rgba(0,0,0,0)'); vg.addColorStop(1, 'rgba(90,60,0,.16)');
    ctx.fillStyle = vg; ctx.fillRect(0, 0, W, H);
    ctx.restore();
    // meta: baldosa dorada con brillo
    var gx0 = off + gx * cell, gy0 = off + gy * cell;
    var gg = ctx.createLinearGradient(gx0, gy0, gx0, gy0 + cell);
    gg.addColorStop(0, '#fff6c2'); gg.addColorStop(1, '#ffcf4a');
    ctx.fillStyle = 'rgba(200,140,0,.35)'; rr(gx0 + off * .6, gy0 + off * .9, cell - off * 1.2, cell - off * 1.2, cell * .2); ctx.fill();
    ctx.fillStyle = gg; rr(gx0 + off * .6, gy0 + off * .6, cell - off * 1.2, cell - off * 1.2, cell * .2); ctx.fill();
    ctx.strokeStyle = 'rgba(255,255,255,.8)'; ctx.lineWidth = Math.max(1.5, off * .35); rr(gx0 + off * 1.1, gy0 + off * 1.1, cell - off * 2.2, cell - off * 2.2, cell * .16); ctx.stroke();
    // rastro: huellas con halo brillante
    for (i = 0; i < trail.length; i++) {
      x = trail[i][0]; y = trail[i][1];
      if (x === gx && y === gy) continue;
      var cx = off + x * cell + cell / 2, cy = off + y * cell + cell / 2, side = (i & 1) ? 1 : -1;
      var halo = ctx.createRadialGradient(cx, cy, 0, cx, cy, cell * .42);
      halo.addColorStop(0, rgba(trailColor, .45)); halo.addColorStop(.6, rgba(trailColor, .18)); halo.addColorStop(1, rgba(trailColor, 0));
      ctx.fillStyle = halo; ctx.beginPath(); ctx.arc(cx, cy, cell * .42, 0, 6.3); ctx.fill();
      paw(cx + side * cell * .12, cy + cell * .04, cell * .13, rgba(trailColor, .8));
    }
    // paredes: tubos de caramelo con luz arriba, grosor abajo y sombra sobre el suelo
    var path = new Path2D();
    for (y = 0; y < rows; y++) for (x = 0; x < cols; x++) {
      var v = cells[y][x], x0 = off + x * cell, y0 = off + y * cell, x1 = x0 + cell, y1 = y0 + cell;
      if (v & 1) { path.moveTo(x0, y0); path.lineTo(x1, y0); }
      if (v & 8) { path.moveTo(x0, y0); path.lineTo(x0, y1); }
      if ((v & 4) && y === rows - 1) { path.moveTo(x0, y1); path.lineTo(x1, y1); }
      if ((v & 2) && x === cols - 1) { path.moveTo(x1, y0); path.lineTo(x1, y1); }
    }
    ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    function pass(dx, dy, color, width) { ctx.save(); ctx.translate(dx, dy); ctx.strokeStyle = color; ctx.lineWidth = width; ctx.stroke(path); ctx.restore(); }
    pass(off * .3, off * .9, 'rgba(60,30,0,.14)', lw * 1.35);
    pass(off * .2, off * .55, 'rgba(60,30,0,.16)', lw * 1.1);
    pass(0, off * .45, mix(wallColor, '#000000', .4), lw);
    pass(0, off * .2, mix(wallColor, '#000000', .18), lw);
    pass(0, 0, wallColor, lw);
    pass(0, -off * .22, mix(wallColor, '#ffffff', .35), lw * .55);
    pass(-off * .05, -off * .34, 'rgba(255,255,255,.7)', lw * .2);
  }
  function paw(cx, cy, r, color) {
    ctx.fillStyle = color;
    ctx.beginPath(); ctx.ellipse(cx, cy + r * .5, r, r * .8, 0, 0, 6.3); ctx.fill();
    ctx.beginPath(); ctx.arc(cx - r * .95, cy - r * .55, r * .38, 0, 6.3); ctx.arc(cx, cy - r * .95, r * .4, 0, 6.3); ctx.arc(cx + r * .95, cy - r * .55, r * .38, 0, 6.3); ctx.fill();
  }
  function rr(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
  }

  // --- Movimiento ---
  function step(d) {
    if (done) return false;
    if (!open(px, py, d)) return false;
    px += DX[d]; py += DY[d];
    var last = trail[trail.length - 1];
    if (trail.length > 1 && trail[trail.length - 2][0] === px && trail[trail.length - 2][1] === py) trail.pop();
    else if (!(last[0] === px && last[1] === py)) trail.push([px, py]);
    draw(); place(charEl, px, py);
    if (px === gx && py === gy) win();
    return true;
  }
  function tryDir(d) {
    if (done) return;
    if (step(d)) KidsGame.sound.tap();
    else { KidsGame.sound.wrong(); var e = charEl.firstChild; e.classList.remove('shake'); void e.offsetWidth; e.classList.add('shake'); }
  }
  // Camino corto (máx 3 pasos) hacia la celda del dedo, solo por pasillos abiertos
  function pathTo(tx, ty, limit) {
    if (tx === px && ty === py) return [];
    var q = [[px, py]], prev = {}, key = function (x, y) { return x + ',' + y; }, dist = {};
    dist[key(px, py)] = 0;
    while (q.length) {
      var c = q.shift(), cd = dist[key(c[0], c[1])];
      if (cd >= limit) continue;
      for (var d = 0; d < 4; d++) {
        if (!open(c[0], c[1], d)) continue;
        var nx = c[0] + DX[d], ny = c[1] + DY[d], k = key(nx, ny);
        if (dist[k] != null) continue;
        dist[k] = cd + 1; prev[k] = d;
        if (nx === tx && ny === ty) {
          var path = [], cx = nx, cy = ny;
          while (!(cx === px && cy === py)) { var pd = prev[key(cx, cy)]; path.unshift(pd); cx -= DX[pd]; cy -= DY[pd]; }
          return path;
        }
        q.push([nx, ny]);
      }
    }
    return null;
  }
  function follow(ev) {
    var r = canvas.getBoundingClientRect();
    var tx = Math.floor((ev.clientX - r.left - off) / cell), ty = Math.floor((ev.clientY - r.top - off) / cell);
    if (tx < 0 || ty < 0 || tx >= cols || ty >= rows) return;
    var path = pathTo(tx, ty, 3);
    if (!path || !path.length) return;
    for (var i = 0; i < path.length && !done; i++) step(path[i]);
    KidsGame.sound.tap();
  }
  wrap.addEventListener('pointerdown', function (ev) {
    if (done) return;
    dragging = true;
    try { wrap.setPointerCapture(ev.pointerId); } catch (e) {}
    follow(ev); ev.preventDefault();
  });
  wrap.addEventListener('pointermove', function (ev) { if (dragging) { follow(ev); ev.preventDefault(); } });
  function endDrag() { dragging = false; }
  wrap.addEventListener('pointerup', endDrag); wrap.addEventListener('pointercancel', endDrag);

  pad.querySelectorAll('.btn').forEach(function (b) {
    var d = b.classList.contains('up') ? 0 : b.classList.contains('right') ? 1 : b.classList.contains('down') ? 2 : 3;
    b.addEventListener('pointerdown', function (ev) { ev.preventDefault(); tryDir(d); });
  });
  document.addEventListener('keydown', function (ev) {
    var m = { ArrowUp: 0, ArrowRight: 1, ArrowDown: 2, ArrowLeft: 3 }[ev.key];
    if (m != null) tryDir(m);
  });

  function burst() {
    var r = charEl.getBoundingClientRect(), cx = r.left + r.width / 2, cy = r.top + r.height / 2;
    for (var i = 0; i < 18; i++) {
      var d = document.createElement('div'); d.className = 'spark emoji';
      d.textContent = KidsGame.pick(['✨', '⭐', '🌟', '💫']);
      var a = Math.random() * Math.PI * 2, dist = 60 + Math.random() * 90;
      d.style.left = cx + 'px'; d.style.top = cy + 'px';
      d.style.setProperty('--dx', Math.cos(a) * dist + 'px'); d.style.setProperty('--dy', Math.sin(a) * dist - 30 + 'px');
      d.style.animationDelay = (Math.random() * .25) + 's';
      document.body.appendChild(d);
      (function (el) { setTimeout(function () { el.remove(); }, 1300); })(d);
    }
  }
  function win() {
    done = true; dragging = false;
    charEl.classList.add('hop'); burst();
    KidsGame.sound.win(); KidsGame.addStar(); KidsGame.vibrate(60);
    setTimeout(function () {
      KidsGame.celebrate({
        sub: CHARS[level % CHARS.length][0] + ' encontró ' + CHARS[level % CHARS.length][1],
        onNext: function () { level++; start(true); },
        onAgain: function () { start(true); }
      });
    }, 900);
  }

  window.addEventListener('resize', function () { order(); layout(); });
  start(true);
  KidsGame.say('Lleva al animalito hasta su comida');
})();
</script>
</body>
