<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<link rel="stylesheet" href="../common.css">
<title>Vestir</title>
<style>
  .game { display: flex; flex-direction: column; touch-action: none; overflow: hidden; background: linear-gradient(180deg, #fbe4ff 0%, #ffd6ea 100%); }
  .hud { flex: 0 0 auto; display: flex; align-items: center; justify-content: space-between; padding: 8px 10px 4px; gap: 8px; z-index: 5; }
  .hud .mid { flex: 1; display: flex; justify-content: center; min-width: 0; }
  .hud .ttl { font-size: 26px; font-weight: 900; color: #fff; text-shadow: 0 2px 0 #b03a8a, 0 4px 8px rgba(0,0,0,.25), -1px -1px 0 #b03a8a, 1px -1px 0 #b03a8a, -1px 1px 0 #b03a8a, 1px 1px 0 #b03a8a; white-space: nowrap; }
  .lvbtn { font-size: 30px; }
  .mission { display: flex; align-items: center; gap: 10px; padding: 4px 16px 4px 8px; min-height: 64px; border-radius: 40px; animation: pop .4s ease-out; }
  .mission .em { font-size: 40px; }
  .mission .txt { font-size: 20px; font-weight: 900; color: #1f2f6b; line-height: 1.05; white-space: nowrap; }
  .mission .txt b { color: #ff3d7f; }
  .mission .icons { display: flex; gap: 4px; }
  .mission .icons svg { width: 44px; height: 44px; border-radius: 10px; background: linear-gradient(180deg, #fff, #eef2ff); box-shadow: inset 0 0 0 2px #dfe6f4; overflow: visible; transition: opacity .3s; }
  .mission .icons svg.miss { opacity: .3; }
  .mission.shake { animation: shake .4s; }
  .target { display: flex; align-items: center; gap: 8px; padding: 4px 8px; border-radius: 26px; animation: pop .4s ease-out; }
  .target .card { width: 80px; height: 126px; border-radius: 14px; overflow: hidden; position: relative; background: linear-gradient(180deg, #fff, #e8eefc); box-shadow: inset 0 0 0 3px #fff, 0 3px 0 #c9d2e6; }
  .target .card svg { width: 100%; height: 100%; display: block; }
  .target .card .cover { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-size: 34px; background: linear-gradient(180deg, #b39cff, #7f5af0); opacity: 0; transition: opacity .4s; pointer-events: none; }
  .target .card.hidden .cover { opacity: 1; }
  .target .peek { font-size: 30px; }
  .main { flex: 1 1 auto; display: flex; gap: 10px; padding: 0 10px 10px; min-height: 0; }
  .stage { flex: 1 1 55%; position: relative; border-radius: 28px; border: 4px solid #fff; overflow: hidden; min-width: 0; display: flex; flex-direction: column; align-items: center;
    background: radial-gradient(ellipse 80% 55% at 50% 100%, #ffd1e8 0%, rgba(255,209,232,0) 70%), repeating-linear-gradient(90deg, rgba(255,255,255,.14) 0 30px, rgba(255,255,255,0) 30px 60px), linear-gradient(180deg, #d9b3ff 0%, #f0a3d0 100%);
    box-shadow: 0 8px 0 #c48ac2, 0 16px 28px rgba(90,20,90,.25), inset 0 2px 0 #fff; }

    background: conic-gradient(from 180deg at 50% 0%, rgba(255,255,255,0) 0deg 160deg, rgba(255,255,255,.25) 165deg 195deg, rgba(255,255,255,0) 200deg 360deg); }
  .floor { position: absolute; left: -10%; right: -10%; bottom: -8%; height: 22%; border-radius: 50%; background: radial-gradient(ellipse at 50% 30%, #fff 0%, #ffe0ee 40%, #f7b7d3 100%); box-shadow: 0 -8px 20px rgba(120,30,90,.2); }
  .lights { position: absolute; left: 0; right: 0; top: 0; height: 14px; display: flex; justify-content: space-around; padding: 0 20px; }
  .lights i { width: 14px; height: 14px; border-radius: 50%; background: radial-gradient(circle at 40% 35%, #fff, #ffe066 55%, #ffb703); box-shadow: 0 0 12px 4px rgba(255,220,100,.7); animation: twinkle 1.4s ease-in-out infinite alternate; margin-top: -7px; }
  .lights i:nth-child(odd) { animation-delay: -.7s; }
  @keyframes twinkle { from { opacity: .5; } to { opacity: 1; } }
  .skins { display: flex; gap: 8px; padding: 14px 6px 4px; z-index: 2; flex-wrap: wrap; justify-content: center; }
  .skin { width: 64px; height: 64px; border-radius: 50%; border: 4px solid #fff; cursor: pointer; box-shadow: 0 5px 0 rgba(0,0,0,.18), 0 8px 12px rgba(0,0,0,.2), inset 0 -6px 8px rgba(0,0,0,.15), inset 0 4px 6px rgba(255,255,255,.5); transition: transform .12s; }

  .dollwrap { flex: 1 1 auto; width: 100%; min-height: 0; display: flex; align-items: center; justify-content: center; z-index: 2; }
  .dollwrap svg { height: 100%; max-width: 100%; overflow: visible; filter: drop-shadow(0 12px 10px rgba(80,20,60,.35)); transform-origin: 50% 95%; animation: idle 3.2s ease-in-out infinite; }
  @keyframes idle { 0%,100% { transform: translateY(0) rotate(0); } 50% { transform: translateY(-6px) rotate(1.2deg); } }
  .dollwrap svg.dance { animation: dance .45s ease-in-out infinite; }

  .dollwrap svg.pop { animation: pop .35s ease-out; }

  .stagebtns .btn { font-size: 32px; min-width: 76px; min-height: 68px; padding: 6px 16px; }
  .stagebtns .btn.done { font-size: 26px; }
  .wardrobe { flex: 0 0 42%; display: flex; flex-direction: column; min-height: 0; padding: 10px; gap: 8px; }
  .tabs { display: flex; gap: 6px; justify-content: center; flex-wrap: wrap; }
  .tab { width: 64px; height: 64px; border-radius: 18px; border: 0; cursor: pointer; font-size: 32px; font: inherit; font-size: 32px; display: flex; align-items: center; justify-content: center;
    background: linear-gradient(180deg, #fff, #e6ecfb); box-shadow: 0 5px 0 #b9c4dc, 0 8px 12px rgba(20,40,90,.2), inset 0 2px 0 #fff; transition: transform .1s; position: relative; }
  .tab.on { background: linear-gradient(180deg, #ffe98a, #ffb703); box-shadow: 0 5px 0 #c47f00, 0 8px 12px rgba(20,40,90,.2), inset 0 2px 0 rgba(255,255,255,.7); transform: translateY(2px); }
  .opts { flex: 1 1 auto; min-height: 0; overflow-y: auto; display: grid; grid-template-columns: repeat(auto-fill, minmax(88px, 1fr)); gap: 10px; padding: 6px 4px; align-content: start; }
  .opt { aspect-ratio: 1; min-height: 88px; border-radius: 20px; cursor: pointer; display: flex; align-items: center; justify-content: center; padding: 6px; }
  .opt svg { width: 100%; height: 100%; overflow: hidden; filter: drop-shadow(0 3px 2px rgba(0,0,0,.2)); }
  .opt .none { font-size: 40px; }
  .spark { position: absolute; z-index: 20; pointer-events: none; font-size: 26px; animation: sp .9s ease-out forwards; }
  @keyframes sp { 0% { transform: translate(0,0) scale(.4); opacity: 1; } 100% { transform: translate(var(--dx), var(--dy)) scale(1.3); opacity: 0; } }
  .snap { position: absolute; inset: 0; background: #fff; opacity: 0; pointer-events: none; z-index: 15; }
  .snap.on { animation: flash .5s ease-out; }
  @keyframes flash { 0% { opacity: .95; } 100% { opacity: 0; } }
  @media (orientation: portrait) {

    .stage { flex: 1 1 auto; }
    .wardrobe { flex: 0 0 auto; height: 34%; padding: 0; }
    .opts { grid-template-columns: repeat(auto-fill, minmax(84px, 1fr)); }
  }
</style>

    order.forEach(function (c) {

      if (c === 'bottom' && topIt && topIt.dress) return;
      front += it.svg;
    });
    return '<svg viewBox="' + VB + '" class="' + (cls || '') + '"><g filter="url(#dsh)">' + back + body(sk) + front + '</g></svg>';
  }
  function miniSVG(cat, it) {
    if (it.none) return '<span class="none emoji">🚫</span>';

  // ---------- DOM ----------

  function renderSkins() { var els = skinsEl.children; for (var i = 0; i < els.length; i++) els[i].className = 'skin' + (i === skin ? ' on' : ''); }
