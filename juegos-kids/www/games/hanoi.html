<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<link rel="stylesheet" href="../common.css">
<title>Torre de pasteles</title>
<style>
  /* ===== Mundo: "La pastelería mágica" — los discos son pisos de pastel; hay que pasar la torre entera al plato con la banderita ===== */
  .game {
    display: flex; flex-direction: column; align-items: center; padding: 10px 12px; gap: 10px;
    background:
      radial-gradient(ellipse 70% 40% at 50% 0%, rgba(255,255,255,.6), rgba(255,255,255,0) 70%),
      radial-gradient(ellipse 100% 45% at 50% 115%, rgba(120,40,60,.35), rgba(0,0,0,0) 60%),
      linear-gradient(180deg, #fff1d6 0%, #ffd1e8 50%, #e9a3d0 100%);
  }
  /* chispitas de colores (sprinkles) de fondo + repisa */
  .game::before { content: ""; position: absolute; inset: 0; pointer-events: none; z-index: 0; opacity: .75;
    background:
      radial-gradient(ellipse 6px 3px at 8% 25%, #ff5fa2 0 100%, transparent 101%), radial-gradient(ellipse 6px 3px at 20% 60%, #2f95e8 0 100%, transparent 101%),
      radial-gradient(ellipse 6px 3px at 90% 20%, #ffc800 0 100%, transparent 101%), radial-gradient(ellipse 6px 3px at 80% 55%, #2fc56d 0 100%, transparent 101%),
      radial-gradient(ellipse 6px 3px at 50% 12%, #8a5cf6 0 100%, transparent 101%), radial-gradient(ellipse 6px 3px at 35% 35%, #ff8a1a 0 100%, transparent 101%),
      radial-gradient(ellipse 6px 3px at 65% 40%, #ff5fa2 0 100%, transparent 101%), radial-gradient(ellipse 6px 3px at 12% 80%, #2f95e8 0 100%, transparent 101%),
      radial-gradient(ellipse 6px 3px at 93% 78%, #ffc800 0 100%, transparent 101%); }
  .hud { position: relative; z-index: 2; flex: 0 0 auto; display: flex; align-items: center; gap: 10px; padding: 6px 10px 6px 14px; border-radius: 40px; max-width: 100%; flex-wrap: wrap; justify-content: center; }
  .hud .btn.round { width: 64px; height: 64px; font-size: 28px; }
  .hud .btn { font-size: 20px; min-height: 64px; padding: 6px 14px; white-space: nowrap; }
  .hud .btn .n { display: inline-block; margin-left: 6px; min-width: 28px; padding: 2px 8px; border-radius: 14px; background: rgba(255,255,255,.85); color: #5232b3; font-size: 18px; text-shadow: none; }
  .hud .btn.off { opacity: .45; filter: saturate(.3); pointer-events: none; }
  .hud .hero { width: 52px; height: 52px; flex: 0 0 auto; } .hud .hero svg { width: 100%; height: 100%; overflow: visible; }
  .mv { display: flex; flex-direction: column; align-items: center; line-height: 1; min-width: 96px; }
  .mv .big { font-size: 32px; font-weight: 900; color: #e0569a; text-shadow: 0 2px 0 #fff, 0 4px 8px rgba(0,0,0,.15); }
  .mv .big small { font-size: 18px; color: #b88aa0; }
  .mv .lbl { font-size: 13px; color: #8a5a70; font-weight: 800; white-space: nowrap; }
  .hud .streak { display: none; font-size: 18px; font-weight: 900; color: #fff; padding: 4px 12px; border-radius: 20px; white-space: nowrap; background: linear-gradient(180deg, #ff9f43, #ff5e3a); box-shadow: 0 3px 0 #b8300a, 0 5px 10px rgba(0,0,0,.25); text-shadow: 0 1px 0 rgba(0,0,0,.3); animation: pop .4s ease-out; }
  .hud .streak.on { display: inline-block; }

  .stage { position: relative; z-index: 1; flex: 1 1 auto; width: 100%; min-height: 0; display: flex; align-items: center; justify-content: center; touch-action: none; }
  .world { position: relative; width: var(--W); height: var(--H); }
  .world.out { animation: stout .26s ease-in forwards; } .world.in { animation: stin .45s cubic-bezier(.3,1.3,.4,1); }
  @keyframes stout { to { transform: scale(.9) translateY(30px); opacity: 0; } }
  @keyframes stin { from { transform: scale(.9) translateY(40px); opacity: 0; } to { transform: none; opacity: 1; } }
  /* mostrador de la pastelería */
  .base { position: absolute; left: 0; right: 0; bottom: 0; height: var(--bh); border-radius: 18px;
    background: linear-gradient(180deg, #fff 0%, #f3e6ee 8%, #d59a5a 9%, #a86a30 55%, #7a4a1c 100%);
    box-shadow: 0 10px 0 #4e2d0c, 0 20px 30px rgba(40,10,0,.4), inset 0 -4px 0 rgba(0,0,0,.2); }
  .base::before { content: ""; position: absolute; inset: 0; border-radius: inherit; pointer-events: none; background: repeating-linear-gradient(95deg, rgba(255,255,255,.08) 0 8px, rgba(0,0,0,.06) 8px 18px); }
  /* platos y palitos */
  .plate { position: absolute; bottom: calc(var(--bh) - 4px); height: 14px; border-radius: 50%; background: radial-gradient(ellipse at 50% 40%, #fff, #e8ecf5 70%, #b9c3d8); box-shadow: 0 3px 0 #9aa7c7, 0 6px 8px rgba(0,0,0,.25); }
  .zone.target .plate { background: radial-gradient(ellipse at 50% 40%, #fff6c4, #ffd54a 70%, #e0a020); box-shadow: 0 3px 0 #a86f00, 0 6px 8px rgba(0,0,0,.25), 0 0 18px 4px rgba(255,220,100,.6); }
  .pole { position: absolute; bottom: calc(var(--bh) + 4px); width: 18px; margin-left: -9px; border-radius: 9px 9px 4px 4px;
    background: linear-gradient(90deg, #c9d2e6 0%, #ffffff 35%, #f4f6fb 50%, #b9c3d8 100%); box-shadow: 0 0 0 2px rgba(0,0,0,.06), 4px 0 10px rgba(0,0,0,.2); }
  .pole::before { content: ""; position: absolute; left: -9px; right: -9px; top: -8px; height: 16px; border-radius: 50%;
    background: radial-gradient(circle at 40% 35%, #ffd6e8, #f0569a 70%, #b8306f); box-shadow: 0 2px 4px rgba(0,0,0,.35); }
  .zone { position: absolute; top: 0; bottom: 0; }
  .zone .flag { position: absolute; left: 50%; width: 0; height: 0; pointer-events: none; opacity: 0; transition: opacity .3s; }
  .zone.target .flag { opacity: 1; }
  .zone .flag svg { position: absolute; left: -6px; bottom: 0; width: 64px; height: 60px; overflow: visible; filter: drop-shadow(0 4px 4px rgba(0,0,0,.3)); }
  .zone .flag .cloth { transform-origin: 0 50%; animation: wave 1.6s ease-in-out infinite; }
  @keyframes wave { 0%,100% { transform: skewY(0) scaleX(1); } 50% { transform: skewY(-6deg) scaleX(.94); } }
  .zone.over .glow { opacity: 1; }
  .zone .glow { position: absolute; left: 10%; right: 10%; bottom: var(--bh); height: 60%; border-radius: 30px; opacity: 0; pointer-events: none; transition: opacity .2s; background: radial-gradient(ellipse at 50% 100%, rgba(255,255,255,.7), rgba(255,255,255,0) 70%); }
  /* discos = pisos de pastel */
  .disc { position: absolute; left: 0; top: 0; width: var(--w); height: var(--h); z-index: 3; transition: transform .35s cubic-bezier(.3,1.2,.4,1); will-change: transform; }
  .disc.drag { transition: none; z-index: 10; }
  .disc.lifted { z-index: 9; }
  .disc .body {
    --c1: #ffd6e8; --c2: #f0569a; --c3: #b8306f;
    position: relative; width: 100%; height: 100%; border-radius: calc(var(--h) / 2);
    background: linear-gradient(180deg, var(--c1) 0%, var(--c2) 60%, var(--c2) 100%);
    box-shadow: 0 6px 0 var(--c3), 0 10px 14px rgba(0,0,0,.3), inset 0 2px 0 rgba(255,255,255,.75), inset 0 -4px 0 rgba(0,0,0,.12);
  }
  /* betún que escurre + chispitas (estilo pastel) */
  .disc .body::before { content: ""; position: absolute; left: 4%; right: 4%; top: 6%; height: 46%; border-radius: inherit; pointer-events: none;
    background: radial-gradient(ellipse 14px 10px at 15% 100%, rgba(255,255,255,.95) 0 60%, transparent 62%), radial-gradient(ellipse 18px 12px at 40% 100%, rgba(255,255,255,.95) 0 60%, transparent 62%), radial-gradient(ellipse 12px 9px at 62% 100%, rgba(255,255,255,.95) 0 60%, transparent 62%), radial-gradient(ellipse 16px 11px at 85% 100%, rgba(255,255,255,.95) 0 60%, transparent 62%), linear-gradient(180deg, rgba(255,255,255,.95), rgba(255,255,255,.9) 60%, rgba(255,255,255,0)); }
  .disc .body::after { content: ""; position: absolute; inset: 0; border-radius: inherit; pointer-events: none; opacity: .9;
    background: radial-gradient(ellipse 5px 2.5px at 20% 22%, #ff5fa2 0 100%, transparent 101%), radial-gradient(ellipse 5px 2.5px at 45% 16%, #2f95e8 0 100%, transparent 101%), radial-gradient(ellipse 5px 2.5px at 70% 24%, #ffc800 0 100%, transparent 101%), radial-gradient(ellipse 5px 2.5px at 88% 15%, #2fc56d 0 100%, transparent 101%), radial-gradient(ellipse 5px 2.5px at 32% 10%, #8a5cf6 0 100%, transparent 101%), radial-gradient(ellipse 5px 2.5px at 58% 28%, #ff8a1a 0 100%, transparent 101%); }
  /* materiales desbloqueables */
  .game.madera .disc .body { background: linear-gradient(180deg, var(--c1) 0%, var(--c2) 100%); }
  .game.madera .disc .body::before { background: repeating-linear-gradient(180deg, rgba(0,0,0,0) 0 4px, rgba(80,30,0,.14) 4px 6px); height: 100%; top: 0; left: 0; right: 0; border-radius: inherit; }
  .game.madera .disc .body::after { background: linear-gradient(180deg, rgba(255,255,255,.45), rgba(255,255,255,0) 50%); }
  .game.gema .disc .body { background: linear-gradient(135deg, var(--c1) 0%, var(--c2) 35%, var(--c1) 50%, var(--c2) 65%, var(--c3) 100%); }
  .game.gema .disc .body::before { background: linear-gradient(135deg, transparent 0 28%, rgba(255,255,255,.55) 28% 31%, transparent 31% 58%, rgba(255,255,255,.4) 58% 61%, transparent 61%); height: 100%; top: 0; left: 0; right: 0; }
  .game.gema .disc .body::after { background: linear-gradient(180deg, rgba(255,255,255,.5), rgba(255,255,255,0) 45%); }
  .game.dona .disc .body { background: linear-gradient(180deg, #f3c98a 0%, #d9a05a 60%, #b8783a 100%); }
  .game.dona .disc .body::before { background: radial-gradient(ellipse 14px 10px at 15% 100%, var(--c2) 0 60%, transparent 62%), radial-gradient(ellipse 18px 12px at 40% 100%, var(--c2) 0 60%, transparent 62%), radial-gradient(ellipse 12px 9px at 62% 100%, var(--c2) 0 60%, transparent 62%), radial-gradient(ellipse 16px 11px at 85% 100%, var(--c2) 0 60%, transparent 62%), linear-gradient(180deg, var(--c1), var(--c2) 55%, rgba(255,255,255,0)); }
  .game.oro .disc .body { background: linear-gradient(180deg, #fff6c4 0%, #ffd54a 45%, #e0a020 100%); box-shadow: 0 6px 0 #a86f00, 0 10px 14px rgba(0,0,0,.3), inset 0 2px 0 rgba(255,255,255,.8); }
  .game.oro .disc .body::before { background: linear-gradient(180deg, rgba(255,255,255,.8), rgba(255,255,255,0)); height: 45%; }
  .game.oro .disc .body::after { background: radial-gradient(ellipse 6px 6px at 20% 50%, var(--c2) 0 100%, transparent 101%), radial-gradient(ellipse 6px 6px at 50% 50%, var(--c2) 0 100%, transparent 101%), radial-gradient(ellipse 6px 6px at 80% 50%, var(--c2) 0 100%, transparent 101%); }
  .disc.lifted .body { animation: hover 1s ease-in-out infinite; box-shadow: 0 6px 0 var(--c3), 0 22px 26px rgba(0,0,0,.4), 0 0 0 4px rgba(255,255,255,.75), inset 0 2px 0 rgba(255,255,255,.75); }
  .disc.drag .body { box-shadow: 0 6px 0 var(--c3), 0 26px 30px rgba(0,0,0,.45), 0 0 0 4px rgba(255,255,255,.75), inset 0 2px 0 rgba(255,255,255,.75); transform: scale(1.05); }
  @keyframes hover { 0%,100% { transform: translateY(0) scale(1.04); } 50% { transform: translateY(-6px) scale(1.04); } }
  .disc.bad .body { animation: shake .4s; }
  .disc.land .body { animation: landsq .4s cubic-bezier(.3,1.6,.5,1); }
  @keyframes landsq { 0% { transform: scale(1.06, .86); } 60% { transform: scale(.97, 1.06); } 100% { transform: scale(1); } }
  .disc.win .body { animation: winbounce .6s ease-out backwards; }
  @keyframes winbounce { 0% { transform: scale(1); } 40% { transform: scale(1.12, .88); } 70% { transform: scale(.95, 1.08) translateY(-6px); } 100% { transform: scale(1); } }
  .d1 .body { --c1: #ffd6e8; --c2: #f0569a; --c3: #b8306f; } .d2 .body { --c1: #ffe9cc; --c2: #ff8a1a; --c3: #b8500a; } .d3 .body { --c1: #fff6b0; --c2: #ffc800; --c3: #c47f00; }
  .d4 .body { --c1: #dbffe6; --c2: #24b36c; --c3: #14784a; } .d5 .body { --c1: #d4f0ff; --c2: #2f95e8; --c3: #1a63a8; } .d6 .body { --c1: #dcccff; --c2: #8a5cf6; --c3: #5232b3; }
  /* cereza en el disco más pequeño */
  .d1 .body .cherry { position: absolute; left: 50%; top: -14px; width: 14px; height: 14px; margin-left: -7px; border-radius: 50%; background: radial-gradient(circle at 35% 30%, #ff8a8a, #e53935 60%, #8e1515); box-shadow: 0 2px 3px rgba(0,0,0,.3); }
  .d1 .body .cherry::after { content: ""; position: absolute; left: 50%; top: -8px; width: 2px; height: 10px; background: #2a6e2a; border-radius: 2px; transform: rotate(15deg); }
  .hand { position: absolute; left: 0; top: 0; z-index: 20; font-size: 54px; pointer-events: none; transition: transform .5s ease-in-out, opacity .3s; opacity: 0; filter: drop-shadow(0 6px 6px rgba(0,0,0,.35)); }
  .hand.show { opacity: 1; }
  .banner { position: absolute; left: 50%; top: 34%; z-index: 30; pointer-events: none; opacity: 0; transform: translate(-50%, -50%) scale(.5); padding: 12px 36px; border-radius: 40px; white-space: nowrap;
    font-size: clamp(26px, 4.5vw, 40px); font-weight: 900; color: #fff; background: linear-gradient(180deg, #ff9ccb, #f0569a); text-shadow: 0 3px 0 rgba(0,0,0,.2);
    box-shadow: 0 8px 0 #b8306f, 0 18px 30px rgba(0,0,0,.3), inset 0 2px 0 rgba(255,255,255,.6); }
  .banner.show { animation: bannerin 1.6s cubic-bezier(.3,1.4,.4,1) forwards; }
  @keyframes bannerin { 0% { opacity: 0; transform: translate(-50%,-50%) scale(.5); } 16% { opacity: 1; transform: translate(-50%,-50%) scale(1.06); } 26% { transform: translate(-50%,-50%) scale(1); } 76% { opacity: 1; transform: translate(-50%,-50%) scale(1); } 100% { opacity: 0; transform: translate(-50%,-100%) scale(.9); } }
  @media (max-width: 800px) { .hud { gap: 6px; padding: 6px 8px; } .hud .btn { font-size: 17px; padding: 6px 10px; } .mv { min-width: 80px; } }
</style>
</head>
<body>
<script src="../common.js"></script>
<script>
var game = KidsGame.init({ title: 'Torre de pasteles' });
(function () {
  var CFG = { 1: { n: 3, hints: 5 }, 2: { n: 4, hints: 3 }, 3: { n: 5, hints: 0 }, 4: { n: 6, hints: 0 } };
  var LABELS = { 1: '3 pisos', 2: '4 pisos', 3: '5 pisos', 4: '6 pisos · meta al centro' };
  var SKINS = [{ id: 'pastel', n: 'Pisos de pastel', e: '🎂' }, { id: 'dona', n: 'Donas', e: '🍩' }, { id: 'madera', n: 'Aros de madera', e: '🪵' }, { id: 'gema', n: 'Gemas', e: '💎' }, { id: 'oro', n: 'Aros de oro', e: '🥇' }];
  var cos = { unlocked: ['pastel'], sel: 'pastel' };
  try { var sv = JSON.parse(localStorage.getItem('kg-cos-hanoi')); if (sv && sv.unlocked) cos = sv; } catch (e) {}
  function saveCos() { try { localStorage.setItem('kg-cos-hanoi', JSON.stringify(cos)); } catch (e) {} }

  var nivel = 0, cfg = null, running = false, lock = false, streak = 0, handShown = false, tutHand = null;
  var n = 3, pegs = [[], [], []], target = 2, moves = 0, opt = 0, hintsLeft = 0, hintsUsed = 0;
  var hud, mvEl, hintBtn, targetBtn, stage, world, zones = [], discEls = {}, hand, streakEl, skinBtn;
  var geo = { W: 0, H: 0, bh: 0, h: 0, zone: 0 };

  function heroSVG(size) {
    return '<svg viewBox="0 0 100 100" width="' + size + '" height="' + size + '" aria-hidden="true"><defs>' +
      '<linearGradient id="hp1" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffd6e8"/><stop offset="1" stop-color="#f0569a"/></linearGradient>' +
      '<linearGradient id="hp2" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff6b0"/><stop offset="1" stop-color="#ffc800"/></linearGradient>' +
      '<linearGradient id="hp3" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#d4f0ff"/><stop offset="1" stop-color="#2f95e8"/></linearGradient>' +
      '<linearGradient id="hw" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#d59a5a"/><stop offset="1" stop-color="#7a4a1c"/></linearGradient></defs>' +
      '<ellipse cx="50" cy="95" rx="42" ry="5" fill="rgba(0,0,0,.2)"/>' +
      '<rect x="8" y="82" width="84" height="12" rx="5" fill="url(#hw)"/><ellipse cx="50" cy="82" rx="42" ry="5" fill="#ffe08a"/>' +
      '<rect x="47" y="14" width="6" height="70" rx="3" fill="#e8ecf5" stroke="#b9c3d8" stroke-width="1"/>' +
      '<g><rect x="10" y="64" width="80" height="18" rx="9" fill="url(#hp3)" stroke="#1a63a8" stroke-width="1.5"/><path d="M14 66 Q50 76 86 66 L86 70 Q50 80 14 70 Z" fill="#fff" opacity=".9"/>' +
      '<rect x="20" y="46" width="60" height="18" rx="9" fill="url(#hp2)" stroke="#c47f00" stroke-width="1.5"/><path d="M24 48 Q50 58 76 48 L76 52 Q50 62 24 52 Z" fill="#fff" opacity=".9"/>' +
      '<rect x="30" y="28" width="40" height="18" rx="9" fill="url(#hp1)" stroke="#b8306f" stroke-width="1.5"/><path d="M34 30 Q50 40 66 30 L66 34 Q50 44 34 34 Z" fill="#fff" opacity=".9"/>' +
      '<circle cx="36" cy="36" r="1.6" fill="#2f95e8"/><circle cx="62" cy="54" r="1.6" fill="#ff5fa2"/><circle cx="44" cy="72" r="1.6" fill="#ffc800"/><circle cx="72" cy="72" r="1.6" fill="#2fc56d"/></g>' +
      '<circle cx="50" cy="24" r="5" fill="#e53935"/><path d="M50 19 q3 -6 7 -8" stroke="#2a6e2a" stroke-width="2" fill="none" stroke-linecap="round"/>' +
      '<path d="M53 8 L78 15 L53 22 Z" fill="#2fc56d" stroke="#14784a" stroke-width="1.5" stroke-linejoin="round"/><circle cx="50" cy="8" r="3.5" fill="#ffc800"/></svg>';
  }
  function flagSVG() {
    return '<svg viewBox="0 0 64 60" aria-hidden="true"><defs><linearGradient id="fg" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#8ef0b0"/><stop offset="1" stop-color="#24b36c"/></linearGradient></defs>' +
      '<rect x="4" y="2" width="5" height="58" rx="2.5" fill="#f4f6fb" stroke="#b9c3d8" stroke-width="1"/><circle cx="6.5" cy="3" r="4" fill="#ffc800" stroke="#c47f00" stroke-width="1"/>' +
      '<g class="cloth"><path d="M9 6 L58 18 L9 30 Z" fill="url(#fg)" stroke="#14784a" stroke-width="2" stroke-linejoin="round"/><text x="16" y="23" font-size="13">⭐</text></g></svg>';
  }

  function build() {
    game.innerHTML = '';
    game.className = 'game ' + cos.sel;
    hud = document.createElement('div'); hud.className = 'hud panel';
    hud.insertAdjacentHTML('beforeend', '<div class="hero">' + heroSVG(52) + '</div>');
    hud.appendChild(KidsGame.levelBadge(nivel));
    mvEl = document.createElement('div'); mvEl.className = 'mv'; hud.appendChild(mvEl);
    streakEl = document.createElement('span'); streakEl.className = 'streak'; hud.appendChild(streakEl);
    if (cfg.hints > 0) {
      hintBtn = document.createElement('button'); hintBtn.className = 'btn purple'; hintBtn.innerHTML = '👀 Enséñame<span class="n">' + hintsLeft + '</span>';
      hintBtn.addEventListener('pointerdown', function (ev) { ev.preventDefault(); showHint(); });
      hud.appendChild(hintBtn);
    } else hintBtn = null;
    if (nivel === 4) {
      targetBtn = document.createElement('button'); targetBtn.className = 'btn green';
      targetBtn.addEventListener('pointerdown', function (ev) { ev.preventDefault(); KidsGame.sound.tap(); target = target === 2 ? 1 : 2; KidsGame.say(target === 1 ? 'Ahora la meta es el plato del centro' : 'Ahora la meta es el plato de la derecha'); reset(false); });
      hud.appendChild(targetBtn);
    } else targetBtn = null;
    skinBtn = document.createElement('button'); skinBtn.className = 'btn round purple'; skinBtn.textContent = '🎨'; skinBtn.setAttribute('aria-label', 'Cambiar pisos');
    skinBtn.addEventListener('pointerdown', function (ev) { ev.preventDefault(); cycleSkin(); });
    skinBtn.style.display = cos.unlocked.length > 1 ? '' : 'none';
    hud.appendChild(skinBtn);
    var rb = document.createElement('button'); rb.className = 'btn round blue'; rb.textContent = '🔄'; rb.setAttribute('aria-label', 'Reiniciar');
    rb.addEventListener('pointerdown', function (ev) { ev.preventDefault(); KidsGame.sound.tap(); reset(false); });
    hud.appendChild(rb);
    var sp = document.createElement('button'); sp.className = 'btn round blue'; sp.textContent = '🔊';
    sp.addEventListener('pointerdown', function (ev) { ev.preventDefault(); KidsGame.sound.tap(); explain(); });
    hud.appendChild(sp);
    var lb = document.createElement('button'); lb.className = 'btn round yellow'; lb.textContent = '🎚️'; lb.setAttribute('aria-label', 'Nivel');
    lb.addEventListener('pointerdown', function (ev) { ev.preventDefault(); KidsGame.sound.tap(); showPicker(); });
    hud.appendChild(lb);
    game.appendChild(hud);

    stage = document.createElement('div'); stage.className = 'stage';
    world = document.createElement('div'); world.className = 'world';
    stage.appendChild(world); game.appendChild(stage);
    stage.addEventListener('pointerdown', onDown);
    stage.addEventListener('pointermove', onMove);
    stage.addEventListener('pointerup', onUp);
    stage.addEventListener('pointercancel', onUp);
    var b = document.createElement('div'); b.className = 'banner'; game.appendChild(b);
  }
  function cycleSkin() {
    KidsGame.sound.tap();
    var i = cos.unlocked.indexOf(cos.sel); cos.sel = cos.unlocked[(i + 1) % cos.unlocked.length]; saveCos();
    game.className = 'game ' + cos.sel;
    var s = SKINS.filter(function (k) { return k.id === cos.sel; })[0]; KidsGame.toast(s.e + ' ' + s.n, 1200);
  }
  function unlockSkin(lv) { var s = SKINS[Math.min(lv, SKINS.length - 1)]; if (cos.unlocked.indexOf(s.id) >= 0) return null; cos.unlocked.push(s.id); cos.sel = s.id; saveCos(); return s; }
  function banner(txt) { var b = game.querySelector('.banner'); if (!b) return; b.textContent = txt; b.classList.remove('show'); void b.offsetWidth; b.classList.add('show'); }
  function setStreak() { streakEl.textContent = '🔥 Racha x' + streak; streakEl.classList.toggle('on', streak >= 3); }
  function explain() { KidsGame.say('Pasa todo el pastel al plato con la banderita. Mueve un piso a la vez y nunca pongas un piso grande sobre uno pequeño.'); }
  function showPicker() {
    running = false; lock = true;
    if (tutHand) { tutHand.stop(); tutHand = null; }
    if (world) world.innerHTML = '';
    KidsGame.levelPicker({ key: 'hanoi', labels: LABELS, art: heroSVG(64), music: 'calma',
      howto: [{ icon: '👆', text: 'Arrastra el piso de arriba a otro plato' }, { icon: '🚫', text: 'Un piso grande nunca va sobre uno chico' }, { icon: '🚩', text: 'Arma todo el pastel en el plato de la bandera' }],
      onPick: function (lv) { start(lv); } });
  }
  function start(lv) {
    nivel = lv; cfg = CFG[lv]; n = cfg.n; target = 2; running = true; streak = 0;
    hintsLeft = cfg.hints; hintsUsed = 0;
    build(); reset(true);
    setTimeout(explain, 700);
  }
  function reset(first) {
    moves = 0; opt = Math.pow(2, n) - 1; lock = false; lifted = null; dragging = false; streak = 0;
    pegs = [[], [], []];
    for (var d = n; d >= 1; d--) pegs[0].push(d);
    if (tutHand) { tutHand.stop(); tutHand = null; }
    renderWorld(); layout(); updateHud(); setStreak();
    banner(first ? 'Pastel de ' + n + ' pisos' : '¡Otra vez!');
    world.classList.remove('out'); world.classList.add('in'); setTimeout(function () { world.classList.remove('in'); }, 500);
    if (nivel === 1 && !handShown) {
      handShown = true;
      setTimeout(function () { if (!running || lock || lifted || moves > 0) return; var m = nextMove(n, target); if (!m) return; tutHand = KidsGame.hand({ from: discEls[m.d], to: zones[m.to], timeout: 14000 }); }, 2200);
    }
  }
  function updateHud() {
    mvEl.innerHTML = '<span class="big">' + moves + ' <small>/ ' + opt + '</small></span><span class="lbl">movimientos</span>';
    if (hintBtn) { hintBtn.querySelector('.n').textContent = hintsLeft; hintBtn.classList.toggle('off', hintsLeft <= 0); }
    if (targetBtn) targetBtn.textContent = target === 1 ? '🎯 centro' : '🎯 derecha';
  }
  function renderWorld() {
    world.innerHTML = ''; zones = []; discEls = {};
    var base = document.createElement('div'); base.className = 'base'; world.appendChild(base);
    for (var p = 0; p < 3; p++) {
      var z = document.createElement('div'); z.className = 'zone' + (p === target ? ' target' : '');
      z.innerHTML = '<div class="glow"></div><div class="plate"></div><div class="flag">' + flagSVG() + '</div>'; world.appendChild(z); zones.push(z);
      var pole = document.createElement('div'); pole.className = 'pole'; world.appendChild(pole); z.pole = pole; z.plate = z.querySelector('.plate'); z.flag = z.querySelector('.flag');
    }
    for (var d = 1; d <= n; d++) {
      var el = document.createElement('div'); el.className = 'disc d' + d; el.innerHTML = '<div class="body">' + (d === 1 ? '<span class="cherry"></span>' : '') + '</div>';
      world.appendChild(el); discEls[d] = el;
    }
    hand = document.createElement('div'); hand.className = 'hand emoji'; hand.textContent = '👆'; world.appendChild(hand);
  }
  function layout() {
    if (!world || !stage) return;
    var W = Math.min(stage.clientWidth - 8, 980), H = stage.clientHeight - 10;
    var bh = Math.max(26, Math.min(44, H * 0.08));
    var h = Math.floor(Math.min(62, (H - bh - 90) / (n + 1)));
    H = Math.min(H, bh + h * (n + 1) + 130);
    geo = { W: W, H: H, bh: bh, h: h, zone: W / 3 };
    world.style.setProperty('--W', W + 'px'); world.style.setProperty('--H', H + 'px'); world.style.setProperty('--bh', bh + 'px');
    var poleH = h * (n + 1) + 10;
    zones.forEach(function (z, p) {
      z.style.left = (p * geo.zone) + 'px'; z.style.width = geo.zone + 'px';
      z.pole.style.left = (p * geo.zone + geo.zone / 2) + 'px'; z.pole.style.height = poleH + 'px';
      z.plate.style.left = '6px'; z.plate.style.right = '6px';
      z.flag.style.bottom = (bh + poleH + 4) + 'px';
    });
    var maxW = geo.zone - 14, minW = Math.max(64, maxW * 0.32);
    for (var d = 1; d <= n; d++) {
      var w = n === 1 ? maxW : minW + (maxW - minW) * (d - 1) / (n - 1);
      discEls[d].style.setProperty('--w', w + 'px'); discEls[d].style.setProperty('--h', h + 'px'); discEls[d].w = w;
    }
    placeAll(true);
  }
  function discPos(d, p, i) { var w = discEls[d].w; return { x: p * geo.zone + geo.zone / 2 - w / 2, y: geo.H - geo.bh - (i + 1) * geo.h + 2 }; }
  function setXY(el, x, y, instant) {
    if (instant) el.style.transition = 'none';
    el.style.transform = 'translate(' + x + 'px,' + y + 'px)';
    if (instant) { void el.offsetWidth; el.style.transition = ''; }
  }
  function placeAll(instant) {
    for (var p = 0; p < 3; p++) for (var i = 0; i < pegs[p].length; i++) {
      var d = pegs[p][i], pos = discPos(d, p, i);
      if (lifted && lifted.d === d) continue;
      setXY(discEls[d], pos.x, pos.y, instant);
    }
    if (lifted && !dragging) liftOver(lifted.d, lifted.p);
  }
  function liftOver(d, p) {
    var w = discEls[d].w, x = p * geo.zone + geo.zone / 2 - w / 2, y = geo.H - geo.bh - (n + 2) * geo.h - 30;
    setXY(discEls[d], x, Math.max(4, y), false);
  }

  // ---------- Interacción ----------
  var lifted = null, dragging = false, startX = 0, startY = 0, offX = 0, offY = 0, pid = null;
  function pegAt(x) { var r = world.getBoundingClientRect(); return Math.max(0, Math.min(2, Math.floor((x - r.left) / geo.zone))); }
  function onDown(ev) {
    if (lock || !running) return;
    ev.preventDefault();
    var p = pegAt(ev.clientX);
    if (lifted) {
      if (p === lifted.p) { dragging = true; pid = ev.pointerId; startX = ev.clientX; startY = ev.clientY; var r0 = world.getBoundingClientRect(); var pos0 = discPos(lifted.d, lifted.p, pegs[lifted.p].length); offX = ev.clientX - r0.left - pos0.x - discEls[lifted.d].w / 2; offY = 0; discEls[lifted.d].classList.add('drag'); discEls[lifted.d].classList.remove('lifted'); try { stage.setPointerCapture(ev.pointerId); } catch (e) {} moveTo(ev); return; }
      drop(p); return;
    }
    if (!pegs[p].length) { KidsGame.sound.tap(); return; }
    var d = pegs[p][pegs[p].length - 1];
    lifted = { d: d, p: p }; dragging = true; pid = ev.pointerId;
    startX = ev.clientX; startY = ev.clientY;
    var r = world.getBoundingClientRect(), pos = discPos(d, p, pegs[p].length - 1);
    offX = ev.clientX - r.left - pos.x - discEls[d].w / 2; offY = ev.clientY - r.top - pos.y;
    discEls[d].classList.add('drag');
    try { stage.setPointerCapture(ev.pointerId); } catch (e) {}
    KidsGame.sound.tap();
    moveTo(ev);
  }
  function moveTo(ev) {
    var r = world.getBoundingClientRect(), d = lifted.d, w = discEls[d].w;
    var x = ev.clientX - r.left - w / 2 - offX, y = ev.clientY - r.top - geo.h / 2 - 20;
    x = Math.max(-w * 0.3, Math.min(geo.W - w * 0.7, x)); y = Math.max(-10, Math.min(geo.H - geo.h, y));
    discEls[d].style.transform = 'translate(' + x + 'px,' + y + 'px)';
    var p = pegAt(ev.clientX);
    zones.forEach(function (z, i) { z.classList.toggle('over', i === p); });
  }
  function onMove(ev) { if (!dragging || !lifted || ev.pointerId !== pid) return; ev.preventDefault(); moveTo(ev); }
  function onUp(ev) {
    if (!dragging || !lifted || ev.pointerId !== pid) return;
    ev.preventDefault();
    dragging = false; pid = null;
    zones.forEach(function (z) { z.classList.remove('over'); });
    var el = discEls[lifted.d]; el.classList.remove('drag');
    var p = pegAt(ev.clientX), small = Math.abs(ev.clientX - startX) + Math.abs(ev.clientY - startY) < 12;
    if (small && p === lifted.p) { el.classList.add('lifted'); liftOver(lifted.d, lifted.p); return; }
    drop(p);
  }
  function drop(p) {
    var d = lifted.d, from = lifted.p, el = discEls[d];
    el.classList.remove('lifted', 'drag');
    var top = pegs[p].length ? pegs[p][pegs[p].length - 1] : 99;
    if (p === from) { lifted = null; placeAll(false); return; }
    if (top < d) {
      KidsGame.sound.wrong(); KidsGame.vibrate(40);
      lifted = null; placeAll(false);
      el.classList.remove('bad'); void el.offsetWidth; el.classList.add('bad');
      var topEl = discEls[top]; topEl.classList.remove('bad'); void topEl.offsetWidth; topEl.classList.add('bad');
      KidsGame.say('No. El grande no va sobre el pequeño.');
      return;
    }
    var best = nextMove(n, target), optimal = best && best.d === d && best.to === p;
    pegs[from].pop(); pegs[p].push(d); lifted = null; moves++;
    KidsGame.sound.pop(); updateHud(); placeAll(false);
    var pos = discPos(d, p, pegs[p].length - 1);
    var gx = world.getBoundingClientRect();
    var cx = gx.left + pos.x + el.w / 2, cy = gx.top + pos.y + geo.h / 2;
    setTimeout(function () { el.classList.remove('land'); void el.offsetWidth; el.classList.add('land'); KidsGame.fx.burst(cx, cy, { n: 6, r: 40 }); }, 300);
    if (optimal) { streak++; if (streak >= 3) setTimeout(function () { KidsGame.fx.floatText(cx, cy - 40, '¡Racha x' + streak + '!', 'good'); }, 320); if (streak % 5 === 0) { KidsGame.addStar(1); setTimeout(function () { KidsGame.fx.burst(cx, cy - 50, { n: 10, chars: ['⭐', '✨'] }); }, 400); KidsGame.toast('⭐ ¡Bonus de racha!', 1200); } }
    else streak = 0;
    setStreak();
    setTimeout(function () { if (pegs[p].length === n && p === target) win(); }, 100);
  }

  // ---------- Pista ----------
  function pegOf(d) { for (var p = 0; p < 3; p++) if (pegs[p].indexOf(d) >= 0) return p; return -1; }
  function nextMove(k, tgt) {
    if (k === 0) return null;
    var p = pegOf(k);
    if (p === tgt) return nextMove(k - 1, tgt);
    var other = 3 - p - tgt;
    var m = nextMove(k - 1, other);
    return m || { from: p, to: tgt, d: k };
  }
  function showHint() {
    if (lock || !running || hintsLeft <= 0 || lifted) return;
    var m = nextMove(n, target);
    if (!m) return;
    hintsLeft--; hintsUsed++; updateHud();
    lock = true; KidsGame.sound.tap();
    var el = discEls[m.d];
    var from = discPos(m.d, m.from, pegs[m.from].length - 1);
    hand.style.transition = 'none'; hand.style.transform = 'translate(' + (from.x + el.w / 2 - 20) + 'px,' + (from.y - 10) + 'px)';
    void hand.offsetWidth; hand.style.transition = ''; hand.classList.add('show');
    KidsGame.say('Mira: este piso va aquí.');
    setTimeout(function () {
      lifted = { d: m.d, p: m.from }; liftOver(m.d, m.from);
      hand.style.transform = 'translate(' + (from.x + el.w / 2 - 20) + 'px,' + (Math.max(4, geo.H - geo.bh - (n + 2) * geo.h - 30) - 10) + 'px)';
    }, 500);
    setTimeout(function () {
      var to = discPos(m.d, m.to, pegs[m.to].length);
      var yTop = Math.max(4, geo.H - geo.bh - (n + 2) * geo.h - 30);
      setXY(el, to.x, yTop, false);
      hand.style.transform = 'translate(' + (to.x + el.w / 2 - 20) + 'px,' + (yTop - 10) + 'px)';
    }, 1100);
    setTimeout(function () { hand.classList.remove('show'); lock = false; drop(m.to); }, 1800);
  }

  function win() {
    if (!running) return;
    lock = true; running = false;
    KidsGame.sound.ok(); KidsGame.addStar(1); KidsGame.vibrate(50);
    for (var d = 1; d <= n; d++) { var el = discEls[d]; el.classList.add('win'); el.style.animationDelay = ((n - d) * 90) + 'ms'; }
    var gx = world.getBoundingClientRect(), cx = gx.left + target * geo.zone + geo.zone / 2, cy = gx.top + geo.H - geo.bh - n * geo.h;
    KidsGame.fx.burst(cx, cy, { n: 16 }); KidsGame.music.duck(2000);
    setTimeout(function () { KidsGame.fx.burst(cx, cy - 40, { n: 12, chars: ['🎂', '🍒', '⭐', '✨'] }); KidsGame.fx.floatText(cx, cy - 80, '¡Pastel listo!', 'good'); }, 400);
    banner('🎂 ¡Pastel listo!');
    var stars = moves <= opt + 2 ? 3 : (moves <= opt * 1.5 + 2 ? 2 : 1);
    if (hintsUsed > 2 && stars === 3) stars = 2;
    var lv = nivel;
    setTimeout(function () {
      KidsGame.levelDone(lv);
      var s = unlockSkin(lv);
      if (skinBtn) skinBtn.style.display = cos.unlocked.length > 1 ? '' : 'none';
      KidsGame.celebrate({
        sub: moves + ' movimientos (mínimo ' + opt + ')' + (s ? ' · 🎨 Nuevo: ' + s.n : ''), stars: stars,
        onNext: function () { start(Math.min(4, lv + 1)); },
        onAgain: function () { start(lv); }
      });
    }, 1500);
  }

  // ganchos para pruebas automáticas
  window.__hanoi = { get: function () { return { pegs: pegs, n: n, target: target, moves: moves, opt: opt, nivel: nivel, hintsLeft: hintsLeft, lifted: lifted, geo: geo, lock: lock || !running, streak: streak }; }, nextMove: function () { return nextMove(n, target); }, zones: function () { return zones; }, discs: function () { return discEls; },
    move: function (from, to) { if (lock || !running || lifted || !pegs[from].length) return false; lifted = { d: pegs[from][pegs[from].length - 1], p: from }; drop(to); return true; } };

  window.addEventListener('resize', layout);
  showPicker();
})();
</script>
