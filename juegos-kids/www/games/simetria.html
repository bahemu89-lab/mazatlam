  var level = 1, N = 6, pic = null, order = [], round = 0, axis = 'v', cells = [], target = [], paint = [], src = [], color = 'a', free = false;

  // ¿la casilla (r,c) es de la parte "fuente" (se muestra) según el eje?
  function isSrc(r, c) {

  function mirrorOf(r, c) {

  function start() {

    var er = el('div', 'swatch x', '🧽'); er.dataset.k = ''; onTap(er, function () { setColor(''); }); palette.appendChild(er);

    buildBoard(); fails = 0;
    setHud();
    board.classList.remove('enter'); void board.offsetWidth; board.classList.add('enter');
    if (handRef) { handRef.stop(); handRef = null; }
    if (!free) showBanner('<span class="emoji">' + pic.e + '</span><span>' + pic.n + '<small>Dibujo ' + (round + 1) + ' de ' + PER_LEVEL + '</small></span>', 1500);
    else showBanner('<span class="emoji">🎨</span><span>Modo libre<small>Pinta y mira el espejo</small></span>', 1500);
    if (free) { KidsGame.say('Pinta y mira el espejo'); return; }
    if (level === 1 && firstRound) {

      setTimeout(function () { if (busy || free) return; for (var i = 0; i < N * N; i++) if (!src[i] && target[i] && !paint[i]) { handRef = KidsGame.hand({ el: cells[i], timeout: 10000 }); break; } }, 1700);
    }
    if (level === 4) {

  }
  function buildBoard() {

  function layout() {

  function setColor(k) {

  }

    (function step() { var f = 1 - (Date.now() - t0) / ms; bar.style.transform = 'scaleX(' + Math.max(0, f) + ')'; if (f > 0) raf = requestAnimationFrame(step); })();
  }
  function peek() {

  }
  board.addEventListener('pointerdown', function (e) { if (busy) return; e.preventDefault(); painting = e.pointerId; paintAt(e.clientX, e.clientY); });

  }
