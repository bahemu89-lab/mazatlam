<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<link rel="stylesheet" href="../common.css">
<title>Memoria</title>
<style>
  /* Mesa de madera con veta, luz cálida y viñeta */
  .game {
    display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 10px;
    background:
      radial-gradient(ellipse 80% 70% at 50% 40%, rgba(255,235,190,.28), rgba(0,0,0,0) 60%),
      radial-gradient(ellipse 120% 100% at 50% 50%, rgba(0,0,0,0) 55%, rgba(60,25,5,.55) 100%),
      repeating-linear-gradient(90deg, rgba(0,0,0,0) 0 138px, rgba(60,30,10,.35) 138px 141px, rgba(255,220,170,.18) 141px 143px, rgba(0,0,0,0) 143px 146px),
      repeating-linear-gradient(0deg, rgba(255,235,200,.06) 0 3px, rgba(0,0,0,0) 3px 9px, rgba(80,40,10,.07) 9px 11px, rgba(0,0,0,0) 11px 17px),
      linear-gradient(180deg, #c98a4b 0%, #b8773c 45%, #9d5f2c 100%);
  }
  .game::before {
    content: ""; position: absolute; inset: 0; pointer-events: none;
    background: linear-gradient(180deg, rgba(255,240,210,.22), rgba(255,255,255,0) 30%, rgba(0,0,0,0) 70%, rgba(40,15,0,.25));
  }
  .hud {
    position: relative; z-index: 2; flex: 0 0 auto; display: flex; align-items: center; gap: 12px;
    font-size: 24px; margin-bottom: 14px;
  }
  .hud .lvl {
    padding: 6px 22px; border-radius: 30px; font-weight: 900; color: #fff; letter-spacing: .5px;
    background: linear-gradient(180deg, #ffd166 0%, #ff9f1c 100%);
    text-shadow: 0 2px 0 #b35a00, 0 3px 6px rgba(0,0,0,.3);
    box-shadow: 0 5px 0 #b35a00, 0 10px 16px rgba(0,0,0,.3), inset 0 2px 0 rgba(255,255,255,.7);
  }
  .hud .emoji { font-size: 36px; animation: float 3s ease-in-out infinite; }
  .hud .kg-level-badge { font-size: 20px; padding: 6px 16px; }
  .hud .lvbtn { font-size: 28px; margin-left: 4px; }
  /* Tapete de fieltro debajo del tablero */
  .board {
    position: relative; z-index: 1; flex: 0 0 auto; display: grid; gap: var(--gap); width: var(--bw); height: var(--bh);
  }
  .board::before {
    content: ""; position: absolute; inset: -18px; z-index: -1; border-radius: 30px;
    background:
      radial-gradient(ellipse at 50% 0%, rgba(255,255,255,.18), rgba(255,255,255,0) 60%),
      repeating-linear-gradient(45deg, rgba(255,255,255,.035) 0 4px, rgba(0,0,0,0) 4px 8px),
      linear-gradient(180deg, #2f9e5b, #1f7a45);
    box-shadow: 0 8px 0 #12472a, 0 18px 30px rgba(20,10,0,.45), inset 0 3px 0 rgba(255,255,255,.25), inset 0 0 0 6px rgba(255,255,255,.08), inset 0 -4px 0 rgba(0,0,0,.2);
  }
  .board::after {
    content: ""; position: absolute; inset: -9px; z-index: -1; border-radius: 22px; pointer-events: none;
    border: 2px dashed rgba(255,255,255,.35);
  }
  /* Cartas gruesas con giro 3D */
  .mcard { position: relative; perspective: 900px; cursor: pointer; min-width: 64px; min-height: 64px; }
  .mcard .inner {
    position: absolute; inset: 0; transform-style: preserve-3d;
    transition: transform .5s cubic-bezier(.4,1.4,.6,1);
  }
  .mcard.flipped .inner, .mcard.done .inner { transform: rotateY(180deg); }
  .mcard.flipped .inner { animation: flipShade .5s ease-out; }
  @keyframes flipShade { 0%{filter:brightness(1)} 45%{filter:brightness(.72)} 100%{filter:brightness(1)} }
  .mcard.flipped, .mcard.tapped { animation: lift .45s ease-out; }
  @keyframes lift { 0%{transform:scale(1)} 35%{transform:scale(1.08,.94) translateY(-4px)} 65%{transform:scale(.97,1.03) translateY(-8px)} 100%{transform:scale(1) translateY(0)} }
  .face {
    position: absolute; inset: 0; border-radius: 18px; overflow: hidden;
    display: flex; align-items: center; justify-content: center;
    backface-visibility: hidden; -webkit-backface-visibility: hidden;
  }
  .face.back {
    color: #fff; font-size: calc(var(--fs) * .85); font-weight: 900;
    background:
      radial-gradient(circle at 30% 20%, rgba(255,255,255,.35), rgba(255,255,255,0) 45%),
      repeating-linear-gradient(45deg, rgba(255,255,255,.1) 0 6px, rgba(255,255,255,0) 6px 14px),
      repeating-linear-gradient(-45deg, rgba(255,255,255,.1) 0 6px, rgba(255,255,255,0) 6px 14px),
      linear-gradient(160deg, var(--c1) 0%, var(--c2) 100%);
    text-shadow: 0 3px 0 rgba(0,0,0,.28), 0 6px 10px rgba(0,0,0,.3);
    box-shadow: 0 7px 0 rgba(0,0,0,.28), 0 14px 22px rgba(30,10,0,.42), inset 0 3px 0 rgba(255,255,255,.55), inset 0 -4px 0 rgba(0,0,0,.18), inset 0 0 0 4px rgba(255,255,255,.55);
    border: 3px solid #fff;
  }
  .face.back::after {
    content: ""; position: absolute; inset: 9px; border-radius: 12px;
    border: 3px solid rgba(255,255,255,.7); box-shadow: inset 0 0 0 3px rgba(0,0,0,.08);
  }
  .face.back::before {
    content: ""; position: absolute; left: 6%; right: 6%; top: 4%; height: 40%; border-radius: 14px 14px 40% 40%;
    background: linear-gradient(180deg, rgba(255,255,255,.5), rgba(255,255,255,0)); z-index: 1;
  }
  .face.back .q { position: relative; z-index: 2; transform: rotate(-8deg); text-shadow: 0 4px 0 rgba(0,0,0,.25), 0 8px 12px rgba(0,0,0,.3), 0 -1px 0 rgba(255,255,255,.4); }
  .face.back .shine {
    position: absolute; top: -20%; bottom: -20%; width: 35%; left: 0; z-index: 3; pointer-events: none;
    background: linear-gradient(90deg, rgba(255,255,255,0), rgba(255,255,255,.45), rgba(255,255,255,0));
    animation: shine 5.5s ease-in-out infinite;
  }
  .face.front {
    transform: rotateY(180deg); font-size: var(--fs);
    background: linear-gradient(180deg, #ffffff 0%, #f3f5fb 100%);
    border: 3px solid #fff;
    box-shadow: 0 7px 0 #c5cee0, 0 14px 22px rgba(30,10,0,.42), inset 0 2px 0 #fff, inset 0 0 0 5px #eef2fa, inset 0 0 0 7px #d5dcec, inset 0 -4px 0 rgba(0,0,0,.06);
  }
  .face.front::before {
    content: ""; position: absolute; left: 8%; right: 8%; top: 5%; height: 36%; border-radius: 12px 12px 50% 50%;
    background: linear-gradient(180deg, rgba(255,255,255,.9), rgba(255,255,255,0)); pointer-events: none;
  }
  .face.front::after {
    content: ""; position: absolute; inset: 0; border-radius: inherit; pointer-events: none; opacity: 0;
    box-shadow: inset 0 0 0 5px #7ee787, inset 0 0 22px rgba(80,220,120,.7), 0 0 0 4px #4ade80;
    transition: opacity .3s;
  }
  .face.front .emoji { transform: scale(1); filter: drop-shadow(0 5px 5px rgba(0,0,0,.3)); }
  .mcard.done .face.front { background: linear-gradient(180deg, #f4fff5, #d8f8de); box-shadow: 0 7px 0 #3fa864, 0 14px 22px rgba(20,120,60,.4), 0 0 26px rgba(120,255,160,.75), inset 0 2px 0 #fff, inset 0 0 0 5px #e9ffe9; }
  .mcard.done .face.front::after { opacity: 1; animation: glowPulse 1.6s ease-in-out infinite; }
  @keyframes glowPulse { 0%,100%{opacity:.55} 50%{opacity:1} }
  .mcard.done .face.front .emoji { animation: bounce .6s 1; }
  .mcard.bad { animation: shake .4s; }
  .mcard.pop { animation-fill-mode: backwards; }
  .mcard:active .inner { transform: scale(.96); }
  .mcard.flipped:active .inner, .mcard.done:active .inner { transform: rotateY(180deg); }
  /* Chispas al acertar */
  .spark {
    position: absolute; width: 22px; height: 22px; z-index: 30; pointer-events: none; margin: -11px 0 0 -11px;
    clip-path: polygon(50% 0, 62% 38%, 100% 50%, 62% 62%, 50% 100%, 38% 62%, 0 50%, 38% 38%);
    background: radial-gradient(circle at 50% 50%, #fff 0, #ffe27a 40%, #ffb703 100%);
    animation: spark .8s ease-out forwards;
  }
  @keyframes spark { 0%{transform:translate(0,0) scale(.4) rotate(0);opacity:1} 60%{opacity:1} 100%{transform:translate(var(--dx),var(--dy)) scale(1.2) rotate(180deg);opacity:0} }
</style>
</head>
<body>
<script src="../common.js"></script>
<script>
var game = KidsGame.init({ title: 'Memoria' });
(function () {
  var ANIMALS = ['🐶','🐱','🐭','🐹','🐰','🦊','🐻','🐼','🐨','🐯','🦁','🐮','🐷','🐸','🐵','🐔','🐧','🐦','🦆','🦉','🐴','🦄','🐝','🐢','🐙','🦋','🐞','🐠','🐬','🦀'];
  var BACKS = [['#ff7fb0','#c9186a'],['#4fb8ff','#4a2ed0'],['#4fd894','#137a7a'],['#ffc93c','#e8508a']];
  // Dificultad: 1 = pocas parejas, 2 = medio, 3 = muchas parejas y menos tiempo para verlas
  var DIFF = {
    1: { rounds: [{ pairs: 3, cols: 3, rows: 2 }, { pairs: 4, cols: 4, rows: 2 }], reveal: 850 },
    2: { rounds: [{ pairs: 6, cols: 4, rows: 3 }, { pairs: 8, cols: 4, rows: 4 }], reveal: 650 },
    3: { rounds: [{ pairs: 10, cols: 5, rows: 4 }, { pairs: 12, cols: 6, rows: 4 }], reveal: 420 }
  };
  var nivel = 1, LEVELS = DIFF[1].rounds;
  var level = 0, cfg, first = null, lock = false, matched = 0, board, hud, running = false;

  game.innerHTML = '';
  hud = document.createElement('div'); hud.className = 'hud';
  board = document.createElement('div'); board.className = 'board';
  game.appendChild(hud); game.appendChild(board);

  function pickLevel() {
    running = false; lock = true; first = null;
    board.innerHTML = ''; hud.innerHTML = '';
    KidsGame.levelPicker({ onPick: function (n) { nivel = n; LEVELS = DIFF[n].rounds; level = 0; start(); } });
  }
  function buildHud() {
    hud.innerHTML = '<span class="lvl">Ronda ' + (level + 1) + '</span><span class="emoji">🧠</span>';
    hud.appendChild(KidsGame.levelBadge(nivel));
    var b = document.createElement('button'); b.className = 'btn round purple lvbtn'; b.textContent = '🎚️'; b.setAttribute('aria-label', 'Cambiar nivel');
    b.addEventListener('pointerdown', function (ev) { ev.preventDefault(); ev.stopPropagation(); KidsGame.sound.tap(); pickLevel(); });
    hud.appendChild(b);
  }

  function layout() {
    var cols = cfg.cols, rows = cfg.rows;
    var W = game.clientWidth - 56, H = game.clientHeight - hud.offsetHeight - 64; // deja sitio al tapete (18px) y al margen
    // En vertical, más filas que columnas
    if (W < H && cols > rows) { var t = cols; cols = rows; rows = t; }
    var gap = 10;
    var size = Math.floor(Math.min((W - (cols - 1) * gap) / cols, (H - (rows - 1) * gap) / rows));
    size = Math.max(64, Math.min(size, 190));
    board.style.setProperty('--gap', gap + 'px');
    board.style.setProperty('--bw', (cols * size + (cols - 1) * gap) + 'px');
    board.style.setProperty('--bh', (rows * size + (rows - 1) * gap) + 'px');
    board.style.setProperty('--fs', Math.round(size * 0.58) + 'px');
    board.style.gridTemplateColumns = 'repeat(' + cols + ', 1fr)';
    board.style.gridTemplateRows = 'repeat(' + rows + ', 1fr)';
  }

  // Chispas doradas que salen del centro de una carta
  function sparkle(el) {
    var r = el.getBoundingClientRect(), g = game.getBoundingClientRect();
    var cx = r.left - g.left + r.width / 2, cy = r.top - g.top + r.height / 2;
    for (var i = 0; i < 12; i++) {
      var s = document.createElement('div'); s.className = 'spark';
      var a = (i / 12) * Math.PI * 2 + Math.random() * .4, d = r.width * .55 + Math.random() * r.width * .45;
      s.style.left = cx + 'px'; s.style.top = cy + 'px';
      s.style.setProperty('--dx', Math.cos(a) * d + 'px'); s.style.setProperty('--dy', Math.sin(a) * d + 'px');
      s.style.animationDelay = (Math.random() * 90) + 'ms';
      game.appendChild(s);
      (function (e) { setTimeout(function () { e.remove(); }, 900); })(s);
    }
  }

  function start() {
    cfg = LEVELS[Math.min(level, LEVELS.length - 1)];
    first = null; lock = false; matched = 0; running = true;
    buildHud();
    board.innerHTML = '';
    var chosen = KidsGame.shuffle(ANIMALS).slice(0, cfg.pairs);
    var deck = KidsGame.shuffle(chosen.concat(chosen));
    var back = BACKS[level % BACKS.length];
    deck.forEach(function (em, i) {
      var c = document.createElement('div');
      c.className = 'mcard pop';
      c.style.animationDelay = (i * 40) + 'ms';
      c.dataset.v = em;
      c.innerHTML = '<div class="inner">' +
        '<div class="face back" style="--c1:' + back[0] + ';--c2:' + back[1] + '"><span class="q">?</span><i class="shine" style="animation-delay:' + (i * 0.37) + 's"></i></div>' +
        '<div class="face front"><span class="emoji">' + em + '</span></div></div>';
      c.addEventListener('pointerdown', function (ev) { ev.preventDefault(); tap(c); });
      board.appendChild(c);
    });
    layout();
    KidsGame.say('Encuentra las parejas');
  }

  function tap(c) {
    if (!running || lock || c.classList.contains('flipped') || c.classList.contains('done')) return;
    KidsGame.sound.tap();
    c.classList.remove('pop'); c.style.animationDelay = '';
    c.classList.add('flipped');
    if (!first) { first = c; return; }
    var a = first, b = c; first = null; lock = true;
    if (a.dataset.v === b.dataset.v) {
      setTimeout(function () {
        a.classList.add('done'); b.classList.add('done');
        a.classList.remove('flipped'); b.classList.remove('flipped');
        KidsGame.sound.ok(); KidsGame.addStar(); KidsGame.vibrate(30);
        sparkle(a); sparkle(b);
        matched++; lock = false;
        if (matched === cfg.pairs) setTimeout(finish, 500);
      }, 350);
    } else {
      setTimeout(function () {
        KidsGame.sound.wrong();
        a.classList.add('bad'); b.classList.add('bad');
        setTimeout(function () {
          a.classList.remove('flipped', 'bad'); b.classList.remove('flipped', 'bad');
          if (running) lock = false;
        }, 400);
      }, DIFF[nivel].reveal);
    }
  }

  function finish() {
    KidsGame.celebrate({
      sub: 'Ronda ' + (level + 1) + ' completa',
      onNext: function () { level = Math.min(level + 1, LEVELS.length - 1); start(); },
      onAgain: function () { start(); }
    });
  }

  window.addEventListener('resize', function () { if (cfg && running) layout(); });
  pickLevel();
})();
</script>
</body>
</html>
