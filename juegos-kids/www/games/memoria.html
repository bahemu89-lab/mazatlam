<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<link rel="stylesheet" href="../common.css">
<title>Memoria</title>
<style>
  /* ===== La feria de los animales: cielo de tarde, carpa a rayas, foquitos y la caseta con tapete ===== */
  .game {
    display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 10px;
    background:
      radial-gradient(ellipse 90% 55% at 50% 112%, rgba(255,214,140,.55), rgba(0,0,0,0) 60%),
      radial-gradient(circle at 18% 30%, rgba(255,255,255,.18) 0 3px, rgba(255,255,255,0) 4px),
      radial-gradient(circle at 72% 22%, rgba(255,255,255,.18) 0 2px, rgba(255,255,255,0) 3px),
      radial-gradient(circle at 88% 42%, rgba(255,255,255,.15) 0 2px, rgba(255,255,255,0) 3px),
      linear-gradient(180deg, #4b2fa8 0%, #8a5ad6 32%, #ef87b0 66%, #ffb86b 100%);
  }
  /* Toldo de la carpa a rayas con borde ondulado */
  .game::before {
    content: ""; position: absolute; left: 0; right: 0; top: 0; height: 58px; pointer-events: none; z-index: 0;
    background: repeating-linear-gradient(90deg, #ff4d6d 0 56px, #fff 56px 112px);
    border-bottom: 5px solid #c9184a; box-shadow: 0 8px 16px rgba(60,0,40,.3);
    -webkit-mask: radial-gradient(circle at 28px 58px, rgba(0,0,0,0) 26px, #000 27px) repeat-x; -webkit-mask-size: 56px 100%;
    mask: radial-gradient(circle at 28px 58px, rgba(0,0,0,0) 26px, #000 27px) repeat-x; mask-size: 56px 100%;
  }
  /* Guirnalda de foquitos bajo el toldo */
  .game::after {
    content: ""; position: absolute; left: 0; right: 0; top: 62px; height: 26px; pointer-events: none; z-index: 0; opacity: .95;
    background: radial-gradient(circle at 50% 60%, #fff9c4 0 4px, rgba(255,230,120,.75) 6px, rgba(255,230,120,0) 11px) repeat-x;
    background-size: 44px 26px;
  }
  .hud {
    position: relative; z-index: 2; flex: 0 0 auto; display: flex; align-items: center; gap: 10px; font-size: 24px; margin: 46px 0 12px; flex-wrap: wrap; justify-content: center;
  }
  .hud .lvl {
    padding: 6px 20px; border-radius: 30px; font-weight: 900; color: #fff; letter-spacing: .5px;
    background: linear-gradient(180deg, #ffd166 0%, #ff9f1c 100%);
    text-shadow: 0 2px 0 #b35a00, 0 3px 6px rgba(0,0,0,.3);
    box-shadow: 0 5px 0 #b35a00, 0 10px 16px rgba(0,0,0,.3), inset 0 2px 0 rgba(255,255,255,.7);
  }
  .hud .hero { width: 60px; height: 60px; filter: drop-shadow(0 4px 4px rgba(0,0,0,.3)); }
  .hud .kg-level-badge { font-size: 20px; padding: 6px 16px; }
  .hud .btn.round { width: 60px; height: 60px; font-size: 26px; }
  .hud .moves {
    padding: 6px 16px; border-radius: 30px; font-weight: 900; color: #fff; font-size: 20px; white-space: nowrap;
    background: linear-gradient(180deg, #7dd0ff 0%, #2f95e8 100%);
    text-shadow: 0 2px 0 #1a63a8, 0 3px 6px rgba(0,0,0,.3);
    box-shadow: 0 5px 0 #1a63a8, 0 10px 16px rgba(0,0,0,.3), inset 0 2px 0 rgba(255,255,255,.7);
  }
  .hud .moves.tri { background: linear-gradient(180deg, #b39cff 0%, #7f5af0 100%); text-shadow: 0 2px 0 #5232b3; box-shadow: 0 5px 0 #5232b3, 0 10px 16px rgba(0,0,0,.3), inset 0 2px 0 rgba(255,255,255,.7); }
  @media (max-width: 700px) { .hud { gap: 8px; font-size: 20px; } .hud .lvl { padding: 6px 14px; } .hud .moves { font-size: 17px; padding: 6px 12px; } .hud .hero { width: 50px; height: 50px; } }
  /* Caseta: marco de madera con foquitos y tapete de fieltro */
  .board { position: relative; z-index: 1; flex: 0 0 auto; display: grid; gap: var(--gap); width: var(--bw); height: var(--bh); }
  .board::before {
    content: ""; position: absolute; inset: -18px; z-index: -1; border-radius: 30px;
    background:
      radial-gradient(ellipse at 50% 0%, rgba(255,255,255,.18), rgba(255,255,255,0) 60%),
      repeating-linear-gradient(45deg, rgba(255,255,255,.035) 0 4px, rgba(0,0,0,0) 4px 8px),
      linear-gradient(180deg, #2f9e5b, #1f7a45);
    box-shadow: 0 8px 0 #12472a, 0 18px 30px rgba(40,10,40,.45), inset 0 3px 0 rgba(255,255,255,.25), inset 0 0 0 6px #c9184a, inset 0 0 0 9px #ffd166, inset 0 -4px 0 rgba(0,0,0,.2);
  }
  .board::after {
    content: ""; position: absolute; inset: -9px; z-index: -1; border-radius: 22px; pointer-events: none;
    border: 2px dashed rgba(255,255,255,.35);
  }
  /* Transición entre rondas (solo transform/opacity) */
  .board { transition: transform .32s cubic-bezier(.3,1.3,.5,1), opacity .3s; }
  .board.out { transform: translateX(-10%) scale(.9); opacity: 0; }
  .board.in { transform: translateX(10%) scale(.9); opacity: 0; transition: none; }
  /* Cartas gruesas con giro 3D (sin filtros ni sombras animadas en bucle) */
  .mcard { position: relative; perspective: 900px; cursor: pointer; min-width: 64px; min-height: 64px; }
  .mcard .inner { position: absolute; inset: 0; transform-style: preserve-3d; transition: transform .5s cubic-bezier(.4,1.4,.6,1); }
  .mcard.flipped .inner, .mcard.done .inner { transform: rotateY(180deg); }
  .mcard.flipped, .mcard.tapped { animation: lift .45s ease-out; }
  @keyframes lift { 0%{transform:scale(1)} 35%{transform:scale(1.08,.94) translateY(-4px)} 65%{transform:scale(.97,1.03) translateY(-8px)} 100%{transform:scale(1) translateY(0)} }
  .face {
    position: absolute; inset: 0; border-radius: 18px; overflow: hidden;
    display: flex; align-items: center; justify-content: center;
    backface-visibility: hidden; -webkit-backface-visibility: hidden;
  }
  .face.back {
    color: #fff;
    background:
      radial-gradient(circle at 30% 20%, rgba(255,255,255,.35), rgba(255,255,255,0) 45%),
      repeating-linear-gradient(45deg, rgba(255,255,255,.1) 0 6px, rgba(255,255,255,0) 6px 14px),
      repeating-linear-gradient(-45deg, rgba(255,255,255,.1) 0 6px, rgba(255,255,255,0) 6px 14px),
      linear-gradient(160deg, var(--c1) 0%, var(--c2) 100%);
    box-shadow: 0 7px 0 rgba(0,0,0,.28), 0 14px 22px rgba(30,10,0,.42), inset 0 3px 0 rgba(255,255,255,.55), inset 0 -4px 0 rgba(0,0,0,.18), inset 0 0 0 4px rgba(255,255,255,.55);
    border: 3px solid #fff;
  }
  .face.back::after { content: ""; position: absolute; inset: 9px; border-radius: 12px; border: 3px solid rgba(255,255,255,.7); box-shadow: inset 0 0 0 3px rgba(0,0,0,.08); }
  .face.back::before {
    content: ""; position: absolute; left: 6%; right: 6%; top: 4%; height: 40%; border-radius: 14px 14px 40% 40%;
    background: linear-gradient(180deg, rgba(255,255,255,.5), rgba(255,255,255,0)); z-index: 1;
  }
  .face.back .mt { position: relative; z-index: 2; width: 62%; height: 62%; }
  .face.back .tri { position: absolute; right: 8px; top: 8px; z-index: 3; width: 30px; height: 30px; border-radius: 50%; font-size: 18px; font-weight: 900; line-height: 30px; text-align: center; background: #fff; color: #5232b3; box-shadow: 0 2px 0 rgba(0,0,0,.2); }
  .face.front {
    transform: rotateY(180deg); font-size: var(--fs);
    background: linear-gradient(180deg, #ffffff 0%, #f3f5fb 100%);
    border: 3px solid #fff;
    box-shadow: 0 7px 0 #c5cee0, 0 14px 22px rgba(30,10,0,.42), inset 0 2px 0 #fff, inset 0 0 0 5px #eef2fa, inset 0 0 0 7px #d5dcec, inset 0 -4px 0 rgba(0,0,0,.06);
  }
  .face.front::before {
    content: ""; position: absolute; left: 8%; right: 8%; top: 5%; height: 36%; border-radius: 12px 12px 50% 50%;
    background: linear-gradient(180deg, rgba(255,255,255,.9), rgba(255,255,255,0)); pointer-events: none;
  }
  .face.front .emoji { filter: drop-shadow(0 5px 5px rgba(0,0,0,.3)); }
  .mcard.done .face.front { background: linear-gradient(180deg, #f4fff5, #d8f8de); box-shadow: 0 7px 0 #3fa864, 0 14px 22px rgba(20,120,60,.4), 0 0 0 4px #7ee787, inset 0 2px 0 #fff, inset 0 0 0 5px #e9ffe9; }
  .mcard.done .face.front .emoji { animation: bounce .6s 1; }
  .mcard.bad { animation: shake .4s; }
  .mcard.pop { animation-fill-mode: backwards; }
  .mcard:active .inner { transform: scale(.96); }
  .mcard.flipped:active .inner, .mcard.done:active .inner { transform: rotateY(180deg); }
  .mcard.mix { transition: transform .7s cubic-bezier(.4,1.3,.5,1); z-index: 5; }
  .mcard.mix .inner { animation: none; }
  /* Caballito del carrusel que sube y baja */
  .hero .horse { animation: hbob 1.6s ease-in-out infinite; }
  @keyframes hbob { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-5px); } }
  /* Banner de ronda */
  .rbanner {
    position: absolute; left: 50%; top: 42%; z-index: 30; transform: translate(-50%, -50%) scale(.5); opacity: 0; pointer-events: none;
    padding: 10px 36px; border-radius: 40px; font-size: clamp(26px, 4.5vw, 44px); font-weight: 900; color: #fff; white-space: nowrap;
    background: linear-gradient(180deg, #ffb703, #ff8906); text-shadow: 0 3px 0 #b85a00, 0 6px 10px rgba(0,0,0,.3);
    box-shadow: 0 8px 0 #b85a00, 0 16px 26px rgba(0,0,0,.35), inset 0 2px 0 rgba(255,255,255,.6);
    transition: transform .35s cubic-bezier(.3,1.5,.5,1), opacity .3s;
  }
  .rbanner.show { transform: translate(-50%, -50%) scale(1); opacity: 1; }
</style>
</head>
<body>
<script src="../common.js"></script>
<script>
var game = KidsGame.init({ title: 'Memoria' });
(function () {
  var ANIMALS = ['🐶','🐱','🐭','🐹','🐰','🦊','🐻','🐼','🐨','🐯','🦁','🐮','🐷','🐸','🐵','🐔','🐧','🐦','🦆','🦉','🐴','🦄','🐝','🐢','🐙','🦋','🐞','🐠','🐬','🦀','🦒','🦓','🐘','🦔','🐿️','🦜'];
  // Dorsos de carta ilustrados: el primero es gratis, cada nivel completado desbloquea otro (cosmético, se guarda en localStorage)
  var BACKS = [
    { id: 'estrella', n: 'Estrellitas', c1: '#ff7fb0', c2: '#c9186a', sym: '<polygon points="50,6 61,36 93,37 67,57 77,90 50,71 23,90 33,57 7,37 39,36" fill="#fff"/><polygon points="50,24 57,40 74,41 60,52 65,69 50,59 35,69 40,52 26,41 43,40" fill="#ffe08a"/><circle cx="50" cy="48" r="5" fill="#fff"/>' },
    { id: 'globo', n: 'Globos', c1: '#4fb8ff', c2: '#4a2ed0', sym: '<ellipse cx="50" cy="40" rx="27" ry="33" fill="#fff"/><ellipse cx="50" cy="40" rx="20" ry="26" fill="#dff1ff"/><ellipse cx="40" cy="27" rx="6" ry="11" fill="#fff" transform="rotate(-20 40 27)"/><path d="M45 73 L55 73 L50 80 Z" fill="#fff"/><path d="M50 80 Q38 88 50 97" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round"/>' },
    { id: 'carrusel', n: 'Carrusel', c1: '#ffc93c', c2: '#e8508a', sym: '<path d="M50 8 L12 40 L88 40 Z" fill="#fff"/><path d="M26 40 L50 8 L38 40Z M62 40 L50 8 L74 40Z" fill="#ffe08a"/><circle cx="50" cy="7" r="4" fill="#fff"/><rect x="48" y="40" width="4" height="46" fill="#fff"/><rect x="20" y="40" width="3" height="46" fill="#fff" opacity=".8"/><rect x="77" y="40" width="3" height="46" fill="#fff" opacity=".8"/><ellipse cx="50" cy="88" rx="38" ry="7" fill="#fff"/><rect x="34" y="58" width="30" height="14" rx="7" fill="#fff"/><circle cx="66" cy="60" r="6" fill="#fff"/><rect x="38" y="70" width="4" height="10" fill="#fff"/><rect x="56" y="70" width="4" height="10" fill="#fff"/>' },
    { id: 'helado', n: 'Helados', c1: '#8ef0b0', c2: '#1f8a7a', sym: '<path d="M30 48 L50 94 L70 48 Z" fill="#ffd9a6"/><path d="M36 54 L64 54 M40 64 L60 64 M45 74 L55 74" stroke="#d9a060" stroke-width="2"/><circle cx="50" cy="38" r="20" fill="#fff"/><circle cx="36" cy="46" r="12" fill="#ffb3c6"/><circle cx="64" cy="46" r="12" fill="#ffe08a"/><circle cx="50" cy="20" r="5" fill="#ff4d6d"/><ellipse cx="44" cy="32" rx="5" ry="3" fill="#fff" opacity=".9"/>' },
    { id: 'rueda', n: 'Rueda de la fortuna', c1: '#b39cff', c2: '#5232b3', sym: '<circle cx="50" cy="46" r="34" fill="none" stroke="#fff" stroke-width="4"/><path d="M50 12 L50 80 M16 46 L84 46 M26 22 L74 70 M74 22 L26 70" stroke="#fff" stroke-width="3"/><circle cx="50" cy="46" r="6" fill="#ffe08a"/><circle cx="50" cy="12" r="6" fill="#ffe08a"/><circle cx="50" cy="80" r="6" fill="#ffe08a"/><circle cx="16" cy="46" r="6" fill="#ffe08a"/><circle cx="84" cy="46" r="6" fill="#ffe08a"/><circle cx="26" cy="22" r="6" fill="#ffb3c6"/><circle cx="74" cy="22" r="6" fill="#ffb3c6"/><circle cx="26" cy="70" r="6" fill="#ffb3c6"/><circle cx="74" cy="70" r="6" fill="#ffb3c6"/><path d="M40 80 L30 96 M60 80 L70 96" stroke="#fff" stroke-width="4" stroke-linecap="round"/>' }
  ];
  // Dificultad: 1 = pocas parejas ... 4 = Experto: 15 parejas, tríos, las cartas se mezclan y casi no hay tiempo para verlas
  var DIFF = {
    1: { rounds: [{ pairs: 3, cols: 3, rows: 2 }, { pairs: 4, cols: 4, rows: 2 }], reveal: 850 },
    2: { rounds: [{ pairs: 6, cols: 4, rows: 3 }, { pairs: 8, cols: 4, rows: 4 }], reveal: 600 },
    3: { rounds: [{ pairs: 10, cols: 5, rows: 4 }, { pairs: 12, cols: 6, rows: 4 }], reveal: 420 },
    4: { rounds: [{ pairs: 15, cols: 6, rows: 5, mix: 5 }, { pairs: 10, need: 3, cols: 6, rows: 5, mix: 5 }], reveal: 350 }
  };
  var LABELS = { 1: '4 parejas', 2: '8 parejas', 3: '12 parejas', 4: '15 parejas · tríos · se mezclan' };
  var HOWTO = [{ icon: '👆', text: 'Toca dos cartas para voltearlas' }, { icon: '🐵🐵', text: 'Si son iguales, se quedan' }, { icon: '🎠', text: 'Encuentra todas las parejas' }];
  var nivel = 1, LEVELS = DIFF[1].rounds;
  var level = 0, cfg, open = [], lock = false, matched = 0, moves = 0, mixed = false, board, hud, movesEl, running = false, streak = 0, handShown = false;

  function el(tag, cls, html) { var d = document.createElement(tag); if (cls) d.className = cls; if (html != null) d.innerHTML = html; return d; }
  function readJSON(k, def) { try { return JSON.parse(localStorage.getItem(k)) || def; } catch (e) { return def; } }
  function writeJSON(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
  function unlockedBacks() { var u = readJSON('kg-memoria-backs', ['estrella']); if (u.indexOf('estrella') < 0) u.unshift('estrella'); return u; }
  function currentBack() { var sel = null; try { sel = localStorage.getItem('kg-memoria-back'); } catch (e) {} var u = unlockedBacks(); if (!sel || u.indexOf(sel) < 0) sel = u[u.length - 1]; for (var i = 0; i < BACKS.length; i++) if (BACKS[i].id === sel) return BACKS[i]; return BACKS[0]; }

  // ---- Hero art: carrusel de la feria (SVG) ----
  function heroSVG(size) {
    return '<svg class="hero" viewBox="0 0 120 120" width="' + size + '" height="' + size + '" aria-hidden="true"><defs>' +
      '<linearGradient id="hrf" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ff8fb3"/><stop offset="1" stop-color="#e0245e"/></linearGradient>' +
      '<linearGradient id="hpl" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff3c4"/><stop offset=".5" stop-color="#ffd166"/><stop offset="1" stop-color="#d9a520"/></linearGradient>' +
      '<radialGradient id="hhb" cx=".4" cy=".35" r=".8"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#c9d4ee"/></radialGradient>' +
      '<clipPath id="hroof"><path d="M60 8 L8 50 L112 50 Z"/></clipPath></defs>' +
      '<ellipse cx="60" cy="113" rx="48" ry="6" fill="rgba(0,0,0,.22)"/>' +
      '<ellipse cx="60" cy="104" rx="50" ry="11" fill="#b8306f"/><ellipse cx="60" cy="100" rx="50" ry="11" fill="url(#hpl)"/><ellipse cx="60" cy="98" rx="38" ry="6" fill="rgba(255,255,255,.45)"/>' +
      '<rect x="18" y="48" width="4" height="54" rx="2" fill="url(#hpl)"/><rect x="98" y="48" width="4" height="54" rx="2" fill="url(#hpl)"/><rect x="58" y="48" width="4" height="54" rx="2" fill="url(#hpl)"/>' +
      '<g class="horse"><rect x="36" y="68" width="42" height="20" rx="10" fill="url(#hhb)" stroke="#8f9bc4" stroke-width="2"/>' +
      '<path d="M72 72 Q92 60 88 80 Q86 86 78 84 Z" fill="url(#hhb)" stroke="#8f9bc4" stroke-width="2" stroke-linejoin="round"/>' +
      '<path d="M70 68 Q76 56 88 62 Q80 66 78 72Z" fill="#f582ae"/><circle cx="83" cy="72" r="2.2" fill="#2b2b2b"/><circle cx="87" cy="78" r="1.3" fill="#8f9bc4"/>' +
      '<rect x="41" y="86" width="6" height="13" rx="3" fill="#dfe6f7" stroke="#8f9bc4" stroke-width="1.5"/><rect x="66" y="86" width="6" height="13" rx="3" fill="#dfe6f7" stroke="#8f9bc4" stroke-width="1.5"/>' +
      '<path d="M38 74 Q26 70 30 84" fill="none" stroke="#f582ae" stroke-width="3.5" stroke-linecap="round"/>' +
      '<rect x="50" y="62" width="14" height="10" rx="4" fill="#ff8906" stroke="#b85a00" stroke-width="1.5"/></g>' +
      '<g clip-path="url(#hroof)"><rect x="8" y="8" width="104" height="44" fill="url(#hrf)"/><rect x="22" y="8" width="13" height="44" fill="#fff" opacity=".9"/><rect x="53" y="8" width="14" height="44" fill="#fff" opacity=".9"/><rect x="85" y="8" width="13" height="44" fill="#fff" opacity=".9"/></g>' +
      '<path d="M60 8 L8 50 L112 50 Z" fill="none" stroke="#b8306f" stroke-width="2.5" stroke-linejoin="round"/>' +
      '<path d="M8 50 Q60 64 112 50 L112 50 Q60 58 8 50Z" fill="#ffd166" stroke="#b8306f" stroke-width="2"/>' +
      '<circle cx="60" cy="7" r="5" fill="url(#hpl)" stroke="#b8306f" stroke-width="1.5"/>' +
      '</svg>';
  }
  // Símbolos de los dorsos (una sola vez; cada carta los usa con <use>)
  function symbolDefs() { return '<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>' + BACKS.map(function (b) { return '<symbol id="mb-' + b.id + '" viewBox="0 0 100 100">' + b.sym + '</symbol>'; }).join('') + '</defs></svg>'; }

  game.innerHTML = symbolDefs();
  hud = el('div', 'hud');
  board = el('div', 'board');
  var banner = el('div', 'rbanner');
  game.appendChild(hud); game.appendChild(board); game.appendChild(banner);

  function showBanner(txt, ms) { banner.textContent = txt; banner.classList.add('show'); clearTimeout(banner._t); banner._t = setTimeout(function () { banner.classList.remove('show'); }, ms || 1200); }
  // Juice compartido: acierto (partículas, anillo, texto flotante, racha) y fallo (sacudida suave, la racha se reinicia sin castigo)
  function hit(node) {
    streak++;
    var r = node.getBoundingClientRect(), x = r.left + r.width / 2, y = r.top;
    KidsGame.fx.burstAt(node, { n: 12, chars: streak >= 3 ? ['⭐', '✨', '🎠'] : null });
    KidsGame.fx.ring(node);
    KidsGame.fx.floatText(x, y, streak >= 3 ? '¡Racha x' + streak + '!' : '+1', 'good');
    if (streak >= 3 && streak % 5 === 0) { KidsGame.addStar(); KidsGame.toast('🔥 ¡Racha x' + streak + '! ⭐ extra', 1400); KidsGame.sound.win(); }
  }
  function miss(nodes) { streak = 0; nodes.forEach(function (n) { KidsGame.fx.shake(n); }); }

  function pickLevel() {
    running = false; lock = true; open = [];
    board.innerHTML = ''; hud.innerHTML = '';
    KidsGame.levelPicker({ labels: LABELS, howto: HOWTO, art: heroSVG(64), music: 'alegre', onPick: function (n) { nivel = n; LEVELS = DIFF[n].rounds; level = 0; start(true); } });
  }
  function buildHud() {
    hud.innerHTML = '<span class="lvl">Ronda ' + (level + 1) + '</span>' + heroSVG(60);
    movesEl = el('span', 'moves' + (cfg.need === 3 ? ' tri' : ''));
    hud.appendChild(movesEl); updateMoves();
    hud.appendChild(KidsGame.levelBadge(nivel));
    var bb = el('button', 'btn round blue', '🎨'); bb.setAttribute('aria-label', 'Cambiar dorso');
    bb.addEventListener('pointerdown', function (ev) { ev.preventDefault(); ev.stopPropagation(); cycleBack(); });
    hud.appendChild(bb);
    var b = el('button', 'btn round purple lvbtn', '🎚️'); b.setAttribute('aria-label', 'Cambiar nivel');
    b.addEventListener('pointerdown', function (ev) { ev.preventDefault(); ev.stopPropagation(); KidsGame.sound.tap(); pickLevel(); });
    hud.appendChild(b);
  }
  function updateMoves() { if (movesEl) movesEl.textContent = (cfg.need === 3 ? '3️⃣ ' : '') + '👆 ' + moves; }
  function cycleBack() {
    KidsGame.sound.tap();
    var u = unlockedBacks();
    if (u.length < 2) { KidsGame.toast('🎁 Completa un nivel para ganar un dorso nuevo', 1800); KidsGame.say('Completa un nivel para ganar un dorso nuevo'); return; }
    var cur = currentBack(), i = (u.indexOf(cur.id) + 1) % u.length, nb = null;
    for (var k = 0; k < BACKS.length; k++) if (BACKS[k].id === u[i]) nb = BACKS[k];
    try { localStorage.setItem('kg-memoria-back', nb.id); } catch (e) {}
    applyBack(nb); KidsGame.toast('🎴 ' + nb.n, 1200); KidsGame.sound.pop();
  }
  function applyBack(b) {
    Array.prototype.forEach.call(board.querySelectorAll('.face.back'), function (f) {
      f.style.setProperty('--c1', b.c1); f.style.setProperty('--c2', b.c2);
      var u = f.querySelector('use'); if (u) { u.setAttribute('href', '#mb-' + b.id); u.setAttributeNS('http://www.w3.org/1999/xlink', 'xlink:href', '#mb-' + b.id); }
    });
  }

  function layout() {
    var cols = cfg.cols, rows = cfg.rows;
    var W = game.clientWidth - 56, H = game.clientHeight - hud.offsetHeight - 46 - 12 - 20 - 56; // toldo, márgenes del HUD, padding y tapete (18px por lado)
    if (W < H && cols > rows) { var t = cols; cols = rows; rows = t; }
    var gap = 10;
    var size = Math.floor(Math.min((W - (cols - 1) * gap) / cols, (H - (rows - 1) * gap) / rows));
    size = Math.max(64, Math.min(size, 190));
    board.style.setProperty('--gap', gap + 'px');
    board.style.setProperty('--bw', (cols * size + (cols - 1) * gap) + 'px');
    board.style.setProperty('--bh', (rows * size + (rows - 1) * gap) + 'px');
    board.style.setProperty('--fs', Math.round(size * 0.58) + 'px');
    board.style.gridTemplateColumns = 'repeat(' + cols + ', 1fr)';
    board.style.gridTemplateRows = 'repeat(' + rows + ', 1fr)';
  }

  // start(first): primera ronda entra deslizando; las siguientes salen y entran (nunca un cambio seco)
  function start(first) {
    if (!first && board.children.length) {
      lock = true; board.classList.add('out');
      setTimeout(function () { board.classList.remove('out'); build(); }, 320);
    } else build();
  }
  function build() {
    cfg = LEVELS[Math.min(level, LEVELS.length - 1)];
    open = []; lock = false; matched = 0; moves = 0; mixed = false; running = true; streak = 0;
    buildHud();
    board.innerHTML = '';
    var need = cfg.need || 2;
    var chosen = KidsGame.shuffle(ANIMALS).slice(0, cfg.pairs);
    var deck = chosen;
    for (var k = 1; k < need; k++) deck = deck.concat(chosen);
    deck = KidsGame.shuffle(deck);
    var back = currentBack();
    deck.forEach(function (em, i) {
      var c = el('div', 'mcard pop');
      c.style.animationDelay = (i * (deck.length > 16 ? 22 : 40)) + 'ms';
      c.dataset.v = em;
      c.innerHTML = '<div class="inner">' +
        '<div class="face back" style="--c1:' + back.c1 + ';--c2:' + back.c2 + '"><svg class="mt" viewBox="0 0 100 100"><use href="#mb-' + back.id + '" xlink:href="#mb-' + back.id + '"/></svg>' + (need === 3 ? '<span class="tri">3</span>' : '') + '</div>' +
        '<div class="face front"><span class="emoji">' + em + '</span></div></div>';
      c.addEventListener('pointerdown', function (ev) { ev.preventDefault(); tap(c); });
      board.appendChild(c);
    });
    layout();
    board.classList.add('in'); void board.offsetWidth; board.classList.remove('in');
    showBanner('Ronda ' + (level + 1) + ' de ' + LEVELS.length);
    KidsGame.say(need === 3 ? 'Encuentra los tríos: tres iguales' : 'Encuentra las parejas');
    if (cfg.mix) setTimeout(function () { if (running) KidsGame.toast('👀 ¡Ojo! Se van a mezclar', 1800); }, 1200);
    // Tutorial: manita en la primera carta, solo en la primera ronda del nivel 1
    if (nivel === 1 && level === 0 && !handShown) { handShown = true; setTimeout(function () { if (running && board.children[0]) KidsGame.hand({ el: board.children[0] }); }, 900); }
  }

  function tap(c) {
    if (!running || lock || c.classList.contains('flipped') || c.classList.contains('done')) return;
    KidsGame.sound.tap();
    c.classList.remove('pop'); c.style.animationDelay = '';
    c.classList.add('flipped');
    open.push(c);
    var need = cfg.need || 2;
    if (open.length === 1) return;
    var cur = open.slice();
    var ok = cur.every(function (x) { return x.dataset.v === cur[0].dataset.v; });
    if (ok && cur.length < need) return; // en tríos: dos iguales, falta la tercera
    moves++; updateMoves();
    open = []; lock = true;
    if (ok) {
      setTimeout(function () {
        cur.forEach(function (x) { x.classList.add('done'); x.classList.remove('flipped'); });
        hit(cur[cur.length - 1]);
        KidsGame.sound.ok(); KidsGame.addStar(); KidsGame.vibrate(30);
        matched++; lock = false;
        if (matched === cfg.pairs) setTimeout(finish, 500);
        else if (cfg.mix && !mixed && matched === cfg.mix) remix();
      }, 350);
    } else {
      setTimeout(function () {
        KidsGame.sound.wrong(); miss(cur);
        setTimeout(function () {
          cur.forEach(function (x) { x.classList.remove('flipped'); });
          if (running) lock = false;
        }, 400);
      }, DIFF[nivel].reveal);
    }
  }

  // Experto: las cartas que faltan cambian de lugar (animación FLIP) para obligar a memorizar de nuevo
  function remix() {
    mixed = true; lock = true;
    var all = Array.prototype.slice.call(board.children);
    var free = all.filter(function (c) { return !c.classList.contains('done'); });
    var before = {}; all.forEach(function (c, i) { before[i] = c.getBoundingClientRect(); c._i = i; });
    var perm = KidsGame.shuffle(free);
    var order = all.map(function (c) { return c.classList.contains('done') ? c : perm.pop(); });
    KidsGame.toast('🔀 ¡Se mezclaron!', 1600); KidsGame.say('¡Se mezclaron!'); KidsGame.sound.pop();
    order.forEach(function (c) { board.appendChild(c); });
    order.forEach(function (c) {
      var r = c.getBoundingClientRect(), b = before[c._i];
      c.style.transition = 'none';
      c.style.transform = 'translate(' + (b.left - r.left) + 'px,' + (b.top - r.top) + 'px)';
      c.classList.remove('pop');
    });
    void board.offsetWidth;
    order.forEach(function (c, i) {
      c.classList.add('mix');
      c.style.transition = '';
      c.style.transitionDelay = (i * 12) + 'ms';
      c.style.transform = 'translate(0,0)';
    });
    setTimeout(function () {
      order.forEach(function (c) { c.classList.remove('mix'); c.style.transform = ''; c.style.transitionDelay = ''; });
      if (running) lock = false;
    }, 1100);
  }

  function finish() {
    var best = cfg.pairs, ratio = moves / best;
    var stars = ratio <= 1.6 ? 3 : (ratio <= 2.4 ? 2 : 1);
    var last = level >= LEVELS.length - 1;
    var sub = 'Ronda ' + (level + 1) + ' · ' + moves + ' movimientos' + (stars === 3 ? ' · ¡súper memoria!' : '');
    if (last) {
      KidsGame.levelDone(nivel);
      // Recompensa cosmética: un dorso nuevo por nivel completado
      var nb = BACKS[nivel], u = unlockedBacks();
      if (nb && u.indexOf(nb.id) < 0) { u.push(nb.id); writeJSON('kg-memoria-backs', u); try { localStorage.setItem('kg-memoria-back', nb.id); } catch (e) {} sub += ' · 🎴 Dorso nuevo: ' + nb.n; }
    }
    KidsGame.celebrate({
      sub: sub,
      stars: stars,
      onNext: function () { level = Math.min(level + 1, LEVELS.length - 1); start(); },
      onAgain: function () { start(); }
    });
  }

  window.addEventListener('resize', function () { if (cfg && running) layout(); });
  // Expuesto para pruebas
  window.__mem = { get cfg() { return cfg; }, get matched() { return matched; }, get moves() { return moves; }, get lock() { return lock; }, get mixed() { return mixed; }, get streak() { return streak; } };
  pickLevel();
})();
</script>
</body>
