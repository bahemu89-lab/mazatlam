<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<link rel="stylesheet" href="../common.css">
<title>Atrapa al topo</title>
<style>
  /* Jardín: césped con luz, franjas de podado y viñeta */
  .game {
    display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 8px; touch-action: none;
    background:
      radial-gradient(ellipse 120% 90% at 50% 50%, rgba(0,0,0,0) 55%, rgba(0,60,0,.35) 100%),
      radial-gradient(ellipse 70% 40% at 50% 0%, rgba(255,255,220,.45), rgba(255,255,255,0) 70%),
      repeating-linear-gradient(105deg, rgba(255,255,255,.07) 0 46px, rgba(0,0,0,.05) 46px 92px),
      linear-gradient(180deg, #b6ec8a 0%, #7dcf5b 45%, #4fae3f 100%);
  }
  .deco { position: absolute; z-index: 0; pointer-events: none; filter: drop-shadow(0 4px 3px rgba(0,0,0,.25)); line-height: 1;
    font-family: "Noto Color Emoji", "Apple Color Emoji", "Segoe UI Emoji", sans-serif; }
  .deco.sway { animation: sway 3.2s ease-in-out infinite; transform-origin: 50% 100%; }
  @keyframes sway { 0%,100%{transform:rotate(-4deg)} 50%{transform:rotate(4deg)} }
  .deco.fly { animation: fly 14s ease-in-out infinite; }
  @keyframes fly { 0%{transform:translate(0,0) rotate(-6deg)} 25%{transform:translate(28vw,-8vh) rotate(8deg)} 50%{transform:translate(55vw,4vh) rotate(-6deg)} 75%{transform:translate(30vw,12vh) rotate(8deg)} 100%{transform:translate(0,0) rotate(-6deg)} }
  .hud { position: absolute; left: 10px; top: 8px; z-index: 5; display: flex; align-items: center; gap: 8px; }
  .hud .kg-level-badge { font-size: 20px; padding: 6px 16px; }
  .hud .lvbtn { font-size: 28px; }
  .lvl {
    position: absolute; right: 12px; top: 10px; z-index: 5; font-size: 20px; font-weight: 900; color: #fff; border-radius: 30px; padding: 6px 18px;
    background: linear-gradient(180deg, #ffd166 0%, #ff9f1c 100%);
    text-shadow: 0 2px 0 #b35a00, 0 3px 6px rgba(0,0,0,.3);
    box-shadow: 0 5px 0 #b35a00, 0 10px 16px rgba(0,0,0,.3), inset 0 2px 0 rgba(255,255,255,.7);
  }
  .prog {
    position: relative; z-index: 1; flex: 0 0 auto; display: flex; gap: 8px; margin-bottom: 12px; padding: 9px 16px; border-radius: 30px;
    background: linear-gradient(180deg, rgba(255,255,255,.95), rgba(235,244,255,.9)); border: 3px solid #fff;
    box-shadow: 0 6px 0 #b9c8e0, 0 12px 20px rgba(0,50,0,.25), inset 0 2px 0 #fff;
  }
  .prog i { width: 24px; height: 24px; border-radius: 50%; display: block; transition: transform .2s; background: radial-gradient(circle at 40% 35%, #dfe7f3, #b3c0d6); box-shadow: inset 0 2px 4px rgba(0,0,0,.2); }
  .prog i.on { background: radial-gradient(circle at 35% 30%, #fff5b8 0%, #ffd23c 40%, #ff9a00 100%); box-shadow: 0 0 0 3px #fff, 0 3px 4px rgba(0,0,0,.3), 0 0 10px rgba(255,200,40,.9); transform: scale(1.15); }
  .board { position: relative; z-index: 1; flex: 0 0 auto; display: grid; gap: var(--gap); width: var(--bw); height: var(--bh); }
  .hole { position: relative; overflow: hidden; min-width: 64px; min-height: 64px; cursor: pointer; }
  /* Montículo de tierra con volumen */
  .hole .mound {
    position: absolute; left: 2%; right: 2%; bottom: 0; height: 50%; border-radius: 50%; z-index: 0;
    background:
      radial-gradient(ellipse 60% 50% at 40% 20%, rgba(255,230,190,.35), rgba(255,255,255,0) 70%),
      radial-gradient(ellipse at 50% 30%, #b5824c 0%, #8a5b30 60%, #6a4322 100%);
    box-shadow: 0 5px 0 #4a2d14, 0 10px 14px rgba(0,40,0,.35), inset 0 -8px 12px rgba(0,0,0,.25), inset 0 3px 0 rgba(255,220,170,.35);
  }
  .hole .pit {
    position: absolute; left: 12%; right: 12%; bottom: 10%; height: 32%; border-radius: 50%; z-index: 1;
    background: radial-gradient(ellipse at 50% 60%, #120a04 0%, #2c1a0c 50%, #4a2f16 100%);
    box-shadow: inset 0 8px 12px rgba(0,0,0,.8), inset 0 -2px 0 rgba(255,200,140,.15);
  }
  .hole .rim {
    position: absolute; left: 12%; right: 12%; bottom: 10%; height: 32%; border-radius: 50%; z-index: 3;
    background: linear-gradient(180deg, #c99a63 50%, #a5733f 62%, #7a5533 82%, #5a3a1e 100%);
    clip-path: inset(50% 0 0 0);
    box-shadow: inset 0 -4px 0 rgba(0,0,0,.25), inset 0 4px 0 rgba(255,235,200,.35);
    pointer-events: none;
  }
  .hole .tuft {
    position: absolute; bottom: 30%; width: 22%; height: 20%; z-index: 4; pointer-events: none;
    background: linear-gradient(180deg, #b9f07a, #5cb244);
    clip-path: polygon(0 100%, 12% 35%, 25% 80%, 40% 10%, 52% 70%, 66% 0, 76% 75%, 90% 30%, 100% 100%);
    filter: drop-shadow(0 2px 1px rgba(0,60,0,.3));
  }
  .hole .tuft.l { left: 4%; transform: rotate(-10deg); }
  .hole .tuft.r { right: 4%; transform: rotate(10deg) scaleX(-1); }
  .hole .critter {
    position: absolute; left: 0; right: 0; bottom: 20%; z-index: 2; text-align: center;
    font-size: var(--fs); transform: translateY(130%); transition: transform .18s ease-out;
    pointer-events: none;
  }
  .hole .critter .emoji { display: inline-block; filter: brightness(.45) drop-shadow(0 4px 4px rgba(0,0,0,.35)); transition: filter .2s; }
  .hole.up .critter { transform: translateY(0); }
  .hole.up .critter .emoji { filter: brightness(1) drop-shadow(0 6px 5px rgba(0,0,0,.35)); animation: popup .28s ease-out, wiggle .5s .28s infinite; }
  @keyframes popup { 0%{transform:scale(.7,1.25)} 55%{transform:scale(1.15,.88)} 100%{transform:scale(1,1)} }
  @keyframes wiggle { 0%,100%{transform:rotate(-6deg)} 50%{transform:rotate(6deg)} }
  .hole.caught .critter { transition: transform .25s, opacity .25s; transform: translateY(-40%) scale(1.3); opacity: 0; }
  .hole.caught .critter .emoji { animation: none; }
  .hole.caught .rim { animation: rimPuff .3s ease-out; }
  @keyframes rimPuff { 0%{transform:scale(1)} 40%{transform:scale(1.08,1.15)} 100%{transform:scale(1)} }
  .plus {
    position: absolute; left: 50%; top: 30%; transform: translateX(-50%); z-index: 6; pointer-events: none;
    font-size: 36px; font-weight: 900; color: #fff; letter-spacing: 1px;
    text-shadow: 0 3px 0 #e0257a, -2px -2px 0 #e0257a, 2px -2px 0 #e0257a, -2px 2px 0 #e0257a, 2px 2px 0 #e0257a, 0 6px 10px rgba(0,0,0,.35);
    animation: floatup .85s ease-out forwards;
  }
  @keyframes floatup { 0%{opacity:0;transform:translate(-50%,10px) scale(.6)} 30%{opacity:1;transform:translate(-50%,-10px) scale(1.25)} 100%{opacity:0;transform:translate(-50%,-70px) scale(1)} }
  .spark {
    position: absolute; width: 22px; height: 22px; z-index: 7; pointer-events: none; margin: -11px 0 0 -11px;
    clip-path: polygon(50% 0, 62% 38%, 100% 50%, 62% 62%, 50% 100%, 38% 62%, 0 50%, 38% 38%);
    background: radial-gradient(circle at 50% 50%, #fff 0, #ffe27a 40%, #ffb703 100%);
    animation: spark .7s ease-out forwards;
  }
  @keyframes spark { 0%{transform:translate(0,0) scale(.3) rotate(0);opacity:1} 60%{opacity:1} 100%{transform:translate(var(--dx),var(--dy)) scale(1.2) rotate(180deg);opacity:0} }
</style>
</head>
<body>
<script src="../common.js"></script>
<script>
var game = KidsGame.init({ title: 'Atrapa al topo' });
(function () {
  var ANIMALS = ['🐹','🐭','🐰','🐿️','🦔','🐸','🐥','🐻','🦊','🐱'];
  // Dificultad: tiempo que el animal asoma (up), pausa entre apariciones (gap) y cantidad de hoyos
  var DIFF = {
    1: [{ cols: 3, rows: 3, up: 1400, gap: 1100 }, { cols: 3, rows: 3, up: 1300, gap: 950 }],
    2: [{ cols: 3, rows: 3, up: 1000, gap: 800 }, { cols: 4, rows: 3, up: 900, gap: 700 }],
    3: [{ cols: 4, rows: 3, up: 600, gap: 500 }, { cols: 4, rows: 4, up: 550, gap: 420 }]
  };
  var nivel = 1, LEVELS = DIFF[1];
  var level = 0, cfg, holes = [], caught = 0, running = false, timer = null;
  game.innerHTML =
    '<span class="deco sway" style="left:2%;bottom:4%;font-size:48px">🌷</span>' +
    '<span class="deco sway" style="left:9%;bottom:2%;font-size:40px;animation-delay:-1s">🌼</span>' +
    '<span class="deco sway" style="right:3%;bottom:3%;font-size:50px;animation-delay:-2s">🌻</span>' +
    '<span class="deco sway" style="right:11%;bottom:1%;font-size:38px;animation-delay:-.6s">🌱</span>' +
    '<span class="deco" style="left:3%;top:22%;font-size:46px">🌳</span>' +
    '<span class="deco" style="right:4%;top:24%;font-size:42px">🌳</span>' +
    '<span class="deco fly" style="left:10%;top:16%;font-size:30px">🦋</span>';
  var hud = document.createElement('div'); hud.className = 'hud';
  var lvlEl = document.createElement('div'); lvlEl.className = 'lvl';
  var prog = document.createElement('div'); prog.className = 'prog';
  var board = document.createElement('div'); board.className = 'board';
  game.appendChild(hud); game.appendChild(lvlEl); game.appendChild(prog); game.appendChild(board);

  function layout() {
    var cols = cfg.cols, rows = cfg.rows;
    var W = game.clientWidth - 16, H = game.clientHeight - prog.offsetHeight - 26;
    if (W < H && cols > rows) { var t = cols; cols = rows; rows = t; }
    var gap = 8;
    var size = Math.floor(Math.min((W - (cols - 1) * gap) / cols, (H - (rows - 1) * gap) / rows));
    size = Math.max(64, Math.min(size, 220));
    board.style.setProperty('--gap', gap + 'px');
    board.style.setProperty('--bw', (cols * size + (cols - 1) * gap) + 'px');
    board.style.setProperty('--bh', (rows * size + (rows - 1) * gap) + 'px');
    board.style.setProperty('--fs', Math.round(size * 0.55) + 'px');
    board.style.gridTemplateColumns = 'repeat(' + cols + ', 1fr)';
    board.style.gridTemplateRows = 'repeat(' + rows + ', 1fr)';
  }

  function renderProg() {
    prog.innerHTML = '';
    for (var i = 0; i < 10; i++) { var d = document.createElement('i'); if (i < caught) d.className = 'on'; prog.appendChild(d); }
  }

  function pickLevel() {
    running = false; clearTimeout(timer);
    holes.forEach(function (h) { clearTimeout(h.t); });
    board.innerHTML = ''; prog.innerHTML = ''; hud.innerHTML = ''; lvlEl.textContent = '';
    prog.style.visibility = 'hidden';
    KidsGame.levelPicker({ onPick: function (n) { nivel = n; LEVELS = DIFF[n]; level = 0; prog.style.visibility = ''; start(); } });
  }
  function buildHud() {
    hud.innerHTML = '';
    hud.appendChild(KidsGame.levelBadge(nivel));
    var b = document.createElement('button'); b.className = 'btn round purple lvbtn'; b.textContent = '🎚️'; b.setAttribute('aria-label', 'Cambiar nivel');
    b.addEventListener('pointerdown', function (ev) { ev.preventDefault(); ev.stopPropagation(); KidsGame.sound.tap(); pickLevel(); });
    hud.appendChild(b);
  }

  function sparkle(el) {
    var r = el.getBoundingClientRect(), g = game.getBoundingClientRect();
    var cx = r.left - g.left + r.width / 2, cy = r.top - g.top + r.height * .45;
    for (var i = 0; i < 10; i++) {
      var s = document.createElement('div'); s.className = 'spark';
      var a = (i / 10) * Math.PI * 2 + Math.random() * .5, d = r.width * .3 + Math.random() * r.width * .3;
      s.style.left = cx + 'px'; s.style.top = cy + 'px';
      s.style.setProperty('--dx', Math.cos(a) * d + 'px'); s.style.setProperty('--dy', (Math.sin(a) * d - 20) + 'px');
      game.appendChild(s);
      (function (e) { setTimeout(function () { e.remove(); }, 800); })(s);
    }
  }

  function start() {
    cfg = LEVELS[Math.min(level, LEVELS.length - 1)];
    caught = 0; holes = []; running = true;
    lvlEl.textContent = 'Ronda ' + (level + 1);
    buildHud();
    board.innerHTML = '';
    for (var i = 0; i < cfg.cols * cfg.rows; i++) {
      var h = document.createElement('div');
      h.className = 'hole';
      h.innerHTML = '<div class="mound"></div><div class="pit"></div><div class="critter"><span class="emoji"></span></div><div class="rim"></div><i class="tuft l"></i><i class="tuft r"></i>';
      var obj = { el: h, em: h.querySelector('.emoji'), busy: false, value: 0, t: null };
      (function (o) { o.el.addEventListener('pointerdown', function (ev) { ev.preventDefault(); tap(o); }); })(obj);
      board.appendChild(h); holes.push(obj);
    }
    renderProg(); layout();
    KidsGame.say('¡Atrapa a los animalitos!');
    clearTimeout(timer);
    timer = setTimeout(popOne, 600);
  }

  function popOne() {
    if (!running) return;
    var free = holes.filter(function (h) { return !h.busy; });
    if (free.length) {
      var h = KidsGame.pick(free);
      var flower = Math.random() < 0.2;
      h.busy = true; h.value = flower ? 2 : 1;
      h.em.textContent = flower ? '🌼' : KidsGame.pick(ANIMALS);
      h.el.classList.remove('caught'); h.el.classList.add('up');
      h.t = setTimeout(function () { hide(h); }, cfg.up);
    }
    timer = setTimeout(popOne, cfg.gap * (0.7 + Math.random() * 0.6));
  }
  function hide(h) {
    clearTimeout(h.t); h.t = null;
    h.el.classList.remove('up');
    setTimeout(function () { if (!h.el.classList.contains('up')) { h.el.classList.remove('caught'); h.busy = false; } }, 260);
  }

  function tap(h) {
    if (!running || !h.busy || !h.el.classList.contains('up') || h.el.classList.contains('caught')) return;
    clearTimeout(h.t);
    h.el.classList.add('caught');
    KidsGame.sound.pop(); KidsGame.vibrate(20);
    KidsGame.addStar(h.value);
    var p = document.createElement('div'); p.className = 'plus';
    p.textContent = '¡+' + h.value + '!';
    h.el.appendChild(p); setTimeout(function () { p.remove(); }, 850);
    sparkle(h.el);
    setTimeout(function () { h.el.classList.remove('up', 'caught'); h.busy = false; }, 300);
    caught = Math.min(caught + 1, 10); renderProg();
    if (caught >= 10) { running = false; clearTimeout(timer); setTimeout(finish, 500); }
  }

  function finish() {
    holes.forEach(function (h) { clearTimeout(h.t); h.el.classList.remove('up'); h.busy = false; });
    KidsGame.celebrate({
      sub: 'Ronda ' + (level + 1),
      onNext: function () { level = Math.min(level + 1, LEVELS.length - 1); start(); },
      onAgain: function () { start(); }
    });
  }

  window.addEventListener('resize', function () { if (cfg && running) layout(); });
  pickLevel();
})();
</script>
</body>
</html>
