  .lampbox.shake { animation: kgshk .45s; }

  .hud { position: absolute; top: 8px; left: 8px; z-index: 3; display: flex; align-items: center; gap: 8px; }
  .hud .btn { font-size: 28px; }
  .tools { position: absolute; top: 8px; right: 8px; z-index: 3; display: flex; gap: 8px; }
  .tools .btn { font-size: 30px; }
  .tools .btn .n { position: absolute; top: -6px; right: -6px; min-width: 26px; height: 26px; border-radius: 13px; font-size: 16px; display: flex; align-items: center; justify-content: center; color: #fff; background: linear-gradient(180deg, #ff9c93, #ff6f61); box-shadow: 0 2px 0 #b8413a, 0 3px 6px rgba(0,0,0,.3); }
  .tools .btn.off { opacity: .45; filter: saturate(.3); }
  .prog { position: absolute; top: 80px; right: 12px; z-index: 3; display: flex; gap: 5px; flex-direction: column; align-items: flex-end; }
  .dots { display: flex; gap: 5px; }

  .dot.on { background: radial-gradient(circle at 35% 30%, #fff, #ffd166 40%, #f5a623); box-shadow: 0 2px 0 #c97d0b, 0 0 8px rgba(255,200,80,.8); }
  .count { font-size: 18px; font-weight: 900; color: #7a4b00; background: linear-gradient(180deg, #fff7d6, #ffe08a); padding: 3px 12px; border-radius: 20px; box-shadow: 0 3px 0 #d9a520, inset 0 1px 0 #fff; }
  @media (max-width: 820px) { .prog { top: 8px; right: 50%; transform: translateX(50%); flex-direction: column-reverse; } }

  .riddle { position: relative; display: flex; align-items: center; gap: min(2.4vw, 20px); width: min(96vw, 900px); padding: 14px 20px 14px 14px; border-radius: 30px; cursor: pointer; flex: 0 0 auto; margin-top: min(9vh, 74px);

  .jk-banner { position: fixed; left: 50%; top: 70px; z-index: 44; transform: translate(-50%,0) scale(.6); opacity: 0; pointer-events: none;

  .jk-banner.in { animation: jkb 1.4s ease-in-out forwards; }
  @keyframes jkb { 0% { transform: translate(-50%,0) scale(.6); opacity: 0 } 14% { transform: translate(-50%,0) scale(1.08); opacity: 1 } 24% { transform: translate(-50%,0) scale(1) } 78% { transform: translate(-50%,0) scale(1); opacity: 1 } 100% { transform: translate(-50%,-30px) scale(.9); opacity: 0 } }
  .jk-streak { position: fixed; top: 78px; right: 240px; z-index: 40; padding: 5px 14px; border-radius: 30px; pointer-events: none;
    background: linear-gradient(180deg,#fff7d6,#ffd166); box-shadow: 0 4px 0 #d9a520, 0 8px 14px rgba(0,0,0,.2), inset 0 1px 0 #fff; font-size: 20px; font-weight: 900; color: #7a4b00;
    opacity: 0; transition: opacity .3s; }
  .jk-streak.on { opacity: 1; }
  .jk-streak.hot { animation: jkhot .45s ease-out; }
  @keyframes jkhot { 0% { transform: scale(1) } 40% { transform: scale(1.3) rotate(-4deg) } 100% { transform: scale(1) } }
  @media (max-width: 820px) { .jk-banner { top: 120px; } .jk-streak { top: 148px; left: 8px; right: auto; } }
  .jk-in { animation: jkin .42s cubic-bezier(.2,.9,.3,1.15) both; }
  .jk-out { animation: jkout .24s ease-in forwards; pointer-events: none; }
  @keyframes jkin { from { transform: translateX(70px) scale(.92); opacity: 0 } to { transform: none; opacity: 1 } }
  @keyframes jkout { to { transform: translateX(-70px) scale(.92); opacity: 0 } }
  .jk-press { animation: jkpress .28s ease-out; }
  @keyframes jkpress { 0% { transform: scale(1) } 35% { transform: scale(.9,1.1) } 70% { transform: scale(1.1,.92) } 100% { transform: scale(1) } }

  }

  /* ---------- Estado y pantalla ---------- */
  var level = 1, round = 0, lock = false, timers = [], plan = [], cur = null, hintsLeft = 0;
  var body = null, dotsEl = null, countEl = null, hintBtn = null, hintN = null, medal = null;
  function later(fn, ms) { timers.push(setTimeout(fn, ms)); }
  function clearTimers() { timers.forEach(clearTimeout); timers = []; }
  function pickLevel() {
    clearTimers(); lock = true; game.innerHTML = '';
    JK.reset();
    KidsGame.levelPicker({ labels: { 1: 'Descríbeme', 2: 'Con rima', 3: 'Dos pistas y ¿qué sobra?', 4: 'Lógica de 3 pasos' }, howto: HOWTO, art: lampSVG(LAMPS[lampIdx], 'lpp', 76), music: 'calma', onPick: function (n) { startLevel(n); } });
  }
  function startLevel(n) {
    level = n; round = 0; usedBank = [];
    plan = KidsGame.shuffle(['order', 'day', 'math', 'pos', 'neg', 'order', 'math', 'neg']);
    buildScreen(); nextRound();
  }
  function hud() {
    var h = el('div', 'hud');
    var b = el('button', 'btn round yellow', '🎚️'); b.setAttribute('aria-label', 'Nivel');
    onTap(b, function () { KidsGame.sound.tap(); pickLevel(); });
    h.appendChild(b); h.appendChild(KidsGame.levelBadge(level));
    return h;
  }
  function buildScreen() {
    clearTimers(); game.innerHTML = '';
    var s = el('div', 'screen');
    s.appendChild(hud());
    var tools = el('div', 'tools');
    var sayB = el('button', 'btn round blue', '🔊'); sayB.setAttribute('aria-label', 'Repetir');
    onTap(sayB, function () { KidsGame.sound.tap(); if (cur) { KidsGame.say(cur.say || cur.q); puffSmoke(3); } });
    hintBtn = el('button', 'btn round purple', '💡'); hintBtn.setAttribute('aria-label', 'Pista');
    hintN = el('span', 'n', '0'); hintBtn.appendChild(hintN);
    onTap(hintBtn, giveHint);
    tools.appendChild(sayB); tools.appendChild(hintBtn); s.appendChild(tools);
    var prog = el('div', 'prog'); countEl = el('div', 'count'); dotsEl = el('div', 'dots');
    for (var i = 0; i < ROUNDS; i++) dotsEl.appendChild(el('div', 'dot'));
    prog.appendChild(countEl); prog.appendChild(dotsEl); s.appendChild(prog);
    body = el('div', 'screen'); body.style.position = 'relative'; body.style.flex = '1 1 auto'; body.style.width = '100%'; body.style.padding = '0';
    s.appendChild(body); game.appendChild(s);
  }
  function updateProgress() {
    countEl.textContent = round + ' / ' + ROUNDS;
    Array.prototype.forEach.call(dotsEl.children, function (d, i) { d.classList.toggle('on', i < round); });
    hintN.textContent = hintsLeft; hintBtn.classList.toggle('off', hintsLeft <= 0);
  }

  var textEl = null, hintBox = null, optsEl = null;
  function nextRound() {
    clearTimers(); lock = false;
    if (round > 0 && body.children.length) JK.swap(body, nextRoundNow); else nextRoundNow();
  }
  function nextRoundNow() {
    body.innerHTML = ''; hintsLeft = HINTS[level];
    cur = buildChallenge(); cur.usedHints = 0; updateProgress(); JK.banner('Adivinanza ' + (round + 1) + ' de ' + ROUNDS);
    var card = el('div', 'riddle');
    lampBox = el('div', 'lampbox think'); renderLamp(); medal = lampBox;
    var txt = el('div', 'text'); textEl = el('div', null, cur.q.replace(/\bNO\b|\bno\b/g, '<b>$&</b>').replace('¿Cuál sobra?', '<b>¿Cuál sobra?</b>')); txt.appendChild(textEl);
    hintBox = el('div'); txt.appendChild(hintBox);
    card.appendChild(lampBox); card.appendChild(txt);
    onTap(card, function () { KidsGame.sound.tap(); KidsGame.say(cur.say || cur.q); puffSmoke(3); });
    onTap(lampBox, cycleLamp);
    body.appendChild(card); later(function () { puffSmoke(4); }, 300);
    optsEl = el('div', 'opts n' + cur.opts.length);
    cur.opts.forEach(function (o, i) {
      var c = el('div', 'card opt'); c.dataset.k = o.k; c.style.animationDelay = (i * 70) + 'ms';
      c.innerHTML = (o.big ? '<span class="big">' + o.big + '</span><span class="emoji" style="font-size:28px">' + o.e + '</span>' : '<span class="emoji">' + o.e + '</span>') + (o.t ? '<span class="lbl">' + o.t + '</span>' : '');
      if (o.t) { var m = el('div', 'mini', '🔊'); c.appendChild(m); onTap(m, function () { KidsGame.sound.tap(); KidsGame.say(o.t); }); }
      onTap(c, function () { answer(c, o); });
      optsEl.appendChild(c);
    });
    body.appendChild(optsEl);
    KidsGame.say(cur.say || cur.q);
    if (level === 1 && round === 0 && !JK.store('kg-adiv-hand', 0)) { var ok = optsEl.querySelector('.opt[data-k="' + cur.a + '"]'); if (ok) later(function () { KidsGame.hand({ el: ok, timeout: 12000 }); }, 1500); }
  }
  function answer(c, o) {
    if (lock) return;
    if (o.k === cur.a) {
      lock = true; c.classList.add('ok'); sparks(c, '#7dffb0'); JK.hit(c); JK.put('kg-adiv-hand', 1);
      lampBox.classList.remove('think'); puffSmoke(5); genieEl.querySelector('.emoji').textContent = o.e; later(function () { genieEl.classList.add('show'); KidsGame.fx.burstAt(genieEl, { n: 14, chars: ['✨', '⭐'] }); }, 350);
      KidsGame.sound.ok(); KidsGame.addStar(); KidsGame.vibrate(30); round++; updateProgress();
      KidsGame.say('¡Sí! ' + (o.t || '') + ' ¡Muy bien!');
      later(function () {
        if (round >= ROUNDS) {
          KidsGame.levelDone(level); unlockLamp();
          KidsGame.celebrate({ sub: '¡' + ROUNDS + ' adivinanzas!', onNext: function () { if (level < 4) startLevel(level + 1); else pickLevel(); }, onAgain: function () { startLevel(level); } });
        } else nextRound();
      }, 1900);
    } else {
      KidsGame.sound.wrong(); replay(c, 'bad'); replay(lampBox, 'shake'); JK.miss(c);
      KidsGame.say(KidsGame.pick(['Mmm, no. Escucha otra vez.', 'Esa no es. Piensa bien.', 'Casi. Inténtalo otra vez.']));
    }
  }
  // 💡: una pista de texto; si ya no hay, atenúa dos opciones equivocadas
  function giveHint() {
    if (lock || hintsLeft <= 0) { KidsGame.sound.wrong(); return; }
    hintsLeft--; updateProgress(); KidsGame.sound.pop();
    var t = cur.h && cur.h[cur.usedHints];
    if (t) {
      cur.usedHints++;
      var hb = el('div', 'hintbox', '💡 ' + t); hintBox.appendChild(hb); KidsGame.say(t);
      if (cur.dim) { Array.prototype.forEach.call(optsEl.children, function (c) { if (cur.dim.indexOf(c.dataset.k) >= 0) c.classList.add('dim'); }); }
    } else {
      var wrong = Array.prototype.filter.call(optsEl.children, function (c) { return c.dataset.k !== cur.a && !c.classList.contains('dim'); });
      KidsGame.shuffle(wrong).slice(0, 2).forEach(function (c) { c.classList.add('dim'); });
      KidsGame.say('Quito dos que no son');
    }
  }

  // Ganchos para pruebas
  window.__adiv = { get level() { return level; }, get round() { return round; }, get cur() { return cur; }, get hintsLeft() { return hintsLeft; },
    bank: { l1: L1.length, l2: L2.length, l3: L3.length, l4: L4.length }, start: startLevel, hint: giveHint, gen: { order: genOrder, day: genDay, math: genMath, pos: genPosition }, get streak() { return JK.streak; }, lamps: lampsUnlocked,
    check: function () { var bad = []; [L1, L2].forEach(function (B) { B.forEach(function (r) { if (r.length !== 3 || r[2].length !== 3) bad.push(r[0]); }); }); [L3, L4].forEach(function (B) { B.forEach(function (r) { if (r.length !== 4 || r[2].length !== 5 || r[2].indexOf(r[1]) >= 0) bad.push(r[0]); }); }); return bad; } };
  pickLevel();
})();
</script>
