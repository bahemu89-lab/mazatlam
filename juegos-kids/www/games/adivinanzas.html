<title>Adivinanzas</title>
<style>
  /* Escena: biblioteca con estantes de libros de colores y luz cálida */

  .hud { position: absolute; top: 8px; left: 8px; z-index: 3; display: flex; align-items: center; gap: 8px; }
  .hud .btn { font-size: 28px; }
  .tools { position: absolute; top: 8px; right: 8px; z-index: 3; display: flex; gap: 8px; }
  .tools .btn { font-size: 30px; }
  .tools .btn .n { position: absolute; top: -6px; right: -6px; min-width: 26px; height: 26px; border-radius: 13px; font-size: 16px; display: flex; align-items: center; justify-content: center; color: #fff; background: linear-gradient(180deg, #ff9c93, #ff6f61); box-shadow: 0 2px 0 #b8413a, 0 3px 6px rgba(0,0,0,.3); }

  .medal { position: relative; flex: 0 0 auto; width: min(14vh, 20vw, 110px); height: min(14vh, 20vw, 110px); border-radius: 50%; display: flex; align-items: center; justify-content: center;

  .text { flex: 1 1 auto; font-size: min(4.4vh, 4.1vw, 31px); font-weight: 900; color: #3b2a1a; line-height: 1.25; text-shadow: 0 1px 0 #fff; position: relative; z-index: 1; }
  .text b { color: #b8306f; }
  .hintbox { font-size: min(3.4vh, 3.4vw, 23px); font-weight: 900; color: #6b3f00; margin-top: 6px; padding: 6px 14px; border-radius: 16px; background: linear-gradient(180deg, #fff7d6, #ffe08a); box-shadow: 0 3px 0 #d9a520, inset 0 1px 0 #fff; display: inline-block; animation: pop .3s; }

  var ANIM = [['el gato','🐱'],['el perro','🐶'],['el pato','🦆'],['el oso','🐻'],['el conejo','🐰'],['la vaca','🐮'],['el cerdo','🐷'],['el león','🦁'],['el mono','🐒']];
  var COLORS = ['#f582ae', '#3da9fc', '#2cb67d', '#ffb703', '#7f5af0', '#ff8906'];
  var ROUNDS = 8, HINTS = { 1: 3, 2: 3, 3: 2, 4: 1 };

  function el(tag, cls, html) { var e = document.createElement(tag); if (cls) e.className = cls; if (html != null) e.innerHTML = html; return e; }
  function onTap(e, fn) { e.addEventListener('pointerdown', function (ev) { ev.preventDefault(); ev.stopPropagation(); fn(ev); }); }
  function replay(node, cls) { node.classList.remove(cls); void node.offsetWidth; node.classList.add(cls); }
  function cap(s) { return s.charAt(0).toUpperCase() + s.slice(1); }
  function sparks(node, color) {
    var r = node.getBoundingClientRect(), cx = r.left + r.width / 2, cy = r.top + r.height / 2;
    for (var i = 0; i < 14; i++) {
      var d = document.createElement('div'); d.className = 'spark';
      var ang = (i / 14) * Math.PI * 2, dist = 60 + Math.random() * 70;
      d.style.left = (cx - 7) + 'px'; d.style.top = (cy - 7) + 'px';
      d.style.setProperty('--c', color || COLORS[i % COLORS.length]);
      d.style.setProperty('--dx', Math.cos(ang) * dist + 'px'); d.style.setProperty('--dy', Math.sin(ang) * dist - 30 + 'px');
      d.style.animationDelay = (Math.random() * 90) + 'ms';
      document.body.appendChild(d);
      (function (n) { setTimeout(function () { n.remove(); }, 900); })(d);
    }
  }
  function pickN(arr, n, exclude) { var out = []; KidsGame.shuffle(arr).forEach(function (x) { if (out.length < n && (exclude || []).indexOf(x) < 0 && out.indexOf(x) < 0) out.push(x); }); return out; }

  /* ---------- Construcción de retos ---------- */
  // Un reto: { q: texto, say: texto hablado, a: clave de la respuesta, opts: [{k, e, t, big}], h: [pistas], scene: [emojis] }
  function emojiPool() { var p = []; L1.concat(L2).forEach(function (r) { if (p.indexOf(r[1]) < 0) p.push(r[1]); }); return p; }
  function fromBank(r, n) {
    // Bancos L1/L2: [q, a, pistas] (distractores al azar). Bancos L3/L4: [q, a, otras5, pistas]
    var others = r.length === 4 ? r[2] : pickN(emojiPool(), n - 1, [r[1]]);
    var hints = r.length === 4 ? r[3] : r[2];
    var opts = KidsGame.shuffle([r[1]].concat(others)).map(function (e) { return { k: e, e: e }; });
    return { q: r[0], a: r[1], opts: opts, h: hints.slice() };
  }
  function genOrder() {
    var kids = pickN(KIDS, 6), three = kids.slice(0, 3), cmp = KidsGame.pick(CMP);
    var A = three[0], B = three[1], C = three[2];
    function adj(k, i) { return k[2] === 'f' ? cmp[i * 2 + 1] : cmp[i * 2]; }
    var s1 = A[0] + ' es más ' + adj(A, 0) + ' que ' + B[0] + '.', s2 = B[0] + ' es más ' + adj(B, 0) + ' que ' + C[0] + '.';
    var sentences = Math.random() < 0.5 ? s1 + ' ' + s2 : s2 + ' ' + s1;
    var askTop = Math.random() < 0.5, ans = askTop ? A : C;
    var q = sentences + ' ¿Quién es el más ' + cmp[askTop ? 0 : 2] + ' de todos?';
    var opts = KidsGame.shuffle(kids).map(function (k) { return { k: k[0], e: k[1], t: k[0] }; });
    return { q: q, a: ans[0], opts: opts, h: ['Solo cuentan ' + A[0] + ', ' + B[0] + ' y ' + C[0] + '.'], dim: kids.slice(3).map(function (k) { return k[0]; }) };
  }
  function genDay() {
    var i = KidsGame.rand(7), shifts = [[-1, 'fue ayer'], [1, 'será mañana'], [2, 'será pasado mañana'], [-2, 'fue anteayer']];
    var sh = KidsGame.pick(shifts), ans = DAYS[(i + sh[0] + 14) % 7];
    var q = 'Si hoy es ' + DAYS[i] + ', ¿qué día ' + sh[1] + '?';
    var days = pickN(DAYS, 6, [ans, DAYS[i]]).slice(0, 4).concat([ans, DAYS[i]]);
    var opts = KidsGame.shuffle(days).map(function (d) { return { k: d, e: '📅', t: cap(d) }; });
    return { q: q, a: ans, opts: opts, h: ['La semana: ' + DAYS.join(', ') + '.'] };
  }
  function genMath() {
    var th = KidsGame.pick(THINGS), a = 3 + KidsGame.rand(5), sub = Math.random() < 0.5, b, ans, q;
    if (sub) { b = 1 + KidsGame.rand(a - 1); ans = a - b; q = 'Tengo ' + a + ' ' + th[0] + ' y se me van ' + b + '. ¿Cuántos quedan?'; }
    else { b = 1 + KidsGame.rand(Math.min(5, 10 - a)); ans = a + b; q = 'Tengo ' + a + ' ' + th[0] + ' y me dan ' + b + ' más. ¿Cuántos tengo?'; }
    var nums = [ans]; while (nums.length < 6) { var n = KidsGame.rand(11); if (nums.indexOf(n) < 0) nums.push(n); }
    var opts = KidsGame.shuffle(nums).map(function (n) { return { k: String(n), big: String(n), e: th[1] }; });
    var row = ''; for (var i = 0; i < a; i++) row += th[1];
    return { q: q, a: String(ans), opts: opts, h: [row + (sub ? ' … y se van ' + b : ' … y llegan ' + b)], scene: null };
  }
  function genPosition() {
    var an = pickN(ANIM, 6), A = an[0], B = an[1], C = an[2];
    function de(x) { return x.replace(/^el /, 'del ').replace(/^la /, 'de la '); }
    var q = cap(A[0]) + ' está a la izquierda ' + de(B[0]) + '. ' + cap(C[0]) + ' está a la derecha ' + de(B[0]) + '.';
    var which = KidsGame.rand(3), ans = [A, B, C][which];
    q += ' ¿Quién está ' + ['a la izquierda', 'en medio', 'a la derecha'][which] + '?';
    var opts = KidsGame.shuffle(an).map(function (x) { return { k: x[1], e: x[1], t: cap(x[0].replace(/^(el|la) /, '')) }; });
    return { q: q, a: ans[1], opts: opts, h: ['Solo están ' + A[0] + ', ' + B[0] + ' y ' + C[0] + '.'], dim: an.slice(3).map(function (x) { return x[1]; }) };
  }
  var usedBank = [];
  function fromLevelBank(bank, n) {
    var cands = bank.filter(function (r) { return usedBank.indexOf(r) < 0; }); if (!cands.length) { usedBank = []; cands = bank; }
    var r = KidsGame.pick(cands); usedBank.push(r); return fromBank(r, n);
  }
  function buildChallenge() {
    if (level === 1) return fromLevelBank(L1, 3);
    if (level === 2) return fromLevelBank(L2, 4);
    if (level === 3) return fromLevelBank(L3, 6);
    var kind = plan[round];
    if (kind === 'order') return genOrder();
    if (kind === 'day') return genDay();
    if (kind === 'math') return genMath();
    if (kind === 'pos') return genPosition();
    return fromLevelBank(L4, 6);
  }

  /* ---------- Estado y pantalla ---------- */
  var level = 1, round = 0, lock = false, timers = [], plan = [], cur = null, hintsLeft = 0;
  var body = null, dotsEl = null, countEl = null, hintBtn = null, hintN = null, medal = null;
  function later(fn, ms) { timers.push(setTimeout(fn, ms)); }
  function clearTimers() { timers.forEach(clearTimeout); timers = []; }
  function pickLevel() {
    clearTimers(); lock = true; game.innerHTML = '';
    KidsGame.levelPicker({ labels: { 1: 'Descríbeme', 2: 'Con rima', 3: 'Dos pistas y ¿qué sobra?', 4: 'Lógica de 3 pasos' }, onPick: function (n) { startLevel(n); } });
  }
  function startLevel(n) {
    level = n; round = 0; usedBank = [];
    plan = KidsGame.shuffle(['order', 'day', 'math', 'pos', 'neg', 'order', 'math', 'neg']);
    buildScreen(); nextRound();
  }
  function hud() {
    var h = el('div', 'hud');
    var b = el('button', 'btn round yellow', '🎚️'); b.setAttribute('aria-label', 'Nivel');
    onTap(b, function () { KidsGame.sound.tap(); pickLevel(); });
    h.appendChild(b); h.appendChild(KidsGame.levelBadge(level));
    return h;
  }
  function buildScreen() {
    clearTimers(); game.innerHTML = '';
    var s = el('div', 'screen');
    [16, 44, 72, 96].forEach(function (top, i) {
      var sh = el('div', 'shelf', '<div class="books"></div><div class="board"></div>'); sh.style.top = top + '%';
      sh.querySelector('.books').style.backgroundPositionX = (i * 57) + 'px'; s.appendChild(sh);
    });
    s.appendChild(hud());
    var tools = el('div', 'tools');
    var sayB = el('button', 'btn round blue', '🔊'); sayB.setAttribute('aria-label', 'Repetir');
    onTap(sayB, function () { KidsGame.sound.tap(); if (cur) { KidsGame.say(cur.say || cur.q); replay(medal, 'pop'); } });
    hintBtn = el('button', 'btn round purple', '💡'); hintBtn.setAttribute('aria-label', 'Pista');
    hintN = el('span', 'n', '0'); hintBtn.appendChild(hintN);
    onTap(hintBtn, giveHint);
    tools.appendChild(sayB); tools.appendChild(hintBtn); s.appendChild(tools);
    var prog = el('div', 'prog'); countEl = el('div', 'count'); dotsEl = el('div', 'dots');
    for (var i = 0; i < ROUNDS; i++) dotsEl.appendChild(el('div', 'dot'));
    prog.appendChild(countEl); prog.appendChild(dotsEl); s.appendChild(prog);
    body = el('div', 'screen'); body.style.position = 'relative'; body.style.flex = '1 1 auto'; body.style.width = '100%'; body.style.padding = '0';
    s.appendChild(body); game.appendChild(s);
  }
  function updateProgress() {
    countEl.textContent = round + ' / ' + ROUNDS;
    Array.prototype.forEach.call(dotsEl.children, function (d, i) { d.classList.toggle('on', i < round); });
    hintN.textContent = hintsLeft; hintBtn.classList.toggle('off', hintsLeft <= 0);
  }

  var textEl = null, hintBox = null, optsEl = null;
  function nextRound() {
    clearTimers(); lock = false; body.innerHTML = ''; hintsLeft = HINTS[level];
    cur = buildChallenge(); cur.usedHints = 0; updateProgress();
    var card = el('div', 'riddle');
    medal = el('div', 'medal think', '<span class="emoji">❓</span>');
    var txt = el('div', 'text'); textEl = el('div', null, cur.q.replace(/\bNO\b|\bno\b/g, '<b>$&</b>').replace('¿Cuál sobra?', '<b>¿Cuál sobra?</b>')); txt.appendChild(textEl);
    hintBox = el('div'); txt.appendChild(hintBox);
    card.appendChild(medal); card.appendChild(txt);
    onTap(card, function () { KidsGame.sound.tap(); KidsGame.say(cur.say || cur.q); replay(medal, 'pop'); });
    body.appendChild(card);
    optsEl = el('div', 'opts n' + cur.opts.length);
    cur.opts.forEach(function (o, i) {
      var c = el('div', 'card opt'); c.dataset.k = o.k; c.style.animationDelay = (i * 70) + 'ms';
      c.innerHTML = (o.big ? '<span class="big">' + o.big + '</span><span class="emoji" style="font-size:28px">' + o.e + '</span>' : '<span class="emoji">' + o.e + '</span>') + (o.t ? '<span class="lbl">' + o.t + '</span>' : '');
      if (o.t) { var m = el('div', 'mini', '🔊'); c.appendChild(m); onTap(m, function () { KidsGame.sound.tap(); KidsGame.say(o.t); }); }
      onTap(c, function () { answer(c, o); });
      optsEl.appendChild(c);
    });
    body.appendChild(optsEl);
    KidsGame.say(cur.say || cur.q);
  }
  function answer(c, o) {
    if (lock) return;
    if (o.k === cur.a) {
      lock = true; c.classList.add('ok'); sparks(c, '#7dffb0'); medal.classList.remove('think'); medal.querySelector('.emoji').textContent = o.e;
      KidsGame.sound.ok(); KidsGame.addStar(); KidsGame.vibrate(30); round++; updateProgress();
      KidsGame.say('¡Sí! ' + (o.t || '') + ' ¡Muy bien!');
      later(function () {
        if (round >= ROUNDS) {
          KidsGame.levelDone(level);
          KidsGame.celebrate({ sub: '¡' + ROUNDS + ' adivinanzas!', onNext: function () { if (level < 4) startLevel(level + 1); else pickLevel(); }, onAgain: function () { startLevel(level); } });
        } else nextRound();
      }, 1600);
    } else {
      KidsGame.sound.wrong(); replay(c, 'bad'); replay(medal, 'shake');
      KidsGame.say(KidsGame.pick(['Mmm, no. Escucha otra vez.', 'Esa no es. Piensa bien.', 'Casi. Inténtalo otra vez.']));
    }
  }
  // 💡: una pista de texto; si ya no hay, atenúa dos opciones equivocadas
  function giveHint() {
    if (lock || hintsLeft <= 0) { KidsGame.sound.wrong(); return; }
    hintsLeft--; updateProgress(); KidsGame.sound.pop();
    var t = cur.h && cur.h[cur.usedHints];
    if (t) {
      cur.usedHints++;
      var hb = el('div', 'hintbox', '💡 ' + t); hintBox.appendChild(hb); KidsGame.say(t);
      if (cur.dim) { Array.prototype.forEach.call(optsEl.children, function (c) { if (cur.dim.indexOf(c.dataset.k) >= 0) c.classList.add('dim'); }); }
    } else {
      var wrong = Array.prototype.filter.call(optsEl.children, function (c) { return c.dataset.k !== cur.a && !c.classList.contains('dim'); });
      KidsGame.shuffle(wrong).slice(0, 2).forEach(function (c) { c.classList.add('dim'); });
      KidsGame.say('Quito dos que no son');
    }
  }

  // Ganchos para pruebas
  window.__adiv = { get level() { return level; }, get round() { return round; }, get cur() { return cur; }, get hintsLeft() { return hintsLeft; },
    bank: { l1: L1.length, l2: L2.length, l3: L3.length, l4: L4.length }, start: startLevel, hint: giveHint, gen: { order: genOrder, day: genDay, math: genMath, pos: genPosition },
    check: function () { var bad = []; [L1, L2].forEach(function (B) { B.forEach(function (r) { if (r.length !== 3 || r[2].length !== 3) bad.push(r[0]); }); }); [L3, L4].forEach(function (B) { B.forEach(function (r) { if (r.length !== 4 || r[2].length !== 5 || r[2].indexOf(r[1]) >= 0) bad.push(r[0]); }); }); return bad; } };
  pickLevel();
})();
</script>
