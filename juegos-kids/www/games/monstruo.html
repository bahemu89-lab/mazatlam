<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<link rel="stylesheet" href="../common.css">
<title>Crea tu monstruo</title>
<style>
  /* Mundo: "La fábrica de monstruos" — pared de metal con remaches, tubos, banda transportadora y prensa selladora */
  .game { display: flex; flex-direction: column; padding: 8px; gap: 8px; }
  .stage { position: relative; flex: 1 1 0; min-height: 0; min-width: 0; display: flex; align-items: center; justify-content: center; border-radius: 26px; overflow: hidden;
    background:
      radial-gradient(circle at 10px 10px, #8a97ad 0 3px, rgba(0,0,0,0) 4px) 0 0 / 60px 60px,
      radial-gradient(ellipse 60% 50% at 50% 20%, rgba(255,255,255,.35), rgba(255,255,255,0) 70%),
      linear-gradient(90deg, #5c6b84, #9aa8c0 30%, #5c6b84) 0 0 / 22px 100% no-repeat,
      linear-gradient(90deg, #5c6b84, #9aa8c0 30%, #5c6b84) 100% 0 / 22px 100% no-repeat,
      linear-gradient(180deg, #d6deea 0%, #b9c4d6 60%, #9fadc4 100%);
    box-shadow: inset 0 0 0 4px #7d8ca6, inset 0 0 30px rgba(0,30,90,.25); }
  .stage::before { content: ""; position: absolute; inset: 0; pointer-events: none;
    background: linear-gradient(180deg, rgba(255,255,255,.65), rgba(255,255,255,.2) 60%, rgba(255,255,255,0));
    clip-path: polygon(42% 0, 58% 0, 100% 100%, 0 100%); }
  .conv { position: absolute; left: 4%; right: 4%; bottom: 10px; height: 14%; min-height: 44px; border-radius: 40px; overflow: hidden; z-index: 0;
    background: #2b3445; box-shadow: 0 8px 0 #141a26, 0 16px 22px rgba(0,30,90,.4), inset 0 3px 0 rgba(255,255,255,.2); }
  .conv .band { position: absolute; left: 0; top: 8px; bottom: 8px; width: 200%; animation: band 2.6s linear infinite; animation-play-state: paused;
    background: repeating-linear-gradient(90deg, #3a4557 0 36px, #56637a 36px 44px, #3a4557 44px 48px, #1f2733 48px 56px); }
  @keyframes band { to { transform: translateX(-50%); } }
  .stage.work .conv .band { animation-play-state: running; }
  .conv::before, .conv::after { content: ""; position: absolute; top: 50%; width: 34px; height: 34px; margin-top: -17px; border-radius: 50%; background: radial-gradient(circle at 35% 30%, #c9d2e6, #56637a 55%, #2b3445); box-shadow: inset 0 0 0 4px #141a26, 0 2px 4px rgba(0,0,0,.4); }
  .conv::before { left: 8px; } .conv::after { right: 8px; }
  .stage.work .gear { animation-play-state: running; }
  .gear { position: absolute; z-index: 1; width: 64px; height: 64px; border-radius: 50%; pointer-events: none; animation: spin 4s linear infinite; animation-play-state: paused;
    background: radial-gradient(circle, #c9d2e6 0 18%, #2b3445 19% 26%, #7d8ca6 27% 68%, rgba(0,0,0,0) 69%), repeating-conic-gradient(#7d8ca6 0 22deg, rgba(0,0,0,0) 22deg 45deg); box-shadow: 0 4px 6px rgba(0,0,0,.25); }
  .gear.b { width: 44px; height: 44px; animation-direction: reverse; animation-duration: 3s; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .pipe { position: absolute; z-index: 1; pointer-events: none; height: 22px; border-radius: 11px; background: linear-gradient(180deg, #c9d2e6, #7d8ca6 50%, #56637a); box-shadow: 0 3px 4px rgba(0,0,0,.25); }
  .pipe::before, .pipe::after { content: ""; position: absolute; top: -4px; width: 14px; height: 30px; border-radius: 5px; background: linear-gradient(180deg, #e4ebf7, #7d8ca6); }
  .pipe::before { left: 10%; } .pipe::after { right: 10%; }
  /* Prensa selladora */
  .press { position: absolute; left: 50%; top: 0; width: 120px; margin-left: -60px; z-index: 2; pointer-events: none; transform: translateY(0); transition: transform .32s cubic-bezier(.6,0,.9,.3); }
  .press .arm { width: 30px; height: 30px; margin: 0 auto; background: linear-gradient(90deg, #56637a, #c9d2e6 40%, #56637a); box-shadow: 0 2px 4px rgba(0,0,0,.3); }
  .press .head { height: 46px; border-radius: 12px 12px 22px 22px; background: linear-gradient(180deg, #ffb703, #ff8906); box-shadow: 0 6px 0 #b85a00, 0 10px 16px rgba(0,0,0,.35), inset 0 3px 0 rgba(255,255,255,.5); display: flex; align-items: center; justify-content: center; font-size: 24px; font-weight: 900; color: #fff; text-shadow: 0 2px 0 #b85a00; letter-spacing: 1px; }
  .press .head::after { content: ""; position: absolute; left: 20px; right: 20px; bottom: -10px; height: 14px; border-radius: 0 0 10px 10px; background: linear-gradient(180deg, #7d8ca6, #2b3445); }
  .press.down { transform: translateY(var(--dy, 40vh)); transition: transform .32s cubic-bezier(.6,0,.9,.3); }
  .press.up { transition: transform .9s cubic-bezier(.2,.8,.3,1); }
  .stage .seal { animation: sealpop .5s cubic-bezier(.2,1.4,.4,1) both; transform-box: fill-box; transform-origin: center; }
  @keyframes sealpop { 0% { transform: scale(2.6) rotate(-20deg); opacity: 0; } 60% { transform: scale(.9) rotate(-10deg); opacity: 1; } 100% { transform: scale(1) rotate(-12deg); opacity: 1; } }
  .stage .mon.squash { animation: squash .5s ease-out; }
  @keyframes squash { 0% { transform: scale(1,1); } 30% { transform: scale(1.14,.82); } 60% { transform: scale(.94,1.08); } 100% { transform: scale(1,1); } }
  .stage .mon.ride { animation: ride .9s cubic-bezier(.2,.8,.3,1) both, breathe 2.8s ease-in-out .9s infinite; }
  @keyframes ride { from { transform: translateX(-120%); } to { transform: translateX(0); } }
  .jk-streak { top: 112px; right: auto; left: 30px; }
  @media (max-width: 820px) { .jk-streak { top: 112px; left: 30px; } .jk-banner { top: 120px; } }
  .opt.lock { opacity: .55; }
  .opt.lock::after { content: "🔒"; position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-size: 30px; }
  .opt.lock svg { opacity: .25; }
  .fac { position: absolute; left: 10px; top: 8px; z-index: 3; font-size: 16px; font-weight: 900; color: #fff; padding: 4px 12px; border-radius: 20px; background: linear-gradient(180deg, #56637a, #2b3445); box-shadow: 0 3px 0 #141a26, inset 0 1px 0 rgba(255,255,255,.3); text-shadow: 0 1px 0 #000; pointer-events: none; }
  /* ---- Kit de "juice" (racha, banner de ronda, transiciones) ---- */
  .jk-banner { position: fixed; left: 50%; top: 70px; z-index: 44; transform: translate(-50%,0) scale(.6); opacity: 0; pointer-events: none;
    padding: 8px 28px; border-radius: 40px; font-size: 28px; font-weight: 900; color: #fff; white-space: nowrap; border: 4px solid #fff;
    background: linear-gradient(180deg, #ffb703, #ff8906); box-shadow: 0 7px 0 #b85a00, 0 16px 28px rgba(0,0,0,.3), inset 0 2px 0 rgba(255,255,255,.6);
    text-shadow: 0 3px 0 #b85a00, 0 5px 8px rgba(0,0,0,.3); }
  .jk-banner.in { animation: jkb 1.4s ease-in-out forwards; }
  @keyframes jkb { 0% { transform: translate(-50%,0) scale(.6); opacity: 0 } 14% { transform: translate(-50%,0) scale(1.08); opacity: 1 } 24% { transform: translate(-50%,0) scale(1) } 78% { transform: translate(-50%,0) scale(1); opacity: 1 } 100% { transform: translate(-50%,-30px) scale(.9); opacity: 0 } }
  .jk-streak { position: fixed; top: 78px; right: 240px; z-index: 40; padding: 5px 14px; border-radius: 30px; pointer-events: none;
    background: linear-gradient(180deg,#fff7d6,#ffd166); box-shadow: 0 4px 0 #d9a520, 0 8px 14px rgba(0,0,0,.2), inset 0 1px 0 #fff; font-size: 20px; font-weight: 900; color: #7a4b00;
    opacity: 0; transition: opacity .3s; }
  .jk-streak.on { opacity: 1; }
  .jk-streak.hot { animation: jkhot .45s ease-out; }
  @keyframes jkhot { 0% { transform: scale(1) } 40% { transform: scale(1.3) rotate(-4deg) } 100% { transform: scale(1) } }
  @media (max-width: 820px) { .jk-banner { top: 120px; } .jk-streak { top: 148px; left: 8px; right: auto; } }
  .jk-in { animation: jkin .42s cubic-bezier(.2,.9,.3,1.15) both; }
  .jk-out { animation: jkout .24s ease-in forwards; pointer-events: none; }
  @keyframes jkin { from { transform: translateX(70px) scale(.92); opacity: 0 } to { transform: none; opacity: 1 } }
  @keyframes jkout { to { transform: translateX(-70px) scale(.92); opacity: 0 } }
  .jk-blink { transform-box: fill-box; transform-origin: center; }
  .jk-blink.on { transform: scaleY(.12); }
  .jk-press { animation: jkpress .28s ease-out; }
  @keyframes jkpress { 0% { transform: scale(1) } 35% { transform: scale(.9,1.1) } 70% { transform: scale(1.1,.92) } 100% { transform: scale(1) } }

  .stage .mwrap { position: relative; z-index: 1; width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; }
  .stage svg { height: 100%; width: 100%; max-height: 100%; overflow: visible; }
  .stage .mwrap { padding: 78px 0 7%; }
  .stage .mon { transform-origin: 150px 300px; transform-box: view-box; animation: breathe 2.8s ease-in-out infinite; }
  .stage .mon.dance { animation: dance .6s ease-in-out 4; }
  .stage .mon.popin { animation: monpop .4s ease-out, breathe 2.8s ease-in-out .4s infinite; }
  @keyframes breathe { 0%,100%{transform:scale(1,1)} 50%{transform:scale(1.02,.98)} }
  @keyframes dance { 0%,100%{transform:translateY(0) rotate(0)} 25%{transform:translateY(-30px) rotate(-10deg) scale(1.05,.95)} 50%{transform:translateY(0) rotate(0) scale(.95,1.08)} 75%{transform:translateY(-30px) rotate(10deg) scale(1.05,.95)} }
  @keyframes monpop { 0%{transform:scale(.5);opacity:0} 70%{transform:scale(1.1)} 100%{transform:scale(1);opacity:1} }
  /* HUD del escenario: nivel + botón de niveles */
  .shud { position: absolute; right: 4px; top: 4px; z-index: 3; display: flex; align-items: center; gap: 8px; }
  .shud .lvbtn { width: 56px; height: 56px; min-width: 56px; min-height: 56px; padding: 0; font-size: 26px; border-radius: 50%; }
  /* Tarjeta del monstruo a copiar (niveles 2 y 3) */
  .target { position: absolute; left: 6px; top: 40px; z-index: 3; width: 150px; padding: 6px 6px 4px; border-radius: 22px; text-align: center;
    background: linear-gradient(180deg, #ffffff, #f1f4fb); border: 3px solid #fff; display: none;
    box-shadow: 0 6px 0 #c9d2e6, 0 12px 20px rgba(20,40,90,.25), inset 0 2px 0 #fff; }
  .target.show { display: block; animation: pop .35s ease-out; }
  .target.bad { animation: shake .4s; }
  .target .ttl { font-size: 18px; font-weight: 900; color: #ff6f61; text-shadow: 0 1px 0 #fff; }
  .target .tm { height: 120px; display: flex; align-items: center; justify-content: center; }
  .target .tm svg { height: 100%; width: 100%; overflow: visible; }
  .target .hidden { display: none; font-size: 56px; line-height: 120px; }
  .target.hide .tm { display: none; } .target.hide .hidden { display: block; animation: float 2s ease-in-out infinite; }
  .target .bar { height: 8px; border-radius: 6px; background: #e4e9f5; overflow: hidden; margin: 4px 6px 2px; display: none; box-shadow: inset 0 1px 2px rgba(0,0,0,.15); }
  .target.timed .bar { display: block; }
  .target .bar i { display: block; height: 100%; width: 100%; border-radius: 6px; background: linear-gradient(90deg, #8ef0b0, #24b36c); transform-origin: left; }
  .target.timed:not(.hide) .bar i { animation: drain 5s linear forwards; }
  @keyframes drain { from { transform: scaleX(1); } to { transform: scaleX(0); } }
  /* Panel de cristal (usa .panel de la base) */
  .game > .panel { flex: 0 0 auto; display: flex; flex-direction: column; gap: 10px; padding: 12px 10px; }
  .tabs { display: flex; justify-content: center; gap: 8px; }
  .tabs .btn { --a: #ffffff; --b: #dbe6f6; --d: #9fb1cc; width: 64px; height: 64px; min-width: 64px; padding: 0; font-size: 32px; }
  .tabs .btn.on { --a: #7dd0ff; --b: #2f95e8; --d: #1a63a8; transform: translateY(-3px) scale(1.06); box-shadow: 0 8px 0 var(--d), 0 14px 18px rgba(0,0,0,.25), 0 0 0 4px #bde0ff, inset 0 2px 0 rgba(255,255,255,.6); }
  .tabs .btn.off { display: none; }
  .opts { display: flex; flex-wrap: wrap; justify-content: center; align-items: center; gap: 10px; min-height: 90px; }
  .opts .row { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; width: 100%; }
  /* Fichas de opción: baldosas brillantes con grosor */
  .opt { position: relative; width: 84px; height: 84px; min-width: 84px; min-height: 84px; padding: 5px; border-radius: 20px; border: 3px solid #fff;
    background: linear-gradient(180deg, #fffdf5 0%, #f6ead0 100%); cursor: pointer;
    box-shadow: 0 5px 0 #d6c39a, 0 10px 14px rgba(0,0,0,.2), inset 0 2px 0 #fff, inset 0 -3px 0 rgba(0,0,0,.05);
    transition: transform .1s, box-shadow .1s; }
  .opt::before { content: ""; position: absolute; left: 8%; right: 8%; top: 4%; height: 36%; border-radius: 14px; pointer-events: none;
    background: linear-gradient(180deg, rgba(255,255,255,.8), rgba(255,255,255,0)); }
  .opt:active { transform: translateY(4px) scale(.96); box-shadow: 0 1px 0 #d6c39a, 0 4px 8px rgba(0,0,0,.2), inset 0 2px 0 #fff; }
  .opt svg { width: 100%; height: 100%; overflow: visible; filter: drop-shadow(0 2px 2px rgba(0,0,0,.2)); }
  .opt.on { background: linear-gradient(180deg, #eaffee, #b9f0c4); transform: translateY(-2px);
    box-shadow: 0 6px 0 #3fa864, 0 12px 16px rgba(20,120,60,.28), 0 0 0 4px rgba(111,220,140,.6), inset 0 2px 0 #fff; }
  .opt.sw { width: 64px; height: 64px; min-width: 64px; min-height: 64px; border-radius: 50%; padding: 0; border: 4px solid #fff;
    background: radial-gradient(circle at 35% 30%, rgba(255,255,255,.9) 0, rgba(255,255,255,.35) 22%, rgba(255,255,255,0) 45%), var(--c);
    box-shadow: 0 5px 0 rgba(0,0,0,.3), 0 10px 14px rgba(0,0,0,.25), inset 0 -6px 8px rgba(0,0,0,.2); }
  .opt.sw::before { display: none; }
  .opt.sw.on { transform: translateY(-2px) scale(1.08); box-shadow: 0 5px 0 rgba(0,0,0,.3), 0 10px 14px rgba(0,0,0,.25), inset 0 -6px 8px rgba(0,0,0,.2), 0 0 0 4px #2cb67d; }
  .acts { display: flex; justify-content: center; gap: 10px; flex-wrap: wrap; }
  .acts .btn { font-size: 22px; min-height: 64px; padding: 6px 16px; }
  .acts .btn.off { display: none; }
  /* Nivel Experto: tarjeta de reglas y preguntas con fichas */
  .target.rules { width: 236px; }
  .target.rules .tm { height: auto; display: block; }
  .rl { list-style: none; margin: 4px 0 2px; padding: 0; text-align: left; }
  .rl li { display: flex; align-items: center; gap: 6px; font-size: 17px; line-height: 1.1; padding: 5px 4px; border-bottom: 2px dashed #e4e9f5; color: #1f2f6b; }
  .rl li:last-child { border-bottom: 0; }
  .rl .ic { font-size: 24px; width: 30px; text-align: center; flex: 0 0 auto; }
  .rl .sw { width: 20px; height: 20px; border-radius: 50%; border: 2px solid #fff; box-shadow: 0 1px 2px rgba(0,0,0,.3); flex: 0 0 auto; }
  .rl .tx { flex: 1 1 auto; }
  .rl .tx.neg { color: #c62828; }
  .rl .st { font-size: 22px; width: 26px; text-align: center; flex: 0 0 auto; }
  .tabs.off { display: none; }
  .opts .q { width: 100%; text-align: center; font-size: 24px; font-weight: 900; color: #1f2f6b; }
  .opts .q b { color: #ff3d7f; }
  .opt.qa { flex-direction: column; gap: 2px; font-family: inherit; font-weight: 900; color: #1f2f6b; }
  .opt.qa .big { font-size: 40px; line-height: 1; }
  .opt.qa .emoji { font-size: 34px; line-height: 1; }
  .opt.qa small { font-size: 13px; line-height: 1; }
  .opt.qa.bad { animation: shake .4s; }
  .spark { position: fixed; left: 0; top: 0; z-index: 45; pointer-events: none; font-size: 28px; animation: sparkfly 1s ease-out forwards; }
  @keyframes sparkfly { 0%{transform:translate(-50%,-50%) scale(.4);opacity:1} 100%{transform:translate(calc(-50% + var(--dx)), calc(-50% + var(--dy))) scale(1.4) rotate(200deg);opacity:0} }
  @media (orientation: landscape) {
    .game { flex-direction: row; }
    .game > .panel { width: 390px; justify-content: center; }
  }
</style>

<body>
<script src="../common.js"></script>
<script>
var game = KidsGame.init({ title: 'Crea tu monstruo' });
(function () {
  var COLORS = ['#f582ae', '#3da9fc', '#2cb67d', '#ffb703', '#7f5af0', '#ff8906', '#8bd3dd', '#ef476f'];
  var BODIES = ['round', 'tall', 'square', 'blob', 'star', 'egg', 'heart'];
  var EYES = ['one', 'two', 'three', 'sleepy', 'wide', 'glasses', 'hearts', 'stars'];
  var MOUTHS = ['smile', 'teeth', 'tongue', 'oh', 'mustache', 'fangs', 'smirk'];
  var HATS = ['none', 'party', 'crown', 'cap', 'bow', 'antenna', 'wizard', 'flower', 'halo'];
  var LEGS = ['none', 'stubby', 'long', 'many', 'wheels'];
  // Piezas que se desbloquean al completar niveles (en orden): [clave, nombre de pieza]
  var UNLOCKS = [['hat', 'wizard'], ['eyes', 'stars'], ['hat', 'flower'], ['hat', 'halo']];
  var PARTS = { body: BODIES, eyes: EYES, mouth: MOUTHS, hat: HATS, legs: LEGS };
  var TABS = [ ['color', '🎨'], ['eyes', '👀'], ['mouth', '👄'], ['hat', '🎩'], ['legs', '🦶'] ];
  var TABOF = { color: '🎨', body: '🎨', eyes: '👀', mouth: '👄', hat: '🎩', legs: '🦶' };
  var state = { color: 0, body: 0, eyes: 1, mouth: 0, hat: 0, legs: 1 };
  var tab = 'color', dancing = false;
  // Niveles: 1 = crear libremente, 2 = copiar cuerpo/ojos/boca, 3 = copiar todo con el modelo visible 5 s
  var nivel = 1, target = null, peekTimer = null, uid = 0;

  try { var saved = JSON.parse(localStorage.getItem('kg-monstruo') || 'null'); if (saved && typeof saved.color === 'number') state = saved; } catch (e) {}
  function save() { try { localStorage.setItem('kg-monstruo', JSON.stringify(state)); } catch (e) {} }
  /* ---- Kit de "juice": racha, banner de ronda, transición entre rondas, guardado ---- */
  var JK = (function () {
    var streak = 0, pill = null, bannerEl = null;
    function pillEl() { if (!pill) { pill = document.createElement('div'); pill.className = 'jk-streak'; document.body.appendChild(pill); } return pill; }
    function hit(el, txt) {
      streak++; var p = pillEl();
      if (streak >= 2) { p.textContent = '🔥 Racha ' + streak; p.classList.add('on'); p.classList.remove('hot'); void p.offsetWidth; p.classList.add('hot'); }
      var r = el && el.getBoundingClientRect ? el.getBoundingClientRect() : null;
      var x = r ? r.left + r.width / 2 : window.innerWidth / 2, y = r ? r.top + 8 : window.innerHeight / 2;
      if (el) { try { KidsGame.fx.ring(el); } catch (e) {} }
      if (streak % 5 === 0) { KidsGame.addStar(); KidsGame.fx.floatText(x, y, '¡Racha x' + streak + '! ⭐ extra', 'good'); KidsGame.fx.burst(x, y, { n: 22, r: 110, chars: ['⭐', '✨', '🔥', '💫'] }); }
      else if (streak >= 3) { KidsGame.fx.floatText(x, y, '¡Racha x' + streak + '!', 'good'); KidsGame.fx.burst(x, y, { n: 14, chars: ['✨', '⭐'] }); }
      else { KidsGame.fx.floatText(x, y, txt || '+1', 'good'); KidsGame.fx.burst(x, y, { n: 12 }); }
      return streak;
    }
    function miss(el) { streak = 0; if (pill) pill.classList.remove('on'); if (el) KidsGame.fx.shake(el); }
    function reset() { streak = 0; if (pill) pill.classList.remove('on'); }
    // El banner se crea tras pintar la pantalla (sin reflow síncrono) y se reemplaza el nodo para reiniciar la animación
    var bannerT = null;
    function banner(text) {
      clearTimeout(bannerT);
      bannerT = setTimeout(function () {
        if (bannerEl) bannerEl.remove();
        bannerEl = document.createElement('div'); bannerEl.className = 'jk-banner in'; bannerEl.textContent = text; document.body.appendChild(bannerEl);
      }, 90);
    }
    // Parpadeo de ojos sin animación continua: cada ~4 s se cierran 130 ms (clase .jk-blink)
    setInterval(function () {
      var eyes = document.querySelectorAll('.jk-blink'); if (!eyes.length) return;
      for (var i = 0; i < eyes.length; i++) eyes[i].classList.add('on');
      setTimeout(function () { for (var j = 0; j < eyes.length; j++) eyes[j].classList.remove('on'); }, 130);
    }, 4200);
    function swap(el, fn) {
      if (!el || !el.parentNode) { fn(); return; }
      el.classList.remove('jk-in'); el.classList.add('jk-out');
      setTimeout(function () { el.classList.remove('jk-out'); fn(); el.classList.add('jk-in'); setTimeout(function () { el.classList.remove('jk-in'); }, 480); }, 230);
    }
    function press(el) { if (!el) return; el.classList.remove('jk-press'); void el.offsetWidth; el.classList.add('jk-press'); }
    function store(k, d) { try { var v = JSON.parse(localStorage.getItem(k)); return v == null ? d : v; } catch (e) { return d; } }
    function put(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
    return { hit: hit, miss: miss, reset: reset, banner: banner, swap: swap, press: press, store: store, put: put, get streak() { return streak; } };
  })();

  function unlockedN() { return Math.min(UNLOCKS.length, JK.store('kg-monstruo-unlock', 0) || 0); }
  function unlockPart() { var n = JK.store('kg-monstruo-unlock', 0) || 0; if (n < UNLOCKS.length) { JK.put('kg-monstruo-unlock', n + 1); var u = UNLOCKS[n]; KidsGame.toast('🎁 ¡Pieza nueva: ' + (u[0] === 'hat' ? HAT_T[u[1]][0] : 'ojos de estrella') + '!', 2400); } }

      KidsGame.celebrate({ msg: '¡Qué monstruo!', sub: 'Sellado en la fábrica 🏭', onAgain: function () { randomize(); tab = 'color'; renderTabs(); renderOpts(); } });
    }, 700); });
  }
  acts.querySelectorAll('.btn').forEach(function (b) {
    b.addEventListener('pointerdown', function (ev) {
      ev.preventDefault(); KidsGame.sound.tap();
      var a = b.dataset.a;
      if (a === 'random') randomize(); else if (a === 'dance') dance(); else if (a === 'done') done();
      else if (a === 'check') check(); else if (a === 'peek') peek();
      else if (a === 'say') { if (xmode === 'rules') sayRules(); else if (quiz && quiz.q1) KidsGame.say(quiz.q1); }
    });
  });
  mwrap.addEventListener('pointerdown', function () { dance(); });
  targetEl.addEventListener('pointerdown', function (ev) { ev.preventDefault(); if (nivel === 3) { KidsGame.sound.tap(); peek(); } else if (nivel === 4) { KidsGame.sound.tap(); sayRules(); } });

  function showPicker() {
    clearTimeout(peekTimer);
    JK.reset();
    KidsGame.levelPicker({ key: 'monstruo', labels: { 1: 'Crea libre', 2: 'Copia 3 rasgos', 3: 'Copia 5, modelo oculto 5 s', 4: 'Reglas y describe' }, howto: HOWTO, art: machineSVG(70, 'mcp'), music: 'aventura', onPick: function (n) {
      nivel = n; view = null; xmode = null; rules = null; quiz = null; copyN = 0;
      var nb = KidsGame.levelBadge(nivel); shud.replaceChild(nb, badgeEl); badgeEl = nb;
      if (nivel === 2 && (tab === 'hat' || tab === 'legs')) tab = 'color';
      targetEl.classList.remove('rules');
      renderTabs(); renderOpts(); renderMonster(true); newTarget();
      if (nivel === 1) JK.banner('🏭 La fábrica de monstruos');
      KidsGame.say(nivel === 1 ? 'Crea tu monstruo' : nivel === 2 ? 'Haz un monstruo igual al de la tarjeta' : nivel === 3 ? 'Mira bien el monstruo y hazlo igual' : '');
      if (nivel === 1 && !JK.store('kg-monstruo-hand', 0)) setTimeout(function () { var sw = opts.querySelector('.opt.sw:not(.on)'); if (sw) KidsGame.hand({ el: sw, timeout: 10000 }); }, 1200);
    } });
  }
  lvbtn.addEventListener('pointerdown', function (ev) { ev.preventDefault(); KidsGame.sound.tap(); showPicker(); });

  renderTabs(); renderOpts(); renderMonster(false);
  showPicker();
  // gancho de pruebas automáticas (no afecta al juego)
  window.__kgTest = function () { return { state: state, target: target, rules: rules, fields: fields, randomState: randomState, unlocked: unlockedN(), streak: JK.streak,
    setState: function (st) { state = st; renderMonster(true); renderOpts(); },
    solveRules: function () { if (!rules) return false; for (var t = 0; t < 400; t++) { var st = randomState(); if (rules.every(function (r) { return r.test(st); })) { state = st; save(); renderMonster(false); renderOpts(); return true; } } return false; } }; };
})();
</script>
