<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<link rel="stylesheet" href="../common.css">
<title>Sumas</title>
<style>
  /* ===== La pastelería: pared de rayas rosas, toldo, mostrador de madera y el osito pastelero ===== */
  .game {
    display: flex; flex-direction: column; align-items: center; padding: 8px 12px 10px; gap: 8px;
    background:
      radial-gradient(ellipse 70% 40% at 50% 0%, rgba(255,255,255,.5), rgba(255,255,255,0) 70%),
      repeating-linear-gradient(90deg, rgba(245,130,174,.16) 0 34px, rgba(255,255,255,0) 34px 68px),
      linear-gradient(180deg, #fff0f5 0%, #ffe3ec 68%, #e0a86a 68.5%, #b8773c 72%, #8f5a2a 100%);
  }
  .game::before {
    content: ""; position: absolute; left: 0; right: 0; top: 0; height: 52px; pointer-events: none; z-index: 0;
    background: repeating-linear-gradient(90deg, #ff8fb3 0 56px, #fff 56px 112px);
    border-bottom: 5px solid #e0569a; box-shadow: 0 8px 16px rgba(120,0,60,.2);
    -webkit-mask: radial-gradient(circle at 28px 52px, rgba(0,0,0,0) 26px, #000 27px) repeat-x; -webkit-mask-size: 56px 100%;
    mask: radial-gradient(circle at 28px 52px, rgba(0,0,0,0) 26px, #000 27px) repeat-x; mask-size: 56px 100%;
  }
  .game::after {
    content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 30%; pointer-events: none; z-index: 0;
    background: repeating-linear-gradient(0deg, rgba(0,0,0,0) 0 28px, rgba(90,40,10,.1) 28px 30px), radial-gradient(ellipse 80% 40% at 50% 0%, rgba(255,255,255,.35), rgba(255,255,255,0) 70%);
    box-shadow: inset 0 12px 20px rgba(120,60,10,.25); opacity: .9;
  }
  .hud { position: relative; z-index: 2; flex: 0 0 auto; display: flex; align-items: center; gap: 12px; padding: 6px 10px 6px 14px; border-radius: 40px; margin-top: 30px; }
  .dots { display: flex; gap: 6px; }
  .dots span { width: 16px; height: 16px; border-radius: 50%; background: linear-gradient(180deg, #e8ecf5, #c9d2e6); box-shadow: inset 0 2px 3px rgba(0,0,0,.18); transition: transform .2s, background .2s; }
  .dots span.on { background: radial-gradient(circle at 35% 30%, #fff3a8, #ffb703 70%); box-shadow: 0 2px 0 #c47f00, 0 3px 6px rgba(0,0,0,.25), inset 0 1px 0 #fff; transform: scale(1.15); }
  .hud .btn.round { width: 64px; height: 64px; font-size: 28px; }
  /* Vitrina de la pastelería: una repisa con los pasteles ganados por nivel (desbloqueables) */
  .vit { display: flex; gap: 4px; padding: 4px 8px 6px; border-radius: 14px; background: linear-gradient(180deg, #ffe3ec, #ffc8d9); box-shadow: inset 0 2px 4px rgba(120,0,60,.15), 0 3px 0 #e0a86a; }
  .vit span { width: 34px; height: 34px; display: flex; align-items: center; justify-content: center; font-size: 24px; border-radius: 8px; background: rgba(255,255,255,.7); }
  .vit span.off { opacity: .35; font-size: 16px; }
  .vit span.new { animation: pop .5s ease-out; }
  .instr { position: relative; z-index: 2; flex: 0 0 auto; display: flex; align-items: center; gap: 12px; padding: 4px 10px 4px 10px; border-radius: 40px; }
  .instr .txt { font-size: 28px; font-size: clamp(18px, 3vw, 28px); font-weight: 900; color: #b8306f; text-shadow: 0 2px 0 #fff, 0 3px 6px rgba(0,0,0,.12); white-space: nowrap; }
  .instr .baker { width: 64px; height: 64px; flex: 0 0 auto; filter: drop-shadow(0 4px 4px rgba(0,0,0,.3)); cursor: pointer; }
  .baker .bk-eyes { transform-origin: 60px 54px; animation: bkblink 4.6s infinite; }
  @keyframes bkblink { 0%, 93%, 100% { transform: scaleY(1); } 96% { transform: scaleY(.1); } }
  .baker .bk-head { transform-origin: 60px 80px; animation: bknod 3.4s ease-in-out infinite; }
  @keyframes bknod { 0%, 100% { transform: rotate(-2deg); } 50% { transform: rotate(3deg); } }
  .baker.cheer { animation: bkcheer .5s ease-out; }
  @keyframes bkcheer { 0%, 100% { transform: scale(1); } 40% { transform: scale(1.15, .9); } 70% { transform: scale(.95, 1.08) translateY(-5px); } }

  .stage { position: relative; z-index: 1; flex: 1 1 auto; width: 100%; min-height: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 34px; gap: clamp(14px, 3vh, 34px); }
  .stage { transition: transform .3s cubic-bezier(.3,1.3,.5,1), opacity .28s; }
  .stage.out { transform: translateX(-8%) scale(.94); opacity: 0; }
  .stage.in { transform: translateX(8%) scale(.94); opacity: 0; transition: none; }
  .eq { display: flex; align-items: stretch; justify-content: center; gap: 14px; gap: clamp(6px, 1.2vw, 14px); width: 100%; }
  .eq .op, .eq .res { align-self: center; }
  /* Charolas de pastelería: porcelana blanca con borde rosa y carpetita */
  .tray {
    position: relative; flex: 1 1 0; max-width: 420px; min-height: 150px; padding: 14px 10px 18px; border-radius: 28px;
    display: flex; flex-wrap: wrap; align-items: center; justify-content: center; align-content: center; gap: 4px;
    background:
      radial-gradient(ellipse 80% 40% at 50% 0%, rgba(255,255,255,.95), rgba(255,255,255,0) 70%),
      repeating-radial-gradient(circle at 50% 50%, rgba(245,130,174,.13) 0 5px, rgba(255,255,255,0) 5px 14px),
      linear-gradient(180deg, #ffffff 0%, #fff0f5 60%, #ffd9e6 100%);
    border: 4px solid #f582ae;
    box-shadow: 0 9px 0 #c94b85, 0 18px 26px rgba(120,0,60,.3), inset 0 2px 0 #fff, inset 0 -6px 0 rgba(0,0,0,.05), inset 0 0 0 6px rgba(255,255,255,.6);
    transition: opacity .4s, transform .4s;
  }
  .tray.pop { animation: pop .4s ease-out backwards; }
  .tray.gone { opacity: 0; transform: scale(.85); }
  .tray.win { box-shadow: 0 9px 0 #c94b85, 0 18px 26px rgba(120,0,60,.3), 0 0 0 6px #ffe98a, 0 0 40px 10px rgba(255,233,138,.85), inset 0 2px 0 #fff; }
  .obj {
    position: relative; width: var(--o); height: var(--o); display: flex; align-items: center; justify-content: center; cursor: pointer;
    transition: transform .55s cubic-bezier(.3,1.4,.4,1), opacity .5s; animation: wob 3s ease-in-out infinite;
  }
  @keyframes wob { 0%,100% { transform: translateY(0) rotate(-3deg); } 50% { transform: translateY(-4px) rotate(3deg); } }
  .obj .emoji { font-size: calc(var(--o) * .72); filter: drop-shadow(0 5px 4px rgba(0,0,0,.3)); transition: transform .12s; }
  .obj:active .emoji { transform: scale(1.2); }
  .obj .cnt {
    position: absolute; right: -2px; top: -4px; min-width: 28px; height: 28px; line-height: 28px; padding: 0 6px; border-radius: 14px; text-align: center;
    font-size: 18px; font-weight: 900; color: #fff; text-shadow: 0 1px 0 rgba(0,0,0,.3);
    background: linear-gradient(180deg, #7dd0ff, #2f95e8); box-shadow: 0 2px 0 #1a63a8, 0 3px 6px rgba(0,0,0,.3), inset 0 1px 0 rgba(255,255,255,.6);
    animation: pop .3s ease-out; z-index: 2;
  }
  .obj.ghost { opacity: .45; filter: grayscale(.6); cursor: default; animation: ghost 1.6s ease-in-out infinite; }
  @keyframes ghost { 0%,100% { opacity: .5; transform: translateY(0); } 50% { opacity: .2; transform: translateY(-6px); } }
  .obj.flying { animation: none; z-index: 5; }
  .obj.vanish { animation: none; opacity: 0; transform: scale(.2) translateY(-30px); }
  .op { flex: 0 0 auto; width: 56px; height: 56px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 40px; font-weight: 900; color: #fff;
        text-shadow: 0 2px 0 rgba(0,0,0,.25); background: linear-gradient(180deg, #b39cff, #7f5af0); box-shadow: 0 5px 0 #5232b3, 0 10px 16px rgba(0,0,0,.3), inset 0 2px 0 rgba(255,255,255,.6); }
  .op.eq { background: linear-gradient(180deg, #ff9ccb, #f0569a); box-shadow: 0 5px 0 #b8306f, 0 10px 16px rgba(0,0,0,.3), inset 0 2px 0 rgba(255,255,255,.6); }
  .res {
    flex: 0 0 auto; width: 130px; width: clamp(96px, 12vw, 130px); height: 130px; height: clamp(96px, 12vw, 130px); border-radius: 26px; display: flex; align-items: center; justify-content: center;
    font-size: 76px; font-size: clamp(54px, 7vw, 76px); font-weight: 900; color: #fff; text-shadow: 0 3px 0 #c47f00, 0 6px 10px rgba(0,0,0,.3);
    background: linear-gradient(180deg, #fff6d0, #ffd54a); border: 4px dashed #fff;
    box-shadow: 0 8px 0 #c47f00, 0 16px 24px rgba(120,0,60,.3), 0 0 0 5px rgba(255,255,255,.4), inset 0 2px 0 #fff;
    animation: qpulse 1.3s ease-in-out infinite; position: relative;
  }
  .res::before { content: ""; position: absolute; left: 8%; right: 8%; top: 5%; height: 36%; border-radius: 18px 18px 50% 50%; background: linear-gradient(180deg, rgba(255,255,255,.8), rgba(255,255,255,0)); pointer-events: none; }
  @keyframes qpulse { 0%,100% { transform: scale(1); } 50% { transform: scale(1.06); } }
  .res.done { animation: land .7s cubic-bezier(.3,1.6,.5,1); border-style: solid; background: linear-gradient(180deg, #c2ffd2, #2fc56d); text-shadow: 0 3px 0 #14784a, 0 6px 10px rgba(0,0,0,.3);
              box-shadow: 0 8px 0 #14784a, 0 16px 24px rgba(0,60,40,.35), 0 0 0 6px #ffe98a, 0 0 40px 10px rgba(255,233,138,.9), inset 0 2px 0 #fff; }
  @keyframes land { 0% { transform: scale(1.5); } 40% { transform: scale(.85, 1.15); } 70% { transform: scale(1.1, .92); } 100% { transform: scale(1); } }

  .nums { position: relative; display: flex; gap: 30px; gap: clamp(14px, 3vw, 30px); padding: 14px 22px; border-radius: 34px; }
  .num {
    --a: #7dd0ff; --b: #2f95e8; --d: #1a63a8;
    position: relative; width: var(--n); height: var(--n); border-radius: 26%; display: flex; align-items: center; justify-content: center; cursor: pointer;
    font-size: calc(var(--n) * .58); font-weight: 900; color: #fff; text-shadow: 0 3px 0 var(--d), 0 6px 10px rgba(0,0,0,.3);
    background: radial-gradient(circle at 35% 25%, rgba(255,255,255,.55), rgba(255,255,255,0) 45%), linear-gradient(180deg, var(--a), var(--b));
    border: 3px solid rgba(255,255,255,.85);
    box-shadow: 0 8px 0 var(--d), 0 16px 24px rgba(120,0,60,.3), inset 0 2px 0 rgba(255,255,255,.7), inset 0 -5px 0 rgba(0,0,0,.1);
    transition: transform .12s, box-shadow .12s; animation: pop .4s ease-out backwards;
  }
  .num::before { content: ""; position: absolute; left: 8%; right: 8%; top: 4%; height: 36%; border-radius: 18% 18% 50% 50%; background: linear-gradient(180deg, rgba(255,255,255,.65), rgba(255,255,255,0)); pointer-events: none; }
  .num:active { transform: translateY(6px); box-shadow: 0 2px 0 var(--d), 0 6px 10px rgba(0,0,0,.3), inset 0 2px 0 rgba(255,255,255,.7); }
  .num.c1 { --a: #ff9ccb; --b: #f0569a; --d: #b8306f; }
  .num.c2 { --a: #7dd0ff; --b: #2f95e8; --d: #1a63a8; }
  .num.c3 { --a: #b39cff; --b: #7f5af0; --d: #5232b3; }
  .num.c4 { --a: #ffc077; --b: #ff7a1a; --d: #b8500a; }
  .num.bad { animation: shake .4s; }
  .num.ok { --a: #8ef0b0; --b: #24b36c; --d: #14784a; transform: scale(1.12); box-shadow: 0 8px 0 var(--d), 0 16px 24px rgba(0,60,40,.35), 0 0 0 6px #ffe98a, 0 0 36px 8px rgba(255,233,138,.9), inset 0 2px 0 rgba(255,255,255,.7); animation: none; }
  .num.dim { opacity: .4; transform: scale(.9); animation: none; }

  /* ---- Niveles 3-4: hueco para arrastrar, marco de diez, cuentos de dos pasos ---- */
  .instr.story .txt { white-space: normal; text-align: center; font-size: clamp(16px, 2.4vw, 24px); line-height: 1.15; max-width: 66vw; }
  .tray.hole { border: 4px dashed #fff; background: linear-gradient(180deg, #fff6d0, #ffd54a); box-shadow: 0 9px 0 #c47f00, 0 18px 26px rgba(120,0,60,.3), 0 0 0 5px rgba(255,255,255,.4), inset 0 2px 0 #fff; min-height: 120px; }
  .tray.hole .qm { font-size: clamp(54px, 7vw, 80px); font-weight: 900; color: #fff; text-shadow: 0 3px 0 #c47f00, 0 6px 10px rgba(0,0,0,.3); animation: qpulse 1.3s ease-in-out infinite; }
  .tray.hole.hot { transform: scale(1.06); box-shadow: 0 9px 0 #c47f00, 0 18px 26px rgba(120,0,60,.3), 0 0 0 8px #ffe98a, 0 0 40px 10px rgba(255,233,138,.9), inset 0 2px 0 #fff; }
  .tray.hole .num { animation: land .6s cubic-bezier(.3,1.6,.5,1); }
  .tray .tf { width: min(100%, 300px); filter: drop-shadow(0 6px 5px rgba(60,30,0,.3)); }
  .tray.cnt3 { max-width: 300px; min-height: 120px; }
  .tray.hidden, .op.hidden, .eq .hidden { display: none; }
  .op.txt { font-size: 26px; width: 64px; height: 64px; }
  .num.drag { position: fixed; z-index: 50; pointer-events: none; animation: none; transform: scale(1.1); margin: 0; }
  .num.ghost { opacity: .25; animation: none; }
  .obj.off .emoji { filter: grayscale(1) opacity(.35); }
  .obj.off::after { content: "✖"; position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-size: calc(var(--o) * .6); color: #e53170; text-shadow: 0 2px 0 #fff; }
  .obj.add .emoji { filter: drop-shadow(0 0 8px #ffe066) drop-shadow(0 5px 4px rgba(0,0,0,.3)); }
  /* Banner de ronda */
  .rbanner { position: absolute; left: 50%; top: 42%; z-index: 30; transform: translate(-50%, -50%) scale(.5); opacity: 0; pointer-events: none;
    padding: 10px 36px; border-radius: 40px; font-size: clamp(26px, 4.5vw, 44px); font-weight: 900; color: #fff; white-space: nowrap;
    background: linear-gradient(180deg, #ff9ccb, #f0569a); text-shadow: 0 3px 0 #b8306f, 0 6px 10px rgba(0,0,0,.3);
    box-shadow: 0 8px 0 #b8306f, 0 16px 26px rgba(0,0,0,.35), inset 0 2px 0 rgba(255,255,255,.6);
    transition: transform .35s cubic-bezier(.3,1.5,.5,1), opacity .3s; }
  .rbanner.show { transform: translate(-50%, -50%) scale(1); opacity: 1; }
  @media (max-width: 700px) { .hud { gap: 8px; } .vit span { width: 28px; height: 28px; font-size: 20px; } .instr .baker { width: 56px; height: 56px; } }
</style>
</head>
<body>
<script src="../common.js"></script>
<script>
var game = KidsGame.init({ title: 'Sumas' });
(function () {
  var OBJS = ['🧁', '🍩', '🍪', '🎂', '🍰', '🥐', '🍬', '🍭', '🍫', '🥧', '🍡', '🍦', '🍓', '🍒', '🥨'];
  var ROUNDS = 8;
  var NUMCOLS = ['c1', 'c2', 'c3', 'c4'];
  var NUMS = ['cero', 'uno', 'dos', 'tres', 'cuatro', 'cinco', 'seis', 'siete', 'ocho', 'nueve', 'diez', 'once', 'doce', 'trece', 'catorce', 'quince', 'dieciséis', 'diecisiete', 'dieciocho', 'diecinueve', 'veinte', 'veintiuno', 'veintidós', 'veintitrés', 'veinticuatro'];
  var LABELS = { 1: 'sumas hasta 10', 2: 'hasta 20 · restas', 3: '3 + ? = 8 · arrastra', 4: 'cuentos · doble y mitad' };
  var HOWTO = [{ icon: '🧁', text: 'Cuenta los pastelitos de cada charola' }, { icon: '➕', text: 'Júntalos: ¿cuántos hay en total?' }, { icon: '🔢', text: 'Toca el número correcto' }];
  // Vitrina: un pastel nuevo por nivel completado (cosmético, guardado en localStorage)
  var DECOS = [['pastel', '🎂', 'un pastel'], ['pastelitos', '🧁', 'unos pastelitos'], ['donas', '🍩', 'unas donas'], ['trofeo', '🏆', 'el trofeo de oro']];
  var MODES = {
    1: ['add', 'add', 'add', 'add', 'add', 'add', 'add', 'add'],
    2: ['add', 'add', 'add', 'sub', 'add', 'add', 'sub', 'add'],
    3: ['missing', 'sub', 'missing', 'add', 'missing', 'sub', 'missing', 'add'],
    4: ['story', 'double', 'story', 'half', 'story', 'double', 'story', 'half']
  };
  var STORIES = [
    { who: 'Tenía {a} dulces', s1: ['me comí {b}', 'regalé {b}'], a1: ['me dio {c} mi mamá', 'encontré {c} más'], q: '¿cuántos tengo?', e: '🍬' },
    { who: 'Había {a} galletas en la charola', s1: ['se vendieron {b}', 'se cayeron {b}'], a1: ['horneé {c} más', 'pusieron {c} más'], q: '¿cuántas quedan?', e: '🍪' },
    { who: 'Tenía {a} pastelitos', s1: ['vendí {b}', 'regalé {b}'], a1: ['decoré {c} más', 'me trajeron {c}'], q: '¿cuántos tengo?', e: '🧁' },
    { who: 'Había {a} donas en la vitrina', s1: ['se compraron {b}', 'se comieron {b}'], a1: ['salieron {c} del horno', 'pusieron {c} más'], q: '¿cuántas hay ahora?', e: '🍩' },
    { who: 'Tenía {a} paletas', s1: ['di {b} a mis amigos', 'se derritieron {b}'], a1: ['hice {c} más', 'me regalaron {c}'], q: '¿cuántas tengo?', e: '🍭' },
    { who: 'Había {a} fresas para el pastel', s1: ['me comí {b}', 'se usaron {b}'], a1: ['compré {c} más', 'trajeron {c} más'], q: '¿cuántas quedan?', e: '🍓' }
  ];

  var nivel = 0, round = 0, lock = false, running = false, cur = null, counted = 0, plan = [], streak = 0, handShown = false;
  var hud, dots, instr, instrTxt, stage, eq, trayA, trayB, trayC, opEl, op2El, resEl, nums, banner, vit;

  function el(tag, cls, html) { var d = document.createElement(tag); if (cls) d.className = cls; if (html != null) d.innerHTML = html; return d; }
  function readJSON(k, def) { try { return JSON.parse(localStorage.getItem(k)) || def; } catch (e) { return def; } }
  function writeJSON(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }

  // ---- Hero art: el osito pastelero (SVG con parpadeo, cabeceo y batidor) ----
  function bakerSVG(size) {
    return '<svg class="baker" viewBox="0 0 120 120" width="' + size + '" height="' + size + '" aria-hidden="true"><defs>' +
      '<radialGradient id="bkf" cx=".4" cy=".35" r=".8"><stop offset="0" stop-color="#dfa872"/><stop offset="1" stop-color="#9c6230"/></radialGradient>' +
      '<linearGradient id="bkh" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#dde4f0"/></linearGradient>' +
      '<linearGradient id="bka" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ff9ccb"/><stop offset="1" stop-color="#f0569a"/></linearGradient></defs>' +
      '<ellipse cx="60" cy="113" rx="36" ry="6" fill="rgba(0,0,0,.2)"/>' +
      '<path d="M28 112 Q28 76 60 76 Q92 76 92 112Z" fill="url(#bka)"/><path d="M40 112 Q40 86 60 86 Q80 86 80 112Z" fill="#fff" opacity=".92"/><path d="M48 96 L72 96" stroke="#f582ae" stroke-width="3" stroke-linecap="round"/>' +
      '<path d="M90 92 L106 72" stroke="#8a5a32" stroke-width="4" stroke-linecap="round"/><ellipse cx="108" cy="64" rx="7" ry="10" fill="none" stroke="#8d93a8" stroke-width="2.5"/><path d="M103 58 L113 70 M113 58 L103 70 M108 54 L108 74" stroke="#8d93a8" stroke-width="1.5"/>' +
      '<g class="bk-head">' +
      '<circle cx="30" cy="44" r="11" fill="url(#bkf)" stroke="#6b3d12" stroke-width="2"/><circle cx="90" cy="44" r="11" fill="url(#bkf)" stroke="#6b3d12" stroke-width="2"/><circle cx="30" cy="44" r="5" fill="#f5cfa8"/><circle cx="90" cy="44" r="5" fill="#f5cfa8"/>' +
      '<ellipse cx="60" cy="58" rx="32" ry="28" fill="url(#bkf)" stroke="#6b3d12" stroke-width="2"/>' +
      '<ellipse cx="60" cy="69" rx="14" ry="10" fill="#f5cfa8"/>' +
      '<g class="bk-eyes"><ellipse cx="48" cy="54" rx="4.5" ry="5.5" fill="#2b2b2b"/><ellipse cx="72" cy="54" rx="4.5" ry="5.5" fill="#2b2b2b"/><circle cx="49.5" cy="52" r="1.6" fill="#fff"/><circle cx="73.5" cy="52" r="1.6" fill="#fff"/></g>' +
      '<ellipse cx="60" cy="65" rx="5" ry="3.5" fill="#2b2b2b"/>' +
      '<path class="bk-mouth" d="M53 72 Q60 78 67 72" stroke="#6b3d12" stroke-width="2.5" fill="none" stroke-linecap="round"/>' +
      '<circle cx="40" cy="64" r="4.5" fill="#ff8aa8" opacity=".5"/><circle cx="80" cy="64" r="4.5" fill="#ff8aa8" opacity=".5"/>' +
      '<path d="M34 36 Q28 10 50 12 Q60 0 70 12 Q92 10 86 36Z" fill="url(#bkh)" stroke="#9aa5b8" stroke-width="2" stroke-linejoin="round"/><rect x="36" y="31" width="48" height="11" rx="5" fill="#fff" stroke="#9aa5b8" stroke-width="2"/>' +
      '</g></svg>';
  }
  function bakerCheer() { var b = instr && instr.querySelector('.baker'); if (b) { b.classList.remove('cheer'); void b.offsetWidth; b.classList.add('cheer'); } }

  function build() {
    game.innerHTML = '';
    hud = el('div', 'hud panel');
    hud.appendChild(KidsGame.levelBadge(nivel));
    dots = el('div', 'dots');
    for (var i = 0; i < ROUNDS; i++) dots.appendChild(document.createElement('span'));
    hud.appendChild(dots);
    vit = el('div', 'vit'); renderVit(); hud.appendChild(vit);
    var lb = el('button', 'btn round yellow', '🎚️'); lb.setAttribute('aria-label', 'Nivel');
    lb.addEventListener('pointerdown', function (ev) { ev.preventDefault(); KidsGame.sound.tap(); showPicker(); });

    var sp = el('button', 'btn round blue', '🔊');
    sp.addEventListener('pointerdown', function (ev) { ev.preventDefault(); KidsGame.sound.tap(); sayRound(); });
    instr.appendChild(sp);
    game.appendChild(instr);

    stage = el('div', 'stage');
    eq = el('div', 'eq');
    trayA = el('div', 'tray'); trayB = el('div', 'tray'); trayC = el('div', 'tray hidden');
    opEl = el('div', 'op'); op2El = el('div', 'op hidden');

  function renderVit(newId) {

  }
  function showBanner(txt, ms) { banner.textContent = txt; banner.classList.add('show'); clearTimeout(banner._t); banner._t = setTimeout(function () { banner.classList.remove('show'); }, ms || 1100); }
  // Juice: acierto (partículas, anillo, +1 o racha) y fallo (sacudida suave; la racha se reinicia sin castigo)

  function showPicker() {

  }
  function start(lv) { nivel = lv; round = 0; running = true; streak = 0; plan = KidsGame.shuffle(MODES[lv]); build(); newRound(true); }

  function fill(t, v) { return t.replace('{a}', v.a).replace('{b}', v.b).replace('{c}', v.c); }
  function makeRound() {

  // Entre rondas el escenario sale deslizando y el nuevo entra (nunca un cambio seco)
  function newRound(first) {

  function layout() {

    var trayW = trayA.clientWidth - 20, m = cur.mode;

  function done() {

    }, 750);

  // ---- Arrastrar la ficha al hueco "?" (nivel 3) ----
  var drag = null;
  function startDrag(ev, n, v) {
    if (lock || !running || drag) return;
    var r = n.getBoundingClientRect();
    var g = n.cloneNode(true); g.className = n.className + ' drag'; g.style.left = r.left + 'px'; g.style.top = r.top + 'px'; g.style.width = r.width + 'px'; g.style.height = r.height + 'px';
    document.body.appendChild(g); n.classList.add('ghost');

  }

  function joinAnim() {
    var objs = Array.prototype.slice.call(trayB.querySelectorAll('.obj')).concat(Array.prototype.slice.call(trayC.querySelectorAll('.obj')));
    var before = objs.map(function (o) { return o.getBoundingClientRect(); });
