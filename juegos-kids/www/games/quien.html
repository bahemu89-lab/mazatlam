<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<link rel="stylesheet" href="../common.css">
<title>Agencia de detectives</title>
<style>
  /* ===== Mundo: "La agencia de detectives" — fotos de sospechosos en un corcho y una libreta de pistas ===== */
  .game {
    --l1: #ffe98a; --l2: #c47f00; --l3: #7a4b00; /* lupa (cosmético) */
    display: flex; flex-direction: column; align-items: center; padding: 8px 12px; gap: 8px;
    background:
      radial-gradient(ellipse 70% 40% at 50% 0%, rgba(255,255,255,.18), rgba(255,255,255,0) 70%),
      radial-gradient(ellipse 100% 50% at 50% 110%, rgba(0,20,40,.5), rgba(0,0,0,0) 60%),
      linear-gradient(180deg, #2f5d7a 0%, #1f4258 55%, #16303f 100%);
  }
  .game.dorada { --l1: #fff3b0; --l2: #e0a020; --l3: #8a5a00; } .game.rosa { --l1: #ffd6e8; --l2: #f0569a; --l3: #b8306f; }
  .game.verde { --l1: #c2ffd2; --l2: #24b36c; --l3: #14784a; } .game.azul { --l1: #d4f0ff; --l2: #2f95e8; --l3: #1a63a8; }
  /* lambrín de madera abajo */
  .game::after { content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 14%; z-index: 0; pointer-events: none;
    background: repeating-linear-gradient(90deg, #6b4a2a 0 120px, #5a3c20 120px 124px), linear-gradient(180deg, #7a5530, #4e3418); background-blend-mode: multiply; border-top: 6px solid #8a6540; box-shadow: 0 -4px 12px rgba(0,0,0,.35); }
  .game::before { content: ""; position: absolute; inset: 0; pointer-events: none; z-index: 0; opacity: .35;
    background: radial-gradient(circle at 8% 24%, rgba(255,255,255,.6) 0 1.5px, rgba(255,255,255,0) 2.5px), radial-gradient(circle at 90% 16%, rgba(255,255,255,.5) 0 1.5px, rgba(255,255,255,0) 2.5px), radial-gradient(circle at 70% 80%, rgba(255,255,255,.4) 0 1.5px, rgba(255,255,255,0) 2.5px); }
  .hud { position: relative; z-index: 2; flex: 0 0 auto; display: flex; align-items: center; gap: 10px; padding: 6px 10px 6px 14px; border-radius: 40px; max-width: 100%; }
  .hud .btn.round { width: 64px; height: 64px; font-size: 28px; }
  .hud .hero { width: 52px; height: 52px; flex: 0 0 auto; } .hud .hero svg { width: 100%; height: 100%; overflow: visible; }
  .dots { display: flex; gap: 6px; }
  .dots span { width: 16px; height: 16px; border-radius: 50%; background: linear-gradient(180deg, #e8ecf5, #c9d2e6); box-shadow: inset 0 2px 3px rgba(0,0,0,.18); transition: transform .2s, background .2s; }
  .dots span.on { background: radial-gradient(circle at 35% 30%, #fff3a8, #ffb703 70%); box-shadow: 0 2px 0 #c47f00, 0 3px 6px rgba(0,0,0,.25), inset 0 1px 0 #fff; transform: scale(1.15); }
  .hud .q { font-size: 24px; font-weight: 900; color: #1f4258; text-shadow: 0 2px 0 #fff, 0 3px 6px rgba(0,0,0,.12); white-space: nowrap; }
  .hud .streak { display: none; font-size: 18px; font-weight: 900; color: #fff; padding: 4px 12px; border-radius: 20px; white-space: nowrap; background: linear-gradient(180deg, #ff9f43, #ff5e3a); box-shadow: 0 3px 0 #b8300a, 0 5px 10px rgba(0,0,0,.25); text-shadow: 0 1px 0 rgba(0,0,0,.3); animation: pop .4s ease-out; }
  .hud .streak.on { display: inline-block; }

  .main { position: relative; z-index: 1; flex: 1 1 auto; width: 100%; min-height: 0; display: flex; gap: 12px; align-items: stretch; justify-content: center; }
  .main.row { flex-direction: row; } .main.col { flex-direction: column; }
  .main.out { animation: stout .26s ease-in forwards; } .main.in { animation: stin .4s cubic-bezier(.3,1.3,.4,1); }
  @keyframes stout { to { transform: translateX(-70px) scale(.94); opacity: 0; } }
  @keyframes stin { from { transform: translateX(80px) scale(.94); opacity: 0; } to { transform: none; opacity: 1; } }
  /* corcho */
  .boardwrap { position: relative; flex: 1 1 auto; min-width: 0; min-height: 0; display: flex; align-items: center; justify-content: center; border-radius: 22px; padding: 10px;
    background: radial-gradient(circle at 20% 30%, rgba(255,255,255,.08) 0 2px, rgba(255,255,255,0) 3px), radial-gradient(circle at 70% 60%, rgba(0,0,0,.08) 0 2px, rgba(0,0,0,0) 3px), linear-gradient(180deg, #d9a86a, #c08a4c);
    background-size: 37px 41px, 53px 47px, auto; border: 10px solid #6b4a2a; box-shadow: inset 0 0 30px rgba(0,0,0,.25), 0 10px 0 #3e2a14, 0 18px 30px rgba(0,0,0,.4); }
  .boardwrap::before { content: "SOSPECHOSOS"; position: absolute; left: 50%; top: -22px; transform: translateX(-50%) rotate(-2deg); padding: 2px 16px; border-radius: 6px; font-size: 15px; font-weight: 900; letter-spacing: 2px; color: #7a4b00;
    background: linear-gradient(180deg, #fff6d0, #ffe08a); box-shadow: 0 3px 0 #c47f00, 0 5px 8px rgba(0,0,0,.3); z-index: 3; }
  .grid { display: grid; gap: var(--gap); }
  .card3d { position: relative; width: var(--s); height: var(--s); cursor: pointer; perspective: 600px; transform: rotate(var(--rot, 0deg)); }
  .card3d .inner { position: absolute; inset: 0; transition: transform .45s cubic-bezier(.4,.2,.2,1.2); transform-style: preserve-3d; }
  .card3d.down .inner { transform: rotateY(180deg); }
  .card3d .pin { position: absolute; left: 50%; top: -9px; width: 20px; height: 20px; margin-left: -10px; border-radius: 50%; z-index: 4; pointer-events: none;
    background: radial-gradient(circle at 35% 30%, #ff9c9c, #e53935 60%, #8e1515); box-shadow: 0 3px 4px rgba(0,0,0,.45), inset 0 -2px 0 rgba(0,0,0,.2); }
  .card3d:nth-child(3n) .pin { background: radial-gradient(circle at 35% 30%, #9fdcff, #2f95e8 60%, #1a63a8); } .card3d:nth-child(3n+1) .pin { background: radial-gradient(circle at 35% 30%, #b8f5c0, #24b36c 60%, #14784a); }
  .face, .back { position: absolute; inset: 0; border-radius: 16px; backface-visibility: hidden; -webkit-backface-visibility: hidden; }
  .face {
    --c1: #ffffff; --c2: #d9ecff; --c3: #7fa6d6;
    display: flex; align-items: center; justify-content: center; padding: 6%; padding-bottom: 14%;
    background: linear-gradient(180deg, #ffffff, #f4f6fb); border: 3px solid #fff;
    box-shadow: 0 6px 0 #c9d2e6, 0 12px 20px rgba(0,20,40,.35), inset 0 2px 0 #fff; transition: box-shadow .2s;
  }
  .face .ph { width: 100%; height: 100%; border-radius: 12px; display: flex; align-items: center; justify-content: center; overflow: hidden;
    background: radial-gradient(circle at 36% 28%, rgba(255,255,255,.95) 0%, rgba(255,255,255,.3) 20%, rgba(255,255,255,0) 42%), radial-gradient(circle at 50% 50%, var(--c1) 0%, var(--c2) 100%); box-shadow: inset 0 0 0 2px var(--c3), inset 0 -6px 0 rgba(0,0,0,.06); }
  .face .ph svg { width: 96%; height: 96%; overflow: visible; }
  .face .num { position: absolute; left: 50%; bottom: 2%; transform: translateX(-50%); font-size: calc(var(--s) * .09); font-weight: 900; color: #6b7a99; letter-spacing: 1px; }
  .m1 .face { --c1: #fff; --c2: #ffd6e8; --c3: #d57aa6; } .m2 .face { --c1: #fff; --c2: #d4f0ff; --c3: #6aa6d6; } .m3 .face { --c1: #fff; --c2: #dbffe6; --c3: #5fbf86; }
  .m4 .face { --c1: #fff; --c2: #fff2c4; --c3: #d6ad4a; } .m5 .face { --c1: #fff; --c2: #e6dcff; --c3: #a08ae0; } .m6 .face { --c1: #fff; --c2: #ffe4cc; --c3: #e09a5c; }
  .back { transform: rotateY(180deg); display: flex; align-items: center; justify-content: center; font-size: calc(var(--s) * .4);
    background: linear-gradient(180deg, #e8ecf5, #c9d2e6); border: 3px solid #fff; box-shadow: 0 6px 0 #8f9bb3, 0 12px 20px rgba(0,20,40,.35); }
  .back::before { content: ""; position: absolute; inset: 10%; border-radius: 10px; border: 3px dashed rgba(0,0,0,.15); }
  .card3d:active .face { transform: scale(1.04); }
  .card3d.ok { z-index: 6; }
  .card3d.ok .inner { transform: scale(1.14); }
  .card3d.ok .face { box-shadow: 0 6px 0 #3fa864, 0 12px 20px rgba(0,20,40,.35), 0 0 0 6px #ffe98a, 0 0 0 11px rgba(255,255,255,.7), 0 0 40px 10px rgba(255,233,138,.95), inset 0 2px 0 #fff; }
  .card3d.dim { opacity: .55; }
  .card3d.dim .face::after { content: "✖"; position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%) rotate(-12deg); font-size: calc(var(--s) * .5); font-weight: 900; color: rgba(229,57,53,.75); animation: stamp .3s ease-out backwards; }
  .card3d.ok .face::after { content: "✔"; position: absolute; right: -6%; top: -8%; width: 34%; height: 34%; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: calc(var(--s) * .2); font-weight: 900; color: #fff;
    background: radial-gradient(circle at 35% 30%, #8ef0b0, #24b36c 70%); box-shadow: 0 3px 0 #14784a, 0 4px 8px rgba(0,0,0,.3); animation: stamp .35s .3s cubic-bezier(.3,1.6,.5,1) backwards; }
  @keyframes stamp { 0% { transform: translate(-50%, -50%) rotate(-12deg) scale(2.2); opacity: 0; } 100% { transform: translate(-50%, -50%) rotate(-12deg) scale(1); opacity: 1; } }
  .card3d.ok .face::after { animation-name: stamp2; }
  @keyframes stamp2 { 0% { transform: scale(2.4); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }
  .card3d.last .face { box-shadow: 0 6px 0 #c9d2e6, 0 12px 20px rgba(0,20,40,.35), 0 0 0 6px rgba(255,233,138,.9), 0 0 26px 8px rgba(255,233,138,.8), inset 0 2px 0 #fff; }
  .card3d.pop { animation: pop .4s ease-out backwards; }
  /* lupa que se posa sobre el culpable */
  .lens { position: fixed; z-index: 65; width: 120px; height: 120px; pointer-events: none; opacity: 0; transform: translate(-50%, -50%) scale(2.2) rotate(-30deg); transition: transform .55s cubic-bezier(.3,1.4,.4,1), opacity .25s; }
  .lens.show { opacity: 1; transform: translate(-40%, -40%) scale(1) rotate(-20deg); }
  .lens svg { width: 100%; height: 100%; overflow: visible; filter: drop-shadow(0 10px 10px rgba(0,0,0,.4)); }

  /* Libreta de pistas */
  .clues { position: relative; flex: 0 0 auto; display: flex; flex-direction: column; gap: 8px; padding: 26px 12px 12px; border-radius: 14px 14px 20px 20px; min-width: 0;
    background: repeating-linear-gradient(180deg, rgba(0,0,0,0) 0 27px, rgba(47,149,232,.18) 27px 29px), linear-gradient(180deg, #fffdf5, #fff8e6); border: 3px solid #fff;
    box-shadow: 0 8px 0 #c9b98a, 0 16px 28px rgba(0,0,0,.35), inset 0 2px 0 #fff; }
  .clues::before { content: ""; position: absolute; left: 10px; right: 10px; top: 6px; height: 14px; pointer-events: none;
    background: radial-gradient(circle at 7px 7px, #5a6478 0 4px, #2b3140 4px 5.5px, rgba(0,0,0,0) 6px) 0 0 / 28px 14px repeat-x; }
  .clues::after { content: ""; position: absolute; left: 34px; top: 0; bottom: 0; width: 2px; background: rgba(229,57,53,.35); pointer-events: none; }
  .main.row .clues { width: var(--cw); max-width: 44%; justify-content: center; align-self: center; max-height: 100%; }
  .main.col .clues { width: 100%; flex-direction: row; flex-wrap: wrap; justify-content: center; }
  .clue { position: relative; display: flex; align-items: center; gap: 10px; min-height: 64px; padding: 6px 10px 6px 12px; border-radius: 20px; cursor: pointer;
    background: linear-gradient(180deg, #ffffff 0%, #eef2fa 100%); border: 3px solid #fff;
    box-shadow: 0 5px 0 #c9d2e6, 0 10px 16px rgba(20,40,90,.2), inset 0 2px 0 #fff; transition: transform .12s; animation: pop .4s ease-out backwards; }
  .main.col .clue { flex: 1 1 auto; max-width: 48%; }
  .clue:active { transform: scale(.97) translateY(2px); }
  .clue .ico { display: flex; align-items: center; gap: 4px; flex: 0 0 auto; }
  .clue .ci { position: relative; display: inline-flex; align-items: center; justify-content: center; width: 48px; height: 48px; border-radius: 14px; font-size: 30px; line-height: 1;
    background: linear-gradient(180deg, #fff, #e6ecf7); box-shadow: 0 3px 0 #c9d2e6, 0 5px 8px rgba(0,0,0,.15), inset 0 1px 0 #fff; }
  .clue .ci .sw { position: absolute; right: -6px; bottom: -6px; width: 22px; height: 22px; border-radius: 50%; border: 3px solid #fff; box-shadow: 0 2px 4px rgba(0,0,0,.35); }
  .clue .ci .no { position: absolute; inset: -4px; border-radius: 50%; border: 4px solid #e8322a; pointer-events: none; opacity: .9; }
  .clue .ci .no::after { content: ""; position: absolute; left: 50%; top: -2px; bottom: -2px; width: 4px; margin-left: -2px; background: #e8322a; transform: rotate(45deg); border-radius: 2px; }
  .clue .or { font-size: 18px; font-weight: 900; color: #7f5af0; padding: 0 2px; }
  .clue .txt { flex: 1 1 auto; font-size: 20px; font-weight: 900; color: #1f2f6b; line-height: 1.1; text-shadow: 0 1px 0 #fff; }
  .clue .txt b { color: #e8322a; }
  .clue .spk { flex: 0 0 auto; font-size: 22px; filter: drop-shadow(0 2px 2px rgba(0,0,0,.25)); }
  .clue.pulse { animation: cluepulse 1.4s ease-in-out; }
  @keyframes cluepulse { 0%,100% { transform: scale(1); } 20%,60% { transform: scale(1.06); background: linear-gradient(180deg, #ffe3e3, #ffb3b3); box-shadow: 0 5px 0 #b33, 0 10px 16px rgba(20,40,90,.2), 0 0 0 5px rgba(255,80,80,.5); } 40%,80% { transform: scale(1.02); } }
  .clues .more { align-self: center; font-size: 22px; min-height: 64px; padding: 6px 18px; }
  .clues .more.off { opacity: .4; pointer-events: none; filter: saturate(.3); }
  .clues .ttl { font-size: 18px; font-weight: 900; color: #1f4258; text-align: center; text-shadow: 0 1px 0 #fff; width: 100%; }

  .banner { position: absolute; left: 50%; top: 40%; z-index: 30; pointer-events: none; opacity: 0; transform: translate(-50%, -50%) scale(.5); padding: 12px 36px; border-radius: 40px; white-space: nowrap;
    font-size: clamp(26px, 4.5vw, 40px); font-weight: 900; color: #6a3f00; background: linear-gradient(180deg, #ffe98a, #ffb703); text-shadow: 0 2px 0 rgba(255,255,255,.6);
    box-shadow: 0 8px 0 #c47f00, 0 18px 30px rgba(0,0,0,.4), inset 0 2px 0 #fff; }
  .banner.show { animation: bannerin 1.5s cubic-bezier(.3,1.4,.4,1) forwards; }
  @keyframes bannerin { 0% { opacity: 0; transform: translate(-50%,-50%) scale(.5); } 16% { opacity: 1; transform: translate(-50%,-50%) scale(1.06); } 26% { transform: translate(-50%,-50%) scale(1); } 76% { opacity: 1; transform: translate(-50%,-50%) scale(1); } 100% { opacity: 0; transform: translate(-50%,-100%) scale(.9); } }
  @media (max-width: 800px) { .hud { gap: 6px; padding: 6px 8px; } .hud .q { font-size: 20px; } .clue .txt { font-size: 17px; } .clue .ci { width: 42px; height: 42px; font-size: 26px; } }
</style>
</head>
<body>
<script src="../common.js"></script>
<script>
var game = KidsGame.init({ title: 'Agencia de detectives' });
(function () {
  var CFG = {
    1: { n: 4,  clues: 2, modes: ['pos', 'pos'] },
    2: { n: 6,  clues: 3, modes: ['pos', 'pos', 'pos'] },
    3: { n: 9,  clues: 4, modes: ['pos', 'pos', 'neg', 'pos'] },
    4: { n: 12, clues: 5, modes: ['pos', 'or', 'pos', 'neg', 'pos'], oneByOne: true, flip: true }
  };
  var LABELS = { 1: '4 caras · 2 pistas', 2: '6 caras · 3 pistas', 3: '9 caras · pista NO', 4: '12 caras · tachar' };
  var ROUNDS = 6;
  var HAIR = { amarillo: '#ffd93d', cafe: '#8b5a2b', rojo: '#e8552a', negro: '#2b2b3b' };
  var EYES = { azul: '#2f95e8', verde: '#2cb67d', cafe: '#8b5a2b' };
  var SHIRT = { rojo: '#ff4d4d', azul: '#2f95e8', verde: '#2fc56d', amarillo: '#ffc800', morado: '#8a5cf6' };
  var SKIN = ['#ffd9b3', '#e8b48c', '#a86f45'];
  var KINDS = ['nino', 'nino', 'gato', 'oso', 'conejo'];
  var HATS = ['none', 'none', 'gorra', 'sombrero', 'corona', 'mono'];
  var HATL = ['gorra', 'sombrero', 'corona', 'mono'], KINDL = ['nino', 'gato', 'oso', 'conejo'];
  var T = {
    hair: { amarillo: 'pelo amarillo', cafe: 'pelo café', rojo: 'pelo rojo', negro: 'pelo negro' },
    eyes: { azul: 'ojos azules', verde: 'ojos verdes', cafe: 'ojos cafés' },
    shirt: { rojo: 'camisa roja', azul: 'camisa azul', verde: 'camisa verde', amarillo: 'camisa amarilla', morado: 'camisa morada' },
    hat: { gorra: 'gorra', sombrero: 'sombrero', corona: 'corona', mono: 'moño', none: 'nada en la cabeza' },
    kind: { nino: 'una persona', gato: 'un gato', oso: 'un oso', conejo: 'un conejo' },
    mood: { feliz: 'feliz', serio: 'serio' }
  };
  var ICO = { hair: '💇', eyes: '👁️', shirt: '👕', gorra: '🧢', sombrero: '🎩', corona: '👑', mono: '🎀', none: '🎩', glasses: '👓', nino: '🧒', gato: '🐱', oso: '🐻', conejo: '🐰', feliz: '😀', serio: '😐' };
  var SKINS = [{ id: 'clasica', n: 'Lupa clásica', e: '🔍' }, { id: 'dorada', n: 'Lupa dorada', e: '🥇' }, { id: 'rosa', n: 'Lupa rosa', e: '🌸' }, { id: 'verde', n: 'Lupa verde', e: '🍀' }, { id: 'azul', n: 'Lupa azul', e: '💙' }];
  var cos = { unlocked: ['clasica'], sel: 'clasica' };
  try { var sv = JSON.parse(localStorage.getItem('kg-cos-quien')); if (sv && sv.unlocked) cos = sv; } catch (e) {}
  function saveCos() { try { localStorage.setItem('kg-cos-quien', JSON.stringify(cos)); } catch (e) {} }

  // ---------- Arte: lupa detective (hero) ----------
  function lensSVG(size, withHat) {
    return '<svg viewBox="0 0 100 100" width="' + size + '" height="' + size + '" aria-hidden="true"><defs>' +
      '<radialGradient id="lg" cx="38%" cy="32%" r="70%"><stop offset="0" stop-color="#ffffff" stop-opacity=".9"/><stop offset=".45" stop-color="#bfe9ff" stop-opacity=".35"/><stop offset="1" stop-color="#2f95e8" stop-opacity=".35"/></radialGradient>' +
      '<linearGradient id="lr" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="var(--l1, #ffe98a)"/><stop offset=".6" stop-color="var(--l2, #c47f00)"/><stop offset="1" stop-color="var(--l3, #7a4b00)"/></linearGradient>' +
      '<linearGradient id="lh" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#8a5a2a"/><stop offset="1" stop-color="#3e2a14"/></linearGradient></defs>' +
      '<path d="M62 62 L88 88" stroke="url(#lh)" stroke-width="14" stroke-linecap="round"/><path d="M64 64 L86 86" stroke="rgba(255,255,255,.25)" stroke-width="4" stroke-linecap="round"/>' +
      '<circle cx="40" cy="40" r="32" fill="url(#lg)" stroke="url(#lr)" stroke-width="9"/>' +
      '<circle cx="40" cy="40" r="26" fill="none" stroke="rgba(255,255,255,.5)" stroke-width="2"/>' +
      (withHat ? '<path d="M18 36 Q40 26 62 36 L58 36 Q40 30 22 36 Z" fill="#3d3d55"/><rect x="26" y="20" width="28" height="16" rx="3" fill="#3d3d55"/><rect x="26" y="31" width="28" height="4" fill="#e8322a"/>' +
        '<ellipse cx="33" cy="46" rx="3.5" ry="4" fill="#fff"/><ellipse cx="47" cy="46" rx="3.5" ry="4" fill="#fff"/><circle cx="33.5" cy="47" r="2" fill="#222"/><circle cx="47.5" cy="47" r="2" fill="#222"/><path d="M34 55 Q40 60 46 55" fill="none" stroke="#b8306f" stroke-width="2" stroke-linecap="round"/>' : '') +
      '<path d="M22 28 Q26 18 36 16" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round" opacity=".85"/></svg>';
  }

  // ---------- Personajes ----------
  function randomChar() {
    return { kind: KidsGame.pick(KINDS), hair: KidsGame.pick(Object.keys(HAIR)), hat: KidsGame.pick(HATS), glasses: KidsGame.rand(3) === 0,
      eyes: KidsGame.pick(Object.keys(EYES)), shirt: KidsGame.pick(Object.keys(SHIRT)), mood: KidsGame.rand(3) === 0 ? 'serio' : 'feliz', skin: KidsGame.pick(SKIN) };
  }
  function sig(c) { return [c.kind, c.hair, c.hat, c.glasses, c.eyes, c.shirt, c.mood].join('|'); }
  function svgChar(c, id) {
    var fur = c.kind === 'nino' ? c.skin : (c.kind === 'conejo' ? (c.hair === 'negro' ? '#9aa0ab' : (c.hair === 'amarillo' ? '#fff3d6' : HAIR[c.hair])) : HAIR[c.hair]);
    var s = '<svg viewBox="0 0 100 100"><defs>' +
      '<radialGradient id="h' + id + '" cx="40%" cy="30%" r="75%"><stop offset="0" stop-color="#fff" stop-opacity=".55"/><stop offset=".5" stop-color="#fff" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".18"/></radialGradient>' +

        if (streak >= 3) KidsGame.fx.floatText(x, y - r.height * .6, '¡Racha x' + streak + '!', 'good'); else KidsGame.fx.floatText(x, y - r.height * .6, roundWrong === 0 ? '+1 ¡A la primera!' : '+1', 'good');
        if (streak > 0 && streak % 5 === 0) { KidsGame.addStar(1); KidsGame.fx.burst(x, y - 60, { n: 10, chars: ['⭐', '✨'] }); KidsGame.toast('⭐ ¡Bonus de racha!', 1300); }
      }, 350);
      dots.children[round].classList.add('on'); round++;
      KidsGame.say(KidsGame.pick(['¡Sí! ¡Caso resuelto!', '¡Lo encontraste, detective!', '¡Muy bien! ¡Es ese!']));
      var ss = session;
      // preparar el siguiente caso mientras celebra (sin congelar el toque)
      setTimeout(function () { if (ss === session && running && round < ROUNDS) next = genRound(nivel); }, 500);
      setTimeout(function () {
        if (ss !== session || !running) return;
        if (round >= ROUNDS) { finish(); return; }
        main.classList.add('out'); lens.classList.remove('show');
        setTimeout(function () { if (ss === session && running) newRound(false); }, 280);
      }, 2000);
    } else {
      wrongs++; roundWrong++; streak = 0; setStreak();
      KidsGame.sound.wrong(); KidsGame.vibrate(30);
      KidsGame.fx.shake(el);
      var c = cur.chars[i], idx = -1;
      for (var k = 0; k < shown; k++) if (!sat(c, cur.clues[k])) { idx = k; break; }
      if (idx >= 0) {
        var ce = clueEls[idx]; ce.classList.remove('pulse', 'pop'); void ce.offsetWidth; ce.classList.add('pulse');
        KidsGame.say('No. Mira la pista: ' + clueText(cur.clues[idx]) + '.');
      } else {
        KidsGame.say('Pide otra pista.');
        if (moreBtn) { moreBtn.classList.remove('pop'); void moreBtn.offsetWidth; moreBtn.classList.add('pop'); }
      }
    }
  }
  function finish() {
    running = false;
    var stars = wrongs <= 1 ? 3 : (wrongs <= 4 ? 2 : 1), lv = nivel;
    KidsGame.levelDone(lv);
    var s = unlockSkin(lv);
    if (skinBtn) skinBtn.style.display = cos.unlocked.length > 1 ? '' : 'none';
    KidsGame.celebrate({
      sub: '¡' + ROUNDS + ' casos resueltos!' + (s ? ' 🎨 Nuevo: ' + s.n : ''), stars: stars,
      onNext: function () { start(Math.min(4, lv + 1)); },
      onAgain: function () { start(lv); }
    });
  }

  window.__quien = { get: function () { return { cur: cur, nivel: nivel, round: round, shown: shown, wrongs: wrongs, lock: lock, streak: streak }; }, cards: function () { return cardEls; }, clues: function () { return clueEls; }, sat: sat, gen: genRound, text: clueText };
  window.addEventListener('resize', layout);
  showPicker();
})();
</script>
