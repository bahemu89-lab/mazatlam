<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<link rel="stylesheet" href="../common.css">
<title>¿Quién es?</title>
<style>
  .game {
    display: flex; flex-direction: column; align-items: center; padding: 8px 12px; gap: 8px;
    background:
      radial-gradient(ellipse 70% 40% at 50% 0%, rgba(255,255,255,.5), rgba(255,255,255,0) 70%),
      radial-gradient(ellipse 100% 50% at 50% 110%, rgba(0,60,60,.4), rgba(0,0,0,0) 60%),
      linear-gradient(180deg, #b8f5e6 0%, #5fd4c0 50%, #1f9e95 100%);
  }
  .game::before {
    content: ""; position: absolute; inset: 0; pointer-events: none; z-index: 0; opacity: .45;
    background:
      radial-gradient(circle at 10% 30%, rgba(255,255,255,.5) 0 26px, rgba(255,255,255,0) 27px),
      radial-gradient(circle at 92% 24%, rgba(255,255,255,.45) 0 34px, rgba(255,255,255,0) 35px),
      radial-gradient(circle at 80% 86%, rgba(255,255,255,.4) 0 20px, rgba(255,255,255,0) 21px),
      radial-gradient(circle at 22% 84%, rgba(255,255,255,.4) 0 28px, rgba(255,255,255,0) 29px);
  }
  .hud { position: relative; z-index: 2; flex: 0 0 auto; display: flex; align-items: center; gap: 10px; padding: 6px 10px 6px 14px; border-radius: 40px; max-width: 100%; }
  .hud .btn.round { width: 64px; height: 64px; font-size: 28px; }
  .dots { display: flex; gap: 6px; }
  .dots span { width: 16px; height: 16px; border-radius: 50%; background: linear-gradient(180deg, #e8ecf5, #c9d2e6); box-shadow: inset 0 2px 3px rgba(0,0,0,.18); transition: transform .2s, background .2s; }
  .dots span.on { background: radial-gradient(circle at 35% 30%, #fff3a8, #ffb703 70%); box-shadow: 0 2px 0 #c47f00, 0 3px 6px rgba(0,0,0,.25), inset 0 1px 0 #fff; transform: scale(1.15); }
  .hud .q { font-size: 26px; font-weight: 900; color: #0d6e66; text-shadow: 0 2px 0 #fff, 0 3px 6px rgba(0,0,0,.12); white-space: nowrap; }

  .main { position: relative; z-index: 1; flex: 1 1 auto; width: 100%; min-height: 0; display: flex; gap: 10px; align-items: stretch; justify-content: center; }
  .main.row { flex-direction: row; }
  .main.col { flex-direction: column; }
  .boardwrap { flex: 1 1 auto; min-width: 0; min-height: 0; display: flex; align-items: center; justify-content: center; }
  .grid { display: grid; gap: var(--gap); }
  .card3d { position: relative; width: var(--s); height: var(--s); cursor: pointer; perspective: 600px; }
  .card3d .inner { position: absolute; inset: 0; transition: transform .45s cubic-bezier(.4,.2,.2,1.2); transform-style: preserve-3d; }
  .card3d.down .inner { transform: rotateY(180deg); }
  .face, .back { position: absolute; inset: 0; border-radius: 50%; backface-visibility: hidden; -webkit-backface-visibility: hidden; }
  .face {
    --c1: #ffffff; --c2: #d9ecff; --c3: #7fa6d6;
    display: flex; align-items: center; justify-content: center;
    background: radial-gradient(circle at 36% 28%, rgba(255,255,255,.95) 0%, rgba(255,255,255,.3) 20%, rgba(255,255,255,0) 42%), radial-gradient(circle at 50% 50%, var(--c1) 0%, var(--c2) 100%);
    border: 4px solid rgba(255,255,255,.95);
    box-shadow: 0 8px 0 var(--c3), 0 16px 24px rgba(0,40,60,.35), inset 0 3px 0 rgba(255,255,255,.8), inset 0 -8px 0 rgba(0,0,0,.08);
    transition: box-shadow .2s;
  }
  .face::after { content: ""; position: absolute; inset: 7%; border-radius: 50%; pointer-events: none; border: 3px solid rgba(255,255,255,.45); }
  .face svg { width: 86%; height: 86%; overflow: visible; }
  .m1 .face { --c1: #fff; --c2: #ffd6e8; --c3: #d57aa6; } .m2 .face { --c1: #fff; --c2: #d4f0ff; --c3: #6aa6d6; } .m3 .face { --c1: #fff; --c2: #dbffe6; --c3: #5fbf86; }
  .m4 .face { --c1: #fff; --c2: #fff2c4; --c3: #d6ad4a; } .m5 .face { --c1: #fff; --c2: #e6dcff; --c3: #a08ae0; } .m6 .face { --c1: #fff; --c2: #ffe4cc; --c3: #e09a5c; }
  .back { transform: rotateY(180deg); display: flex; align-items: center; justify-content: center; font-size: calc(var(--s) * .4);
    background: radial-gradient(circle at 40% 30%, #9aa8bb, #5b6b80 70%, #3d4a5c); border: 4px solid rgba(255,255,255,.7);
    box-shadow: 0 8px 0 #2a3545, 0 16px 24px rgba(0,40,60,.35), inset 0 3px 0 rgba(255,255,255,.3); }
  .back::before { content: ""; position: absolute; inset: 10%; border-radius: 50%; border: 3px dashed rgba(255,255,255,.35); }
  .card3d { animation: float 3.6s ease-in-out infinite; }
  .card3d:nth-child(2n) { animation-delay: -1.2s; } .card3d:nth-child(3n) { animation-delay: -2.4s; }
  .card3d:active .face { transform: scale(1.06); }
  .card3d.bad .inner { animation: shake .45s; }
  .card3d.ok { animation: none; }
  .card3d.ok .inner { transform: scale(1.12); }
  .card3d.ok .face { box-shadow: 0 8px 0 var(--c3), 0 16px 24px rgba(0,40,60,.35), 0 0 0 8px #ffe98a, 0 0 0 14px rgba(255,255,255,.7), 0 0 44px 12px rgba(255,233,138,.95), inset 0 3px 0 rgba(255,255,255,.8); }
  .card3d.dim { opacity: .5; filter: saturate(.4); }
  .card3d.last .face { box-shadow: 0 8px 0 var(--c3), 0 16px 24px rgba(0,40,60,.35), 0 0 0 6px rgba(255,233,138,.9), 0 0 26px 8px rgba(255,233,138,.8), inset 0 3px 0 rgba(255,255,255,.8); }
  .card3d.pop { animation: pop .4s ease-out backwards; }

  /* Pistas */
  .clues { flex: 0 0 auto; display: flex; flex-direction: column; gap: 8px; padding: 12px 12px; border-radius: 26px; min-width: 0; }
  .main.row .clues { width: var(--cw); max-width: 44%; justify-content: center; align-self: center; max-height: 100%; }
  .main.col .clues { width: 100%; flex-direction: row; flex-wrap: wrap; justify-content: center; }
  .clue { position: relative; display: flex; align-items: center; gap: 10px; min-height: 64px; padding: 6px 10px 6px 12px; border-radius: 20px; cursor: pointer;
    background: linear-gradient(180deg, #ffffff 0%, #eef2fa 100%); border: 3px solid #fff;
    box-shadow: 0 5px 0 #c9d2e6, 0 10px 16px rgba(20,40,90,.2), inset 0 2px 0 #fff; transition: transform .12s; animation: pop .4s ease-out backwards; }
  .main.col .clue { flex: 1 1 auto; max-width: 48%; }
  .clue:active { transform: scale(.97) translateY(2px); }
  .clue .ico { display: flex; align-items: center; gap: 4px; flex: 0 0 auto; }
  .clue .ci { position: relative; display: inline-flex; align-items: center; justify-content: center; width: 48px; height: 48px; border-radius: 14px; font-size: 30px; line-height: 1;
    background: linear-gradient(180deg, #fff, #e6ecf7); box-shadow: 0 3px 0 #c9d2e6, 0 5px 8px rgba(0,0,0,.15), inset 0 1px 0 #fff; }
  .clue .ci .sw { position: absolute; right: -6px; bottom: -6px; width: 22px; height: 22px; border-radius: 50%; border: 3px solid #fff; box-shadow: 0 2px 4px rgba(0,0,0,.35); }
  .clue .ci .no { position: absolute; inset: -4px; border-radius: 50%; border: 4px solid #e8322a; pointer-events: none; opacity: .9; }
  .clue .ci .no::after { content: ""; position: absolute; left: 50%; top: -2px; bottom: -2px; width: 4px; margin-left: -2px; background: #e8322a; transform: rotate(45deg); border-radius: 2px; }
  .clue .or { font-size: 18px; font-weight: 900; color: #7f5af0; padding: 0 2px; }
  .clue .txt { flex: 1 1 auto; font-size: 20px; font-weight: 900; color: #1f2f6b; line-height: 1.1; text-shadow: 0 1px 0 #fff; }
  .clue .txt b { color: #e8322a; }
  .clue .spk { flex: 0 0 auto; font-size: 22px; filter: drop-shadow(0 2px 2px rgba(0,0,0,.25)); }
  .clue.pulse { animation: cluepulse 1.4s ease-in-out; }
  @keyframes cluepulse { 0%,100% { transform: scale(1); } 20%,60% { transform: scale(1.06); background: linear-gradient(180deg, #ffe3e3, #ffb3b3); box-shadow: 0 5px 0 #b33, 0 10px 16px rgba(20,40,90,.2), 0 0 0 5px rgba(255,80,80,.5); } 40%,80% { transform: scale(1.02); } }
  .clues .more { align-self: center; font-size: 22px; min-height: 64px; padding: 6px 18px; }
  .clues .more.off { opacity: .4; pointer-events: none; filter: saturate(.3); }
  .clues .ttl { font-size: 18px; font-weight: 900; color: #0d6e66; text-align: center; text-shadow: 0 1px 0 #fff; width: 100%; }

  .spark { position: absolute; width: 14px; height: 14px; border-radius: 50%; pointer-events: none; z-index: 30; margin: -7px 0 0 -7px;
           box-shadow: 0 0 10px rgba(255,255,255,.9); animation: sparkfly .8s ease-out forwards; }
  .spark.star { border-radius: 0; clip-path: polygon(50% 0%, 61% 35%, 98% 35%, 68% 57%, 79% 91%, 50% 70%, 21% 91%, 32% 57%, 2% 35%, 39% 35%); width: 20px; height: 20px; margin: -10px 0 0 -10px; box-shadow: none; }
  @keyframes sparkfly { 0% { transform: translate(0,0) scale(.6) rotate(0deg); opacity: 1; } 60% { opacity: 1; } 100% { transform: translate(var(--dx), var(--dy)) scale(0) rotate(200deg); opacity: 0; } }
  @media (max-width: 800px) { .hud { gap: 6px; padding: 6px 8px; } .hud .q { font-size: 22px; } .clue .txt { font-size: 17px; } .clue .ci { width: 42px; height: 42px; font-size: 26px; } }
</style>
</head>
<body>
<script src="../common.js"></script>
<script>
var game = KidsGame.init({ title: '¿Quién es?' });
(function () {
  var CFG = {
    1: { n: 4,  clues: 2, modes: ['pos', 'pos'] },
    2: { n: 6,  clues: 3, modes: ['pos', 'pos', 'pos'] },
    3: { n: 9,  clues: 4, modes: ['pos', 'pos', 'neg', 'pos'] },
    4: { n: 12, clues: 5, modes: ['pos', 'or', 'pos', 'neg', 'pos'], oneByOne: true, flip: true }
  };
  var LABELS = { 1: '4 caras · 2 pistas', 2: '6 caras · 3 pistas', 3: '9 caras · pista NO', 4: '12 caras · tachar' };
  var ROUNDS = 6;
  var HAIR = { amarillo: '#ffd93d', cafe: '#8b5a2b', rojo: '#e8552a', negro: '#2b2b3b' };
  var EYES = { azul: '#2f95e8', verde: '#2cb67d', cafe: '#8b5a2b' };
  var SHIRT = { rojo: '#ff4d4d', azul: '#2f95e8', verde: '#2fc56d', amarillo: '#ffc800', morado: '#8a5cf6' };
  var SKIN = ['#ffd9b3', '#e8b48c', '#a86f45'];
  var KINDS = ['nino', 'nino', 'gato', 'oso'];
  var HATS = ['none', 'none', 'gorra', 'sombrero', 'corona'];
  var T = {
    hair: { amarillo: 'pelo amarillo', cafe: 'pelo café', rojo: 'pelo rojo', negro: 'pelo negro' },
    eyes: { azul: 'ojos azules', verde: 'ojos verdes', cafe: 'ojos cafés' },
    shirt: { rojo: 'camisa roja', azul: 'camisa azul', verde: 'camisa verde', amarillo: 'camisa amarilla', morado: 'camisa morada' },
    hat: { gorra: 'gorra', sombrero: 'sombrero', corona: 'corona', none: 'nada en la cabeza' },
    kind: { nino: 'una persona', gato: 'un gato', oso: 'un oso' },
    mood: { feliz: 'feliz', serio: 'serio' }
  };
  var ICO = { hair: '💇', eyes: '👁️', shirt: '👕', gorra: '🧢', sombrero: '🎩', corona: '👑', none: '🎩', glasses: '👓', nino: '🧒', gato: '🐱', oso: '🐻', feliz: '😀', serio: '😐' };

  // ---------- Personajes ----------
  function randomChar() {
    return { kind: KidsGame.pick(KINDS), hair: KidsGame.pick(Object.keys(HAIR)), hat: KidsGame.pick(HATS), glasses: KidsGame.rand(3) === 0,
      eyes: KidsGame.pick(Object.keys(EYES)), shirt: KidsGame.pick(Object.keys(SHIRT)), mood: KidsGame.rand(3) === 0 ? 'serio' : 'feliz', skin: KidsGame.pick(SKIN) };
  }
  function sig(c) { return [c.kind, c.hair, c.hat, c.glasses, c.eyes, c.shirt, c.mood].join('|'); }
  function svgChar(c, id) {
    var fur = c.kind === 'nino' ? c.skin : HAIR[c.hair];
    var s = '<svg viewBox="0 0 100 100"><defs>' +
      '<radialGradient id="h' + id + '" cx="40%" cy="30%" r="75%"><stop offset="0" stop-color="#fff" stop-opacity=".55"/><stop offset=".5" stop-color="#fff" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".18"/></radialGradient>' +
      '<filter id="s' + id + '" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="3" stdDeviation="2" flood-color="#000" flood-opacity=".3"/></filter></defs>';
    // camisa
    s += '<g filter="url(#s' + id + ')"><path d="M18 100 L18 86 Q50 62 82 86 L82 100 Z" fill="' + SHIRT[c.shirt] + '"/><path d="M18 100 L18 86 Q50 62 82 86 L82 100 Z" fill="url(#h' + id + ')"/>';
    s += '<path d="M42 72 L50 82 L58 72" fill="none" stroke="#fff" stroke-width="3" stroke-linejoin="round" opacity=".7"/></g>';
    // orejas de animales (detrás de la cabeza)
    if (c.kind === 'gato') s += '<path d="M28 40 L24 14 L44 30 Z" fill="' + fur + '"/><path d="M72 40 L76 14 L56 30 Z" fill="' + fur + '"/><path d="M31 35 L29 21 L40 30 Z" fill="#ffb6c1"/><path d="M69 35 L71 21 L60 30 Z" fill="#ffb6c1"/>';
    if (c.kind === 'oso') s += '<circle cx="28" cy="26" r="10" fill="' + fur + '"/><circle cx="72" cy="26" r="10" fill="' + fur + '"/><circle cx="28" cy="26" r="5" fill="#ffd9b3" opacity=".8"/><circle cx="72" cy="26" r="5" fill="#ffd9b3" opacity=".8"/>';
    // cabeza
    s += '<g filter="url(#s' + id + ')"><circle cx="50" cy="48" r="25" fill="' + fur + '"/><circle cx="50" cy="48" r="25" fill="url(#h' + id + ')"/></g>';
    // pelo (persona)
    if (c.kind === 'nino') s += '<path d="M25 48 A25 25 0 0 1 75 48 L75 42 Q50 20 25 42 Z" fill="' + HAIR[c.hair] + '"/><rect x="25" y="40" width="6" height="18" rx="3" fill="' + HAIR[c.hair] + '"/><rect x="69" y="40" width="6" height="18" rx="3" fill="' + HAIR[c.hair] + '"/>' +
      '<path d="M30 34 Q50 24 70 34" fill="none" stroke="#fff" stroke-width="2" opacity=".35" stroke-linecap="round"/>';
    // hocico animales
    if (c.kind === 'gato') s += '<ellipse cx="50" cy="59" rx="10" ry="7" fill="#fff" opacity=".85"/><path d="M47 56 L53 56 L50 60 Z" fill="#ff8aa8"/><path d="M34 58 L44 60 M34 63 L44 62 M66 58 L56 60 M66 63 L56 62" stroke="#444" stroke-width="1.3" stroke-linecap="round"/>';
    if (c.kind === 'oso') s += '<ellipse cx="50" cy="60" rx="11" ry="8" fill="#ffd9b3" opacity=".9"/><ellipse cx="50" cy="57" rx="4" ry="3" fill="#2b2b3b"/>';
    // ojos
    [41, 59].forEach(function (x) {
      s += '<ellipse cx="' + x + '" cy="47" rx="5.5" ry="5.5" fill="#fff"/><circle cx="' + x + '" cy="47.5" r="3.4" fill="' + EYES[c.eyes] + '"/><circle cx="' + x + '" cy="47.5" r="1.6" fill="#111"/><circle cx="' + (x - 1.3) + '" cy="46" r="1.1" fill="#fff"/>';
    });
    // boca
    if (c.kind === 'gato') s += '<path d="M46 62 Q48 65 50 62 Q52 65 54 62" fill="none" stroke="#444" stroke-width="1.6" stroke-linecap="round"/>';
    else if (c.mood === 'feliz') s += '<path d="M41 59 Q50 69 59 59" fill="#c0392b" stroke="#8e2b22" stroke-width="1.5" stroke-linejoin="round"/><path d="M44 61 Q50 64 56 61 Z" fill="#fff"/>';
    else s += '<path d="M43 62 L57 62" fill="none" stroke="#8e2b22" stroke-width="2.5" stroke-linecap="round"/>';
    if (c.kind === 'gato' && c.mood === 'serio') s += '<path d="M36 41 L44 43 M64 41 L56 43" stroke="#444" stroke-width="2" stroke-linecap="round"/>';
    if (c.kind === 'oso' && c.mood === 'serio') s += '<path d="M36 40 L45 42 M64 40 L55 42" stroke="#2b2b3b" stroke-width="2" stroke-linecap="round"/>';
    if (c.kind === 'nino' && c.mood === 'serio') s += '<path d="M35 39 L46 40 M65 39 L54 40" stroke="#5a3a1a" stroke-width="2" stroke-linecap="round"/>';
    // lentes
    if (c.glasses) s += '<g fill="none" stroke="#1f2f6b" stroke-width="2.4"><circle cx="41" cy="47" r="8"/><circle cx="59" cy="47" r="8"/><path d="M49 47 L51 47 M33 46 L26 43 M67 46 L74 43"/></g><circle cx="41" cy="47" r="8" fill="#9bd7ff" opacity=".25"/><circle cx="59" cy="47" r="8" fill="#9bd7ff" opacity=".25"/>';
    // sombreros
    if (c.hat === 'gorra') s += '<g filter="url(#s' + id + ')"><path d="M26 38 A24 22 0 0 1 74 38 Z" fill="#e8322a"/><path d="M26 38 A24 22 0 0 1 74 38 Z" fill="url(#h' + id + ')"/><path d="M50 36 L84 36 Q86 43 80 43 L50 43 Z" fill="#b71c1c"/><circle cx="50" cy="17" r="3" fill="#b71c1c"/></g>';
    if (c.hat === 'sombrero') s += '<g filter="url(#s' + id + ')"><rect x="22" y="31" width="56" height="7" rx="3" fill="#2b2b3b"/><rect x="32" y="8" width="36" height="26" rx="3" fill="#3d3d55"/><rect x="32" y="8" width="36" height="26" rx="3" fill="url(#h' + id + ')"/><rect x="32" y="26" width="36" height="6" fill="#8a5cf6"/></g>';
    if (c.hat === 'corona') s += '<g filter="url(#s' + id + ')"><path d="M29 37 L29 17 L39 27 L50 11 L61 27 L71 17 L71 37 Z" fill="#ffc800" stroke="#c47f00" stroke-width="1.5" stroke-linejoin="round"/><path d="M29 37 L29 17 L39 27 L50 11 L61 27 L71 17 L71 37 Z" fill="url(#h' + id + ')"/><circle cx="39" cy="31" r="2.5" fill="#e8322a"/><circle cx="50" cy="29" r="2.5" fill="#2f95e8"/><circle cx="61" cy="31" r="2.5" fill="#2cb67d"/></g>';
    return s + '</svg>';
  }

  // ---------- Pistas ----------
  function atomSat(c, k, v) {
    if (k === 'glasses') return c.glasses === v;
    return c[k] === v;
  }
  function sat(c, clue) {
    if (clue.or) return atomSat(c, clue.or[0].k, clue.or[0].v) || atomSat(c, clue.or[1].k, clue.or[1].v);
    var r = atomSat(c, clue.k, clue.v);
    return clue.neg ? !r : r;
  }
  function atomText(k, v) {
    if (k === 'glasses') return v ? 'tiene lentes' : 'no tiene lentes';
    if (k === 'kind') return 'es ' + T.kind[v];
    if (k === 'mood') return 'está ' + T.mood[v];
    if (k === 'hat' && v === 'none') return 'no lleva nada en la cabeza';
    return 'tiene ' + T[k][v];
  }
  function clueText(clue) {
    var t;
    if (clue.or) t = atomText(clue.or[0].k, clue.or[0].v) + ' o ' + atomText(clue.or[1].k, clue.or[1].v);
    else if (clue.neg) t = 'NO ' + atomText(clue.k, clue.v);
    else t = atomText(clue.k, clue.v);
    return t.charAt(0).toUpperCase() + t.slice(1);
  }
  function atomIcon(k, v, neg) {
    var e, sw = '';
    if (k === 'hair') { e = ICO.hair; sw = HAIR[v]; }
    else if (k === 'eyes') { e = ICO.eyes; sw = EYES[v]; }
    else if (k === 'shirt') { e = ICO.shirt; sw = SHIRT[v]; }
    else if (k === 'hat') { e = ICO[v]; if (v === 'none') neg = true; if (v === 'gorra') sw = '#e8322a'; }
    else if (k === 'glasses') { e = ICO.glasses; if (!v) neg = true; }
    else e = ICO[v];
    return '<span class="ci"><span class="emoji">' + e + '</span>' + (sw ? '<span class="sw" style="background:' + sw + '"></span>' : '') + (neg ? '<span class="no"></span>' : '') + '</span>';
  }
  function clueIcon(clue) {
    if (clue.or) return atomIcon(clue.or[0].k, clue.or[0].v, false) + '<span class="or">o</span>' + atomIcon(clue.or[1].k, clue.or[1].v, false);
    return atomIcon(clue.k, clue.v, !!clue.neg);
  }
  function posAtoms(t) {
    return [{ k: 'kind', v: t.kind }, { k: 'hair', v: t.hair }, { k: 'hat', v: t.hat }, { k: 'glasses', v: t.glasses }, { k: 'eyes', v: t.eyes }, { k: 'shirt', v: t.shirt }, { k: 'mood', v: t.mood }];
  }
  function negAtoms(t) {
    var out = [];
    Object.keys(HAIR).forEach(function (v) { if (v !== t.hair) out.push({ k: 'hair', v: v }); });
    Object.keys(EYES).forEach(function (v) { if (v !== t.eyes) out.push({ k: 'eyes', v: v }); });
    Object.keys(SHIRT).forEach(function (v) { if (v !== t.shirt) out.push({ k: 'shirt', v: v }); });
    ['gorra', 'sombrero', 'corona'].forEach(function (v) { if (v !== t.hat) out.push({ k: 'hat', v: v }); });
    ['nino', 'gato', 'oso'].forEach(function (v) { if (v !== t.kind) out.push({ k: 'kind', v: v }); });
    if (t.glasses === false) out.push({ k: 'glasses', v: true });
    return out;
  }
  function allAtoms() {
    var out = [];
    Object.keys(HAIR).forEach(function (v) { out.push({ k: 'hair', v: v }); });
    Object.keys(EYES).forEach(function (v) { out.push({ k: 'eyes', v: v }); });
    Object.keys(SHIRT).forEach(function (v) { out.push({ k: 'shirt', v: v }); });
    ['gorra', 'sombrero', 'corona'].forEach(function (v) { out.push({ k: 'hat', v: v }); });
    ['nino', 'gato', 'oso'].forEach(function (v) { out.push({ k: 'kind', v: v }); });
    out.push({ k: 'glasses', v: true }); out.push({ k: 'mood', v: 'feliz' }); out.push({ k: 'mood', v: 'serio' });
    return out;
  }
  function genRound(lv) {
    var cfg = CFG[lv];
    for (var attempt = 0; attempt < 400; attempt++) {
      var chars = [], seen = {};
      while (chars.length < cfg.n) { var c = randomChar(); if (seen[sig(c)]) continue; seen[sig(c)] = 1; chars.push(c); }
      var target = KidsGame.rand(cfg.n), t = chars[target];
      var modes = KidsGame.shuffle(cfg.modes), remaining = chars.slice(), clues = [], usedKeys = {}, okAll = true;
      for (var i = 0; i < modes.length; i++) {
        var left = modes.length - 1 - i, cands = [];
        if (modes[i] === 'pos') posAtoms(t).forEach(function (a) { if (!usedKeys[a.k]) cands.push({ k: a.k, v: a.v }); });
        else if (modes[i] === 'neg') negAtoms(t).forEach(function (a) { if (!usedKeys[a.k]) cands.push({ k: a.k, v: a.v, neg: true }); });
        else {
          var mine = posAtoms(t).filter(function (a) { return !usedKeys[a.k] && !(a.k === 'hat' && a.v === 'none') && !(a.k === 'glasses' && !a.v); });
          var others = allAtoms();
          mine.forEach(function (a) { others.forEach(function (b) { if (b.k !== a.k && !usedKeys[b.k]) cands.push({ or: KidsGame.rand(2) ? [a, b] : [b, a] }); }); });
        }
        var good = cands.filter(function (cl) {
          var rem = remaining.filter(function (ch) { return sat(ch, cl); });
          if (rem.length >= remaining.length) return false;          // debe eliminar a alguien
          if (left === 0) return rem.length === 1;                     // la última deja exactamente uno
          return rem.length >= left + 1 && rem.length <= Math.max(2, remaining.length - 1);
        });
        if (!good.length) { okAll = false; break; }
        var pickd = KidsGame.pick(good);
        clues.push(pickd);
        if (pickd.or) { usedKeys[pickd.or[0].k] = 1; usedKeys[pickd.or[1].k] = 1; } else usedKeys[pickd.k] = 1;
        remaining = remaining.filter(function (ch) { return sat(ch, pickd); });
      }
      if (!okAll || remaining.length !== 1) continue;
      return { chars: chars, target: target, clues: clues };
    }
    return null;
  }

  // ---------- Estado / UI ----------
  var nivel = 0, cfg = null, running = false, lock = false, round = 0, wrongs = 0, cur = null, shown = 0, session = 0;
  var hud, dots, main, boardwrap, grid, clues, moreBtn, cardEls = [], clueEls = [];

  function build() {
    game.innerHTML = '';
    hud = document.createElement('div'); hud.className = 'hud panel';
    hud.appendChild(KidsGame.levelBadge(nivel));
    dots = document.createElement('div'); dots.className = 'dots';
    for (var i = 0; i < ROUNDS; i++) dots.appendChild(document.createElement('span'));
    hud.appendChild(dots);
    var q = document.createElement('span'); q.className = 'q'; q.textContent = '🔍 ¿Quién es?'; hud.appendChild(q);
    var sp = document.createElement('button'); sp.className = 'btn round blue'; sp.textContent = '🔊';
    sp.addEventListener('pointerdown', function (ev) { ev.preventDefault(); KidsGame.sound.tap(); explain(); });
    hud.appendChild(sp);
    var lb = document.createElement('button'); lb.className = 'btn round yellow'; lb.textContent = '🎚️'; lb.setAttribute('aria-label', 'Nivel');
    lb.addEventListener('pointerdown', function (ev) { ev.preventDefault(); KidsGame.sound.tap(); showPicker(); });
    hud.appendChild(lb);
    game.appendChild(hud);
    main = document.createElement('div'); main.className = 'main row';
    boardwrap = document.createElement('div'); boardwrap.className = 'boardwrap';
    grid = document.createElement('div'); grid.className = 'grid'; boardwrap.appendChild(grid);
    clues = document.createElement('div'); clues.className = 'clues panel';
    main.appendChild(boardwrap); main.appendChild(clues);
    game.appendChild(main);
  }
  function explain() {
    var t = 'Busca al personaje que cumple todas las pistas. Toca una pista para escucharla.';
    if (cfg.flip) t = 'Toca a los que no pueden ser para voltearlos. Al final quedará uno.';
    KidsGame.say(t);
  }
  function showPicker() {
    running = false; lock = true;
    if (grid) { grid.innerHTML = ''; clues.innerHTML = ''; }
    KidsGame.levelPicker({ key: 'quien', labels: LABELS, onPick: function (lv) { start(lv); } });
  }
  function start(lv) {
    nivel = lv; cfg = CFG[lv]; running = true; round = 0; wrongs = 0; session++;
    build(); newRound();
    setTimeout(explain, 600);
  }
  function newRound() {
    if (!running) return;
    cur = genRound(nivel); lock = false; shown = cfg.oneByOne ? 1 : cur.clues.length;
    renderCards(); renderClues(); layout();
    var txt = '¿Quién es? ' + cur.clues.slice(0, shown).map(clueText).join('. ') + '.';
    setTimeout(function () { KidsGame.say(txt); }, 300);
  }
  function renderCards() {
    grid.innerHTML = ''; cardEls = [];
    cur.chars.forEach(function (c, i) {
      var el = document.createElement('div'); el.className = 'card3d pop m' + (1 + (i % 6)); el.style.animationDelay = (i * 60) + 'ms';
      el.innerHTML = '<div class="inner"><div class="face">' + svgChar(c, i) + '</div><div class="back"><span class="emoji">❌</span></div></div>';
      el.addEventListener('pointerdown', function (ev) { ev.preventDefault(); tapCard(i, el); });
      el.addEventListener('animationend', function () { el.classList.remove('pop'); });
      grid.appendChild(el); cardEls.push(el);
    });
  }
  function renderClues() {
    clues.innerHTML = ''; clueEls = [];
    var ttl = document.createElement('div'); ttl.className = 'ttl'; ttl.textContent = '🔎 Pistas'; clues.appendChild(ttl);
    cur.clues.slice(0, shown).forEach(function (cl, i) {
      var el = document.createElement('div'); el.className = 'clue'; el.style.animationDelay = (i * 90) + 'ms';
      var txt = clueText(cl);
      el.innerHTML = '<span class="ico">' + clueIcon(cl) + '</span><span class="txt">' + txt.replace(/^NO /, '<b>NO</b> ') + '</span><span class="spk emoji">🔊</span>';
      el.addEventListener('pointerdown', function (ev) { ev.preventDefault(); KidsGame.sound.tap(); el.classList.remove('pop'); KidsGame.say(txt); });
      clues.appendChild(el); clueEls.push(el);
    });
    if (cfg.oneByOne) {
      moreBtn = document.createElement('button'); moreBtn.className = 'btn purple more' + (shown >= cur.clues.length ? ' off' : '');
      moreBtn.textContent = shown >= cur.clues.length ? '✔ Todas' : '➕ Otra pista';
      moreBtn.addEventListener('pointerdown', function (ev) { ev.preventDefault(); if (lock || shown >= cur.clues.length) return; KidsGame.sound.pop(); shown++; renderClues(); layout(); KidsGame.say(clueText(cur.clues[shown - 1])); });
      clues.appendChild(moreBtn);
    } else moreBtn = null;
  }
  function layout() {
    if (!cur || !main) return;
    var W = main.clientWidth, H = main.clientHeight, landscape = W > H * 1.1;
    main.className = 'main ' + (landscape ? 'row' : 'col');
    var n = cur.chars.length, cols = n <= 4 ? 2 : (n <= 6 ? 3 : (n <= 9 ? 3 : 4)), rows = Math.ceil(n / cols);
    if (landscape && n === 4) { cols = 2; rows = 2; }
    if (!landscape && n === 6) { cols = 3; rows = 2; }
    if (!landscape && n === 12) { cols = 4; rows = 3; }
    if (landscape) { clues.style.setProperty('--cw', Math.min(400, W * 0.42) + 'px'); void clues.offsetWidth; }
    var bw = boardwrap.clientWidth - 8, bh = boardwrap.clientHeight - 8, gap = 14;
    var s = Math.floor(Math.min((bw - (cols - 1) * gap) / cols, (bh - (rows - 1) * gap) / rows, 220));
    s = Math.max(72, s);
    grid.style.gridTemplateColumns = 'repeat(' + cols + ', ' + s + 'px)';
    grid.style.setProperty('--s', s + 'px'); grid.style.setProperty('--gap', gap + 'px');
  }
  function faceUp() { return cardEls.filter(function (el) { return !el.classList.contains('down'); }); }
  function tapCard(i, el) {
    if (lock || !running) return;
    if (cfg.flip) {
      var up = faceUp();
      if (el.classList.contains('down')) { el.classList.remove('down'); KidsGame.sound.pop(); markLast(); return; }
      if (up.length > 1) { el.classList.add('down'); KidsGame.sound.pop(); markLast(); return; }
      // es la única boca arriba: responder
    }
    answer(i, el);
  }
  function markLast() {
    var up = faceUp();
    cardEls.forEach(function (el) { el.classList.toggle('last', up.length === 1 && el === up[0]); });
    if (up.length === 1) KidsGame.say('¿Es este? Tócalo.');
  }
  function answer(i, el) {
    if (i === cur.target) {
      lock = true;
      KidsGame.sound.ok(); KidsGame.addStar(1); KidsGame.vibrate(40);
      el.classList.add('ok');
      cardEls.forEach(function (o) { if (o !== el) o.classList.add('dim'); });
      var g = game.getBoundingClientRect(), r = el.getBoundingClientRect();
      sparkle(r.left + r.width / 2 - g.left, r.top + r.height / 2 - g.top, 26);
      dots.children[round].classList.add('on'); round++;
      KidsGame.say(KidsGame.pick(['¡Sí! ¡Es ese!', '¡Lo encontraste!', '¡Muy bien!']));
      var ss = session;
      setTimeout(function () { if (ss !== session) return; if (round >= ROUNDS) finish(); else newRound(); }, 1700);
    } else {
      wrongs++;
      KidsGame.sound.wrong(); KidsGame.vibrate(30);
      el.classList.remove('bad'); void el.offsetWidth; el.classList.add('bad');
      // la pista que lo excluye
      var c = cur.chars[i], idx = -1;
      for (var k = 0; k < shown; k++) if (!sat(c, cur.clues[k])) { idx = k; break; }
      if (idx >= 0) {
        var ce = clueEls[idx]; ce.classList.remove('pulse', 'pop'); void ce.offsetWidth; ce.classList.add('pulse');
        KidsGame.say('No. Mira la pista: ' + clueText(cur.clues[idx]) + '.');
      } else {
        KidsGame.say('Pide otra pista.');
        if (moreBtn) { moreBtn.classList.remove('pop'); void moreBtn.offsetWidth; moreBtn.classList.add('pop'); }
      }
      if (cfg.flip && faceUp().length > 1) { /* en experto, se puede voltear */ }
    }
  }
  function sparkle(x, y, k) {
    var colors = ['#ffd93d', '#ff6f61', '#fff', '#3da9fc', '#2cb67d', '#f582ae'];
    for (var i = 0; i < (k || 18); i++) {
      var s = document.createElement('div');
      s.className = 'spark' + (i % 3 === 0 ? ' star' : '');
      var a = Math.random() * Math.PI * 2, dd = 50 + Math.random() * 110;
      s.style.left = x + 'px'; s.style.top = y + 'px';
      s.style.setProperty('--dx', Math.cos(a) * dd + 'px'); s.style.setProperty('--dy', (Math.sin(a) * dd - 30) + 'px');
      s.style.background = KidsGame.pick(colors);
      s.style.animationDuration = (.6 + Math.random() * .5) + 's';
      game.appendChild(s);
      (function (el) { setTimeout(function () { el.remove(); }, 1200); })(s);
    }
  }
  function finish() {
    running = false;
    var stars = wrongs <= 1 ? 3 : (wrongs <= 4 ? 2 : 1), lv = nivel;
    KidsGame.levelDone(lv);
    KidsGame.celebrate({
      sub: '¡' + ROUNDS + ' personajes encontrados!', stars: stars,
      onNext: function () { start(Math.min(4, lv + 1)); },
      onAgain: function () { start(lv); }
    });
  }

  // ganchos para pruebas automáticas
  window.__quien = { get: function () { return { cur: cur, nivel: nivel, round: round, shown: shown, wrongs: wrongs }; }, cards: function () { return cardEls; }, clues: function () { return clueEls; }, sat: sat, gen: genRound, text: clueText };

  window.addEventListener('resize', layout);
  showPicker();
})();
</script>
