<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<link rel="stylesheet" href="../common.css">
<title>Formas y colores</title>
<style>
  /* ===== La fábrica de formas: pared metálica con tubos, engranes que giran, banda transportadora y el robot Tuerca ===== */
  .game { background:
      radial-gradient(circle at 50% 50%, rgba(255,255,255,.07) 0 2px, rgba(0,0,0,0) 3px) 0 0 / 28px 28px,
      linear-gradient(180deg, #eaf0f8 0%, #cfd9e8 55%, #a8b4c8 100%); }
  .game::before { content: ""; position: absolute; inset: 0; pointer-events: none; z-index: 0;
    background:
      linear-gradient(180deg, #8d9ab2, #5a667c 60%, #424c5e) 0 84px / 100% 14px no-repeat,
      linear-gradient(90deg, #8d9ab2, #5a667c 60%, #424c5e) 30px 0 / 14px 100% no-repeat,
      linear-gradient(90deg, #8d9ab2, #5a667c 60%, #424c5e) calc(100% - 44px) 0 / 14px 100% no-repeat,
      radial-gradient(circle at 50% 50%, #ffd166 0 6px, #c47f00 7px, rgba(0,0,0,0) 8px) 24px 78px / 26px 26px no-repeat,
      radial-gradient(circle at 50% 50%, #ffd166 0 6px, #c47f00 7px, rgba(0,0,0,0) 8px) calc(100% - 50px) 78px / 26px 26px no-repeat; }
  .bgdeco { position: absolute; inset: 0; pointer-events: none; z-index: 0; overflow: hidden; }
  .bgdeco .gear { position: absolute; animation: spin 9s linear infinite; opacity: .9; }
  .bgdeco .gear.g1 { left: -26px; top: 116px; width: 92px; height: 92px; }
  .bgdeco .gear.g2 { right: -20px; top: 150px; width: 70px; height: 70px; animation-direction: reverse; animation-duration: 7s; }
  .bgdeco .gear.g3 { left: 50px; bottom: -30px; width: 110px; height: 110px; animation-duration: 12s; opacity: .55; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .screen { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; padding: 8px; gap: 8px; z-index: 1; }
  .screen { transition: transform .3s cubic-bezier(.3,1.3,.5,1), opacity .28s; }
  .screen.out { transform: translateX(-8%) scale(.94); opacity: 0; pointer-events: none; }
  .screen.in { transform: translateX(8%) scale(.94); opacity: 0; transition: none; }
  .hud { position: absolute; top: 8px; left: 8px; z-index: 3; display: flex; align-items: center; gap: 8px; }
  .hud .btn { font-size: 28px; }
  .tools { position: absolute; top: 8px; right: 8px; z-index: 3; display: flex; gap: 8px; }
  .tools .btn { font-size: 30px; }
  .menu { justify-content: center; gap: 18px; }
  .menu .robotwrap { display: flex; align-items: center; gap: 14px; }
  .menu .robotwrap .robot { width: min(28vw, 150px); height: min(28vw, 150px); }
  .menu .robotwrap .bub { padding: 10px 18px; border-radius: 20px; background: #fff; font-size: min(5vw, 26px); font-weight: 900; color: #1f2f6b; box-shadow: 0 5px 0 #c9d2e6, 0 10px 16px rgba(20,40,90,.2); position: relative; }
  .menu .robotwrap .bub::before { content: ""; position: absolute; left: -10px; top: 50%; margin-top: -8px; border: 8px solid transparent; border-right-color: #fff; border-left: 0; }
  .menu > .btn { width: min(88vw, 460px); min-height: 92px; font-size: min(7vw, 34px); gap: 16px; animation: float 3.4s ease-in-out infinite; }
  .menu > .btn:nth-child(3) { animation-delay: -1.2s; } .menu > .btn:nth-child(4) { animation-delay: -2.3s; }
  .menu > .btn .emoji { font-size: 1.5em; }
  /* Robot Tuerca: ojitos que parpadean, antena que late */
  .robot { filter: drop-shadow(0 6px 6px rgba(0,0,0,.3)); cursor: pointer; }
  .robot .rb-eyes { animation: rbblink 3.9s infinite; transform-origin: 60px 44px; }
  @keyframes rbblink { 0%, 92%, 100% { transform: scaleY(1); } 95% { transform: scaleY(.1); } }
  .robot .rb-ant { transform-origin: 60px 10px; animation: rbant 1.6s ease-in-out infinite; }
  @keyframes rbant { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.35); } }
  .robot .rb-arm { transform-origin: 96px 66px; animation: rbarm 2.8s ease-in-out infinite; }
  @keyframes rbarm { 0%, 100% { transform: rotate(0); } 50% { transform: rotate(-14deg); } }
  .robot.cheer { animation: rbcheer .5s ease-out; }
  @keyframes rbcheer { 0%, 100% { transform: translateY(0); } 40% { transform: translateY(-16px) scale(1.06); } 70% { transform: translateY(0) scale(.96, 1.04); } }
  /* Encuentra la forma / el color */
  .find { justify-content: center; }
  .target { display: flex; flex-direction: column; align-items: center; gap: 10px; }
  .target .trow { display: flex; align-items: center; justify-content: center; gap: 14px; }
  .target .robot { width: min(24vw, 22vh, 130px); height: min(24vw, 22vh, 130px); flex: 0 0 auto; }
  .tshape {
    position: relative; width: min(34vw, 30vh, 220px); height: min(34vw, 30vh, 220px); border-radius: 50%; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    background: radial-gradient(circle at 35% 28%, #ffffff 0%, #f4f9ff 40%, #cfe6ff 80%, #a9d3ff 100%);
    box-shadow: 0 10px 0 #7fb3e6, 0 18px 28px rgba(20,60,120,.28), 0 0 0 6px #fff, 0 0 0 10px rgba(127,179,230,.5), inset 0 4px 0 #fff, inset 0 -8px 0 rgba(60,120,200,.12);
    animation: float 3.6s ease-in-out infinite;
  }
  .tshape::before { content: ""; position: absolute; left: 12%; right: 12%; top: 6%; height: 32%; border-radius: 50%; background: linear-gradient(180deg, rgba(255,255,255,.95), rgba(255,255,255,0)); pointer-events: none; z-index: 2; }
  .tshape svg { width: 68%; height: 68%; overflow: visible; filter: drop-shadow(0 8px 6px rgba(20,40,90,.3)); }
  .tname { font-size: min(7vw, 40px); font-weight: 900; color: #fff; white-space: nowrap; text-shadow: 0 3px 0 #1f7fae, 0 6px 10px rgba(0,0,0,.3), -2px -2px 0 #1f7fae, 2px -2px 0 #1f7fae, -2px 2px 0 #1f7fae, 2px 2px 0 #1f7fae; }
  .tname .cn { display: inline-block; color: #fff; border-radius: 20px; padding: 0 16px; margin-left: 6px; text-shadow: 0 2px 0 rgba(0,0,0,.35); box-shadow: 0 4px 0 rgba(0,0,0,.25), 0 8px 12px rgba(0,0,0,.2), inset 0 2px 0 rgba(255,255,255,.5); background-image: linear-gradient(180deg, rgba(255,255,255,.35), rgba(255,255,255,0) 50%, rgba(0,0,0,.12)); }
  /* Banda transportadora donde pasan las opciones */
  .belt { position: relative; padding: 18px 26px 26px; border-radius: 22px; max-width: 100%; overflow: hidden;
    background: linear-gradient(180deg, #4b5468 0%, #363d4d 70%, #2b3142 100%); border: 3px solid #6d7a92;
    box-shadow: 0 10px 0 #1b2030, 0 18px 28px rgba(0,0,0,.35), inset 0 2px 0 rgba(255,255,255,.18), inset 0 0 0 1px rgba(0,0,0,.3); }
  .belt::before { content: ""; position: absolute; left: -96px; right: -96px; bottom: 6px; height: 12px; border-radius: 6px;
    background: repeating-linear-gradient(90deg, #ffd166 0 24px, #2b3142 24px 48px); animation: beltmove 1.1s linear infinite; }
  @keyframes beltmove { to { transform: translateX(48px); } }
  .belt::after { content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 24px; pointer-events: none;
    background: radial-gradient(circle at 14px 12px, #9aa5b8 0 7px, #4b5468 8px, rgba(0,0,0,0) 9px) 0 0 / 100% 100% no-repeat, radial-gradient(circle at calc(100% - 14px) 12px, #9aa5b8 0 7px, #4b5468 8px, rgba(0,0,0,0) 9px) 0 0 / 100% 100% no-repeat; }
  .choices { position: relative; display: flex; flex-wrap: wrap; gap: min(3vw, 22px); justify-content: center; max-width: 100%; }
  .choice { width: min(21vw, 24vh, 170px); height: min(21vw, 24vh, 170px); padding: 12px; animation: pop .35s ease-out backwards, float 3.4s ease-in-out infinite; }
  .choices.six .choice { width: min(16vw, 18vh, 140px); height: min(16vw, 18vh, 140px); padding: 10px; }
  .choice:active { animation: none; }
  .choice svg { width: 100%; height: 100%; overflow: visible; filter: drop-shadow(0 6px 4px rgba(20,40,90,.25)); }
  .choice .emoji { font-size: min(13vw, 15vh, 110px); }
  .choices.six .choice .emoji { font-size: min(10vw, 11vh, 86px); }
  .choice.ok { animation: bounce .6s; }
  /* Clasifica */
  .sort .area { position: relative; flex: 1 1 auto; width: 100%; touch-action: none; }
  .piece { position: absolute; cursor: grab; touch-action: none; filter: drop-shadow(0 6px 4px rgba(20,40,90,.28)); animation: pop .35s ease-out backwards, float 3.6s ease-in-out infinite; }
  .piece svg { width: 100%; height: 100%; overflow: visible; }
  .piece.moved { animation: float 3.6s ease-in-out infinite; }
  .piece.drag { z-index: 10; filter: drop-shadow(0 18px 12px rgba(0,0,0,.3)); animation: none; }
  .piece.gone { transition: transform .35s ease-in, opacity .35s; opacity: 0; animation: none; }
  .piece.bad { animation: shake .35s; }
  .baskets { flex: 0 0 auto; display: flex; gap: min(3vw, 20px); width: 100%; justify-content: center; align-items: flex-end; }
  .basket {
    position: relative; flex: 1 1 0; max-width: 240px; min-height: 110px; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; gap: 0;
    transition: transform .12s; padding-bottom: 4px;
  }
  .basket svg { width: 100%; height: min(17vh, 150px); overflow: visible; filter: drop-shadow(0 10px 8px rgba(60,30,0,.3)); }
  .basket .bname { display: inline-flex; align-items: center; gap: 6px; color: #fff; font-weight: 900; font-size: min(4.5vw, 22px); border-radius: 20px; padding: 3px 14px; margin-top: -6px; position: relative; z-index: 2; white-space: nowrap;
    text-shadow: 0 2px 0 rgba(0,0,0,.35); box-shadow: 0 4px 0 rgba(0,0,0,.25), 0 8px 12px rgba(0,0,0,.2), inset 0 2px 0 rgba(255,255,255,.5); background-image: linear-gradient(180deg, rgba(255,255,255,.35), rgba(255,255,255,0) 50%, rgba(0,0,0,.12)); }
  .basket .bname svg { width: 26px; height: 26px; filter: none; }
  .basket.hot { transform: scale(1.1) translateY(-6px); }
  .basket.hot svg { filter: drop-shadow(0 14px 10px rgba(60,30,0,.35)) drop-shadow(0 0 10px rgba(255,230,120,.9)); }
  .basket.got { animation: pop .35s; }
  .hint { font-size: min(5.5vw, 26px); font-weight: 900; color: #1f2f6b; border-radius: 30px; padding: 6px 20px; text-shadow: 0 1px 0 #fff; white-space: nowrap; display: inline-flex; align-items: center; gap: 10px;
    background: linear-gradient(180deg, #ffffff, #eef2fb); border: 3px solid #fff; box-shadow: 0 5px 0 #c9d2e6, 0 10px 16px rgba(20,40,90,.2), inset 0 2px 0 #fff; }
  .hint .robot { width: 44px; height: 44px; filter: none; }
  .baskets.n4 .bname { font-size: min(3.2vw, 18px); padding: 3px 10px; }
  .baskets.n4 .bname svg { width: 20px; height: 20px; }
  /* ---- Experto: cuerpos geométricos, lados y esquinas, clasificar 2x2 ---- */
  .menu > .btn.purple { --a: #b39cff; --b: #7f5af0; --d: #5232b3; }
  .menu.four > .btn { min-height: 80px; font-size: min(6vw, 30px); }
  .choice .num { font-size: min(13vw, 15vh, 96px); font-weight: 900; color: #fff; text-shadow: 0 4px 0 #1a63a8, 0 8px 12px rgba(0,0,0,.3); }
  .choice.c1 .num { text-shadow: 0 4px 0 #b8306f, 0 8px 12px rgba(0,0,0,.3); } .choice.c2 .num { text-shadow: 0 4px 0 #14784a, 0 8px 12px rgba(0,0,0,.3); } .choice.c3 .num { text-shadow: 0 4px 0 #5232b3, 0 8px 12px rgba(0,0,0,.3); }
  .tshape .mark { position: absolute; inset: 0; pointer-events: none; }
  .g2 { flex: 0 0 auto; display: grid; grid-template-columns: auto 1fr 1fr; grid-template-rows: auto 1fr 1fr; gap: 8px; width: min(96vw, 520px); align-items: stretch; justify-items: stretch; }
  .g2 .hd { display: flex; align-items: center; justify-content: center; min-width: 54px; min-height: 54px; }
  .g2 .hd svg { width: min(12vw, 64px); height: min(12vw, 64px); overflow: visible; filter: drop-shadow(0 4px 3px rgba(20,40,90,.3)); }
  .g2 .hd .blob { width: min(12vw, 64px); height: min(12vw, 64px); }
  .g2 .cell { position: relative; min-height: min(16vh, 120px); border-radius: 18px; border: 4px dashed rgba(255,255,255,.9); display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 4px; padding: 6px;
    background: var(--tint); box-shadow: inset 0 3px 8px rgba(20,40,90,.15), 0 4px 0 rgba(0,0,0,.08); transition: transform .12s, box-shadow .12s; }
  .g2 .cell svg { width: min(9vw, 46px); height: min(9vw, 46px); overflow: visible; animation: pop .35s ease-out; }
  .g2 .cell.hot { transform: scale(1.06); border-color: #ffd23f; box-shadow: inset 0 3px 8px rgba(20,40,90,.15), 0 0 0 5px rgba(255,210,63,.6), 0 0 22px rgba(255,230,120,.9); }
  .g2 .cell.got { animation: pop .35s; }
  .sort2 .area { min-height: 110px; }
  /* Banner de ronda */
  .rbanner { position: absolute; left: 50%; top: 42%; z-index: 30; transform: translate(-50%, -50%) scale(.5); opacity: 0; pointer-events: none;
    padding: 10px 36px; border-radius: 40px; font-size: clamp(26px, 4.5vw, 44px); font-weight: 900; color: #fff; white-space: nowrap;
    background: linear-gradient(180deg, #ffd166, #ff8906); text-shadow: 0 3px 0 #b85a00, 0 6px 10px rgba(0,0,0,.3);
    box-shadow: 0 8px 0 #b85a00, 0 16px 26px rgba(0,0,0,.35), inset 0 2px 0 rgba(255,255,255,.6);
    transition: transform .35s cubic-bezier(.3,1.5,.5,1), opacity .3s; }
  .rbanner.show { transform: translate(-50%, -50%) scale(1); opacity: 1; }
  @media (max-width: 900px) {
    .choices.six { max-width: 480px; }
    .sort .hint { margin-top: 66px; }
    .baskets.n3 .bname { font-size: min(3.6vw, 20px); }
    .target .robot { width: min(20vw, 18vh, 100px); height: min(20vw, 18vh, 100px); }
  }
</style>

<script src="../common.js"></script>
<script>
(function () {
  var game = KidsGame.init({ title: 'Formas y colores' });

  var SHAPES = [
    { id: 'circulo',    name: 'el círculo',    short: 'círculo',    svg: '<circle cx="50" cy="50" r="42"/>', sides: 0 },
    { id: 'cuadrado',   name: 'el cuadrado',   short: 'cuadrado',   svg: '<rect x="9" y="9" width="82" height="82" rx="8"/>', sides: 4 },
    { id: 'triangulo',  name: 'el triángulo',  short: 'triángulo',  svg: '<polygon points="50,7 94,90 6,90"/>', sides: 3 },
    { id: 'estrella',   name: 'la estrella',   short: 'estrella',   svg: '<polygon points="50,4 62,36 96,37 69,58 79,93 50,73 21,93 31,58 4,37 38,36"/>', sides: null },
    { id: 'corazon',    name: 'el corazón',    short: 'corazón',    svg: '<path d="M50 92 L14 54 C0 38 12 12 32 12 C42 12 48 19 50 26 C52 19 58 12 68 12 C88 12 100 38 86 54 Z"/>', sides: null },
    { id: 'rectangulo', name: 'el rectángulo', short: 'rectángulo', svg: '<rect x="4" y="24" width="92" height="52" rx="6"/>', sides: 4 },
    { id: 'ovalo',      name: 'el óvalo',      short: 'óvalo',      svg: '<ellipse cx="50" cy="50" rx="46" ry="28"/>', sides: 0 },
    { id: 'rombo',      name: 'el rombo',      short: 'rombo',      svg: '<polygon points="50,4 94,50 50,96 6,50"/>', sides: 4 },
    { id: 'pentagono',  name: 'el pentágono',  short: 'pentágono',  svg: '<polygon points="50,5 95,38 78,92 22,92 5,38"/>', sides: 5 },
    { id: 'hexagono',   name: 'el hexágono',   short: 'hexágono',   svg: '<polygon points="27,8 73,8 96,50 73,92 27,92 4,50"/>', sides: 6 },
    { id: 'trapecio',   name: 'el trapecio',   short: 'trapecio',   svg: '<polygon points="26,18 74,18 96,84 4,84"/>', sides: 4 },
    { id: 'semicirculo', name: 'el semicírculo', short: 'semicírculo', svg: '<path d="M4 72 A46 46 0 0 1 96 72 Z"/>', sides: null }
  ];
  var COLORS = [
    { id: 'rojo',     name: 'rojo',     hex: '#e63946', items: ['🍎','🍓','🌹','🚒','🍒','🎈'] },
    { id: 'azul',     name: 'azul',     hex: '#3da9fc', items: ['🐳','🫐','💙','🧢','🐬','🦋'] },
    { id: 'verde',    name: 'verde',    hex: '#2cb67d', items: ['🐸','🍀','🥦','🐢','🥒','🌵'] },
    { id: 'amarillo', name: 'amarillo', hex: '#ffd23f', items: ['🍌','🌻','🍋','🐥','⭐','🧀'] },
    { id: 'morado',   name: 'morado',   hex: '#7f5af0', items: ['🍇','🔮','💜','🍆','☂️','🪻'] },
    { id: 'naranja',  name: 'naranja',  hex: '#ff8906', items: ['🍊','🥕','🎃','🦊','🏀','🍑'] },
    { id: 'rosa',     name: 'rosa',     hex: '#f582ae', items: ['🌸','🎀','🩷','🐷','🦩','🧁'] },
    { id: 'cafe',     name: 'café',     hex: '#8d5524', items: ['🐻','🍫','🪵','🥔','🐴','🥜'] }
  ];
  var SOLIDS = [
    { id: 'cubo',      name: 'el cubo',      objs: ['🎲','🧊','📦','🎁'] },
    { id: 'esfera',    name: 'la esfera',    objs: ['⚽','🏀','🌍','🎱','🍊'] },
    { id: 'cono',      name: 'el cono',      objs: ['🍦','🎉','🥕'] },
    { id: 'cilindro',  name: 'el cilindro',  objs: ['🥫','🪣','🔋','🥁'] },
    { id: 'piramide',  name: 'la pirámide',  objs: ['🔺','⛺','🏔️'] }
  ];
  var ACTS_BY_LEVEL = { 1: ['shapes', 'colors', 'sort'], 2: ['shapes', 'colors', 'sort'], 3: ['shapes', 'colors', 'sort'], 4: ['solids', 'sides', 'sort2', 'shapes'] };
  var ROUNDS_BY_ACT = { shapes: 4, colors: 4, sort: 2, solids: 4, sides: 4, sort2: 2 };
  var MENU = { shapes: ['🔺', 'Formas', ''], colors: ['🎨', 'Colores', 'blue'], sort: ['🧺', 'Clasifica', 'green'], solids: ['🎲', 'Cuerpos 3D', 'purple'], sides: ['🔢', 'Lados', 'blue'], sort2: ['🧺', 'Clasifica 2×2', 'green'] };
  var LABELS = { 1: '3 opciones · 5 formas', 2: '4 opciones · 8 formas', 3: '6 opciones · 12 formas', 4: 'cuerpos 3D · lados · 2×2' };
  var HOWTO = [{ icon: '👀', text: 'Mira la forma o el color que pide el robot' }, { icon: '👆', text: 'Tócala en la banda de la fábrica' }, { icon: '🧺', text: 'En Clasifica, arrastra cada figura a su canasta' }];
  // Colores del robot Tuerca: uno por nivel completado (cosmético, guardado en localStorage)
  var ROBOTS = [['azul', '#3da9fc', 'azul'], ['rosa', '#f582ae', 'rosa'], ['verde', '#2cb67d', 'verde'], ['morado', '#7f5af0', 'morado'], ['dorado', '#ffb703', 'dorado']];
  var ACTS = ACTS_BY_LEVEL[1];

  var level = 1, act = 0, roundsInAct = 0, correctTotal = 0, nextBurst = 5, nextParty = 8, lock = false, streak = 0, handShown = {};

  function el(tag, cls, html) { var e = document.createElement(tag); if (cls) e.className = cls; if (html != null) e.innerHTML = html; return e; }
  function onTap(e, fn) { e.addEventListener('pointerdown', function (ev) { ev.preventDefault(); fn(ev); }); }
  function replay(node, cls) { node.classList.remove(cls); void node.offsetWidth; node.classList.add(cls); }
  function readJSON(k, def) { try { return JSON.parse(localStorage.getItem(k)) || def; } catch (e) { return def; } }
  function writeJSON(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
  function shade(hex, f) {
    var n = parseInt(hex.slice(1), 16), r = n >> 16, g = (n >> 8) & 255, b = n & 255;
    function m(c) { return Math.max(0, Math.min(255, Math.round(f > 0 ? c + (255 - c) * f : c * (1 + f)))); }
    return '#' + ((1 << 24) + (m(r) << 16) + (m(g) << 8) + m(b)).toString(16).slice(1);
  }
  var uid = 0;
  function unlockedRobots() { var u = readJSON('kg-formas-robots', ['azul']); if (u.indexOf('azul') < 0) u.unshift('azul'); return u; }
  function robotColor() {
    var sel = null; try { sel = localStorage.getItem('kg-formas-robot'); } catch (e) {}
    var u = unlockedRobots(); if (!sel || u.indexOf(sel) < 0) sel = u[u.length - 1];
    for (var i = 0; i < ROBOTS.length; i++) if (ROBOTS[i][0] === sel) return ROBOTS[i];
    return ROBOTS[0];
  }
  // ---- Hero art: el robot Tuerca (SVG con parpadeo, antena y brazo con sello) ----
  function robotSVG(size, hex) {
    var c = hex || robotColor()[1], L = shade(c, .45), D = shade(c, -.35), id = 'rb' + (uid++);
    return '<svg class="robot" viewBox="0 0 120 120" width="' + size + '" height="' + size + '" aria-hidden="true"><defs>' +
      '<linearGradient id="' + id + '" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="' + L + '"/><stop offset=".55" stop-color="' + c + '"/><stop offset="1" stop-color="' + D + '"/></linearGradient>' +

    var obj = KidsGame.pick(target.objs);
    top.innerHTML = '<div class="trow">' + robotSVG(130) + '<div class="tshape">' + (toObj ? solidSVG(target, cols[0].hex) : '<span class="emoji" style="font-size:min(20vw,18vh,130px)">' + obj + '</span>') + '</div></div><div class="tname">' + (toObj ? '¿Qué parece ' + target.name + '?' : '¿Qué cuerpo es?') + '</div>';
    var say = toObj ? 'Esto es ' + target.name + '. ¿Qué objeto tiene esa forma?' : '¿Qué cuerpo geométrico es? ¿Cubo, esfera, cono, cilindro o pirámide?';
    onTap(top, function () { KidsGame.sound.tap(); robotCheer(); KidsGame.say(say); });
    var belt = el('div', 'belt'), row = el('div', 'choices');
    KidsGame.shuffle(SOLIDS).forEach(function (sol, i) {
      var c = el('div', 'card choice'); c.dataset.id = sol.id; c.style.animationDelay = (i * 80) + 'ms, ' + (-i * 0.9) + 's';
      c.innerHTML = toObj ? '<span class="emoji">' + (sol === target ? obj : KidsGame.pick(sol.objs)) + '</span>' : solidSVG(sol, cols[(i + 1) % cols.length].hex);
      onTap(c, function () { if (sol === target && !lock) KidsGame.say('¡Sí! ' + (toObj ? obj + ' es como ' : '') + target.name); answer(c, sol === target, solidsRound); });
      row.appendChild(c);
    });
    belt.appendChild(row);
    s.appendChild(top); s.appendChild(belt);
    finishScreen(s);
    KidsGame.say(say);
  }

  /* ---------- (e) ¿Cuántos lados / esquinas tiene? (Experto) ---------- */
  function sidesRound() {
    var s = buildScreen('find sides');
    var k = KidsGame.pick([3, 4, 5, 6]);
    var target = KidsGame.pick(SHAPES.filter(function (x) { return x.sides === k; })), corners = roundsInAct % 2 === 1;
    var col = KidsGame.pick(COLORS);
    s.dataset.target = String(target.sides);
    var top = el('div', 'target');
    top.innerHTML = '<div class="trow">' + robotSVG(130) + '<div class="tshape">' + shapeSVG(target, col.hex) + '</div></div><div class="tname">¿Cuántos ' + (corners ? 'picos' : 'lados') + ' tiene?</div>';
    var say = '¿Cuántos ' + (corners ? 'picos, o esquinas,' : 'lados') + ' tiene ' + target.name + '? Cuéntalos con el dedo';
    onTap(top, function () { KidsGame.sound.tap(); robotCheer(); KidsGame.say(say); });
    var belt = el('div', 'belt'), row = el('div', 'choices');
    var opts = KidsGame.shuffle([3, 4, 5, 6]);
    opts.forEach(function (n, i) {
      var c = el('div', 'card choice c' + (i % 4)); c.dataset.id = n; c.style.animationDelay = (i * 80) + 'ms, ' + (-i * 0.9) + 's';
      c.innerHTML = '<span class="num" style="color:' + ['#f0569a', '#2f95e8', '#24b36c', '#7f5af0'][i % 4] + '">' + n + '</span>';
      onTap(c, function () { if (n === target.sides && !lock) KidsGame.say(target.name + ' tiene ' + n + ' ' + (corners ? 'picos' : 'lados')); answer(c, n === target.sides, sidesRound); });
      row.appendChild(c);
    });
    belt.appendChild(row);
    s.appendChild(top); s.appendChild(belt);
    finishScreen(s);
    KidsGame.say(say);
  }

  /* ---------- (c) Clasifica ---------- */
  var pieces = [], area = null, basketsEl = null, dragging = null;
  function sortRound() {
    var s = buildScreen('sort');
    var byShape = level >= 3;
    var nb = level === 1 ? 2 : level === 2 ? (roundsInAct === 0 ? 2 : 3) : (roundsInAct === 0 ? 3 : 4);
    var per = byShape ? 2 : 3;
    var bins = [];
    if (byShape) {
      var cs = KidsGame.shuffle(colorPool()).slice(0, 2), ss = KidsGame.shuffle(shapePool()).slice(0, 2);
      var combos = [];
      cs.forEach(function (c) { ss.forEach(function (sh) { combos.push({ c: c, s: sh }); }); });
      bins = KidsGame.shuffle(combos).slice(0, nb);
    } else {
      bins = KidsGame.shuffle(colorPool()).slice(0, nb).map(function (c) { return { c: c, s: null }; });
    }
    s.appendChild(el('div', 'hint', robotSVG(44) + (byShape ? 'Forma y color en su canasta' : 'Pon cada figura en su canasta')));
    area = el('div', 'area'); basketsEl = el('div', 'baskets n' + nb);
    bins.forEach(function (b) {
      var d = el('div', 'basket'); d.dataset.color = b.c.id; d.dataset.shape = b.s ? b.s.id : '';
      d.innerHTML = basketSVG(b.c.hex) + '<span class="bname" style="background-color:' + b.c.hex + '">' + (b.s ? shapeSVG(b.s, b.c.hex) + b.s.short + ' ' : '') + b.c.name + '</span>';
      basketsEl.appendChild(d);
    });
    pieces = [];
    bins.forEach(function (b) {
      for (var i = 0; i < per; i++) {
        var p = el('div', 'piece'); p.dataset.color = b.c.id; p.dataset.shape = b.s ? b.s.id : '';
        p.innerHTML = shapeSVG(b.s || KidsGame.pick(shapePool()), b.c.hex);
        p._jx = Math.random() * 2 - 1; p._jy = Math.random() * 2 - 1;
        p.addEventListener('pointerdown', function (e) { down(e, this); });
        pieces.push(p);
      }
    });
    pieces = KidsGame.shuffle(pieces);
    pieces.forEach(function (p, i) { p._k = i; p.style.animationDelay = (i * 60) + 'ms, ' + (-i * 0.7) + 's'; area.appendChild(p); });
    s.appendChild(area); s.appendChild(basketsEl);
    layoutSort();
    finishScreen(s);
    KidsGame.say(byShape ? 'Pon cada figura en la canasta de su forma y su color' : 'Pon cada figura en su canasta');
    if (level === 1 && !handShown.sort) { handShown.sort = true; setTimeout(function () { var p = pieces[0]; if (!p || !p.isConnected) return; var t = Array.prototype.filter.call(basketsEl.children, function (b) { return matches(b, p); })[0]; if (t) KidsGame.hand({ from: p, to: t }); }, 1300); }
  }
  /* ---------- (f) Clasifica 2x2 (Experto) ---------- */
  function sort2Round() {
    var s = buildScreen('sort sort2');
    var cs = KidsGame.shuffle(COLORS).slice(0, 2), ss = KidsGame.shuffle(SHAPES.filter(function (x) { return ['estrella', 'corazon'].indexOf(x.id) < 0; })).slice(0, 2);
    s.appendChild(el('div', 'hint', robotSVG(44) + 'Cada figura en su casilla: color y forma'));
    area = el('div', 'area');
    basketsEl = el('div', 'g2');
    basketsEl.appendChild(el('div', 'hd'));
    ss.forEach(function (sh) { basketsEl.appendChild(el('div', 'hd', shapeSVG(sh, '#9aa7c7'))); });
    cs.forEach(function (c) {
      basketsEl.appendChild(el('div', 'hd', '<div class="blob">' + blobSVG(c.hex) + '</div>'));
      ss.forEach(function (sh) {
        var d = el('div', 'cell'); d.dataset.color = c.id; d.dataset.shape = sh.id; d.style.setProperty('--tint', shade(c.hex, .78));
        basketsEl.appendChild(d);
      });
    });
    pieces = [];
    cs.forEach(function (c) { ss.forEach(function (sh) {
      for (var i = 0; i < 2; i++) {
        var p = el('div', 'piece'); p.dataset.color = c.id; p.dataset.shape = sh.id;
        p.innerHTML = shapeSVG(sh, c.hex);
        p._jx = Math.random() * 2 - 1; p._jy = Math.random() * 2 - 1;
        p.addEventListener('pointerdown', function (e) { down(e, this); });
        pieces.push(p);
      }
    }); });
    pieces = KidsGame.shuffle(pieces);
    pieces.forEach(function (p, i) { p._k = i; p.style.animationDelay = (i * 60) + 'ms, ' + (-i * 0.7) + 's'; area.appendChild(p); });
    s.appendChild(area); s.appendChild(basketsEl);
    layoutSort();
    finishScreen(s);
    KidsGame.say('Mira la fila del color y la columna de la forma. Arrastra cada figura a su casilla');
  }
  function layoutSort() {
    if (!area || !area.isConnected) return;
    var W = area.clientWidth, H = area.clientHeight, n = pieces.length;
    if (!W || !H || !n) return;
    var cols = Math.max(1, Math.round(Math.sqrt(n * W / H))); if (cols > n) cols = n;
    var rows = Math.ceil(n / cols);
    var cw = W / cols, ch = H / rows;
    var size = Math.floor(Math.min(cw, ch) * 0.7); size = Math.max(64, Math.min(size, 130));
    var jx = Math.max(0, (cw - size) / 2) * 0.6, jy = Math.max(0, (ch - size) / 2) * 0.6;
    pieces.forEach(function (p) {
      var c = p._k % cols, r = Math.floor(p._k / cols);
      var x = c * cw + (cw - size) / 2 + p._jx * jx, y = r * ch + (ch - size) / 2 + p._jy * jy;
      p.style.left = Math.max(0, Math.min(W - size, x)) + 'px'; p.style.top = Math.max(0, Math.min(H - size, y)) + 'px';
      p.style.width = size + 'px'; p.style.height = size + 'px';
    });
  }
  function basketAt(x, y) {
    var hit = null;
    Array.prototype.forEach.call(basketsEl.children, function (b) {
      if (b.dataset.color == null) return;
      var r = b.getBoundingClientRect();
      if (x >= r.left && x <= r.right && y >= r.top - 24 && y <= r.bottom + 24) hit = b;
    });
    return hit;
  }
  function matches(b, p) { return b.dataset.color === p.dataset.color && (!b.dataset.shape || b.dataset.shape === p.dataset.shape); }
  function down(e, p) {
    if (dragging || lock || p.classList.contains('gone')) return;
    e.preventDefault();
    dragging = { p: p, id: e.pointerId, sx: e.clientX, sy: e.clientY };
    p.classList.remove('pop', 'bad'); p.classList.add('drag', 'moved');
    KidsGame.sound.tap();
  }
  function move(e) {
    if (!dragging || e.pointerId !== dragging.id) return;
    e.preventDefault();
    dragging.p.style.transform = 'translate(' + (e.clientX - dragging.sx) + 'px,' + (e.clientY - dragging.sy) + 'px) scale(1.15)';
    var hit = basketAt(e.clientX, e.clientY);
    Array.prototype.forEach.call(basketsEl.children, function (b) { b.classList.toggle('hot', b === hit); });
  }
  function up(e) {
    if (!dragging || e.pointerId !== dragging.id) return;
    var p = dragging.p; dragging = null;
    var r = p.getBoundingClientRect();
    p.classList.remove('drag');
    Array.prototype.forEach.call(basketsEl.children, function (b) { b.classList.remove('hot'); });
    var target = basketAt(r.left + r.width / 2, r.top + r.height / 2);
    if (target && matches(target, p)) {
      var mouth = target.querySelector('.mouth'), br = mouth ? mouth.getBoundingClientRect() : target.getBoundingClientRect();
      p.classList.add('gone');
      var ox = parseFloat(p.style.left), oy = parseFloat(p.style.top), sz = parseFloat(p.style.width), ar = area.getBoundingClientRect();
      p.style.transform = 'translate(' + (br.left + br.width / 2 - (ar.left + ox + sz / 2)) + 'px,' + (br.top + br.height / 2 - (ar.top + oy + sz / 2)) + 'px) scale(0.1)';
      KidsGame.sound.pop(); replay(target, 'got'); hit(target); scored();
      if (target.classList.contains('cell')) target.insertAdjacentHTML('beforeend', p.innerHTML);
      pieces = pieces.filter(function (x) { return x !== p; });
      setTimeout(function () { p.remove(); }, 350);
      if (!pieces.length) { lock = true; setTimeout(function () { afterRound(ROUND_FN[ACTS[act]]); }, 700); }
    } else {
      p.style.transform = '';
      if (target) { KidsGame.sound.wrong(); replay(p, 'bad'); miss(p); } else KidsGame.sound.pop();
    }
  }
  document.addEventListener('pointermove', move);
  document.addEventListener('pointerup', up);
  document.addEventListener('pointercancel', up);

  window.addEventListener('resize', function () { if (area) layoutSort(); });
  // Expuesto para pruebas
  window.__formas = {
    setLevel: function (n) { level = n; ACTS = ACTS_BY_LEVEL[n]; showMenu(); }, get level() { return level; }, get act() { return ACTS[act]; }, get lock() { return lock; }, get total() { return correctTotal; }, get streak() { return streak; },
    start: startAct, sort: function (r) { act = ACTS.indexOf('sort'); roundsInAct = r || 0; sortRound(); },
    get pieces() { return pieces.length; },
    solve: function () {
      var scr = game.querySelector('.screen');
      if (scr.classList.contains('find')) { var c = scr.querySelector('.choice[data-id="' + scr.dataset.target + '"]'); c.dispatchEvent(new PointerEvent('pointerdown', { bubbles: true })); return 'find:' + scr.dataset.target; }
      var p = pieces[0]; if (!p) return false;
      var target = Array.prototype.filter.call(basketsEl.children, function (b) { return b.dataset.color != null && matches(b, p); })[0];
      var pr = p.getBoundingClientRect(), tr = target.getBoundingClientRect();
      var o = { bubbles: true, pointerId: 7, clientX: pr.left + pr.width / 2, clientY: pr.top + pr.height / 2 };
      p.dispatchEvent(new PointerEvent('pointerdown', o));
      document.dispatchEvent(new PointerEvent('pointermove', { bubbles: true, pointerId: 7, clientX: tr.left + tr.width / 2, clientY: tr.top + tr.height / 2 }));
      document.dispatchEvent(new PointerEvent('pointerup', { bubbles: true, pointerId: 7, clientX: tr.left + tr.width / 2, clientY: tr.top + tr.height / 2 }));
      return 'drag:' + p.dataset.color + '/' + p.dataset.shape;
    }
  };
  pickLevel();
})();
</script>
</body>
