<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<link rel="stylesheet" href="../common.css">
<title>Colorear</title>
<style>
  .game { display: flex; flex-direction: column; }
  .wrap { flex: 1 1 auto; display: flex; flex-direction: column; min-height: 0; }
  /* Tira de dibujos: bandeja de cristal con relieve */
  .strip {
    flex: 0 0 auto; display: flex; align-items: center; gap: 8px; padding: 8px 10px;
    overflow-x: auto; overflow-y: hidden; touch-action: pan-x; position: relative; z-index: 2;
    background: linear-gradient(180deg, rgba(255,255,255,.92), rgba(232,240,255,.78));
    box-shadow: inset 0 2px 0 #fff, inset 0 -3px 0 rgba(31,47,107,.08), 0 6px 14px rgba(20,40,90,.16);
    -webkit-overflow-scrolling: touch;
  }
  .strip::-webkit-scrollbar { display: none; }
  .thumb {
    flex: 0 0 auto; width: 64px; height: 64px; border-radius: 16px; padding: 3px; position: relative;
    background: linear-gradient(180deg, #ffffff 0%, #edf1fa 100%); border: 3px solid #fff;
    box-shadow: 0 5px 0 #c9d2e6, 0 9px 14px rgba(20,40,90,.22), inset 0 2px 0 #fff;
    cursor: pointer; transition: transform .12s, box-shadow .12s;
  }
  .thumb::after { content: ""; position: absolute; left: 8%; right: 8%; top: 4%; height: 36%; border-radius: 12px; pointer-events: none; background: linear-gradient(180deg, rgba(255,255,255,.85), rgba(255,255,255,0)); }
  .thumb svg { width: 100%; height: 100%; display: block; pointer-events: none; }
  .thumb.sel { border-color: #ffb3d3; transform: scale(1.1) translateY(-2px); box-shadow: 0 0 0 4px #f582ae, 0 5px 0 #c9d2e6, 0 12px 18px rgba(245,130,174,.45), inset 0 2px 0 #fff; }
  .thumb:active { transform: scale(.92); box-shadow: 0 1px 0 #c9d2e6, 0 4px 8px rgba(20,40,90,.2); }
  .strip .btn { flex: 0 0 auto; margin-left: auto; font-size: 22px; min-height: 60px; }
  /* Escenario: tablero con clip y hoja de papel */
  .stage { flex: 1 1 auto; min-height: 0; min-width: 0; display: flex; align-items: center; justify-content: center; padding: 16px 8px 10px; position: relative; }
  .clip {
    position: relative; z-index: 0; width: 300px; height: 300px; padding: 4%; border-radius: 18px;
    background:
      repeating-linear-gradient(90deg, rgba(255,255,255,.05) 0 3px, rgba(0,0,0,0) 3px 17px),
      repeating-linear-gradient(180deg, rgba(0,0,0,.06) 0 1px, rgba(0,0,0,0) 1px 9px),
      linear-gradient(180deg, #d9a05f 0%, #bd7a3c 55%, #9e6130 100%);
    box-shadow: 0 10px 0 #6f411d, 0 22px 34px rgba(0,0,0,.35), inset 0 2px 0 rgba(255,255,255,.4), inset 0 -3px 0 rgba(0,0,0,.15);
  }
  .clip .metal {
    position: absolute; left: 50%; top: 0; transform: translate(-50%, -46%); width: 34%; height: 9%; min-height: 24px; border-radius: 14px; z-index: 3;
    background: linear-gradient(180deg, #ffffff 0%, #d5dce6 40%, #a4afbe 60%, #c9d1dc 100%);
    box-shadow: 0 4px 0 #5f6b7a, 0 8px 12px rgba(0,0,0,.35), inset 0 2px 0 #fff, inset 0 -2px 0 rgba(0,0,0,.15);
  }
  .clip .metal::after { content: ""; position: absolute; left: 50%; top: 50%; width: 22%; height: 34%; transform: translate(-50%,-50%); border-radius: 8px; background: linear-gradient(180deg, #6f7b8c, #3f4a59); box-shadow: inset 0 1px 0 rgba(255,255,255,.5); }
  .sheet {
    position: relative; width: 100%; height: 100%; border-radius: 6px;
    background:
      repeating-linear-gradient(0deg, rgba(31,47,107,.025) 0 2px, rgba(0,0,0,0) 2px 5px),
      repeating-linear-gradient(90deg, rgba(31,47,107,.02) 0 1px, rgba(0,0,0,0) 1px 4px),
      linear-gradient(135deg, #ffffff 0%, #fbfaf6 100%);
    box-shadow: 0 2px 0 #e2e5ea, 0 10px 18px rgba(0,0,0,.28), 0 0 0 1px rgba(0,0,0,.06);
  }
  .sheet::before, .sheet::after {
    content: ""; position: absolute; z-index: -1; bottom: 10px; width: 46%; height: 22%; pointer-events: none;
    box-shadow: 0 16px 14px rgba(0,0,0,.42);
  }
  .sheet::before { left: 8px; transform: rotate(-3deg); }
  .sheet::after { right: 8px; transform: rotate(3deg); }
  .sheet svg { width: 100%; height: 100%; display: block; touch-action: none; position: relative; }
  .r { fill: #fff; stroke: #222; stroke-width: 6; stroke-linejoin: round; stroke-linecap: round; cursor: pointer; }
  .d { fill: none; stroke: #222; stroke-width: 6; stroke-linejoin: round; stroke-linecap: round; pointer-events: none; }
  .k { fill: #222; stroke: none; pointer-events: none; }
  .thumb .r, .thumb .d { stroke-width: 14; }
  .stage .r.fx { animation: rpop .3s ease-out; }
  @keyframes rpop { 0%{stroke-width:6} 40%{stroke-width:16; stroke:#fff} 100%{stroke-width:6} }
  /* Chispas al pintar */
  .sp { position: absolute; pointer-events: none; font-size: 24px; line-height: 1; z-index: 20; transform: translate(-50%,-50%); text-shadow: 0 0 6px #fff, 0 2px 3px rgba(0,0,0,.3); animation: spfly .6s ease-out forwards; }
  @keyframes spfly { 0%{ transform: translate(-50%,-50%) scale(.3) rotate(0deg); opacity: 1 } 100%{ transform: translate(calc(-50% + var(--dx)), calc(-50% + var(--dy))) scale(1.2) rotate(160deg); opacity: 0 } }
  /* Paleta: gotas de pintura brillantes */
  .palette {
    flex: 0 0 auto; display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; align-content: center;
    padding: 10px; position: relative; z-index: 2;
    background: linear-gradient(180deg, rgba(255,255,255,.92), rgba(232,240,255,.78));
    box-shadow: inset 0 2px 0 #fff, inset 0 -3px 0 rgba(31,47,107,.08), 0 -6px 14px rgba(20,40,90,.16);
  }
  .swatch {
    --d: #333; width: 64px; height: 64px; border-radius: 50% 50% 50% 50% / 46% 46% 54% 54%; border: 4px solid #fff; position: relative;
    box-shadow: 0 5px 0 var(--d), 0 10px 14px rgba(0,0,0,.28), inset 0 -5px 8px rgba(0,0,0,.18), inset 0 3px 0 rgba(255,255,255,.55);
    cursor: pointer; transition: transform .12s, box-shadow .12s; display: flex; align-items: center; justify-content: center; font-size: 30px;
  }
  .swatch::after { content: ""; position: absolute; left: 16%; top: 8%; width: 34%; height: 22%; border-radius: 50%; background: rgba(255,255,255,.85); transform: rotate(-25deg); pointer-events: none; filter: blur(.5px); }
  .swatch.sel { transform: scale(1.18); box-shadow: 0 0 0 3px #fff, 0 0 0 7px #1f2f6b, 0 6px 0 var(--d), 0 14px 18px rgba(0,0,0,.32), inset 0 -5px 8px rgba(0,0,0,.18), inset 0 3px 0 rgba(255,255,255,.55); animation: swpulse 1.6s ease-in-out infinite; }
  .swatch:active { transform: scale(.9); }
  @keyframes swpulse { 0%,100%{ transform: scale(1.18) } 50%{ transform: scale(1.26) } }
  .swatch.eraser { --d: #b9c4dc; background: linear-gradient(180deg, #ffffff, #e6ecf8) !important; }
  .hud { flex: 1 1 100%; display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; align-items: center; }
  .hud .kg-level-badge { font-size: 18px; padding: 6px 14px; white-space: nowrap; }
  .hud .lvbtn { width: 56px; height: 56px; min-width: 56px; min-height: 56px; font-size: 26px; }
  .hud .cnt { font-size: 18px; font-weight: 900; color: #1f2f6b; padding: 6px 12px; border-radius: 20px; background: rgba(255,255,255,.8); box-shadow: 0 2px 0 #c9d2e6; white-space: nowrap; }
  /* Nivel Experto: números en las zonas y en la paleta, modelo a copiar, marcas de revisión */
  .num { font-family: var(--font); font-weight: 900; font-size: 22px; fill: #1f2f6b; stroke: #fff; stroke-width: 5px; paint-order: stroke; pointer-events: none; text-anchor: middle; dominant-baseline: central; }
  .num.sm { font-size: 15px; stroke-width: 4px; }
  .swatch .nb { position: relative; z-index: 1; font-size: 28px; font-weight: 900; color: #fff; text-shadow: 0 0 4px #000, 0 2px 0 rgba(0,0,0,.6), 0 0 2px #000; }
  .stage .r.good { stroke: #24b36c; stroke-width: 10; }
  .stage .r.badr { stroke: #e63946; stroke-width: 10; animation: rbad .5s; }
  .stage .r.miss { animation: rmiss .9s 3; }
  @keyframes rbad { 0%,100%{stroke-width:10} 50%{stroke-width:18} }
  @keyframes rmiss { 0%,100%{stroke:#222} 50%{stroke:#ffb703; stroke-width:14} }
  .model { display: none; flex: 0 0 auto; width: 150px; padding: 6px 6px 4px; border-radius: 20px; text-align: center; position: relative; z-index: 2;
    background: linear-gradient(180deg, #ffffff, #f1f4fb); border: 3px solid #fff; box-shadow: 0 6px 0 #c9d2e6, 0 12px 20px rgba(20,40,90,.25), inset 0 2px 0 #fff; animation: pop .35s ease-out; }
  .model .ttl { font-size: 18px; font-weight: 900; color: #ff6f61; text-shadow: 0 1px 0 #fff; }
  .model svg { width: 100%; height: auto; display: block; }
  .model .r, .model .d { stroke-width: 9; }
  .stage.hasmodel { flex-direction: column; gap: 10px; }
  .stage.hasmodel .model { display: block; }
  @media (orientation: landscape) {
    .stage.hasmodel { flex-direction: row; }
    .wrap { flex-direction: row; }
    .strip { order: 0; flex-direction: column; width: 96px; height: auto; overflow-x: hidden; overflow-y: auto; touch-action: pan-y; padding: 10px 8px; box-shadow: inset 0 2px 0 #fff, inset -3px 0 0 rgba(31,47,107,.08), 6px 0 14px rgba(20,40,90,.16); }
    .strip .btn { margin-left: 0; margin-top: auto; min-width: 72px; padding: 6px; font-size: 20px; }
    .stage { order: 1; padding: 18px 12px 12px; }
    .palette { order: 2; width: 176px; align-content: center; box-shadow: inset 0 2px 0 #fff, inset 3px 0 0 rgba(31,47,107,.08), -6px 0 14px rgba(20,40,90,.16); }
  }
</style>
</head>

  if (n.filled < need) {
    KidsGame.sound.wrong();
    if (nivel >= 2) for (var k = 0; k < regions.length; k++) if (!fills[k] || fills[k] === '#fff') { regions[k].classList.remove('miss'); void regions[k].getBoundingClientRect(); regions[k].classList.add('miss'); }
    KidsGame.toast('Faltan ' + (need - n.filled) + ' zonas 🎨', 1600);
    KidsGame.say(nivel === 1 ? 'Pinta algo primero' : 'Faltan zonas por pintar');
    return;
  }
  KidsGame.addStar(nivel === 1 ? 1 : nivel);
  KidsGame.levelDone(nivel);
  KidsGame.celebrate({
    msg: '¡Qué bonito!', sub: DRAWINGS[cur].name + (nivel === 3 ? ' · ¡Todo pintado!' : ''),
    onNext: function () { show(cur + 1); },
    onAgain: function () {
      fills = {}; save(DRAWINGS[cur].id, fills);
      var r = sheet.querySelectorAll('.r');
      for (var k = 0; k < r.length; k++) r[k].style.fill = '';
      KidsGame.sound.pop(); updateHud();
    }
  });
};
function buildStrip() {
  strip.innerHTML = '';
  DRAWINGS.forEach(function (d, i) {
    var th = document.createElement('div');
    th.className = 'thumb';
    th.innerHTML = svgFor(d);
    th.setAttribute('aria-label', d.name);
    th.addEventListener('pointerdown', function (e) { e.preventDefault(); KidsGame.sound.pop(); show(i); });
    strip.appendChild(th);
  });
  strip.appendChild(done);
}

// ---------- Niveles: complejidad del dibujo y reto ----------
function buildHud() {
  hud.innerHTML = '';
  hud.appendChild(KidsGame.levelBadge(nivel));
  var c = document.createElement('span'); c.className = 'cnt'; hud.appendChild(c);
  var b = document.createElement('button'); b.className = 'btn round purple lvbtn'; b.textContent = '🎚️'; b.setAttribute('aria-label', 'Cambiar nivel');
  b.addEventListener('pointerdown', function (ev) { ev.preventDefault(); ev.stopPropagation(); KidsGame.sound.tap(); pickLevel(); });
  hud.appendChild(b);
}
function start(n) {
  nivel = n; challenge = null;
  DRAWINGS = LEVEL_SETS[n].map(function (id) { for (var k = 0; k < ALL.length; k++) if (ALL[k].id === id) return ALL[k]; }).filter(Boolean);
  buildHud();
  if (n < 4) { buildPalette(n === 1 ? COLORS.slice(0, 8) : COLORS, false); done.textContent = '✨ Listo'; }
  buildStrip();
  fitStage(); show(0, true); setTimeout(fitStage, 100);
  KidsGame.say(n === 1 ? 'Pinta como quieras' : n === 2 ? 'Pinta la mitad de las zonas' : n === 3 ? 'Pinta todas las zonas' : '');
}
function pickLevel() {
  KidsGame.levelPicker({
    labels: { 1: '4 dibujos sencillos', 2: 'Pinta la mitad', 3: 'Dibujos detallados, todo pintado', 4: 'Colorea por número y copia el modelo' },
    onPick: start
  });
}

buildPalette(COLORS, false);
fitStage();
pickLevel();
</script>
