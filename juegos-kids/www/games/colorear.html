<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<link rel="stylesheet" href="../common.css">
<title>Colorear</title>
<style>
  .game { display: flex; flex-direction: column; }
  .wrap { flex: 1 1 auto; display: flex; flex-direction: column; min-height: 0; }
  /* Tira de dibujos: bandeja de cristal con relieve */
  .strip {
    flex: 0 0 auto; display: flex; align-items: center; gap: 8px; padding: 8px 10px;
    overflow-x: auto; overflow-y: hidden; touch-action: pan-x; position: relative; z-index: 2;
    background: linear-gradient(180deg, rgba(255,255,255,.92), rgba(232,240,255,.78));
    box-shadow: inset 0 2px 0 #fff, inset 0 -3px 0 rgba(31,47,107,.08), 0 6px 14px rgba(20,40,90,.16);
    -webkit-overflow-scrolling: touch;
  }
  .strip::-webkit-scrollbar { display: none; }
  .thumb {
    flex: 0 0 auto; width: 64px; height: 64px; border-radius: 16px; padding: 3px; position: relative;
    background: linear-gradient(180deg, #ffffff 0%, #edf1fa 100%); border: 3px solid #fff;
    box-shadow: 0 5px 0 #c9d2e6, 0 9px 14px rgba(20,40,90,.22), inset 0 2px 0 #fff;
    cursor: pointer; transition: transform .12s, box-shadow .12s;
  }
  .thumb::after { content: ""; position: absolute; left: 8%; right: 8%; top: 4%; height: 36%; border-radius: 12px; pointer-events: none; background: linear-gradient(180deg, rgba(255,255,255,.85), rgba(255,255,255,0)); }
  .thumb svg { width: 100%; height: 100%; display: block; pointer-events: none; }
  .thumb.sel { border-color: #ffb3d3; transform: scale(1.1) translateY(-2px); box-shadow: 0 0 0 4px #f582ae, 0 5px 0 #c9d2e6, 0 12px 18px rgba(245,130,174,.45), inset 0 2px 0 #fff; }
  .thumb:active { transform: scale(.92); box-shadow: 0 1px 0 #c9d2e6, 0 4px 8px rgba(20,40,90,.2); }
  .strip .btn { flex: 0 0 auto; margin-left: auto; font-size: 22px; min-height: 60px; }
  /* Escenario: tablero con clip y hoja de papel */
  .stage { flex: 1 1 auto; min-height: 0; min-width: 0; display: flex; align-items: center; justify-content: center; padding: 16px 8px 10px; position: relative; }
  .clip {
    position: relative; z-index: 0; width: 300px; height: 300px; padding: 4%; border-radius: 18px;
    background:
      repeating-linear-gradient(90deg, rgba(255,255,255,.05) 0 3px, rgba(0,0,0,0) 3px 17px),
      repeating-linear-gradient(180deg, rgba(0,0,0,.06) 0 1px, rgba(0,0,0,0) 1px 9px),
      linear-gradient(180deg, #d9a05f 0%, #bd7a3c 55%, #9e6130 100%);
    box-shadow: 0 10px 0 #6f411d, 0 22px 34px rgba(0,0,0,.35), inset 0 2px 0 rgba(255,255,255,.4), inset 0 -3px 0 rgba(0,0,0,.15);
  }
  .clip .metal {
    position: absolute; left: 50%; top: 0; transform: translate(-50%, -46%); width: 34%; height: 9%; min-height: 24px; border-radius: 14px; z-index: 3;
    background: linear-gradient(180deg, #ffffff 0%, #d5dce6 40%, #a4afbe 60%, #c9d1dc 100%);
    box-shadow: 0 4px 0 #5f6b7a, 0 8px 12px rgba(0,0,0,.35), inset 0 2px 0 #fff, inset 0 -2px 0 rgba(0,0,0,.15);
  }
  .clip .metal::after { content: ""; position: absolute; left: 50%; top: 50%; width: 22%; height: 34%; transform: translate(-50%,-50%); border-radius: 8px; background: linear-gradient(180deg, #6f7b8c, #3f4a59); box-shadow: inset 0 1px 0 rgba(255,255,255,.5); }
  .sheet {
    position: relative; width: 100%; height: 100%; border-radius: 6px;
    background:
      repeating-linear-gradient(0deg, rgba(31,47,107,.025) 0 2px, rgba(0,0,0,0) 2px 5px),
      repeating-linear-gradient(90deg, rgba(31,47,107,.02) 0 1px, rgba(0,0,0,0) 1px 4px),
      linear-gradient(135deg, #ffffff 0%, #fbfaf6 100%);
    box-shadow: 0 2px 0 #e2e5ea, 0 10px 18px rgba(0,0,0,.28), 0 0 0 1px rgba(0,0,0,.06);
  }
  .sheet::before, .sheet::after {
    content: ""; position: absolute; z-index: -1; bottom: 10px; width: 46%; height: 22%; pointer-events: none;
    box-shadow: 0 16px 14px rgba(0,0,0,.42);
  }
  .sheet::before { left: 8px; transform: rotate(-3deg); }
  .sheet::after { right: 8px; transform: rotate(3deg); }
  .sheet svg { width: 100%; height: 100%; display: block; touch-action: none; position: relative; }
  .r { fill: #fff; stroke: #222; stroke-width: 6; stroke-linejoin: round; stroke-linecap: round; cursor: pointer; }
  .d { fill: none; stroke: #222; stroke-width: 6; stroke-linejoin: round; stroke-linecap: round; pointer-events: none; }
  .k { fill: #222; stroke: none; pointer-events: none; }
  .thumb .r, .thumb .d { stroke-width: 14; }
  .stage .r.fx { animation: rpop .3s ease-out; }
  @keyframes rpop { 0%{stroke-width:6} 40%{stroke-width:16; stroke:#fff} 100%{stroke-width:6} }
  /* Chispas al pintar */
  .sp { position: absolute; pointer-events: none; font-size: 24px; line-height: 1; z-index: 20; transform: translate(-50%,-50%); text-shadow: 0 0 6px #fff, 0 2px 3px rgba(0,0,0,.3); animation: spfly .6s ease-out forwards; }
  @keyframes spfly { 0%{ transform: translate(-50%,-50%) scale(.3) rotate(0deg); opacity: 1 } 100%{ transform: translate(calc(-50% + var(--dx)), calc(-50% + var(--dy))) scale(1.2) rotate(160deg); opacity: 0 } }
  /* Paleta: gotas de pintura brillantes */
  .palette {
    flex: 0 0 auto; display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; align-content: center;
    padding: 10px; position: relative; z-index: 2;
    background: linear-gradient(180deg, rgba(255,255,255,.92), rgba(232,240,255,.78));
    box-shadow: inset 0 2px 0 #fff, inset 0 -3px 0 rgba(31,47,107,.08), 0 -6px 14px rgba(20,40,90,.16);
  }
  .swatch {
    --d: #333; width: 64px; height: 64px; border-radius: 50% 50% 50% 50% / 46% 46% 54% 54%; border: 4px solid #fff; position: relative;
    box-shadow: 0 5px 0 var(--d), 0 10px 14px rgba(0,0,0,.28), inset 0 -5px 8px rgba(0,0,0,.18), inset 0 3px 0 rgba(255,255,255,.55);
    cursor: pointer; transition: transform .12s, box-shadow .12s; display: flex; align-items: center; justify-content: center; font-size: 30px;
  }
  .swatch::after { content: ""; position: absolute; left: 16%; top: 8%; width: 34%; height: 22%; border-radius: 50%; background: rgba(255,255,255,.85); transform: rotate(-25deg); pointer-events: none; filter: blur(.5px); }
  .swatch.sel { transform: scale(1.18); box-shadow: 0 0 0 3px #fff, 0 0 0 7px #1f2f6b, 0 6px 0 var(--d), 0 14px 18px rgba(0,0,0,.32), inset 0 -5px 8px rgba(0,0,0,.18), inset 0 3px 0 rgba(255,255,255,.55); animation: swpulse 1.6s ease-in-out infinite; }
  .swatch:active { transform: scale(.9); }
  @keyframes swpulse { 0%,100%{ transform: scale(1.18) } 50%{ transform: scale(1.26) } }
  .swatch.eraser { --d: #b9c4dc; background: linear-gradient(180deg, #ffffff, #e6ecf8) !important; }
  .hud { flex: 1 1 100%; display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; align-items: center; }
  .hud .kg-level-badge { font-size: 18px; padding: 6px 14px; white-space: nowrap; }
  .hud .lvbtn { width: 56px; height: 56px; min-width: 56px; min-height: 56px; font-size: 26px; }
  @media (orientation: landscape) {
    .wrap { flex-direction: row; }
    .strip { order: 0; flex-direction: column; width: 96px; height: auto; overflow-x: hidden; overflow-y: auto; touch-action: pan-y; padding: 10px 8px; box-shadow: inset 0 2px 0 #fff, inset -3px 0 0 rgba(31,47,107,.08), 6px 0 14px rgba(20,40,90,.16); }
    .strip .btn { margin-left: 0; margin-top: auto; min-width: 72px; padding: 6px; font-size: 20px; }
    .stage { order: 1; padding: 18px 12px 12px; }
    .palette { order: 2; width: 176px; align-content: center; box-shadow: inset 0 2px 0 #fff, inset 3px 0 0 rgba(31,47,107,.08), -6px 0 14px rgba(20,40,90,.16); }
  }
</style>
</head>

    '<path class="r" d="M70 228 A16 16 0 0 1 102 228 Z"/><circle class="r" cx="86" cy="196" r="13"/>' +
    '<circle class="k" cx="81" cy="194" r="2.2"/><circle class="k" cx="91" cy="194" r="2.2"/><path class="d" d="M81 202 Q86 206 91 202"/>' +
    '<path class="r" d="M126 228 A16 16 0 0 1 158 228 Z"/><circle class="r" cx="142" cy="196" r="13"/>' +
    '<circle class="k" cx="137" cy="194" r="2.2"/><circle class="k" cx="147" cy="194" r="2.2"/><path class="d" d="M137 202 Q142 206 147 202"/>' +
    '<circle class="r" cx="134" cy="184" r="6"/>' +
    '<path class="r" d="M182 228 A16 16 0 0 1 214 228 Z"/><circle class="r" cx="198" cy="196" r="13"/>' +
    '<circle class="k" cx="193" cy="194" r="2.2"/><circle class="k" cx="203" cy="194" r="2.2"/><path class="d" d="M193 202 Q198 206 203 202"/>' +
    '<rect class="r" x="230" y="168" width="50" height="132" rx="8"/>' +
    '<rect class="r" x="238" y="176" width="34" height="44" rx="6"/>' +
    '<path class="d" d="M255 228 L255 300"/>' +
    '<rect class="r" x="290" y="168" width="52" height="60" rx="8"/>' +
    '<path class="r" d="M300 228 A16 16 0 0 1 332 228 Z"/><circle class="r" cx="316" cy="198" r="13"/>' +
    '<circle class="k" cx="311" cy="196" r="2.2"/><circle class="k" cx="321" cy="196" r="2.2"/><path class="d" d="M311 204 Q316 208 321 204"/>' +
    '<rect class="r" x="298" y="182" width="36" height="7" rx="3"/><rect class="r" x="305" y="172" width="22" height="12" rx="4"/>' +
    '<rect class="r" x="30" y="300" width="340" height="16" rx="8"/>' +
    '<circle class="r" cx="350" cy="284" r="11"/><circle class="r" cx="50" cy="284" r="11"/>' +
    '<circle class="r" cx="110" cy="322" r="36"/><circle class="r" cx="110" cy="322" r="14"/>' +
    '<circle class="r" cx="290" cy="322" r="36"/><circle class="r" cx="290" cy="322" r="14"/>' }
];
var LEVEL_SETS = { 1: ['helado', 'gato', 'arcoiris', 'casa'], 2: ['flor', 'pez', 'mariposa', 'coche', 'casa'], 3: ['castillo', 'selva', 'autobus', 'coche', 'mariposa'] };
var DRAWINGS = ALL.slice();
function rainbow() {
  var s = '', R = 172, w = 23;
  for (var i = 0; i < 6; i++) {
    var ro = R - w * i, ri = ro - w;
    s += '<path class="r" d="M' + (200 - ro) + ' 300 A' + ro + ' ' + ro + ' 0 0 1 ' + (200 + ro) + ' 300 L' + (200 + ri) + ' 300 A' + ri + ' ' + ri + ' 0 0 0 ' + (200 - ri) + ' 300 Z"/>';
  }
  return s;
}
function svgFor(d) {
  return '<svg viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg">' + d.svg + '</svg>';
}

// ---------- Utilidades de color (relleno con volumen) ----------
var NS = 'http://www.w3.org/2000/svg';
function shade(hex, amt) {
  var h = hex.replace('#', ''); if (h.length === 3) h = h[0] + h[0] + h[1] + h[1] + h[2] + h[2];
  var n = parseInt(h, 16), r = n >> 16, g = (n >> 8) & 255, b = n & 255;
  function f(v) { v = amt > 0 ? v + (255 - v) * amt : v * (1 + amt); return Math.max(0, Math.min(255, Math.round(v))); }
  return 'rgb(' + f(r) + ',' + f(g) + ',' + f(b) + ')';
}
function ensureGrad(svg, c) {
  var id = 'g-' + c.replace('#', '');
  var defs = svg.querySelector('defs');
  if (!defs) { defs = document.createElementNS(NS, 'defs'); svg.insertBefore(defs, svg.firstChild); }
  if (!defs.querySelector('#' + id)) {
    var g = document.createElementNS(NS, 'linearGradient');
    g.setAttribute('id', id); g.setAttribute('x1', '0'); g.setAttribute('y1', '0'); g.setAttribute('x2', '1'); g.setAttribute('y2', '1');
    [[0, shade(c, .38)], [.45, c], [1, shade(c, -.18)]].forEach(function (st) {
      var s = document.createElementNS(NS, 'stop'); s.setAttribute('offset', st[0]); s.setAttribute('stop-color', st[1]); g.appendChild(s);
    });
    defs.appendChild(g);
  }
  return 'url(#' + id + ')';
}
function paint(el, c) {
  if (!c || c === '#fff' || c === '#ffffff') { el.style.fill = c ? '#fff' : ''; return; }
  var svg = sheet.querySelector('svg');
  el.style.fill = svg ? ensureGrad(svg, c) : c;
}
function burst(x, y, colors) {
  if (stage.querySelectorAll('.sp').length > 30) return;
  for (var k = 0; k < 7; k++) {
    var s = document.createElement('span'); s.className = 'sp'; s.textContent = k % 2 ? '✦' : '★';
    var a = Math.random() * Math.PI * 2, d = 28 + Math.random() * 48;
    s.style.left = x + 'px'; s.style.top = y + 'px'; s.style.color = colors[k % colors.length];
    s.style.setProperty('--dx', Math.cos(a) * d + 'px'); s.style.setProperty('--dy', Math.sin(a) * d + 'px');
    s.style.animationDuration = (.5 + Math.random() * .3) + 's';
    stage.appendChild(s);
    (function (el) { setTimeout(function () { el.remove(); }, 900); })(s);
  }
}

// ---------- Paleta ----------
var COLORS = ['#ff4d4d', '#ff9f1c', '#ffe14d', '#4cd964', '#2ec4b6', '#3da9fc', '#3a5bd9', '#a06cd5', '#ff7eb6', '#9be7ff', '#a0522d', '#333333'];
var current = COLORS[0];
var strip = document.getElementById('strip'), stage = document.getElementById('stage'), palette = document.getElementById('palette');
var sheet = document.getElementById('sheet'), clip = document.getElementById('clip');

COLORS.concat(['eraser']).forEach(function (c, i) {
  var s = document.createElement('div');
  s.className = 'swatch' + (i === 0 ? ' sel' : '');
  if (c === 'eraser') { s.classList.add('eraser'); s.innerHTML = '<span class="emoji">🧽</span>'; s.title = 'Borrar'; }
  else {
    s.style.background = 'radial-gradient(circle at 34% 30%, rgba(255,255,255,.55) 0, rgba(255,255,255,.18) 22%, rgba(255,255,255,0) 46%), linear-gradient(180deg, rgba(255,255,255,.2), rgba(0,0,0,0) 45%, rgba(0,0,0,.22)), ' + c;
    s.style.setProperty('--d', shade(c, -.4));
  }
  s.addEventListener('pointerdown', function (e) {
    e.preventDefault();
    current = c === 'eraser' ? '#fff' : c;
    var all = palette.querySelectorAll('.swatch');
    for (var k = 0; k < all.length; k++) all[k].classList.remove('sel');
    s.classList.add('sel');
    KidsGame.sound.pop();
  });
  palette.appendChild(s);
});

// ---------- Guardado (opcional) ----------
function load(id) { try { return JSON.parse(localStorage.getItem('kg-colorear-' + id) || '{}'); } catch (e) { return {}; } }
function save(id, fills) { try { localStorage.setItem('kg-colorear-' + id, JSON.stringify(fills)); } catch (e) {} }

// ---------- Ajuste del tablero (cuadrado que cabe en el escenario) ----------
function fitStage() {
  var w = stage.clientWidth - 16, h = stage.clientHeight - 26;
  var side = Math.max(120, Math.min(w, h));
  clip.style.width = side + 'px'; clip.style.height = side + 'px';
}
window.addEventListener('resize', function () { setTimeout(fitStage, 50); });
if (window.ResizeObserver) { try { new ResizeObserver(function () { fitStage(); }).observe(stage); } catch (e) {} }

// ---------- Escenario ----------
var cur = 0, fills = {};
function show(i, quiet) {
  cur = (i + DRAWINGS.length) % DRAWINGS.length;
  var d = DRAWINGS[cur];
  sheet.innerHTML = svgFor(d);
  fills = load(d.id);
  var regions = stage.querySelectorAll('.r');
  for (var k = 0; k < regions.length; k++) {
    regions[k].setAttribute('data-i', k);
    if (fills[k]) paint(regions[k], fills[k]);
  }
  var th = strip.querySelectorAll('.thumb');
  for (var t = 0; t < th.length; t++) th[t].classList.toggle('sel', t === cur);
  if (th[cur] && th[cur].scrollIntoView) { try { th[cur].scrollIntoView({ block: 'nearest', inline: 'nearest' }); } catch (e) {} }
  var svg = stage.querySelector('svg');
  svg.classList.add('pop');
  if (!quiet) KidsGame.say(d.name);
}
stage.addEventListener('pointerdown', function (e) {
  var t = e.target;
  if (!t || !t.classList || !t.classList.contains('r')) return;
  e.preventDefault();
  paint(t, current);
  fills[t.getAttribute('data-i')] = current;
  save(DRAWINGS[cur].id, fills);
  t.classList.remove('fx'); void t.getBoundingClientRect(); t.classList.add('fx');
  var r = stage.getBoundingClientRect();
  burst(e.clientX - r.left, e.clientY - r.top, current === '#fff' ? ['#fff', '#cfe3ff'] : ['#fff', '#ffe14d', current]);
  KidsGame.sound.tap(); KidsGame.vibrate(15);
});

// ---------- Tira de miniaturas (según nivel) ----------
var done = document.createElement('button');
done.className = 'btn green'; done.textContent = '✨ Listo';
done.onclick = function () {
  var filled = 0, regions = stage.querySelectorAll('.r');
  for (var k = 0; k < regions.length; k++) if (fills[k] && fills[k] !== '#fff') filled++;
  KidsGame.addStar(filled >= 3 ? 2 : 1);
  KidsGame.celebrate({
    msg: '¡Qué bonito!', sub: DRAWINGS[cur].name,
    onNext: function () { show(cur + 1); },
    onAgain: function () {
      fills = {}; save(DRAWINGS[cur].id, fills);
      var r = stage.querySelectorAll('.r');
      for (var k = 0; k < r.length; k++) r[k].style.fill = '';
      KidsGame.sound.pop();
    }
  });
};
function buildStrip() {
  strip.innerHTML = '';
  DRAWINGS.forEach(function (d, i) {
    var th = document.createElement('div');
    th.className = 'thumb';
    th.innerHTML = svgFor(d);
    th.setAttribute('aria-label', d.name);
    th.addEventListener('pointerdown', function (e) { e.preventDefault(); KidsGame.sound.pop(); show(i); });
    strip.appendChild(th);
  });
  strip.appendChild(done);
}

// ---------- Niveles: complejidad del dibujo ----------
var nivel = 1, hud = document.createElement('div'); hud.className = 'hud';
palette.insertBefore(hud, palette.firstChild);
function buildHud() {
  hud.innerHTML = '';
  hud.appendChild(KidsGame.levelBadge(nivel));
  var b = document.createElement('button'); b.className = 'btn round purple lvbtn'; b.textContent = '🎚️'; b.setAttribute('aria-label', 'Cambiar nivel');
  b.addEventListener('pointerdown', function (ev) { ev.preventDefault(); ev.stopPropagation(); KidsGame.sound.tap(); pickLevel(); });
  hud.appendChild(b);
}
function start(n) {
  nivel = n;
  DRAWINGS = LEVEL_SETS[n].map(function (id) { for (var k = 0; k < ALL.length; k++) if (ALL[k].id === id) return ALL[k]; }).filter(Boolean);
  buildStrip(); buildHud();
  fitStage(); show(0, true); setTimeout(fitStage, 100);
}
function pickLevel() {
  KidsGame.levelPicker({ onPick: start });
}

fitStage();
pickLevel();
</script>
