<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<link rel="stylesheet" href="../common.css">
<title>Construye</title>
<style>
  .game { background: radial-gradient(ellipse at 50% 100%, rgba(255,255,255,.55), rgba(255,255,255,0) 60%), linear-gradient(180deg, #7ed6ff 0%, #bfeeff 50%, #ffe9a8 100%); }
  .game::before { content: ""; position: absolute; inset: 0; pointer-events: none;
    background: radial-gradient(ellipse 200px 70px at 20% 20%, rgba(255,255,255,.9), rgba(255,255,255,0) 70%), radial-gradient(ellipse 240px 80px at 80% 28%, rgba(255,255,255,.85), rgba(255,255,255,0) 70%); }
  .hud { position: absolute; left: 8px; right: 8px; top: 8px; height: 64px; display: flex; align-items: center; justify-content: space-between; gap: 8px; z-index: 3; }
  .hud .grp { display: flex; align-items: center; gap: 8px; }
  .hud .btn { font-size: 24px; }
  .hud .btn.off { opacity: .45; filter: grayscale(.7); }
  .hud .btn.on { outline: 4px solid #fff; outline-offset: 2px; }
  .hud .btn.chk { font-size: 24px; padding: 8px 18px; white-space: nowrap; }
  .hud .cnt { font-size: 18px; padding: 4px 12px; border-radius: 20px; background: linear-gradient(180deg,#fff,#eef2ff); color: #1f2f6b; box-shadow: 0 3px 0 #c9d2e6, 0 6px 10px rgba(0,0,0,.2); white-space: nowrap; }
  .wrap { position: absolute; left: 8px; right: 8px; top: 78px; bottom: 8px; display: flex; gap: 10px; }
  .wrap.portrait { flex-direction: column; }
  .stagebox { flex: 1 1 auto; min-width: 0; min-height: 0; display: flex; align-items: center; justify-content: center; }
  svg.stage { width: 100%; height: 100%; display: block; touch-action: none; }
  .side { flex: 0 0 auto; display: flex; flex-direction: column; gap: 10px; align-items: center; width: 230px; }
  .wrap.portrait .side { flex-direction: row; width: auto; height: 150px; justify-content: center; }
  .target { width: 220px; height: 190px; display: flex; flex-direction: column; align-items: center; justify-content: center; position: relative; border-radius: 22px; }
  .wrap.portrait .target { width: 230px; height: 150px; }
  .target .ttl { position: absolute; top: 6px; left: 0; right: 0; text-align: center; font-size: 17px; color: #1f2f6b; }
  .target svg { width: 92%; height: 78%; margin-top: 14px; }
  .target.hid svg { opacity: 0; }
  .target .q { position: absolute; inset: 0; display: none; align-items: center; justify-content: center; font-size: 70px; }
  .target.hid .q { display: flex; }
  .palette { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; padding: 8px; border-radius: 22px; width: 220px; }
  .wrap.portrait .palette { width: auto; height: 150px; align-content: center; max-width: 480px; }
  .sw { width: 64px; height: 64px; border-radius: 16px; display: flex; align-items: center; justify-content: center; cursor: pointer; background: linear-gradient(180deg, rgba(255,255,255,.8), rgba(230,235,255,.8)); box-shadow: 0 4px 0 #c9d2e6, 0 6px 10px rgba(0,0,0,.15); transition: transform .12s; }
  .sw svg { width: 50px; height: 50px; }
  .sw.sel { transform: scale(1.12); outline: 5px solid #fff; outline-offset: 2px; box-shadow: 0 4px 0 #c9d2e6, 0 0 0 9px rgba(255,255,255,.4), 0 6px 10px rgba(0,0,0,.2); }
  .sw.eraser { font-size: 34px; }
  .slots { display: flex; gap: 10px; justify-content: center; padding: 8px 10px; border-radius: 22px; width: 220px; }
  .wrap.portrait .slots { width: auto; }
  .slot { width: 64px; display: flex; flex-direction: column; gap: 4px; align-items: center; }
  .slot .th { width: 64px; height: 64px; border-radius: 14px; background: linear-gradient(180deg,#fff,#e9eeff); box-shadow: 0 4px 0 #c9d2e6, 0 6px 10px rgba(0,0,0,.15); display: flex; align-items: center; justify-content: center; font-size: 28px; color: #9aa6c8; cursor: pointer; }
  .slot .th svg { width: 56px; height: 56px; }
  .slot .sv { font-size: 18px; min-height: 36px; min-width: 64px; padding: 2px 8px; border-radius: 14px; }
  .spark { position: absolute; width: 14px; height: 14px; border-radius: 50%; pointer-events: none; z-index: 20;
    background: radial-gradient(circle at 35% 35%, #fff, #ffd54a 60%, #ff9f1c); box-shadow: 0 0 10px #ffe680; animation: spk .7s ease-out forwards; }
  @keyframes spk { 0% { transform: translate(0,0) scale(1); opacity: 1; } 100% { transform: translate(var(--dx), var(--dy)) scale(.2); opacity: 0; } }
  .timer { position: absolute; left: 50%; top: 82px; transform: translateX(-50%); width: 160px; height: 14px; border-radius: 10px; background: rgba(0,0,0,.25); z-index: 4; overflow: hidden; display: none; box-shadow: inset 0 2px 4px rgba(0,0,0,.3); }
  .timer i { display: block; height: 100%; width: 100%; background: linear-gradient(180deg,#ffe98a,#ffb703); box-shadow: inset 0 2px 0 rgba(255,255,255,.6); transform-origin: left; }
  .cube.new { animation: drop .25s ease-out; transform-box: fill-box; transform-origin: center; }
  @keyframes drop { 0% { transform: translateY(-20px) scale(1.05); opacity: .4; } 100% { transform: translateY(0) scale(1); opacity: 1; } }
  .floor polygon { cursor: pointer; }
  .floor polygon:active { fill: #fff; }
  .cloud { position: absolute; width: 140px; height: 50px; border-radius: 40px; background: #fff; opacity: .8; z-index: 0; animation: float 6s ease-in-out infinite; filter: drop-shadow(0 6px 6px rgba(0,60,120,.15)); }
  .cloud::before { content: ""; position: absolute; left: 30px; top: -24px; width: 60px; height: 60px; border-radius: 50%; background: #fff; }
  @media (max-width: 820px) { .hud .btn.chk { padding: 8px 12px; font-size: 22px; } }
</style>
</head>
<body>
<script src="../common.js"></script>
<script>
(function () {
  var game = KidsGame.init({ title: 'Construye' });
  var COLORS = [
    { n: 'rojo',    t: '#ff8fa3', l: '#e63960', r: '#a3183e', e: '#ffd0da' },
    { n: 'amarillo', t: '#fff1a8', l: '#ffcf2e', r: '#c78f00', e: '#fffbe0' },
    { n: 'verde',   t: '#b3f7c9', l: '#2fd37a', r: '#157a43', e: '#e3ffee' },
    { n: 'azul',    t: '#a9dcff', l: '#2f95e8', r: '#1a4f9c', e: '#e0f2ff' },
    { n: 'morado',  t: '#d9c8ff', l: '#8f6cf0', r: '#5232b3', e: '#f0e9ff' },
    { n: 'naranja', t: '#ffd2a8', l: '#ff8906', r: '#b85a00', e: '#fff0e0' }
  ];
  var TW = 34, TH = 17, HZ = 34, HMAX = 4;
  var LABELS = { 1: '3-4 bloques', 2: '5-7 · apilar', 3: '8-12 · girado', 4: '12-16 · memoria' };
  var PER_LEVEL = 5;
  function el(tag, cls, txt) { var e = document.createElement(tag); if (cls) e.className = cls; if (txt != null) e.textContent = txt; return e; }
  function onTap(e, fn) { e.addEventListener('pointerdown', function (ev) { ev.preventDefault(); ev.stopPropagation(); fn(ev); }); }
  var NS = 'http://www.w3.org/2000/svg';
  function svgEl(tag, attrs) { var e = document.createElementNS(NS, tag); for (var k in attrs) e.setAttribute(k, attrs[k]); return e; }
  function key(x, y, z) { return x + ',' + y + ',' + z; }

  // ---------- render isométrico ----------
  function base(x, y, G) { return [(x - y) * TW + G * TW, (x + y) * TH + HZ * HMAX + TH + 6]; }
  function cubePolys(bx, by, z) {
    var top = by - (z + 1) * HZ, bot = by - z * HZ;
    return {
      top: [[bx, top - TH], [bx + TW, top], [bx, top + TH], [bx - TW, top]],
      left: [[bx - TW, top], [bx, top + TH], [bx, bot + TH], [bx - TW, bot]],
      right: [[bx, top + TH], [bx + TW, top], [bx + TW, bot], [bx, bot + TH]]
    };
  }
  function pstr(p) { return p.map(function (q) { return q[0] + ',' + q[1]; }).join(' '); }
  // Dibuja escena completa dentro de un svg (vox: {key: colorIdx}); interactive añade data-attrs
  function render(svg, vox, G, interactive, hideGrid) {
    svg.innerHTML = '';
    var W = 2 * TW * G, Hh = 2 * TH * G + HZ * HMAX + TH + 12;
    svg.setAttribute('viewBox', '0 0 ' + W + ' ' + Hh);
    var floor = svgEl('g', { 'class': 'floor' });
    // sombra del suelo
    var fx0 = 0, fy0 = 0, fx1 = G - 1, fy1 = G - 1;
    if (hideGrid && Object.keys(vox).length) { fx0 = fy0 = Infinity; fx1 = fy1 = -Infinity; Object.keys(vox).forEach(function (k) { var a = k.split(',').map(Number); fx0 = Math.min(fx0, a[0]); fy0 = Math.min(fy0, a[1]); fx1 = Math.max(fx1, a[0]); fy1 = Math.max(fy1, a[1]); }); }
    var c0 = base(fx0, fy0, G), c1 = base(fx1, fy0, G), c2 = base(fx1, fy1, G), c3 = base(fx0, fy1, G);
    floor.appendChild(svgEl('polygon', { points: pstr([[c0[0], c0[1] - TH + 6], [c1[0] + TW, c1[1] + 6], [c2[0], c2[1] + TH + 6], [c3[0] - TW, c3[1] + 6]]), fill: 'rgba(0,40,90,.18)' }));
    if (!hideGrid) for (var y = 0; y < G; y++) for (var x = 0; x < G; x++) {
      var b = base(x, y, G);
      var p = svgEl('polygon', { points: pstr([[b[0], b[1] - TH], [b[0] + TW, b[1]], [b[0], b[1] + TH], [b[0] - TW, b[1]]]), fill: (x + y) % 2 ? '#cfe9a3' : '#e4f5c2', stroke: '#9ccc65', 'stroke-width': 1 });
      if (interactive) { p.setAttribute('data-f', x + ',' + y); }
      floor.appendChild(p);
    }
    svg.appendChild(floor);
    var list = Object.keys(vox).map(function (k) { var a = k.split(',').map(Number); return { x: a[0], y: a[1], z: a[2], c: vox[k], k: k }; });
    list.sort(function (a, b) { return (a.x + a.y) - (b.x + b.y) || a.z - b.z; });
    var cubes = svgEl('g', { 'class': 'cubes' });
    list.forEach(function (v) {
      var b = base(v.x, v.y, G), P = cubePolys(b[0], b[1], v.z), C = COLORS[v.c];
      var g = svgEl('g', { 'class': 'cube' });
      if (interactive) { g.setAttribute('data-k', v.k); }
      g.appendChild(svgEl('polygon', { points: pstr(P.left), fill: C.l, stroke: C.r, 'stroke-width': 1, 'stroke-linejoin': 'round' }));
      g.appendChild(svgEl('polygon', { points: pstr(P.right), fill: C.r, stroke: C.r, 'stroke-width': 1, 'stroke-linejoin': 'round' }));
      g.appendChild(svgEl('polygon', { points: pstr(P.top), fill: C.t, stroke: C.e, 'stroke-width': 1.5, 'stroke-linejoin': 'round' }));
      // brillo en la cara superior
      g.appendChild(svgEl('polygon', { points: pstr([[b[0] - TW * .45, P.top[0][1] + TH * .55], [b[0], P.top[0][1] + TH * .25], [b[0] + TW * .45, P.top[0][1] + TH * .55], [b[0], P.top[0][1] + TH * .85]]), fill: 'rgba(255,255,255,.35)', 'pointer-events': 'none' }));
      cubes.appendChild(g);
    });
    svg.appendChild(cubes);
    if (!interactive) { // encuadre ajustado al contenido (tarjeta modelo / miniaturas)
      var mnx = Infinity, mny = Infinity, mxx = -Infinity, mxy = -Infinity;
      var pts = [[c0[0], c0[1] - TH + 6], [c1[0] + TW, c1[1] + 6], [c2[0], c2[1] + TH + 6], [c3[0] - TW, c3[1] + 6]];
      list.forEach(function (v) { var b = base(v.x, v.y, G), P = cubePolys(b[0], b[1], v.z); pts = pts.concat(P.top, P.left, P.right); });
      pts.forEach(function (q) { mnx = Math.min(mnx, q[0]); mny = Math.min(mny, q[1]); mxx = Math.max(mxx, q[0]); mxy = Math.max(mxy, q[1]); });
      var pad = 6; svg.setAttribute('viewBox', (mnx - pad) + ' ' + (mny - pad) + ' ' + (mxx - mnx + 2 * pad) + ' ' + (mxy - mny + 2 * pad));
    }
  }
  function miniCube(c) {
    var s = svgEl('svg', { viewBox: '0 0 70 76' }), P = cubePolys(35, 72, 0), C = COLORS[c];
    s.appendChild(svgEl('polygon', { points: pstr(P.left), fill: C.l }));
    s.appendChild(svgEl('polygon', { points: pstr(P.right), fill: C.r }));
    s.appendChild(svgEl('polygon', { points: pstr(P.top), fill: C.t, stroke: C.e, 'stroke-width': 1.5 }));
    return s;
  }
  // ---------- voxels ----------
  function normalize(vox) {
    var ks = Object.keys(vox); if (!ks.length) return {};
    var mx = Infinity, my = Infinity; ks.forEach(function (k) { var a = k.split(',').map(Number); mx = Math.min(mx, a[0]); my = Math.min(my, a[1]); });
    var out = {}; ks.forEach(function (k) { var a = k.split(',').map(Number); out[key(a[0] - mx, a[1] - my, a[2])] = vox[k]; }); return out;
  }
  function rotateVox(vox, G) { var out = {}; Object.keys(vox).forEach(function (k) { var a = k.split(',').map(Number); out[key(G - 1 - a[1], a[0], a[2])] = vox[k]; }); return out; }
  function same(a, b) { var ka = Object.keys(a), kb = Object.keys(b); if (ka.length !== kb.length) return false; for (var i = 0; i < ka.length; i++) if (b[ka[i]] !== a[ka[i]]) return false; return true; }
  function equalAnyRot(a, b, G) { var na = normalize(a), r = b; for (var i = 0; i < 4; i++) { if (same(na, normalize(r))) return true; r = rotateVox(r, G); } return false; }
  function hiddenCount(vox) { var n = 0; Object.keys(vox).forEach(function (k) { var a = k.split(',').map(Number); if (vox[key(a[0] + 1, a[1], a[2])] != null && vox[key(a[0], a[1] + 1, a[2])] != null && vox[key(a[0], a[1], a[2] + 1)] != null) n++; }); return n; }
  // Genera una construcción aleatoria conectada y apoyada
  function genTarget(lv, G) {
    var cfg = { 1: [3, 4, 0, 2], 2: [5, 7, 2, 3], 3: [8, 12, 3, 4], 4: [12, 16, 3, 6] }[lv];
    var n = cfg[0] + KidsGame.rand(cfg[1] - cfg[0] + 1), zmax = cfg[2], ncol = cfg[3];
    var pal = KidsGame.shuffle([0, 1, 2, 3, 4, 5]).slice(0, ncol);
    var best = null;
    for (var tries = 0; tries < 60; tries++) {
      var vox = {}, cx = Math.floor(G / 2) - 1 + KidsGame.rand(2), cy = Math.floor(G / 2) - 1 + KidsGame.rand(2);
      vox[key(cx, cy, 0)] = KidsGame.pick(pal);
      var guard = 0;
      while (Object.keys(vox).length < n && guard++ < 400) {
        var ks = Object.keys(vox), k = KidsGame.pick(ks), a = k.split(',').map(Number);
        var dirs = [[1, 0, 0], [-1, 0, 0], [0, 1, 0], [0, -1, 0]]; if (zmax > 0) { dirs.push([0, 0, 1]); dirs.push([0, 0, 1]); }
        var d = KidsGame.pick(dirs), x = a[0] + d[0], y = a[1] + d[1], z = a[2] + d[2];
        if (x < 0 || y < 0 || x >= G || y >= G || z < 0 || z > zmax) continue;
        if (vox[key(x, y, z)] != null) continue;
        if (z > 0 && vox[key(x, y, z - 1)] == null) continue;
        vox[key(x, y, z)] = KidsGame.pick(pal);
      }
      best = vox;
      if (lv === 4 && hiddenCount(vox) > 0) break;
      if (lv === 3 && Object.keys(vox).some(function (q) { return +q.split(',')[2] >= 2; })) break;
      if (lv < 3) break;
    }
    return best;
  }

  // ---------- DOM ----------
  game.innerHTML = '';
  var hud = el('div', 'hud'), left = el('div', 'grp'), right = el('div', 'grp');
  var lvlBtn = el('button', 'btn round yellow', '🎚️'); lvlBtn.setAttribute('aria-label', 'Nivel');
  var badge = el('span'), cntEl = el('span', 'cnt');
  var peekBtn = el('button', 'btn round purple', '👀'); peekBtn.setAttribute('aria-label', 'Ver');
  var rotBtn = el('button', 'btn round blue', '↻'); rotBtn.setAttribute('aria-label', 'Girar');
  var eraseBtn = el('button', 'btn round', '🧹'); eraseBtn.setAttribute('aria-label', 'Quitar');
  var freeBtn = el('button', 'btn round', '🎨'); freeBtn.setAttribute('aria-label', 'Libre');
  var chkBtn = el('button', 'btn green chk', '✔ Comparar');
  left.appendChild(lvlBtn); left.appendChild(badge); left.appendChild(cntEl);
  right.appendChild(peekBtn); right.appendChild(freeBtn); right.appendChild(eraseBtn); right.appendChild(rotBtn); right.appendChild(chkBtn);
  hud.appendChild(left); hud.appendChild(right);
  var wrap = el('div', 'wrap'), stageBox = el('div', 'stagebox'), side = el('div', 'side');
  var svg = svgEl('svg', { 'class': 'stage' }); stageBox.appendChild(svg);
  var target = el('div', 'target panel'); target.appendChild(el('div', 'ttl', 'Construye esto:')); var tsvg = svgEl('svg', {}); target.appendChild(tsvg); target.appendChild(el('div', 'q', '❓'));
  var palette = el('div', 'palette panel'), slots = el('div', 'slots panel');
  side.appendChild(target); side.appendChild(palette); side.appendChild(slots);
  wrap.appendChild(stageBox); wrap.appendChild(side);
  var timer = el('div', 'timer'); timer.appendChild(el('i'));
  var cl1 = el('div', 'cloud'), cl2 = el('div', 'cloud'); cl1.style.cssText = 'left:6%;top:90px;animation-delay:-2s'; cl2.style.cssText = 'right:8%;top:120px;width:100px;animation-delay:-4s';
  game.appendChild(cl1); game.appendChild(cl2); game.appendChild(hud); game.appendChild(wrap); game.appendChild(timer);

  var level = 1, G = 5, vox = {}, tgt = {}, tgtView = {}, round = 0, color = 0, erase = false, free = false, busy = false;
  var peeks = 2, hidden = false, hideTimer = null, peekTimer = null, raf = null, press = null;

  function pickLevel() {
    clearTimers(); busy = true;
    KidsGame.levelPicker({ labels: LABELS, onPick: function (n) { level = n; G = n >= 3 ? 6 : 5; round = 0; free = false; start(); } });
  }
  function clearTimers() { clearTimeout(hideTimer); clearTimeout(peekTimer); cancelAnimationFrame(raf); timer.style.display = 'none'; }
  function layout() {
    var W = game.clientWidth, Hh = game.clientHeight;
    wrap.className = 'wrap' + (Hh > W ? ' portrait' : '');
  }
  function setHud() {
    badge.innerHTML = ''; badge.appendChild(KidsGame.levelBadge(level));
    cntEl.textContent = free ? '🎨 Libre' : (round + 1) + '/' + PER_LEVEL + ' · 🧱' + Object.keys(vox).length;
    peekBtn.style.display = (level === 4 && !free) ? '' : 'none';
    peekBtn.textContent = '👀' + (peeks > 0 ? peeks : ''); peekBtn.classList.toggle('off', peeks <= 0);
    eraseBtn.classList.toggle('on', erase);
    freeBtn.classList.toggle('on', free);
    chkBtn.textContent = free ? '📷 Listo' : '✔ Comparar';
    target.style.display = free ? 'none' : ''; slots.style.display = free ? '' : 'none';
  }
  function buildPalette() {
    palette.innerHTML = '';
    COLORS.forEach(function (c, i) { var s = el('div', 'sw'); s.appendChild(miniCube(i)); s.dataset.c = i; onTap(s, function () { setColor(i); }); palette.appendChild(s); });
  }
  function setColor(i) { color = i; erase = false; var sw = palette.querySelectorAll('.sw'); for (var j = 0; j < sw.length; j++) sw[j].classList.toggle('sel', +sw[j].dataset.c === i); setHud(); KidsGame.sound.tap(); }
  function draw() { render(svg, vox, G, true); setHud(); }
  function drawTarget() { render(tsvg, tgtView, G, false, true); }
  function start() {
    clearTimers(); busy = false; hidden = false; peeks = 2; erase = false; vox = {}; layout(); buildPalette();
    if (free) { setColor(KidsGame.rand(6)); draw(); renderSlots(); KidsGame.say('Construye lo que quieras'); return; }
    tgt = genTarget(level, G);
    // Nivel 3-4: el modelo se muestra girado
    tgtView = tgt; if (level >= 3) { var r = 1 + KidsGame.rand(3); for (var i = 0; i < r; i++) tgtView = rotateVox(tgtView, G); }
    target.classList.remove('hid'); drawTarget();
    setColor(+Object.keys(tgt).map(function (k) { return tgt[k]; })[0]);
    draw();
    if (level === 4) {
      timer.style.display = 'block'; animTimer(8000);
      hideTimer = setTimeout(function () { setHidden(true); }, 8000);
      KidsGame.say('Mira bien. El modelo se va a esconder. Hay bloques escondidos.');
    } else KidsGame.say(level === 3 ? 'Construye lo mismo. Puedes girar tu construcción.' : 'Construye lo mismo que el modelo');
  }
  function setHidden(h) { hidden = h; timer.style.display = 'none'; target.classList.toggle('hid', h); }
  function animTimer(ms) {
    var bar = timer.firstChild, t0 = Date.now(); cancelAnimationFrame(raf);
    (function step() { var f = 1 - (Date.now() - t0) / ms; bar.style.transform = 'scaleX(' + Math.max(0, f) + ')'; if (f > 0) raf = requestAnimationFrame(step); })();
  }
  function peek() {
    if (level !== 4 || free || busy || peeks <= 0 || !hidden) { if (peeks <= 0) KidsGame.sound.wrong(); return; }
    peeks--; setHud(); KidsGame.sound.pop(); setHidden(false); timer.style.display = 'block'; animTimer(3000);
    peekTimer = setTimeout(function () { setHidden(true); }, 3000);
  }
  // ---------- construir ----------
  function topOf(x, y) { var z = -1; while (vox[key(x, y, z + 1)] != null) z++; return z; }
  function addAt(x, y) {
    var z = topOf(x, y) + 1;
    if (z >= HMAX) { KidsGame.sound.wrong(); KidsGame.toast('¡Muy alto!', 800); return false; }
    vox[key(x, y, z)] = color; draw();
    var g = svg.querySelector('[data-k="' + key(x, y, z) + '"]'); if (g) g.classList.add('new');
    KidsGame.sound.pop(); KidsGame.vibrate(15);
    return true;
  }
  function removeAt(x, y) {
    var z = topOf(x, y); if (z < 0) return false;
    delete vox[key(x, y, z)]; draw(); KidsGame.sound.tap(); return true;
  }
  function cellFromEvent(e) {
    var t = e.target; if (!t || !t.closest) return null;
    var g = t.closest('[data-k]'); if (g) { var a = g.getAttribute('data-k').split(',').map(Number); return { x: a[0], y: a[1] }; }
    var f = t.closest('[data-f]'); if (f) { var b = f.getAttribute('data-f').split(',').map(Number); return { x: b[0], y: b[1] }; }
    return null;
  }
  svg.addEventListener('pointerdown', function (e) {
    if (busy) return; e.preventDefault();
    var c = cellFromEvent(e); if (!c) return;
    press = { c: c, id: e.pointerId, x: e.clientX, y: e.clientY, done: false };
    press.t = setTimeout(function () { if (press && !press.done) { press.done = true; removeAt(c.x, c.y); } }, 550);
  });
  document.addEventListener('pointermove', function (e) { if (press && e.pointerId === press.id && Math.abs(e.clientX - press.x) + Math.abs(e.clientY - press.y) > 12) { clearTimeout(press.t); press = null; } });
  function endPress(e) {
    if (!press || e.pointerId !== press.id) return;
    clearTimeout(press.t); var p = press; press = null;
    if (p.done) return;
    if (erase) removeAt(p.c.x, p.c.y); else addAt(p.c.x, p.c.y);
  }
  document.addEventListener('pointerup', endPress); document.addEventListener('pointercancel', function () { if (press) clearTimeout(press.t); press = null; });

  function rotateMine() { if (!Object.keys(vox).length) { KidsGame.toast('Pon bloques', 800); return; } vox = rotateVox(vox, G); draw(); KidsGame.sound.tap(); }
  function sparkle(px, py, n) {
    var r = game.getBoundingClientRect();
    for (var i = 0; i < (n || 12); i++) {
      var s = el('div', 'spark'), a = Math.random() * Math.PI * 2, d = 40 + Math.random() * 70;
      s.style.left = (px - r.left - 7) + 'px'; s.style.top = (py - r.top - 7) + 'px';
      s.style.setProperty('--dx', (Math.cos(a) * d).toFixed(0) + 'px'); s.style.setProperty('--dy', (Math.sin(a) * d).toFixed(0) + 'px');
      game.appendChild(s); (function (q) { setTimeout(function () { q.remove(); }, 800); })(s);
    }
  }
  function check() {
    if (busy) return;
    var n = Object.keys(vox).length, sr = svg.getBoundingClientRect();
    if (free) {
      if (n < 2) { KidsGame.toast('Pon más bloques', 1000); KidsGame.sound.wrong(); return; }
      KidsGame.addStar(); KidsGame.sound.win(); KidsGame.confetti(30); sparkle(sr.left + sr.width / 2, sr.top + sr.height / 2, 30); KidsGame.say('¡Qué construcción tan bonita!'); return;
    }
    if (equalAnyRot(vox, tgt, G)) { win(); return; }
    KidsGame.sound.wrong(); KidsGame.vibrate(60);
    var m = Object.keys(tgt).length;
    if (level <= 2) { KidsGame.toast(n < m ? 'Faltan ' + (m - n) + ' bloques' : n > m ? 'Sobran ' + (n - m) : 'Mira los colores y el lugar', 1600); KidsGame.say(n < m ? 'Faltan bloques' : n > m ? 'Sobran bloques' : 'Mira los colores y el lugar'); }
    else { KidsGame.toast('Todavía no es igual', 1400); KidsGame.say('Todavía no es igual. Mira bien.'); }
  }
  function win() {
    busy = true; clearTimers(); setHidden(false);
    KidsGame.addStar(); KidsGame.sound.win();
    var sr = svg.getBoundingClientRect(); sparkle(sr.left + sr.width / 2, sr.top + sr.height / 2, 30);
    var last = round + 1 >= PER_LEVEL;
    if (last) KidsGame.levelDone(level);
    setTimeout(function () {
      KidsGame.celebrate({ msg: last ? '¡Nivel completado!' : '¡Igualito!', sub: last ? 'Cinco construcciones' : 'Construcción ' + (round + 1) + ' de ' + PER_LEVEL,
        onNext: function () { round = (round + 1) % PER_LEVEL; start(); }, onAgain: function () { start(); } });
    }, 900);
  }
  // ---------- libre: guardar / cargar 3 espacios ----------
  function loadSlots() { try { return JSON.parse(localStorage.getItem('kg-bloques-slots') || '[null,null,null]'); } catch (e) { return [null, null, null]; } }
  function saveSlot(i) {
    if (!Object.keys(vox).length) { KidsGame.toast('Pon bloques primero', 1000); KidsGame.sound.wrong(); return; }
    var s = loadSlots(); s[i] = { G: G, v: vox };
    try { localStorage.setItem('kg-bloques-slots', JSON.stringify(s)); } catch (e) {}
    KidsGame.sound.ok(); KidsGame.toast('Guardado ' + (i + 1), 900); renderSlots();
  }
  function loadSlot(i) {
    var s = loadSlots()[i]; if (!s) { KidsGame.toast('Vacío. Toca 💾 para guardar', 1200); return; }
    vox = s.v; G = s.G || G; draw(); KidsGame.sound.pop(); KidsGame.say('Aquí está');
  }
  function renderSlots() {
    slots.innerHTML = ''; var s = loadSlots();
    for (var i = 0; i < 3; i++) (function (i) {
      var d = el('div', 'slot'), th = el('div', 'th'), sv = el('button', 'btn yellow sv', '💾');
      if (s[i]) { var m = svgEl('svg', {}); render(m, s[i].v, s[i].G || G, false, true); th.appendChild(m); } else th.textContent = (i + 1);
      onTap(th, function () { loadSlot(i); }); onTap(sv, function () { saveSlot(i); });
      d.appendChild(th); d.appendChild(sv); slots.appendChild(d);
    })(i);
  }
  function startFree() { free = true; G = 6; clearTimers(); start(); }

  onTap(lvlBtn, function () { KidsGame.sound.tap(); pickLevel(); });
  onTap(chkBtn, check);
  onTap(peekBtn, peek);
  onTap(rotBtn, rotateMine);
  onTap(eraseBtn, function () { erase = !erase; setHud(); KidsGame.sound.tap(); KidsGame.say(erase ? 'Toca un bloque para quitarlo' : 'Construir'); });
  onTap(freeBtn, function () { KidsGame.sound.tap(); if (free) { free = false; G = level >= 3 ? 6 : 5; start(); } else startFree(); });
  window.addEventListener('resize', layout);

  window.__bl = {
    get vox() { return vox; }, get tgt() { return tgt; }, get G() { return G; }, get level() { return level; }, get free() { return free; }, get hidden() { return hidden; }, get erase() { return erase; },
    svg: svg, add: addAt, remove: removeAt, rotate: rotateMine, check: check, setColor: setColor, startFree: startFree, save: saveSlot, load: loadSlot,
    copyTarget: function () { vox = JSON.parse(JSON.stringify(tgtView)); draw(); },
    set: function (l, r) { level = l; G = l >= 3 ? 6 : 5; free = false; round = r || 0; start(); },
    floorPx: function (x, y) { var p = svg.querySelector('[data-f="' + x + ',' + y + '"]'); var r = p.getBoundingClientRect(); return [r.left + r.width / 2, r.top + r.height / 2]; },
    cubePx: function (k) { var p = svg.querySelector('[data-k="' + k + '"] polygon:nth-child(3)'); var r = p.getBoundingClientRect(); return [r.left + r.width / 2, r.top + r.height / 2]; }
  };
  pickLevel();
})();
</script>
