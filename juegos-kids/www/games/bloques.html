<!DOCTYPE html>
<html lang="es">
<head>

<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<link rel="stylesheet" href="../common.css">
<title>Construye</title>
<style>
  /* La ciudad de bloques: cielo, edificios de colores al fondo y suelo de obra */
  .game { background: radial-gradient(ellipse at 50% 100%, rgba(255,255,255,.55), rgba(255,255,255,0) 60%), linear-gradient(180deg, #7ed6ff 0%, #bfeeff 50%, #ffe9a8 100%); }
  .game::before { content: ""; position: absolute; inset: 0; pointer-events: none;
    background: radial-gradient(ellipse 200px 70px at 20% 20%, rgba(255,255,255,.9), rgba(255,255,255,0) 70%), radial-gradient(ellipse 240px 80px at 80% 28%, rgba(255,255,255,.85), rgba(255,255,255,0) 70%); }
  .city { position: absolute; left: 0; right: 0; bottom: 0; height: 34%; pointer-events: none; z-index: 0; }
  .city svg { width: 100%; height: 100%; display: block; }
  .beaver { position: absolute; left: 10px; bottom: 6px; width: 130px; height: 150px; pointer-events: none; z-index: 2; }
  .beaver svg { width: 100%; height: 100%; overflow: visible; animation: float 3.4s ease-in-out infinite; }
  .beaver .hammer { transform-origin: 96px 92px; transition: transform .3s; }
  .beaver.cheer .hammer { animation: hammer .3s ease-in-out 4; }
  @keyframes hammer { 0%,100% { transform: rotate(0); } 50% { transform: rotate(-60deg); } }
  .beaver .beyes { animation: mzblink 4.5s infinite; transform-box: fill-box; transform-origin: center; }
  .beaver.cheer .bhead { animation: nodB .3s ease-in-out 3; transform-origin: 60px 70px; }
  @keyframes nodB { 0%,100% { transform: rotate(0); } 50% { transform: rotate(-10deg); } }
  .wrap.portrait ~ .beaver, .beaver.small { width: 90px; height: 104px; }
  .gallery { display: flex; gap: 8px; align-items: center; padding: 6px 10px; border-radius: 22px; width: 220px; overflow-x: auto; overflow-y: hidden; }
  .wrap.portrait .gallery { width: auto; max-width: 480px; }
  .gallery .th { width: 60px; height: 60px; flex: 0 0 auto; border-radius: 14px; background: linear-gradient(180deg,#fff,#eef2ff); box-shadow: 0 4px 0 #c9d2e6, 0 8px 12px rgba(0,0,0,.2); display: flex; align-items: center; justify-content: center; cursor: pointer; animation: pop .35s; }
  .gallery .th svg { width: 52px; height: 52px; }
  .gallery .lbl { font-size: 15px; color: #1f2f6b; white-space: nowrap; }
  .rbanner { position: fixed; left: 50%; top: 40%; transform: translate(-50%, -50%) scale(.6); opacity: 0; z-index: 30; pointer-events: none; padding: 14px 34px; border-radius: 40px;
    background: linear-gradient(180deg, #fff, #eef2ff); border: 4px solid #fff; box-shadow: 0 8px 0 #c9d2e6, 0 18px 30px rgba(0,0,0,.3); font-size: 32px; font-weight: 900; color: #1f2f6b; text-align: center; white-space: nowrap;
    transition: transform .35s cubic-bezier(.3,1.4,.5,1), opacity .3s; display: flex; align-items: center; gap: 12px; }
  .rbanner.show { transform: translate(-50%, -50%) scale(1); opacity: 1; }
  .rbanner small { display: block; font-size: 18px; color: #6b7a99; }
  .rbanner .emoji { font-size: 44px; }
  .streak { position: fixed; left: 50%; top: 80px; transform: translateX(-50%) scale(0); z-index: 31; pointer-events: none; padding: 4px 18px; border-radius: 30px; font-size: 22px; font-weight: 900; color: #fff;
    background: linear-gradient(180deg, #ff9f43, #ff6f61); box-shadow: 0 4px 0 #b8306f, 0 8px 14px rgba(0,0,0,.25); text-shadow: 0 2px 0 rgba(0,0,0,.25); transition: transform .3s cubic-bezier(.3,1.5,.5,1); white-space: nowrap; }
  .streak.show { transform: translateX(-50%) scale(1); }
  .stagebox.enter svg { animation: stageIn .45s cubic-bezier(.3,1.3,.5,1); }
  @keyframes stageIn { from { transform: scale(.9) translateY(16px); opacity: 0; } to { transform: none; opacity: 1; } }
  .target.enter { animation: pop .4s ease-out; }
  .hud { position: absolute; left: 8px; right: 8px; top: 8px; height: 64px; display: flex; align-items: center; justify-content: space-between; gap: 8px; z-index: 3; }
  .hud .grp { display: flex; align-items: center; gap: 8px; }
  .hud .btn { font-size: 24px; }
  .hud .btn.off { opacity: .45; filter: grayscale(.7); }
  .hud .btn.on { outline: 4px solid #fff; outline-offset: 2px; }
  .hud .btn.chk { font-size: 24px; padding: 8px 18px; white-space: nowrap; }
  .hud .cnt { font-size: 18px; padding: 4px 12px; border-radius: 20px; background: linear-gradient(180deg,#fff,#eef2ff); color: #1f2f6b; box-shadow: 0 3px 0 #c9d2e6, 0 6px 10px rgba(0,0,0,.2); white-space: nowrap; }
  .wrap { position: absolute; left: 8px; right: 8px; top: 78px; bottom: 8px; display: flex; gap: 10px; }
  .wrap.portrait { flex-direction: column; }
  .stagebox { flex: 1 1 auto; min-width: 0; min-height: 0; display: flex; align-items: center; justify-content: center; }
  svg.stage { width: 100%; height: 100%; display: block; touch-action: none; }
  .side { flex: 0 0 auto; display: flex; flex-direction: column; gap: 10px; align-items: center; width: 230px; }
  .wrap.portrait .side { flex-direction: row; width: auto; height: 150px; justify-content: center; }
  .target { width: 220px; height: 190px; display: flex; flex-direction: column; align-items: center; justify-content: center; position: relative; border-radius: 22px; }
  .wrap.portrait .target { width: 230px; height: 150px; }
  .target .ttl { position: absolute; top: 6px; left: 0; right: 0; text-align: center; font-size: 17px; color: #1f2f6b; }
  .target svg { width: 92%; height: 78%; margin-top: 14px; }
  .target.hid svg { opacity: 0; }
  .target .q { position: absolute; inset: 0; display: none; align-items: center; justify-content: center; font-size: 70px; }
  .target.hid .q { display: flex; }
  .palette { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; padding: 8px; border-radius: 22px; width: 220px; }
  .wrap.portrait .palette { width: auto; height: 150px; align-content: center; max-width: 480px; }
  .sw { width: 64px; height: 64px; border-radius: 16px; display: flex; align-items: center; justify-content: center; cursor: pointer; background: linear-gradient(180deg, rgba(255,255,255,.8), rgba(230,235,255,.8)); box-shadow: 0 4px 0 #c9d2e6, 0 6px 10px rgba(0,0,0,.15); transition: transform .12s; }
  .sw svg { width: 50px; height: 50px; }
  .sw.sel { transform: scale(1.12); outline: 5px solid #fff; outline-offset: 2px; box-shadow: 0 4px 0 #c9d2e6, 0 0 0 9px rgba(255,255,255,.4), 0 6px 10px rgba(0,0,0,.2); }
  .sw.eraser { font-size: 34px; }
  .slots { display: flex; gap: 10px; justify-content: center; padding: 8px 10px; border-radius: 22px; width: 220px; }
  .wrap.portrait .slots { width: auto; }
  .slot { width: 64px; display: flex; flex-direction: column; gap: 4px; align-items: center; }
  .slot .th { width: 64px; height: 64px; border-radius: 14px; background: linear-gradient(180deg,#fff,#e9eeff); box-shadow: 0 4px 0 #c9d2e6, 0 6px 10px rgba(0,0,0,.15); display: flex; align-items: center; justify-content: center; font-size: 28px; color: #9aa6c8; cursor: pointer; }
  .slot .th svg { width: 56px; height: 56px; }
  .slot .sv { font-size: 18px; min-height: 36px; min-width: 64px; padding: 2px 8px; border-radius: 14px; }
  .spark { position: absolute; width: 14px; height: 14px; border-radius: 50%; pointer-events: none; z-index: 20;
    background: radial-gradient(circle at 35% 35%, #fff, #ffd54a 60%, #ff9f1c); box-shadow: 0 0 10px #ffe680; animation: spk .7s ease-out forwards; }
  @keyframes spk { 0% { transform: translate(0,0) scale(1); opacity: 1; } 100% { transform: translate(var(--dx), var(--dy)) scale(.2); opacity: 0; } }
  .timer { position: absolute; left: 50%; top: 82px; transform: translateX(-50%); width: 160px; height: 14px; border-radius: 10px; background: rgba(0,0,0,.25); z-index: 4; overflow: hidden; display: none; box-shadow: inset 0 2px 4px rgba(0,0,0,.3); }
  .timer i { display: block; height: 100%; width: 100%; background: linear-gradient(180deg,#ffe98a,#ffb703); box-shadow: inset 0 2px 0 rgba(255,255,255,.6); transform-origin: left; }
  .cube.new { animation: drop .25s ease-out; transform-box: fill-box; transform-origin: center; }
  @keyframes drop { 0% { transform: translateY(-20px) scale(1.05); opacity: .4; } 100% { transform: translateY(0) scale(1); opacity: 1; } }
  .floor polygon { cursor: pointer; }
  .floor polygon:active { fill: #fff; }
  .cloud { position: absolute; width: 140px; height: 50px; border-radius: 40px; background: #fff; opacity: .8; z-index: 0; animation: float 6s ease-in-out infinite; filter: drop-shadow(0 6px 6px rgba(0,60,120,.15)); }
  .cloud::before { content: ""; position: absolute; left: 30px; top: -24px; width: 60px; height: 60px; border-radius: 50%; background: #fff; }
  @media (max-width: 820px) { .hud .btn.chk { padding: 6px 10px; font-size: 19px; min-height: 56px; } .hud .btn.round { width: 56px; height: 56px; min-width: 56px; min-height: 56px; font-size: 22px; } .hud .grp { gap: 5px; } .hud .cnt { font-size: 15px; padding: 4px 8px; } .hud { gap: 6px; } }
</style>
</head>

<script>
(function () {
  var game = KidsGame.init({ title: 'Construye' });
  var COLORS = [
    { n: 'rojo',    t: '#ff8fa3', l: '#e63960', r: '#a3183e', e: '#ffd0da' },
    { n: 'amarillo', t: '#fff1a8', l: '#ffcf2e', r: '#c78f00', e: '#fffbe0' },
    { n: 'verde',   t: '#b3f7c9', l: '#2fd37a', r: '#157a43', e: '#e3ffee' },
    { n: 'azul',    t: '#a9dcff', l: '#2f95e8', r: '#1a4f9c', e: '#e0f2ff' },
    { n: 'morado',  t: '#d9c8ff', l: '#8f6cf0', r: '#5232b3', e: '#f0e9ff' },
    { n: 'naranja', t: '#ffd2a8', l: '#ff8906', r: '#b85a00', e: '#fff0e0' }
  ];
  var TW = 34, TH = 17, HZ = 34, HMAX = 4;
  var SETS = [
    { id: 'clasico', n: 'Clásico', e: '🧱', lv: 0, c: COLORS.map(function (c) { return { t: c.t, l: c.l, r: c.r, e: c.e }; }) },
    { id: 'pastel', n: 'Pastel', e: '🍥', lv: 1, c: [{ t: '#ffd6e0', l: '#ff9fb6', r: '#d16b85', e: '#fff0f4' }, { t: '#fff6c2', l: '#ffe08a', r: '#d1ab45', e: '#fffbe6' }, { t: '#d7f7df', l: '#9fe3b1', r: '#5fb37a', e: '#eefcf2' }, { t: '#d6ecff', l: '#9fcdff', r: '#5f92d1', e: '#eef6ff' }, { t: '#ead9ff', l: '#c4a6ff', r: '#8b6bd1', e: '#f5eeff' }, { t: '#ffe3cc', l: '#ffbd8a', r: '#d18a52', e: '#fff3e8' }] },
    { id: 'neon', n: 'Neón', e: '✨', lv: 2, c: [{ t: '#ff9fe5', l: '#ff2bd6', r: '#9c0a80', e: '#ffd6f5' }, { t: '#fff59f', l: '#ffe812', r: '#998a09', e: '#fffbd6' }, { t: '#c6ff9f', l: '#7bff12', r: '#3e9909', e: '#e8ffd6' }, { t: '#9ff5ff', l: '#12d6ff', r: '#0a7f99', e: '#d6fbff' }, { t: '#d49fff', l: '#a812ff', r: '#5f0999', e: '#eed6ff' }, { t: '#ffc59f', l: '#ff7a12', r: '#994509', e: '#ffe6d6' }] },
    { id: 'tierra', n: 'Tierra', e: '🪵', lv: 3, c: [{ t: '#e6b8a2', l: '#b86f55', r: '#733f2c', e: '#f5e0d6' }, { t: '#f0dcae', l: '#c9a35e', r: '#7d6232', e: '#f9efd6' }, { t: '#c9d9a8', l: '#8aa35a', r: '#4f6330', e: '#e8f0d6' }, { t: '#b8c9d9', l: '#6f8aa3', r: '#3f5366', e: '#dde8f0' }, { t: '#d9c4d9', l: '#a37fa3', r: '#664566', e: '#f0e5f0' }, { t: '#e0c9a8', l: '#b8905a', r: '#735a33', e: '#f3e8d6' }] },
    { id: 'joyas', n: 'Joyas', e: '💎', lv: 4, c: [{ t: '#ff8a8a', l: '#d61f1f', r: '#7a0c0c', e: '#ffd1d1' }, { t: '#ffe88a', l: '#e6b800', r: '#8f7100', e: '#fff6cc' }, { t: '#8af0a8', l: '#0f9d58', r: '#06582f', e: '#d1f7dc' }, { t: '#8ad4ff', l: '#0e7bbf', r: '#064a78', e: '#d1edff' }, { t: '#d1a3ff', l: '#7a1fd1', r: '#4a0c87', e: '#ecd9ff' }, { t: '#ffc48a', l: '#e06a00', r: '#8a3f00', e: '#ffe6cc' }] }
  ];
  var cset = SETS[0];
  try { var sid = localStorage.getItem('kg-bloques-set'); SETS.forEach(function (q) { if (q.id === sid) cset = q; }); } catch (e) {}
  function doneLv() { try { return JSON.parse(localStorage.getItem('kg-done') || '{}').bloques || {}; } catch (e) { return {}; } }
  function setOpen(q) { return !q.lv || !!doneLv()[q.lv]; }
  function applySet() { cset.c.forEach(function (c, i) { COLORS[i].t = c.t; COLORS[i].l = c.l; COLORS[i].r = c.r; COLORS[i].e = c.e; }); }
  applySet();
  var HOWTO = [{ icon: '👀', text: 'Mira el modelo de la tarjeta' }, { icon: '👆', text: 'Toca el suelo para poner bloques' }, { icon: '✔', text: 'Toca Comparar' }];
  // Castor constructor (hero art): casco, martillo y dientes
  function beaverSVG(size) {
    return '<svg viewBox="0 0 130 150"' + (size ? ' width="' + size + '" height="' + Math.round(size * 1.15) + '"' : '') + '><defs><radialGradient id="bvf" cx="38%" cy="32%" r="75%"><stop offset="0" stop-color="#c9875a"/><stop offset=".6" stop-color="#9c5a2e"/><stop offset="1" stop-color="#5e3410"/></radialGradient><linearGradient id="bvh" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffe98a"/><stop offset="1" stop-color="#ffb703"/></linearGradient></defs>' +
      '<ellipse cx="62" cy="144" rx="44" ry="6" fill="rgba(0,0,0,.2)"/>' +
      '<path d="M28 126 C 6 128, 4 112, 18 106 C 30 102, 40 112, 36 124 Z" fill="#5e3410"/><path d="M14 112 L 32 110 M 12 120 L 30 118" stroke="#3f2208" stroke-width="2"/>' +
      '<ellipse cx="62" cy="108" rx="34" ry="34" fill="url(#bvf)"/><ellipse cx="62" cy="114" rx="20" ry="22" fill="#e8b98a"/>' +
      '<ellipse cx="38" cy="140" rx="12" ry="6" fill="#5e3410"/><ellipse cx="86" cy="140" rx="12" ry="6" fill="#5e3410"/>' +
      '<g class="hammer"><rect x="92" y="60" width="8" height="40" rx="3" fill="#b8783a"/><rect x="80" y="50" width="32" height="16" rx="4" fill="#7c8494"/><rect x="80" y="50" width="32" height="5" rx="2" fill="#b8c2d0"/></g>' +
      '<circle cx="90" cy="98" r="8" fill="url(#bvf)"/><circle cx="34" cy="98" r="8" fill="url(#bvf)"/>' +
      '<g class="bhead"><circle cx="62" cy="62" r="30" fill="url(#bvf)"/><circle cx="36" cy="46" r="8" fill="url(#bvf)"/><circle cx="88" cy="46" r="8" fill="url(#bvf)"/>' +
      '<ellipse cx="62" cy="74" rx="16" ry="12" fill="#e8b98a"/><ellipse cx="62" cy="66" rx="6" ry="4.5" fill="#2b2b2b"/><ellipse cx="60" cy="65" rx="2" ry="1.2" fill="#fff" opacity=".7"/>' +
      '<rect x="56" y="76" width="6" height="9" rx="1.5" fill="#fff" stroke="#c9d2e6" stroke-width="1"/><rect x="62" y="76" width="6" height="9" rx="1.5" fill="#fff" stroke="#c9d2e6" stroke-width="1"/>' +
      '<g class="beyes"><ellipse cx="50" cy="56" rx="5.5" ry="6.5" fill="#fff"/><ellipse cx="74" cy="56" rx="5.5" ry="6.5" fill="#fff"/><circle cx="51" cy="57" r="3.2" fill="#2b2b2b"/><circle cx="75" cy="57" r="3.2" fill="#2b2b2b"/><circle cx="52.5" cy="55.5" r="1.2" fill="#fff"/><circle cx="76.5" cy="55.5" r="1.2" fill="#fff"/></g>' +
      '<circle cx="42" cy="68" r="4.5" fill="#ff8aa8" opacity=".45"/><circle cx="82" cy="68" r="4.5" fill="#ff8aa8" opacity=".45"/>' +
      '<path d="M30 42 Q 62 8 94 42 Z" fill="url(#bvh)" stroke="#c47f00" stroke-width="2" stroke-linejoin="round"/><rect x="26" y="40" width="72" height="9" rx="4.5" fill="#ffb703" stroke="#c47f00" stroke-width="2"/><rect x="58" y="16" width="8" height="26" rx="3" fill="#fff" opacity=".5"/></g></svg>';
  }
  var LABELS = { 1: '3-4 bloques', 2: '5-7 · apilar', 3: '8-12 · girado', 4: '12-16 · memoria' };
  var PER_LEVEL = 5;
  function el(tag, cls, txt) { var e = document.createElement(tag); if (cls) e.className = cls; if (txt != null) e.textContent = txt; return e; }
  function onTap(e, fn) { e.addEventListener('pointerdown', function (ev) { ev.preventDefault(); ev.stopPropagation(); fn(ev); }); }
  var NS = 'http://www.w3.org/2000/svg';
  function svgEl(tag, attrs) { var e = document.createElementNS(NS, tag); for (var k in attrs) e.setAttribute(k, attrs[k]); return e; }
  function key(x, y, z) { return x + ',' + y + ',' + z; }

  // ---------- render isométrico ----------
  function base(x, y, G) { return [(x - y) * TW + G * TW, (x + y) * TH + HZ * HMAX + TH + 6]; }
  function cubePolys(bx, by, z) {
    var top = by - (z + 1) * HZ, bot = by - z * HZ;
    return {
      top: [[bx, top - TH], [bx + TW, top], [bx, top + TH], [bx - TW, top]],
      left: [[bx - TW, top], [bx, top + TH], [bx, bot + TH], [bx - TW, bot]],
      right: [[bx, top + TH], [bx + TW, top], [bx + TW, bot], [bx, bot + TH]]
    };
  }
  function pstr(p) { return p.map(function (q) { return q[0] + ',' + q[1]; }).join(' '); }
  // Dibuja escena completa dentro de un svg (vox: {key: colorIdx}); interactive añade data-attrs
  function render(svg, vox, G, interactive, hideGrid) {
    svg.innerHTML = '';
    var W = 2 * TW * G, Hh = 2 * TH * G + HZ * HMAX + TH + 12;
    svg.setAttribute('viewBox', '0 0 ' + W + ' ' + Hh);
    var floor = svgEl('g', { 'class': 'floor' });
    // sombra del suelo
    var fx0 = 0, fy0 = 0, fx1 = G - 1, fy1 = G - 1;
    if (hideGrid && Object.keys(vox).length) { fx0 = fy0 = Infinity; fx1 = fy1 = -Infinity; Object.keys(vox).forEach(function (k) { var a = k.split(',').map(Number); fx0 = Math.min(fx0, a[0]); fy0 = Math.min(fy0, a[1]); fx1 = Math.max(fx1, a[0]); fy1 = Math.max(fy1, a[1]); }); }
    var c0 = base(fx0, fy0, G), c1 = base(fx1, fy0, G), c2 = base(fx1, fy1, G), c3 = base(fx0, fy1, G);
    floor.appendChild(svgEl('polygon', { points: pstr([[c0[0], c0[1] - TH + 6], [c1[0] + TW, c1[1] + 6], [c2[0], c2[1] + TH + 6], [c3[0] - TW, c3[1] + 6]]), fill: 'rgba(0,40,90,.18)' }));
    if (!hideGrid) for (var y = 0; y < G; y++) for (var x = 0; x < G; x++) {
      var b = base(x, y, G);
      var p = svgEl('polygon', { points: pstr([[b[0], b[1] - TH], [b[0] + TW, b[1]], [b[0], b[1] + TH], [b[0] - TW, b[1]]]), fill: (x + y) % 2 ? '#cfe9a3' : '#e4f5c2', stroke: '#9ccc65', 'stroke-width': 1 });
      if (interactive) { p.setAttribute('data-f', x + ',' + y); }
      floor.appendChild(p);
    }
    svg.appendChild(floor);
    var list = Object.keys(vox).map(function (k) { var a = k.split(',').map(Number); return { x: a[0], y: a[1], z: a[2], c: vox[k], k: k }; });
    list.sort(function (a, b) { return (a.x + a.y) - (b.x + b.y) || a.z - b.z; });
    var cubes = svgEl('g', { 'class': 'cubes' });
    list.forEach(function (v) {
      var b = base(v.x, v.y, G), P = cubePolys(b[0], b[1], v.z), C = COLORS[v.c];
      var g = svgEl('g', { 'class': 'cube' });
      if (interactive) { g.setAttribute('data-k', v.k); }
      g.appendChild(svgEl('polygon', { points: pstr(P.left), fill: C.l, stroke: C.r, 'stroke-width': 1, 'stroke-linejoin': 'round' }));
      g.appendChild(svgEl('polygon', { points: pstr(P.right), fill: C.r, stroke: C.r, 'stroke-width': 1, 'stroke-linejoin': 'round' }));
      g.appendChild(svgEl('polygon', { points: pstr(P.top), fill: C.t, stroke: C.e, 'stroke-width': 1.5, 'stroke-linejoin': 'round' }));
      // brillo en la cara superior
      g.appendChild(svgEl('polygon', { points: pstr([[b[0] - TW * .45, P.top[0][1] + TH * .55], [b[0], P.top[0][1] + TH * .25], [b[0] + TW * .45, P.top[0][1] + TH * .55], [b[0], P.top[0][1] + TH * .85]]), fill: 'rgba(255,255,255,.35)', 'pointer-events': 'none' }));
      cubes.appendChild(g);
    });
    svg.appendChild(cubes);
    if (!interactive) { // encuadre ajustado al contenido (tarjeta modelo / miniaturas)

  onTap(eraseBtn, function () { erase = !erase; setHud(); KidsGame.sound.tap(); KidsGame.say(erase ? 'Toca un bloque para quitarlo' : 'Construir'); });
  onTap(freeBtn, function () { KidsGame.sound.tap(); if (free) { free = false; G = level >= 3 ? 6 : 5; start(); } else startFree(); });
  window.addEventListener('resize', layout);

  window.__bl = {
    get streak() { return streak; }, get set() { return cset.id; },
    get vox() { return vox; }, get tgt() { return tgt; }, get G() { return G; }, get level() { return level; }, get free() { return free; }, get hidden() { return hidden; }, get erase() { return erase; },
    svg: svg, add: addAt, remove: removeAt, rotate: rotateMine, check: check, setColor: setColor, startFree: startFree, save: saveSlot, load: loadSlot,
    copyTarget: function () { vox = JSON.parse(JSON.stringify(tgtView)); draw(); },
    set: function (l, r) { level = l; G = l >= 3 ? 6 : 5; free = false; round = r || 0; start(); },
    floorPx: function (x, y) { var p = svg.querySelector('[data-f="' + x + ',' + y + '"]'); var r = p.getBoundingClientRect(); return [r.left + r.width / 2, r.top + r.height / 2]; },
    cubePx: function (k) { var p = svg.querySelector('[data-k="' + k + '"] polygon:nth-child(3)'); var r = p.getBoundingClientRect(); return [r.left + r.width / 2, r.top + r.height / 2]; }
  };
  layout(); buildPalette(); draw(); setHud(); pickLevel();
})();
</script>
