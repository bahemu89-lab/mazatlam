<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<link rel="stylesheet" href="../common.css">
<title>Mi mascota</title>
<style>
  /* ===== Mundo: "Mi casita" — cuarto acogedor que cambia de día a noche; la mascota es un SVG que respira, parpadea y mueve la cola ===== */
  .game { display: flex; flex-direction: column; touch-action: none; overflow: hidden; background: linear-gradient(180deg, #ffe9f2, #ffd6e6); }
  .hud { flex: 0 0 auto; display: flex; align-items: center; justify-content: space-between; padding: 8px 10px 4px; gap: 8px; z-index: 5; }
  .hud .name { font-size: 24px; font-weight: 900; color: #fff; text-shadow: 0 2px 0 #c2427a, 0 4px 8px rgba(0,0,0,.25), -1px -1px 0 #c2427a, 1px -1px 0 #c2427a, -1px 1px 0 #c2427a, 1px 1px 0 #c2427a; }
  .hud .r { display: flex; gap: 8px; align-items: center; }
  .lvbtn, .cosbtn { font-size: 30px; }
  .cosbtn { font-size: 26px; }
  .meters { flex: 0 0 auto; margin: 2px 10px 6px; padding: 8px 12px; display: flex; flex-wrap: wrap; justify-content: center; gap: 6px 14px; z-index: 5; }
  .meter { display: flex; align-items: center; gap: 6px; }
  .meter .ic { font-size: 28px; }
  .meter .bar { width: 110px; height: 20px; border-radius: 12px; background: linear-gradient(180deg, #d5dceb, #edf1f9); box-shadow: inset 0 2px 4px rgba(0,0,0,.28), 0 1px 0 #fff; overflow: hidden; position: relative; }
  .meter .bar i { display: block; height: 100%; border-radius: 12px; width: 50%; transition: width .4s; background: linear-gradient(180deg, #8ef0b0, #24b36c); box-shadow: inset 0 3px 0 rgba(255,255,255,.55), inset 0 -2px 0 rgba(0,0,0,.12); }
  .meter .bar i.mid { background: linear-gradient(180deg, #ffe98a, #ffb703); }
  .meter .bar i.low { background: linear-gradient(180deg, #ff9a8b, #e63946); }
  .meter .bar i.full::after { content: ""; position: absolute; inset: 0; background: linear-gradient(90deg, rgba(255,255,255,0), rgba(255,255,255,.7), rgba(255,255,255,0)); width: 40%; animation: shine 1.6s linear infinite; }
  .meter.flash .ic { animation: pop .5s; }
  .room { flex: 1 1 auto; position: relative; margin: 0 10px 8px; border-radius: 28px; overflow: hidden; border: 4px solid #fff; box-shadow: 0 8px 0 #d9a7be, 0 16px 28px rgba(90,20,60,.25), inset 0 2px 0 #fff;
    background: repeating-linear-gradient(90deg, rgba(255,255,255,.18) 0 22px, rgba(255,255,255,0) 22px 44px), linear-gradient(180deg, #ffd9e8 0%, #f4bfd8 100%); transition: background .8s; }
  .room.pm { background: repeating-linear-gradient(90deg, rgba(255,255,255,.06) 0 22px, rgba(255,255,255,0) 22px 44px), linear-gradient(180deg, #6a5a9e 0%, #4a3c7e 100%); }
  .floor { position: absolute; left: 0; right: 0; bottom: 0; height: 34%; box-shadow: 0 -6px 14px rgba(0,0,0,.18);
    background: repeating-linear-gradient(90deg, rgba(0,0,0,.08) 0 2px, rgba(0,0,0,0) 2px 90px), linear-gradient(180deg, #d69a5c 0%, #b8763f 100%); }
  .board { position: absolute; left: 0; right: 0; bottom: 34%; height: 14px; background: linear-gradient(180deg, #fff, #e8d5dc); box-shadow: 0 3px 4px rgba(0,0,0,.2); }
  .rug { position: absolute; left: 50%; bottom: 3%; width: 62%; height: 22%; transform: translateX(-50%); border-radius: 50%;
    background: radial-gradient(ellipse at 50% 50%, #ffb3c7 0 38%, #ff7fa3 39% 56%, #ffb3c7 57% 78%, #e05a86 79%); box-shadow: 0 6px 12px rgba(0,0,0,.25), inset 0 -6px 0 rgba(0,0,0,.08); }
  .rug.azul { background: radial-gradient(ellipse at 50% 50%, #b3dcff 0 38%, #5fb0ff 39% 56%, #b3dcff 57% 78%, #2f7fd6 79%); }
  .window { position: absolute; left: 6%; top: 8%; width: 130px; height: 120px; border-radius: 16px; border: 8px solid #fff; overflow: hidden;
    background: linear-gradient(180deg, #7fd0ff, #d9f2ff); box-shadow: 0 6px 0 #d9a7be, 0 10px 18px rgba(0,0,0,.2), inset 0 0 30px rgba(255,255,255,.4); transition: background .8s; }
  .room.pm .window { background: linear-gradient(180deg, #0f1a4a, #2a3a7e); }
  .window::before { content: ""; position: absolute; left: 50%; top: 0; bottom: 0; width: 8px; margin-left: -4px; background: #fff; z-index: 2; }
  .window::after { content: ""; position: absolute; left: 0; right: 0; top: 50%; height: 8px; margin-top: -4px; background: #fff; z-index: 2; }
  .window .sun { position: absolute; right: 14px; top: 12px; width: 34px; height: 34px; border-radius: 50%; background: radial-gradient(circle at 40% 35%, #fff8c4, #ffd83d 70%); box-shadow: 0 0 20px 6px rgba(255,216,61,.6); transition: opacity .8s, transform .8s; }
  .window .moon { position: absolute; right: 14px; top: 12px; width: 32px; height: 32px; border-radius: 50%; background: radial-gradient(circle at 40% 35%, #fffdf0, #ffe9a8 70%); box-shadow: inset -9px -4px 0 #cbb57a, 0 0 18px 5px rgba(255,240,180,.5); opacity: 0; transform: translateY(20px); transition: opacity .8s, transform .8s; }
  .window .st { position: absolute; width: 4px; height: 4px; border-radius: 50%; background: #fff; opacity: 0; transition: opacity .8s; }
  .room.pm .sun { opacity: 0; transform: translateY(30px); } .room.pm .moon { opacity: 1; transform: none; } .room.pm .st { opacity: 1; }
  .window .cl { position: absolute; left: 10px; top: 30px; font-size: 30px; opacity: .95; animation: cloudmove 14s linear infinite; }
  .room.pm .cl { opacity: .25; }
  @keyframes cloudmove { from { transform: translateX(-50px); } to { transform: translateX(140px); } }
  .curtain { position: absolute; left: calc(6% - 12px); top: calc(8% - 12px); width: 40px; height: 150px; border-radius: 10px 4px 20px 20px; z-index: 1;
    background: linear-gradient(90deg, #ff8fb1, #ffc3d6 60%, #ff8fb1); box-shadow: 0 6px 10px rgba(0,0,0,.2), inset 0 -20px 0 rgba(0,0,0,.05); }
  .curtain.r { left: calc(6% + 130px - 28px); transform: scaleX(-1); }
  .bed { position: absolute; right: 4%; bottom: 8%; width: 200px; height: 110px; }
  .bed .head { position: absolute; right: 0; bottom: 30px; width: 26px; height: 110px; border-radius: 12px 12px 4px 4px; background: linear-gradient(90deg, #8b5a2b, #c68a4b 60%, #8b5a2b); box-shadow: 0 6px 10px rgba(0,0,0,.25); }
  .bed .mat { position: absolute; left: 0; right: 14px; bottom: 30px; height: 44px; border-radius: 12px; background: linear-gradient(180deg, #ffffff, #e9eef8); box-shadow: 0 6px 0 #c9d2e6, 0 10px 14px rgba(0,0,0,.22), inset 0 2px 0 #fff; }
  .bed .blanket { position: absolute; left: 0; right: 80px; bottom: 44px; height: 44px; border-radius: 14px 14px 6px 6px; background: linear-gradient(180deg, #b39cff, #7f5af0); box-shadow: inset 0 3px 0 rgba(255,255,255,.4), 0 4px 8px rgba(0,0,0,.2); }
  .bed .pillow { position: absolute; right: 22px; bottom: 60px; width: 62px; height: 34px; border-radius: 14px; background: linear-gradient(180deg, #fff, #ffe9a8); box-shadow: 0 4px 6px rgba(0,0,0,.2), inset 0 2px 0 #fff; }
  .bed .leg { position: absolute; bottom: 12px; width: 14px; height: 24px; background: linear-gradient(90deg, #6b3a14, #a2622b); border-radius: 0 0 6px 6px; }
  .bed .shadow { position: absolute; left: -10px; right: -10px; bottom: 4px; height: 20px; border-radius: 50%; background: rgba(0,0,0,.2); }
  /* Decoraciones desbloqueables */
  .deco { position: absolute; z-index: 1; pointer-events: none; display: none; }
  .deco.on { display: block; animation: pop .5s ease-out; }
  .deco.poster { right: 30%; top: 9%; width: 86px; height: 70px; border: 7px solid #fff; border-radius: 8px; background: linear-gradient(180deg, #9fdcff 0 55%, #8fd25a 55%); box-shadow: 0 5px 0 #d9a7be, 0 8px 14px rgba(0,0,0,.2); }
  .deco.poster::after { content: "🌈"; position: absolute; left: 10px; top: 4px; font-size: 32px; }
  .deco.plant { left: 32%; bottom: 36%; font-size: 54px; filter: drop-shadow(0 6px 4px rgba(0,0,0,.25)); }
  .deco.toybox { left: 4%; bottom: 10%; width: 96px; height: 60px; border-radius: 10px; background: linear-gradient(180deg, #ffd166, #f2a900); box-shadow: 0 6px 0 #b87a00, 0 10px 14px rgba(0,0,0,.25), inset 0 3px 0 rgba(255,255,255,.5); }
  .deco.toybox::after { content: "🧸⚽"; position: absolute; left: 10px; top: -26px; font-size: 32px; }
  .deco.garland { left: 0; right: 0; top: 0; height: 40px; background: radial-gradient(circle at 20px 18px, #ffd23f 0 8px, rgba(0,0,0,0) 9px) 0 0 / 60px 40px repeat-x, radial-gradient(circle at 50px 26px, #ff7eb6 0 8px, rgba(0,0,0,0) 9px) 0 0 / 60px 40px repeat-x; }
  .deco.garland::before { content: ""; position: absolute; left: 0; right: 0; top: 14px; height: 3px; background: #8a5a2b; }
  #lamp { position: absolute; right: 6%; top: 8%; z-index: 6; font-size: 36px; border-radius: 50%; width: 72px; height: 72px; padding: 0; --a: #ffe98a; --b: #ffb703; --d: #c47f00; transition: filter .4s; }
  #lamp.off { filter: grayscale(.8) brightness(.7); }
  .glow { position: absolute; right: calc(6% - 80px); top: calc(8% - 60px); width: 230px; height: 230px; border-radius: 50%; z-index: 1; pointer-events: none; opacity: 0; transition: opacity .8s;
    background: radial-gradient(circle, rgba(255,230,140,.55) 0, rgba(255,230,140,0) 70%); }
  .room.pm .glow { opacity: 1; }
  .room.pm.dark .glow { opacity: 0; }
  #pet { position: absolute; left: 50%; top: 48%; width: var(--ps); height: var(--ps); margin: calc(var(--ps) / -2) 0 0 calc(var(--ps) / -2); z-index: 2; cursor: pointer; touch-action: none; }
  #pet svg { width: 100%; height: 100%; overflow: visible; display: block; }
  #pet .breath { transform-box: fill-box; transform-origin: 50% 100%; animation: pbreath 3s ease-in-out infinite; }
  @keyframes pbreath { 0%,100% { transform: scale(1,1); } 50% { transform: scale(1.025,.975); } }
  #pet .tail { transform-box: fill-box; transform-origin: 10% 90%; animation: wag 1.1s ease-in-out infinite; }
  @keyframes wag { 0%,100% { transform: rotate(-14deg); } 50% { transform: rotate(14deg); } }
  #pet.mood-happy .tail, #pet.jump .tail, #pet.happy .tail { animation-duration: .35s; }
  #pet.mood-sleep .tail { animation: none; }
  #pet .e-open { transform-box: fill-box; transform-origin: 50% 50%; animation: pblink 4.3s infinite; }
  @keyframes pblink { 0%,92%,100% { transform: scaleY(1); } 95% { transform: scaleY(.1); } }
  #pet .e-closed, #pet .e-sad, #pet .m-frown, #pet .m-open, #pet .m-o, #pet .tear, #pet .sweat { opacity: 0; }
  #pet.mood-sleep .e-open, #pet.mood-sick .e-open { opacity: 0; } #pet.mood-sleep .e-closed, #pet.mood-sick .e-closed { opacity: 1; }
  #pet.mood-sad .e-sad, #pet.mood-sick .e-sad { opacity: 1; }
  #pet.mood-sad .m-smile, #pet.mood-sick .m-smile, #pet.mood-sleep .m-smile, #pet.mood-eat .m-smile { opacity: 0; }
  #pet.mood-sad .m-frown, #pet.mood-sick .m-frown { opacity: 1; } #pet.mood-sad .tear { opacity: 1; } #pet.mood-sick .sweat { opacity: 1; }
  #pet.mood-sleep .m-o { opacity: 1; } #pet.mood-eat .m-open { opacity: 1; }
  #pet .tear { animation: tear 1.4s ease-in infinite; } @keyframes tear { 0% { transform: translateY(0); } 100% { transform: translateY(26px); } }
  #pet .m-open { transform-box: fill-box; transform-origin: 50% 0; }
  #pet.munch .m-open { animation: munch .3s ease-in-out 4; } @keyframes munch { 0%,100% { transform: scaleY(1); } 50% { transform: scaleY(.25); } }
  #pet.munch .head { animation: nod .3s ease-in-out 4; } @keyframes nod { 0%,100% { transform: translateY(0); } 50% { transform: translateY(4px); } }
  #pet .head { transform-box: fill-box; transform-origin: 50% 100%; }
  #pet.mood-sleep .head { animation: snooze 4.5s ease-in-out infinite; } @keyframes snooze { 0%,100% { transform: rotate(-4deg) translateY(4px); } 50% { transform: rotate(-6deg) translateY(8px); } }
  #pet.jump { animation: pjump .6s ease-out; }
  @keyframes pjump { 0% { transform: translateY(0) scale(1); } 30% { transform: translateY(-50px) scale(.95,1.08); } 60% { transform: translateY(0) scale(1.08,.9); } 100% { transform: translateY(0) scale(1); } }
  #pet.happy { animation: pjump .5s ease-out 3; }
  #pet.hit { animation: shake .4s; }
  .petshadow { position: absolute; left: 50%; top: calc(48% + var(--ps) * .46); width: calc(var(--ps) * .9); height: calc(var(--ps) * .18); transform: translateX(-50%); border-radius: 50%; background: radial-gradient(ellipse, rgba(60,20,40,.32), rgba(60,20,40,0) 70%); z-index: 1; }
  .mood { position: absolute; left: calc(50% + var(--ps) * .34); top: calc(48% - var(--ps) * .6); z-index: 3; width: 64px; height: 64px; border-radius: 50% 50% 50% 8px; display: flex; align-items: center; justify-content: center; font-size: 36px;
    background: linear-gradient(180deg, #fff, #f1f4fb); border: 3px solid #fff; box-shadow: 0 5px 0 #c9d2e6, 0 8px 14px rgba(0,0,0,.2); animation: float 3s ease-in-out infinite; }
  .mood.pop { animation: pop .4s ease-out; }
  .dirt { position: absolute; width: 34px; height: 28px; border-radius: 50% 40% 55% 45%; z-index: 3; pointer-events: none;
    background: radial-gradient(circle at 40% 35%, #a8734a, #6b4423); box-shadow: inset 0 -3px 0 rgba(0,0,0,.2), 0 2px 3px rgba(0,0,0,.25); opacity: .95; transition: transform .25s, opacity .25s; }
  .dirt.gone { transform: scale(0); opacity: 0; }
  .bub { position: absolute; width: 22px; height: 22px; border-radius: 50%; z-index: 6; pointer-events: none;
    background: radial-gradient(circle at 35% 30%, rgba(255,255,255,1), rgba(200,240,255,.6) 60%, rgba(255,255,255,.1)); border: 2px solid rgba(255,255,255,.8); animation: bubup 1.1s ease-out forwards; }
  @keyframes bubup { 0% { transform: translate(0,0) scale(.4); opacity: 1; } 100% { transform: translate(var(--dx), -90px) scale(1.2); opacity: 0; } }
  .zz { position: absolute; z-index: 8; pointer-events: none; font-size: 34px; animation: zzup 2.4s ease-out forwards; }
  @keyframes zzup { 0% { transform: translate(0,0) scale(.5); opacity: 0; } 20% { opacity: 1; } 100% { transform: translate(40px,-140px) scale(1.3); opacity: 0; } }
  .night { position: absolute; inset: 0; z-index: 5; background: radial-gradient(circle at 50% 55%, rgba(20,30,90,.35), rgba(8,12,50,.78) 80%); opacity: 0; pointer-events: none; transition: opacity .8s; }
  .night.on { opacity: 1; }
  .room.pm .night { opacity: .35; } .room.pm .night.on { opacity: 1; }
  .night i { position: absolute; width: 6px; height: 6px; border-radius: 50%; background: #fff; box-shadow: 0 0 8px 2px #fff; animation: twinkle 2s ease-in-out infinite alternate; }
  @keyframes twinkle { from { opacity: .2; transform: scale(.7); } to { opacity: 1; transform: scale(1.2); } }
  .tray { position: absolute; left: 50%; bottom: 10px; transform: translateX(-50%); z-index: 7; display: flex; gap: 10px; padding: 8px 12px; animation: pop .3s ease-out; }
  .food, #sponge, .pill { width: 74px; height: 74px; border-radius: 20px; display: flex; align-items: center; justify-content: center; font-size: 44px; cursor: grab; touch-action: none;
    background: linear-gradient(180deg, #fff, #eef2ff); box-shadow: 0 5px 0 #c9d2e6, 0 8px 12px rgba(0,0,0,.2), inset 0 2px 0 #fff; }
  .ghost { position: absolute; z-index: 20; font-size: 60px; pointer-events: none; transform: translate(-50%, -50%) scale(1.15); filter: drop-shadow(0 10px 8px rgba(0,0,0,.35)); }
  #sponge { position: absolute; left: 20px; bottom: 20px; z-index: 7; font-size: 50px; width: 84px; height: 84px; border-radius: 50%; cursor: grab; touch-action: none; }
  #sponge.drag { transform: scale(1.15); box-shadow: 0 2px 0 #c9d2e6, 0 14px 18px rgba(0,0,0,.3); }
  #ball { position: absolute; left: 0; top: 0; width: 84px; height: 84px; z-index: 7; display: flex; align-items: center; justify-content: center; font-size: 64px; cursor: pointer; touch-action: none; will-change: transform; }
  #ball .emoji { display: block; animation: spin 1.2s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .ballshadow { position: absolute; width: 70px; height: 18px; border-radius: 50%; background: radial-gradient(ellipse, rgba(0,0,0,.3), rgba(0,0,0,0) 70%); z-index: 1; }
  .counter { position: absolute; left: 50%; top: 8px; transform: translateX(-50%); z-index: 7; display: flex; gap: 8px; padding: 8px 16px; border-radius: 30px; font-size: 22px; align-items: center; }
  .counter i { width: 18px; height: 18px; border-radius: 50%; background: rgba(0,0,0,.12); display: block; box-shadow: inset 0 2px 3px rgba(0,0,0,.2); }
  .counter i.on { background: linear-gradient(180deg, #ffe98a, #ffb703); box-shadow: 0 0 0 2px #fff, 0 2px 4px rgba(0,0,0,.25); }
  .actions { flex: 0 0 auto; display: flex; justify-content: center; gap: 12px; padding: 0 10px 10px; flex-wrap: wrap; z-index: 5; }
  .actions .btn { min-width: 108px; min-height: 76px; font-size: 38px; padding: 6px 14px; flex-direction: column; gap: 0; }
  .actions .btn small { font-size: 15px; letter-spacing: .5px; }
  .actions .btn.on { outline: 5px solid #fff; outline-offset: 2px; }
  .actions .btn.alert { animation: bounce .7s infinite; }
  .picker { position: absolute; inset: 0; z-index: 30; display: flex; align-items: center; justify-content: center; background: radial-gradient(circle at 50% 40%, rgba(255,255,255,.3), rgba(60,10,40,.55) 75%); }
  .picker .box { padding: 20px 26px; text-align: center; max-width: 94vw; }
  .picker .ttl { font-size: 32px; font-weight: 900; color: #ff6f61; text-shadow: 0 2px 0 #fff, 0 4px 8px rgba(0,0,0,.15); margin-bottom: 14px; }
  .picker .row { display: flex; gap: 16px; justify-content: center; flex-wrap: wrap; }
  .pet-btn { width: 132px; height: 156px; border-radius: 30px; border: 0; cursor: pointer; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; position: relative;
    background: linear-gradient(180deg, #fff 0%, #e6ecfb 100%); font: inherit; font-weight: 900; font-size: 20px; color: #1f2f6b;
    box-shadow: 0 7px 0 #b9c4dc, 0 14px 22px rgba(20,40,90,.25), inset 0 2px 0 #fff; transition: transform .1s, box-shadow .1s; }
  .pet-btn:active { transform: translateY(5px); box-shadow: 0 2px 0 #b9c4dc, 0 6px 10px rgba(20,40,90,.2); }
  .pet-btn.last { outline: 5px solid #ffb703; outline-offset: 2px; }
  .pet-btn svg { width: 100px; height: 100px; overflow: visible; animation: float 3s ease-in-out infinite; }
  .pet-btn:nth-child(2) svg { animation-delay: -.7s; } .pet-btn:nth-child(3) svg { animation-delay: -1.4s; } .pet-btn:nth-child(4) svg { animation-delay: -2.1s; }
  /* Armario de cosméticos */
  .cos { position: absolute; inset: 0; z-index: 31; display: flex; align-items: center; justify-content: center; background: radial-gradient(circle at 50% 40%, rgba(255,255,255,.3), rgba(60,10,40,.55) 75%); }
  .cos .box { padding: 14px 18px; text-align: center; max-width: 96%; }
  .cos .ttl { font-size: 26px; font-weight: 900; color: #ff6f61; text-shadow: 0 2px 0 #fff; margin-bottom: 8px; }
  .cos .sub { font-size: 16px; color: #6b7a99; margin: 6px 0 4px; font-weight: 900; }
  .cos .items { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
  .cos .item { width: 92px; height: 100px; border-radius: 20px; border: 0; background: linear-gradient(180deg, #fff, #eef2ff); box-shadow: 0 5px 0 #c9d2e6, 0 8px 12px rgba(0,0,0,.2); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; font: inherit; font-weight: 900; font-size: 14px; color: #1f2f6b; cursor: pointer; position: relative; }
  .cos .item .emoji { font-size: 40px; line-height: 1; }
  .cos .item.sel { box-shadow: 0 5px 0 #3fa864, 0 0 0 4px #6fdc8c, 0 8px 12px rgba(0,0,0,.2); background: linear-gradient(180deg, #e9ffe9, #b9f0c4); }
  .cos .item.lock { filter: grayscale(.9); opacity: .7; }
  .cos .item .lk { position: absolute; right: -6px; top: -6px; font-size: 18px; background: #fff; border-radius: 50%; width: 28px; height: 28px; display: flex; align-items: center; justify-content: center; box-shadow: 0 2px 0 #c9d2e6; }
  .cos .row { display: flex; gap: 10px; justify-content: center; margin-top: 10px; }
  .banner { position: absolute; left: 50%; top: 30%; z-index: 12; pointer-events: none; padding: 10px 32px; border-radius: 40px; white-space: nowrap;
    font-size: 32px; font-weight: 900; color: #fff; text-shadow: 0 2px 0 #b8306f, 0 4px 8px rgba(0,0,0,.3);
    background: linear-gradient(180deg, #ff9ccb, #f0569a); border: 3px solid #fff; box-shadow: 0 6px 0 #b8306f, 0 14px 24px rgba(0,0,0,.35), inset 0 2px 0 rgba(255,255,255,.6);
    transform: translate(-50%,-50%) scale(.5); opacity: 0; transition: transform .35s cubic-bezier(.2,1.5,.4,1), opacity .25s; }
  .banner.show { transform: translate(-50%,-50%) scale(1); opacity: 1; }
  .banner.gold { background: linear-gradient(180deg, #ffe98a, #ffb703); color: #6a3f00; text-shadow: 0 1px 0 rgba(255,255,255,.6); box-shadow: 0 6px 0 #c47f00, 0 14px 24px rgba(0,0,0,.35); }
  /* Nivel Experto: horario con reloj, tienda con monedas y pedidos de la mascota */

      '<div class="row"><button class="btn green" id="pay">💰 Pagar</button><button class="btn blue" id="close">✖ Salir</button></div></div>';
    room.appendChild(shopEl);
    var priceEl = shopEl.querySelector('.price'), paidEl = shopEl.querySelector('.paid');
    function showPaid() { paidEl.textContent = '= ' + paid; }
    shopEl.querySelectorAll('.item').forEach(function (b) {
      b.addEventListener('pointerdown', function (ev) {
        ev.preventDefault(); ev.stopPropagation(); KidsGame.sound.tap();
        shopEl.querySelectorAll('.item').forEach(function (x) { x.classList.remove('sel'); }); b.classList.add('sel');
        sel = { e: b.getAttribute('data-e'), p: +b.getAttribute('data-p') }; paid = 0; showPaid();
        priceEl.innerHTML = sel.e + ' cuesta <b>' + sel.p + '</b> 🪙 · pon las monedas justas';
        KidsGame.say(sel.p === 1 ? 'Cuesta una moneda' : 'Cuesta ' + sel.p + ' monedas. Pon las monedas justas');
      });
    });
    shopEl.querySelectorAll('.coin').forEach(function (c) {
      c.addEventListener('pointerdown', function (ev) {
        ev.preventDefault(); ev.stopPropagation();
        if (!sel) { KidsGame.toast('Primero elige qué comprar 👆'); return; }
        paid += +c.getAttribute('data-v'); KidsGame.sound.pop(); showPaid();
        if (paid > sel.p) { paidEl.classList.add('over'); KidsGame.sound.wrong(); streak = 0; KidsGame.toast('¡Te pasaste! 😅 Otra vez', 1400); KidsGame.say('Te pasaste. Cuenta otra vez'); setTimeout(function () { paid = 0; showPaid(); paidEl.classList.remove('over'); }, 900); }
      });
    });
    shopEl.querySelector('#pay').addEventListener('pointerdown', function (ev) {
      ev.preventDefault(); ev.stopPropagation(); KidsGame.sound.tap();
      if (!sel) { KidsGame.toast('Elige algo 👆'); return; }
      if (day.coins < sel.p) { KidsGame.sound.wrong(); KidsGame.toast('No te alcanza 🪙 juega para ganar monedas', 1800); KidsGame.say('No te alcanza. Juega a la pelota para ganar monedas'); return; }
      if (paid < sel.p) { KidsGame.sound.wrong(); KidsGame.toast('Faltan ' + (sel.p - paid) + ' 🪙', 1400); KidsGame.say(sel.p - paid === 1 ? 'Falta una moneda' : 'Faltan ' + (sel.p - paid) + ' monedas'); return; }
      day.coins -= sel.p; day.pantry[sel.e] = (day.pantry[sel.e] || 0) + 1; KidsGame.sound.ok(); KidsGame.addStar();
      shopEl.querySelector('.have').textContent = '🪙 ' + day.coins; paid = 0; showPaid(); renderDay();
      KidsGame.toast('¡Compraste ' + sel.e + '!', 1200); floatText('+1 ' + sel.e);
      if (mode === 'feed') { setMode(null); }
    });
    shopEl.querySelector('#close').addEventListener('pointerdown', function (ev) { ev.preventDefault(); ev.stopPropagation(); KidsGame.sound.tap(); shopEl.remove(); shopEl = null; });
  }
  // ---------- Armario: decoración y ropita ----------
  function openCos() {
    if (cosEl) return;
    cosEl = document.createElement('div'); cosEl.className = 'cos';
    function itemsHtml(t) { return COS.filter(function (it) { return it.t === t; }).map(function (it) { var un = unlocked(it), on = t === 'deco' ? !!cos.deco[it.id] : cos.outfit === it.id; return '<button class="item' + (on ? ' sel' : '') + (un ? '' : ' lock') + '" data-id="' + it.id + '"><span class="emoji">' + it.e + '</span>' + it.n + (un ? '' : '<span class="lk">🔒</span>') + '</button>'; }).join(''); }
    cosEl.innerHTML = '<div class="box panel"><div class="ttl">🎀 Armario de ' + pet.n + '</div><div class="sub">Ropita</div><div class="items">' + itemsHtml('outfit') + '</div><div class="sub">Decora el cuarto</div><div class="items">' + itemsHtml('deco') + '</div><div class="row"><button class="btn blue" id="cclose">✔ Listo</button></div></div>';
    game.appendChild(cosEl);
    cosEl.querySelectorAll('.item').forEach(function (b) {
      b.addEventListener('pointerdown', function (ev) {
        ev.preventDefault(); ev.stopPropagation();
        var it = COS.filter(function (x) { return x.id === b.getAttribute('data-id'); })[0];
        if (!unlocked(it)) { KidsGame.sound.wrong(); KidsGame.fx.shake(b); KidsGame.toast('🔒 Completa el nivel ' + it.lv, 1500); KidsGame.say('Completa el nivel ' + it.lv); return; }
        KidsGame.sound.pop(); KidsGame.fx.burstAt(b, { n: 6, chars: ['✨'] });
        if (it.t === 'deco') { cos.deco[it.id] = !cos.deco[it.id]; b.classList.toggle('sel', !!cos.deco[it.id]); applyDeco(); }
        else { cos.outfit = cos.outfit === it.id ? null : it.id; cosEl.querySelectorAll('.item').forEach(function (x) { var y = COS.filter(function (z) { return z.id === x.getAttribute('data-id'); })[0]; if (y.t === 'outfit') x.classList.toggle('sel', cos.outfit === y.id); }); renderPet(); petEl.classList.remove('jump'); void petEl.offsetWidth; petEl.classList.add('jump'); }
        saveCos();
      });
    });
    cosEl.querySelector('#cclose').addEventListener('pointerdown', function (ev) { ev.preventDefault(); ev.stopPropagation(); KidsGame.sound.tap(); cosEl.remove(); cosEl = null; });
  }
  function sneeze() {
    needs.salud = 30; petEl.classList.remove('hit'); void petEl.offsetWidth; petEl.classList.add('hit');
    floatText('¡Achís! 🤧'); KidsGame.sound.wrong(); bHeal.classList.add('alert'); KidsGame.say('¡Achís! Está malito');
    moodEl.innerHTML = '<span class="emoji">🤧</span>'; renderMeters();
  }
  function frame(now) {
    if (!lastT) lastT = now; var dt = Math.min((now - lastT) / 1000, 0.1); lastT = now;
    if (running) update(dt);
    requestAnimationFrame(frame);
  }
  function save() { try { localStorage.setItem('kg-mascota', JSON.stringify({ pet: pet.e, needs: needs, t: Date.now() })); } catch (e) {} }

  // ---------- inicio ----------
  function begin() {
    renderPet(); nameEl.textContent = pet.n; applyDeco();
    if (saved && saved.needs && saved.pet === pet.e) { activeNeeds().forEach(function (n) { needs[n.k] = typeof saved.needs[n.k] === 'number' ? saved.needs[n.k] : 60; }); }
    else activeNeeds().forEach(function (n) { needs[n.k] = 45 + Math.random() * 25; });
    if (typeof needs.salud !== 'number') needs.salud = 90;
    buildMeters(); layout(); happyShown = false; sneezeT = 20 + Math.random() * 15; setMode(null); running = true; renderMeters(); save();
    if (askEl) { askEl.remove(); askEl = null; } if (shopEl) { shopEl.remove(); shopEl = null; }
    dayBar.classList.toggle('show', nivel === 4);
    if (nivel === 4) { day = null; newDay(); } else { day = null; KidsGame.say('Cuida a tu ' + pet.n.toLowerCase()); banner(pet.e + ' ¡Hola, ' + pet.n + '!', false, 1300); }
    if (nivel === 1) setTimeout(function () { if (running && mode === null) hand = KidsGame.hand({ el: bFeed }); }, 1500);
  }
  function pickPet() {
    var pk = document.createElement('div'); pk.className = 'picker';
    pk.innerHTML = '<div class="box panel"><div class="ttl">¿Cuál es tu mascota?</div><div class="row"></div></div>';
    var row = pk.querySelector('.row');
    PETS.forEach(function (p) {
      var b = document.createElement('button'); b.className = 'pet-btn' + (saved && saved.pet === p.e ? ' last' : '');
      b.innerHTML = petSVG(p, null) + '<span>' + p.n + '</span>';
      b.addEventListener('pointerdown', function (ev) { ev.preventDefault(); ev.stopPropagation(); KidsGame.sound.pop(); pet = p; pk.remove(); begin(); });
      row.appendChild(b);
    });
    game.appendChild(pk);
  }
  function setBadge() { badgeHolder.innerHTML = ''; badgeHolder.appendChild(KidsGame.levelBadge(nivel)); }
  function pickLevel() {
    if (hand) { hand.stop(); hand = null; }
    KidsGame.levelPicker({ labels: { 1: 'Sin prisa', 2: 'Baja más rápido', 3: 'Rápido y se enferma 🩹', 4: 'Horario con reloj, tienda y pedidos' }, music: 'calma',
      art: petSVG(PETS[0], 'bow').replace('<svg ', '<svg width="64" height="64" '),
      howto: [{ icon: '🍎', text: 'Dale de comer y báñalo' }, { icon: '🎾', text: 'Juega a la pelota y duérmelo' }, { icon: '💕', text: 'Si está feliz, ¡ganas!' }],
      onPick: function (n) { nivel = n; streak = 0; handFood = false; setBadge(); pickPet(); } });
  }
  window.__kgTest = function () { return { day: day, needs: needs, mode: mode, pet: pet.e, mood: petEl._mood, night: room.classList.contains('pm'), streak: streak, outfit: cos.outfit, setMode: setMode, fulfilled: fulfilled, askRequest: askRequest, updateDay: updateDay, renderDay: renderDay }; };
  setBadge(); buildMeters(); layout(); pickLevel(); requestAnimationFrame(frame);
})();
</script>
</body>
</html>
