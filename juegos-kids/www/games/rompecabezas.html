<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<link rel="stylesheet" href="../common.css">
<title>Rompecabezas</title>
<style>
  .hud { position: absolute; left: 8px; right: 8px; top: 8px; height: 60px; display: flex; align-items: center; justify-content: space-between; gap: 10px; z-index: 3; }
  .hud .grp { display: flex; align-items: center; gap: 8px; }
  .hud .btn { font-size: 26px; }
  .hud .btn.hint { font-size: 22px; padding: 8px 14px; letter-spacing: 1px; white-space: nowrap; }
  .hud .btn.hint.off { opacity: .5; filter: grayscale(.6); }
  .hud .pieces { font-size: 18px; color: #fff; font-weight: 900; text-shadow: 0 2px 0 #1f7fae, -1px -1px 0 #1f7fae, 1px -1px 0 #1f7fae, -1px 1px 0 #1f7fae, 1px 1px 0 #1f7fae; white-space: nowrap; }
  .wrap { position: absolute; left: 8px; right: 8px; top: 74px; bottom: 8px; display: flex; gap: 10px; }
  .wrap.portrait { flex-direction: column; }
  .boardbox { flex: 1 1 auto; display: flex; align-items: center; justify-content: center; min-width: 0; min-height: 0; }
  /* Tablero con marco de madera (::before) y superficie interior (::after) */
  .board { position: relative; isolation: isolate; border-radius: 4px; }
  .board::before { content: ""; position: absolute; inset: -16px; z-index: -2; border-radius: 14px;
    background-image: repeating-linear-gradient(0deg, rgba(255,255,255,.08) 0 5px, rgba(0,0,0,0) 5px 21px), linear-gradient(180deg, #e0a862 0%, #c2803f 40%, #a96a30 75%, #8b5222 100%);
    box-shadow: 0 12px 0 #5c3510, 0 22px 30px rgba(60,30,0,.4), inset 0 3px 0 rgba(255,235,200,.55), inset 0 -4px 0 rgba(0,0,0,.25); }
  .board::after { content: ""; position: absolute; inset: 0; z-index: -1; border-radius: 3px;
    background: linear-gradient(135deg, #fffdf6, #efe6d2); box-shadow: inset 0 0 0 2px rgba(90,50,0,.25), inset 0 6px 14px rgba(90,50,0,.28), inset 0 -2px 0 rgba(255,255,255,.5); }
  .board.done::before { box-shadow: 0 12px 0 #5c3510, 0 22px 30px rgba(60,30,0,.4), 0 0 0 6px #ffd166, 0 0 40px rgba(255,209,102,.9), inset 0 3px 0 rgba(255,235,200,.55); }
  .board.done { animation: bounce .7s 2; }
  .ghost { position: absolute; inset: 0; opacity: .3; background-size: 100% 100%; background-repeat: no-repeat; transition: opacity 1.2s; }
  .ghost.fade { opacity: 0; }
  .slot { position: absolute; border: 2px dashed rgba(90,50,0,.28); box-shadow: inset 0 0 12px rgba(90,50,0,.08); }
  .peek { position: absolute; inset: 0; z-index: 6; background-size: 100% 100%; background-repeat: no-repeat; opacity: 0; transition: opacity .3s; pointer-events: none; box-shadow: 0 0 0 4px #ffd166; }
  .peek.show { opacity: 1; }
  .board.done .slot, .board.done .ghost { display: none; }
  /* Barrido de brillo al completar */
  .sweep { position: absolute; inset: 0; overflow: hidden; pointer-events: none; z-index: 7; display: none; }
  .board.done .sweep { display: block; }
  .sweep::before { content: ""; position: absolute; top: -20%; bottom: -20%; left: 0; width: 45%; transform: translateX(-140%) skewX(-20deg);
    background: linear-gradient(90deg, rgba(255,255,255,0), rgba(255,255,255,.85), rgba(255,255,255,0)); animation: shine 1.2s ease-in-out .35s 2; }
  /* Bandeja de piezas: caja con interior acolchado */
  .tray {
    flex: 0 0 auto; border-radius: 18px; border: 3px solid #fff;
    background: linear-gradient(180deg, rgba(255,255,255,.9), rgba(230,240,255,.85));
    box-shadow: 0 8px 0 #c9d2e6, 0 16px 28px rgba(20,40,90,.22), inset 0 2px 0 #fff, inset 0 10px 18px rgba(20,40,90,.12);
    display: flex; flex-wrap: wrap; align-content: flex-start; justify-content: center; gap: var(--gap); padding: var(--gap);
    overflow: hidden;
  }
  .tile {
    position: relative; background-repeat: no-repeat; border-radius: 8px; cursor: grab; touch-action: none; flex: 0 0 auto;
    box-shadow: 0 5px 0 rgba(60,40,20,.35), 0 9px 14px rgba(0,0,0,.25), inset 0 2px 0 rgba(255,255,255,.55), inset 2px 0 0 rgba(255,255,255,.3), inset 0 -3px 0 rgba(0,0,0,.28), inset -2px 0 0 rgba(0,0,0,.15);
    animation: pop .3s ease-out; transform: rotate(var(--rot, 0deg));
  }
  .tile::after { content: ""; position: absolute; inset: 0; border-radius: inherit; pointer-events: none; background: linear-gradient(160deg, rgba(255,255,255,.28), rgba(255,255,255,0) 45%, rgba(0,0,0,.1)); }
  .tile.drag { position: fixed; z-index: 20; animation: none; border-radius: 6px; transform: scale(1.08) rotate(0deg);
    box-shadow: 0 10px 0 rgba(60,40,20,.3), 0 26px 30px rgba(0,0,0,.4), inset 0 2px 0 rgba(255,255,255,.6), inset 0 -3px 0 rgba(0,0,0,.25); }
  .tile.placed { position: absolute; box-shadow: none; border-radius: 0; cursor: default; animation: pop .3s ease-out; transform: none; }
  .tile.placed::after { display: none; }
</style>
</head>

      KidsGame.celebrate({
        sub: 'Nivel ' + level + ' · ' + cols + '×' + rows + ' completo',
        onNext: function () { scene++; step++; if (step >= GRIDS[level].length) { step = 0; level = Math.min(level + 1, 3); } start(); },
        onAgain: function () { start(); }
      });
    }, 1300);
  }

  window.addEventListener('resize', layout);
  pickLevel();
})();
</script>
