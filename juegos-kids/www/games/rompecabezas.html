<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<link rel="stylesheet" href="../common.css">
<title>Rompecabezas</title>
<style>
  .hud { position: absolute; left: 8px; right: 8px; top: 8px; height: 60px; display: flex; align-items: center; justify-content: space-between; gap: 10px; z-index: 3; }
  .hud .grp { display: flex; align-items: center; gap: 8px; }
  .hud .btn { font-size: 26px; }
  .hud .btn.hint { font-size: 22px; padding: 8px 14px; letter-spacing: 1px; white-space: nowrap; }
  .hud .btn.hint.off { opacity: .5; filter: grayscale(.6); }
  .hud .pieces { font-size: 18px; color: #fff; font-weight: 900; text-shadow: 0 2px 0 #1f7fae, -1px -1px 0 #1f7fae, 1px -1px 0 #1f7fae, -1px 1px 0 #1f7fae, 1px 1px 0 #1f7fae; white-space: nowrap; }
  .wrap { position: absolute; left: 8px; right: 8px; top: 74px; bottom: 8px; display: flex; gap: 10px; }
  .wrap.portrait { flex-direction: column; }
  .boardbox { flex: 1 1 auto; display: flex; align-items: center; justify-content: center; min-width: 0; min-height: 0; }
  /* Tablero con marco de madera (::before) y superficie interior (::after) */
  .board { position: relative; isolation: isolate; border-radius: 4px; }
  .board::before { content: ""; position: absolute; inset: -16px; z-index: -2; border-radius: 14px;
    background-image: repeating-linear-gradient(0deg, rgba(255,255,255,.08) 0 5px, rgba(0,0,0,0) 5px 21px), linear-gradient(180deg, #e0a862 0%, #c2803f 40%, #a96a30 75%, #8b5222 100%);
    box-shadow: 0 12px 0 #5c3510, 0 22px 30px rgba(60,30,0,.4), inset 0 3px 0 rgba(255,235,200,.55), inset 0 -4px 0 rgba(0,0,0,.25); }
  .board::after { content: ""; position: absolute; inset: 0; z-index: -1; border-radius: 3px;
    background: linear-gradient(135deg, #fffdf6, #efe6d2); box-shadow: inset 0 0 0 2px rgba(90,50,0,.25), inset 0 6px 14px rgba(90,50,0,.28), inset 0 -2px 0 rgba(255,255,255,.5); }
  .board.done::before { box-shadow: 0 12px 0 #5c3510, 0 22px 30px rgba(60,30,0,.4), 0 0 0 6px #ffd166, 0 0 40px rgba(255,209,102,.9), inset 0 3px 0 rgba(255,235,200,.55); }
  .board.done { animation: bounce .7s 2; }
  .ghost { position: absolute; inset: 0; opacity: .3; background-size: 100% 100%; background-repeat: no-repeat; transition: opacity 1.2s; }
  .ghost.fade { opacity: 0; }
  .slot { position: absolute; border: 2px dashed rgba(90,50,0,.28); box-shadow: inset 0 0 12px rgba(90,50,0,.08); }
  .peek { position: absolute; inset: 0; z-index: 6; background-size: 100% 100%; background-repeat: no-repeat; opacity: 0; transition: opacity .3s; pointer-events: none; box-shadow: 0 0 0 4px #ffd166; }
  .peek.show { opacity: 1; }
  .board.done .slot, .board.done .ghost { display: none; }
  /* Barrido de brillo al completar */
  .sweep { position: absolute; inset: 0; overflow: hidden; pointer-events: none; z-index: 7; display: none; }
  .board.done .sweep { display: block; }
  .sweep::before { content: ""; position: absolute; top: -20%; bottom: -20%; left: 0; width: 45%; transform: translateX(-140%) skewX(-20deg);
    background: linear-gradient(90deg, rgba(255,255,255,0), rgba(255,255,255,.85), rgba(255,255,255,0)); animation: shine 1.2s ease-in-out .35s 2; }
  /* Bandeja de piezas: caja con interior acolchado */
  .tray {
    flex: 0 0 auto; border-radius: 18px; border: 3px solid #fff;
    background: linear-gradient(180deg, rgba(255,255,255,.9), rgba(230,240,255,.85));
    box-shadow: 0 8px 0 #c9d2e6, 0 16px 28px rgba(20,40,90,.22), inset 0 2px 0 #fff, inset 0 10px 18px rgba(20,40,90,.12);
    display: flex; flex-wrap: wrap; align-content: flex-start; justify-content: center; gap: var(--gap); padding: var(--gap);
    overflow: hidden;
  }
  .tile {
    position: relative; background-repeat: no-repeat; border-radius: 8px; cursor: grab; touch-action: none; flex: 0 0 auto;
    box-shadow: 0 5px 0 rgba(60,40,20,.35), 0 9px 14px rgba(0,0,0,.25), inset 0 2px 0 rgba(255,255,255,.55), inset 2px 0 0 rgba(255,255,255,.3), inset 0 -3px 0 rgba(0,0,0,.28), inset -2px 0 0 rgba(0,0,0,.15);
    animation: pop .3s ease-out; transform: rotate(var(--rot, 0deg));
  }
  .tile::after { content: ""; position: absolute; inset: 0; border-radius: inherit; pointer-events: none; background: linear-gradient(160deg, rgba(255,255,255,.28), rgba(255,255,255,0) 45%, rgba(0,0,0,.1)); }
  .tile.drag { position: fixed; z-index: 20; animation: none; border-radius: 6px; transform: scale(1.08) rotate(var(--drot, 0deg));
    box-shadow: 0 10px 0 rgba(60,40,20,.3), 0 26px 30px rgba(0,0,0,.4), inset 0 2px 0 rgba(255,255,255,.6), inset 0 -3px 0 rgba(0,0,0,.25); }
  .tile.placed { position: absolute; box-shadow: none; border-radius: 0; cursor: default; animation: pop .3s ease-out; transform: none; }
  .tile.placed::after { display: none; }
  /* Nivel Experto: las fichas llegan giradas; un toque las gira 90° */
  .tile.rot { transition: transform .25s cubic-bezier(.3,1.3,.5,1); }
  .tile.spin { animation: none; }
  .tile.nope { animation: shake .4s; }
  .tray.expert { gap: 14px; }
  .hud .btn.turn { font-size: 20px; padding: 8px 12px; white-space: nowrap; pointer-events: none; }
</style>
</head>

    '<circle cx="340" cy="60" r="56" fill="url(#moonglow)" opacity=".7"/><circle cx="340" cy="60" r="26" fill="url(#moon8)"/><circle cx="332" cy="52" r="5" fill="#e2c15a" opacity=".5"/><circle cx="348" cy="68" r="3" fill="#e2c15a" opacity=".5"/>' +
    '<ellipse cx="200" cy="300" rx="280" ry="90" fill="url(#hill8)"/><ellipse cx="200" cy="300" rx="150" ry="34" fill="url(#water)"/><path d="M80 290 Q120 282 160 290 M240 292 Q280 284 320 292" stroke="#fff" stroke-width="2" fill="none" opacity=".5"/>' +
    '<g filter="url(#sh)"><rect x="70" y="120" width="44" height="130" fill="url(#stone)"/><rect x="286" y="120" width="44" height="130" fill="url(#stone)"/><polygon points="64,122 92,80 120,122" fill="url(#roof8)"/><polygon points="280,122 308,80 336,122" fill="url(#roof8)"/>' +
    '<rect x="110" y="160" width="180" height="90" fill="url(#stoneD)"/><g fill="url(#stoneD)"><rect x="110" y="146" width="14" height="16"/><rect x="138" y="146" width="14" height="16"/><rect x="166" y="146" width="14" height="16"/><rect x="194" y="146" width="14" height="16"/><rect x="222" y="146" width="14" height="16"/><rect x="250" y="146" width="14" height="16"/><rect x="278" y="146" width="12" height="16"/></g>' +
    '<rect x="172" y="100" width="56" height="62" fill="url(#stone)"/><g fill="url(#stone)"><rect x="172" y="88" width="12" height="14"/><rect x="194" y="88" width="12" height="14"/><rect x="216" y="88" width="12" height="14"/></g>' +
    '<g stroke="#5e3410" stroke-width="3"><line x1="92" y1="80" x2="92" y2="52"/><line x1="308" y1="80" x2="308" y2="52"/><line x1="200" y1="88" x2="200" y2="58"/></g><polygon points="92,52 118,60 92,68" fill="url(#flag)"/><polygon points="308,52 334,60 308,68" fill="url(#flag)"/><polygon points="200,58 226,66 200,74" fill="#f582ae"/>' +
    '<path d="M178 250 L178 212 Q200 190 222 212 L222 250 Z" fill="url(#gate)"/><g stroke="#2e2219" stroke-width="2" opacity=".6"><line x1="188" y1="212" x2="188" y2="250"/><line x1="200" y1="204" x2="200" y2="250"/><line x1="212" y1="212" x2="212" y2="250"/></g>' +
    '<path d="M172 250 L228 250 L246 294 L154 294 Z" fill="url(#bridge)"/><g stroke="#5e3410" stroke-width="2" opacity=".5"><line x1="168" y1="262" x2="232" y2="262"/><line x1="162" y1="276" x2="238" y2="276"/></g><g stroke="#cfc8e4" stroke-width="2.5"><line x1="172" y1="250" x2="154" y2="294"/><line x1="228" y1="250" x2="246" y2="294"/></g>' +
    '<g fill="#ffe08a"><rect x="84" y="140" width="14" height="20" rx="7"/><rect x="300" y="140" width="14" height="20" rx="7"/><rect x="128" y="190" width="12" height="18" rx="6"/><rect x="260" y="190" width="12" height="18" rx="6"/><rect x="192" y="112" width="16" height="22" rx="8"/></g></g>' +
    '<g filter="url(#sh)"><path d="M48 212 Q30 186 54 176" stroke="url(#dragon)" stroke-width="12" fill="none" stroke-linecap="round"/><path d="M44 170 L20 150 L52 158 Z" fill="url(#wing)"/><ellipse cx="60" cy="222" rx="34" ry="24" fill="url(#dragon)"/><ellipse cx="66" cy="230" rx="20" ry="13" fill="url(#belly)"/>' +
    '<circle cx="92" cy="200" r="20" fill="url(#dragon)"/><ellipse cx="108" cy="206" rx="12" ry="8" fill="url(#dragon)"/><circle cx="96" cy="194" r="5" fill="#fff"/><circle cx="98" cy="194" r="2.5" fill="#172c66"/><circle cx="112" cy="206" r="1.8" fill="#172c66"/><path d="M104 212 q6 4 12 0" stroke="#172c66" stroke-width="2" fill="none" stroke-linecap="round"/>' +
    '<g fill="#ffd166"><polygon points="78,186 84,170 90,186"/><polygon points="90,184 96,168 102,184"/></g><g fill="url(#dragon)"><ellipse cx="42" cy="244" rx="9" ry="6"/><ellipse cx="76" cy="246" rx="9" ry="6"/></g>' +
    '<circle cx="128" cy="210" r="14" fill="url(#fire)" opacity=".8"/><polygon points="120,206 140,202 132,212 142,214 124,218" fill="#ff8906"/><polygon points="122,208 134,206 128,212" fill="#fff1a8"/></g></svg>'
  ];
  // Rejillas por nivel (progresión dentro del nivel). Nivel 4 (Experto): fichas giradas que hay que enderezar y 1 sola pista
  var GRIDS = { 1: [[2, 2], [3, 2]], 2: [[3, 3], [4, 3], [4, 4]], 3: [[4, 4], [5, 4], [6, 4]], 4: [[6, 5], [7, 5]] };
  var HINTS = { 1: 3, 2: 2, 3: 2, 4: 1 };
  var LABELS = { 1: '2×2 y 3×2 con guía', 2: '3×3 → 4×4', 3: '4×4 → 6×4 sin guía', 4: '7×5 y girar fichas' };
  var level = 1, step = 0, scene = 0, cols = 2, rows = 2, tiles = [], placed = 0, url = '';
  var boardW = 0, boardH = 0, tileW = 0, tileH = 0, trayScale = 1, dragging = null, hints = 3, peekTimer = null, ghostTimer = null, ghost = null, peek = null;
  function expert() { return level === 4; }

  function el(tag, cls) { var e = document.createElement(tag); if (cls) e.className = cls; return e; }
  function onTap(e, fn) { e.addEventListener('pointerdown', function (ev) { ev.preventDefault(); fn(ev); }); }
  function gcd(a, b) { return b ? gcd(b, a % b) : a; }
  function lcm(a, b) { return a * b / gcd(a, b); }

  game.innerHTML = '';
  var hud = el('div', 'hud');
  var left = el('div', 'grp'), right = el('div', 'grp');
  var lvlBtn = el('button', 'btn round yellow'); lvlBtn.textContent = '🎚️'; lvlBtn.setAttribute('aria-label', 'Nivel');
  var badge = el('span'), piecesEl = el('span', 'pieces');
  var hintBtn = el('button', 'btn yellow hint'); hintBtn.setAttribute('aria-label', 'Pista');
  var turnEl = el('span', 'btn purple turn'); turnEl.textContent = '🔄 Toca para girar'; turnEl.style.display = 'none';
  left.appendChild(lvlBtn); left.appendChild(badge); left.appendChild(piecesEl); right.appendChild(turnEl); right.appendChild(hintBtn);
  hud.appendChild(left); hud.appendChild(right);
  var wrap = el('div', 'wrap'), boardBox = el('div', 'boardbox'), board = el('div', 'board'), tray = el('div', 'tray');
  boardBox.appendChild(board); wrap.appendChild(boardBox); wrap.appendChild(tray);
  game.appendChild(hud); game.appendChild(wrap);
  onTap(lvlBtn, function () { KidsGame.sound.tap(); pickLevel(); });
  onTap(hintBtn, showHint);
  // Expuesto para pruebas (set: índice de nivel 0..2, escena, paso dentro del nivel)
  window.__pz = { get cols() { return cols; }, get rows() { return rows; }, get level() { return level; }, get hints() { return hints; }, get step() { return step; }, get scenes() { return SCENES.length; },
    get tiles() { return tiles.map(function (t) { return { c: t.c, r: t.r, state: t.state, rot: t.rot || 0 }; }); },
    set: function (l, sc, st) { level = Math.min(4, Math.max(1, (l | 0) + 1)); scene = sc || 0; step = st || 0; start(); } };

  function pickLevel() {
    board.className = 'board'; board.innerHTML = ''; tray.innerHTML = ''; tiles = []; dragging = null; clearTimeout(ghostTimer); clearTimeout(peekTimer);
    KidsGame.levelPicker({ labels: LABELS, onPick: function (n) { level = n; step = 0; start(); } });
  }
  function setHud() {
    badge.innerHTML = ''; badge.appendChild(KidsGame.levelBadge(level));
    piecesEl.textContent = cols + '×' + rows;
    hintBtn.textContent = (hints > 0 ? Array(hints + 1).join('💡') : '💡') + ' Pista';
    hintBtn.classList.toggle('off', hints <= 0);
  }
  // Pista: muestra la imagen completa 2 segundos (máximo 3 por rompecabezas)
  function showHint() {
    if (hints <= 0 || !peek || peek.classList.contains('show') || board.classList.contains('done')) { if (hints <= 0) KidsGame.sound.wrong(); return; }
    hints--; setHud(); KidsGame.sound.pop(); KidsGame.say('Mira');
    peek.classList.add('show');
    clearTimeout(peekTimer); peekTimer = setTimeout(function () { peek.classList.remove('show'); }, 2000);
  }

  function start() {
    var lv = GRIDS[level][Math.min(step, GRIDS[level].length - 1)]; cols = lv[0]; rows = lv[1];
    url = 'url("data:image/svg+xml;charset=utf-8,' + encodeURIComponent(SCENES[scene % SCENES.length]) + '")';
    board.className = 'board lvl' + level; board.innerHTML = ''; tray.innerHTML = ''; tiles = []; placed = 0; dragging = null; hints = HINTS[level];
    tray.classList.toggle('expert', expert()); turnEl.style.display = expert() ? '' : 'none';
    clearTimeout(ghostTimer); clearTimeout(peekTimer);
    setHud();
    // Nivel 1: la imagen guía se ve 3 segundos y se desvanece. Niveles 2 y 3: sin guía.
    ghost = null;
    if (level === 1) {
      ghost = el('div', 'ghost'); ghost.style.backgroundImage = url; board.appendChild(ghost);
      ghostTimer = setTimeout(function () { ghost.classList.add('fade'); }, 3000);
    }
    var all = [];
    for (var r = 0; r < rows; r++) for (var c = 0; c < cols; c++) {
      var slot = el('div', 'slot'); slot.dataset.c = c; slot.dataset.r = r; board.appendChild(slot);
      all.push({ c: c, r: r });
    }
    peek = el('div', 'peek'); peek.style.backgroundImage = url; board.appendChild(peek);
    board.appendChild(el('div', 'sweep'));
    KidsGame.shuffle(all).forEach(function (t, i) {
      var d = el('div', 'tile'); d.style.backgroundImage = url; d.style.animationDelay = (i * 50) + 'ms';
      d.dataset.c = t.c; d.dataset.r = t.r;
      // Nivel 3: fichas ladeadas en la bandeja (se enderezan al tomarlas)
      if (level === 3) d.style.setProperty('--rot', (Math.random() * 28 - 14).toFixed(1) + 'deg');
      // Nivel 4: fichas giradas 90/180/270°; hay que girarlas (toque) hasta enderezarlas antes de que encajen
      t.rot = 0; t.el = d; t.state = 'tray';
      if (expert()) { t.rot = KidsGame.pick([90, 180, 270]); d.classList.add('rot'); setRot(t); }
      d.addEventListener('pointerdown', function (e) { down(e, t); });
      tray.appendChild(d); tiles.push(t);
    });
    layout();
    KidsGame.say('Arma el rompecabezas');
  }

  function setRot(t) { t.el.style.setProperty('--rot', t.rot + 'deg'); t.el.style.setProperty('--drot', t.rot + 'deg'); }
  function layout() {
    var W = game.clientWidth - 16, H = game.clientHeight - 82, gap = expert() ? 14 : 8, n = tiles.length, F = 36, B = 6;
    if (!n || W < 50 || H < 50) return;
    var portrait = H > W;
    wrap.className = 'wrap' + (portrait ? ' portrait' : '');
    var bw, bh, tw, th, tcols, trows;
    if (portrait) {
      var trayH = Math.max(130, Math.floor(H * (expert() ? 0.36 : 0.3)));
      bw = W - F; bh = H - trayH - 10 - F;
      tray.style.width = '100%'; tray.style.height = trayH + 'px';
    } else {
      var trayW = Math.max(160, Math.floor(W * (expert() ? 0.34 : 0.28)));
      bw = W - trayW - 10 - F; bh = H - F;
      tray.style.width = trayW + 'px'; tray.style.height = '100%';
    }
    // Múltiplo que hace enteras todas las fichas (sin líneas entre fichas)
    var stepPx = lcm(4 * cols, 4 * rows);
    boardW = Math.max(stepPx, Math.floor(Math.min(bw, bh * 4 / 3) / stepPx) * stepPx); boardH = boardW * 3 / 4;
    tileW = boardW / cols; tileH = boardH / rows;
    board.style.width = boardW + 'px'; board.style.height = boardH + 'px';
    // Tamaño de las fichas en la bandeja para que quepan todas
    if (portrait) {
      trows = expert() ? 4 : level === 3 ? 3 : 2; tcols = Math.ceil(n / trows);
      tw = (W - B - (tcols + 1) * gap) / tcols; th = tw * tileH / tileW;
      var availH = parseFloat(tray.style.height) - B - (trows + 1) * gap;
      if (trows * th > availH) { th = availH / trows; tw = th * tileW / tileH; }
    } else {
      tcols = expert() ? 4 : level === 3 ? 3 : 2; trows = Math.ceil(n / tcols);
      tw = (parseFloat(tray.style.width) - B - (tcols + 1) * gap) / tcols; th = tw * tileH / tileW;
      if (trows * th > H - B - (trows + 1) * gap) { th = (H - B - (trows + 1) * gap) / trows; tw = th * tileW / tileH; }
    }
    trayScale = Math.min(1, tw / tileW);
    if (level === 3) trayScale *= 0.82;
    if (expert()) trayScale *= 0.8;
    tray.style.setProperty('--gap', gap + 'px');
    Array.prototype.forEach.call(board.querySelectorAll('.slot'), function (s) {
      s.style.left = (s.dataset.c * tileW) + 'px'; s.style.top = (s.dataset.r * tileH) + 'px';
      s.style.width = tileW + 'px'; s.style.height = tileH + 'px';
    });
    tiles.forEach(styleTile);
  }

  function styleTile(t) {
    var s = t.state === 'tray' ? trayScale : 1, e = t.el;
    e.style.width = (tileW * s) + 'px'; e.style.height = (tileH * s) + 'px';
    e.style.backgroundSize = (boardW * s) + 'px ' + (boardH * s) + 'px';
    e.style.backgroundPosition = (-t.c * tileW * s) + 'px ' + (-t.r * tileH * s) + 'px';
    if (t.state === 'placed') { e.style.left = (t.c * tileW) + 'px'; e.style.top = (t.r * tileH) + 'px'; }
  }

  function moveTo(t, x, y) {
    t.el.style.left = (x - tileW / 2) + 'px'; t.el.style.top = (y - tileH * 0.6) + 'px';
  }
  function down(e, t) {
    if (t.state !== 'tray' || dragging) return;
    e.preventDefault();
    dragging = { t: t, id: e.pointerId, x0: e.clientX, y0: e.clientY, moved: false };
    t.idx = Array.prototype.indexOf.call(tray.children, t.el);
    t.state = 'drag'; t.el.style.animationDelay = '';
    document.body.appendChild(t.el); t.el.className = 'tile drag';
    styleTile(t); moveTo(t, e.clientX, e.clientY);
    KidsGame.sound.tap();
  }
  function move(e) {
    if (!dragging || e.pointerId !== dragging.id) return;
    e.preventDefault();
    if (Math.abs(e.clientX - dragging.x0) + Math.abs(e.clientY - dragging.y0) > 10) dragging.moved = true;
    moveTo(dragging.t, e.clientX, e.clientY);
  }
  function toTray(t, cls) {
    t.state = 'tray'; t.el.className = 'tile' + (expert() ? ' rot' : '') + (cls ? ' ' + cls : ''); t.el.style.left = ''; t.el.style.top = '';
    var ref = tray.children[t.idx] || null; tray.insertBefore(t.el, ref); styleTile(t);
  }
  function up(e) {
    if (!dragging || e.pointerId !== dragging.id) return;
    var t = dragging.t, tapped = !dragging.moved; dragging = null;
    // Experto: un toque (sin arrastrar) gira la ficha 90°
    if (expert() && tapped) {
      t.rot = (t.rot + 90) % 360; toTray(t, 'spin'); setRot(t);
      KidsGame.sound.pop(); KidsGame.vibrate(15);
      return;
    }
    var br = board.getBoundingClientRect();
    var tl = parseFloat(t.el.style.left), tt = parseFloat(t.el.style.top);
    var dx = tl - (br.left + t.c * tileW), dy = tt - (br.top + t.r * tileH);
    var near = Math.sqrt(dx * dx + dy * dy) < 0.35 * tileW;
    if (near && expert() && t.rot % 360 !== 0) {
      // Está en su lugar pero torcida: no encaja; hay que girarla
      toTray(t, 'nope'); KidsGame.sound.wrong(); KidsGame.toast('Gírala 🔄', 900);
      return;
    }
    if (near) {
      t.state = 'placed'; t.el.className = 'tile placed'; board.appendChild(t.el); styleTile(t);
      KidsGame.sound.ok(); KidsGame.addStar(); KidsGame.vibrate(30);
      placed++;
      if (placed === tiles.length) finish();
    } else {
      toTray(t);
      KidsGame.sound.pop();
    }
  }
  document.addEventListener('pointermove', move);
  document.addEventListener('pointerup', up);
  document.addEventListener('pointercancel', up);

  function finish() {
    clearTimeout(peekTimer); if (peek) peek.classList.remove('show');
    board.classList.add('done');
    KidsGame.confetti(30);
    setTimeout(function () {
      if (step >= GRIDS[level].length - 1) KidsGame.levelDone(level);
      KidsGame.celebrate({
        sub: 'Nivel ' + level + ' · ' + cols + '×' + rows + ' completo',
        onNext: function () { scene++; step++; if (step >= GRIDS[level].length) { step = 0; level = Math.min(level + 1, 4); } start(); },
        onAgain: function () { start(); }
      });
    }, 1300);
  }

  window.addEventListener('resize', layout);
  pickLevel();
})();
</script>
