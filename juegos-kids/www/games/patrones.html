<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<link rel="stylesheet" href="../common.css">
<title>El collar de Lula</title>
<style>
  /* ===== Mundo: "El taller de collares de Lula" — cada patrón es un collar de cuentas que Lula la llama se pone ===== */
  .game {
    display: flex; flex-direction: column; align-items: center; padding: 10px 12px; gap: 10px;
    background:
      radial-gradient(ellipse 70% 40% at 50% 0%, rgba(255,255,255,.6), rgba(255,255,255,0) 70%),
      radial-gradient(ellipse 100% 60% at 50% 110%, rgba(120,60,0,.3), rgba(0,0,0,0) 60%),
      linear-gradient(180deg, #ffe3f1 0%, #ffc1dd 45%, #f59ac6 100%);
  }
  /* mesa de madera del taller + hilos y botones de fondo */
  .game::after { content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 30%; z-index: 0; pointer-events: none;
    background: repeating-linear-gradient(90deg, rgba(0,0,0,0) 0 90px, rgba(0,0,0,.06) 90px 94px), linear-gradient(180deg, #e0a860 0%, #c98a4b 40%, #a86a30 100%);
    border-top: 6px solid #f3c98a; box-shadow: inset 0 10px 18px rgba(255,255,255,.25), 0 -6px 14px rgba(0,0,0,.15); }
  .game::before { content: ""; position: absolute; inset: 0; pointer-events: none; z-index: 0; opacity: .7;
    background:
      radial-gradient(circle at 8% 22%, rgba(255,255,255,.9) 0 6px, rgba(255,255,255,0) 7px 14px, rgba(255,255,255,.6) 15px 20px, rgba(255,255,255,0) 21px),
      radial-gradient(circle at 93% 18%, rgba(255,255,255,.9) 0 5px, rgba(255,255,255,0) 6px 12px, rgba(255,255,255,.6) 13px 17px, rgba(255,255,255,0) 18px),
      radial-gradient(circle at 20% 60%, rgba(255,255,255,.45) 0 10px, rgba(255,255,255,0) 11px),
      radial-gradient(circle at 85% 55%, rgba(255,255,255,.4) 0 12px, rgba(255,255,255,0) 13px); }
  .hud { position: relative; z-index: 2; flex: 0 0 auto; display: flex; align-items: center; gap: 12px; padding: 6px 10px 6px 14px; border-radius: 40px; max-width: 100%; }
  .dots { display: flex; gap: 6px; }
  .dots span { width: 16px; height: 16px; border-radius: 50%; background: linear-gradient(180deg, #e8ecf5, #c9d2e6); box-shadow: inset 0 2px 3px rgba(0,0,0,.18); transition: transform .2s, background .2s; }
  .dots span.on { background: radial-gradient(circle at 35% 30%, #ffd6e8, #f0569a 70%); box-shadow: 0 2px 0 #b8306f, 0 3px 6px rgba(0,0,0,.25), inset 0 1px 0 #fff; transform: scale(1.15); }
  .hud .btn.round { width: 64px; height: 64px; font-size: 28px; }
  .hud .hero { width: 52px; height: 52px; flex: 0 0 auto; } .hud .hero svg { width: 100%; height: 100%; overflow: visible; }
  .hud .streak { display: none; font-size: 18px; font-weight: 900; color: #fff; padding: 4px 12px; border-radius: 20px; white-space: nowrap; background: linear-gradient(180deg, #ff9f43, #ff5e3a); box-shadow: 0 3px 0 #b8300a, 0 5px 10px rgba(0,0,0,.25); text-shadow: 0 1px 0 rgba(0,0,0,.3); animation: pop .4s ease-out; }
  .hud .streak.on { display: inline-block; }

  .instr { position: relative; z-index: 2; flex: 0 0 auto; display: flex; align-items: center; gap: 12px; padding: 8px 12px 8px 20px; border-radius: 40px; max-width: 96%; }
  .instr .txt { font-size: clamp(20px, 3.2vw, 30px); font-weight: 900; color: #b8306f; text-shadow: 0 2px 0 #fff, 0 3px 6px rgba(0,0,0,.12); white-space: nowrap; }
  .instr .txt.long { font-size: clamp(16px, 2.4vw, 24px); white-space: normal; text-align: center; }
  .instr .ico { font-size: 34px; animation: float 3s ease-in-out infinite; }

  .stage { position: relative; z-index: 1; flex: 1 1 auto; width: 100%; min-height: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: clamp(18px, 4vh, 48px); }
  .stage.out { animation: stout .26s ease-in forwards; } .stage.in { animation: stin .4s cubic-bezier(.3,1.3,.4,1); }
  @keyframes stout { to { transform: translateX(-70px) scale(.92); opacity: 0; } }
  @keyframes stin { from { transform: translateX(80px) scale(.92); opacity: 0; } to { transform: none; opacity: 1; } }

  /* ---- Lula la llama ---- */
  .lula { position: absolute; right: 2%; top: 0; width: var(--lw); height: calc(var(--lw) * 1.05); z-index: 3; pointer-events: none; transition: transform .3s; }
  .lula.beside { right: 1%; }
  .lula svg { width: 100%; height: 100%; overflow: visible; }
  .lula .collar { opacity: 0; transition: opacity .4s; }
  .lula.wears .collar { opacity: 1; }
  .lula.happy { animation: lulajump .9s ease-in-out; }
  @keyframes lulajump { 0%,100% { transform: translateY(0); } 25% { transform: translateY(-22px) rotate(-4deg); } 50% { transform: translateY(0) scale(1.05, .95); } 70% { transform: translateY(-12px) rotate(4deg); } }
  .lula .ear { transform-origin: 50% 100%; animation: earw 4s ease-in-out infinite; } .lula .ear.r { animation-delay: -1s; }
  @keyframes earw { 0%,88%,100% { transform: rotate(0); } 92% { transform: rotate(-12deg); } 96% { transform: rotate(8deg); } }
  .lula .eyes { transform-origin: 37px 36px; animation: mzblink 5s infinite; }

  /* ---- Hilo de cuentas (collar) ---- */
  .rowwrap { position: relative; padding: 22px 30px 26px; border-radius: 50px; transition: transform .75s cubic-bezier(.5,0,.3,1), opacity .4s .5s;
    background: linear-gradient(180deg, rgba(255,255,255,.45), rgba(255,255,255,.2)); box-shadow: inset 0 2px 0 rgba(255,255,255,.7), inset 0 -3px 0 rgba(120,40,80,.12), 0 10px 20px rgba(120,40,80,.18); }
  .rowwrap.fly { opacity: 0; }
  .rowwrap svg.cord { position: absolute; left: 0; top: 0; width: 100%; height: 100%; overflow: visible; pointer-events: none; }
  .rowwrap svg.cord path { fill: none; stroke: #c47f00; stroke-width: 7; stroke-linecap: round; }
  .rowwrap svg.cord path.hi { stroke: #ffe9a8; stroke-width: 3; }
  .row { position: relative; display: flex; gap: var(--gap); align-items: center; }
  .slot { position: relative; width: var(--s); height: var(--s); flex: 0 0 auto; display: flex; align-items: center; justify-content: center; transform: translateY(var(--dy, 0px)); }
  .tile {
    position: relative; width: 100%; height: 100%; border-radius: 50%; display: flex; align-items: center; justify-content: center;
    background: radial-gradient(circle at 36% 28%, rgba(255,255,255,1) 0%, rgba(255,255,255,.55) 16%, rgba(255,255,255,0) 40%), radial-gradient(circle at 50% 50%, #ffffff 0%, #e6ecf7 100%); border: 3px solid #fff;
    box-shadow: 0 7px 0 #b9c3d8, 0 14px 22px rgba(120,40,80,.3), inset 0 2px 0 #fff, inset 0 -6px 0 rgba(0,0,0,.08);
  }
  .tile::before { content: ""; position: absolute; left: 18%; right: 18%; top: 5%; height: 32%; border-radius: 50%; pointer-events: none; z-index: 2; background: linear-gradient(180deg, rgba(255,255,255,.9), rgba(255,255,255,0)); }
  .tile::after { content: ""; position: absolute; left: 50%; top: 50%; width: 10%; height: 10%; margin: -5% 0 0 -5%; border-radius: 50%; background: rgba(120,80,0,.18); box-shadow: inset 0 1px 2px rgba(0,0,0,.3); z-index: 0; }
  /* estilos de cuenta desbloqueables */
  .game.madera .tile { background: radial-gradient(circle at 36% 28%, rgba(255,255,255,.7) 0%, rgba(255,255,255,0) 35%), repeating-radial-gradient(circle at 50% 50%, #e0a860 0 6px, #c98a4b 6px 9px); border-color: #f3d3a0; box-shadow: 0 7px 0 #7a4a1c, 0 14px 22px rgba(120,40,80,.3), inset 0 2px 0 rgba(255,255,255,.6); }
  .game.perla .tile { background: radial-gradient(circle at 36% 28%, #ffffff 0%, #fdf6ff 30%, #e8d7f0 70%, #cbb5d8 100%); border-color: #fff; box-shadow: 0 7px 0 #a98dbb, 0 14px 22px rgba(120,40,80,.3), 0 0 0 2px rgba(255,255,255,.6), inset 0 2px 0 #fff; }
  .game.arcoiris .tile { background: radial-gradient(circle at 36% 28%, rgba(255,255,255,.95) 0%, rgba(255,255,255,0) 38%), conic-gradient(from 0deg, #ffb3b3, #ffe9a8, #c2ffd2, #bde4ff, #dcccff, #ffd0e6, #ffb3b3); border-color: #fff; box-shadow: 0 7px 0 #b8306f, 0 14px 22px rgba(120,40,80,.3), inset 0 2px 0 #fff; }
  .game.dorado .tile { background: radial-gradient(circle at 36% 28%, #fff9d6 0%, #ffe066 40%, #e0a020 100%); border-color: #fff3b0; box-shadow: 0 7px 0 #a86f00, 0 14px 22px rgba(120,40,80,.3), inset 0 2px 0 #fff; }
  .tile svg { width: 66%; height: 66%; overflow: visible; position: relative; z-index: 1; }
  .tile .emoji { font-size: calc(var(--s) * .5); filter: drop-shadow(0 5px 5px rgba(0,0,0,.3)); position: relative; z-index: 1; }
  .tile .grp { display: flex; flex-wrap: wrap; justify-content: center; align-content: center; gap: 4%; width: 72%; height: 72%; position: relative; z-index: 1; }
  .tile .grp svg { width: 40%; height: 40%; }
  .tile .grp.one svg { width: 78%; height: 78%; }
  .slot.q .tile { background: radial-gradient(circle at 50% 50%, #fff6d0, #ffd54a); border: 4px dashed #fff;
    box-shadow: 0 7px 0 #c47f00, 0 14px 22px rgba(0,40,90,.3), 0 0 0 5px rgba(255,255,255,.45), inset 0 2px 0 #fff; animation: qpulse 1.3s ease-in-out infinite; }
  .slot.q .tile::after { display: none; }
  .slot.q .tile span.qm { font-size: calc(var(--s) * .55); font-weight: 900; color: #fff; text-shadow: 0 3px 0 #c47f00, 0 6px 10px rgba(0,0,0,.3); }
  @keyframes qpulse { 0%,100% { transform: scale(1); } 50% { transform: scale(1.08); } }
  .slot.filled .tile { animation: land .6s cubic-bezier(.3,1.6,.5,1); }
  @keyframes land { 0% { transform: scale(1.3); } 40% { transform: scale(.85, 1.15); } 70% { transform: scale(1.1, .92); } 100% { transform: scale(1); } }
  .slot .tile.pop { animation: pop .4s ease-out backwards; }
  .slot .tile.shine { animation: beadshine .5s ease-out; }
  @keyframes beadshine { 0% { transform: scale(1); } 50% { transform: scale(1.18) rotate(8deg); } 100% { transform: scale(1); } }

  /* ---- Bandeja de cuentas ---- */
  .tray { position: relative; display: flex; gap: var(--tgap); padding: 16px 22px; border-radius: 34px; }
  .tray::before { content: ""; position: absolute; left: 18px; right: 18px; top: -14px; height: 22px; border-radius: 12px; pointer-events: none;
    background: linear-gradient(180deg, #ffd6e8, #f0569a); box-shadow: 0 3px 0 #b8306f, 0 6px 10px rgba(0,0,0,.2), inset 0 2px 0 #fff; }
  .cand { position: relative; width: var(--c); height: var(--c); cursor: pointer; transition: transform .12s; animation: cfloat 2.6s ease-in-out infinite; }
  @keyframes cfloat { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-6px); } }
  .cand .tile { --s: var(--c); }
  .cand:active { transform: scale(1.1) translateY(2px); animation: none; }
  .cand.used { visibility: hidden; }
  .cand.pop { animation: pop .4s ease-out backwards; }
  .flyer { position: absolute; z-index: 40; pointer-events: none; transition: transform .55s cubic-bezier(.3,1.3,.4,1); }

  /* ---- Niveles 3-4 ---- */
  .tile .sm { width: 46%; height: 46%; display: flex; position: relative; z-index: 1; }
  .tile .sm svg { width: 100%; height: 100%; }
  .slot.tap .tile { cursor: pointer; }
  .slot.tap .tile:active { transform: scale(.94); }
  .slot.q2 .tile { animation-delay: .4s; }
  .slot.wrong .tile { background: radial-gradient(circle at 50% 50%, #ffe3e3, #ff8a8a); border-color: #fff; box-shadow: 0 7px 0 #b30000, 0 14px 22px rgba(0,40,90,.3), 0 0 0 5px rgba(255,255,255,.5), 0 0 26px rgba(255,80,80,.9); animation: shake .5s; }
  .slot.wrong .tile::after { content: "✖"; position: absolute; right: -8px; top: -10px; left: auto; width: 1.3em; height: 1.3em; margin: 0; font-size: calc(var(--s) * .34); color: #fff; background: #e53170; border-radius: 50%; display: flex; align-items: center; justify-content: center; box-shadow: 0 3px 0 #a11f4e, 0 4px 8px rgba(0,0,0,.3); z-index: 3; }
  .slot.empty .tile { background: rgba(255,255,255,.5); border: 4px dashed #d9b3c7; box-shadow: inset 0 4px 10px rgba(120,40,80,.12); }
  .slot.empty .tile::after { display: none; }
  .slot.empty .tile .idx { font-size: calc(var(--s) * .34); color: #b88aa0; font-weight: 900; }
  .slot.next .tile { border-color: #ffb703; box-shadow: 0 0 0 5px rgba(255,183,3,.45), inset 0 4px 10px rgba(0,40,90,.12); animation: qpulse 1.3s ease-in-out infinite; }
  .row.shake { animation: shake .5s; }
  .tray .btn.round { width: var(--c); height: var(--c); min-width: 64px; min-height: 64px; font-size: calc(var(--c) * .45); flex: 0 0 auto; }

  .banner { position: absolute; left: 50%; top: 40%; z-index: 30; pointer-events: none; opacity: 0; transform: translate(-50%, -50%) scale(.5); padding: 12px 36px; border-radius: 40px; white-space: nowrap;
    font-size: clamp(26px, 4.5vw, 40px); font-weight: 900; color: #fff; background: linear-gradient(180deg, #ff9ccb, #f0569a); text-shadow: 0 3px 0 rgba(0,0,0,.2);
    box-shadow: 0 8px 0 #b8306f, 0 18px 30px rgba(0,0,0,.3), inset 0 2px 0 rgba(255,255,255,.6); }
  .banner.show { animation: bannerin 1.5s cubic-bezier(.3,1.4,.4,1) forwards; }
  @keyframes bannerin { 0% { opacity: 0; transform: translate(-50%,-50%) scale(.5); } 16% { opacity: 1; transform: translate(-50%,-50%) scale(1.06); } 26% { transform: translate(-50%,-50%) scale(1); } 76% { opacity: 1; transform: translate(-50%,-50%) scale(1); } 100% { opacity: 0; transform: translate(-50%,-100%) scale(.9); } }
  #defs { position: absolute; width: 0; height: 0; }
  @media (max-width: 800px) { .hud { gap: 8px; padding: 6px 8px; } }
</style>
</head>
<body>
<script src="../common.js"></script>
<script>
var game = KidsGame.init({ title: 'El collar de Lula' });
(function () {
  // ---------- Colores y formas (SVG con volumen) ----------
  var COLORS = {
    red:    ['#ffb3b3', '#ff4d4d', '#b30000'], orange: ['#ffd9a8', '#ff8a1a', '#b8500a'], yellow: ['#fff6b0', '#ffc800', '#c47f00'], green:  ['#c2ffd2', '#2fc56d', '#14784a'],
    blue:   ['#bde4ff', '#2f95e8', '#1a63a8'], purple: ['#dcccff', '#8a5cf6', '#5232b3'], pink:   ['#ffd0e6', '#ff5fa2', '#b8306f'], teal:   ['#c4fbf7', '#12b5b0', '#00706f']
  };
  var COLOR_KEYS = Object.keys(COLORS);
  var SHAPES = {
    circle:   '<circle cx="50" cy="50" r="44"/>', square:   '<rect x="8" y="8" width="84" height="84" rx="18"/>',
    star:     '<path d="M50 4 L62 36 L96 38 L69 59 L79 93 L50 74 L21 93 L31 59 L4 38 L38 36 Z" stroke-linejoin="round"/>',
    heart:    '<path d="M50 90 C20 68 4 52 4 32 C4 16 16 6 29 6 C39 6 46 12 50 20 C54 12 61 6 71 6 C84 6 96 16 96 32 C96 52 80 68 50 90 Z" stroke-linejoin="round"/>',
    triangle: '<path d="M50 6 L96 88 L4 88 Z" stroke-linejoin="round"/>', diamond:  '<path d="M50 4 L96 50 L50 96 L4 50 Z" stroke-linejoin="round"/>',
    flower:   '<path d="M50 8 C62 8 66 22 58 30 C70 26 80 36 74 46 C84 48 84 62 74 64 C80 74 70 84 58 80 C66 88 62 100 50 98 C38 100 34 88 42 80 C30 84 20 74 26 64 C16 62 16 48 26 46 C20 36 30 26 42 30 C34 22 38 8 50 8 Z" stroke-linejoin="round"/>',
    moon:     '<path d="M62 6 A44 44 0 1 0 62 94 A34 34 0 1 1 62 6 Z" stroke-linejoin="round"/>'
  };
  var SHAPE_KEYS = Object.keys(SHAPES);
  var HILITE = {
    circle: '<ellipse cx="36" cy="30" rx="18" ry="12"/>', square: '<ellipse cx="36" cy="26" rx="20" ry="9"/>', star: '<ellipse cx="44" cy="30" rx="8" ry="6"/>', heart: '<ellipse cx="30" cy="24" rx="10" ry="7"/>',
    triangle: '<ellipse cx="46" cy="34" rx="7" ry="9"/>', diamond: '<ellipse cx="42" cy="34" rx="9" ry="8"/>', flower: '<ellipse cx="40" cy="36" rx="9" ry="7"/>', moon: '<ellipse cx="34" cy="30" rx="8" ry="10"/>'
  };
  var defs = '<svg id="defs" aria-hidden="true"><defs>';
  COLOR_KEYS.forEach(function (k) { var c = COLORS[k]; defs += '<radialGradient id="g-' + k + '" cx="35%" cy="28%" r="80%"><stop offset="0" stop-color="' + c[0] + '"/><stop offset=".45" stop-color="' + c[1] + '"/><stop offset="1" stop-color="' + c[2] + '"/></radialGradient>'; });
  defs += '<filter id="sh" x="-30%" y="-30%" width="160%" height="170%"><feDropShadow dx="0" dy="4" stdDeviation="2.5" flood-color="#000" flood-opacity=".3"/></filter></defs></svg>';
  document.body.insertAdjacentHTML('beforeend', defs);

  function shapeSVG(shape, color) {
    var c = COLORS[color];
    return '<svg viewBox="0 0 100 100"><g transform="translate(0 5)" fill="rgba(0,0,0,.28)">' + SHAPES[shape] + '</g><g fill="url(#g-' + color + ')" stroke="' + c[2] + '" stroke-width="3">' + SHAPES[shape] + '</g><g fill="#fff" opacity=".55">' + HILITE[shape] + '</g></svg>';
  }
  function render(el) {
    if (el.t === 'shape') return el.size === 's' ? '<div class="sm">' + shapeSVG(el.shape, el.color) + '</div>' : shapeSVG(el.shape, el.color);
    if (el.t === 'emoji') return '<span class="emoji">' + el.e + '</span>';
    var s = '<div class="grp' + (el.n === 1 ? ' one' : '') + '">';
    for (var i = 0; i < el.n; i++) s += shapeSVG(el.shape, el.color);
    return s + '</div>';
  }
  function same(a, b) { return !!a && !!b && a.t === b.t && a.shape === b.shape && a.color === b.color && a.e === b.e && a.n === b.n && (a.size || 'b') === (b.size || 'b'); }
  // color representativo de una cuenta (para el collar de Lula)
  function beadColor(el) { if (el.t === 'emoji') return KidsGame.pick(['#ff5fa2', '#2f95e8', '#ffc800', '#2fc56d']); return COLORS[el.color][1]; }

  // ---------- Lula la llama (hero) ----------
  function lulaSVG(size) {
    return '<svg viewBox="0 0 110 115" width="' + size + '" height="' + Math.round(size * 1.05) + '" aria-hidden="true"><defs>' +
      '<radialGradient id="lf" cx="40%" cy="30%" r="75%"><stop offset="0" stop-color="#fffaf0"/><stop offset="1" stop-color="#eed9b8"/></radialGradient>' +
      '<radialGradient id="lp" cx="50%" cy="40%" r="60%"><stop offset="0" stop-color="#ffd6e8"/><stop offset="1" stop-color="#ff9ccb"/></radialGradient></defs>' +
      '<ellipse cx="58" cy="110" rx="40" ry="5" fill="rgba(0,0,0,.18)"/>' +
      '<rect x="34" y="92" width="10" height="18" rx="4" fill="#e2c69c"/><rect x="50" y="94" width="10" height="16" rx="4" fill="#e2c69c"/><rect x="70" y="92" width="10" height="18" rx="4" fill="#e2c69c"/><rect x="84" y="94" width="10" height="16" rx="4" fill="#e2c69c"/>' +
      '<g fill="url(#lf)" stroke="#c9a877" stroke-width="2"><ellipse cx="62" cy="86" rx="38" ry="20"/><circle cx="34" cy="76" r="12"/><circle cx="50" cy="70" r="13"/><circle cx="68" cy="69" r="13"/><circle cx="86" cy="74" r="12"/><circle cx="96" cy="86" r="10"/></g>' +
      '<path d="M28 80 Q26 52 30 34 Q36 24 44 34 Q46 56 48 80 Z" fill="url(#lf)" stroke="#c9a877" stroke-width="2"/>' +
      '<g class="collar"><path d="M27 64 Q37 76 47 66" fill="none" stroke="#c47f00" stroke-width="2.4"/>' +
      '<circle class="b1" cx="28" cy="65" r="3.6" fill="#ff5fa2" stroke="#fff" stroke-width="1"/><circle class="b2" cx="33" cy="70" r="3.6" fill="#2f95e8" stroke="#fff" stroke-width="1"/><circle class="b3" cx="38" cy="72" r="3.6" fill="#ffc800" stroke="#fff" stroke-width="1"/><circle class="b4" cx="43" cy="70" r="3.6" fill="#2fc56d" stroke="#fff" stroke-width="1"/><circle class="b5" cx="47" cy="65" r="3.6" fill="#8a5cf6" stroke="#fff" stroke-width="1"/></g>' +
      '<g class="ear l"><path d="M22 24 Q14 4 28 8 Q34 16 32 28 Z" fill="url(#lf)" stroke="#c9a877" stroke-width="2"/><path d="M25 22 Q21 11 27 12 Q30 17 29 24 Z" fill="#ffb6c1"/></g>' +
      '<g class="ear r"><path d="M52 24 Q60 4 46 8 Q40 16 42 28 Z" fill="url(#lf)" stroke="#c9a877" stroke-width="2"/><path d="M49 22 Q53 11 47 12 Q44 17 45 24 Z" fill="#ffb6c1"/></g>' +
      '<ellipse cx="37" cy="36" rx="22" ry="19" fill="url(#lf)" stroke="#c9a877" stroke-width="2"/>' +
      '<ellipse cx="37" cy="45" rx="13" ry="8" fill="#fff5e6"/>' +
      '<path d="M30 20 Q37 10 44 20 Q48 14 50 22 Q44 18 37 22 Q30 18 26 24 Z" fill="#f7e7cf"/>' +
      '<g class="eyes"><ellipse cx="29" cy="36" rx="4" ry="5" fill="#fff"/><ellipse cx="45" cy="36" rx="4" ry="5" fill="#fff"/><circle cx="30" cy="37" r="2.7" fill="#2b2b3b"/><circle cx="46" cy="37" r="2.7" fill="#2b2b3b"/><circle cx="31" cy="35.5" r="1" fill="#fff"/><circle cx="47" cy="35.5" r="1" fill="#fff"/>' +
      '<path d="M24 30 Q29 27 34 30 M40 30 Q45 27 50 30" fill="none" stroke="#2b2b3b" stroke-width="1.5" stroke-linecap="round"/></g>' +

    setTimeout(function () {
      fly.remove();
      q.classList.remove('q', 'q2', 'empty', 'next'); q.classList.add('filled');
      q.innerHTML = '<div class="tile">' + render(el) + '</div>';
      hitFX(q);
      fn && fn();
    }, 560);
  }

  function tap(c, el) {
    if (lock || !running) return;
    var target = cur.answers[step];
    if (same(el, target)) {
      lock = true;
      KidsGame.sound.pop();
      var q = row.querySelector('.slot.q');
      var last = step >= cur.answers.length - 1;
      flyTo(c, el, q, cur.mode !== 'two', function () {
        step++;
        if (last) success(); else { lock = false; KidsGame.sound.tap(); KidsGame.say('¡Bien! Ahora la otra'); }
      });
    } else shakeBad(c);
  }
  function tapSlot(s, i) {
    if (lock || !running) return;
    if (i === cur.broken) {
      lock = true; s.classList.add('wrong'); KidsGame.sound.pop();
      KidsGame.say('¡Esa! Debía ser así');
      setTimeout(function () {
        s.classList.remove('wrong'); s.classList.add('filled'); s.innerHTML = '<div class="tile">' + render(cur.good) + '</div>';
        hitFX(s);
        success();
      }, 900);
    } else shakeBad(s.querySelector('.tile'));
  }
  function placeCreate(c, el) {
    if (lock || !running || cur.seq.length >= cur.len) return;
    var i = cur.seq.length, q = row.children[i];
    cur.seq.push(el); lock = true;
    flyTo(c, el, q, false, function () {
      lock = false;
      if (row.children[i + 1]) row.children[i + 1].classList.add('next');
      else { KidsGame.toast('✅ ¿Listo? Toca la palomita', 1600); }
    });
    KidsGame.sound.pop();
  }
  function undoCreate() {
    if (lock || !running || !cur.seq.length) return;
    var i = cur.seq.length - 1; cur.seq.pop();
    row.querySelectorAll('.slot.next').forEach(function (s) { s.classList.remove('next'); });
    var s = row.children[i]; s.className = 'slot empty next'; s.innerHTML = '<div class="tile"><span class="idx">' + (i + 1) + '</span></div>';
    layout();
    KidsGame.sound.tap();
  }
  function patternPeriod(seq) {
    for (var p = 2; p <= 4; p++) {
      var ok = true;
      for (var i = p; i < seq.length && ok; i++) if (!same(seq[i], seq[i - p])) ok = false;
      if (!ok) continue;
      var distinct = seq.slice(0, p).filter(function (e, i, a) { return !a.slice(0, i).some(function (x) { return same(x, e); }); }).length;
      if (distinct >= 2) return p;
    }
    return 0;
  }
  function checkCreate() {
    if (lock || !running) return;
    if (cur.seq.length < cur.len) { KidsGame.toast('Faltan cuentas: ' + cur.seq.length + ' de ' + cur.len); KidsGame.sound.wrong(); KidsGame.say('Todavía faltan cuentas'); return; }
    var p = patternPeriod(cur.seq);
    if (p) {
      lock = true;
      Array.prototype.forEach.call(row.children, function (s, i) { setTimeout(function () { s.classList.add('filled'); KidsGame.sound.note(440 + i * 60); }, i * 110); });
      var names = ['', '', 'A B', 'A B C', 'A B C D'];
      KidsGame.say('¡Tu collar se repite cada ' + p + '! ' + (p === 2 ? 'Como A, B, A, B' : p === 3 ? 'Como A, B, C' : 'Como A, B, C, D'));
      KidsGame.toast('🎉 Patrón ' + names[p] + ' · se repite cada ' + p, 2000);
      setTimeout(success, 1100);
    } else {
      KidsGame.sound.wrong(); KidsGame.vibrate(30); streak = 0; setStreak();
      KidsGame.fx.shake(rowwrap);
      KidsGame.say('Hmm, no se repite igual. Un patrón va como A, B, A, B o A, A, B, A, A, B. Borra y prueba otra vez');
      KidsGame.toast('🤔 No se repite igual. Prueba A B A B…', 2200);
    }
  }

  function finish() {
    running = false;
    KidsGame.levelDone(nivel);
    var s = unlockSkin(nivel);
    if (skinBtn) skinBtn.style.display = cos.unlocked.length > 1 ? '' : 'none';
    KidsGame.celebrate({
      sub: '¡Lula tiene ' + ROUNDS + ' collares nuevos!' + (s ? ' 🎨 Nuevo: ' + s.n : ''),
      onNext: function () { start(Math.min(4, nivel + 1)); },
      onAgain: function () { start(nivel); }
    });
  }

  window.addEventListener('resize', layout);
  window.__pat = {
    get cur() { return cur; }, get lock() { return lock; }, get round() { return round; }, get step() { return step; },
    solve: function () {
      if (lock || !cur || !running) return false;
      var m = cur.mode, cs = Array.prototype.slice.call(tray.querySelectorAll('.cand'));
      function tapCand(el) { var i = cur.cands.findIndex(function (x) { return same(x, el); }); cs[i].dispatchEvent(new PointerEvent('pointerdown', { bubbles: true })); }
      if (m === 'broken') { row.children[cur.broken].dispatchEvent(new PointerEvent('pointerdown', { bubbles: true })); return 'broken:' + cur.broken; }
      if (m === 'create') {
        if (cur.seq.length < cur.len) { tapCand(cur.cands[cur.seq.length % 2]); return 'create:' + cur.seq.length; }
        tray.querySelector('.btn.green').dispatchEvent(new PointerEvent('pointerdown', { bubbles: true })); return 'create:check';
      }
      tapCand(cur.answers[step]); return m + ':' + step;
    }
  };
  showPicker();
})();
</script>
</body>
