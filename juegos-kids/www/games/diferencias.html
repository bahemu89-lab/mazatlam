<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<link rel="stylesheet" href="../common.css">
<title>Galería de arte</title>
<style>
  /* ===== Mundo: "La galería de arte" — dos cuadros casi iguales colgados en un museo; el telón se abre en cada sala ===== */
  .game {
    --f1: #fff3b0; --f2: #e0a020; --f3: #8a5a00; /* marco (cosmético) */
    display: flex; flex-direction: column; align-items: center; padding: 8px 12px 10px; gap: 8px;
    background:
      radial-gradient(ellipse 60% 40% at 50% 0%, rgba(255,255,255,.55), rgba(255,255,255,0) 70%),
      linear-gradient(180deg, #f6e7cf 0%, #e9d2b0 70%, #d9bd95 100%);
  }
  .game.madera { --f1: #e0b070; --f2: #a86a30; --f3: #5a3a14; } .game.rosa { --f1: #ffd6e8; --f2: #f0569a; --f3: #b8306f; }
  .game.azul { --f1: #d4f0ff; --f2: #2f95e8; --f3: #1a63a8; } .game.plata { --f1: #ffffff; --f2: #b9c3d8; --f3: #6b7a8a; }
  /* lambrín y piso del museo */
  .game::after { content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 13%; z-index: 0; pointer-events: none;
    background: repeating-linear-gradient(90deg, #8a6240 0 110px, #6e4a2a 110px 114px), linear-gradient(180deg, #a07040, #6e4a2a); background-blend-mode: multiply; border-top: 8px solid #fff8e6; box-shadow: 0 -4px 10px rgba(0,0,0,.2); }
  .game::before { content: ""; position: absolute; left: 0; right: 0; top: 0; height: 26px; z-index: 0; pointer-events: none; background: linear-gradient(180deg, #fff8e6, #efe0c4); box-shadow: 0 3px 6px rgba(0,0,0,.12); }
  .hud { position: relative; z-index: 2; flex: 0 0 auto; display: flex; align-items: center; gap: 10px; padding: 6px 10px 6px 14px; border-radius: 40px; max-width: 100%; }
  .hud .hero { width: 52px; height: 52px; flex: 0 0 auto; } .hud .hero svg { width: 100%; height: 100%; overflow: visible; }
  .hud .scene { font-size: 22px; font-weight: 900; color: #8a5a00; text-shadow: 0 1px 0 #fff; white-space: nowrap; }
  .hud .scene .emoji { font-size: 26px; vertical-align: middle; }
  .dots { display: flex; gap: 6px; }
  .dots span { width: 18px; height: 18px; border-radius: 50%; background: linear-gradient(180deg, #e8ecf5, #c9d2e6); box-shadow: inset 0 2px 3px rgba(0,0,0,.18); transition: transform .2s, background .2s; }
  .dots span.on { background: radial-gradient(circle at 35% 30%, #ffb3d1, #ff3d7f 70%); box-shadow: 0 2px 0 #b8306f, 0 3px 6px rgba(0,0,0,.25), inset 0 1px 0 #fff; transform: scale(1.15); }
  .hud .btn.round { width: 64px; height: 64px; font-size: 28px; }
  #hint { position: relative; }
  #hint .n { position: absolute; right: -6px; top: -6px; min-width: 26px; height: 26px; border-radius: 13px; font-size: 16px; line-height: 26px; padding: 0 6px; background: linear-gradient(180deg, #ff8fb1, #e53170); color: #fff; text-shadow: 0 1px 0 rgba(0,0,0,.3); box-shadow: 0 2px 0 #a11f4e, 0 3px 6px rgba(0,0,0,.3), inset 0 1px 0 rgba(255,255,255,.5); }
  #hint.off { opacity: .45; filter: saturate(.3); }
  .hud .timer { font-size: 20px; font-weight: 900; color: #fff; padding: 4px 14px; border-radius: 20px; white-space: nowrap; background: linear-gradient(180deg, #7dd0ff, #2f95e8); text-shadow: 0 2px 0 #1a63a8; box-shadow: 0 4px 0 #1a63a8, 0 6px 10px rgba(0,0,0,.2), inset 0 1px 0 rgba(255,255,255,.6); }
  .hud .timer.low { background: linear-gradient(180deg, #ffc077, #ff7a1a); text-shadow: 0 2px 0 #b8500a; box-shadow: 0 4px 0 #b8500a, 0 6px 10px rgba(0,0,0,.2), inset 0 1px 0 rgba(255,255,255,.6); }
  .hud .timer.over { background: linear-gradient(180deg, #e8ecf5, #c9d2e6); color: #6b7a99; text-shadow: none; box-shadow: 0 4px 0 #9aa7c7; }
  #hint.wiggle { animation: wiggle .5s; }
  @keyframes wiggle { 0%,100% { transform: rotate(0); } 25% { transform: rotate(-14deg); } 75% { transform: rotate(14deg); } }
  .hud .streak { display: none; font-size: 18px; font-weight: 900; color: #fff; padding: 4px 12px; border-radius: 20px; white-space: nowrap; background: linear-gradient(180deg, #ff9f43, #ff5e3a); box-shadow: 0 3px 0 #b8300a, 0 5px 10px rgba(0,0,0,.25); text-shadow: 0 1px 0 rgba(0,0,0,.3); animation: pop .4s ease-out; }
  .hud .streak.on { display: inline-block; }

  .instr { position: relative; z-index: 2; flex: 0 0 auto; display: flex; align-items: center; gap: 12px; padding: 6px 10px 6px 18px; border-radius: 40px; }
  .instr .txt { font-size: clamp(18px, 3vw, 28px); font-weight: 900; color: #8a5a00; text-shadow: 0 2px 0 #fff, 0 3px 6px rgba(0,0,0,.12); white-space: nowrap; }
  .instr .ico { font-size: 32px; animation: float 3s ease-in-out infinite; }

  .pics { position: relative; z-index: 1; flex: 1 1 auto; width: 100%; min-height: 0; display: flex; align-items: center; justify-content: center; gap: 18px; }
  /* marco dorado tallado */
  .frame {
    position: relative; flex: 0 0 auto; padding: 14px; border-radius: 10px;
    background: linear-gradient(135deg, var(--f1) 0%, var(--f2) 30%, var(--f1) 50%, var(--f2) 70%, var(--f3) 100%);
    box-shadow: 0 10px 0 var(--f3), 0 22px 34px rgba(80,40,0,.4), inset 0 0 0 3px rgba(255,255,255,.55), inset 0 0 0 6px var(--f2);
  }
  .frame::before { content: ""; position: absolute; inset: 7px; border-radius: 6px; pointer-events: none; z-index: 2; box-shadow: inset 0 0 0 2px var(--f3), inset 0 0 0 5px #fff8e6, inset 0 0 12px rgba(0,0,0,.4); }
  .frame .orn { position: absolute; width: 22px; height: 22px; border-radius: 50%; z-index: 3; pointer-events: none; background: radial-gradient(circle at 35% 30%, var(--f1), var(--f2) 55%, var(--f3)); box-shadow: 0 2px 3px rgba(0,0,0,.35); }
  .frame .orn.a { left: -4px; top: -4px; } .frame .orn.b { right: -4px; top: -4px; } .frame .orn.c { left: -4px; bottom: -4px; } .frame .orn.d { right: -4px; bottom: -4px; }
  .frame.pop { animation: pop .4s ease-out backwards; }
  .frame.r.pop { animation-delay: .12s; }
  .frame svg { display: block; width: 100%; height: 100%; border-radius: 4px; overflow: hidden; touch-action: none; cursor: pointer; box-shadow: inset 0 0 0 2px rgba(0,0,0,.08); }
  .frame .tag { position: absolute; left: 50%; bottom: -14px; transform: translateX(-50%); padding: 2px 14px; border-radius: 6px; font-size: 15px; font-weight: 900; color: #5a3a14; white-space: nowrap; z-index: 4;
    background: linear-gradient(180deg, #fff8e6, #e9d2b0); box-shadow: 0 3px 0 #a07040, 0 4px 8px rgba(0,0,0,.25); border: 2px solid #fff; }
  /* ganchito y cordón del cuadro */
  .frame .wire { position: absolute; left: 50%; top: -22px; width: 10px; height: 10px; margin-left: -5px; border-radius: 50%; background: radial-gradient(circle at 35% 30%, #fff, #b9c3d8 60%, #6b7a8a); box-shadow: 0 2px 3px rgba(0,0,0,.35); z-index: 3; }
  .frame .wire::before, .frame .wire::after { content: ""; position: absolute; top: 8px; width: 2px; height: 20px; background: #6b4a2a; transform-origin: 50% 0; }
  .frame .wire::before { left: 4px; transform: rotate(-58deg); } .frame .wire::after { left: 4px; transform: rotate(58deg); }
  .em { font-family: "Noto Color Emoji", "Apple Color Emoji", "Segoe UI Emoji", sans-serif; filter: drop-shadow(0 2px 1.5px rgba(0,0,0,.3)); }
  .ring { fill: none; stroke: #ff3d7f; stroke-width: 5; transform-box: fill-box; transform-origin: center; animation: ringin .5s cubic-bezier(.3,1.5,.5,1) backwards; filter: drop-shadow(0 0 3px #fff) drop-shadow(0 2px 2px rgba(0,0,0,.4)); }
  .ring.w { stroke: #fff; stroke-width: 9; opacity: .8; filter: none; }
  @keyframes ringin { 0% { transform: scale(2.4); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }
  .ripple { fill: rgba(255,255,255,.35); stroke: #fff; stroke-width: 3; transform-box: fill-box; transform-origin: center; animation: rip .5s ease-out forwards; pointer-events: none; }
  @keyframes rip { 0% { transform: scale(.2); opacity: 1; } 100% { transform: scale(1.6); opacity: 0; } }
  .hintp { fill: rgba(255,230,0,.12); stroke: #ffd400; stroke-width: 6; transform-box: fill-box; transform-origin: center; animation: hp .7s ease-in-out 3; pointer-events: none; filter: drop-shadow(0 0 4px #fff); }
  @keyframes hp { 0%,100% { transform: scale(.8); opacity: .4; } 50% { transform: scale(1.25); opacity: 1; } }
  .marks { pointer-events: none; }
  /* telón de la sala */
  .curtain { position: absolute; inset: -10px; z-index: 8; pointer-events: none; overflow: hidden; border-radius: 20px; }
  .curtain .c { position: absolute; top: 0; bottom: 0; width: 52%; transition: transform .6s cubic-bezier(.5,0,.3,1); background: repeating-linear-gradient(90deg, #ff6b6b 0 12px, #c62828 12px 30px, #7a0f0f 30px 36px); box-shadow: 0 0 30px rgba(0,0,0,.5); }
  .curtain .c.l { left: 0; transform: translateX(-102%); border-radius: 0 20px 20px 0 / 0 50% 50% 0; } .curtain .c.r { right: 0; transform: translateX(102%); border-radius: 20px 0 0 20px / 50% 0 0 50%; }
  .curtain.closed .c { transform: translateX(0); }
  .curtain .rod { position: absolute; left: 0; right: 0; top: 0; height: 12px; background: linear-gradient(180deg, #fff3b0, #c47f00); opacity: 0; transition: opacity .3s; }
  .curtain.closed .rod { opacity: 1; }
  .tutdot { position: fixed; width: 2px; height: 2px; pointer-events: none; z-index: 1; }
  .banner { position: absolute; left: 50%; top: 42%; z-index: 30; pointer-events: none; opacity: 0; transform: translate(-50%, -50%) scale(.5); padding: 12px 36px; border-radius: 40px; white-space: nowrap;
    font-size: clamp(24px, 4.2vw, 38px); font-weight: 900; color: #6a3f00; background: linear-gradient(180deg, #ffe98a, #ffb703); text-shadow: 0 2px 0 rgba(255,255,255,.6);
    box-shadow: 0 8px 0 #c47f00, 0 18px 30px rgba(0,0,0,.4), inset 0 2px 0 #fff; }
  .banner.show { animation: bannerin 1.7s cubic-bezier(.3,1.4,.4,1) forwards; }
  @keyframes bannerin { 0% { opacity: 0; transform: translate(-50%,-50%) scale(.5); } 14% { opacity: 1; transform: translate(-50%,-50%) scale(1.06); } 24% { transform: translate(-50%,-50%) scale(1); } 78% { opacity: 1; transform: translate(-50%,-50%) scale(1); } 100% { opacity: 0; transform: translate(-50%,-100%) scale(.9); } }
  #defs { position: absolute; width: 0; height: 0; }
  @media (max-width: 800px) { .hud { gap: 6px; padding: 6px 8px; } .hud .scene { font-size: 18px; } }
</style>
</head>
<body>
<script src="../common.js"></script>
<script>
var game = KidsGame.init({ title: 'Galería de arte' });
(function () {
  // ---------- Degradados compartidos ----------
  function LG(id, stops, horiz) {
    var s = '<linearGradient id="' + id + '" x1="0" y1="0" x2="' + (horiz ? 1 : 0) + '" y2="' + (horiz ? 0 : 1) + '">';
    stops.forEach(function (c, i) { s += '<stop offset="' + (i / (stops.length - 1)) + '" stop-color="' + c + '"/>'; });
    return s + '</linearGradient>';
  }
  function RG(id, stops, cx, cy) {
    var s = '<radialGradient id="' + id + '" cx="' + (cx || .38) + '" cy="' + (cy || .32) + '" r="' + .75 + '">';
    stops.forEach(function (c, i) { s += '<stop offset="' + (i / (stops.length - 1)) + '" stop-color="' + c + '"/>'; });
    return s + '</radialGradient>';
  }
  var DEFS = '<svg id="defs" aria-hidden="true"><defs>' +
    LG('gSky', ['#4fb3ff', '#9fdcff', '#e3f6ff']) + LG('gNight', ['#141c55', '#3b44a8', '#6c6fd0']) + LG('gSpace', ['#0b1038', '#232a6e', '#4a3f9a']) +
    RG('gSun', ['#fffbd0', '#ffd23a', '#ffa500']) + RG('gMoon', ['#ffffff', '#f2f4fa', '#c9d2e6']) +
    LG('gGrass', ['#b5f07a', '#63c74d', '#3e9a3a']) + LG('gHill', ['#cdf59a', '#7ccf5a']) +
    RG('gLeaf', ['#b7ef8a', '#4fae43', '#2a6e2a'], .35, .3) + LG('gTrunk', ['#b07a4a', '#7a4a24', '#4e2e14'], true) +
    LG('gSea', ['#8ee0ff', '#2a9be0', '#0c5fa0']) + LG('gDeep', ['#1aa0e0', '#0c5fa0', '#073d6e']) + LG('gSand', ['#fff3c4', '#f3d38a', '#dbb060']) +
    LG('gWood', ['#e2ad64', '#b77a36', '#8a5522']) + LG('gWood2', ['#f1c687', '#d49a52', '#a86a30']) + LG('gWall', ['#ffe9f2', '#ffc9dd']) + LG('gWallK', ['#fff8dc', '#ffe6a8']) +
    LG('gFloor', ['#edcb95', '#c99358', '#a8733c']) + LG('gTile', ['#e9f0f7', '#bfd0e0']) +
    RG('gRed', ['#ffc2c2', '#ff4d4d', '#a30000']) + RG('gBlue', ['#c9e9ff', '#2f95e8', '#155b9e']) + RG('gYellow', ['#fff9c4', '#ffc800', '#c47f00']) + RG('gYellow2', ['#fffbe0', '#ffe066', '#d9a520']) +
    RG('gGreen', ['#d2ffdf', '#2fc56d', '#14784a']) + RG('gPurple', ['#e6dcff', '#8a5cf6', '#4b2aa8']) + RG('gPink', ['#ffdcec', '#ff5fa2', '#b8306f']) + RG('gPink2', ['#ffe6f1', '#ff8fc0', '#c94a85']) +
    RG('gOrange', ['#ffe3bd', '#ff8a1a', '#b8500a']) + RG('gWhite', ['#ffffff', '#e6ecf5', '#b3bfd0']) + RG('gBrown', ['#e0b487', '#9c6a3a', '#5e3a17']) + RG('gTeal', ['#c4fbf7', '#12b5b0', '#00706f']) +
    LG('gBarn', ['#ff7f70', '#d9483a', '#a12e22']) + LG('gRoof', ['#9c5a3c', '#5a2e1a']) + LG('gMetal', ['#ffffff', '#c9d4e0', '#8b98a8']) +
    LG('gCastle', ['#f9dfa0', '#d9ad5a', '#b98a3f']) + LG('gGlass', ['rgba(255,255,255,.75)', 'rgba(255,255,255,.1)']) + LG('gDark', ['#3a2a1a', '#1a110a']) +
    '<filter id="ds" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="3" stdDeviation="2" flood-color="#000" flood-opacity=".3"/></filter>' +
    '</defs></svg>';
  document.body.insertAdjacentHTML('beforeend', DEFS);

  // ---------- Primitivas ----------
  function em(x, y, s, ch) { return '<text class="em" x="' + x + '" y="' + y + '" font-size="' + s + '" text-anchor="middle" dominant-baseline="central">' + ch + '</text>'; }
  function C(cx, cy, r, fill, extra) { return '<circle cx="' + cx + '" cy="' + cy + '" r="' + r + '" fill="' + fill + '"' + (extra || '') + '/>'; }
  function R(x, y, w, h, rx, fill, extra) { return '<rect x="' + x + '" y="' + y + '" width="' + w + '" height="' + h + '" rx="' + rx + '" fill="' + fill + '"' + (extra || '') + '/>'; }
  function P(d, fill, extra) { return '<path d="' + d + '" fill="' + fill + '" stroke-linejoin="round" stroke-linecap="round"' + (extra || '') + '/>'; }
  function EL(cx, cy, rx, ry, fill, extra) { return '<ellipse cx="' + cx + '" cy="' + cy + '" rx="' + rx + '" ry="' + ry + '" fill="' + fill + '"' + (extra || '') + '/>'; }
  function shadow(cx, cy, rx, ry) { return EL(cx, cy, rx, ry, 'rgba(0,0,0,.18)'); }
  function hi(cx, cy, rx, ry) { return EL(cx, cy, rx, ry, 'rgba(255,255,255,.55)'); }
  function ball(cx, cy, r, g) { return shadow(cx, cy + r * .95, r * .9, r * .28) + C(cx, cy, r, 'url(#' + g + ')', ' stroke="rgba(0,0,0,.18)" stroke-width="1.5"') + hi(cx - r * .3, cy - r * .35, r * .35, r * .2); }
  function cloud(x, y, s) {
    s = s || 1;
    return '<g transform="translate(' + x + ' ' + y + ') scale(' + s + ')" filter="url(#ds)">' + C(0, 0, 18, 'url(#gWhite)') + C(20, -8, 22, 'url(#gWhite)') + C(42, 0, 17, 'url(#gWhite)') + R(-8, 0, 60, 16, 8, 'url(#gWhite)') + EL(12, -12, 12, 5, 'rgba(255,255,255,.8)') + '</g>';
  }
  function sun(x, y, r, rays) {
    var s = '<g>', n = rays || 12;
    for (var i = 0; i < n; i++) { var a = i * Math.PI * 2 / n; s += '<line x1="' + (x + Math.cos(a) * (r + 6)) + '" y1="' + (y + Math.sin(a) * (r + 6)) + '" x2="' + (x + Math.cos(a) * (r + 16)) + '" y2="' + (y + Math.sin(a) * (r + 16)) + '" stroke="#ffd23a" stroke-width="4" stroke-linecap="round" opacity=".8"/>'; }
    return s + C(x, y, r + 8, 'rgba(255,220,80,.35)') + C(x, y, r, 'url(#gSun)') + hi(x - r * .3, y - r * .35, r * .35, r * .2) + '</g>';
  }
  function tree(x, y, s, apples) {
    var g = '<g transform="translate(' + x + ' ' + y + ') scale(' + s + ')">' + shadow(0, 2, 36, 7) + P('M-8 0 L-6 -50 L6 -50 L8 0 Z', 'url(#gTrunk)') +
      '<g filter="url(#ds)">' + C(-22, -62, 24, 'url(#gLeaf)') + C(22, -62, 24, 'url(#gLeaf)') + C(0, -84, 28, 'url(#gLeaf)') + C(0, -60, 30, 'url(#gLeaf)') + '</g>' + hi(-10, -96, 12, 5);
    var ap = [[-16, -56], [14, -70], [4, -44]];
    for (var i = 0; i < apples; i++) g += C(ap[i][0], ap[i][1], 5.5, 'url(#gRed)') + hi(ap[i][0] - 1.5, ap[i][1] - 2, 1.8, 1);
    return g + '</g>';
  }
  function flower(x, y, g, s, petals) {
    s = s || 1; var n = petals || 6;
    var o = '<g transform="translate(' + x + ' ' + y + ') scale(' + s + ')">' + P('M0 0 L0 -18', 'none', ' stroke="#3e9a3a" stroke-width="3"') + EL(4, -8, 6, 3, 'url(#gLeaf)', ' transform="rotate(-30 4 -8)"');
    for (var i = 0; i < n; i++) o += C(Math.cos(i * Math.PI * 2 / n) * 7, -22 + Math.sin(i * Math.PI * 2 / n) * 7, 5, 'url(#' + g + ')');
    return o + C(0, -22, 4.5, 'url(#gYellow)') + '</g>';
  }
  function star(cx, cy, r, g) {
    var d = '';
    for (var i = 0; i < 10; i++) { var rr = i % 2 ? r * .45 : r, a = -Math.PI / 2 + i * Math.PI / 5; d += (i ? 'L' : 'M') + (cx + Math.cos(a) * rr).toFixed(1) + ' ' + (cy + Math.sin(a) * rr).toFixed(1) + ' '; }
    return P(d + 'Z', 'url(#' + g + ')', ' stroke="rgba(0,0,0,.2)" stroke-width="1.5" filter="url(#ds)"');
  }
  function clockFace(cx, cy, r, alt) {
    var a1 = alt ? 90 : 0, a2 = alt ? 210 : 120;
    return '<g filter="url(#ds)">' + C(cx, cy, r, 'url(#gWhite)', ' stroke="#8b98a8" stroke-width="2"') +
      C(cx, cy - r * .7, 1.8, '#556') + C(cx, cy + r * .7, 1.8, '#556') + C(cx - r * .7, cy, 1.8, '#556') + C(cx + r * .7, cy, 1.8, '#556') +
      '<line x1="' + cx + '" y1="' + cy + '" x2="' + (cx + Math.sin(a1 * Math.PI / 180) * r * .45) + '" y2="' + (cy - Math.cos(a1 * Math.PI / 180) * r * .45) + '" stroke="#334" stroke-width="3" stroke-linecap="round"/>' +
      '<line x1="' + cx + '" y1="' + cy + '" x2="' + (cx + Math.sin(a2 * Math.PI / 180) * r * .7) + '" y2="' + (cy - Math.cos(a2 * Math.PI / 180) * r * .7) + '" stroke="#e53170" stroke-width="2.5" stroke-linecap="round"/>' + C(cx, cy, 2.5, '#334') + '</g>';
  }
  function bird(x, y, s) { return P('M' + (x - 14) + ' ' + y + ' q7 -10 14 0 q7 -10 14 0', 'none', ' stroke="#334" stroke-width="' + (2.5 * (s || 1)) + '" fill="none"'); }
  function seaweed(x, y, h, g, sway) { return P('M' + x + ' ' + y + ' q' + (sway || 8) + ' ' + (-h * .3) + ' 0 ' + (-h * .55) + ' q' + (-(sway || 8)) + ' ' + (-h * .25) + ' 2 ' + (-h), 'none', ' stroke="url(#' + g + ')" stroke-width="7" stroke-linecap="round"'); }
  function bubble(x, y, r) { return C(x, y, r, 'rgba(255,255,255,.18)', ' stroke="rgba(255,255,255,.7)" stroke-width="1.5"') + hi(x - r * .35, y - r * .35, r * .3, r * .2); }

  // ---------- Escenas (400x300). f = diferencias activas ----------
  var SCENES = [

    { name: 'Parque', icon: '🌳',
      diffs: [
        { id: 'pelota', x: 210, y: 252, r: 30, big: true }, { id: 'globo', x: 330, y: 150, r: 30, big: true },
        { id: 'cometa', x: 300, y: 78, r: 32, big: true }, { id: 'perro', x: 110, y: 258, r: 32, big: true },
        { id: 'flor', x: 40, y: 232, r: 28 }, { id: 'pajaro', x: 152, y: 76, r: 26 }, { id: 'manzanas', x: 100, y: 122, r: 28 },
        { id: 'nube', x: 205, y: 38, r: 40 }, { id: 'mariposa', x: 172, y: 165, r: 26 },
        // sutiles (Experto): pétalos, tono de la madera, rayos del sol
        { id: 'petalos', x: 372, y: 262, r: 26, sub: true }, { id: 'banca', x: 303, y: 196, r: 30, sub: true }, { id: 'rayos', x: 345, y: 55, r: 30, sub: true }
      ],

      onNext: function () { sceneIdx++; running = true; session++; curtain.classList.add('closed'); setTimeout(function () { loadScene(false); }, 300); },
      onAgain: function () { running = true; session++; curtain.classList.add('closed'); setTimeout(function () { loadScene(false); }, 300); }
    });
  }

  window.__diffs = function () {
    var m = svgs[1].getScreenCTM();
    return active.map(function (d) { var pt = svgs[1].createSVGPoint(); pt.x = d.x; pt.y = d.y; var q = pt.matrixTransform(m); return { id: d.id, x: q.x, y: q.y, sub: !!d.sub }; });
  };
  window.__dif = { get timeLeft() { return timeLeft; }, get hints() { return hints; }, get scene() { return scene && scene.name; }, get active() { return active.map(function (d) { return d.id; }); }, get found() { return found; }, get running() { return running && !curtain.classList.contains('closed'); }, get streak() { return streak; }, setTime: function (t) { timeLeft = t; renderTimer(); }, scenes: SCENES };

  window.addEventListener('resize', layout);
  showPicker();
})();
</script>
