<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<link rel="stylesheet" href="../common.css">
<title>Programa al robot</title>
<style>
  .game {
    display: flex; flex-direction: column; align-items: center; padding: 8px 12px; gap: 8px;
    background:
      radial-gradient(ellipse 70% 40% at 50% 0%, rgba(255,255,255,.5), rgba(255,255,255,0) 70%),
      radial-gradient(ellipse 100% 50% at 50% 110%, rgba(0,30,90,.45), rgba(0,0,0,0) 60%),
      linear-gradient(180deg, #a9e8ff 0%, #5fb9f0 45%, #2d6fc9 100%);
  }
  /* engranes decorativos */
  .game::before {
    content: ""; position: absolute; inset: 0; pointer-events: none; z-index: 0; opacity: .35;
    background:
      radial-gradient(circle at 6% 22%, rgba(255,255,255,.6) 0 8px, rgba(255,255,255,0) 9px 24px, rgba(255,255,255,.35) 25px 34px, rgba(255,255,255,0) 35px),
      radial-gradient(circle at 95% 30%, rgba(255,255,255,.6) 0 10px, rgba(255,255,255,0) 11px 30px, rgba(255,255,255,.35) 31px 42px, rgba(255,255,255,0) 43px),
      radial-gradient(circle at 10% 85%, rgba(255,255,255,.4) 0 20px, rgba(255,255,255,0) 21px),
      radial-gradient(circle at 92% 88%, rgba(255,255,255,.4) 0 16px, rgba(255,255,255,0) 17px);
  }
  .hud { position: relative; z-index: 2; flex: 0 0 auto; display: flex; align-items: center; gap: 10px; padding: 6px 10px 6px 14px; border-radius: 40px; max-width: 100%; }
  .hud .btn.round { width: 64px; height: 64px; font-size: 28px; }
  .dots { display: flex; gap: 6px; }
  .dots span { width: 16px; height: 16px; border-radius: 50%; background: linear-gradient(180deg, #e8ecf5, #c9d2e6); box-shadow: inset 0 2px 3px rgba(0,0,0,.18); transition: transform .2s, background .2s; }
  .dots span.on { background: radial-gradient(circle at 35% 30%, #fff3a8, #ffb703 70%); box-shadow: 0 2px 0 #c47f00, 0 3px 6px rgba(0,0,0,.25), inset 0 1px 0 #fff; transform: scale(1.15); }
  .steps { display: flex; flex-direction: column; align-items: center; line-height: 1; min-width: 80px; }
  .steps .big { font-size: 30px; font-weight: 900; color: #1a63a8; text-shadow: 0 2px 0 #fff, 0 4px 8px rgba(0,0,0,.15); }
  .steps .lbl { font-size: 13px; color: #4a6b9a; font-weight: 800; white-space: nowrap; }

  .main { position: relative; z-index: 1; flex: 1 1 auto; width: 100%; min-height: 0; display: flex; gap: 10px; align-items: center; justify-content: center; }
  .main.col { flex-direction: column; }
  .main.row { flex-direction: row; }

  /* Tablero */
  .boardwrap { flex: 0 0 auto; display: flex; align-items: center; justify-content: center; }
  .board {
    position: relative; display: grid; gap: var(--gap); padding: var(--pad); border-radius: 22px;
    background: linear-gradient(180deg, #7c8ea3 0%, #4c5f78 100%);
    box-shadow: 0 10px 0 #2a3a4f, 0 22px 34px rgba(0,20,60,.45), inset 0 3px 0 rgba(255,255,255,.4), inset 0 -4px 0 rgba(0,0,0,.25);
  }
  .tile {
    position: relative; width: var(--ts); height: var(--ts); border-radius: 16%; display: flex; align-items: center; justify-content: center;
    background: linear-gradient(180deg, #c8f58a 0%, #8fd65a 100%); border: 2px solid rgba(255,255,255,.55);
    box-shadow: 0 4px 0 #4e9a2a, 0 6px 8px rgba(0,0,0,.3), inset 0 2px 0 rgba(255,255,255,.7), inset 0 -3px 0 rgba(0,0,0,.08);
  }
  .tile.alt { background: linear-gradient(180deg, #b9ee7c 0%, #7fc94c 100%); }
  .tile::before { content: ""; position: absolute; left: 10%; right: 10%; top: 5%; height: 34%; border-radius: 16% 16% 50% 50%; pointer-events: none;
    background: linear-gradient(180deg, rgba(255,255,255,.6), rgba(255,255,255,0)); }
  .tile .emoji { font-size: calc(var(--ts) * .6); filter: drop-shadow(0 4px 4px rgba(0,0,0,.3)); z-index: 1; }
  .tile.rock { background: linear-gradient(180deg, #d9b48a 0%, #a8763f 100%); box-shadow: 0 4px 0 #5e3a12, 0 6px 8px rgba(0,0,0,.3), inset 0 2px 0 rgba(255,255,255,.6); }
  .tile.water { background: linear-gradient(180deg, #8fe0ff 0%, #2f95e8 100%); box-shadow: 0 4px 0 #1a63a8, 0 6px 8px rgba(0,0,0,.3), inset 0 2px 0 rgba(255,255,255,.7); overflow: hidden; }
  .tile.water::after { content: ""; position: absolute; left: -60%; top: 0; width: 60%; height: 100%; background: linear-gradient(90deg, rgba(255,255,255,0), rgba(255,255,255,.45), rgba(255,255,255,0)); animation: shine 2.6s linear infinite; }
  .tile.water .emoji { animation: float 2.2s ease-in-out infinite; }
  .tile.goal { background: radial-gradient(circle at 50% 40%, #fff6c4 0%, #ffd54a 60%, #f5b400 100%); box-shadow: 0 4px 0 #c47f00, 0 6px 8px rgba(0,0,0,.3), 0 0 18px 4px rgba(255,230,120,.8), inset 0 2px 0 #fff; }
  .tile.goal .emoji { animation: bounce 1.2s ease-in-out infinite; }
  .tile.goal.taken { background: linear-gradient(180deg, #c8f58a 0%, #8fd65a 100%); box-shadow: 0 4px 0 #4e9a2a, 0 6px 8px rgba(0,0,0,.3); }
  .tile.goal.taken .emoji { animation: none; opacity: .25; transform: scale(.7); }
  .tile.goal2 .emoji { animation: float 2s ease-in-out infinite; }
  .tile.light { background: linear-gradient(180deg, #8d93a8 0%, #5a607a 100%); box-shadow: 0 4px 0 #2e3245, 0 6px 8px rgba(0,0,0,.3), inset 0 2px 0 rgba(255,255,255,.5); }
  .tile.light .emoji { filter: grayscale(1) brightness(.75) drop-shadow(0 4px 4px rgba(0,0,0,.3)); transition: filter .3s, transform .3s; }
  .tile.light.lit { background: radial-gradient(circle at 50% 45%, #fffbe0 0%, #ffe066 55%, #ffb703 100%); box-shadow: 0 4px 0 #c47f00, 0 6px 8px rgba(0,0,0,.3), 0 0 26px 8px rgba(255,230,120,.95), inset 0 2px 0 #fff; }
  .tile.light.lit .emoji { filter: none; transform: scale(1.15); animation: litpop .5s ease-out; }
  @keyframes litpop { 0% { transform: scale(.6); } 60% { transform: scale(1.35); } 100% { transform: scale(1.15); } }
  .tile.start::after { content: ""; position: absolute; inset: 14%; border-radius: 50%; border: 3px dashed rgba(255,255,255,.75); pointer-events: none; }
  .bonkfx { position: absolute; z-index: 6; font-size: calc(var(--ts) * .8); pointer-events: none; animation: bonkfx .7s ease-out forwards; filter: drop-shadow(0 4px 4px rgba(0,0,0,.3)); }
  @keyframes bonkfx { 0% { transform: scale(.3); opacity: 1; } 60% { transform: scale(1.2); opacity: 1; } 100% { transform: scale(1.4); opacity: 0; } }

  /* Robot */
  .robot { position: absolute; left: var(--pad); top: var(--pad); width: var(--ts); height: var(--ts); z-index: 5; pointer-events: none;
    transition: transform .42s cubic-bezier(.4,.1,.3,1.2); display: flex; align-items: center; justify-content: center; }
  .robot.nojump { transition: none; }
  .robot .ring { position: absolute; inset: 2%; border-radius: 50%; transition: transform .35s cubic-bezier(.4,.1,.3,1.3);
    background: conic-gradient(from 0deg, rgba(255,255,255,.0), rgba(255,255,255,.0)); }
  .robot .ring::before { content: ""; position: absolute; left: 50%; top: -16%; width: 46%; height: 40%; margin-left: -23%;
    background: linear-gradient(180deg, #ffe98a, #ffb703); clip-path: polygon(50% 0%, 100% 100%, 50% 70%, 0% 100%);
    filter: drop-shadow(0 0 2px #fff) drop-shadow(0 3px 3px rgba(0,0,0,.45)); }
  .robot .med { position: absolute; inset: 11%; border-radius: 50%; display: flex; align-items: center; justify-content: center;
    background: radial-gradient(circle at 36% 28%, rgba(255,255,255,.95) 0%, rgba(255,255,255,.4) 18%, rgba(255,255,255,0) 40%), radial-gradient(circle at 50% 50%, #dcccff 0%, #8a5cf6 100%);
    border: 3px solid rgba(255,255,255,.9);
    box-shadow: 0 6px 0 #5232b3, 0 10px 14px rgba(30,10,80,.4), inset 0 3px 0 rgba(255,255,255,.7), inset 0 -5px 0 rgba(0,0,0,.1); }
  .robot .med .emoji { font-size: calc(var(--ts) * .46); filter: drop-shadow(0 3px 3px rgba(0,0,0,.35)); animation: breathe 2.4s ease-in-out infinite; }
  @keyframes breathe { 0%,100% { transform: scale(1); } 50% { transform: scale(1.07) translateY(-2px); } }
  .robot.bonk .med { animation: wobble .6s ease-in-out; }
  @keyframes wobble { 0%,100% { transform: rotate(0); } 20% { transform: rotate(-16deg) translateX(-6px); } 40% { transform: rotate(14deg) translateX(6px); } 60% { transform: rotate(-9deg); } 80% { transform: rotate(6deg); } }
  .robot.happy .med .emoji { animation: bounce .5s 3; }
  .robot.sad .med { filter: saturate(.5); }

  /* Columna de control */
  .ctrl { flex: 1 1 auto; min-width: 0; min-height: 0; display: flex; flex-direction: column; gap: 8px; align-items: stretch; justify-content: center; }
  .main.col .ctrl { width: 100%; flex: 0 0 auto; }
  .strip { position: relative; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; align-content: center; padding: 10px 12px; border-radius: 26px; min-height: 90px; }
  .strip .ttl { position: absolute; left: 18px; top: -12px; font-size: 14px; font-weight: 900; color: #fff; padding: 2px 12px; border-radius: 12px;
    background: linear-gradient(180deg, #7dd0ff, #2f95e8); box-shadow: 0 2px 0 #1a63a8, 0 4px 6px rgba(0,0,0,.25); }
  .slot { width: 64px; height: 64px; border-radius: 18px; border: 3px dashed rgba(26,99,168,.4); background: rgba(255,255,255,.35); flex: 0 0 auto; cursor: pointer; transition: background .15s, border-color .15s; }
  .slot.cur { border-color: #ffb703; background: rgba(255,233,138,.6); box-shadow: 0 0 0 4px rgba(255,233,138,.5); animation: nudge 1.2s ease-in-out infinite; }
  @keyframes nudge { 0%,100% { transform: scale(1); } 50% { transform: scale(1.06); } }
  .chip {
    --a: #7dd0ff; --b: #2f95e8; --d: #1a63a8;
    position: relative; width: 64px; height: 64px; border-radius: 18px; flex: 0 0 auto; cursor: pointer; display: flex; flex-direction: column; align-items: center; justify-content: center;
    background: linear-gradient(180deg, var(--a) 0%, var(--b) 100%); color: #fff; font-size: 34px; font-weight: 900; line-height: 1;
    text-shadow: 0 2px 0 rgba(0,0,0,.25);
    box-shadow: 0 5px 0 var(--d), 0 9px 14px rgba(0,0,0,.25), inset 0 2px 0 rgba(255,255,255,.6), inset 0 -2px 0 rgba(0,0,0,.08);
    transition: transform .1s, box-shadow .1s; user-select: none; touch-action: none;
  }
  .chip::before { content: ""; position: absolute; left: 8%; right: 8%; top: 5%; height: 40%; border-radius: inherit; pointer-events: none;
    background: linear-gradient(180deg, rgba(255,255,255,.55), rgba(255,255,255,.05)); }
  .chip .lbl { font-size: 11px; font-weight: 800; margin-top: 2px; text-shadow: 0 1px 0 rgba(0,0,0,.3); letter-spacing: .2px; }
  .chip.F { --a: #8ef0b0; --b: #24b36c; --d: #14784a; }
  .chip.L, .chip.R { --a: #7dd0ff; --b: #2f95e8; --d: #1a63a8; }
  .chip.B { --a: #ffe98a; --b: #ffb703; --d: #c47f00; color: #6a3f00; text-shadow: 0 1px 0 rgba(255,255,255,.6); }
  .chip.B .lbl { text-shadow: none; }
  .chip.LOOP, .loop .head { --a: #b39cff; --b: #7f5af0; --d: #5232b3; }
  .chip:active { transform: translateY(4px); box-shadow: 0 1px 0 var(--d), 0 3px 6px rgba(0,0,0,.2), inset 0 2px 0 rgba(255,255,255,.5); }
  .chip.run { transform: translateY(-6px) scale(1.1); z-index: 2; box-shadow: 0 9px 0 var(--d), 0 14px 18px rgba(0,0,0,.25), 0 0 0 4px #fff, 0 0 20px 6px rgba(255,255,255,.9), inset 0 2px 0 rgba(255,255,255,.6); }
  .chip.off { opacity: .4; filter: saturate(.3); pointer-events: none; }
  .chip.pop { animation: pop .3s ease-out; }
  .loop { position: relative; display: flex; align-items: center; gap: 4px; padding: 4px; border-radius: 20px; flex: 0 0 auto;
    background: linear-gradient(180deg, rgba(127,90,240,.22), rgba(82,50,179,.3)); border: 3px solid rgba(179,156,255,.9);
    box-shadow: inset 0 2px 4px rgba(0,0,0,.2), 0 3px 0 rgba(82,50,179,.35); }
  .loop.open { border-color: #ffb703; box-shadow: inset 0 2px 4px rgba(0,0,0,.2), 0 0 0 4px rgba(255,233,138,.6); }
  .loop .head { width: 64px; height: 64px; }
  .loop .head .n { font-size: 20px; margin-top: -2px; }
  .loop .head.run { transform: translateY(-4px) scale(1.06); box-shadow: 0 8px 0 var(--d), 0 12px 16px rgba(0,0,0,.25), 0 0 0 4px #fff, 0 0 18px 6px rgba(255,255,255,.9), inset 0 2px 0 rgba(255,255,255,.6); }
  .loop .body { display: flex; gap: 4px; align-items: center; }
  .loop .body .slot { width: 56px; height: 56px; border-radius: 14px; }
  .loop .body .chip { width: 56px; height: 56px; border-radius: 14px; font-size: 28px; }
  .loop .body .chip .lbl { display: none; }

  .pal { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; justify-content: center; padding: 10px 12px; border-radius: 26px; }
  .pal .chip { width: 72px; height: 72px; font-size: 36px; }
  .pal .sep { width: 3px; height: 56px; border-radius: 2px; background: rgba(26,99,168,.25); }
  .pal .btn { font-size: 22px; min-height: 64px; padding: 6px 16px; white-space: nowrap; }
  .pal .btn.run { font-size: 26px; padding: 6px 22px; }
  .pal .btn.round { width: 64px; height: 64px; padding: 0; font-size: 26px; }
  .pal .btn.off { opacity: .45; filter: saturate(.3); pointer-events: none; }
  .ghost { position: fixed; z-index: 60; pointer-events: none; transform: translate(-50%, -50%) scale(1.15); opacity: .95; }

  .spark { position: absolute; width: 14px; height: 14px; border-radius: 50%; pointer-events: none; z-index: 30; margin: -7px 0 0 -7px;
           box-shadow: 0 0 10px rgba(255,255,255,.9); animation: sparkfly .8s ease-out forwards; }
  .spark.star { border-radius: 0; clip-path: polygon(50% 0%, 61% 35%, 98% 35%, 68% 57%, 79% 91%, 50% 70%, 21% 91%, 32% 57%, 2% 35%, 39% 35%); width: 20px; height: 20px; margin: -10px 0 0 -10px; box-shadow: none; }
  @keyframes sparkfly { 0% { transform: translate(0,0) scale(.6) rotate(0deg); opacity: 1; } 60% { opacity: 1; } 100% { transform: translate(var(--dx), var(--dy)) scale(0) rotate(200deg); opacity: 0; } }
  .rating { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); z-index: 20; font-size: 64px; pointer-events: none; animation: ratepop 1.4s ease-out forwards; filter: drop-shadow(0 6px 6px rgba(0,0,0,.35)); white-space: nowrap; }
  @keyframes ratepop { 0% { transform: translate(-50%, -50%) scale(.3); opacity: 0; } 25% { transform: translate(-50%, -50%) scale(1.2); opacity: 1; } 80% { opacity: 1; } 100% { transform: translate(-50%, -90%) scale(1); opacity: 0; } }
  @media (max-width: 800px) { .hud { gap: 6px; padding: 6px 8px; } .steps { min-width: 64px; } .pal .btn { font-size: 18px; padding: 6px 10px; } }
</style>

<body>
<script src="../common.js"></script>
<script>
var game = KidsGame.init({ title: 'Programa al robot' });
(function () {
  var CFG = {
    1: { n: 5, slots: 5,  loops: false, lights: false, obst: [3, 4],   bfs: [2, 4] },
    2: { n: 6, slots: 8,  loops: false, lights: false, obst: [6, 8],   bfs: [4, 7] },
    3: { n: 7, slots: 6,  loops: true,  lights: false, obst: [8, 10],  bfs: [8, 12] },
    4: { n: 7, slots: 12, loops: true,  lights: true,  obst: [9, 12],  bfs: [8, 14] }
  };
  var LABELS = { 1: '5×5 · recto', 2: '6×6 · giros', 3: '7×7 · repetir 🔁', 4: '2 metas + luces 💡' };
  var PUZZLES = 5, MAXBODY = 4;
  var DR = [-1, 0, 1, 0], DC = [0, 1, 0, -1];
  var ICON = { F: '⬆', L: '↶', R: '↷', B: '💡', LOOP: '🔁' };
  var NAME = { F: 'avanza', L: 'izquierda', R: 'derecha', B: 'luz', LOOP: 'repite' };

  // ---------- Generador ----------
  function key(r, c) { return r * 16 + c; }
  function simulate(n, start, cmds) {
    // devuelve { ok, path:[{r,c}], lights:[{r,c}], pos, dir, starAt }
    var r = start.r, c = start.c, d = start.d, path = [{ r: r, c: c }], lights = [], seen = {};
    seen[key(r, c)] = 1;
    for (var i = 0; i < cmds.length; i++) {
      var t = cmds[i];
      if (t === 'F') { r += DR[d]; c += DC[d]; if (r < 0 || c < 0 || r >= n || c >= n) return { ok: false }; path.push({ r: r, c: c }); }
      else if (t === 'L') d = (d + 3) % 4;
      else if (t === 'R') d = (d + 1) % 4;
      else if (t === 'B') { if (seen[key(r, c)] === 2) return { ok: false }; lights.push({ r: r, c: c }); seen[key(r, c)] = 2; }
    }
    return { ok: true, path: path, lights: lights, r: r, c: c, d: d };
  }
  function randSeg(minF, maxF) { var out = [], k = minF + KidsGame.rand(maxF - minF + 1); for (var i = 0; i < k; i++) out.push('F'); return out; }
  function turn() { return KidsGame.pick(['L', 'R']); }
  function randomProgram(lv) {
    var p = [];
    if (lv === 1) {
      var kind = KidsGame.rand(3);
      if (kind === 0) p = randSeg(2, 4);
      else if (kind === 1) p = [turn()].concat(randSeg(1, 3));
      else p = randSeg(1, 2).concat([turn()], randSeg(1, 1));
      return { flat: p, loop: null };
    }
    if (lv === 2) {
      var turns = 1 + KidsGame.rand(3);
      p = randSeg(1, 2);
      for (var i = 0; i < turns; i++) p = p.concat([turn()], randSeg(1, 3));
      return { flat: p.slice(0, 7), loop: null };
    }
    if (lv === 3) {
      var bodies = [['F', 'F', 'R'], ['F', 'F', 'L'], ['F', 'R'], ['F', 'L'], ['F', 'F', 'F'], ['R', 'F', 'F'], ['L', 'F', 'F'], ['F', 'R', 'F'], ['F', 'L', 'F']];
      var body = KidsGame.pick(bodies), times = 2 + KidsGame.rand(2);
      var pre = KidsGame.pick([[], [turn()], ['F'], ['F', turn()], [turn(), 'F']]);
      var suf = KidsGame.pick([[], ['F'], [turn(), 'F'], ['F', 'F']]);
      var flat = pre.slice();
      for (var k = 0; k < times; k++) flat = flat.concat(body);
      flat = flat.concat(suf);
      return { flat: flat, loop: { pre: pre, body: body, times: times, suf: suf } };
    }
    // nivel 4: dos metas + luces
    var a = randSeg(1, 2).concat([turn()], randSeg(1, 3));
    if (KidsGame.rand(2)) a = a.concat([turn()], randSeg(1, 2));
    var b = [turn()].concat(randSeg(1, 3), [turn()], randSeg(1, 3));
    var nl = 1 + KidsGame.rand(2);
    // insertar 'B' en posiciones después de un F (no al final de segmento)
    function insertB(seg) {
      var idx = []; for (var i = 1; i < seg.length - 1; i++) if (seg[i - 1] === 'F') idx.push(i);
      if (!idx.length) return seg;
      var at = KidsGame.pick(idx); return seg.slice(0, at).concat(['B'], seg.slice(at));
    }
    a = insertB(a); if (nl === 2) b = insertB(b);
    return { flat: a.concat(b), loop: null, split: a.length };
  }
  function bfs(P) {
    // estados: r,c,d,stage,mask
    var n = P.n, nL = P.lights.length, full = (1 << nL) - 1;
    var start = [P.start.r, P.start.c, P.start.d, 0, 0];
    var Q = [start], dist = {}, head = 0;
    function sk(s) { return s[0] + ',' + s[1] + ',' + s[2] + ',' + s[3] + ',' + s[4]; }
    dist[sk(start)] = 0;
    function done(s) {
      if (!P.two) return s[0] === P.goal.r && s[1] === P.goal.c;
      return s[3] === 1 && s[0] === P.goal2.r && s[1] === P.goal2.c && s[4] === full;
    }
    while (head < Q.length) {
      var s = Q[head++], dcur = dist[sk(s)];
      if (done(s)) return dcur;
      if (dcur > 40) break;
      var nexts = [];
      var nr = s[0] + DR[s[2]], nc = s[1] + DC[s[2]];
      if (nr >= 0 && nc >= 0 && nr < n && nc < n && !P.block[key(nr, nc)]) {
        var st = s[3]; if (P.two && nr === P.goal.r && nc === P.goal.c) st = 1;
        nexts.push([nr, nc, s[2], st, s[4]]);
      }
      nexts.push([s[0], s[1], (s[2] + 3) % 4, s[3], s[4]]);
      nexts.push([s[0], s[1], (s[2] + 1) % 4, s[3], s[4]]);
      for (var li = 0; li < nL; li++) if (P.lights[li].r === s[0] && P.lights[li].c === s[1] && !(s[4] & (1 << li))) nexts.push([s[0], s[1], s[2], s[3], s[4] | (1 << li)]);
      for (var i = 0; i < nexts.length; i++) { var k = sk(nexts[i]); if (dist[k] === undefined) { dist[k] = dcur + 1; Q.push(nexts[i]); } }
    }
    return -1;
  }
  function genPuzzle(lv) {
    var cfg = CFG[lv], n = cfg.n, best = null;
    for (var tries = 0; tries < 400; tries++) {
      var start = { r: KidsGame.rand(n), c: KidsGame.rand(n), d: KidsGame.rand(4) };
      var prog = randomProgram(lv);
      var sim = simulate(n, start, prog.flat);
      if (!sim.ok) continue;
      var P = { n: n, start: start, lights: sim.lights, two: lv === 4, block: {}, obst: [], prog: prog, nivel: lv };
      P.goal = { r: sim.r, c: sim.c };
      if (P.goal.r === start.r && P.goal.c === start.c) continue;
      var pathKeys = {}; sim.path.forEach(function (p) { pathKeys[key(p.r, p.c)] = 1; });
      if (lv === 4) {
        var simA = simulate(n, start, prog.flat.slice(0, prog.split));
        P.goal = { r: simA.r, c: simA.c }; P.goal2 = { r: sim.r, c: sim.c };
        if (P.goal.r === P.goal2.r && P.goal.c === P.goal2.c) continue;
        if (P.goal.r === start.r && P.goal.c === start.c) continue;
        // luces no sobre inicio/metas

        if (badL || !P.lights.length) continue;
      }
      // obstáculos: preferir celdas vecinas del camino (para evitar atajos)
      var near = [], far = [];
      for (var r = 0; r < n; r++) for (var c = 0; c < n; c++) {
        if (pathKeys[key(r, c)]) continue;
        var adj = false;
        for (var d = 0; d < 4; d++) if (pathKeys[key(r + DR[d], c + DC[d])]) adj = true;
        (adj ? near : far).push({ r: r, c: c });
      }
      var want = cfg.obst[0] + KidsGame.rand(cfg.obst[1] - cfg.obst[0] + 1);
      var chosen = KidsGame.shuffle(near).slice(0, Math.min(near.length, Math.ceil(want * 0.7)));
      chosen = chosen.concat(KidsGame.shuffle(far).slice(0, want - chosen.length));
      chosen.forEach(function (o) { P.block[key(o.r, o.c)] = 1; P.obst.push({ r: o.r, c: o.c, t: KidsGame.rand(3) === 0 ? 'water' : 'rock' }); });

  }

  // ---------- Estado / UI ----------
  var nivel = 0, cfg = null, running = false, executing = false, P = null, idx = 0, scores = [], session = 0;
  var program = [], cursor = null; // cursor: null (principal) o referencia a bloque loop

    var sep = document.createElement('div'); sep.className = 'sep'; pal.appendChild(sep);
    undoBtn = document.createElement('button'); undoBtn.className = 'btn round blue'; undoBtn.textContent = '↩';
    undoBtn.addEventListener('pointerdown', function (ev) { ev.preventDefault(); undo(); });

  function explain() {

  }

  }
  function setSteps(n) { stepsEl.querySelector('.big').textContent = n; }

  // ---------- Programa ----------
  function makeChip(t, inPal) {

  function topCount() { return program.length; }

  }

    KidsGame.sound.pop(); renderProgram();
  }
  function clearProgram() { if (executing) return; program = []; cursor = null; KidsGame.sound.pop(); renderProgram(); }
  function setCursor(blk) { cursor = blk; renderProgram(); }

  function renderProgram() {
    strip.innerHTML = '<span class="ttl">PROGRAMA</span>';
    program.forEach(function (item) {
      if (item.t === 'LOOP') {
        var L = document.createElement('div'); L.className = 'loop' + (cursor === item ? ' open' : '');
        var head = document.createElement('div'); head.className = 'chip LOOP head'; head.innerHTML = '🔁<span class="n">×' + item.n + '</span>';
        head.addEventListener('pointerdown', function (ev) {
          ev.preventDefault(); ev.stopPropagation(); if (executing) return;
          if (!item.body.length && cursor === item) { removeItem(item, null); return; }
          item.n = item.n === 2 ? 3 : 2; cursor = item; KidsGame.sound.tap(); KidsGame.say('Repite ' + item.n + ' veces'); renderProgram();
        });
        L.appendChild(head);
        var body = document.createElement('div'); body.className = 'body';
        item.body.forEach(function (sub) {

          ch.addEventListener('pointerdown', function (ev) { ev.preventDefault(); ev.stopPropagation(); removeItem(sub, item); });
          body.appendChild(ch);
        });
        if (item.body.length < MAXBODY) {
          var s = document.createElement('div'); s.className = 'slot' + (cursor === item ? ' cur' : '');
          s.addEventListener('pointerdown', function (ev) { ev.preventDefault(); ev.stopPropagation(); KidsGame.sound.tap(); setCursor(item); });
          body.appendChild(s);

      var sl = document.createElement('div'); sl.className = 'slot' + (i === program.length && cursor === null ? ' cur' : '');

    runBtn.classList.toggle('off', program.length === 0);
    undoBtn.classList.toggle('off', program.length === 0);
    clearBtn.classList.toggle('off', program.length === 0);
    if (main && main.classList.contains('col')) layout();
  }

  // Arrastrar desde la paleta (o tocar para añadir)
  function attachDrag(el, t) {
    var ghost = null, sx = 0, sy = 0, moved = false, active = false;

    el.addEventListener('pointermove', function (ev) {
      if (!active) return;
      if (!moved && Math.abs(ev.clientX - sx) + Math.abs(ev.clientY - sy) > 14) {
        moved = true; ghost = makeChip(t, false); ghost.classList.add('ghost'); document.body.appendChild(ghost);
      }
      if (ghost) { ghost.style.left = ev.clientX + 'px'; ghost.style.top = ev.clientY + 'px'; }
    });
    function end(ev) {
      if (!active) return; active = false;
      if (ghost) { ghost.remove(); ghost = null; }
      if (!moved) { addCmd(t); el.classList.remove('pop'); void el.offsetWidth; el.classList.add('pop'); return; }
      var under = document.elementFromPoint(ev.clientX, ev.clientY);
      if (!under) return;
      var loopBox = under.closest ? under.closest('.loop') : null;
      if (loopBox && loopBox.__loop && t !== 'LOOP') { addCmd(t, loopBox.__loop); cursor = loopBox.__loop; renderProgram(); return; }
      if (under.closest && under.closest('.strip')) { addCmd(t, null); return; }
    }
    el.addEventListener('pointerup', end);
    el.addEventListener('pointercancel', end);
  }

  // ---------- Ejecución ----------
  function expand() {
    var out = [];
    program.forEach(function (item) {
      if (item.t === 'LOOP') { for (var k = 0; k < item.n; k++) item.body.forEach(function (sub) { out.push({ t: sub.t, el: sub.el, loop: item, iter: k + 1 }); }); }
      else out.push({ t: item.t, el: item.el });
    });
    return out;
  }
  function resetRobot() {
    rob = { r: P.start.r, c: P.start.c, d: P.start.d, stage: 0, lit: {} };
    Object.keys(tiles).forEach(function (k) { tiles[k].classList.remove('lit', 'taken'); });
    robotEl.classList.remove('sad', 'happy');
    placeRobot(false);
  }
  function run() {
    if (executing || !running || !program.length) return;
    KidsGame.sound.tap();
    executing = true; resetRobot();
    var list = expand(), i = 0, steps = 0;
    setSteps(0);
    var allLit = function () { return P.lights.every(function (L, k) { return rob.lit[k]; }); };
    function success() {
      if (!P.two) return rob.r === P.goal.r && rob.c === P.goal.c;

    function clearRun() { strip.querySelectorAll('.run').forEach(function (e) { e.classList.remove('run'); }); }
    function step() {

      if (cmd.loop && cmd.loop.el) { cmd.loop.el.classList.add('run'); cmd.loop.el.querySelector('.n').textContent = cmd.iter + '/' + cmd.loop.n; }
      var delay = 480;
      if (cmd.t === 'F') {
        var nr = rob.r + DR[rob.d], nc = rob.c + DC[rob.d];
        if (nr < 0 || nc < 0 || nr >= P.n || nc >= P.n || P.block[key(nr, nc)]) { bonk(nr, nc); return; }
        rob.r = nr; rob.c = nc; placeRobot(false); KidsGame.sound.tap();
        if (P.two && rob.stage === 0 && rob.r === P.goal.r && rob.c === P.goal.c) { rob.stage = 1; tiles[key(nr, nc)].classList.add('taken'); KidsGame.sound.ok(); sparkAt(nr, nc, 14); }
      } else if (cmd.t === 'L') { rob.d = (rob.d + 3) % 4; placeRobot(false); delay = 380; }
      else if (cmd.t === 'R') { rob.d = (rob.d + 1) % 4; placeRobot(false); delay = 380; }
      else if (cmd.t === 'B') {
        var li = -1; P.lights.forEach(function (L, k) { if (L.r === rob.r && L.c === rob.c) li = k; });
        if (li >= 0 && !rob.lit[li]) { rob.lit[li] = true; tiles[key(rob.r, rob.c)].classList.add('lit'); KidsGame.sound.ok(); sparkAt(rob.r, rob.c, 12); }
        else { KidsGame.sound.pop(); puff(rob.r, rob.c, '💨'); }
      }
      if (success()) { setTimeout(function () { clearRun(); solved(steps); }, 450); return; }
      setTimeout(step, delay);
    }
    function bonk(nr, nc) {
      KidsGame.sound.wrong(); KidsGame.vibrate(60);
      robotEl.classList.add('bonk');
      var inside = nr >= 0 && nc >= 0 && nr < P.n && nc < P.n;
      puff(inside ? nr : rob.r, inside ? nc : rob.c, '💥');
      KidsGame.say('¡Pum! Ahí no puede pasar.');

    }
    function endFail() {
      robotEl.classList.add('sad');
      var msg = 'Casi. El robot no llegó a la estrella.';
      if (P.two) { if (rob.stage === 0) msg = 'Primero tiene que pasar por la estrella.'; else if (!allLit()) msg = 'Faltan luces por encender.'; else msg = 'Casi. Falta llegar a la bandera.'; }
      KidsGame.say(msg); KidsGame.toast('🤔 ' + (P.two && rob.stage === 0 ? 'Primero ⭐' : (P.two && !allLit() ? 'Faltan 💡' : 'Casi...')), 1600);
      puff(rob.r, rob.c, '❓');

  function restoreLoopLabels() { program.forEach(function (it) { if (it.t === 'LOOP' && it.el) it.el.querySelector('.n').textContent = '×' + it.n; }); }
  function tileCenter(r, c) {
    var t = tiles[key(r, c)], g = game.getBoundingClientRect(), b = t.getBoundingClientRect();
    return { x: b.left + b.width / 2 - g.left, y: b.top + b.height / 2 - g.top };
  }

    for (var i = 0; i < (n || 18); i++) {

      s.style.setProperty('--dx', Math.cos(a) * d + 'px'); s.style.setProperty('--dy', (Math.sin(a) * d - 30) + 'px');

    }
  }
  function solved(steps) {
    var stars = steps <= P.opt + 1 ? 3 : (steps <= P.opt + 3 ? 2 : 1);
    scores.push(stars);
    robotEl.classList.add('happy');
    KidsGame.sound.ok(); KidsGame.addStar(1); KidsGame.vibrate(40);

    var rt = document.createElement('div'); rt.className = 'rating'; rt.textContent = '⭐'.repeat(stars); game.appendChild(rt);
