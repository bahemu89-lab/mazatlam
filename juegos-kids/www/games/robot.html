<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<link rel="stylesheet" href="../common.css">
<title>Robi en el planeta Chispa</title>
<style>
  /* ===== Mundo: "El planeta Chispa" — Robi, un robotito con ruedas, sigue tu programa para llegar a la estrella ===== */
  .game {
    --r1: #9fdcff; --r2: #2f95e8; --r3: #1a63a8; /* colores de Robi (skins) */
    display: flex; flex-direction: column; align-items: center; padding: 8px 12px; gap: 8px;
    background:
      radial-gradient(ellipse 50% 30% at 20% 0%, rgba(255,255,255,.25), rgba(255,255,255,0) 70%),
      radial-gradient(ellipse 100% 50% at 50% 115%, rgba(0,80,90,.6), rgba(0,0,0,0) 60%),
      linear-gradient(180deg, #2a1f6e 0%, #5b3fb0 45%, #2fa3a0 100%);
  }
  .game.rosa { --r1: #ffd6e8; --r2: #f0569a; --r3: #b8306f; } .game.verde { --r1: #c2ffd2; --r2: #24b36c; --r3: #14784a; }
  .game.dorado { --r1: #fff3b0; --r2: #ffb703; --r3: #c47f00; } .game.morado { --r1: #e3ccff; --r2: #8a5cf6; --r3: #5232b3; }
  .sky { position: absolute; inset: 0; z-index: 0; pointer-events: none; width: 100%; height: 100%; }
  .hud { position: relative; z-index: 2; flex: 0 0 auto; display: flex; align-items: center; gap: 10px; padding: 6px 10px 6px 14px; border-radius: 40px; max-width: 100%; }
  .hud .btn.round { width: 64px; height: 64px; font-size: 28px; }
  .hud .hero { width: 52px; height: 52px; flex: 0 0 auto; } .hud .hero svg { width: 100%; height: 100%; overflow: visible; }
  .dots { display: flex; gap: 6px; }
  .dots span { width: 16px; height: 16px; border-radius: 50%; background: linear-gradient(180deg, #e8ecf5, #c9d2e6); box-shadow: inset 0 2px 3px rgba(0,0,0,.18); transition: transform .2s, background .2s; }
  .dots span.on { background: radial-gradient(circle at 35% 30%, #fff3a8, #ffb703 70%); box-shadow: 0 2px 0 #c47f00, 0 3px 6px rgba(0,0,0,.25), inset 0 1px 0 #fff; transform: scale(1.15); }
  .steps { display: flex; flex-direction: column; align-items: center; line-height: 1; min-width: 80px; }
  .steps .big { font-size: 30px; font-weight: 900; color: #1a63a8; text-shadow: 0 2px 0 #fff, 0 4px 8px rgba(0,0,0,.15); }
  .steps .lbl { font-size: 13px; color: #4a6b9a; font-weight: 800; white-space: nowrap; }
  .hud .streak { display: none; font-size: 18px; font-weight: 900; color: #fff; padding: 4px 12px; border-radius: 20px; white-space: nowrap; background: linear-gradient(180deg, #ff9f43, #ff5e3a); box-shadow: 0 3px 0 #b8300a, 0 5px 10px rgba(0,0,0,.25); text-shadow: 0 1px 0 rgba(0,0,0,.3); animation: pop .4s ease-out; }
  .hud .streak.on { display: inline-block; }

  .main { position: relative; z-index: 1; flex: 1 1 auto; width: 100%; min-height: 0; display: flex; gap: 10px; align-items: center; justify-content: center; }
  .main.col { flex-direction: column; } .main.row { flex-direction: row; }

  /* Tablero: placas del planeta */
  .boardwrap { flex: 0 0 auto; display: flex; align-items: center; justify-content: center; }
  .boardwrap.out { animation: stout .26s ease-in forwards; } .boardwrap.in { animation: stin .45s cubic-bezier(.3,1.3,.4,1); }
  @keyframes stout { to { transform: translateX(-80px) scale(.9); opacity: 0; } }
  @keyframes stin { from { transform: translateX(90px) scale(.9); opacity: 0; } to { transform: none; opacity: 1; } }
  .board { position: relative; display: grid; gap: var(--gap); padding: var(--pad); border-radius: 22px;
    background: linear-gradient(180deg, #4e5f85 0%, #2b3656 100%);
    box-shadow: 0 10px 0 #151c30, 0 22px 34px rgba(0,0,40,.5), inset 0 3px 0 rgba(255,255,255,.3), inset 0 -4px 0 rgba(0,0,0,.3); }
  .board::before { content: ""; position: absolute; inset: 6px; border-radius: 16px; pointer-events: none; border: 2px dashed rgba(255,255,255,.12); }
  .tile { position: relative; width: var(--ts); height: var(--ts); border-radius: 16%; display: flex; align-items: center; justify-content: center;
    background: linear-gradient(180deg, #b7f7e6 0%, #6fd6c2 100%); border: 2px solid rgba(255,255,255,.5);
    box-shadow: 0 4px 0 #2b9a88, 0 6px 8px rgba(0,0,0,.3), inset 0 2px 0 rgba(255,255,255,.7), inset 0 -3px 0 rgba(0,0,0,.08); }
  .tile.alt { background: linear-gradient(180deg, #a4efdb 0%, #5fc9b4 100%); }
  .tile::before { content: ""; position: absolute; left: 10%; right: 10%; top: 5%; height: 34%; border-radius: 16% 16% 50% 50%; pointer-events: none; background: linear-gradient(180deg, rgba(255,255,255,.6), rgba(255,255,255,0)); }
  .tile svg { width: 92%; height: 92%; overflow: visible; position: relative; z-index: 1; }
  .tile.rock { background: linear-gradient(180deg, #8fa0b8 0%, #5c6b84 100%); box-shadow: 0 4px 0 #2e3a4c, 0 6px 8px rgba(0,0,0,.3), inset 0 2px 0 rgba(255,255,255,.5); }
  .tile.water { background: linear-gradient(180deg, #8fe0ff 0%, #2f95e8 100%); box-shadow: 0 4px 0 #1a63a8, 0 6px 8px rgba(0,0,0,.3), inset 0 2px 0 rgba(255,255,255,.7); overflow: hidden; }
  .tile.water::after { content: ""; position: absolute; left: -60%; top: 0; width: 60%; height: 100%; background: linear-gradient(90deg, rgba(255,255,255,0), rgba(255,255,255,.45), rgba(255,255,255,0)); animation: shine 2.6s linear infinite; }
  .tile.water svg { animation: float 2.4s ease-in-out infinite; }
  .tile.goal { background: radial-gradient(circle at 50% 40%, #fff6c4 0%, #ffd54a 60%, #f5b400 100%); box-shadow: 0 4px 0 #c47f00, 0 6px 8px rgba(0,0,0,.3), 0 0 18px 4px rgba(255,230,120,.8), inset 0 2px 0 #fff; }
  .tile.goal svg { animation: bounce 1.2s ease-in-out infinite; }
  .tile.goal.taken { background: linear-gradient(180deg, #b7f7e6 0%, #6fd6c2 100%); box-shadow: 0 4px 0 #2b9a88, 0 6px 8px rgba(0,0,0,.3); }
  .tile.goal.taken svg { animation: none; opacity: .25; transform: scale(.7); }
  .tile.goal2 svg { animation: float 2s ease-in-out infinite; }
  .tile.light { background: linear-gradient(180deg, #8d93a8 0%, #5a607a 100%); box-shadow: 0 4px 0 #2e3245, 0 6px 8px rgba(0,0,0,.3), inset 0 2px 0 rgba(255,255,255,.5); }
  .tile.light .bulb { fill: #c9d2e6; transition: fill .3s; } .tile.light .halo { opacity: 0; transition: opacity .3s; }
  .tile.light.lit { background: radial-gradient(circle at 50% 45%, #fffbe0 0%, #ffe066 55%, #ffb703 100%); box-shadow: 0 4px 0 #c47f00, 0 6px 8px rgba(0,0,0,.3), 0 0 26px 8px rgba(255,230,120,.95), inset 0 2px 0 #fff; }
  .tile.light.lit .bulb { fill: #fff3b0; } .tile.light.lit .halo { opacity: 1; }
  .tile.light.lit svg { animation: litpop .5s ease-out; }
  @keyframes litpop { 0% { transform: scale(.6); } 60% { transform: scale(1.25); } 100% { transform: scale(1); } }
  .tile.start::after { content: ""; position: absolute; inset: 12%; border-radius: 50%; border: 3px dashed rgba(255,255,255,.75); pointer-events: none; }
  .bonkfx { position: absolute; z-index: 6; font-size: calc(var(--ts) * .8); pointer-events: none; animation: bonkfx .7s ease-out forwards; filter: drop-shadow(0 4px 4px rgba(0,0,0,.3)); }
  @keyframes bonkfx { 0% { transform: scale(.3); opacity: 1; } 60% { transform: scale(1.2); opacity: 1; } 100% { transform: scale(1.4); opacity: 0; } }

  /* Robi */
  .robot { position: absolute; left: var(--pad); top: var(--pad); width: var(--ts); height: var(--ts); z-index: 5; pointer-events: none; transition: transform .42s cubic-bezier(.4,.1,.3,1.2); }
  .robot.nojump { transition: none; }
  .robot .bot { position: absolute; inset: 0; transition: transform .36s cubic-bezier(.4,.1,.3,1.35); }
  .robot .bot svg { width: 100%; height: 100%; overflow: visible; }
  .robot .body { transform-origin: 50px 52px; }
  .robot.moving .body { animation: rbob .42s ease-in-out; }
  @keyframes rbob { 0%,100% { transform: scale(1); } 50% { transform: scale(1.06, .94) translateY(2px); } }
  .robot .wheel .tread { transform-origin: 50% 50%; }
  .robot.moving .wheel .tread { animation: tread .42s linear; }
  @keyframes tread { to { transform: translateY(-12px); } }
  .robot .ant { transform-origin: 50px 10px; animation: antw 2.4s ease-in-out infinite; }
  @keyframes antw { 0%,100% { transform: rotate(-6deg); } 50% { transform: rotate(6deg); } }
  .robot .led { animation: led 1.2s ease-in-out infinite; }
  @keyframes led { 0%,100% { opacity: .5; } 50% { opacity: 1; } }
  .robot .eyes { transform-origin: 50px 38px; animation: mzblink 4s infinite; }
  .robot.turning .body { animation: rturn .36s ease-in-out; }
  @keyframes rturn { 50% { transform: scale(.92, 1.06); } }
  .robot.bonk .bot { animation: wobble .6s ease-in-out; }
  @keyframes wobble { 0%,100% { transform: translate(0,0); } 20% { transform: translate(-6px, 2px) rotate(-10deg); } 40% { transform: translate(6px, -2px) rotate(10deg); } 60% { transform: translate(-4px, 0) rotate(-6deg); } 80% { transform: translate(4px, 0) rotate(4deg); } }
  .robot.bonk .mouth { d: path("M40 60 Q50 54 60 60"); }
  .robot.happy .bot { animation: rjump .5s ease-in-out 3; }
  @keyframes rjump { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-14px) scale(1.05); } }
  .robot.happy .eyes ellipse { fill: #ffe98a; } .robot.sad .bot { filter: saturate(.5); }
  .robot .mouth { transition: d .3s; }
  .robot.happy .mouth { d: path("M38 56 Q50 68 62 56"); }
  .robot.sad .mouth { d: path("M40 62 Q50 54 60 62"); }

  /* Programa */
  .ctrl { flex: 1 1 auto; min-width: 0; min-height: 0; display: flex; flex-direction: column; gap: 8px; align-items: stretch; justify-content: center; }
  .main.col .ctrl { width: 100%; flex: 0 0 auto; }
  .strip { position: relative; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; align-content: center; padding: 10px 12px; border-radius: 26px; min-height: 90px; }
  .strip .ttl { position: absolute; left: 18px; top: -14px; z-index: 3; font-size: 14px; font-weight: 900; color: #fff; padding: 2px 12px; border-radius: 12px; background: linear-gradient(180deg, #7dd0ff, #2f95e8); box-shadow: 0 2px 0 #1a63a8, 0 4px 6px rgba(0,0,0,.25); }
  .slot { width: 64px; height: 64px; border-radius: 18px; border: 3px dashed rgba(26,99,168,.4); background: rgba(255,255,255,.35); flex: 0 0 auto; cursor: pointer; transition: background .15s, border-color .15s; }
  .slot.cur { border-color: #ffb703; background: rgba(255,233,138,.6); box-shadow: 0 0 0 4px rgba(255,233,138,.5); animation: nudge 1.2s ease-in-out infinite; }
  @keyframes nudge { 0%,100% { transform: scale(1); } 50% { transform: scale(1.06); } }
  .chip { --a: #7dd0ff; --b: #2f95e8; --d: #1a63a8;
    position: relative; width: 64px; height: 64px; border-radius: 18px; flex: 0 0 auto; cursor: pointer; display: flex; flex-direction: column; align-items: center; justify-content: center;
    background: linear-gradient(180deg, var(--a) 0%, var(--b) 100%); color: #fff; font-size: 34px; font-weight: 900; line-height: 1; text-shadow: 0 2px 0 rgba(0,0,0,.25);
    box-shadow: 0 5px 0 var(--d), 0 9px 14px rgba(0,0,0,.25), inset 0 2px 0 rgba(255,255,255,.6), inset 0 -2px 0 rgba(0,0,0,.08); transition: transform .1s, box-shadow .1s; user-select: none; touch-action: none; }
  .chip::before { content: ""; position: absolute; left: 8%; right: 8%; top: 5%; height: 40%; border-radius: inherit; pointer-events: none; background: linear-gradient(180deg, rgba(255,255,255,.55), rgba(255,255,255,.05)); }
  .chip .lbl { font-size: 11px; font-weight: 800; margin-top: 2px; text-shadow: 0 1px 0 rgba(0,0,0,.3); letter-spacing: .2px; }
  .chip.F { --a: #8ef0b0; --b: #24b36c; --d: #14784a; }
  .chip.L, .chip.R { --a: #7dd0ff; --b: #2f95e8; --d: #1a63a8; }
  .chip.B { --a: #ffe98a; --b: #ffb703; --d: #c47f00; color: #6a3f00; text-shadow: 0 1px 0 rgba(255,255,255,.6); }
  .chip.B .lbl { text-shadow: none; }
  .chip.LOOP, .loop .head { --a: #b39cff; --b: #7f5af0; --d: #5232b3; }
  .chip:active { transform: translateY(4px); box-shadow: 0 1px 0 var(--d), 0 3px 6px rgba(0,0,0,.2), inset 0 2px 0 rgba(255,255,255,.5); }
  .chip.run { transform: translateY(-6px) scale(1.1); z-index: 2; box-shadow: 0 9px 0 var(--d), 0 14px 18px rgba(0,0,0,.25), 0 0 0 4px #fff, 0 0 20px 6px rgba(255,255,255,.9), inset 0 2px 0 rgba(255,255,255,.6); }
  .chip.off { opacity: .4; filter: saturate(.3); pointer-events: none; }
  .chip.pop { animation: pop .3s ease-out; }
  .loop { position: relative; display: flex; align-items: center; gap: 4px; padding: 4px; border-radius: 20px; flex: 0 0 auto; background: linear-gradient(180deg, rgba(127,90,240,.22), rgba(82,50,179,.3)); border: 3px solid rgba(179,156,255,.9); box-shadow: inset 0 2px 4px rgba(0,0,0,.2), 0 3px 0 rgba(82,50,179,.35); }
  .loop.open { border-color: #ffb703; box-shadow: inset 0 2px 4px rgba(0,0,0,.2), 0 0 0 4px rgba(255,233,138,.6); }
  .loop .head { width: 64px; height: 64px; }
  .loop .head .n { font-size: 20px; margin-top: -2px; }
  .loop .head.run { transform: translateY(-4px) scale(1.06); box-shadow: 0 8px 0 var(--d), 0 12px 16px rgba(0,0,0,.25), 0 0 0 4px #fff, 0 0 18px 6px rgba(255,255,255,.9), inset 0 2px 0 rgba(255,255,255,.6); }
  .loop .body { display: flex; gap: 4px; align-items: center; }
  .loop .body .slot { width: 56px; height: 56px; border-radius: 14px; }
  .loop .body .chip { width: 56px; height: 56px; border-radius: 14px; font-size: 28px; }
  .loop .body .chip .lbl { display: none; }
  .pal { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; justify-content: center; padding: 10px 12px; border-radius: 26px; }
  .pal .chip { width: 72px; height: 72px; font-size: 36px; }
  .pal .sep { width: 3px; height: 56px; border-radius: 2px; background: rgba(26,99,168,.25); }
  .pal .btn { font-size: 22px; min-height: 64px; padding: 6px 16px; white-space: nowrap; }
  .pal .btn.run { font-size: 26px; padding: 6px 22px; }
  .pal .btn.round { width: 64px; height: 64px; padding: 0; font-size: 26px; }
  .pal .btn.off { opacity: .45; filter: saturate(.3); pointer-events: none; }
  .ghost { position: fixed; z-index: 60; pointer-events: none; transform: translate(-50%, -50%) scale(1.15); opacity: .95; }
  .rating { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); z-index: 20; font-size: 64px; pointer-events: none; animation: ratepop 1.4s ease-out forwards; filter: drop-shadow(0 6px 6px rgba(0,0,0,.35)); white-space: nowrap; }
  @keyframes ratepop { 0% { transform: translate(-50%, -50%) scale(.3); opacity: 0; } 25% { transform: translate(-50%, -50%) scale(1.2); opacity: 1; } 80% { opacity: 1; } 100% { transform: translate(-50%, -90%) scale(1); opacity: 0; } }
  .banner { position: absolute; left: 50%; top: 40%; z-index: 30; pointer-events: none; opacity: 0; transform: translate(-50%, -50%) scale(.5); padding: 12px 36px; border-radius: 40px; white-space: nowrap;
    font-size: clamp(26px, 4.5vw, 40px); font-weight: 900; color: #fff; background: linear-gradient(180deg, #7dd0ff, #2f95e8); text-shadow: 0 3px 0 rgba(0,0,0,.2);
    box-shadow: 0 8px 0 #1a63a8, 0 18px 30px rgba(0,0,0,.4), inset 0 2px 0 rgba(255,255,255,.6); }
  .banner.show { animation: bannerin 1.5s cubic-bezier(.3,1.4,.4,1) forwards; }
  @keyframes bannerin { 0% { opacity: 0; transform: translate(-50%,-50%) scale(.5); } 16% { opacity: 1; transform: translate(-50%,-50%) scale(1.06); } 26% { transform: translate(-50%,-50%) scale(1); } 76% { opacity: 1; transform: translate(-50%,-50%) scale(1); } 100% { opacity: 0; transform: translate(-50%,-100%) scale(.9); } }
  @media (max-width: 800px) { .hud { gap: 6px; padding: 6px 8px; } .steps { min-width: 64px; } .pal .btn { font-size: 18px; padding: 6px 10px; } }
</style>
</head>
<body>
<script src="../common.js"></script>
<script>
var game = KidsGame.init({ title: 'Robi en el planeta Chispa' });
(function () {
  var CFG = {
    1: { n: 5, slots: 5,  loops: false, lights: false, obst: [3, 4],   bfs: [2, 4] },
    2: { n: 6, slots: 8,  loops: false, lights: false, obst: [6, 8],   bfs: [4, 7] },
    3: { n: 7, slots: 6,  loops: true,  lights: false, obst: [8, 10],  bfs: [8, 12] },
    4: { n: 7, slots: 12, loops: true,  lights: true,  obst: [9, 12],  bfs: [8, 14] }
  };
  var LABELS = { 1: '5×5 · recto', 2: '6×6 · giros', 3: '7×7 · repetir 🔁', 4: '2 metas + luces 💡' };
  var PUZZLES = 5, MAXBODY = 4;
  var DR = [-1, 0, 1, 0], DC = [0, 1, 0, -1];
  var ICON = { F: '⬆', L: '↶', R: '↷', B: '💡', LOOP: '🔁' };
  var NAME = { F: 'avanza', L: 'izquierda', R: 'derecha', B: 'luz', LOOP: 'repite' };
  var SKINS = [{ id: 'azul', n: 'Robi azul', e: '🔵' }, { id: 'rosa', n: 'Robi rosa', e: '🩷' }, { id: 'verde', n: 'Robi verde', e: '💚' }, { id: 'dorado', n: 'Robi dorado', e: '⭐' }, { id: 'morado', n: 'Robi morado', e: '💜' }];
  var cos = { unlocked: ['azul'], sel: 'azul' };
  try { var sv = JSON.parse(localStorage.getItem('kg-cos-robot')); if (sv && sv.unlocked) cos = sv; } catch (e) {}
  function saveCos() { try { localStorage.setItem('kg-cos-robot', JSON.stringify(cos)); } catch (e) {} }

  // ---------- Arte: Robi (vista desde arriba, mira hacia arriba), rocas, charcos, estrella, bandera, foco ----------
  function robotSVG(size) {
    var w = size ? ' width="' + size + '" height="' + size + '"' : '';
    return '<svg viewBox="0 0 100 100"' + w + ' aria-hidden="true"><defs>' +
      '<linearGradient id="rb" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="var(--r1, #9fdcff)"/><stop offset=".55" stop-color="var(--r2, #2f95e8)"/><stop offset="1" stop-color="var(--r3, #1a63a8)"/></linearGradient>' +
      '<linearGradient id="rm" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#3a4252"/><stop offset=".5" stop-color="#8a95a8"/><stop offset="1" stop-color="#2b3140"/></linearGradient>' +
      '<radialGradient id="rv" cx="40%" cy="30%" r="70%"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#bfe9ff"/></radialGradient></defs>' +
      '<ellipse cx="52" cy="90" rx="38" ry="8" fill="rgba(0,0,0,.28)"/><g class="wheel"><rect x="8" y="30" width="16" height="52" rx="7" fill="url(#rm)"/><clipPath id="cw1"><rect x="8" y="30" width="16" height="52" rx="7"/></clipPath><g class="tread" clip-path="url(#cw1)"><path d="M8 34 h16 M8 46 h16 M8 58 h16 M8 70 h16 M8 82 h16 M8 94 h16" stroke="#fff" stroke-width="3" opacity=".55"/></g></g>' +
      '<g class="wheel"><rect x="76" y="30" width="16" height="52" rx="7" fill="url(#rm)"/><clipPath id="cw2"><rect x="76" y="30" width="16" height="52" rx="7"/></clipPath><g class="tread" clip-path="url(#cw2)"><path d="M76 34 h16 M76 46 h16 M76 58 h16 M76 70 h16 M76 82 h16 M76 94 h16" stroke="#fff" stroke-width="3" opacity=".55"/></g></g>' +
      '<g class="body">' +
      '<path d="M28 22 Q28 10 50 10 Q72 10 72 22 L72 76 Q72 86 62 86 L38 86 Q28 86 28 76 Z" fill="url(#rb)" stroke="var(--r3, #1a63a8)" stroke-width="2.5"/>' +
      '<path d="M34 24 Q34 16 50 16 Q66 16 66 24 L66 30 L34 30 Z" fill="rgba(255,255,255,.35)"/>' +
      '<path d="M40 12 L50 4 L60 12 Z" fill="#ffd54a" stroke="#c47f00" stroke-width="1.5"/>' +
      '<rect x="36" y="30" width="28" height="22" rx="8" fill="url(#rv)" stroke="var(--r3, #1a63a8)" stroke-width="2"/>' +
      '<g class="eyes"><ellipse cx="44" cy="40" rx="4" ry="5" fill="#1a2340"/><ellipse cx="56" cy="40" rx="4" ry="5" fill="#1a2340"/><circle cx="45" cy="38" r="1.3" fill="#fff"/><circle cx="57" cy="38" r="1.3" fill="#fff"/></g>' +
      '<path class="mouth" d="M43 58 Q50 64 57 58" fill="none" stroke="#1a2340" stroke-width="2.5" stroke-linecap="round"/>' +
      '<rect x="40" y="68" width="20" height="10" rx="3" fill="rgba(0,0,0,.18)"/><circle class="led" cx="45" cy="73" r="2.2" fill="#2fc56d"/><circle class="led" cx="55" cy="73" r="2.2" fill="#ff5fa2" style="animation-delay:-.6s"/>' +
      '<g class="ant"><line x1="50" y1="10" x2="50" y2="0" stroke="#8a95a8" stroke-width="3" stroke-linecap="round"/><circle class="led" cx="50" cy="-2" r="4.5" fill="#ff4d4d"/></g>' +
      '</g></svg>';
  }

  function full() { KidsGame.sound.wrong(); KidsGame.fx.shake(strip); KidsGame.say(cfg.loops ? 'Ya no caben más. Usa repite.' : 'Ya no caben más.'); }
  function removeItem(item, parent) {
    if (executing) return;
    var arr = parent ? parent.body : program, i = arr.indexOf(item);
    if (i >= 0) arr.splice(i, 1);
    if (cursor === item) cursor = null;
    KidsGame.sound.pop(); renderProgram();
  }
  function undo() {
    if (executing || !program.length) return;
    var last = program[program.length - 1];
    if (last.t === 'LOOP' && last.body.length) last.body.pop(); else { program.pop(); if (cursor === last) cursor = null; }
    KidsGame.sound.pop(); renderProgram();
  }
  function clearProgram() { if (executing) return; program = []; cursor = null; KidsGame.sound.pop(); renderProgram(); }
  function setCursor(blk) { cursor = blk; renderProgram(); }
  function renderProgram() {
    strip.innerHTML = '<span class="ttl">PROGRAMA</span>';
    program.forEach(function (item) {
      if (item.t === 'LOOP') {
        var L = document.createElement('div'); L.className = 'loop' + (cursor === item ? ' open' : '');
        var head = document.createElement('div'); head.className = 'chip LOOP head'; head.innerHTML = '🔁<span class="n">×' + item.n + '</span>';
        head.addEventListener('pointerdown', function (ev) {
          ev.preventDefault(); ev.stopPropagation(); if (executing) return;
          if (!item.body.length && cursor === item) { removeItem(item, null); return; }
          item.n = item.n === 2 ? 3 : 2; cursor = item; KidsGame.sound.tap(); KidsGame.say('Repite ' + item.n + ' veces'); renderProgram();
        });
        L.appendChild(head);
        var body = document.createElement('div'); body.className = 'body';
        item.body.forEach(function (sub) {
          var ch = makeChip(sub.t, false); sub.el = ch;
          ch.addEventListener('pointerdown', function (ev) { ev.preventDefault(); ev.stopPropagation(); removeItem(sub, item); });
          body.appendChild(ch);
        });
        if (item.body.length < MAXBODY) {
          var s = document.createElement('div'); s.className = 'slot' + (cursor === item ? ' cur' : '');
          s.addEventListener('pointerdown', function (ev) { ev.preventDefault(); ev.stopPropagation(); KidsGame.sound.tap(); setCursor(item); });
          body.appendChild(s);
        }
        L.appendChild(body); item.el = head; item.box = L; L.__loop = item;
        strip.appendChild(L);
      } else {
        var ch2 = makeChip(item.t, false); item.el = ch2;
        ch2.addEventListener('pointerdown', function (ev) { ev.preventDefault(); ev.stopPropagation(); removeItem(item, null); });
        strip.appendChild(ch2);
      }
    });
    for (var i = program.length; i < cfg.slots; i++) {
      var sl = document.createElement('div'); sl.className = 'slot' + (i === program.length && cursor === null ? ' cur' : '');
      strip.appendChild(sl);
    }
    runBtn.classList.toggle('off', program.length === 0);
    undoBtn.classList.toggle('off', program.length === 0);
    clearBtn.classList.toggle('off', program.length === 0);
    if (main && main.classList.contains('col')) layout();
  }
  function attachDrag(el, t) {
    var ghost = null, sx = 0, sy = 0, moved = false, active = false;
    el.addEventListener('pointerdown', function (ev) {
      ev.preventDefault(); if (executing) return;
      active = true; moved = false; sx = ev.clientX; sy = ev.clientY;
      try { el.setPointerCapture(ev.pointerId); } catch (e) {}
    });
    el.addEventListener('pointermove', function (ev) {
      if (!active) return;
      if (!moved && Math.abs(ev.clientX - sx) + Math.abs(ev.clientY - sy) > 14) { moved = true; ghost = makeChip(t, false); ghost.classList.add('ghost'); document.body.appendChild(ghost); }
      if (ghost) { ghost.style.left = ev.clientX + 'px'; ghost.style.top = ev.clientY + 'px'; }
    });
    function end(ev) {
      if (!active) return; active = false;
      if (ghost) { ghost.remove(); ghost = null; }
      if (!moved) { addCmd(t); el.classList.remove('pop'); void el.offsetWidth; el.classList.add('pop'); return; }
      var under = document.elementFromPoint(ev.clientX, ev.clientY);
      if (!under) return;
      var loopBox = under.closest ? under.closest('.loop') : null;
      if (loopBox && loopBox.__loop && t !== 'LOOP') { addCmd(t, loopBox.__loop); cursor = loopBox.__loop; renderProgram(); return; }
      if (under.closest && under.closest('.strip')) { addCmd(t, null); return; }
    }
    el.addEventListener('pointerup', end);
    el.addEventListener('pointercancel', end);
  }

  // ---------- Ejecución ----------
  function expand() {
    var out = [];
    program.forEach(function (item) {
      if (item.t === 'LOOP') { for (var k = 0; k < item.n; k++) item.body.forEach(function (sub) { out.push({ t: sub.t, el: sub.el, loop: item, iter: k + 1 }); }); }
      else out.push({ t: item.t, el: item.el });
    });
    return out;
  }
  function resetRobot() {
    rob = { r: P.start.r, c: P.start.c, d: P.start.d, stage: 0, lit: {} };
    Object.keys(tiles).forEach(function (k) { tiles[k].classList.remove('lit', 'taken'); });
    robotEl.classList.remove('sad', 'happy');
    placeRobot(false);
  }
  function tileCenter(r, c) { var t = tiles[key(r, c)], b = t.getBoundingClientRect(); return { x: b.left + b.width / 2, y: b.top + b.height / 2 }; }
  function puff(r, c, ch) {
    var p = tileCenter(r, c), g = game.getBoundingClientRect(), e = document.createElement('div'); e.className = 'bonkfx emoji'; e.textContent = ch;
    e.style.left = (p.x - g.left - 30) + 'px'; e.style.top = (p.y - g.top - 30) + 'px'; e.style.fontSize = '54px';
    game.appendChild(e); setTimeout(function () { e.remove(); }, 800);
  }
  function run() {
    if (executing || !running || !program.length) return;
    if (tutHand) { tutHand.stop(); tutHand = null; }
    KidsGame.sound.tap();
    executing = true; resetRobot();
    var list = expand(), i = 0, steps = 0, ss = session, myRun = ++runId;
    setSteps(0);
    var allLit = function () { return P.lights.every(function (L, k) { return rob.lit[k]; }); };
    function success() { if (!P.two) return rob.r === P.goal.r && rob.c === P.goal.c; return rob.stage === 1 && rob.r === P.goal2.r && rob.c === P.goal2.c && allLit(); }
    function clearRun() { strip.querySelectorAll('.run').forEach(function (e) { e.classList.remove('run'); }); }
    function step() {
      if (!running || ss !== session || myRun !== runId) { if (myRun === runId) executing = false; return; }
      clearRun();
      if (i >= list.length) { endFail(); return; }
      var cmd = list[i++]; steps++; setSteps(steps);
      if (cmd.el) cmd.el.classList.add('run');
      if (cmd.loop && cmd.loop.el) { cmd.loop.el.classList.add('run'); cmd.loop.el.querySelector('.n').textContent = cmd.iter + '/' + cmd.loop.n; }
      var delay = 480;
      if (cmd.t === 'F') {
        var nr = rob.r + DR[rob.d], nc = rob.c + DC[rob.d];
        if (nr < 0 || nc < 0 || nr >= P.n || nc >= P.n || P.block[key(nr, nc)]) { bonk(nr, nc); return; }
        rob.r = nr; rob.c = nc; placeRobot(false); anim('moving', 430); KidsGame.sound.tap();
        if (P.two && rob.stage === 0 && rob.r === P.goal.r && rob.c === P.goal.c) { rob.stage = 1; tiles[key(nr, nc)].classList.add('taken'); KidsGame.sound.ok(); var pc = tileCenter(nr, nc); KidsGame.fx.burst(pc.x, pc.y, { n: 12, chars: ['⭐', '✨'] }); }
      } else if (cmd.t === 'L') { rob.d = (rob.d + 3) % 4; placeRobot(false); anim('turning', 380); delay = 380; }
      else if (cmd.t === 'R') { rob.d = (rob.d + 1) % 4; placeRobot(false); anim('turning', 380); delay = 380; }
      else if (cmd.t === 'B') {
        var li = -1; P.lights.forEach(function (L, k) { if (L.r === rob.r && L.c === rob.c) li = k; });
        if (li >= 0 && !rob.lit[li]) { rob.lit[li] = true; tiles[key(rob.r, rob.c)].classList.add('lit'); KidsGame.sound.ok(); var lc = tileCenter(rob.r, rob.c); KidsGame.fx.burst(lc.x, lc.y, { n: 12, colors: ['#fff3b0', '#ffd54a', '#fff'] }); }
        else { KidsGame.sound.pop(); puff(rob.r, rob.c, '💨'); }
      }
      if (success()) { setTimeout(function () { clearRun(); solved(steps); }, 450); return; }
      setTimeout(step, delay);
    }
    function bonk(nr, nc) {
      KidsGame.sound.wrong(); KidsGame.vibrate(60);
      robotEl.classList.add('bonk'); streak = 0; setStreak();
      var inside = nr >= 0 && nc >= 0 && nr < P.n && nc < P.n;
      puff(inside ? nr : rob.r, inside ? nc : rob.c, '💥');
      KidsGame.fx.shake(boardwrap);
      KidsGame.say('¡Pum! Ahí no puede pasar.');
      setTimeout(function () { if (ss !== session || myRun !== runId) return; robotEl.classList.remove('bonk'); clearRun(); restoreLoopLabels(); resetRobot(); executing = false; }, 1100);
    }
    function endFail() {
      robotEl.classList.add('sad'); streak = 0; setStreak();
      var msg = 'Casi. Robi no llegó a la estrella.';
      if (P.two) { if (rob.stage === 0) msg = 'Primero tiene que pasar por la estrella.'; else if (!allLit()) msg = 'Faltan luces por encender.'; else msg = 'Casi. Falta llegar a la bandera.'; }
      KidsGame.say(msg); KidsGame.toast('🤔 ' + (P.two && rob.stage === 0 ? 'Primero ⭐' : (P.two && !allLit() ? 'Faltan 💡' : 'Casi...')), 1600);
      puff(rob.r, rob.c, '❓');
      setTimeout(function () { if (ss !== session || myRun !== runId) return; restoreLoopLabels(); resetRobot(); executing = false; }, 1300);
    }
    step();
  }
  function restoreLoopLabels() { program.forEach(function (it) { if (it.t === 'LOOP' && it.el) it.el.querySelector('.n').textContent = '×' + it.n; }); }
  function solved(steps) {
    var stars = steps <= P.opt + 1 ? 3 : (steps <= P.opt + 3 ? 2 : 1);
    scores.push(stars);
    robotEl.classList.add('happy');
    KidsGame.sound.ok(); KidsGame.addStar(1); KidsGame.vibrate(40);
    var pc = tileCenter(rob.r, rob.c);
    KidsGame.fx.ring(tiles[key(rob.r, rob.c)]); KidsGame.fx.burst(pc.x, pc.y, { n: 20 });
    if (stars === 3) streak++; else streak = 0;
    setStreak();
    setTimeout(function () {
      if (streak >= 3) KidsGame.fx.floatText(pc.x, pc.y - 50, '¡Racha x' + streak + '!', 'good'); else KidsGame.fx.floatText(pc.x, pc.y - 50, stars === 3 ? '¡Perfecto!' : '¡Llegó!', 'good');
      if (streak > 0 && streak % 5 === 0) { KidsGame.addStar(1); KidsGame.fx.burst(pc.x, pc.y - 70, { n: 10, chars: ['⭐', '✨'] }); KidsGame.toast('⭐ ¡Bonus de racha!', 1200); }
    }, 300);
    var rt = document.createElement('div'); rt.className = 'rating'; rt.textContent = '⭐'.repeat(stars); boardwrap.appendChild(rt);
    setTimeout(function () { rt.remove(); }, 1500);
    dots.children[idx].classList.add('on'); idx++;
    KidsGame.say(stars === 3 ? '¡Perfecto!' : '¡Llegó!');
    var ss = session;
    // la siguiente misión se prepara durante la celebración (nunca al tocar)
    if (idx < PUZZLES) setTimeout(function () { if (ss === session && running) nextP = genPuzzle(nivel); }, 400);
    setTimeout(function () {
      if (ss !== session) return;
      if (idx >= PUZZLES) { executing = false; finish(); return; }
      boardwrap.classList.add('out'); // executing sigue en true hasta que aparece la nueva misión (evita dos corridas a la vez)
      setTimeout(function () { if (ss === session && running) newPuzzle(false); }, 280);
    }, 1900);
  }
  function finish() {
    running = false;
    var avg = scores.reduce(function (a, b) { return a + b; }, 0) / scores.length;
    var stars = avg >= 2.7 ? 3 : (avg >= 1.8 ? 2 : 1);
    var lv = nivel;
    KidsGame.levelDone(lv);
    var s = unlockSkin(lv);
    if (skinBtn) skinBtn.style.display = cos.unlocked.length > 1 ? '' : 'none';
    KidsGame.celebrate({
      sub: '¡' + PUZZLES + ' misiones completadas!' + (s ? ' 🎨 Nuevo: ' + s.n : ''), stars: stars,
      onNext: function () { start(Math.min(4, lv + 1)); },
      onAgain: function () { start(lv); }
    });
  }

  // ganchos para pruebas
  window.__robot = { get: function () { return { P: P, program: program, rob: rob, nivel: nivel, cfg: cfg, idx: idx, executing: executing, busy: busy || !running, streak: streak }; }, addCmd: addCmd, run: run, setProgram: function (p) { program = p; cursor = null; renderProgram(); }, bfs: bfs, gen: genPuzzle };

  window.addEventListener('resize', function () { layout(); });
  showPicker();
})();
</script>
