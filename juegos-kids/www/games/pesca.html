<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<link rel="stylesheet" href="../common.css">
<title>Pesca</title>
<style>
  .game { touch-action: none; overflow: hidden; background: linear-gradient(180deg, #7fd0ff 0%, #c9ecff 100%); }
  .sky { position: absolute; left: 0; right: 0; top: 0; height: 26%; background: linear-gradient(180deg, #62c4ff 0%, #b9e6ff 70%, #dff4ff 100%); }
  .sky .cloud { position: absolute; font-size: 54px; opacity: .9; filter: drop-shadow(0 6px 6px rgba(0,60,120,.15)); animation: drift linear infinite; }
  @keyframes drift { from { transform: translateX(-140px); } to { transform: translateX(110vw); } }
  .sky .sun { position: absolute; right: 20%; top: 46%; width: 70px; height: 70px; border-radius: 50%;
    background: radial-gradient(circle at 40% 35%, #fff9d0, #ffd83d 60%, #ffb703); box-shadow: 0 0 0 12px rgba(255,216,61,.28), 0 0 40px 10px rgba(255,216,61,.5); }
  .water { position: absolute; left: 0; right: 0; top: 26%; bottom: 0;
    background: linear-gradient(180deg, #4fc3f7 0%, #1e97dd 30%, #0f6fb8 70%, #0a4f8e 100%); }
  .water::before { content: ""; position: absolute; inset: 0; pointer-events: none; opacity: .35;
    background: repeating-linear-gradient(100deg, rgba(255,255,255,0) 0 60px, rgba(255,255,255,.35) 60px 90px, rgba(255,255,255,0) 90px 170px);
    animation: rays 6s ease-in-out infinite alternate; }
  @keyframes rays { from { opacity: .22; transform: translateX(-20px); } to { opacity: .45; transform: translateX(20px); } }
  .surface { position: absolute; left: -5%; right: -5%; top: 26%; height: 22px; margin-top: -11px; z-index: 3; pointer-events: none;
    background: radial-gradient(ellipse 40px 11px at 20px 50%, rgba(255,255,255,.9) 30%, rgba(255,255,255,0) 70%) 0 0/80px 22px repeat-x;
    animation: wave 2.4s ease-in-out infinite; opacity: .85; }
  @keyframes wave { 0%,100% { background-position-x: 0; transform: translateY(0); } 50% { background-position-x: 40px; transform: translateY(3px); } }
  .sand { position: absolute; left: 0; right: 0; bottom: 0; height: 9%; background: linear-gradient(180deg, #d9b97a, #b8934f); box-shadow: 0 -10px 20px rgba(0,0,0,.2); border-radius: 50% 50% 0 0 / 30px 30px 0 0; }
  .weed { position: absolute; bottom: 6%; width: 40px; height: 120px; transform-origin: 50% 100%; animation: sway 3s ease-in-out infinite alternate; pointer-events: none; }
  @keyframes sway { from { transform: rotate(-8deg); } to { transform: rotate(8deg); } }
  .bubble { position: absolute; bottom: 0; width: 14px; height: 14px; border-radius: 50%; pointer-events: none;
    background: radial-gradient(circle at 35% 30%, rgba(255,255,255,.95), rgba(255,255,255,.25) 60%, rgba(255,255,255,0)); border: 1px solid rgba(255,255,255,.6);
    animation: rise linear infinite; }
  @keyframes rise { 0% { transform: translateY(0) scale(.6); opacity: 0; } 15% { opacity: .9; } 100% { transform: translateY(-75vh) translateX(20px) scale(1.2); opacity: 0; } }
  .boat { position: absolute; left: 50%; top: 26%; width: 260px; height: 130px; margin: -108px 0 0 -130px; z-index: 4; animation: bob 3s ease-in-out infinite; pointer-events: none; }
  @keyframes bob { 0%,100% { transform: translateY(0) rotate(-1deg); } 50% { transform: translateY(6px) rotate(1deg); } }
  .boat svg { width: 100%; height: 100%; overflow: visible; }
  .bucket { position: absolute; right: 8px; top: 34px; width: 74px; height: 80px; }
  .bucket svg { width: 100%; height: 100%; overflow: visible; }
  .bucket .n { position: absolute; left: 0; right: 0; top: 28px; text-align: center; font-size: 22px; font-weight: 900; color: #fff; text-shadow: 0 2px 0 #1f7fae, 0 0 6px rgba(0,0,0,.4); }
  .bucket.bump { animation: bump .35s ease-out; }
  @keyframes bump { 0% { transform: scale(1); } 40% { transform: scale(1.2) rotate(-6deg); } 100% { transform: scale(1); } }
  .line { position: absolute; width: 3px; background: linear-gradient(90deg, #d9dee8, #7c8494); z-index: 5; pointer-events: none; transform-origin: 50% 0; box-shadow: 1px 0 0 rgba(0,0,0,.15); }
  .hook { position: absolute; width: 36px; height: 44px; margin-left: -18px; z-index: 6; pointer-events: none; }
  .hook svg { width: 100%; height: 100%; overflow: visible; filter: drop-shadow(0 3px 3px rgba(0,0,0,.35)); }
  .hook.tickle svg { animation: tickle .18s infinite; }
  @keyframes tickle { 0%,100% { transform: rotate(-18deg); } 50% { transform: rotate(18deg); } }
  .fish { position: absolute; left: 0; top: 0; z-index: 4; will-change: transform; pointer-events: none; }
  .fish svg { width: 100%; height: 100%; overflow: visible; transition: transform .3s; filter: drop-shadow(0 6px 5px rgba(0,20,60,.35)); }
  .fish.l svg { animation: swim 1.1s ease-in-out infinite; }
  .fish.r svg { animation: swimr 1.1s ease-in-out infinite; }
  @keyframes swim { 0%,100% { transform: scaleX(1) rotate(-3deg); } 50% { transform: scaleX(1) rotate(3deg) translateY(-3px); } }
  @keyframes swimr { 0%,100% { transform: scaleX(-1) rotate(3deg); } 50% { transform: scaleX(-1) rotate(-3deg) translateY(-3px); } }
  .fish.caught { z-index: 7; }
  .fish.caught svg { animation: wiggle .22s ease-in-out infinite; }
  @keyframes wiggle { 0%,100% { transform: rotate(78deg); } 50% { transform: rotate(104deg); } }
  .fish.tobucket { transition: transform .6s cubic-bezier(.4,-.2,.6,1), opacity .5s .2s; opacity: 0; }
  .octo { position: absolute; z-index: 4; font-size: 84px; pointer-events: none; will-change: transform; }
  .octo .emoji { display: inline-block; animation: float 2.4s ease-in-out infinite; }
  .octo.laugh .emoji { animation: giggle .15s infinite; }
  @keyframes giggle { 0%,100% { transform: rotate(-12deg) scale(1.05); } 50% { transform: rotate(12deg) scale(.95); } }
  .splash { position: absolute; width: 10px; height: 10px; border-radius: 50%; background: radial-gradient(circle at 35% 30%, #fff, #bfe9ff); z-index: 8; pointer-events: none; animation: sp .7s ease-out forwards; }
  @keyframes sp { 0% { transform: translate(0,0) scale(1); opacity: 1; } 100% { transform: translate(var(--dx), var(--dy)) scale(.3); opacity: 0; } }
  .spark { position: absolute; width: 12px; height: 12px; z-index: 12; pointer-events: none; animation: sp .8s ease-out forwards; font-size: 16px; line-height: 1; }
  .ftxt { position: absolute; z-index: 12; pointer-events: none; font-size: 34px; font-weight: 900; color: #ff6f61; text-shadow: 0 2px 0 #fff, 0 0 8px #fff; animation: up 1s ease-out forwards; white-space: nowrap; }
  @keyframes up { 0% { opacity: 0; transform: translate(-50%, 10px) scale(.6); } 25% { opacity: 1; transform: translate(-50%, -10px) scale(1.15); } 100% { opacity: 0; transform: translate(-50%, -70px); } }
  .hud { position: absolute; left: 0; right: 0; top: 0; z-index: 10; pointer-events: none; display: flex; align-items: center; justify-content: space-between; padding: 8px 10px; gap: 8px; }
  .hud > * { pointer-events: auto; }
  .prog { display: flex; align-items: center; gap: 10px; padding: 4px 18px 4px 8px; min-height: 64px; border-radius: 40px;
    background: linear-gradient(180deg, rgba(255,255,255,.97), rgba(241,246,255,.93)); border: 3px solid #fff;
    box-shadow: 0 6px 0 #c9d2e6, 0 12px 20px rgba(20,40,90,.22), inset 0 2px 0 #fff; }
  .prog .tgt { width: 78px; height: 48px; display: flex; align-items: center; justify-content: center; }
  .prog .tgt svg { width: 78px; height: 46px; overflow: visible; filter: drop-shadow(0 3px 3px rgba(0,0,0,.3)); }
  .prog .tgt.pop svg { animation: pop .5s ease-out; }
  .prog .cnt { font-size: 26px; font-weight: 900; color: #1f4f8a; text-shadow: 0 1px 0 #fff; white-space: nowrap; }
  .prog .cnt small { font-size: 16px; color: #6b7a99; margin-left: 4px; }
  .lvbtn { font-size: 30px; }
  .hint { position: absolute; left: 50%; top: 52%; transform: translate(-50%, -50%); z-index: 12; pointer-events: none;
    background: linear-gradient(180deg, #fff, #eef2ff); border-radius: 30px; padding: 12px 26px; font-size: 30px; border: 3px solid #fff;
    box-shadow: 0 6px 0 #c9d2e6, 0 12px 20px rgba(0,0,0,.25); display: flex; align-items: center; gap: 12px; animation: pop .4s ease-out; white-space: nowrap; }
  .hint .emoji { font-size: 40px; animation: bounce .7s infinite; }
  .hint svg { width: 80px; height: 48px; overflow: visible; filter: drop-shadow(0 3px 3px rgba(0,0,0,.3)); }
</style>
</head>
<body>
<script src="../common.js"></script>
<script>
var game = KidsGame.init({ title: 'Pesca' });
(function () {
  var COLORS = [
    { id: 'azul',     n: 'AZULES',    say: 'azules',    a: '#a5e3ff', b: '#2f95e8', d: '#1a63a8' },
    { id: 'rojo',     n: 'ROJOS',     say: 'rojos',     a: '#ffb3a7', b: '#e63946', d: '#a4202c' },
    { id: 'verde',    n: 'VERDES',    say: 'verdes',    a: '#bff5a8', b: '#2cb67d', d: '#1b7d55' },
    { id: 'amarillo', n: 'AMARILLOS', say: 'amarillos', a: '#fff5b0', b: '#ffb703', d: '#c47f00' },
    { id: 'morado',   n: 'MORADOS',   say: 'morados',   a: '#d8c6ff', b: '#7f5af0', d: '#5232b3' },
    { id: 'naranja',  n: 'NARANJAS',  say: 'naranjas',  a: '#ffd9a8', b: '#ff8906', d: '#c2620a' }
  ];
  var CFG = [null,
    { size: 1.35, vmin: 40,  vmax: 75,  count: 5, mode: 'any',    drop: 300, octo: false },
    { size: 1.0,  vmin: 65,  vmax: 115, count: 6, mode: 'color',  drop: 340, octo: false },
    { size: 0.72, vmin: 115, vmax: 185, count: 7, mode: 'rotate', drop: 400, octo: true }
  ];
  var NEED = 10;
  var nivel = 1, cfg = CFG[1], running = false, target = null, caught = 0, sinceChange = 0;
  var W = 0, H = 0, waterTop = 0, scale = 1, fishes = [], octo = null;
  var hook = { state: 'idle', x: 0, y: 0, fish: null, vy: 0 };
  var lastT = 0, seed = 0;

  // ---------- escena ----------
  game.innerHTML = '';
  var defs = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
  defs.setAttribute('width', '0'); defs.setAttribute('height', '0'); defs.style.position = 'absolute';
  var gdefs = '<defs>';
  COLORS.forEach(function (c) {
    gdefs += '<linearGradient id="g-' + c.id + '" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="' + c.a + '"/><stop offset="0.55" stop-color="' + c.b + '"/><stop offset="1" stop-color="' + c.d + '"/></linearGradient>';
  });
  gdefs += '<linearGradient id="g-any" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#e63946"/><stop offset=".3" stop-color="#ffb703"/><stop offset=".55" stop-color="#2cb67d"/><stop offset=".8" stop-color="#3da9fc"/><stop offset="1" stop-color="#7f5af0"/></linearGradient>';
  gdefs += '<linearGradient id="g-wood" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#d9955a"/><stop offset="1" stop-color="#8b4f22"/></linearGradient>';
  gdefs += '<linearGradient id="g-metal" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset=".5" stop-color="#b8c2d0"/><stop offset="1" stop-color="#5f6b7a"/></linearGradient>';
  gdefs += '<linearGradient id="g-bucket" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#4dabf7"/><stop offset=".45" stop-color="#8fd3ff"/><stop offset="1" stop-color="#1c6fb5"/></linearGradient>';
  gdefs += '<linearGradient id="g-weed" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#5fd38a"/><stop offset="1" stop-color="#1e7d4f"/></linearGradient>';
  gdefs += '</defs>';
  defs.innerHTML = gdefs; game.appendChild(defs);

  var sky = document.createElement('div'); sky.className = 'sky';
  sky.innerHTML = '<div class="sun"></div>' +
    '<span class="cloud" style="left:5%;top:10%;animation-duration:70s">☁️</span>' +
    '<span class="cloud" style="left:40%;top:35%;font-size:40px;animation-duration:95s;animation-delay:-30s">☁️</span>' +
    '<span class="cloud" style="left:70%;top:15%;animation-duration:80s;animation-delay:-55s">☁️</span>';
  var water = document.createElement('div'); water.className = 'water';
  var surface = document.createElement('div'); surface.className = 'surface';
  game.appendChild(sky); game.appendChild(water); game.appendChild(surface);
  for (var wi = 0; wi < 5; wi++) {
    var wd = document.createElement('div'); wd.className = 'weed';
    wd.style.left = (5 + wi * 22 + Math.random() * 8) + '%'; wd.style.animationDelay = (-Math.random() * 3) + 's'; wd.style.height = (80 + Math.random() * 70) + 'px';
    wd.innerHTML = '<svg viewBox="0 0 40 120" width="100%" height="100%" style="overflow:visible"><path d="M20 120 C 0 95, 40 75, 18 50 C 0 30, 34 20, 20 0" fill="none" stroke="url(#g-weed)" stroke-width="12" stroke-linecap="round"/><path d="M30 120 C 20 100, 44 85, 32 60" fill="none" stroke="url(#g-weed)" stroke-width="8" stroke-linecap="round" opacity=".8"/></svg>';
    water.appendChild(wd);
  }
  var sand = document.createElement('div'); sand.className = 'sand'; water.appendChild(sand);
  for (var bi = 0; bi < 14; bi++) {
    var bb = document.createElement('div'); bb.className = 'bubble';
    var sz = 8 + Math.random() * 14; bb.style.width = sz + 'px'; bb.style.height = sz + 'px';
    bb.style.left = (Math.random() * 100) + '%'; bb.style.bottom = (5 + Math.random() * 20) + '%';
    bb.style.animationDuration = (5 + Math.random() * 6) + 's'; bb.style.animationDelay = (-Math.random() * 10) + 's';
    water.appendChild(bb);
  }
  var boat = document.createElement('div'); boat.className = 'boat';
  boat.innerHTML = '<svg viewBox="0 0 260 130">' +
    '<rect x="118" y="6" width="8" height="70" rx="3" fill="url(#g-wood)"/>' +
    '<path d="M126 10 L 190 40 L 126 52 Z" fill="#fff" stroke="#e6ecf7" stroke-width="2"/><path d="M126 14 L 172 40 L 126 46 Z" fill="#ffe08a" opacity=".9"/>' +
    '<rect x="60" y="48" width="70" height="36" rx="8" fill="#fff" stroke="#c9d2e6" stroke-width="3"/><rect x="72" y="56" width="18" height="16" rx="4" fill="#7dd0ff"/><rect x="100" y="56" width="18" height="16" rx="4" fill="#7dd0ff"/>' +
    '<path d="M10 82 L 250 82 L 222 122 Q 130 130 38 122 Z" fill="url(#g-wood)" stroke="#6b3a14" stroke-width="3" stroke-linejoin="round"/>' +
    '<path d="M18 92 L 242 92" stroke="rgba(255,255,255,.35)" stroke-width="4"/><path d="M26 104 L 234 104" stroke="rgba(0,0,0,.18)" stroke-width="4"/>' +
    '<rect x="6" y="76" width="248" height="12" rx="6" fill="#e04a4a" stroke="#a52a2a" stroke-width="2"/><rect x="12" y="78" width="236" height="4" rx="2" fill="rgba(255,255,255,.45)"/>' +
    '</svg>' +
    '<div class="bucket"><svg viewBox="0 0 74 80"><ellipse cx="37" cy="78" rx="30" ry="6" fill="rgba(0,0,0,.25)"/>' +
    '<path d="M8 22 L 14 74 Q 37 82 60 74 L 66 22 Z" fill="url(#g-bucket)" stroke="#155a94" stroke-width="3" stroke-linejoin="round"/>' +
    '<ellipse cx="37" cy="22" rx="30" ry="9" fill="#1c6fb5" stroke="#155a94" stroke-width="3"/><ellipse cx="37" cy="21" rx="24" ry="6" fill="#0f4f8e"/>' +
    '<path d="M16 24 Q 37 -6 58 24" fill="none" stroke="#5f6b7a" stroke-width="4" stroke-linecap="round"/><path d="M16 30 L 20 66" stroke="rgba(255,255,255,.5)" stroke-width="4" stroke-linecap="round"/></svg><div class="n">0</div></div>';
  game.appendChild(boat);
  var bucket = boat.querySelector('.bucket'), bucketN = bucket.querySelector('.n');
  var line = document.createElement('div'); line.className = 'line';
  var hookEl = document.createElement('div'); hookEl.className = 'hook';
  hookEl.innerHTML = '<svg viewBox="0 0 36 44"><path d="M18 0 L 18 24 A 10 10 0 1 1 32 30" fill="none" stroke="url(#g-metal)" stroke-width="5" stroke-linecap="round"/><path d="M32 30 L 27 36" stroke="url(#g-metal)" stroke-width="5" stroke-linecap="round"/><circle cx="18" cy="4" r="5" fill="#e04a4a" stroke="#a52a2a" stroke-width="2"/></svg>';
  game.appendChild(line); game.appendChild(hookEl);

  // HUD
  var hud = document.createElement('div'); hud.className = 'hud';
  var badgeHolder = document.createElement('span');
  var prog = document.createElement('div'); prog.className = 'prog';
  prog.innerHTML = '<div class="tgt"></div><div class="cnt">0<small>/ ' + NEED + '</small></div>';
  var lvBtn = document.createElement('button'); lvBtn.className = 'btn round purple lvbtn'; lvBtn.textContent = '🎚️'; lvBtn.setAttribute('aria-label', 'Nivel');
  hud.appendChild(badgeHolder); hud.appendChild(prog); hud.appendChild(lvBtn); game.appendChild(hud);
  var tgtEl = prog.querySelector('.tgt'), cntEl = prog.querySelector('.cnt');
  lvBtn.addEventListener('pointerdown', function (ev) { ev.preventDefault(); ev.stopPropagation(); KidsGame.sound.tap(); running = false; pickLevel(); });

  function fishSVG(col, stripes) {
    var g = 'url(#g-' + col.id + ')', d = col.d;
    return '<svg viewBox="-4 -8 130 86">' +
      '<path d="M92 35 L 122 8 L 114 35 L 122 62 Z" fill="' + d + '"/><path d="M98 35 L 118 16 L 112 35 L 118 54 Z" fill="' + col.b + '" opacity=".5"/>' +
      '<path d="M38 14 Q 56 -10 76 14 Z" fill="' + d + '"/>' +
      '<ellipse cx="55" cy="35" rx="46" ry="26" fill="' + g + '"/>' +
      (stripes ? '<path d="M60 12 Q 70 35 60 58 M 78 16 Q 86 35 78 54" fill="none" stroke="rgba(0,0,0,.18)" stroke-width="6" stroke-linecap="round"/>' : '') +
      '<path d="M50 42 Q 66 62 42 58 Z" fill="' + d + '" opacity=".85"/>' +
      '<ellipse cx="46" cy="21" rx="24" ry="8" fill="rgba(255,255,255,.45)"/>' +
      '<circle cx="26" cy="30" r="9" fill="#fff"/><circle cx="24" cy="31" r="4.5" fill="#222"/><circle cx="22" cy="28" r="1.8" fill="#fff"/>' +
      '<path d="M11 41 Q 15 46 20 42" fill="none" stroke="' + d + '" stroke-width="2.5" stroke-linecap="round"/>' +
      '</svg>';
  }
  function anySVG() {
    return '<svg viewBox="-4 -8 130 86"><path d="M92 35 L 122 8 L 114 35 L 122 62 Z" fill="#5232b3"/><path d="M38 14 Q 56 -10 76 14 Z" fill="#a4202c"/><ellipse cx="55" cy="35" rx="46" ry="26" fill="url(#g-any)"/><ellipse cx="46" cy="21" rx="24" ry="8" fill="rgba(255,255,255,.45)"/><circle cx="26" cy="30" r="9" fill="#fff"/><circle cx="24" cy="31" r="4.5" fill="#222"/><circle cx="22" cy="28" r="1.8" fill="#fff"/></svg>';
  }

  function layout() {
    W = game.clientWidth; H = game.clientHeight;
    waterTop = H * 0.26; scale = Math.max(0.7, Math.min(1.25, Math.min(W, H) / 700));
    hook.x = W / 2;
    boat.style.transform = ''; 
    fishes.forEach(function (f) { placeFish(f); });
    placeHook();
  }
  window.addEventListener('resize', layout);

  function placeHook() {
    var top = waterTop - 34;
    line.style.left = (hook.x - 1) + 'px'; line.style.top = top + 'px'; line.style.height = Math.max(0, hook.y - top) + 'px';
    hookEl.style.left = hook.x + 'px'; hookEl.style.top = hook.y + 'px';
    if (hook.fish) {
      var f = hook.fish; f.x = hook.x; f.y = hook.y + 34 + f.w / 2 - 6; placeFish(f);
    }
  }
  function placeFish(f) { f.el.style.transform = 'translate(' + (f.x - f.w / 2) + 'px,' + (f.y - f.h / 2) + 'px)'; }

  function spawnFish(fromSide) {
    var col;
    if (cfg.mode !== 'any' && target && Math.random() < 0.42) col = target; else col = KidsGame.pick(COLORS);
    var w = 120 * cfg.size * scale * (0.85 + Math.random() * 0.3), h = w * 70 / 120;
    var dir = fromSide != null ? fromSide : (Math.random() < 0.5 ? 1 : -1);
    var el = document.createElement('div'); el.className = 'fish ' + (dir > 0 ? 'r' : 'l');
    el.style.width = w + 'px'; el.style.height = h + 'px';
    el.innerHTML = fishSVG(col, Math.random() < 0.5);
    var f = { el: el, col: col, w: w, h: h, dir: dir, v: (cfg.vmin + Math.random() * (cfg.vmax - cfg.vmin)) * scale,
      x: dir > 0 ? -w : W + w, y: waterTop + 60 * scale + Math.random() * (H - waterTop - 60 * scale - H * 0.12 - h), phase: Math.random() * 6, flee: 0 };
    game.appendChild(el); fishes.push(f); placeFish(f);
    return f;
  }
  function removeFish(f) { f.el.remove(); fishes = fishes.filter(function (x) { return x !== f; }); }
  function clearFish() { fishes.forEach(function (f) { f.el.remove(); }); fishes = []; if (octo) { octo.el.remove(); octo = null; } }

  function spawnOcto() {
    var el = document.createElement('div'); el.className = 'octo'; el.innerHTML = '<span class="emoji">🐙</span>';
    el.style.fontSize = Math.round(84 * scale) + 'px';
    octo = { el: el, x: W * 0.3, y: H - H * 0.12 - 70 * scale, dir: 1, v: 45 * scale, w: 84 * scale, h: 84 * scale, busy: false };
    game.appendChild(el); placeOcto();
  }
  function placeOcto() { octo.el.style.transform = 'translate(' + (octo.x - octo.w / 2) + 'px,' + (octo.y - octo.h / 2) + 'px)'; }

  // ---------- efectos ----------
  function splash(x, y, n) {
    for (var i = 0; i < (n || 12); i++) {
      var d = document.createElement('div'); d.className = 'splash';
      var a = -Math.PI * (0.15 + Math.random() * 0.7), r = 40 + Math.random() * 70;
      d.style.left = x + 'px'; d.style.top = y + 'px'; d.style.width = d.style.height = (6 + Math.random() * 10) + 'px';
      d.style.setProperty('--dx', Math.cos(a) * r + 'px'); d.style.setProperty('--dy', Math.sin(a) * r + 'px');
      game.appendChild(d); (function (el) { setTimeout(function () { el.remove(); }, 800); })(d);
    }
  }
  function sparks(x, y) {
    for (var i = 0; i < 10; i++) {
      var d = document.createElement('div'); d.className = 'spark'; d.textContent = KidsGame.pick(['✨', '⭐', '💫']);
      var a = Math.random() * Math.PI * 2, r = 40 + Math.random() * 60;
      d.style.left = x + 'px'; d.style.top = y + 'px';
      d.style.setProperty('--dx', Math.cos(a) * r + 'px'); d.style.setProperty('--dy', Math.sin(a) * r + 'px');
      game.appendChild(d); (function (el) { setTimeout(function () { el.remove(); }, 900); })(d);
    }
  }
  function floatText(txt, x, y) {
    var d = document.createElement('div'); d.className = 'ftxt'; d.textContent = txt; d.style.left = x + 'px'; d.style.top = y + 'px';
    game.appendChild(d); setTimeout(function () { d.remove(); }, 1000);
  }
  function showHint(html, ms) {
    var h = document.createElement('div'); h.className = 'hint'; h.innerHTML = html; game.appendChild(h);
    setTimeout(function () { h.remove(); }, ms || 1800);
  }

  // ---------- control ----------
  game.addEventListener('pointerdown', function (ev) {
    if (ev.target.closest && ev.target.closest('.hud')) return;
    ev.preventDefault();
    if (!running) return;
    if (hook.state === 'idle') { hook.state = 'drop'; KidsGame.sound.tap(); splash(hook.x, waterTop, 6); }
    else if (hook.state === 'drop') { hook.state = 'reel'; KidsGame.sound.tap(); }
  });

  function isTarget(f) { return cfg.mode === 'any' || f.col === target; }

  function update(dt) {
    // peces
    for (var i = fishes.length - 1; i >= 0; i--) {
      var f = fishes[i];
      if (f === hook.fish) continue;
      var v = f.v * (f.flee > 0 ? 2.6 : 1); f.flee = Math.max(0, f.flee - dt);
      f.x += f.dir * v * dt; f.phase += dt;
      f.y += Math.sin(f.phase * 1.5) * 12 * dt;
      if ((f.dir > 0 && f.x > W + f.w) || (f.dir < 0 && f.x < -f.w)) { removeFish(f); continue; }
      placeFish(f);
    }
    while (fishes.length < cfg.count) spawnFish();
    if (octo && !octo.busy) {
      octo.x += octo.dir * octo.v * dt;
      if (octo.x > W - octo.w / 2) octo.dir = -1; if (octo.x < octo.w / 2) octo.dir = 1;
      placeOcto();
    }
    // anzuelo
    var tipX = hook.x + 10, tipY = hook.y + 34;
    if (hook.state === 'idle') { hook.y = waterTop - 6 + Math.sin(performance.now() / 500) * 3; }
    else if (hook.state === 'drop') {
      hook.y += cfg.drop * dt;
      if (hook.y > H - H * 0.10 - 40) hook.state = 'reel';
      // choque con pez
      for (var j = 0; j < fishes.length; j++) {
        var g = fishes[j];
        if (Math.abs(g.x - tipX) < g.w * 0.5 && Math.abs(g.y - tipY) < g.h * 0.55) {
          hook.fish = g; hook.state = 'reel'; g.el.className = 'fish caught'; KidsGame.sound.tap(); KidsGame.vibrate(20);
          break;
        }
      }
      if (!hook.fish && octo && !octo.busy && Math.abs(octo.x - tipX) < octo.w * 0.5 && Math.abs(octo.y - tipY) < octo.h * 0.5) tickle();
    } else if (hook.state === 'reel') {
      hook.y -= 300 * scale * dt;
      if (hook.y <= waterTop - 6) { hook.y = waterTop - 6; resolve(); }
    }
    placeHook();
  }

  function tickle() {
    hook.state = 'tickle'; octo.busy = true; octo.el.classList.add('laugh'); hookEl.classList.add('tickle');
    floatText('¡Jiji! 🤭', hook.x, hook.y - 20);
    [523, 659, 784, 659, 523, 659, 784].forEach(function (f, i) { setTimeout(function () { KidsGame.sound.note(f); }, i * 120); });
    KidsGame.say('¡Cosquillas!');
    setTimeout(function () {
      octo.busy = false; octo.el.classList.remove('laugh'); hookEl.classList.remove('tickle');
      if (hook.state === 'tickle') hook.state = 'reel';
    }, 1300);
  }

  function resolve() {
    var f = hook.fish; hook.fish = null; hook.state = 'idle';
    if (!f) return;
    if (isTarget(f)) {
      var br = bucket.getBoundingClientRect(), gr = game.getBoundingClientRect();
      var bx = br.left - gr.left + br.width / 2, by = br.top - gr.top + br.height / 2;
      f.el.className = 'fish tobucket';
      f.el.style.transform = 'translate(' + (bx - f.w / 2) + 'px,' + (by - f.h / 2) + 'px) scale(.3)';
      (function (el) { setTimeout(function () { el.remove(); }, 700); })(f.el);
      fishes = fishes.filter(function (x) { return x !== f; });
      caught++; sinceChange++;
      KidsGame.sound.pop(); KidsGame.addStar(); KidsGame.vibrate(25);
      sparks(hook.x, hook.y); bucket.classList.remove('bump'); void bucket.offsetWidth; bucket.classList.add('bump');
      bucketN.textContent = caught; renderHud();
      if (caught >= NEED) { finish(); return; }
      if (cfg.mode === 'rotate' && sinceChange >= 4) { sinceChange = 0; setTarget(true); }
    } else {
      KidsGame.sound.wrong(); splash(hook.x, waterTop, 16);
      floatText('¡Ese no!', hook.x, waterTop - 30);
      f.el.className = 'fish ' + (f.dir > 0 ? 'r' : 'l'); f.y = waterTop + 50 * scale; f.flee = 1.6; placeFish(f);
    }
  }

  function renderHud() {
    cntEl.innerHTML = caught + '<small>/ ' + NEED + '</small>';
    tgtEl.innerHTML = cfg.mode === 'any' ? anySVG() : fishSVG(target, false);
    tgtEl.classList.remove('pop'); void tgtEl.offsetWidth; tgtEl.classList.add('pop');
  }
  function setTarget(announce) {
    var others = COLORS.filter(function (c) { return c !== target; });
    target = KidsGame.pick(others); renderHud();
    if (announce) {
      showHint('Ahora los ' + fishSVG(target, false), 2000);
      KidsGame.say('Ahora pesca los peces ' + target.say);
    }
  }

  function startRound() {
    clearFish(); caught = 0; sinceChange = 0; hook.fish = null; hook.state = 'idle'; bucketN.textContent = '0';
    hookEl.classList.remove('tickle');
    layout();
    if (cfg.mode === 'any') { target = null; renderHud(); showHint('<span class="emoji">👆</span> ¡Toca para pescar!', 2000); KidsGame.say('Toca para pescar'); }
    else { target = null; setTarget(false); showHint('Pesca los ' + fishSVG(target, false), 2200); KidsGame.say('Pesca los peces ' + target.say); }
    for (var i = 0; i < cfg.count; i++) { var f = spawnFish(); f.x = Math.random() * W; placeFish(f); }
    if (cfg.octo) spawnOcto();
    running = true;
  }
  function finish() {
    running = false;
    setTimeout(function () {
      KidsGame.celebrate({
        sub: '🐟 ' + NEED + ' peces', stars: 3,
        onAgain: function () { startRound(); },
        onNext: function () { nivel = Math.min(3, nivel + 1); cfg = CFG[nivel]; setBadge(); startRound(); }
      });
    }, 500);
  }
  function setBadge() { badgeHolder.innerHTML = ''; badgeHolder.appendChild(KidsGame.levelBadge(nivel)); }
  function pickLevel() { KidsGame.levelPicker({ onPick: function (n) { nivel = n; cfg = CFG[n]; setBadge(); startRound(); } }); }

  function frame(now) {
    if (!lastT) lastT = now;
    var dt = Math.min((now - lastT) / 1000, 0.05); lastT = now;
    if (running) update(dt);
    requestAnimationFrame(frame);
  }
  layout(); setBadge(); renderHudIdle(); pickLevel(); requestAnimationFrame(frame);
  function renderHudIdle() { tgtEl.innerHTML = anySVG(); }
})();
</script>
