<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<link rel="stylesheet" href="../common.css">
<title>Pesca</title>
<style>
  .game { touch-action: none; overflow: hidden; background: linear-gradient(180deg, #7fd0ff 0%, #c9ecff 100%); }
  .sky { position: absolute; left: 0; right: 0; top: 0; height: 26%; background: linear-gradient(180deg, #62c4ff 0%, #b9e6ff 70%, #dff4ff 100%); overflow: hidden; }
  .sky .cloud { position: absolute; width: 120px; height: 40px; will-change: transform; animation: drift linear infinite; }
  .sky .cloud svg { width: 100%; height: 100%; overflow: visible; }
  @keyframes drift { from { transform: translateX(-160px); } to { transform: translateX(110vw); } }
  .sky .sun { position: absolute; right: 18%; top: 40%; width: 70px; height: 70px; border-radius: 50%;
    background: radial-gradient(circle at 40% 35%, #fff9d0, #ffd83d 60%, #ffb703); box-shadow: 0 0 0 12px rgba(255,216,61,.28), 0 0 40px 10px rgba(255,216,61,.5); }
  .deco { position: absolute; bottom: -2px; pointer-events: none; }
  .deco svg { display: block; overflow: visible; }
  .deco.light { right: 2%; width: 110px; height: 150px; }
  .deco.isle { left: 3%; width: 150px; height: 70px; }
  .water { position: absolute; left: 0; right: 0; top: 26%; bottom: 0; background: linear-gradient(180deg, #4fc3f7 0%, #1e97dd 30%, #0f6fb8 70%, #0a4f8e 100%); overflow: hidden; }
  .water::before { content: ""; position: absolute; inset: 0; pointer-events: none; opacity: .35; will-change: transform, opacity;
    background: repeating-linear-gradient(100deg, rgba(255,255,255,0) 0 60px, rgba(255,255,255,.35) 60px 90px, rgba(255,255,255,0) 90px 170px);
    animation: rays 6s ease-in-out infinite alternate; }
  @keyframes rays { from { opacity: .22; transform: translateX(-20px); } to { opacity: .45; transform: translateX(20px); } }
  .surface { position: absolute; left: 0; top: 26%; width: 200%; height: 22px; margin-top: -11px; z-index: 3; pointer-events: none; will-change: transform;
    background: radial-gradient(ellipse 40px 11px at 20px 50%, rgba(255,255,255,.9) 30%, rgba(255,255,255,0) 70%) 0 0/80px 22px repeat-x;
    animation: wave 2.4s ease-in-out infinite; opacity: .85; }
  @keyframes wave { 0%,100% { transform: translate(0, 0); } 50% { transform: translate(-40px, 3px); } }
  .sand { position: absolute; left: 0; right: 0; bottom: 0; height: 9%; background: linear-gradient(180deg, #d9b97a, #b8934f); box-shadow: 0 -10px 20px rgba(0,0,0,.2); border-radius: 50% 50% 0 0 / 30px 30px 0 0; }
  .sand::after { content: ""; position: absolute; left: 10%; right: 10%; top: 30%; height: 8px; border-radius: 8px; background: rgba(255,255,255,.18); }
  .weed { position: absolute; bottom: 6%; width: 40px; height: 120px; transform-origin: 50% 100%; animation: sway 3s ease-in-out infinite alternate; pointer-events: none; will-change: transform; }
  @keyframes sway { from { transform: rotate(-8deg); } to { transform: rotate(8deg); } }
  .shell { position: absolute; bottom: 2%; font-size: 26px; pointer-events: none; }
  .bubble { position: absolute; bottom: 0; width: 14px; height: 14px; border-radius: 50%; pointer-events: none; will-change: transform, opacity;
    background: radial-gradient(circle at 35% 30%, rgba(255,255,255,.95), rgba(255,255,255,.25) 60%, rgba(255,255,255,0)); border: 1px solid rgba(255,255,255,.6); animation: rise linear infinite; }
  @keyframes rise { 0% { transform: translateY(0) scale(.6); opacity: 0; } 15% { opacity: .9; } 100% { transform: translateY(-75vh) translateX(20px) scale(1.2); opacity: 0; } }
  .boat { position: absolute; left: 50%; top: 26%; width: 260px; height: 150px; margin: -128px 0 0 -130px; z-index: 4; animation: bob 3s ease-in-out infinite; pointer-events: none; will-change: transform; }
  @keyframes bob { 0%,100% { transform: translateY(0) rotate(-1deg); } 50% { transform: translateY(6px) rotate(1deg); } }
  .boat svg { width: 100%; height: 100%; overflow: visible; }
  .boat .rod { transform-origin: 206px 92px; transition: transform .25s cubic-bezier(.3,1.4,.5,1); }
  .boat.bite .rod { animation: bend .35s ease-in-out infinite alternate; }
  @keyframes bend { from { transform: rotate(16deg); } to { transform: rotate(24deg); } }
  .boat .arm { transform-origin: 196px 96px; transition: transform .3s; }
  .boat.cheer .arm { transform: rotate(-70deg); }
  .boat.cheer .rod { transform: rotate(-40deg); }
  .boat .cat-head { transform-origin: 196px 74px; }
  .boat.cheer .cat-head { animation: nod .3s ease-in-out 3; }
  @keyframes nod { 0%,100% { transform: rotate(0); } 50% { transform: rotate(-12deg); } }
  .hat { display: none; } .h-gorra .hat.gorra, .h-paja .hat.paja, .h-pirata .hat.pirata, .h-corona .hat.corona { display: block; }
  .bucket { position: absolute; left: 14px; top: 50px; width: 74px; height: 80px; }
  .bucket svg { width: 100%; height: 100%; overflow: visible; }
  .bucket .n { position: absolute; left: 0; right: 0; top: 28px; text-align: center; font-size: 22px; font-weight: 900; color: #fff; text-shadow: 0 2px 0 #1f7fae, 0 0 6px rgba(0,0,0,.4); }
  .bucket.bump { animation: bump .35s ease-out; }
  @keyframes bump { 0% { transform: scale(1); } 40% { transform: scale(1.2) rotate(-6deg); } 100% { transform: scale(1); } }
  .line { position: absolute; width: 3px; background: linear-gradient(90deg, #d9dee8, #7c8494); z-index: 5; pointer-events: none; transform-origin: 50% 0; box-shadow: 1px 0 0 rgba(0,0,0,.15); }
  .hook { position: absolute; width: 36px; height: 44px; margin-left: -18px; z-index: 6; pointer-events: none; will-change: transform; }
  .hook svg { width: 100%; height: 100%; overflow: visible; }
  .hook.tickle svg { animation: tickle .18s infinite; }
  @keyframes tickle { 0%,100% { transform: rotate(-18deg); } 50% { transform: rotate(18deg); } }
  .fish { position: absolute; left: 0; top: 0; z-index: 4; will-change: transform; pointer-events: none; }
  .fish svg { width: 100%; height: 100%; overflow: visible; will-change: transform; }
  .fish.l svg { animation: swim 1.1s ease-in-out infinite; }
  .fish.r svg { animation: swimr 1.1s ease-in-out infinite; }
  @keyframes swim { 0%,100% { transform: scaleX(1) rotate(-3deg); } 50% { transform: scaleX(1) rotate(3deg) translateY(-3px); } }
  @keyframes swimr { 0%,100% { transform: scaleX(-1) rotate(3deg); } 50% { transform: scaleX(-1) rotate(-3deg) translateY(-3px); } }
  .fish .tail { transform-origin: 92px 35px; animation: tailf .4s ease-in-out infinite alternate; }
  @keyframes tailf { from { transform: rotate(-10deg); } to { transform: rotate(10deg); } }
  .fish.caught { z-index: 7; }
  .fish.caught svg { animation: wiggle .22s ease-in-out infinite; }
  @keyframes wiggle { 0%,100% { transform: rotate(78deg); } 50% { transform: rotate(104deg); } }
  .fish.tobucket { transition: transform .6s cubic-bezier(.4,-.2,.6,1), opacity .5s .2s; opacity: 0; }
  .octo { position: absolute; z-index: 4; pointer-events: none; will-change: transform; }
  .octo svg { width: 100%; height: 100%; overflow: visible; animation: float 2.4s ease-in-out infinite; }
  .octo.laugh svg { animation: giggle .15s infinite; }
  @keyframes giggle { 0%,100% { transform: rotate(-12deg) scale(1.05); } 50% { transform: rotate(12deg) scale(.95); } }
  .splash { position: absolute; width: 10px; height: 10px; border-radius: 50%; background: radial-gradient(circle at 35% 30%, #fff, #bfe9ff); z-index: 8; pointer-events: none; animation: sp .7s ease-out forwards; }
  @keyframes sp { 0% { transform: translate(0,0) scale(1); opacity: 1; } 100% { transform: translate(var(--dx), var(--dy)) scale(.3); opacity: 0; } }
  .ftxt { position: absolute; z-index: 12; pointer-events: none; font-size: 34px; font-weight: 900; color: #ff6f61; text-shadow: 0 2px 0 #fff, 0 0 8px #fff; animation: up 1s ease-out forwards; white-space: nowrap; }
  .ftxt.good { color: #24b36c; }
  @keyframes up { 0% { opacity: 0; transform: translate(-50%, 10px) scale(.6); } 25% { opacity: 1; transform: translate(-50%, -10px) scale(1.15); } 100% { opacity: 0; transform: translate(-50%, -70px); } }
  .hud { position: absolute; left: 0; right: 0; top: 0; z-index: 10; pointer-events: none; display: flex; align-items: center; justify-content: space-between; padding: 8px 10px; gap: 8px; }
  .hud > * { pointer-events: auto; }
  .hud .right { display: flex; gap: 8px; align-items: center; }
  .prog { display: flex; align-items: center; gap: 10px; padding: 4px 18px 4px 8px; min-height: 64px; border-radius: 40px;
    background: linear-gradient(180deg, rgba(255,255,255,.97), rgba(241,246,255,.93)); border: 3px solid #fff; box-shadow: 0 6px 0 #c9d2e6, 0 12px 20px rgba(20,40,90,.22), inset 0 2px 0 #fff; }
  .prog .tgt { width: 78px; height: 48px; display: flex; align-items: center; justify-content: center; }
  .prog .tgt svg { width: 78px; height: 46px; overflow: visible; }
  .prog .tgt.pop svg { animation: pop .5s ease-out; }
  .prog .cnt { font-size: 26px; font-weight: 900; color: #1f4f8a; text-shadow: 0 1px 0 #fff; white-space: nowrap; }
  .prog .cnt small { font-size: 16px; color: #6b7a99; margin-left: 4px; }
  .lvbtn, .hatbtn { font-size: 28px; }
  .streak { position: absolute; left: 50%; top: 86px; transform: translateX(-50%) scale(0); z-index: 11; pointer-events: none; padding: 4px 18px; border-radius: 30px; font-size: 22px; font-weight: 900; color: #fff;
    background: linear-gradient(180deg, #ff9f43, #ff6f61); box-shadow: 0 4px 0 #b8306f, 0 8px 14px rgba(0,0,0,.25); text-shadow: 0 2px 0 rgba(0,0,0,.25); transition: transform .3s cubic-bezier(.3,1.5,.5,1); white-space: nowrap; }
  .streak.show { transform: translateX(-50%) scale(1); }
  .hint { position: absolute; left: 50%; top: 52%; transform: translate(-50%, -50%) scale(.6); opacity: 0; z-index: 12; pointer-events: none; color: #1f2f6b; font-weight: 900;
    background: linear-gradient(180deg, #fff, #eef2ff); border-radius: 30px; padding: 12px 26px; font-size: 30px; border: 3px solid #fff;
    box-shadow: 0 6px 0 #c9d2e6, 0 12px 20px rgba(0,0,0,.25); display: flex; align-items: center; gap: 12px; white-space: nowrap; transition: transform .35s cubic-bezier(.3,1.4,.5,1), opacity .3s; max-width: 96vw; }
  .hint.show { transform: translate(-50%, -50%) scale(1); opacity: 1; }
  .hint .emoji { font-size: 40px; animation: bounce .7s infinite; }
  .hint svg { width: 80px; height: 48px; overflow: visible; }
  .fish text { font-family: var(--font); font-weight: 900; font-size: 36px; fill: #fff; stroke: #1f2f6b; stroke-width: 3px; paint-order: stroke; text-anchor: middle; dominant-baseline: central; }
  .prog .tgt.math { flex-direction: column; width: auto; min-width: 78px; height: auto; line-height: 1; }
  .prog .tgt .num { font-size: 34px; font-weight: 900; color: #ff3d7f; text-shadow: 0 1px 0 #fff; }
  .prog .tgt .lab { font-size: 13px; font-weight: 900; color: #6b7a99; white-space: nowrap; }
  .prog .cnt .sets { font-size: 16px; margin-left: 6px; letter-spacing: 1px; }
  .bucket.spill { animation: spill 1.2s ease-in-out; }
  @keyframes spill { 0% { transform: rotate(0); } 25% { transform: rotate(-75deg) translateY(-8px); } 70% { transform: rotate(-75deg) translateY(-8px); } 100% { transform: rotate(0); } }
  .drop { position: absolute; z-index: 9; pointer-events: none; font-size: 30px; animation: dropfall .9s ease-in forwards; }
  @keyframes dropfall { 0% { transform: translate(0, 0) rotate(0); opacity: 1; } 100% { transform: translate(var(--dx), 160px) rotate(200deg); opacity: 0; } }
  .hint .num { font-size: 40px; font-weight: 900; color: #ff3d7f; }
  @media (max-width: 700px) { .deco.isle { display: none; } .prog .cnt { font-size: 22px; } }
</style>
</head>

<script src="../common.js"></script>
<script>
var game = KidsGame.init({ title: 'Pesca' });
(function () {
  var COLORS = [
    { id: 'azul',     n: 'AZULES',    say: 'azules',    a: '#a5e3ff', b: '#2f95e8', d: '#1a63a8' },
    { id: 'rojo',     n: 'ROJOS',     say: 'rojos',     a: '#ffb3a7', b: '#e63946', d: '#a4202c' },
    { id: 'verde',    n: 'VERDES',    say: 'verdes',    a: '#bff5a8', b: '#2cb67d', d: '#1b7d55' },
    { id: 'amarillo', n: 'AMARILLOS', say: 'amarillos', a: '#fff5b0', b: '#ffb703', d: '#c47f00' },
    { id: 'morado',   n: 'MORADOS',   say: 'morados',   a: '#d8c6ff', b: '#7f5af0', d: '#5232b3' },
    { id: 'naranja',  n: 'NARANJAS',  say: 'naranjas',  a: '#ffd9a8', b: '#ff8906', d: '#c2620a' }
  ];
  var CFG = [null,
    { size: 1.35, vmin: 40,  vmax: 75,  count: 5, mode: 'any',    drop: 300, octo: false },
    { size: 1.0,  vmin: 65,  vmax: 115, count: 6, mode: 'color',  drop: 340, octo: false },
    { size: 0.72, vmin: 115, vmax: 185, count: 7, mode: 'rotate', drop: 400, octo: true },
    { size: 0.9,  vmin: 70,  vmax: 125, count: 7, mode: 'math',   drop: 380, octo: false }
  ];
  var LABELS = { 1: 'Cualquier pez', 2: 'Por color', 3: 'Color que cambia + pulpo', 4: 'Suma, orden y pares 🔢' };
  var HOWTO = [{ icon: '👆', text: 'Toca el agua para lanzar el anzuelo' }, { icon: '🐟', text: 'Toca otra vez para subirlo con el pez' }, { icon: '🪣', text: 'Llena la cubeta con los peces que pide' }];
  var MATH = ['sum', 'asc', 'even'];
  var mround = 0, math = null;
  var NEED = 10;
  var nivel = 1, cfg = CFG[1], running = false, target = null, caught = 0, sinceChange = 0, streak = 0, firstRound = true;
  var W = 0, H = 0, waterTop = 0, scale = 1, fishes = [], octo = null, rodBent = false;
  var hook = { state: 'idle', x: 0, y: 0, fish: null, vy: 0 };
  var lastT = 0, hintTimer = null, streakTimer = null;
  var HATS = [{ id: 'none', n: 'Sin sombrero', e: '🐱', lv: 0 }, { id: 'gorra', n: 'Gorra marinera', e: '🧢', lv: 1 }, { id: 'paja', n: 'Sombrero de paja', e: '👒', lv: 2 }, { id: 'pirata', n: 'Pirata', e: '🏴‍☠️', lv: 3 }, { id: 'corona', n: 'Corona', e: '👑', lv: 4 }];
  var hat = HATS[0];
  try { var hid = localStorage.getItem('kg-pesca-hat'); HATS.forEach(function (h) { if (h.id === hid) hat = h; }); } catch (e) {}
  function doneLv() { try { return JSON.parse(localStorage.getItem('kg-done') || '{}').pesca || {}; } catch (e) { return {}; } }
  function hatOpen(h) { return !h.lv || !!doneLv()[h.lv]; }

  // ---------- escena ----------
  game.innerHTML = '';
  var defs = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
  defs.setAttribute('width', '0'); defs.setAttribute('height', '0'); defs.style.position = 'absolute';
  var gdefs = '<defs>';
  COLORS.forEach(function (c) {
    gdefs += '<linearGradient id="g-' + c.id + '" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="' + c.a + '"/><stop offset="0.55" stop-color="' + c.b + '"/><stop offset="1" stop-color="' + c.d + '"/></linearGradient>';
  });
  gdefs += '<linearGradient id="g-any" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#e63946"/><stop offset=".3" stop-color="#ffb703"/><stop offset=".55" stop-color="#2cb67d"/><stop offset=".8" stop-color="#3da9fc"/><stop offset="1" stop-color="#7f5af0"/></linearGradient>';
  gdefs += '<linearGradient id="g-wood" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#d9955a"/><stop offset="1" stop-color="#8b4f22"/></linearGradient>';
  gdefs += '<linearGradient id="g-metal" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset=".5" stop-color="#b8c2d0"/><stop offset="1" stop-color="#5f6b7a"/></linearGradient>';
  gdefs += '<linearGradient id="g-bucket" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#4dabf7"/><stop offset=".45" stop-color="#8fd3ff"/><stop offset="1" stop-color="#1c6fb5"/></linearGradient>';
  gdefs += '<linearGradient id="g-weed" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#5fd38a"/><stop offset="1" stop-color="#1e7d4f"/></linearGradient>';
  gdefs += '<radialGradient id="g-cat" cx="38%" cy="32%" r="75%"><stop offset="0" stop-color="#ffd27a"/><stop offset=".6" stop-color="#f6a33a"/><stop offset="1" stop-color="#c9731a"/></radialGradient>';
  gdefs += '<radialGradient id="g-octo" cx="38%" cy="30%" r="75%"><stop offset="0" stop-color="#ffb3d9"/><stop offset=".6" stop-color="#e85aa6"/><stop offset="1" stop-color="#a62c73"/></radialGradient>';
  gdefs += '<linearGradient id="g-cloud" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#d9ecfa"/></linearGradient>';
  gdefs += '</defs>';
  defs.innerHTML = gdefs; game.appendChild(defs);

  var CLOUD = '<svg viewBox="0 0 120 40"><ellipse cx="60" cy="30" rx="56" ry="10" fill="url(#g-cloud)"/><circle cx="40" cy="22" r="18" fill="url(#g-cloud)"/><circle cx="66" cy="16" r="22" fill="url(#g-cloud)"/><circle cx="90" cy="24" r="14" fill="url(#g-cloud)"/></svg>';
  var sky = document.createElement('div'); sky.className = 'sky';
  sky.innerHTML = '<div class="sun"></div>' +
    '<span class="cloud" style="left:5%;top:10%;animation-duration:70s">' + CLOUD + '</span>' +
    '<span class="cloud" style="left:40%;top:35%;width:80px;height:28px;animation-duration:95s;animation-delay:-30s">' + CLOUD + '</span>' +
    '<span class="cloud" style="left:70%;top:15%;animation-duration:80s;animation-delay:-55s">' + CLOUD + '</span>' +
    // faro sobre una roca y una islita con palmera: "La bahía"
    '<div class="deco light"><svg viewBox="0 0 110 150"><ellipse cx="55" cy="142" rx="52" ry="10" fill="#6b7a99"/><path d="M12 142 Q 30 118 55 122 Q 82 116 100 142 Z" fill="#8a97b3"/><path d="M38 118 L 72 118 L 66 40 L 44 40 Z" fill="#fff"/><path d="M44 40 L 66 40 L 64 58 L 46 58 Z M 50 82 L 62 82 L 60 100 L 50 100 Z" fill="#e63946"/><rect x="40" y="26" width="30" height="16" rx="3" fill="#ffd166" stroke="#c47f00" stroke-width="2"/><path d="M38 26 L 72 26 L 55 12 Z" fill="#e63946"/><circle cx="55" cy="10" r="4" fill="#ffd166"/><path d="M70 30 L 108 18 L 108 44 Z" fill="#fff6b0" opacity=".7"/></svg></div>' +
    '<div class="deco isle"><svg viewBox="0 0 150 70"><ellipse cx="75" cy="64" rx="70" ry="9" fill="#e7c98b"/><path d="M20 64 Q 75 30 130 64 Z" fill="#f2d79a"/><path d="M78 60 Q 84 30 96 16" stroke="#a46a2a" stroke-width="5" fill="none" stroke-linecap="round"/><g fill="#2cb67d"><path d="M96 16 Q 118 4 134 14 Q 116 14 100 22 Z"/><path d="M96 16 Q 72 2 56 12 Q 76 12 92 22 Z"/><path d="M96 16 Q 112 30 112 44 Q 102 32 94 22 Z"/><path d="M96 16 Q 80 32 76 44 Q 86 30 94 22 Z"/></g><circle cx="98" cy="22" r="4" fill="#8b5a2b"/><circle cx="92" cy="24" r="3.5" fill="#8b5a2b"/></svg></div>';
  var water = document.createElement('div'); water.className = 'water';
  var surface = document.createElement('div'); surface.className = 'surface';
  game.appendChild(sky); game.appendChild(water); game.appendChild(surface);
  for (var wi = 0; wi < 5; wi++) {
    var wd = document.createElement('div'); wd.className = 'weed';
    wd.style.left = (5 + wi * 22 + Math.random() * 8) + '%'; wd.style.animationDelay = (-Math.random() * 3) + 's'; wd.style.height = (80 + Math.random() * 70) + 'px';
    wd.innerHTML = '<svg viewBox="0 0 40 120" width="100%" height="100%" style="overflow:visible"><path d="M20 120 C 0 95, 40 75, 18 50 C 0 30, 34 20, 20 0" fill="none" stroke="url(#g-weed)" stroke-width="12" stroke-linecap="round"/><path d="M30 120 C 20 100, 44 85, 32 60" fill="none" stroke="url(#g-weed)" stroke-width="8" stroke-linecap="round" opacity=".8"/></svg>';
    water.appendChild(wd);
  }
  var sand = document.createElement('div'); sand.className = 'sand'; water.appendChild(sand);
  ['🐚', '⭐', '🐚'].forEach(function (e, i) { var sh = document.createElement('span'); sh.className = 'shell emoji'; sh.textContent = e; sh.style.left = (15 + i * 35 + Math.random() * 10) + '%'; water.appendChild(sh); });
  for (var bi = 0; bi < 12; bi++) {
    var bb = document.createElement('div'); bb.className = 'bubble';
    var sz = 8 + Math.random() * 14; bb.style.width = sz + 'px'; bb.style.height = sz + 'px';
    bb.style.left = (Math.random() * 100) + '%'; bb.style.bottom = (5 + Math.random() * 20) + '%';
    bb.style.animationDuration = (5 + Math.random() * 6) + 's'; bb.style.animationDelay = (-Math.random() * 10) + 's';
    water.appendChild(bb);
  }
  // Gatita pescadora (SVG) sentada en la barca; su caña se dobla cuando pica un pez
  function catSVG() {
    return '<g class="cat">' +
      '<path d="M176 108 C 150 110, 146 92, 160 86" stroke="#f6a33a" stroke-width="9" fill="none" stroke-linecap="round"/>' +
      '<ellipse cx="196" cy="100" rx="22" ry="17" fill="url(#g-cat)"/><ellipse cx="200" cy="104" rx="12" ry="10" fill="#ffe8c2"/>' +
      '<g class="cat-head"><path d="M176 70 L 180 48 L 194 62 Z" fill="url(#g-cat)" stroke="#c9731a" stroke-width="1.5" stroke-linejoin="round"/><path d="M180 68 L 182 54 L 190 62 Z" fill="#ffc2d6"/>' +
      '<path d="M202 60 L 212 44 L 218 66 Z" fill="url(#g-cat)" stroke="#c9731a" stroke-width="1.5" stroke-linejoin="round"/><path d="M205 60 L 211 50 L 214 63 Z" fill="#ffc2d6"/>' +

    var n = f.num;
    if (math.kind === 'sum') {
      if (math.sum + n > math.target) { toBucket(f); math.sum = 0; bucketN.textContent = '0'; badCatch(); setTimeout(spillBucket, 500); renderHud(); return; }
      toBucket(f); math.sum += n; caught++; bucketN.textContent = math.sum; KidsGame.addStar(); goodCatch();
      floatText('+' + n + ' = ' + math.sum, hook.x, waterTop - 30, true);
      if (math.sum === math.target) {
        math.sets++; KidsGame.sound.ok(); KidsGame.addStar(2); floatText('¡' + math.target + '! ⭐', W / 2, waterTop + 40, true);
        renderHud();
        if (math.sets >= 3) { finish(); return; }
        setTimeout(function () { math.sum = 0; bucketN.textContent = '0'; newSumTarget(true); }, 900);
      } else renderHud();
    } else if (math.kind === 'asc') {
      if (n !== math.next) { release(f, '¡Ese no! Busca el ' + math.next, 'Ese no. Busca el ' + math.next); return; }
      toBucket(f); caught++; math.next++; KidsGame.addStar(); bucketN.textContent = caught; goodCatch(); floatText('+1', hook.x, waterTop - 30, true); renderHud();
      if (math.next > 6) { finish(); return; }
      KidsGame.say('Ahora el ' + math.next);
    } else {
      if (n % 2 !== 0) { release(f, n + ' es impar ✖', 'El ' + n + ' es impar. Solo pares'); return; }
      toBucket(f); caught++; KidsGame.addStar(); bucketN.textContent = caught; goodCatch(); floatText(n + ' es par ✔', hook.x, waterTop - 30, true); renderHud();
      if (caught >= NEED) { finish(); return; }
    }
  }
  function resolve() {
    var f = hook.fish; hook.fish = null; hook.state = 'idle'; setBent(false);
    if (!f) return;
    if (cfg.mode === 'math') { resolveMath(f); return; }
    if (isTarget(f)) {
      toBucket(f);
      caught++; sinceChange++;
      KidsGame.addStar(); goodCatch(); floatText('+1', hook.x, waterTop - 30, true);
      bucketN.textContent = caught; renderHud();
      if (caught >= NEED) { finish(); return; }
      if (cfg.mode === 'rotate' && sinceChange >= 4) { sinceChange = 0; setTarget(true); }
    } else release(f);
  }

  function renderHud() {
    tgtEl.classList.toggle('math', cfg.mode === 'math');
    if (cfg.mode === 'math' && math) {
      if (math.kind === 'sum') { tgtEl.innerHTML = '<span class="lab">suma</span><span class="num">' + math.target + '</span>'; var dots = ''; for (var i = 0; i < 3; i++) dots += i < math.sets ? '⭐' : '☆'; cntEl.innerHTML = math.sum + '<small>/ ' + math.target + '</small><span class="sets">' + dots + '</span>'; }
      else if (math.kind === 'asc') { tgtEl.innerHTML = '<span class="lab">sigue el</span><span class="num">' + math.next + '</span>'; cntEl.innerHTML = caught + '<small>/ 6</small>'; }
      else { tgtEl.innerHTML = '<span class="lab">solo pares</span><span class="num">2 4 6 8</span>'; cntEl.innerHTML = caught + '<small>/ ' + NEED + '</small>'; }
    } else {
      cntEl.innerHTML = caught + '<small>/ ' + NEED + '</small>';
      tgtEl.innerHTML = cfg.mode === 'any' ? anySVG() : fishSVG(target, false);
    }
    tgtEl.classList.remove('pop'); void tgtEl.offsetWidth; tgtEl.classList.add('pop');
  }
  function newSumTarget(announce) {
    var lo = mround < 3 ? 6 : 8, hi = mround < 3 ? 9 : 12;
    var t = lo + KidsGame.rand(hi - lo + 1); while (t === math.target) t = lo + KidsGame.rand(hi - lo + 1);
    math.target = t; renderHud();
    if (announce) { showHint('Ahora suma <span class="num">' + t + '</span>', 2000); KidsGame.say('Ahora pesca peces que sumen ' + t); }
  }
  function startMath() {
    var kind = MATH[mround % MATH.length];
    math = { kind: kind, sum: 0, target: 0, sets: 0, next: 1 };
    if (kind === 'sum') { newSumTarget(false); showHint('🪣 Pesca peces que sumen <span class="num">' + math.target + '</span>', 2600); KidsGame.say('Pesca peces que sumen ' + math.target + '. Si te pasas, la cubeta se derrama'); }
    else if (kind === 'asc') { showHint('🔢 Pesca del <span class="num">1</span> al <span class="num">6</span> en orden', 2600); KidsGame.say('Pesca los peces en orden: primero el uno, luego el dos, hasta el seis'); }
    else { showHint('Solo peces <span class="num">PARES</span>: 2, 4, 6, 8', 2600); KidsGame.say('Pesca solo los peces con número par: dos, cuatro, seis y ocho'); }
    renderHud();
  }
  function setTarget(announce) {
    var others = COLORS.filter(function (c) { return c !== target; });
    target = KidsGame.pick(others); renderHud();
    if (announce) { showHint('Ahora los ' + fishSVG(target, false), 2000); KidsGame.say('Ahora pesca los peces ' + target.say); }
  }

  var roundN = 0;
  function startRound() {
    clearFish(); caught = 0; sinceChange = 0; streak = 0; hook.fish = null; hook.state = 'idle'; bucketN.textContent = '0'; setBent(false);
    hookEl.classList.remove('tickle'); roundN++;
    layout();
    if (cfg.mode === 'any') { target = null; renderHud(); showHint('<span class="emoji">🎣</span> ¡A pescar! <small>Ronda ' + roundN + '</small>', 1500); setTimeout(function () { if (running) showHint('<span class="emoji">👆</span> ¡Toca el agua para pescar!', 2000); }, 1600); KidsGame.say('Toca el agua para pescar'); }
    else if (cfg.mode === 'math') { target = null; startMath(); }
    else { target = null; setTarget(false); showHint('Pesca los ' + fishSVG(target, false), 2200); KidsGame.say('Pesca los peces ' + target.say); }
    for (var i = 0; i < cfg.count; i++) { var f = spawnFish(); f.x = Math.random() * W; placeFish(f); }
    if (cfg.octo) spawnOcto();
    running = true;
    if (nivel === 1 && firstRound) { firstRound = false; setTimeout(function () { if (running && hook.state === 'idle') KidsGame.hand({ el: water, timeout: 5000 }); }, 1800); }
  }
  function finish() {
    running = false; setBent(false); var wasDone = !!doneLv()[nivel];
    KidsGame.levelDone(nivel);
    boat.classList.add('cheer'); setTimeout(function () { boat.classList.remove('cheer'); }, 1500);
    var sub = '🐟 ' + NEED + ' peces', msg;
    if (cfg.mode === 'math') {
      msg = math.kind === 'sum' ? '¡Sumas de ' + math.target + '!' : math.kind === 'asc' ? '¡Del 1 al 6 en orden!' : '¡Solo pares!';
      sub = math.kind === 'sum' ? '🪣 3 cubetas exactas' : math.kind === 'asc' ? '🔢 1 2 3 4 5 6' : '✔ 2 4 6 8 · ' + caught + ' peces';
      mround++;
    }
    var nh = HATS[nivel];
    setTimeout(function () {
      KidsGame.celebrate({ msg: msg, sub: sub, stars: 3,
        onAgain: function () { if (cfg.mode === 'math') mround--; startRound(); },
        onNext: function () { if (nivel < 4) { nivel = nivel + 1; cfg = CFG[nivel]; setBadge(); } startRound(); } });
      if (nh && !wasDone) setTimeout(function () { KidsGame.toast('🎁 Sombrero nuevo: ' + nh.e + ' ' + nh.n + ' (botón 👒)', 2400); }, 900);
    }, 500);
  }
  function setBadge() { badgeHolder.innerHTML = ''; badgeHolder.appendChild(KidsGame.levelBadge(nivel)); }
  function pickLevel() { KidsGame.levelPicker({ labels: LABELS, howto: HOWTO, art: heroArt(), music: 'calma', onPick: function (n) { nivel = n; cfg = CFG[n]; setBadge(); startRound(); } }); }
  window.__kgTest = function () { return { fishes: fishes, math: math, hook: hook, caught: function () { return caught; }, streak: function () { return streak; }, running: function () { return running; }, bent: function () { return rodBent; },
    catchFish: function (f) { hook.fish = f; f.el.className = 'fish caught'; hook.state = 'reel'; hook.y = waterTop; setBent(true); resolve(); }, target: target, spawnFish: spawnFish, finish: finish }; };

  function frame(now) {
    if (!lastT) lastT = now;
    var dt = Math.min((now - lastT) / 1000, 0.05); lastT = now;
    if (running) update(dt);
    requestAnimationFrame(frame);
  }
  layout(); setBadge(); tgtEl.innerHTML = anySVG(); pickLevel(); requestAnimationFrame(frame);
})();
</script>
</body>
</html>
