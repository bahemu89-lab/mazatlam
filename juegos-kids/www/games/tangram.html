<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<link rel="stylesheet" href="../common.css">
<title>Tangram</title>
<style>
  /* El templo de las formas: piedra cálida, bloques y un sol detrás de las columnas */
  .game { background: radial-gradient(ellipse 60% 40% at 50% 0%, rgba(255,245,200,.9), rgba(255,255,255,0) 70%), linear-gradient(180deg, #ffe4b8 0%, #f3b57b 55%, #d98f52 100%); }
  .game::before { content: ""; position: absolute; inset: 0; pointer-events: none; z-index: 0; opacity: .55;
    background: repeating-linear-gradient(0deg, rgba(120,60,0,0) 0 38px, rgba(120,60,0,.12) 38px 41px), repeating-linear-gradient(90deg, rgba(255,255,255,0) 0 76px, rgba(255,255,255,.18) 76px 80px); }
  .mat { fill: rgba(255,250,235,.55); stroke: #d9a540; stroke-width: .08; }
  .mat2 { fill: none; stroke: rgba(255,255,255,.9); stroke-width: .04; stroke-dasharray: .3 .15; }
  .turtle { transform-box: fill-box; transform-origin: 50% 100%; animation: tbreathe 3s ease-in-out infinite; }
  @keyframes tbreathe { 0%,100% { transform: scale(1, 1); } 50% { transform: scale(1.03, .97); } }
  .turtle .teyes { transform-box: fill-box; transform-origin: center; animation: mzblink 4.5s infinite; }
  .turtle .thead { transform-box: fill-box; transform-origin: 20% 90%; }
  .turtle.nod .thead { animation: tnod .45s ease-in-out 3; }
  @keyframes tnod { 0%,100% { transform: rotate(0); } 50% { transform: rotate(-14deg); } }
  .rbanner { position: fixed; left: 50%; top: 40%; transform: translate(-50%, -50%) scale(.6); opacity: 0; z-index: 30; pointer-events: none; padding: 14px 34px; border-radius: 40px;
    background: linear-gradient(180deg, #fff, #eef2ff); border: 4px solid #fff; box-shadow: 0 8px 0 #c9d2e6, 0 18px 30px rgba(0,0,0,.3); font-size: 32px; font-weight: 900; color: #1f2f6b; text-align: center; white-space: nowrap;
    transition: transform .35s cubic-bezier(.3,1.4,.5,1), opacity .3s; display: flex; align-items: center; gap: 12px; }
  .rbanner.show { transform: translate(-50%, -50%) scale(1); opacity: 1; }
  .rbanner small { display: block; font-size: 18px; color: #6b7a99; }
  .rbanner .emoji { font-size: 44px; }
  .streak { position: fixed; left: 50%; top: 80px; transform: translateX(-50%) scale(0); z-index: 31; pointer-events: none; padding: 4px 18px; border-radius: 30px; font-size: 22px; font-weight: 900; color: #fff;
    background: linear-gradient(180deg, #ff9f43, #ff6f61); box-shadow: 0 4px 0 #b8306f, 0 8px 14px rgba(0,0,0,.25); text-shadow: 0 2px 0 rgba(0,0,0,.25); transition: transform .3s cubic-bezier(.3,1.5,.5,1); white-space: nowrap; }
  .streak.show { transform: translateX(-50%) scale(1); }
  .stage.enter { animation: stageIn .45s cubic-bezier(.3,1.3,.5,1); }
  @keyframes stageIn { from { transform: scale(.9) translateY(16px); opacity: 0; } to { transform: none; opacity: 1; } }
  .hud { position: absolute; left: 8px; right: 8px; top: 8px; height: 64px; display: flex; align-items: center; justify-content: space-between; gap: 8px; z-index: 3; }
  .hud .grp { display: flex; align-items: center; gap: 8px; }
  .hud .btn { font-size: 26px; }
  .hud .btn.off { opacity: .45; filter: grayscale(.7); }
  .hud .btn.on { outline: 4px solid #fff; outline-offset: 2px; }
  .hud .name { font-size: 22px; color: #fff; font-weight: 900; white-space: nowrap; text-shadow: 0 2px 0 #9a4d12, -1px -1px 0 #9a4d12, 1px -1px 0 #9a4d12, -1px 1px 0 #9a4d12, 1px 1px 0 #9a4d12; }
  .hud .cnt { font-size: 18px; padding: 4px 12px; border-radius: 20px; background: linear-gradient(180deg,#fff,#eef2ff); color: #1f2f6b; box-shadow: 0 3px 0 #c9d2e6, 0 6px 10px rgba(0,0,0,.2); white-space: nowrap; }
  .stage { position: absolute; left: 8px; right: 8px; top: 78px; bottom: 8px; z-index: 1; }
  svg.board { width: 100%; height: 100%; display: block; touch-action: none; overflow: visible; }
  .tray-bg { fill: rgba(255,255,255,.55); stroke: #fff; stroke-width: .06; }
  .sil polygon { fill: #2a2d4e; stroke: #2a2d4e; stroke-width: .05; stroke-linejoin: round; }
  .sil.hidden { opacity: 0; transition: opacity .5s; }
  .sil { transition: opacity .5s; }
  .guide polygon { stroke-width: .05; stroke-linejoin: round; stroke-dasharray: .18 .12; }
  .faint polygon { fill: none; stroke: rgba(255,255,255,.35); stroke-width: .04; }
  .piece { cursor: grab; }
  .piece .body { stroke-width: .06; stroke-linejoin: round; }
  .piece .hi { fill: rgba(255,255,255,.28); pointer-events: none; }
  .piece .lo { fill: rgba(0,0,0,.16); pointer-events: none; }
  .piece.sel .body { stroke: #fff; stroke-width: .1; }
  .piece.locked { cursor: default; }
  .piece.locked .hi { fill: rgba(255,255,255,.18); }
  .spark { position: absolute; width: 14px; height: 14px; border-radius: 50%; pointer-events: none; z-index: 20;
    background: radial-gradient(circle at 35% 35%, #fff, #ffd54a 60%, #ff9f1c); box-shadow: 0 0 10px #ffe680;
    animation: spk .7s ease-out forwards; }
  @keyframes spk { 0% { transform: translate(0,0) scale(1); opacity: 1; } 100% { transform: translate(var(--dx), var(--dy)) scale(.2); opacity: 0; } }
  .gallery { position: absolute; left: 8px; right: 8px; bottom: 8px; height: 76px; display: flex; gap: 8px; align-items: center; padding: 6px 10px; z-index: 4; overflow-x: auto; overflow-y: hidden; }
  .gallery .sticker { width: 60px; height: 60px; flex: 0 0 auto; border-radius: 14px; background: linear-gradient(180deg,#fff,#eef2ff); box-shadow: 0 4px 0 #c9d2e6, 0 8px 12px rgba(0,0,0,.2); display: flex; align-items: center; justify-content: center; animation: pop .35s; }
  .gallery .sticker svg { width: 52px; height: 52px; }
  .gallery .lbl { font-size: 18px; color: #1f2f6b; white-space: nowrap; }
  .msg { position: absolute; left: 50%; top: 86px; transform: translateX(-50%); z-index: 4; font-size: 24px; color: #fff; font-weight: 900; pointer-events: none;
    text-shadow: 0 2px 0 #9a4d12, -1px -1px 0 #9a4d12, 1px -1px 0 #9a4d12, -1px 1px 0 #9a4d12, 1px 1px 0 #9a4d12; white-space: nowrap; }
  .timer { position: absolute; left: 50%; top: 122px; transform: translateX(-50%); width: 160px; height: 14px; border-radius: 10px; background: rgba(0,0,0,.25); z-index: 4; overflow: hidden; display: none; box-shadow: inset 0 2px 4px rgba(0,0,0,.3); }
  .timer i { display: block; height: 100%; width: 100%; background: linear-gradient(180deg,#ffe98a,#ffb703); box-shadow: inset 0 2px 0 rgba(255,255,255,.6); transform-origin: left; }
  @media (max-width: 820px) { .hud .name { display: none; } }
</style>
</head>
<body>
<script src="../common.js"></script>
<script>
(function () {
  var game = KidsGame.init({ title: 'Tangram' });
  var R = Math.SQRT2, H = R / 2;
  // Formas locales (vértice de referencia en el origen; unidades: cateto del triángulo pequeño = 1)
  var SHAPES = {
    B: { pts: [[0, 0], [2, 0], [0, 2]], sym: 360 },
    M: { pts: [[0, 0], [R, 0], [0, R]], sym: 360 },
    S: { pts: [[0, 0], [1, 0], [0, 1]], sym: 360 },
    Q: { pts: [[0, 0], [1, 0], [1, 1], [0, 1]], sym: 90 },
    P: { pts: [[0, 0], [1, 0], [2, 1], [1, 1]], sym: 180, flip: true }
  };
  var PIECES = [
    { t: 'B', c: ['#ff9db0', '#e8365f', '#9c1d40'] },
    { t: 'B', c: ['#8dd3ff', '#2f8fe8', '#17569c'] },
    { t: 'M', c: ['#a5f0b8', '#2cb67d', '#166b45'] },
    { t: 'S', c: ['#ffe98a', '#ffb703', '#b57700'] },
    { t: 'S', c: ['#ffc48a', '#ff8906', '#b85a00'] },
    { t: 'Q', c: ['#c9b3ff', '#7f5af0', '#4b2fb0'] },
    { t: 'P', c: ['#9ff0ea', '#1fb7b0', '#0f7a75'] }
  ];
  function pl(t, x, y, rot, flip) { return { t: t, x: x, y: y, rot: rot || 0, flip: !!flip }; }
  var FIGS = {
    1: [
      { n: 'Triángulo', e: '🔺', p: [pl('Q', 0, 0, 0), pl('S', 1, 0, 0), pl('S', 0, 1, 0)] },
      { n: 'Barco', e: '⛵', p: [pl('B', R, R, 225), pl('M', R, 0, 270), pl('S', R, 0, 180)] },
      { n: 'Casa', e: '🏠', p: [pl('M', 1, 0, 45), pl('Q', 0.5, 1, 0), pl('S', 1.5, 0.5, 270)] },
      { n: 'Flecha', e: '➡️', p: [pl('M', 3, 0, 135), pl('Q', 1, -0.5, 0), pl('S', 1, -0.5, 90)] },
      { n: 'Helado', e: '🍦', p: [pl('M', 1, 2, 225), pl('Q', 0.5, 0, 0), pl('S', 1, -0.707, 45)] },
      { n: 'Velero', e: '⛵', p: [pl('M', 1, 0, 45), pl('Q', 1, 1, 0), pl('S', 1, 1, 90)] },
      { n: 'Sombrero', e: '🎩', p: [pl('P', 0, 0, 0), pl('Q', 0.5, -1, 0), pl('S', 1.5, -1, 0)] }
    ],
    2: [
      { n: 'Cohete', e: '🚀', p: [pl('M', 1, 0, 45), pl('Q', 0, 1, 0), pl('S', 1, 1, 0), pl('S', 2, 2, 180), pl('P', 0, 2, 0)] },
      { n: 'Árbol', e: '🌳', p: [pl('B', R, 0, 45), pl('Q', 0.414, R, 0), pl('S', R, R, 0), pl('S', 2.414, 2.414, 180), pl('M', R, 3.414, 225)] },
      { n: 'Barco', e: '⛵', p: [pl('B', R, R, 225), pl('S', 0, 0, 45), pl('S', 2 * R, 0, 45), pl('M', R, 0, 270), pl('Q', 0.414, -1, 0)] },
      { n: 'Flecha', e: '➡️', p: [pl('B', 4.414, 0, 135), pl('Q', 1, -0.5, 0), pl('S', 2, -0.5, 0), pl('S', 3, 0.5, 180), pl('M', 0, 0, 315)] },
      { n: 'Helado', e: '🍦', p: [pl('B', R, 2 * R, 225), pl('Q', 0.414, 0.414, 0), pl('S', R, 0.414, 0), pl('S', 2.414, R, 180), pl('M', R, -0.586, 45)] },
      { n: 'Pino', e: '🌲', p: [pl('S', 1, 0, 45), pl('M', 1, 0.707, 45), pl('B', 1, 1.707, 45), pl('Q', 0.5, 3.121, 0), pl('P', 0, 4.121, 0)] },
      { n: 'Casita', e: '🏡', p: [pl('B', 1, 0, 45), pl('Q', 0, 1.414, 0), pl('S', 1, 1.414, 0), pl('S', 2, 2.414, 180), pl('P', -1, 2.414, 0)] }
    ],
    3: [
      { n: 'Gato', e: '🐱', p: [pl('Q', 1, 0, 45), pl('S', 1, 0, 135), pl('S', 1, 0, 315), pl('B', 2.707, R, 90), pl('B', 0.707, 3.414, 270), pl('M', 0.707, 3.414, 90), pl('P', 2.707, 3.414, 270)] },
      { n: 'Cisne', e: '🦢', p: [pl('B', R, 0, 45), pl('B', R, 0, 315), pl('M', 0, 0, 0), pl('P', 3.535, -2.121, 315, true), pl('S', 3.535, -2.121, 135), pl('Q', -1, 0.414, 0), pl('S', -1, 0.414, 270)] },
      { n: 'Conejo', e: '🐰', p: [pl('B', 0, 0, 0), pl('B', 2, 2, 180), pl('M', 2, 0, 180), pl('P', 2, 0, 270), pl('S', 2, -R, 135), pl('Q', -1, 1, 0), pl('S', 2, 1, 0)] },
      { n: 'Corredor', e: '🏃', p: [pl('B', 2, 0, 45), pl('B', 2, 0, 315), pl('Q', 2.354, -1.768, 45), pl('P', 2, R, 0, true), pl('M', 2, R, 0), pl('S', 2, 2 * R, 315), pl('S', 2, 0, 135)] },
      { n: 'Pez', e: '🐟', p: [pl('B', 0, R, 315), pl('B', 3.414, 0.414, 90), pl('Q', R, R, 0), pl('S', R, R, 270), pl('S', 2.414, 2.414, 270), pl('M', 3.414, R, 315), pl('P', R, -0.586, 0)] },
      { n: 'Cohete', e: '🚀', p: [pl('M', 1, 0, 45), pl('B', 0, 1, 0), pl('B', 2, 3, 180), pl('Q', 0.5, 3, 0), pl('S', 0.5, 3, 90), pl('S', 1.5, 3, 0), pl('P', 0.5, 4, 0)] },
      { n: 'Casa', e: '🏠', p: [pl('B', 2, 0, 45), pl('B', 2, 2 * R, 225), pl('M', 0.586, 2 * R, 270), pl('S', 2.707, 2.121, 315), pl('S', 2.707, 2.121, 45), pl('Q', 1.5, 2 * R, 0), pl('P', 2.5, -0.914, 45)] },
      { n: 'Cuadrado', e: '🟪', p: [pl('B', R, R, 225), pl('B', R, R, 135), pl('M', 2 * R, 2 * R, 180), pl('Q', R, R, 45), pl('S', H, 1.5 * R, 45), pl('S', R, R, 315), pl('P', 3 * H, 3 * H, 135, true)] }
    ]
  };
  FIGS[4] = FIGS[3];
  var LABELS = { 1: '3 piezas · guía', 2: '5 piezas · bordes', 3: '7 piezas · silueta', 4: '7 piezas · memoria' };
  var HOWTO = [{ icon: '👆', text: 'Arrastra una pieza hasta el dibujo' }, { icon: '↻', text: 'Tócala para girarla' }, { icon: '⭐', text: 'Completa toda la figura' }];
  // Temas de color de las piezas (se desbloquean al completar niveles)
  var THEMES = [
    { id: 'clasico', n: 'Clásico', e: '🎨', lv: 0, c: [['#ff9db0', '#e8365f', '#9c1d40'], ['#8dd3ff', '#2f8fe8', '#17569c'], ['#a5f0b8', '#2cb67d', '#166b45'], ['#ffe98a', '#ffb703', '#b57700'], ['#ffc48a', '#ff8906', '#b85a00'], ['#c9b3ff', '#7f5af0', '#4b2fb0'], ['#9ff0ea', '#1fb7b0', '#0f7a75']] },
    { id: 'caramelo', n: 'Caramelo', e: '🍬', lv: 1, c: [['#ffd1dc', '#ff8fb1', '#d1557f'], ['#ffe0b3', '#ffb86b', '#d17e2a'], ['#d9f7d0', '#9be17a', '#5aa83d'], ['#fff6b3', '#ffe066', '#d1b230'], ['#e0d4ff', '#b79cff', '#7f5ad1'], ['#cdeeff', '#7fcaff', '#3a8fd1'], ['#ffe8f5', '#ffb3e6', '#d16bb5']] },
    { id: 'joyas', n: 'Joyas', e: '💎', lv: 2, c: [['#ff6b6b', '#c81d25', '#7a0c12'], ['#7ad7ff', '#0e7bbf', '#064a78'], ['#7cf29a', '#0f9d58', '#06582f'], ['#fff07a', '#e6b800', '#8f7100'], ['#ffb27a', '#e06a00', '#8a3f00'], ['#d1a3ff', '#7a1fd1', '#4a0c87'], ['#9afff0', '#00a896', '#005f55']] },
    { id: 'neon', n: 'Neón', e: '✨', lv: 3, c: [['#ff9fe5', '#ff2bd6', '#9c0a80'], ['#9ff5ff', '#12d6ff', '#0a7f99'], ['#c6ff9f', '#7bff12', '#3e9909'], ['#fff59f', '#ffe812', '#998a09'], ['#ffc59f', '#ff7a12', '#994509'], ['#d49fff', '#a812ff', '#5f0999'], ['#9fffe3', '#12ffb8', '#099968']] },
    { id: 'madera', n: 'Madera', e: '🪵', lv: 4, c: [['#f2d2a8', '#c98a4b', '#7a4a1e'], ['#f7e0b8', '#d9a35e', '#8a5a26'], ['#ead3b0', '#b8824a', '#6b4320'], ['#fbe8c5', '#e0b26b', '#94672c'], ['#e6c9a8', '#ad7a45', '#5e3a18'], ['#f0d6b0', '#c48f55', '#7a4f22'], ['#efdcc0', '#cfa06a', '#85592a']] }
  ];
  var theme = THEMES[0];
  try { var tid = localStorage.getItem('kg-tangram-theme'); THEMES.forEach(function (t) { if (t.id === tid) theme = t; }); } catch (e) {}
  function doneLv() { try { return JSON.parse(localStorage.getItem('kg-done') || '{}').tangram || {}; } catch (e) { return {}; } }
  function themeOpen(t) { return !t.lv || !!doneLv()[t.lv]; }
  function applyThemeColors() { PIECES.forEach(function (p, i) { p.c = theme.c[i]; }); }
  applyThemeColors();
  // Tortuga sabia del templo (hero art): caparazón con teselas de tangram y lentes
  function turtleInner() {
    return '<ellipse cx="66" cy="84" rx="54" ry="6" fill="rgba(0,0,0,.18)"/>' +
      '<g fill="#5bb36a"><ellipse cx="30" cy="74" rx="11" ry="8"/><ellipse cx="92" cy="76" rx="11" ry="8"/><ellipse cx="44" cy="80" rx="10" ry="7"/><ellipse cx="80" cy="81" rx="10" ry="7"/></g><path d="M14 62 Q 2 58 6 50" stroke="#5bb36a" stroke-width="7" fill="none" stroke-linecap="round"/>' +
      '<ellipse cx="60" cy="52" rx="46" ry="30" fill="#2e8b57"/><ellipse cx="60" cy="48" rx="42" ry="26" fill="#3fa86a"/>' +
      '<g opacity=".9"><polygon points="60,24 80,44 40,44" fill="#e8365f"/><polygon points="40,44 60,44 50,54" fill="#ffb703"/><polygon points="60,44 80,44 70,54" fill="#2f8fe8"/><rect x="50" y="54" width="20" height="14" fill="#7f5af0"/><polygon points="26,46 40,44 30,60" fill="#1fb7b0"/><polygon points="94,46 80,44 90,60" fill="#ff8906"/></g>' +
      '<ellipse cx="46" cy="34" rx="14" ry="6" fill="#fff" opacity=".25" transform="rotate(-18 46 34)"/>' +
      '<g class="thead"><circle cx="112" cy="44" r="17" fill="#5bb36a"/><circle cx="110" cy="38" r="6" fill="#fff" opacity=".25"/>' +
      '<g class="teyes"><circle cx="108" cy="42" r="5" fill="#fff"/><circle cx="118" cy="42" r="5" fill="#fff"/><circle cx="109" cy="43" r="2.8" fill="#2b2b2b"/><circle cx="119" cy="43" r="2.8" fill="#2b2b2b"/><circle cx="110" cy="42" r="1" fill="#fff"/><circle cx="120" cy="42" r="1" fill="#fff"/></g>' +
      '<g fill="none" stroke="#5c3a1e" stroke-width="1.8"><circle cx="108" cy="42" r="6.5"/><circle cx="118" cy="42" r="6.5"/><path d="M114.5 42 h 2 M 101 40 l -6 -4"/></g>' +
      '<path d="M108 52 Q 114 57 120 52" stroke="#2d5e3a" stroke-width="2" fill="none" stroke-linecap="round"/><circle cx="104" cy="50" r="3" fill="#ff8aa8" opacity=".5"/><circle cx="124" cy="50" r="3" fill="#ff8aa8" opacity=".5"/></g>';
  }
  function turtleArt() { return '<svg viewBox="0 0 140 92" width="84" height="55"><g class="turtle">' + turtleInner() + '</g></svg>'; }

  // ---------- geometría ----------
  function rot(p, deg) { var a = deg * Math.PI / 180, c = Math.cos(a), s = Math.sin(a); return [p[0] * c - p[1] * s, p[0] * s + p[1] * c]; }
  function worldPts(pc) {
    var sh = SHAPES[pc.t];
    return sh.pts.map(function (p) { var q = pc.flip ? [-p[0], p[1]] : p; q = rot(q, pc.rot); return [q[0] + pc.x, q[1] + pc.y]; });
  }
  function centroid(pts) { var x = 0, y = 0; pts.forEach(function (p) { x += p[0]; y += p[1]; }); return [x / pts.length, y / pts.length]; }
  function localCentered(t) { var sh = SHAPES[t], c = centroid(sh.pts); return sh.pts.map(function (p) { return [p[0] - c[0], p[1] - c[1]]; }); }
  function ptsStr(pts, k) { k = k || 1; return pts.map(function (p) { return (p[0] * k).toFixed(3) + ',' + (p[1] * k).toFixed(3); }).join(' '); }
  function angDiff(a, b, sym) { var d = ((a - b) % sym + sym) % sym; return Math.min(d, sym - d); }

  // ---------- DOM ----------
  function el(tag, cls, txt) { var e = document.createElement(tag); if (cls) e.className = cls; if (txt != null) e.textContent = txt; return e; }
  function onTap(e, fn) { e.addEventListener('pointerdown', function (ev) { ev.preventDefault(); fn(ev); }); }
  var NS = 'http://www.w3.org/2000/svg';
  function svgEl(tag, attrs) { var e = document.createElementNS(NS, tag); for (var k in attrs) e.setAttribute(k, attrs[k]); return e; }

  game.innerHTML = '';
  var hud = el('div', 'hud'), left = el('div', 'grp'), right = el('div', 'grp');
  var lvlBtn = el('button', 'btn round yellow', '🎚️'); lvlBtn.setAttribute('aria-label', 'Nivel');
  var badge = el('span'), nameEl = el('span', 'name'), cntEl = el('span', 'cnt');

  left.appendChild(lvlBtn); left.appendChild(badge); left.appendChild(nameEl); left.appendChild(cntEl);

  hud.appendChild(left); hud.appendChild(right);
  var stage = el('div', 'stage');

  stage.appendChild(svg);

  window.addEventListener('resize', function () { if (!pieces.length) return; if (free) startFree(); else startFig(); });

  // Ganchos para pruebas automáticas
  window.__tg = {
    get streak() { return streak; }, get theme() { return theme.id; },
    get level() { return level; }, get pieces() { return pieces; }, get slots() { return slots; }, get fig() { return fig; }, get free() { return free; },
    px: toPx, units: toUnits,
    solveAll: function () { pieces.forEach(function (p) { if (p.locked) return; var sl = slots.filter(function (s) { return !s.filled && s.t === p.t; })[0]; if (!sl) return; p.inTray = false; p.x = sl.cx; p.y = sl.cy; p.rot = sl.rot; p.rotTarget = null; p.flip = !!sl.flip; p.s = 1; applyT(p); trySnap(p); }); },
    solveOne: function () { var p = pieces.filter(function (q) { return !q.locked; })[0]; if (!p) return null; var sl = slots.filter(function (s) { return !s.filled && s.t === p.t; })[0]; p.rot = sl.rot; p.rotTarget = null; p.flip = !!sl.flip; applyT(p); return { from: toPx(p.x, p.y), to: toPx(sl.cx, sl.cy) }; },
    startFree: startFree, save: saveSticker, allFigs: FIGS,
    set: function (l, i) { level = l; order = FIGS[l].slice(); figIdx = i || 0; startFig(); }
  };
  pickLevel();
})();
</script>
