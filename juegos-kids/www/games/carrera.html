<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<link rel="stylesheet" href="../common.css">
<title>Carrera</title>
<style>
  .game { background: linear-gradient(180deg, #5ec0ff 0%, #bfe9ff 55%, #eafaff 100%); touch-action: none; overflow: hidden; }
  #cv { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; z-index: 2; }
  /* Capas de paralaje: canvas pre-renderizados que solo se mueven con transform (sin repintar) */
  .pl { position: absolute; left: 0; top: 0; pointer-events: none; will-change: transform; z-index: 1; }
  .pl canvas { display: block; }
  #bk { position: absolute; left: 0; top: 0; pointer-events: none; z-index: 0; display: block; }
  #cv { top: auto; bottom: 0; height: auto; }
  .hud { position: absolute; left: 0; right: 0; top: 0; z-index: 10; pointer-events: none; display: flex; align-items: center; justify-content: space-between; padding: 8px 10px; gap: 8px; }
  .hud > * { pointer-events: auto; }
  .hud .left { display: flex; align-items: center; gap: 8px; }
  .prog { display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 6px 16px; min-height: 64px; min-width: 150px; border-radius: 30px; justify-content: center;
    background: linear-gradient(180deg, rgba(255,255,255,.96), rgba(241,246,255,.92)); border: 3px solid #fff; box-shadow: 0 6px 0 #c9d2e6, 0 12px 20px rgba(20,40,90,.22), inset 0 2px 0 #fff; }
  .prog .cnt { font-size: 24px; font-weight: 900; color: #7a4b00; text-shadow: 0 1px 0 #fff; line-height: 1; }
  .bar { width: 150px; height: 14px; border-radius: 10px; background: linear-gradient(180deg, #cfd8e8, #e9eef8); box-shadow: inset 0 2px 3px rgba(0,0,0,.25); overflow: hidden; }
  .bar i { display: block; height: 100%; width: 100%; border-radius: 10px; background: linear-gradient(180deg, #8ef0b0, #24b36c); box-shadow: inset 0 2px 0 rgba(255,255,255,.6); transform-origin: left; will-change: transform; transition: transform .25s linear; }
  .bar i.low { background: linear-gradient(180deg, #ffe98a, #ffb703); }
  .lvbtn { font-size: 30px; }
  .streak { position: absolute; left: 50%; top: 86px; transform: translateX(-50%) scale(0); z-index: 11; pointer-events: none; padding: 4px 18px; border-radius: 30px; font-size: 22px; font-weight: 900; color: #fff;
    background: linear-gradient(180deg, #ff9f43, #ff6f61); box-shadow: 0 4px 0 #b8306f, 0 8px 14px rgba(0,0,0,.25); text-shadow: 0 2px 0 rgba(0,0,0,.25); transition: transform .3s cubic-bezier(.3,1.5,.5,1); white-space: nowrap; }
  .streak.show { transform: translateX(-50%) scale(1); }
  /* Selector de corredor y atuendo */
  .picker { position: absolute; inset: 0; z-index: 20; display: flex; align-items: center; justify-content: center; background: radial-gradient(circle at 50% 40%, rgba(255,255,255,.3), rgba(23,44,102,.5) 75%); }
  .picker .box { padding: 18px 24px; text-align: center; max-width: 94vw; max-height: 94%; overflow: hidden; }
  .picker .ttl { font-size: 30px; font-weight: 900; color: #ff6f61; text-shadow: 0 2px 0 #fff, 0 4px 8px rgba(0,0,0,.15); margin-bottom: 10px; }
  .picker .ttl2 { font-size: 20px; font-weight: 900; color: #3da9fc; margin: 12px 0 6px; }
  .picker .row { display: flex; gap: 14px; justify-content: center; flex-wrap: wrap; }
  .hero-btn { width: 132px; height: 150px; border-radius: 28px; border: 0; cursor: pointer; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px;
    background: linear-gradient(180deg, #fff 0%, #e6ecfb 100%); font: inherit; font-weight: 900; font-size: 20px; color: #1f2f6b; position: relative;
    box-shadow: 0 7px 0 #b9c4dc, 0 14px 22px rgba(20,40,90,.25), inset 0 2px 0 #fff; transition: transform .1s, box-shadow .1s; }
  .hero-btn:active { transform: translateY(5px); box-shadow: 0 2px 0 #b9c4dc, 0 6px 10px rgba(20,40,90,.2); }
  .hero-btn.sel { outline: 5px solid #ffd166; outline-offset: 2px; }
  .hero-btn .med { width: 96px; height: 96px; border-radius: 50%; display: flex; align-items: center; justify-content: center; overflow: hidden;
    background: radial-gradient(circle at 35% 28%, #ffffff 0%, #ffe9a8 35%, #ffb703 100%); box-shadow: 0 0 0 4px #fff, 0 0 0 7px #ffd166, 0 6px 12px rgba(0,0,0,.25), inset 0 -6px 10px rgba(0,0,0,.12); }
  .hero-btn:nth-child(2) .med { background: radial-gradient(circle at 35% 28%, #ffffff 0%, #d8f3ff 35%, #3da9fc 100%); box-shadow: 0 0 0 4px #fff, 0 0 0 7px #7dd0ff, 0 6px 12px rgba(0,0,0,.25), inset 0 -6px 10px rgba(0,0,0,.12); }
  .hero-btn:nth-child(3) .med { background: radial-gradient(circle at 35% 28%, #ffffff 0%, #ffd9f0 35%, #f582ae 100%); box-shadow: 0 0 0 4px #fff, 0 0 0 7px #ffb3d6, 0 6px 12px rgba(0,0,0,.25), inset 0 -6px 10px rgba(0,0,0,.12); }
  .hero-btn .med svg { width: 86px; height: 86px; margin-top: 10px; animation: float 3s ease-in-out infinite; }
  .fit-btn { min-width: 64px; height: 64px; border-radius: 20px; border: 0; cursor: pointer; font: inherit; font-weight: 900; font-size: 15px; color: #1f2f6b; padding: 4px 10px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 0;
    background: linear-gradient(180deg, #fff, #e6ecfb); box-shadow: 0 5px 0 #b9c4dc, 0 10px 14px rgba(20,40,90,.2), inset 0 2px 0 #fff; }
  .fit-btn .emoji { font-size: 26px; }
  .fit-btn.sel { outline: 4px solid #ffd166; outline-offset: 2px; }
  .fit-btn.lock { opacity: .55; filter: grayscale(.8); }
  .go-btn { margin-top: 14px; }
  .hint { position: absolute; left: 50%; top: 42%; transform: translate(-50%, -50%) scale(.6); opacity: 0; z-index: 12; pointer-events: none;
    background: linear-gradient(180deg, #fff, #eef2ff); border-radius: 30px; padding: 12px 26px; font-size: 30px; border: 3px solid #fff; color: #1f2f6b; font-weight: 900;
    box-shadow: 0 6px 0 #c9d2e6, 0 12px 20px rgba(0,0,0,.25); display: flex; align-items: center; gap: 12px; white-space: nowrap; transition: transform .35s cubic-bezier(.3,1.4,.5,1), opacity .3s; }
  .hint.show { transform: translate(-50%, -50%) scale(1); opacity: 1; }
  .hint .emoji { font-size: 40px; animation: bounce .7s infinite; }
  .quest { display: none; align-items: center; gap: 8px; padding: 6px 18px; min-height: 64px; border-radius: 30px; font-size: 26px; font-weight: 900; color: #1f2f6b; white-space: nowrap;
    background: linear-gradient(180deg, rgba(255,255,255,.97), rgba(241,246,255,.93)); border: 3px solid #fff; box-shadow: 0 6px 0 #c9d2e6, 0 12px 20px rgba(20,40,90,.22), inset 0 2px 0 #fff; }
  .quest.show { display: flex; }
  .quest b { color: #ff3d7f; font-size: 32px; }
  .quest .emoji { font-size: 36px; }
  .hud .mid { display: flex; align-items: center; gap: 8px; }
  @media (max-width: 700px) { .hero-btn { width: 110px; height: 130px; } .hero-btn .med { width: 80px; height: 80px; } .hero-btn .med svg { width: 70px; height: 70px; } .picker .ttl { font-size: 26px; } }
</style>
</head>
<body>
<script src="../common.js"></script>
<script>
var game = KidsGame.init({ title: 'Carrera' });
(function () {
  var CFG = [
    null,
    { speed: 230, gapMin: 2.0, gapMax: 2.8, dur: 60, jumpH: 2.4, double: 0,   bird: 0 },
    { speed: 330, gapMin: 1.4, gapMax: 2.0, dur: 75, jumpH: 2.1, double: 0.15, bird: 0 },
    { speed: 430, gapMin: 1.0, gapMax: 1.5, dur: 90, jumpH: 2.0, double: 0.35, bird: 0.3 },
    { speed: 300, gapMin: 2.6, gapMax: 2.6, dur: 9999, jumpH: 2.0, double: 0, bird: 0, gates: true }
  ];
  var GOAL = 20;
  var LABELS = { 1: 'Lento, salta', 2: 'Más rápido, 2 obstáculos', 3: 'Rápido y agáchate 🐦', 4: 'Puertas de sumas y letras' };
  var HOWTO = [{ icon: '👆', text: 'Toca para saltar' }, { icon: '✋', text: 'Mantén el dedo para agacharte' }, { icon: '⭐', text: 'Junta 20 estrellas' }];
  var nivel = 1, cfg = CFG[1], running = false;
  var W = 0, H = 0, S = 100, groundY = 0, dpr = 1;
  var canvas = document.createElement('canvas'); canvas.id = 'cv';
  var ctx = canvas.getContext('2d');
  game.innerHTML = '';
  var back = document.createElement('canvas'); back.id = 'bk'; game.appendChild(back);
  var layersEl = document.createElement('div'); game.appendChild(layersEl);
  var cvTop = 0;
  game.appendChild(canvas);

  // ---------- corredores en SVG (4 poses de carrera, salto y agachado) y atuendos ----------
  var HEROES = [
    { id: 'conejo', n: 'Conejo', a: '#ffffff', b: '#dcdde8', c: '#b9bacc', in: '#ffb3c6', ears: 'long', tail: 'puff' },
    { id: 'gato',   n: 'Gato',   a: '#ffc266', b: '#f29a2e', c: '#c46f12', in: '#ffe8c2', ears: 'tri', tail: 'curl' },
    { id: 'zorro',  n: 'Zorrita', a: '#ff9a4d', b: '#f0711f', c: '#b84e0d', in: '#ffffff', ears: 'tri', tail: 'bushy' }
  ];
  var OUTFITS = [
    { id: 'none',   n: 'Sin nada', e: '🏃', lv: 0 },
    { id: 'gorra',  n: 'Gorra',    e: '🧢', lv: 1 },
    { id: 'capa',   n: 'Capa',     e: '🦸', lv: 2 },
    { id: 'lentes', n: 'Lentes',   e: '🕶️', lv: 3 },
    { id: 'corona', n: 'Corona',   e: '👑', lv: 4 }
  ];
  var hero = HEROES[0], outfit = OUTFITS[0];
  try { var sv = JSON.parse(localStorage.getItem('kg-carrera-look') || '{}'); HEROES.forEach(function (h) { if (h.id === sv.h) hero = h; }); OUTFITS.forEach(function (o) { if (o.id === sv.o) outfit = o; }); } catch (e) {}
  function doneLevels() { try { return JSON.parse(localStorage.getItem('kg-done') || '{}').carrera || {}; } catch (e) { return {}; } }
  function outfitOpen(o) { if (!o.lv) return true; var d = doneLevels(); return !!d[o.lv]; }
  function saveLook() { try { localStorage.setItem('kg-carrera-look', JSON.stringify({ h: hero.id, o: outfit.id })); } catch (e) {} }
  // pose: { l1, l2 (piernas), a1, a2 (brazos), dy (rebote), duck }
  var POSES = {
    run0: { l1: 42, l2: -38, a1: -40, a2: 38, dy: 0 },
    run1: { l1: 12, l2: -4, a1: -8, a2: 12, dy: -5 },
    run2: { l1: -38, l2: 42, a1: 38, a2: -40, dy: 0 },
    run3: { l1: -4, l2: 12, a1: 12, a2: -8, dy: -5 },
    jump: { l1: -30, l2: -55, a1: -150, a2: -130, dy: 0 },
    duck: { l1: 75, l2: -75, a1: 20, a2: -10, dy: 24, duck: true },
    idle: { l1: 4, l2: -4, a1: 6, a2: -6, dy: 0 }
  };
  function heroSVG(h, o, poseName, size) {
    var p = POSES[poseName] || POSES.idle, dy = p.dy || 0;
    var id = 'hg' + h.id;
    var s = '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 150" width="' + (size || 120) + '" height="' + (size || 120) * 1.25 + '">' +
      '<defs><radialGradient id="' + id + '" cx="38%" cy="32%" r="75%"><stop offset="0" stop-color="' + h.a + '"/><stop offset=".6" stop-color="' + h.b + '"/><stop offset="1" stop-color="' + h.c + '"/></radialGradient>' +
      '<linearGradient id="' + id + 'd" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="' + h.b + '"/><stop offset="1" stop-color="' + h.c + '"/></linearGradient>' +
      '<linearGradient id="' + id + 'cape" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#b39cff"/><stop offset="1" stop-color="#5232b3"/></linearGradient></defs>';
    var hy = p.duck ? 24 : 0; // la cabeza baja al agacharse
    var leg = function (a, dark) { return '<g transform="rotate(' + a + ' 60 ' + (112 + dy) + ')"><rect x="53" y="' + (110 + dy) + '" width="14" height="28" rx="7" fill="' + (dark ? h.c : 'url(#' + id + 'd)') + '"/><ellipse cx="64" cy="' + (138 + dy) + '" rx="11" ry="5.5" fill="' + (dark ? h.c : h.b) + '"/></g>'; };
    var arm = function (a, dark) { return '<g transform="rotate(' + a + ' 64 ' + (82 + dy + hy) + ')"><rect x="58" y="' + (80 + dy + hy) + '" width="12" height="26" rx="6" fill="' + (dark ? h.c : 'url(#' + id + 'd)') + '"/><circle cx="64" cy="' + (106 + dy + hy) + '" r="7" fill="' + (dark ? h.c : h.b) + '"/></g>'; };
    // cola
    var tail = '';
    if (h.tail === 'puff') tail = '<circle cx="34" cy="' + (104 + dy) + '" r="10" fill="' + h.a + '" stroke="' + h.b + '" stroke-width="2"/>';
    else if (h.tail === 'curl') tail = '<path d="M38 ' + (108 + dy) + ' C 14 ' + (112 + dy) + ', 12 ' + (84 + dy) + ', 30 ' + (80 + dy) + '" fill="none" stroke="' + h.b + '" stroke-width="10" stroke-linecap="round"/><path d="M38 ' + (108 + dy) + ' C 14 ' + (112 + dy) + ', 12 ' + (84 + dy) + ', 30 ' + (80 + dy) + '" fill="none" stroke="' + h.c + '" stroke-width="4" stroke-linecap="round" opacity=".4"/>';
    else if (h.tail === 'bushy') tail = '<ellipse cx="30" cy="' + (104 + dy) + '" rx="20" ry="11" fill="url(#' + id + ')" transform="rotate(-30 30 ' + (104 + dy) + ')"/><ellipse cx="18" cy="' + (96 + dy) + '" rx="8" ry="6" fill="#fff" transform="rotate(-30 18 ' + (96 + dy) + ')"/>';
    var cape = o.id === 'capa' ? '<path d="M50 ' + (76 + dy + hy) + ' C 20 ' + (90 + dy) + ', 8 ' + (120 + dy) + ', 22 ' + (136 + dy) + ' L 44 ' + (118 + dy) + ' Z" fill="url(#' + id + 'cape)" stroke="#5232b3" stroke-width="2" stroke-linejoin="round"/>' : '';
    // orejas
    var ears = '';
    var hx = 70, hcy = 50 + dy + hy;
    if (h.ears === 'long') ears = '<ellipse cx="' + (hx - 14) + '" cy="' + (hcy - 36) + '" rx="8" ry="24" fill="url(#' + id + ')" transform="rotate(-14 ' + (hx - 14) + ' ' + (hcy - 36) + ')"/><ellipse cx="' + (hx - 14) + '" cy="' + (hcy - 36) + '" rx="4" ry="16" fill="' + h.in + '" transform="rotate(-14 ' + (hx - 14) + ' ' + (hcy - 36) + ')"/>' +
      '<ellipse cx="' + (hx + 6) + '" cy="' + (hcy - 38) + '" rx="8" ry="24" fill="url(#' + id + ')" transform="rotate(8 ' + (hx + 6) + ' ' + (hcy - 38) + ')"/><ellipse cx="' + (hx + 6) + '" cy="' + (hcy - 38) + '" rx="4" ry="16" fill="' + h.in + '" transform="rotate(8 ' + (hx + 6) + ' ' + (hcy - 38) + ')"/>';
    else if (h.ears === 'tri') ears = '<path d="M' + (hx - 26) + ' ' + (hcy - 10) + ' L ' + (hx - 22) + ' ' + (hcy - 42) + ' L ' + (hx - 2) + ' ' + (hcy - 26) + ' Z" fill="url(#' + id + ')" stroke="' + h.c + '" stroke-width="2" stroke-linejoin="round"/><path d="M' + (hx - 22) + ' ' + (hcy - 14) + ' L ' + (hx - 20) + ' ' + (hcy - 34) + ' L ' + (hx - 8) + ' ' + (hcy - 24) + ' Z" fill="' + h.in + '"/>' +
      '<path d="M' + (hx + 4) + ' ' + (hcy - 28) + ' L ' + (hx + 14) + ' ' + (hcy - 46) + ' L ' + (hx + 26) + ' ' + (hcy - 16) + ' Z" fill="url(#' + id + ')" stroke="' + h.c + '" stroke-width="2" stroke-linejoin="round"/><path d="M' + (hx + 8) + ' ' + (hcy - 26) + ' L ' + (hx + 14) + ' ' + (hcy - 38) + ' L ' + (hx + 22) + ' ' + (hcy - 18) + ' Z" fill="' + h.in + '"/>';
    // cara
    var face = '<circle cx="' + hx + '" cy="' + hcy + '" r="30" fill="url(#' + id + ')"/>' +
      '<ellipse cx="' + (hx + 12) + '" cy="' + (hcy + 12) + '" rx="14" ry="10" fill="' + h.in + '" opacity=".9"/>' +
      '<ellipse cx="' + (hx - 8) + '" cy="' + (hcy - 14) + '" rx="10" ry="5" fill="#fff" opacity=".35" transform="rotate(-20 ' + (hx - 8) + ' ' + (hcy - 14) + ')"/>' +
      '<circle cx="' + (hx + 10) + '" cy="' + (hcy - 4) + '" r="6.5" fill="#fff"/><circle cx="' + (hx + 12) + '" cy="' + (hcy - 3) + '" r="3.8" fill="#2b2b2b"/><circle cx="' + (hx + 13.5) + '" cy="' + (hcy - 5) + '" r="1.4" fill="#fff"/>' +
      '<ellipse cx="' + (hx + 24) + '" cy="' + (hcy + 6) + '" rx="4.5" ry="3.5" fill="#2b2b2b"/>' +
      '<path d="M' + (hx + 14) + ' ' + (hcy + 14) + ' Q ' + (hx + 20) + ' ' + (hcy + 19) + ' ' + (hx + 25) + ' ' + (hcy + 13) + '" stroke="#9c3b12" stroke-width="2.5" fill="none" stroke-linecap="round"/>' +
      '<circle cx="' + (hx + 2) + '" cy="' + (hcy + 10) + '" r="5" fill="#ff8aa8" opacity=".5"/>';
    if (o.id === 'lentes') face += '<rect x="' + (hx + 2) + '" y="' + (hcy - 11) + '" width="22" height="14" rx="6" fill="#222" stroke="#444" stroke-width="2"/><rect x="' + (hx - 14) + '" y="' + (hcy - 11) + '" width="14" height="14" rx="6" fill="#222" stroke="#444" stroke-width="2"/><path d="M' + (hx + 4) + ' ' + (hcy - 8) + ' h 8" stroke="#fff" stroke-width="2" opacity=".6"/>';
    var hat = '';
    if (o.id === 'gorra') hat = '<path d="M' + (hx - 28) + ' ' + (hcy - 14) + ' A 28 28 0 0 1 ' + (hx + 26) + ' ' + (hcy - 18) + ' L ' + (hx + 46) + ' ' + (hcy - 14) + ' Q ' + (hx + 40) + ' ' + (hcy - 4) + ' ' + (hx + 26) + ' ' + (hcy - 8) + ' Z" fill="#e63946" stroke="#9c1d40" stroke-width="2" stroke-linejoin="round"/><circle cx="' + (hx - 2) + '" cy="' + (hcy - 42) + '" r="4" fill="#ffd166"/>';
    else if (o.id === 'corona') hat = '<path d="M' + (hx - 20) + ' ' + (hcy - 24) + ' L ' + (hx - 22) + ' ' + (hcy - 50) + ' L ' + (hx - 8) + ' ' + (hcy - 38) + ' L ' + hx + ' ' + (hcy - 56) + ' L ' + (hx + 8) + ' ' + (hcy - 38) + ' L ' + (hx + 22) + ' ' + (hcy - 50) + ' L ' + (hx + 20) + ' ' + (hcy - 24) + ' Z" fill="#ffd166" stroke="#c47f00" stroke-width="2" stroke-linejoin="round"/><circle cx="' + hx + '" cy="' + (hcy - 32) + '" r="3.5" fill="#e63946"/><circle cx="' + (hx - 12) + '" cy="' + (hcy - 32) + '" r="2.5" fill="#3da9fc"/><circle cx="' + (hx + 12) + '" cy="' + (hcy - 32) + '" r="2.5" fill="#3da9fc"/>';
    var body = '<ellipse cx="60" cy="' + (96 + dy + hy * 0.5) + '" rx="25" ry="' + (p.duck ? 18 : 27) + '" fill="url(#' + id + ')"/><ellipse cx="66" cy="' + (100 + dy + hy * 0.5) + '" rx="14" ry="' + (p.duck ? 10 : 17) + '" fill="' + h.in + '" opacity=".9"/>';
    s += tail + cape + leg(p.l2, true) + arm(p.a2, true) + body + leg(p.l1, false) + ears + face + hat + arm(p.a1, false) + '</svg>';
    return s;
  }
  // Sprites rasterizados (una vez por cambio de tamaño): nada de SVG ni texto en el bucle de dibujo
  var sprites = {}, heroSpr = {}, HERO_PX = 0, heroBuilt = false, dirty = true;
  function rasterSVG(svg, w, h) {
    var c = document.createElement('canvas'); c.width = Math.max(1, Math.round(w * dpr)); c.height = Math.max(1, Math.round(h * dpr));
    var o = { c: c, w: w, h: h, ready: false }, img = new Image();
    img.onload = function () { var g = c.getContext('2d'); g.clearRect(0, 0, c.width, c.height); g.drawImage(img, 0, 0, c.width, c.height); o.ready = true; };
    img.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg);
    return o;
  }
  function buildHero() {
    HERO_PX = S * 1.25; heroSpr = {}; heroBuilt = true;
    Object.keys(POSES).forEach(function (k) { var o = rasterSVG(heroSVG(hero, outfit, k, 120), HERO_PX, HERO_PX * 1.25); heroSpr[k] = o; });
    setTimeout(function () { dirty = true; }, 150);
  }
  // Emoji cacheado en un canvas (con halo opcional) para no usar fillText ni shadowBlur cada cuadro
  function spr(em, size, glow) {
    var key = em + '|' + Math.round(size) + '|' + (glow || '');
    if (sprites[key]) return sprites[key];
    var pad = glow ? size * 0.7 : size * 0.3, box = Math.ceil(size + pad * 2);
    var c = document.createElement('canvas'); c.width = Math.round(box * dpr); c.height = Math.round(box * dpr);
    var g = c.getContext('2d'); g.setTransform(dpr, 0, 0, dpr, 0, 0);
    if (glow) { var rg = g.createRadialGradient(box / 2, box / 2, size * 0.2, box / 2, box / 2, box / 2); rg.addColorStop(0, glow); rg.addColorStop(1, 'rgba(255,255,255,0)'); g.fillStyle = rg; g.fillRect(0, 0, box, box); }
    g.font = Math.round(size) + 'px "Noto Color Emoji","Apple Color Emoji","Segoe UI Emoji",sans-serif'; g.textAlign = 'center'; g.textBaseline = 'middle'; g.fillStyle = '#000';
    g.fillText(em, box / 2, box / 2 + size * 0.04);
    return (sprites[key] = { c: c, w: box, h: box });
  }
  function blit(sp, x, y, scale, alpha) {
    if (!sp || sp.ready === false) return;
    var w = sp.w * (scale || 1), h = sp.h * (scale || 1);

  }

  // ---------- lógica ----------
  function checkQuality(dt) {

  function update(dt) {

  }

  // ---------- dibujo ----------

  // Puertas (Experto): cada panel con texto se dibuja una sola vez a un canvas
  function panel(txt, state, lane) {

  function drawGate(e) {
    var w = e.w, h = S * 0.72, x = e.x - w / 2, yTop = groundY - laneH() - S * 0.95, yBot = groundY - S * 1.05;
    ctx.fillStyle = '#8b5a2b'; ctx.fillRect(e.x - 5, yTop, 10, groundY - yTop);
    ctx.fillStyle = '#c98a4b'; ctx.fillRect(e.x - 5, yTop, 3, groundY - yTop);
    [[yTop, e.top, 1], [yBot, e.bot, 0]].forEach(function (sg) {
      var y = sg[0], side = sg[1], lane = sg[2], chosen = e.resolved && e.chosen === lane;
      var sp = panel(side.txt, chosen ? e.result : 'idle', lane);
      ctx.drawImage(sp.c, x - sp.pad, y - sp.pad, sp.w, sp.h);
      if (chosen) blit(spr(e.result === 'ok' ? '✅' : '❌', S * 0.32), x + w, y);

  }
  function drawEnts() {
    for (var i = 0; i < ents.length; i++) {
      var e = ents[i], ex = e.x, ey = groundY - e.y;

  }
  function drawFx() {
    for (var i = 0; i < parts.length; i++) { var p = parts[i]; ctx.globalAlpha = Math.max(0, p.life / p.max); ctx.fillStyle = p.c; ctx.beginPath(); ctx.arc(p.x, p.y, p.r * (p.dust ? 1 + (1 - p.life / p.max) : p.life / p.max), 0, Math.PI * 2); ctx.fill(); }

  }
  requestAnimationFrame(frame);

  // ---------- flujo ----------
  function showHint(html, ms) {

  }
  function startRound() {

    sprites = {}; buildLayers();
    running = true;
    if (cfg.gates) {

      var letters = roundN % 2 === 1;

    setTimeout(function () { if (running) showHint('<span class="emoji">👆</span> ¡Toca para saltar!', 1800); }, 1700);
    KidsGame.say(cfg.bird > 0 ? 'Toca para saltar y mantén para agacharte' : 'Toca para saltar');
    if (cfg.bird > 0) setTimeout(function () { if (running) showHint('<span class="emoji">🐦</span> Mantén para agacharte', 2000); }, 3700);
    if (nivel === 1 && firstRun) { firstRun = false; setTimeout(function () { if (running) KidsGame.hand({ el: canvas, timeout: 3200 }); }, 1200); }
  }

        onAgain: function () { startRound(); },

    }, 500);

  }
