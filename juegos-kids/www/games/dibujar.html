<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<link rel="stylesheet" href="../common.css">
<title>Dibujar</title>
<style>
  .game { display: flex; flex-direction: column; }
  .wrap { flex: 1 1 auto; display: flex; flex-direction: column; min-height: 0; }
  /* Mesa de madera con veta; la hoja tiene sombra y cinta adhesiva */
  .board {
    flex: 1 1 auto; min-height: 0; min-width: 0; position: relative; padding: 16px 18px 20px;
    background:
      repeating-linear-gradient(90deg, rgba(0,0,0,.07) 0 2px, rgba(0,0,0,0) 2px 110px),
      repeating-linear-gradient(180deg, rgba(255,255,255,.05) 0 1px, rgba(0,0,0,0) 1px 7px, rgba(0,0,0,.04) 7px 8px, rgba(0,0,0,0) 8px 13px),
      linear-gradient(180deg, #d09a5e 0%, #b97a42 50%, #9f6232 100%);
    box-shadow: inset 0 0 70px rgba(60,20,0,.35), inset 0 3px 0 rgba(255,255,255,.25);
  }
  .board canvas {
    display: block; width: 100%; height: 100%; background: #fff; border-radius: 5px;
    box-shadow: 0 2px 0 #dfe3ea, 0 16px 28px rgba(0,0,0,.45), 0 0 0 1px rgba(0,0,0,.1); touch-action: none; cursor: crosshair;
  }
  .board::before, .board::after {
    content: ""; position: absolute; top: 6px; width: 74px; height: 22px; z-index: 2; pointer-events: none; border-radius: 2px;
    background: linear-gradient(180deg, rgba(255,246,170,.85), rgba(250,232,140,.8)); box-shadow: 0 1px 3px rgba(0,0,0,.25), inset 0 0 0 1px rgba(255,255,255,.35);
  }
  .board::before { left: -8px; top: 16px; transform: rotate(-40deg); }
  .board::after { right: -8px; top: 16px; transform: rotate(40deg); }
  .grain { position: absolute; left: 18px; right: 18px; top: 16px; bottom: 20px; pointer-events: none; border-radius: 5px; z-index: 1; opacity: .55;
    background: repeating-linear-gradient(0deg, rgba(31,47,107,.045) 0 1px, rgba(0,0,0,0) 1px 4px), repeating-linear-gradient(90deg, rgba(31,47,107,.03) 0 1px, rgba(0,0,0,0) 1px 5px); }
  /* Calcomanía que salta al ponerla + chispas */
  .stpop { position: absolute; pointer-events: none; z-index: 3; transform: translate(-50%,-50%); line-height: 1; animation: stpop .5s ease-out forwards; }
  @keyframes stpop { 0%{ transform: translate(-50%,-50%) scale(.2); opacity: 1 } 55%{ transform: translate(-50%,-56%) scale(1.45) } 80%{ transform: translate(-50%,-50%) scale(.95); opacity: .6 } 100%{ transform: translate(-50%,-50%) scale(1); opacity: 0 } }
  .sp { position: absolute; pointer-events: none; font-size: 24px; line-height: 1; z-index: 4; transform: translate(-50%,-50%); text-shadow: 0 0 6px #fff, 0 2px 3px rgba(0,0,0,.3); animation: spfly .6s ease-out forwards; }
  @keyframes spfly { 0%{ transform: translate(-50%,-50%) scale(.3) rotate(0deg); opacity: 1 } 100%{ transform: translate(calc(-50% + var(--dx)), calc(-50% + var(--dy))) scale(1.2) rotate(160deg); opacity: 0 } }
  /* Bandeja de herramientas: cristal con relieve */
  .tools {
    flex: 0 0 auto; display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; align-content: center;
    padding: 8px; position: relative; z-index: 2;
    background: linear-gradient(180deg, rgba(255,255,255,.92), rgba(232,240,255,.8));
    box-shadow: inset 0 2px 0 #fff, inset 0 -3px 0 rgba(31,47,107,.08), 0 -6px 14px rgba(20,40,90,.18);
  }
  .tool {
    width: 64px; height: 64px; border-radius: 50%; border: 3px solid #fff; position: relative;
    background: linear-gradient(180deg, #ffffff 0%, #e9eefa 100%);
    box-shadow: 0 5px 0 #c9d2e6, 0 9px 14px rgba(20,40,90,.25), inset 0 2px 0 #fff, inset 0 -3px 0 rgba(0,0,0,.05);
    cursor: pointer; transition: transform .12s, box-shadow .12s; display: flex; align-items: center; justify-content: center;
    font-size: 34px;
  }
  .tool::after { content: ""; position: absolute; left: 14%; right: 14%; top: 5%; height: 34%; border-radius: 50%; pointer-events: none; background: linear-gradient(180deg, rgba(255,255,255,.8), rgba(255,255,255,0)); }
  .tool svg { width: 100%; height: 100%; display: block; pointer-events: none; overflow: visible; }
  .tool.sel { transform: scale(1.15); border-color: #fff; box-shadow: 0 0 0 4px #1f2f6b, 0 5px 0 #c9d2e6, 0 12px 18px rgba(31,47,107,.4), inset 0 2px 0 #fff; z-index: 1; }
  .tool.color.sel svg { transform: translateY(-4px); }
  .tool:active { transform: scale(.9); box-shadow: 0 1px 0 #c9d2e6, 0 4px 8px rgba(20,40,90,.25); }
  .tool .dot { border-radius: 50%; background: radial-gradient(circle at 35% 30%, #6f80c4, #1f2f6b 55%, #0f1a45); box-shadow: 0 3px 4px rgba(0,0,0,.35), inset 0 1px 1px rgba(255,255,255,.4); }
  .tool.rainbow { background: conic-gradient(#ff4d4d, #ffe14d, #4cd964, #3da9fc, #a06cd5, #ff7eb6, #ff4d4d); box-shadow: 0 5px 0 #8d5bb3, 0 9px 14px rgba(20,40,90,.25), inset 0 -5px 8px rgba(0,0,0,.2), inset 0 3px 0 rgba(255,255,255,.5); }
  .tool.rainbow::after { left: 18%; right: 18%; top: 8%; height: 30%; background: linear-gradient(180deg, rgba(255,255,255,.75), rgba(255,255,255,0)); }
  .tool.action { --a: #ff9ccb; --b: #f0569a; --d: #b8306f; border-radius: 22px; color: #fff; font-size: 30px; background: linear-gradient(180deg, var(--a), var(--b)); box-shadow: 0 5px 0 var(--d), 0 9px 14px rgba(0,0,0,.25), inset 0 2px 0 rgba(255,255,255,.6), inset 0 -2px 0 rgba(0,0,0,.08); }
  .tool.action::after { border-radius: 18px; }
  .tool.action:active { box-shadow: 0 1px 0 var(--d), 0 4px 8px rgba(0,0,0,.2); }
  .tool.action.save { --a: #7dd0ff; --b: #2f95e8; --d: #1a63a8; }
  .tool.toggle { --a: #b39cff; --b: #7f5af0; --d: #5232b3; border-radius: 22px; background: linear-gradient(180deg, var(--a), var(--b)); box-shadow: 0 5px 0 var(--d), 0 9px 14px rgba(0,0,0,.25), inset 0 2px 0 rgba(255,255,255,.6); }
  .tool.toggle::after { border-radius: 18px; }
  .tool.toggle.sel { box-shadow: 0 0 0 4px #fff, 0 0 0 7px #7f5af0, 0 0 18px 4px rgba(127,90,240,.6), 0 5px 0 var(--d), 0 12px 18px rgba(0,0,0,.3), inset 0 2px 0 rgba(255,255,255,.6); }
  .hud { flex: 1 1 100%; display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; align-items: center; }
  .hud .kg-level-badge { font-size: 18px; padding: 6px 14px; white-space: nowrap; }
  .hud .lvbtn { width: 56px; height: 56px; min-width: 56px; min-height: 56px; font-size: 26px; }
  /* Confirmación en la página */
  .confirm {
    position: absolute; top: 0; left: 0; right: 0; bottom: 0; display: none; align-items: center; justify-content: center;
    background: radial-gradient(circle at 50% 40%, rgba(255,255,255,.25), rgba(23,44,102,.6) 75%); z-index: 30; border-radius: 0;
  }
  .confirm.show { display: flex; }
  .confirm .box { background: linear-gradient(180deg, #ffffff, #f3f6ff); border: 4px solid #fff; border-radius: 30px; padding: 24px 30px; text-align: center; animation: pop .3s ease-out; max-width: 90%; box-shadow: 0 10px 0 #c9d2e6, 0 30px 50px rgba(0,0,0,.35), inset 0 2px 0 #fff; }
  .confirm .q { font-size: 34px; margin-bottom: 18px; font-weight: 900; color: #ff6f61; text-shadow: 0 2px 0 #fff, 0 4px 8px rgba(0,0,0,.15); }
  .confirm .row { display: flex; gap: 16px; justify-content: center; }
  /* Figuras geométricas y giro */
  .tool .glyph { font-size: 36px; line-height: 1; color: #1f2f6b; display: inline-block; transition: transform .15s; text-shadow: 0 2px 2px rgba(0,0,0,.2); }
  .tool.rot { flex-direction: column; gap: 0; }
  .tool.rot .glyph { font-size: 26px; color: #fff; }
  .tool.rot small { font-size: 16px; color: #fff; line-height: 1; font-weight: 900; }
  .tool.action.done { --a: #8ef0b0; --b: #24b36c; --d: #14784a; font-size: 34px; }
  /* Reto del nivel Experto: instrucción + lista para marcar */
  .task { position: absolute; left: 18px; right: 18px; top: 16px; z-index: 3; display: none; padding: 8px 12px 10px; border-radius: 5px 5px 18px 18px;
    background: linear-gradient(180deg, rgba(255,255,255,.97), rgba(241,246,255,.94)); box-shadow: 0 6px 0 #c9d2e6, 0 10px 18px rgba(20,40,90,.22); animation: pop .35s ease-out; }
  .task.show { display: block; }
  .task .tt { display: flex; align-items: center; gap: 10px; font-size: 20px; color: #1f2f6b; line-height: 1.15; }
  .task .tt b { color: #ff3d7f; }
  .task .spk { width: 52px; height: 52px; min-width: 52px; min-height: 52px; font-size: 24px; flex: 0 0 auto; }
  .task .chips { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px; align-items: center; }
  .chip { min-height: 56px; padding: 4px 16px; border-radius: 28px; background: #fff; border: 3px solid #dfe6f4; font-size: 20px; display: inline-flex; align-items: center; gap: 6px; cursor: pointer; box-shadow: 0 3px 0 #c9d2e6; transition: transform .1s; }
  .chip:active { transform: scale(.95); }
  .chip.on { background: linear-gradient(180deg, #e9ffe9, #b9f0c4); border-color: #6fdc8c; box-shadow: 0 3px 0 #3fa864; }
  .chip.on::before { content: '✔'; color: #14784a; }
  .hintchip { font-size: 15px; color: #6b7a99; }
  /* Caja de crayones (hero art) y galería de dibujos */
  .cbox { display: flex; align-items: center; gap: 6px; flex: 1 1 100%; justify-content: center; margin: -2px 0 2px; }
  .cbox svg { display: block; overflow: visible; filter: drop-shadow(0 4px 4px rgba(0,0,0,.25)); animation: float 3.6s ease-in-out infinite; }
  .cb-eyes { transform-box: fill-box; transform-origin: center; animation: cbblink 4.4s infinite; }
  @keyframes cbblink { 0%,92%,100% { transform: scaleY(1); } 95% { transform: scaleY(.1); } }
  .cbox.cheer svg { animation: cbcheer .6s ease-in-out; }
  @keyframes cbcheer { 0%,100% { transform: translateY(0) rotate(0); } 40% { transform: translateY(-14px) rotate(-6deg); } 70% { transform: translateY(-4px) rotate(5deg); } }
  .cbox .say { font-size: 15px; font-weight: 900; color: #1f2f6b; background: #fff; border-radius: 14px; padding: 6px 10px; box-shadow: 0 3px 0 #c9d2e6; max-width: 150px; line-height: 1.1; }
  .tool.action.galb { --a: #ffe98a; --b: #ffb703; --d: #c47f00; }
  .jk-streak { top: 80px; right: auto; left: 40px; }
  @media (max-width: 820px) { .jk-streak { top: 80px; left: 40px; } }
  .tool.lock { opacity: .55; font-size: 24px; }
  .gal { position: absolute; inset: 0; display: none; align-items: center; justify-content: center; z-index: 31; background: radial-gradient(circle at 50% 40%, rgba(255,255,255,.25), rgba(23,44,102,.65) 75%); }
  .gal.show { display: flex; }
  .gal .box { background: linear-gradient(180deg, #ffffff, #f3f6ff); border: 4px solid #fff; border-radius: 30px; padding: 16px 20px; text-align: center; animation: pop .3s ease-out; max-width: 94%; max-height: 92%; overflow: auto; box-shadow: 0 10px 0 #c9d2e6, 0 30px 50px rgba(0,0,0,.35), inset 0 2px 0 #fff; }
  .gal .ttl { font-size: 28px; font-weight: 900; color: #ff6f61; text-shadow: 0 2px 0 #fff; margin-bottom: 10px; }
  .gal .grid { display: flex; flex-wrap: wrap; gap: 14px; justify-content: center; max-width: 720px; }
  .gal .it { width: 200px; display: flex; flex-direction: column; gap: 6px; align-items: center; }
  .gal .it img { width: 200px; height: 150px; object-fit: cover; border-radius: 14px; border: 4px solid #fff; box-shadow: 0 5px 0 #c9d2e6, 0 10px 16px rgba(20,40,90,.25); cursor: pointer; background: #fff; }
  .gal .it .empty { width: 200px; height: 150px; border-radius: 14px; border: 4px dashed #c9d2e6; display: flex; align-items: center; justify-content: center; font-size: 40px; color: #c9d2e6; }
  .gal .it .btn { min-height: 56px; min-width: 64px; font-size: 22px; padding: 4px 14px; }
  .gal .row { display: flex; gap: 12px; justify-content: center; margin-top: 12px; }
  @media (max-width: 820px) { .gal .it, .gal .it img, .gal .it .empty { width: 150px; } .gal .it img, .gal .it .empty { height: 112px; } }
  /* ---- Kit de "juice" (racha, banner de ronda, transiciones) ---- */
  .jk-banner { position: fixed; left: 50%; top: 70px; z-index: 44; transform: translate(-50%,0) scale(.6); opacity: 0; pointer-events: none;
    padding: 8px 28px; border-radius: 40px; font-size: 28px; font-weight: 900; color: #fff; white-space: nowrap; border: 4px solid #fff;
    background: linear-gradient(180deg, #ffb703, #ff8906); box-shadow: 0 7px 0 #b85a00, 0 16px 28px rgba(0,0,0,.3), inset 0 2px 0 rgba(255,255,255,.6);
    text-shadow: 0 3px 0 #b85a00, 0 5px 8px rgba(0,0,0,.3); }
  .jk-banner.in { animation: jkb 1.4s ease-in-out forwards; }
  @keyframes jkb { 0% { transform: translate(-50%,0) scale(.6); opacity: 0 } 14% { transform: translate(-50%,0) scale(1.08); opacity: 1 } 24% { transform: translate(-50%,0) scale(1) } 78% { transform: translate(-50%,0) scale(1); opacity: 1 } 100% { transform: translate(-50%,-30px) scale(.9); opacity: 0 } }
  .jk-streak { position: fixed; top: 78px; right: 240px; z-index: 40; padding: 5px 14px; border-radius: 30px; pointer-events: none;
    background: linear-gradient(180deg,#fff7d6,#ffd166); box-shadow: 0 4px 0 #d9a520, 0 8px 14px rgba(0,0,0,.2), inset 0 1px 0 #fff; font-size: 20px; font-weight: 900; color: #7a4b00;
    opacity: 0; transition: opacity .3s; }
  .jk-streak.on { opacity: 1; }
  .jk-streak.hot { animation: jkhot .45s ease-out; }
  @keyframes jkhot { 0% { transform: scale(1) } 40% { transform: scale(1.3) rotate(-4deg) } 100% { transform: scale(1) } }
  @media (max-width: 820px) { .jk-banner { top: 120px; } .jk-streak { top: 148px; left: 8px; right: auto; } }
  .jk-in { animation: jkin .42s cubic-bezier(.2,.9,.3,1.15) both; }
  .jk-out { animation: jkout .24s ease-in forwards; pointer-events: none; }
  @keyframes jkin { from { transform: translateX(70px) scale(.92); opacity: 0 } to { transform: none; opacity: 1 } }
  @keyframes jkout { to { transform: translateX(-70px) scale(.92); opacity: 0 } }
  .jk-press { animation: jkpress .28s ease-out; }
  @keyframes jkpress { 0% { transform: scale(1) } 35% { transform: scale(.9,1.1) } 70% { transform: scale(1.1,.92) } 100% { transform: scale(1) } }

  @media (orientation: landscape) {
    .wrap { flex-direction: row; }
    .tools { width: 372px; order: 2; gap: 6px 8px; overflow-y: auto; touch-action: pan-y; align-content: flex-start; box-shadow: inset 0 2px 0 #fff, inset 3px 0 0 rgba(31,47,107,.08), -6px 0 14px rgba(20,40,90,.18); }
    .cbox { flex: 0 0 auto; margin: 0; } .cbox svg { width: 58px; height: 54px; } .cbox .say { font-size: 13px; max-width: 120px; padding: 4px 8px; }
    .hud { flex: 1 1 auto; }
    .tools::-webkit-scrollbar { display: none; }
  }
</style>
</head>
<body>
<div class="game">
  <div class="wrap">
    <div class="board" id="board"><canvas id="cv"></canvas><div class="grain"></div></div>
    <div class="tools" id="tools"></div>
  </div>
  <div class="gal" id="gal"><div class="box"><div class="ttl">🖼️ Mi galería</div><div class="grid" id="galGrid"></div><div class="row"><button class="btn blue" id="galClose">Cerrar ✖</button></div></div></div>
  <div class="confirm" id="confirm">
    <div class="box">
      <div class="q"><span class="emoji">🗑️</span> ¿Borrar todo?</div>
      <div class="row">
        <button class="btn green big" id="confirmYes">Sí ✔</button>
        <button class="btn blue big" id="confirmNo">No ✖</button>
      </div>
    </div>
  </div>
</div>
<script src="../common.js"></script>
<script>
var game = KidsGame.init({ title: 'Dibujar' });

  /* ---- Kit de "juice": racha, banner de ronda, transición entre rondas, guardado ---- */
  var JK = (function () {
    var streak = 0, pill = null, bannerEl = null;
    function pillEl() { if (!pill) { pill = document.createElement('div'); pill.className = 'jk-streak'; document.body.appendChild(pill); } return pill; }
    function hit(el, txt) {
      streak++; var p = pillEl();
      if (streak >= 2) { p.textContent = '🔥 Racha ' + streak; p.classList.add('on'); p.classList.remove('hot'); void p.offsetWidth; p.classList.add('hot'); }
      var r = el && el.getBoundingClientRect ? el.getBoundingClientRect() : null;
      var x = r ? r.left + r.width / 2 : window.innerWidth / 2, y = r ? r.top + 8 : window.innerHeight / 2;
      if (el) { try { KidsGame.fx.ring(el); } catch (e) {} }
      if (streak % 5 === 0) { KidsGame.addStar(); KidsGame.fx.floatText(x, y, '¡Racha x' + streak + '! ⭐ extra', 'good'); KidsGame.fx.burst(x, y, { n: 22, r: 110, chars: ['⭐', '✨', '🔥', '💫'] }); }
      else if (streak >= 3) { KidsGame.fx.floatText(x, y, '¡Racha x' + streak + '!', 'good'); KidsGame.fx.burst(x, y, { n: 14, chars: ['✨', '⭐'] }); }
      else { KidsGame.fx.floatText(x, y, txt || '+1', 'good'); KidsGame.fx.burst(x, y, { n: 12 }); }
      return streak;
    }
    function miss(el) { streak = 0; if (pill) pill.classList.remove('on'); if (el) KidsGame.fx.shake(el); }
    function reset() { streak = 0; if (pill) pill.classList.remove('on'); }
    function banner(text) {
      if (!bannerEl) { bannerEl = document.createElement('div'); bannerEl.className = 'jk-banner'; document.body.appendChild(bannerEl); }
      bannerEl.textContent = text; bannerEl.classList.remove('in'); void bannerEl.offsetWidth; bannerEl.classList.add('in');
    }
    function swap(el, fn) {
      if (!el || !el.parentNode) { fn(); return; }
      el.classList.remove('jk-in'); el.classList.add('jk-out');
      setTimeout(function () { el.classList.remove('jk-out'); fn(); el.classList.add('jk-in'); setTimeout(function () { el.classList.remove('jk-in'); }, 480); }, 230);
    }
    function press(el) { if (!el) return; el.classList.remove('jk-press'); void el.offsetWidth; el.classList.add('jk-press'); }
    function store(k, d) { try { var v = JSON.parse(localStorage.getItem(k)); return v == null ? d : v; } catch (e) { return d; } }
    function put(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
    return { hit: hit, miss: miss, reset: reset, banner: banner, swap: swap, press: press, store: store, put: put, get streak() { return streak; } };
  })();

var board = document.getElementById('board'), cv = document.getElementById('cv'), ctx = cv.getContext('2d');
var tools = document.getElementById('tools');
var COLORS = ['#222222', '#ff4d4d', '#ff9f1c', '#ffe14d', '#4cd964', '#2ec4b6', '#3da9fc', '#a06cd5', '#ff7eb6', '#a0522d'];
var SIZES = [6, 14, 28];
var STICKERS = ['🌟', '❤️', '🌈', '🦄', '🐱', '🌸', '🍎', '⚽'];
// Desbloqueables (uno por nivel completado): crayones especiales y calcomanías nuevas
var XCOLORS = ['#ffd700', '#c0c8d8', '#40e0d0', '#ff69b4'], XSTICK = ['🦋', '🐬', '🚀', '🍭'];
function unlockedN() { return Math.min(XCOLORS.length, JK.store('kg-dibujar-extra', 0) || 0); }
function unlockExtra() { var n = JK.store('kg-dibujar-extra', 0) || 0; if (n < XCOLORS.length) { JK.put('kg-dibujar-extra', n + 1); KidsGame.toast('🎁 ¡Nuevo crayón y calcomanía ' + XSTICK[n] + '!', 2400); } }
// ---- Hero art: la caja de crayones con carita ----
function cboxSVG(size, id) {
  id = id || 'cb';
  var cols = ['#ff4d4d', '#ff9f1c', '#ffe14d', '#4cd964', '#3da9fc', '#a06cd5'], cr = '';
  cols.forEach(function (c, i) { var x = 22 + i * 15; cr += '<path d="M' + x + ' 46 L' + (x + 5) + ' 22 L' + (x + 10) + ' 46 Z" fill="' + c + '" stroke="rgba(0,0,0,.25)" stroke-width="1.2" stroke-linejoin="round"/><rect x="' + x + '" y="44" width="10" height="20" rx="2" fill="' + c + '" stroke="rgba(0,0,0,.25)" stroke-width="1.2"/><rect x="' + (x + 2) + '" y="30" width="2" height="30" rx="1" fill="rgba(255,255,255,.5)"/>'; });
  return '<svg viewBox="0 0 130 120" width="' + size + '" height="' + Math.round(size * 120 / 130) + '" aria-hidden="true"><defs>' +
    '<linearGradient id="' + id + 'b" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffd166"/><stop offset="1" stop-color="#f5a623"/></linearGradient>' +
    '<linearGradient id="' + id + 'g" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#4cd964"/><stop offset="1" stop-color="#24b36c"/></linearGradient></defs>' +
    '<ellipse cx="65" cy="114" rx="46" ry="5" fill="rgba(0,0,0,.2)"/>' + cr +
    '<rect x="12" y="56" width="106" height="54" rx="10" fill="url(#' + id + 'b)" stroke="#c47f00" stroke-width="2.5"/>' +

  if (expert.kind === 'prompt') {
    html = '<div class="tt"><button class="btn round yellow spk" aria-label="Oír">🔊</button><span>Dibuja <b>' + expert.p.t + '</b></span></div><div class="chips">' +
      expert.p.items.map(function (it, i) { return '<span class="chip' + (expert.done[i] ? ' on' : '') + '" data-i="' + i + '">' + it + '</span>'; }).join('') +
      '<span class="hintchip">👆 marca lo que ya dibujaste</span></div>';
  } else {
    html = '<div class="tt"><button class="btn round yellow spk" aria-label="Oír">🔊</button><span>' + HALVES[expert.key].e + ' Completa <b>' + HALVES[expert.key].n + '</b>: dibuja la otra mitad igual</span></div>';
  }
  task.innerHTML = html; task.classList.add('show');
  task.querySelector('.spk').addEventListener('pointerdown', function (ev) { ev.preventDefault(); ev.stopPropagation(); KidsGame.sound.tap(); sayTask(); });
  var chips = task.querySelectorAll('.chip');
  for (var i = 0; i < chips.length; i++) (function (ch) {
    ch.addEventListener('pointerdown', function (ev) {
      ev.preventDefault(); ev.stopPropagation();
      var k = +ch.getAttribute('data-i'); expert.done[k] = !expert.done[k]; ch.classList.toggle('on', expert.done[k]); KidsGame.sound.pop();
    });
  })(chips[i]);
}
function sayTask() {
  if (!expert) return;
  KidsGame.say(expert.kind === 'prompt' ? 'Dibuja ' + expert.p.t : 'Completa ' + HALVES[expert.key].n + '. Dibuja la otra mitad igual');
}
function startExpert(same) {
  clearCanvas();
  if (!same || !expert) {
    if (roundN % 2 === 0) {
      var p = KidsGame.pick(PROMPTS.filter(function (x) { return !expert || x !== expert.p; }));
      expert = { kind: 'prompt', p: p, done: p.items.map(function () { return false; }) };
    } else {
      var keys = Object.keys(HALVES).filter(function (k) { return !expert || k !== expert.key; });
      expert = { kind: 'half', key: KidsGame.pick(keys) };
    }
  } else if (expert.kind === 'prompt') expert.done = expert.p.items.map(function () { return false; });
  if (expert.kind === 'half') { mirror = false; var mr = document.getElementById('mirror'); if (mr) mr.classList.remove('sel'); drawHalf(expert.key); }
  renderTask(); sayTask();
}
function checkExpert() {
  if (!expert) return;
  if (expert.kind === 'prompt') {
    var missing = expert.done.filter(function (d) { return !d; }).length;
    if (inkFraction() < 0.012) { KidsGame.sound.wrong(); JK.miss(task); KidsGame.toast('Dibuja primero ✏️'); KidsGame.say('Dibuja primero'); return; }
    if (missing) { KidsGame.sound.wrong(); JK.miss(task); KidsGame.toast('Marca lo que ya dibujaste ✔ (' + missing + ')', 1800); KidsGame.say('Faltan cosas por dibujar o marcar'); return; }
  } else {
    var b = box(), left = inkCount(b.x0, b.y0 - 14, W / 2 - 2, b.y0 + b.s + 14), right = inkCount(W / 2 + 2, b.y0 - 14, b.x0 + b.s, b.y0 + b.s + 14);
    if (right < 150 || right < left * 0.45) { KidsGame.sound.wrong(); JK.miss(task); KidsGame.toast('Falta dibujar el otro lado 👉', 1800); KidsGame.say('Falta dibujar la otra mitad'); return; }
  }
  KidsGame.sound.ok(); KidsGame.addStar(3); roundN++; JK.hit(board, '¡Lo lograste!'); cboxCheer('¡Guau!');
  KidsGame.levelDone(4); unlockExtra();
  KidsGame.celebrate({ msg: expert.kind === 'prompt' ? '¡Qué imaginación!' : '¡Está completo!', sub: expert.kind === 'prompt' ? '🗣️ ' + expert.p.t : HALVES[expert.key].e + ' ' + HALVES[expert.key].n,
    onNext: function () { startExpert(false); }, onAgain: function () { roundN--; startExpert(true); } });
}
function finishFree() {
  var f = inkFraction();
  if (f < 0.01) { KidsGame.sound.wrong(); JK.miss(cboxEl); KidsGame.toast('Dibuja algo primero ✏️'); KidsGame.say('Dibuja algo primero'); return; }
  KidsGame.sound.ok(); KidsGame.addStar(nivel); JK.hit(board, '¡Qué bonito!'); cboxCheer('¡Precioso!'); saveToGallery();
  KidsGame.levelDone(nivel); unlockExtra();
  KidsGame.celebrate({ msg: '¡Qué bonito!', sub: '🖼️ Guardado en tu galería', onAgain: function () { clearCanvas(); KidsGame.sound.pop(); } });
}

// ---------- Herramientas (según nivel) ----------
function selectTool(el) {
  var all = tools.querySelectorAll('.tool.pick');
  for (var k = 0; k < all.length; k++) { all[k].classList.remove('sel'); var g = all[k].querySelector('.glyph'); if (g) { g.style.color = ''; g.style.transform = ''; } }
  if (el) el.classList.add('sel');
}
function selectSize(el) {
  var all = tools.querySelectorAll('.tool.size');
  for (var k = 0; k < all.length; k++) all[k].classList.remove('sel');
  el.classList.add('sel');
}
function mk(cls, html) { var d = document.createElement('div'); d.className = 'tool ' + cls; d.innerHTML = html; tools.appendChild(d); return d; }
function onTap(el, fn) { el.addEventListener('pointerdown', function (e) { e.preventDefault(); fn(); }); }

var confirmBox = document.getElementById('confirm');
document.getElementById('confirmYes').onclick = function () {
  confirmBox.classList.remove('show');
  clearCanvas();
  if (expert && expert.kind === 'half') drawHalf(expert.key);
  KidsGame.sound.pop(); KidsGame.toast('¡Listo! 🗑️');
};
document.getElementById('confirmNo').onclick = function () { confirmBox.classList.remove('show'); KidsGame.sound.tap(); };

var lastColorEl = null;
function buildTools() {
  tools.innerHTML = '';
  // HUD: nivel + botón para cambiar de nivel
  var hud = document.createElement('div'); hud.className = 'hud';
  hud.appendChild(KidsGame.levelBadge(nivel));
  var lb = document.createElement('button'); lb.className = 'btn round purple lvbtn'; lb.textContent = '🎚️'; lb.setAttribute('aria-label', 'Cambiar nivel');
  lb.addEventListener('pointerdown', function (ev) { ev.preventDefault(); ev.stopPropagation(); KidsGame.sound.tap(); pickLevel(); });
  hud.appendChild(lb);
  tools.appendChild(hud);
  cboxEl = document.createElement('div'); cboxEl.className = 'cbox'; cboxEl.innerHTML = cboxSVG(nivel === 1 ? 78 : 64, 'cb') + '<div class="say">' + (nivel === 1 ? '¡Hola! Toma un crayón y dibuja' : nivel === 4 ? 'Escucha el reto y dibújalo' : '¡Vamos a crear!') + '</div>';
  tools.appendChild(cboxEl);

  var un = unlockedN();
  var colors = (nivel === 1 ? COLORS.slice(0, 6) : COLORS).concat(XCOLORS.slice(0, un));
  if (colors.indexOf(color) < 0) color = COLORS[1];
  if (nivel === 1) size = SIZES[1];
  if (nivel < 3) { mirror = false; if (mode === 'sticker' || mode === 'rainbow') mode = 'brush'; }
  if (nivel < 2) { rot = 0; if (mode === 'shape') mode = 'brush'; }
  lastColorEl = null;
  colors.forEach(function (c, i) {
    var el = mk('pick color', crayon(c, i)); el.setAttribute('aria-label', 'Color');
    if (c === color) { lastColorEl = el; if (mode === 'brush') el.classList.add('sel'); }
    onTap(el, function () { color = c; lastColorEl = el; if (mode !== 'shape') { mode = 'brush'; selectTool(el); } else { var sh = tools.querySelector('.tool.shape.sel'); if (sh) sh.querySelector('.glyph').style.color = c; } KidsGame.sound.tap(); JK.press(el); });
  });
  if (un < XCOLORS.length) { var le = mk('lock', '<span class="emoji">🔒</span>'); le.setAttribute('aria-label', 'Crayón bloqueado'); onTap(le, function () { KidsGame.sound.wrong(); KidsGame.toast('Completa un nivel para ganar crayones nuevos 🎁', 1600); }); }
  if (nivel >= 3) {
    var rb = mk('pick rainbow', ''); rb.id = 'rainbow'; if (mode === 'rainbow') rb.classList.add('sel');
    onTap(rb, function () { mode = 'rainbow'; selectTool(rb); KidsGame.sound.pop(); });
  }
  var er = mk('pick', '<span class="emoji">🧽</span>'); er.id = 'eraser'; if (mode === 'eraser') er.classList.add('sel');
  onTap(er, function () { mode = 'eraser'; selectTool(er); KidsGame.sound.tap(); });
  if (nivel >= 2) {
    SIZES.forEach(function (s) {
      var el = mk('size', '<div class="dot" style="width:' + (s + 6) + 'px;height:' + (s + 6) + 'px"></div>'); if (s === size) el.classList.add('sel');
      onTap(el, function () { size = s; if (mode === 'sticker') { mode = 'brush'; selectTool(lastColorEl); } selectSize(el); KidsGame.sound.tap(); });
    });
    // Figuras geométricas (nivel 2+) y rotación (nivel 3+)
    SHAPES.forEach(function (sh) {
      var el = mk('pick shape', '<span class="glyph">' + sh[1] + '</span>'); el.setAttribute('aria-label', 'Figura');
      if (mode === 'shape' && shape === sh[0]) { el.classList.add('sel'); el.querySelector('.glyph').style.color = color; }
      onTap(el, function () { mode = 'shape'; shape = sh[0]; selectTool(el); el.querySelector('.glyph').style.color = color; el.querySelector('.glyph').style.transform = 'rotate(' + rot + 'deg)'; KidsGame.sound.pop(); });
    });
    if (nivel >= 3) {
      var rt = mk('toggle rot', '<span class="glyph" style="transform:rotate(' + rot + 'deg)">▲</span><small>↻</small>'); rt.id = 'rotate'; rt.setAttribute('aria-label', 'Girar');
      onTap(rt, function () {
        rot = (rot + 45) % 360; rt.querySelector('.glyph').style.transform = 'rotate(' + rot + 'deg)';
        var sel = tools.querySelector('.tool.shape.sel .glyph'); if (sel) sel.style.transform = 'rotate(' + rot + 'deg)';
        KidsGame.sound.tap(); KidsGame.toast('Giro ' + rot + '°');
      });
    }
  }
  if (nivel >= 3) {
    STICKERS.concat(XSTICK.slice(0, un)).forEach(function (st) {
      var el = mk('pick sticker', '<span class="emoji">' + st + '</span>'); if (mode === 'sticker' && st === sticker) el.classList.add('sel');
      onTap(el, function () { mode = 'sticker'; sticker = st; selectTool(el); KidsGame.sound.pop(); JK.press(el); });
    });
    var mr = mk('toggle', '<span class="emoji">🪞</span>'); mr.id = 'mirror'; mr.setAttribute('aria-label', 'Espejo'); if (mirror) mr.classList.add('sel');
    onTap(mr, function () { mirror = !mirror; mr.classList.toggle('sel', mirror); KidsGame.sound.pop(); KidsGame.toast(mirror ? 'Espejo 🪞 ✔' : 'Espejo ✖'); });
  }
  var clr = mk('action', '<span class="emoji">🗑️</span>'); clr.id = 'clear';
  onTap(clr, function () { KidsGame.sound.tap(); confirmBox.classList.add('show'); KidsGame.say('¿Borrar todo?'); });
  var sv = mk('action save', '<span class="emoji">📷</span>'); sv.id = 'save'; sv.setAttribute('aria-label', 'Guardar en la galería');
  onTap(sv, function () {
    if (inkFraction() < 0.004) { KidsGame.sound.wrong(); KidsGame.toast('Dibuja algo primero ✏️'); return; }
    KidsGame.sound.ok(); KidsGame.addStar(); var ok = saveToGallery();
    KidsGame.fx.burstAt(sv, { n: 16, chars: ['📷', '✨', '⭐'] }); cboxCheer('¡Guardado!');
    KidsGame.toast(ok ? '¡Guardado en tu galería! 🖼️' : 'No se pudo guardar', 1400); KidsGame.say('Guardado en tu galería');
  });
  var gb = mk('action galb', '<span class="emoji">🖼️</span>'); gb.id = 'gallery'; gb.setAttribute('aria-label', 'Galería');
  onTap(gb, openGallery);
  var ok = mk('action done', nivel === 4 ? '✔' : '✨'); ok.id = 'finish'; ok.setAttribute('aria-label', 'Listo');
  onTap(ok, function () { KidsGame.sound.tap(); if (nivel === 4) checkExpert(); else finishFree(); });
  if (!tools.querySelector('.tool.pick.sel') && lastColorEl) { mode = 'brush'; lastColorEl.classList.add('sel'); }
  setTimeout(resize, 50);
}

// ---------- Niveles: herramientas desbloqueadas y retos ----------
function start(n) {
  nivel = n; JK.reset(); buildTools();
  JK.banner(n === 4 ? '🏆 Reto de dibujo' : n === 3 ? '🪞 Espejo y calcomanías' : n === 2 ? '🔷 Figuras y tamaños' : '🖍️ Dibuja libre');
  if (n === 4) { setTimeout(function () { resize(); startExpert(false); }, 120); }
  else { expert = null; renderTask(); if (n === 3) { mirror = true; var mr = document.getElementById('mirror'); if (mr) mr.classList.add('sel'); KidsGame.say('Espejo: dibuja y se copia al otro lado'); } }
  if (n === 1 && !JK.store('kg-dibujar-hand', 0)) {
    setTimeout(function () { var r = cv.getBoundingClientRect(); var a = document.createElement('div'), b = document.createElement('div');
      a.style.cssText = 'position:fixed;left:' + (r.left + r.width * .3) + 'px;top:' + (r.top + r.height * .35) + 'px;width:2px;height:2px'; b.style.cssText = 'position:fixed;left:' + (r.left + r.width * .7) + 'px;top:' + (r.top + r.height * .6) + 'px;width:2px;height:2px';
      document.body.appendChild(a); document.body.appendChild(b); var h = KidsGame.hand({ from: a, to: b, timeout: 10000 }); setTimeout(function () { a.remove(); b.remove(); }, 10200); }, 800);
  }
}
cv.addEventListener('pointerdown', function () { JK.put('kg-dibujar-hand', 1); });
function pickLevel() {
  KidsGame.levelPicker({
    labels: { 1: '6 colores', 2: 'Tamaños y figuras', 3: 'Espejo, arcoíris, giro y calcomanías', 4: 'Dibuja lo que te digo y completa el dibujo' },
    howto: HOWTO, art: cboxSVG(74, 'cbp'), music: 'calma',
    onPick: start
  });
}
// Ganchos para pruebas
window.__dib = { gallery: gallery, closeGallery: closeGallery, openGallery: openGallery, get expert() { return expert; }, get streak() { return JK.streak; }, unlocked: unlockedN,
  markAll: function () { if (expert && expert.kind === 'prompt') { expert.done = expert.done.map(function () { return true; }); renderTask(); } } };

resize();
setTimeout(resize, 100);
pickLevel();
</script>
