<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<link rel="stylesheet" href="../common.css">
<title>Dibujar</title>
<style>
  .game { display: flex; flex-direction: column; }
  .wrap { flex: 1 1 auto; display: flex; flex-direction: column; min-height: 0; }
  /* Mesa de madera con veta; la hoja tiene sombra y cinta adhesiva */
  .board {
    flex: 1 1 auto; min-height: 0; min-width: 0; position: relative; padding: 16px 18px 20px;
    background:
      repeating-linear-gradient(90deg, rgba(0,0,0,.07) 0 2px, rgba(0,0,0,0) 2px 110px),
      repeating-linear-gradient(180deg, rgba(255,255,255,.05) 0 1px, rgba(0,0,0,0) 1px 7px, rgba(0,0,0,.04) 7px 8px, rgba(0,0,0,0) 8px 13px),
      linear-gradient(180deg, #d09a5e 0%, #b97a42 50%, #9f6232 100%);
    box-shadow: inset 0 0 70px rgba(60,20,0,.35), inset 0 3px 0 rgba(255,255,255,.25);
  }
  .board canvas {
    display: block; width: 100%; height: 100%; background: #fff; border-radius: 5px;
    box-shadow: 0 2px 0 #dfe3ea, 0 16px 28px rgba(0,0,0,.45), 0 0 0 1px rgba(0,0,0,.1); touch-action: none; cursor: crosshair;
  }
  .board::before, .board::after {
    content: ""; position: absolute; top: 6px; width: 74px; height: 22px; z-index: 2; pointer-events: none; border-radius: 2px;
    background: linear-gradient(180deg, rgba(255,246,170,.85), rgba(250,232,140,.8)); box-shadow: 0 1px 3px rgba(0,0,0,.25), inset 0 0 0 1px rgba(255,255,255,.35);
  }
  .board::before { left: -8px; top: 16px; transform: rotate(-40deg); }
  .board::after { right: -8px; top: 16px; transform: rotate(40deg); }
  .grain { position: absolute; left: 18px; right: 18px; top: 16px; bottom: 20px; pointer-events: none; border-radius: 5px; z-index: 1; opacity: .55;
    background: repeating-linear-gradient(0deg, rgba(31,47,107,.045) 0 1px, rgba(0,0,0,0) 1px 4px), repeating-linear-gradient(90deg, rgba(31,47,107,.03) 0 1px, rgba(0,0,0,0) 1px 5px); }
  /* Calcomanía que salta al ponerla + chispas */
  .stpop { position: absolute; pointer-events: none; z-index: 3; transform: translate(-50%,-50%); line-height: 1; animation: stpop .5s ease-out forwards; }
  @keyframes stpop { 0%{ transform: translate(-50%,-50%) scale(.2); opacity: 1 } 55%{ transform: translate(-50%,-56%) scale(1.45) } 80%{ transform: translate(-50%,-50%) scale(.95); opacity: .6 } 100%{ transform: translate(-50%,-50%) scale(1); opacity: 0 } }
  .sp { position: absolute; pointer-events: none; font-size: 24px; line-height: 1; z-index: 4; transform: translate(-50%,-50%); text-shadow: 0 0 6px #fff, 0 2px 3px rgba(0,0,0,.3); animation: spfly .6s ease-out forwards; }
  @keyframes spfly { 0%{ transform: translate(-50%,-50%) scale(.3) rotate(0deg); opacity: 1 } 100%{ transform: translate(calc(-50% + var(--dx)), calc(-50% + var(--dy))) scale(1.2) rotate(160deg); opacity: 0 } }
  /* Bandeja de herramientas: cristal con relieve */
  .tools {
    flex: 0 0 auto; display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; align-content: center;
    padding: 8px; position: relative; z-index: 2;
    background: linear-gradient(180deg, rgba(255,255,255,.92), rgba(232,240,255,.8));
    box-shadow: inset 0 2px 0 #fff, inset 0 -3px 0 rgba(31,47,107,.08), 0 -6px 14px rgba(20,40,90,.18);
  }
  .tool {
    width: 64px; height: 64px; border-radius: 50%; border: 3px solid #fff; position: relative;
    background: linear-gradient(180deg, #ffffff 0%, #e9eefa 100%);
    box-shadow: 0 5px 0 #c9d2e6, 0 9px 14px rgba(20,40,90,.25), inset 0 2px 0 #fff, inset 0 -3px 0 rgba(0,0,0,.05);
    cursor: pointer; transition: transform .12s, box-shadow .12s; display: flex; align-items: center; justify-content: center;
    font-size: 34px;
  }
  .tool::after { content: ""; position: absolute; left: 14%; right: 14%; top: 5%; height: 34%; border-radius: 50%; pointer-events: none; background: linear-gradient(180deg, rgba(255,255,255,.8), rgba(255,255,255,0)); }
  .tool svg { width: 100%; height: 100%; display: block; pointer-events: none; overflow: visible; }
  .tool.sel { transform: scale(1.15); border-color: #fff; box-shadow: 0 0 0 4px #1f2f6b, 0 5px 0 #c9d2e6, 0 12px 18px rgba(31,47,107,.4), inset 0 2px 0 #fff; z-index: 1; }
  .tool.color.sel svg { transform: translateY(-4px); }
  .tool:active { transform: scale(.9); box-shadow: 0 1px 0 #c9d2e6, 0 4px 8px rgba(20,40,90,.25); }
  .tool .dot { border-radius: 50%; background: radial-gradient(circle at 35% 30%, #6f80c4, #1f2f6b 55%, #0f1a45); box-shadow: 0 3px 4px rgba(0,0,0,.35), inset 0 1px 1px rgba(255,255,255,.4); }
  .tool.rainbow { background: conic-gradient(#ff4d4d, #ffe14d, #4cd964, #3da9fc, #a06cd5, #ff7eb6, #ff4d4d); box-shadow: 0 5px 0 #8d5bb3, 0 9px 14px rgba(20,40,90,.25), inset 0 -5px 8px rgba(0,0,0,.2), inset 0 3px 0 rgba(255,255,255,.5); }
  .tool.rainbow::after { left: 18%; right: 18%; top: 8%; height: 30%; background: linear-gradient(180deg, rgba(255,255,255,.75), rgba(255,255,255,0)); }
  .tool.action { --a: #ff9ccb; --b: #f0569a; --d: #b8306f; border-radius: 22px; color: #fff; font-size: 30px; background: linear-gradient(180deg, var(--a), var(--b)); box-shadow: 0 5px 0 var(--d), 0 9px 14px rgba(0,0,0,.25), inset 0 2px 0 rgba(255,255,255,.6), inset 0 -2px 0 rgba(0,0,0,.08); }
  .tool.action::after { border-radius: 18px; }
  .tool.action:active { box-shadow: 0 1px 0 var(--d), 0 4px 8px rgba(0,0,0,.2); }
  .tool.action.save { --a: #7dd0ff; --b: #2f95e8; --d: #1a63a8; }
  .tool.toggle { --a: #b39cff; --b: #7f5af0; --d: #5232b3; border-radius: 22px; background: linear-gradient(180deg, var(--a), var(--b)); box-shadow: 0 5px 0 var(--d), 0 9px 14px rgba(0,0,0,.25), inset 0 2px 0 rgba(255,255,255,.6); }
  .tool.toggle::after { border-radius: 18px; }
  .tool.toggle.sel { box-shadow: 0 0 0 4px #fff, 0 0 0 7px #7f5af0, 0 0 18px 4px rgba(127,90,240,.6), 0 5px 0 var(--d), 0 12px 18px rgba(0,0,0,.3), inset 0 2px 0 rgba(255,255,255,.6); }
  .hud { flex: 1 1 100%; display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; align-items: center; }
  .hud .kg-level-badge { font-size: 18px; padding: 6px 14px; white-space: nowrap; }
  .hud .lvbtn { width: 56px; height: 56px; min-width: 56px; min-height: 56px; font-size: 26px; }
  /* Confirmación en la página */
  .confirm {
    position: absolute; top: 0; left: 0; right: 0; bottom: 0; display: none; align-items: center; justify-content: center;
    background: radial-gradient(circle at 50% 40%, rgba(255,255,255,.25), rgba(23,44,102,.6) 75%); z-index: 30; border-radius: 0;
  }
  .confirm.show { display: flex; }
  .confirm .box { background: linear-gradient(180deg, #ffffff, #f3f6ff); border: 4px solid #fff; border-radius: 30px; padding: 24px 30px; text-align: center; animation: pop .3s ease-out; max-width: 90%; box-shadow: 0 10px 0 #c9d2e6, 0 30px 50px rgba(0,0,0,.35), inset 0 2px 0 #fff; }
  .confirm .q { font-size: 34px; margin-bottom: 18px; font-weight: 900; color: #ff6f61; text-shadow: 0 2px 0 #fff, 0 4px 8px rgba(0,0,0,.15); }
  .confirm .row { display: flex; gap: 16px; justify-content: center; }
  /* Figuras geométricas y giro */
  .tool .glyph { font-size: 36px; line-height: 1; color: #1f2f6b; display: inline-block; transition: transform .15s; text-shadow: 0 2px 2px rgba(0,0,0,.2); }
  .tool.rot { flex-direction: column; gap: 0; }
  .tool.rot .glyph { font-size: 26px; color: #fff; }
  .tool.rot small { font-size: 16px; color: #fff; line-height: 1; font-weight: 900; }
  .tool.action.done { --a: #8ef0b0; --b: #24b36c; --d: #14784a; font-size: 34px; }
  /* Reto del nivel Experto: instrucción + lista para marcar */
  .task { position: absolute; left: 18px; right: 18px; top: 16px; z-index: 3; display: none; padding: 8px 12px 10px; border-radius: 5px 5px 18px 18px;
    background: linear-gradient(180deg, rgba(255,255,255,.97), rgba(241,246,255,.94)); box-shadow: 0 6px 0 #c9d2e6, 0 10px 18px rgba(20,40,90,.22); animation: pop .35s ease-out; }
  .task.show { display: block; }
  .task .tt { display: flex; align-items: center; gap: 10px; font-size: 20px; color: #1f2f6b; line-height: 1.15; }
  .task .tt b { color: #ff3d7f; }
  .task .spk { width: 52px; height: 52px; min-width: 52px; min-height: 52px; font-size: 24px; flex: 0 0 auto; }
  .task .chips { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px; align-items: center; }
  .chip { min-height: 56px; padding: 4px 16px; border-radius: 28px; background: #fff; border: 3px solid #dfe6f4; font-size: 20px; display: inline-flex; align-items: center; gap: 6px; cursor: pointer; box-shadow: 0 3px 0 #c9d2e6; transition: transform .1s; }
  .chip:active { transform: scale(.95); }
  .chip.on { background: linear-gradient(180deg, #e9ffe9, #b9f0c4); border-color: #6fdc8c; box-shadow: 0 3px 0 #3fa864; }
  .chip.on::before { content: '✔'; color: #14784a; }
  .hintchip { font-size: 15px; color: #6b7a99; }
  @media (orientation: landscape) {
    .wrap { flex-direction: row; }
    .tools { width: 296px; order: 2; gap: 6px 8px; overflow-y: auto; touch-action: pan-y; box-shadow: inset 0 2px 0 #fff, inset 3px 0 0 rgba(31,47,107,.08), -6px 0 14px rgba(20,40,90,.18); }
    .tools::-webkit-scrollbar { display: none; }
  }
</style>
</head>
<body>
<div class="game">
  <div class="wrap">
    <div class="board" id="board"><canvas id="cv"></canvas><div class="grain"></div></div>
    <div class="tools" id="tools"></div>
  </div>
  <div class="confirm" id="confirm">
    <div class="box">
      <div class="q"><span class="emoji">🗑️</span> ¿Borrar todo?</div>
      <div class="row">
        <button class="btn green big" id="confirmYes">Sí ✔</button>
        <button class="btn blue big" id="confirmNo">No ✖</button>
      </div>
    </div>
  </div>
</div>
<script src="../common.js"></script>
<script>
var game = KidsGame.init({ title: 'Dibujar' });

var board = document.getElementById('board'), cv = document.getElementById('cv'), ctx = cv.getContext('2d');
var tools = document.getElementById('tools');
var COLORS = ['#222222', '#ff4d4d', '#ff9f1c', '#ffe14d', '#4cd964', '#2ec4b6', '#3da9fc', '#a06cd5', '#ff7eb6', '#a0522d'];
var SIZES = [6, 14, 28];
var STICKERS = ['🌟', '❤️', '🌈', '🦄', '🐱', '🌸', '🍎', '⚽'];
var SHAPES = [['circ', '●'], ['sq', '■'], ['tri', '▲'], ['rect', '▬'], ['dia', '◆'], ['star', '★'], ['heart', '♥']];
var mode = 'brush';       // brush | rainbow | eraser | sticker | shape
var color = COLORS[1], size = SIZES[1], sticker = STICKERS[0], shape = 'circ', rot = 0, hue = 0, mirror = false;
var dpr = 1, W = 0, H = 0;
var nivel = 1;

// ---------- Lienzo: tamaño con devicePixelRatio, conservando el dibujo ----------
function resize() {
  var r = cv.getBoundingClientRect();
  var nw = Math.max(1, Math.round(r.width)), nh = Math.max(1, Math.round(r.height));
  var ndpr = Math.min(window.devicePixelRatio || 1, 3);
  if (nw === W && nh === H && ndpr === dpr) return;
  var old = null;
  if (W && H) { old = document.createElement('canvas'); old.width = cv.width; old.height = cv.height; old.getContext('2d').drawImage(cv, 0, 0); }
  W = nw; H = nh; dpr = ndpr;
  cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr);
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, W, H);
  if (old) ctx.drawImage(old, 0, 0, old.width, old.height, 0, 0, W, H);
  ctx.lineJoin = 'round'; ctx.lineCap = 'round';
}
window.addEventListener('resize', function () { setTimeout(resize, 50); });
if (window.ResizeObserver) { try { new ResizeObserver(function () { resize(); }).observe(board); } catch (e) {} }

// ---------- Utilidades visuales ----------
function shade(hex, amt) {
  var h = hex.replace('#', ''); if (h.length === 3) h = h[0] + h[0] + h[1] + h[1] + h[2] + h[2];
  var n = parseInt(h, 16), r = n >> 16, g = (n >> 8) & 255, b = n & 255;
  function f(v) { v = amt > 0 ? v + (255 - v) * amt : v * (1 + amt); return Math.max(0, Math.min(255, Math.round(v))); }
  return 'rgb(' + f(r) + ',' + f(g) + ',' + f(b) + ')';
}
// Crayón 3D en SVG: cuerpo con degradado lateral, punta, banda de papel y brillo
function crayon(c, i) {
  var id = 'cg' + i;
  return '<svg viewBox="9 1 46 62" xmlns="http://www.w3.org/2000/svg"><defs>' +
    '<linearGradient id="' + id + '" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="' + shade(c, .45) + '"/><stop offset=".42" stop-color="' + c + '"/><stop offset="1" stop-color="' + shade(c, -.35) + '"/></linearGradient></defs>' +
    '<g transform="rotate(-28 32 32)">' +
    '<ellipse cx="34" cy="60" rx="10" ry="3" fill="rgba(0,0,0,.22)"/>' +
    '<path d="M24 17 L32 2 L40 17 Z" fill="url(#' + id + ')" stroke="rgba(0,0,0,.28)" stroke-width="1.2" stroke-linejoin="round"/>' +
    '<rect x="24" y="16" width="16" height="43" rx="2.5" fill="url(#' + id + ')" stroke="rgba(0,0,0,.28)" stroke-width="1.2"/>' +
    '<rect x="22.5" y="27" width="19" height="16" rx="2" fill="rgba(255,255,255,.42)" stroke="rgba(0,0,0,.18)" stroke-width="1"/>' +
    '<rect x="27" y="19" width="2.6" height="38" rx="1.3" fill="rgba(255,255,255,.55)"/>' +
    '</g></svg>';
}
function burst(x, y, colors) {
  if (board.querySelectorAll('.sp').length > 30) return;
  for (var k = 0; k < 8; k++) {
    var s = document.createElement('span'); s.className = 'sp'; s.textContent = k % 2 ? '✦' : '★';
    var a = Math.random() * Math.PI * 2, d = 30 + Math.random() * 50;
    s.style.left = x + 'px'; s.style.top = y + 'px'; s.style.color = colors[k % colors.length];
    s.style.setProperty('--dx', Math.cos(a) * d + 'px'); s.style.setProperty('--dy', Math.sin(a) * d + 'px');
    s.style.animationDuration = (.5 + Math.random() * .3) + 's';
    board.appendChild(s);
    (function (el) { setTimeout(function () { el.remove(); }, 900); })(s);
  }
}

// ---------- Dibujo con pointer events (multitáctil por pointerId) ----------
var pointers = {};
function pos(e) { var r = cv.getBoundingClientRect(); return { x: e.clientX - r.left, y: e.clientY - r.top }; }
function strokeStyle(p) {
  if (mode === 'eraser') return '#fff';
  if (mode === 'rainbow') { p.hue = (p.hue + 5) % 360; return 'hsl(' + p.hue + ',100%,55%)'; }
  return color;
}
function line(x1, y1, x2, y2) { ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke(); }
function seg(p, to) {
  var lw = mode === 'eraser' ? size * 2.2 : size, st = strokeStyle(p);
  ctx.lineWidth = lw; ctx.strokeStyle = st;
  // borde suave del trazo (sombra del mismo color, muy corta)
  if (mode === 'eraser') { ctx.shadowBlur = 0; } else { ctx.shadowColor = st; ctx.shadowBlur = Math.max(1.5, lw * .12); }
  line(p.x, p.y, to.x, to.y);
  if (mirror) line(W - p.x, p.y, W - to.x, to.y);
  ctx.shadowBlur = 0;
  p.x = to.x; p.y = to.y;
}
function popAt(x, y, html, fs) {
  var cr = cv.getBoundingClientRect(), br = board.getBoundingClientRect();
  var bx = cr.left - br.left + x, by = cr.top - br.top + y;
  var g = document.createElement('span'); g.className = 'stpop emoji'; g.innerHTML = html; g.style.fontSize = fs + 'px';
  g.style.left = bx + 'px'; g.style.top = by + 'px'; board.appendChild(g);
  setTimeout(function () { g.remove(); }, 600);
  burst(bx, by, ['#fff', '#ffe14d', '#ff7eb6', '#3da9fc']);
}
function stampAt(x, y, fs, r) {
  ctx.save(); ctx.translate(x, y); ctx.rotate(r * Math.PI / 180);
  ctx.font = fs + 'px "Noto Color Emoji", "Apple Color Emoji", "Segoe UI Emoji", sans-serif';
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillStyle = '#000';
  ctx.shadowColor = 'rgba(0,0,0,.3)'; ctx.shadowBlur = 8; ctx.shadowOffsetY = 4;
  ctx.fillText(sticker, 0, 0);
  ctx.restore();
  popAt(x, y, sticker, fs);
}
function stamp(at) {
  var fs = 44 + size * 1.5;
  stampAt(at.x, at.y, fs, rot);
  if (mirror) stampAt(W - at.x, at.y, fs, -rot);
}
// Figuras geométricas con rotación (composición)
function shapePath(kind, s) {
  ctx.beginPath();
  switch (kind) {
    case 'circ': ctx.arc(0, 0, s / 2, 0, Math.PI * 2); break;
    case 'sq': ctx.rect(-s / 2, -s / 2, s, s); break;
    case 'rect': ctx.rect(-s * 0.7, -s * 0.33, s * 1.4, s * 0.66); break;
    case 'tri': ctx.moveTo(0, -s / 2); ctx.lineTo(s / 2, s / 2); ctx.lineTo(-s / 2, s / 2); ctx.closePath(); break;
    case 'dia': ctx.moveTo(0, -s / 2); ctx.lineTo(s / 2, 0); ctx.lineTo(0, s / 2); ctx.lineTo(-s / 2, 0); ctx.closePath(); break;
    case 'star': for (var i = 0; i < 10; i++) { var a = -Math.PI / 2 + i * Math.PI / 5, rr = i % 2 ? s * 0.21 : s * 0.52; ctx.lineTo(Math.cos(a) * rr, Math.sin(a) * rr); } ctx.closePath(); break;
    case 'heart': ctx.moveTo(0, s * 0.42); ctx.bezierCurveTo(-s * 0.62, -s * 0.02, -s * 0.28, -s * 0.56, 0, -s * 0.2); ctx.bezierCurveTo(s * 0.28, -s * 0.56, s * 0.62, -s * 0.02, 0, s * 0.42); break;
  }
}
function shapeAt(x, y, s, r) {
  ctx.save(); ctx.translate(x, y); ctx.rotate(r * Math.PI / 180);
  ctx.fillStyle = color; ctx.strokeStyle = shade(color, -.35); ctx.lineWidth = 3; ctx.lineJoin = 'round';
  ctx.shadowColor = 'rgba(0,0,0,.25)'; ctx.shadowBlur = 6; ctx.shadowOffsetY = 3;
  shapePath(shape, s); ctx.fill(); ctx.shadowBlur = 0; ctx.shadowOffsetY = 0; ctx.stroke();
  ctx.restore();
  popAt(x, y, '<span style="color:' + color + '">' + glyphOf(shape) + '</span>', s * 0.9);
}
function glyphOf(k) { for (var i = 0; i < SHAPES.length; i++) if (SHAPES[i][0] === k) return SHAPES[i][1]; return '●'; }
function placeShape(at) {
  var s = 48 + size * 2.4;
  shapeAt(at.x, at.y, s, rot);
  if (mirror) shapeAt(W - at.x, at.y, s, -rot);
}
cv.addEventListener('pointerdown', function (e) {
  e.preventDefault();
  try { cv.setPointerCapture(e.pointerId); } catch (err) {}
  var p = pos(e);
  if (mode === 'sticker') { stamp(p); KidsGame.sound.pop(); KidsGame.vibrate(15); return; }
  if (mode === 'shape') { placeShape(p); KidsGame.sound.pop(); KidsGame.vibrate(15); return; }
  p.hue = hue; hue = (hue + 40) % 360;
  pointers[e.pointerId] = p;
  seg(p, { x: p.x + 0.01, y: p.y + 0.01 }); // punto
});
cv.addEventListener('pointermove', function (e) {
  var p = pointers[e.pointerId]; if (!p) return;
  e.preventDefault();
  var evs = (e.getCoalescedEvents && e.getCoalescedEvents()) || [];
  if (evs.length) { for (var i = 0; i < evs.length; i++) seg(p, pos(evs[i])); }
  else seg(p, pos(e));
});
function endPointer(e) { if (pointers[e.pointerId]) { delete pointers[e.pointerId]; } }
cv.addEventListener('pointerup', endPointer);
cv.addEventListener('pointercancel', endPointer);
cv.addEventListener('lostpointercapture', endPointer);

// ---------- Medición de tinta (para "Listo" y "Completa el dibujo") ----------
function inkCount(x0, y0, x1, y1) {
  // cuenta píxeles no blancos muestreando cada 3 px (en coordenadas CSS)
  var n = 0; try {
    var sx = Math.max(0, Math.round(x0 * dpr)), sy = Math.max(0, Math.round(y0 * dpr));
    var sw = Math.min(cv.width - sx, Math.round((x1 - x0) * dpr)), sh = Math.min(cv.height - sy, Math.round((y1 - y0) * dpr));
    if (sw <= 0 || sh <= 0) return 0;
    // copia reducida en un lienzo temporal (lectura rápida, sin avisos del navegador)
    var tw = Math.max(1, Math.round(sw / (3 * dpr))), th = Math.max(1, Math.round(sh / (3 * dpr)));
    var tmp = document.createElement('canvas'); tmp.width = tw; tmp.height = th;
    var tc = tmp.getContext('2d', { willReadFrequently: true }); tc.drawImage(cv, sx, sy, sw, sh, 0, 0, tw, th);
    var d = tc.getImageData(0, 0, tw, th).data;
    for (var i = 0; i < d.length; i += 4) if (d[i] + d[i + 1] + d[i + 2] < 690) n++;
  } catch (e) { return 9999; }
  return n;
}
function inkFraction() { var samples = Math.ceil(W / 3) * Math.ceil(H / 3); return inkCount(0, 0, W, H) / Math.max(1, samples); }
function clearCanvas() { ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, W, H); }

// ---------- Nivel Experto: "Dibuja lo que te digo" y "Completa el dibujo" ----------
var PROMPTS = [
  { t: 'una casa con tres ventanas y un sol', items: ['🏠 casa', '🪟 3 ventanas', '☀️ sol'] },
  { t: 'un animal que no existe con seis patas', items: ['🐾 animal raro', '6️⃣ 6 patas', '👀 ojos'] },
  { t: 'un árbol con cinco manzanas y un pájaro', items: ['🌳 árbol', '🍎 5 manzanas', '🐦 pájaro'] },
  { t: 'una persona con sombrero y un perro a su lado', items: ['🧍 persona', '🎩 sombrero', '🐶 perro'] },
  { t: 'un cohete con dos ventanas y tres estrellas', items: ['🚀 cohete', '🪟 2 ventanas', '⭐ 3 estrellas'] },
  { t: 'un pastel con cuatro velas y una cereza', items: ['🎂 pastel', '🕯️ 4 velas', '🍒 cereza'] },
  { t: 'un robot con una antena y botones de colores', items: ['🤖 robot', '📡 antena', '🔴 botones'] },
  { t: 'una flor grande, una flor pequeña y una mariposa', items: ['🌸 flor grande', '🌼 flor pequeña', '🦋 mariposa'] },
  { t: 'un coche con cuatro ruedas bajo la lluvia', items: ['🚗 coche', '⚫ 4 ruedas', '🌧️ lluvia'] },
  { t: 'un pez en el mar con tres burbujas', items: ['🐟 pez', '🌊 mar', '🫧 3 burbujas'] },
  { t: 'un castillo con dos torres y una bandera', items: ['🏰 castillo', '🗼 2 torres', '🚩 bandera'] },
  { t: 'un monstruo amable con tres ojos y sonrisa', items: ['👾 monstruo', '👁️ 3 ojos', '😊 sonrisa'] }
];
// Plantillas "medio dibujo": se dibuja la mitad izquierda; x=1 es el eje central
var HALVES = {
  mariposa: { n: 'la mariposa', e: '🦋', draw: function (tx, ty, s) {
    ctx.beginPath(); ctx.ellipse(tx(1), ty(.5), s * .06, s * .34, 0, Math.PI / 2, Math.PI * 1.5); ctx.stroke();
    ctx.beginPath(); ctx.ellipse(tx(.5), ty(.36), s * .24, s * .17, -.4, 0, Math.PI * 2); ctx.stroke();
    ctx.beginPath(); ctx.ellipse(tx(.58), ty(.7), s * .17, s * .13, .4, 0, Math.PI * 2); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(tx(.95), ty(.18)); ctx.lineTo(tx(.7), ty(.04)); ctx.stroke();
    ctx.beginPath(); ctx.arc(tx(.68), ty(.04), s * .02, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.arc(tx(.5), ty(.36), s * .05, 0, Math.PI * 2); ctx.stroke();
  } },
  cara: { n: 'la cara', e: '😊', draw: function (tx, ty, s) {
    ctx.beginPath(); ctx.arc(tx(1), ty(.5), s * .42, Math.PI / 2, Math.PI * 1.5); ctx.stroke();
    ctx.beginPath(); ctx.arc(tx(.7), ty(.42), s * .045, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.moveTo(tx(.6), ty(.32)); ctx.quadraticCurveTo(tx(.7), ty(.27), tx(.8), ty(.32)); ctx.stroke();
    ctx.beginPath(); ctx.arc(tx(1), ty(.58), s * .2, Math.PI / 2, Math.PI); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(tx(1), ty(.46)); ctx.lineTo(tx(.92), ty(.58)); ctx.lineTo(tx(1), ty(.58)); ctx.stroke();
    ctx.beginPath(); ctx.arc(tx(.55), ty(.56), s * .035, 0, Math.PI * 2); ctx.stroke();
  } },
  casa: { n: 'la casa', e: '🏠', draw: function (tx, ty, s) {
    ctx.beginPath(); ctx.moveTo(tx(1), ty(.12)); ctx.lineTo(tx(.5), ty(.45)); ctx.lineTo(tx(.6), ty(.45)); ctx.lineTo(tx(.6), ty(.88)); ctx.lineTo(tx(1), ty(.88)); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(tx(.6), ty(.45)); ctx.lineTo(tx(1), ty(.45)); ctx.stroke();
    ctx.beginPath(); ctx.rect(tx(.68), ty(.54), s * .08, s * .12); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(tx(.9), ty(.88)); ctx.lineTo(tx(.9), ty(.66)); ctx.lineTo(tx(1), ty(.66)); ctx.stroke();
  } },
  corazon: { n: 'el corazón', e: '❤️', draw: function (tx, ty, s) {
    ctx.beginPath(); ctx.moveTo(tx(1), ty(.3)); ctx.bezierCurveTo(tx(.95), ty(.05), tx(.5), ty(.05), tx(.5), ty(.35)); ctx.bezierCurveTo(tx(.5), ty(.6), tx(.8), ty(.75), tx(1), ty(.92)); ctx.stroke();
  } },
  arbol: { n: 'el árbol', e: '🌳', draw: function (tx, ty, s) {
    ctx.beginPath(); ctx.moveTo(tx(.9), ty(.95)); ctx.lineTo(tx(.9), ty(.62)); ctx.stroke();
    ctx.beginPath(); ctx.arc(tx(1), ty(.4), s * .34, Math.PI / 2, Math.PI * 1.5); ctx.stroke();
    ctx.beginPath(); ctx.arc(tx(.8), ty(.38), s * .05, 0, Math.PI * 2); ctx.stroke();
    ctx.beginPath(); ctx.arc(tx(.68), ty(.52), s * .05, 0, Math.PI * 2); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(tx(.6), ty(.95)); ctx.lineTo(tx(1), ty(.95)); ctx.stroke();
  } },
  estrella: { n: 'la estrella', e: '⭐', draw: function (tx, ty, s) {
    ctx.beginPath();
    for (var i = 5; i <= 10; i++) { var a = -Math.PI / 2 + i * Math.PI / 5, rr = i % 2 ? .19 : .45; var x = 1 + Math.cos(a) * rr * 2, y = .5 + Math.sin(a) * rr; if (i === 5) ctx.moveTo(tx(x), ty(y)); else ctx.lineTo(tx(x), ty(y)); }
    ctx.stroke();
  } },
  flor: { n: 'la flor', e: '🌸', draw: function (tx, ty, s) {
    ctx.beginPath(); ctx.arc(tx(1), ty(.42), s * .1, Math.PI / 2, Math.PI * 1.5); ctx.stroke();
    [[.56, .42], [.7, .22], [.7, .62]].forEach(function (c) { ctx.beginPath(); ctx.arc(tx(c[0]), ty(c[1]), s * .11, 0, Math.PI * 2); ctx.stroke(); });
    ctx.beginPath(); ctx.arc(tx(1), ty(.14), s * .11, Math.PI / 2, Math.PI * 1.5); ctx.stroke();
    ctx.beginPath(); ctx.arc(tx(1), ty(.7), s * .11, Math.PI / 2, Math.PI * 1.5); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(tx(1), ty(.81)); ctx.lineTo(tx(1), ty(.98)); ctx.stroke();
    ctx.beginPath(); ctx.ellipse(tx(.82), ty(.88), s * .1, s * .045, -.5, 0, Math.PI * 2); ctx.stroke();
  } }
};
var expert = null, roundN = 0;
var task = document.createElement('div'); task.className = 'task'; board.appendChild(task);
function box() { var s = Math.min(W, H) * 0.78; return { s: s, x0: W / 2 - s / 2, y0: H / 2 - s / 2 }; }
function drawHalf(key) {
  var b = box(), tx = function (x) { return b.x0 + x * b.s / 2; }, ty = function (y) { return b.y0 + y * b.s; };
  ctx.save(); ctx.strokeStyle = '#8f9bb3'; ctx.fillStyle = '#8f9bb3'; ctx.lineWidth = 5; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  ctx.setLineDash([12, 10]); ctx.beginPath(); ctx.moveTo(W / 2, b.y0 - 12); ctx.lineTo(W / 2, b.y0 + b.s + 12); ctx.strokeStyle = '#c3cbe0'; ctx.stroke();
  ctx.setLineDash([]); ctx.strokeStyle = '#8f9bb3';
  HALVES[key].draw(tx, ty, b.s);
  ctx.restore();
}
function renderTask() {
  if (!expert) { task.classList.remove('show'); task.innerHTML = ''; return; }
  var html = '';
  if (expert.kind === 'prompt') {
    html = '<div class="tt"><button class="btn round yellow spk" aria-label="Oír">🔊</button><span>Dibuja <b>' + expert.p.t + '</b></span></div><div class="chips">' +
      expert.p.items.map(function (it, i) { return '<span class="chip' + (expert.done[i] ? ' on' : '') + '" data-i="' + i + '">' + it + '</span>'; }).join('') +
      '<span class="hintchip">👆 marca lo que ya dibujaste</span></div>';
  } else {
    html = '<div class="tt"><button class="btn round yellow spk" aria-label="Oír">🔊</button><span>' + HALVES[expert.key].e + ' Completa <b>' + HALVES[expert.key].n + '</b>: dibuja la otra mitad igual</span></div>';
  }
  task.innerHTML = html; task.classList.add('show');
  task.querySelector('.spk').addEventListener('pointerdown', function (ev) { ev.preventDefault(); ev.stopPropagation(); KidsGame.sound.tap(); sayTask(); });
  var chips = task.querySelectorAll('.chip');
  for (var i = 0; i < chips.length; i++) (function (ch) {
    ch.addEventListener('pointerdown', function (ev) {
      ev.preventDefault(); ev.stopPropagation();
      var k = +ch.getAttribute('data-i'); expert.done[k] = !expert.done[k]; ch.classList.toggle('on', expert.done[k]); KidsGame.sound.pop();
    });
  })(chips[i]);
}
function sayTask() {
  if (!expert) return;
  KidsGame.say(expert.kind === 'prompt' ? 'Dibuja ' + expert.p.t : 'Completa ' + HALVES[expert.key].n + '. Dibuja la otra mitad igual');
}
function startExpert(same) {
  clearCanvas();
  if (!same || !expert) {
    if (roundN % 2 === 0) {
      var p = KidsGame.pick(PROMPTS.filter(function (x) { return !expert || x !== expert.p; }));
      expert = { kind: 'prompt', p: p, done: p.items.map(function () { return false; }) };
    } else {
      var keys = Object.keys(HALVES).filter(function (k) { return !expert || k !== expert.key; });
      expert = { kind: 'half', key: KidsGame.pick(keys) };
    }
  } else if (expert.kind === 'prompt') expert.done = expert.p.items.map(function () { return false; });
  if (expert.kind === 'half') { mirror = false; var mr = document.getElementById('mirror'); if (mr) mr.classList.remove('sel'); drawHalf(expert.key); }
  renderTask(); sayTask();
}
function checkExpert() {
  if (!expert) return;
  if (expert.kind === 'prompt') {
    var missing = expert.done.filter(function (d) { return !d; }).length;
    if (inkFraction() < 0.012) { KidsGame.sound.wrong(); KidsGame.toast('Dibuja primero ✏️'); KidsGame.say('Dibuja primero'); return; }
    if (missing) { KidsGame.sound.wrong(); KidsGame.toast('Marca lo que ya dibujaste ✔ (' + missing + ')', 1800); KidsGame.say('Faltan cosas por dibujar o marcar'); return; }
  } else {
    var b = box(), left = inkCount(b.x0, b.y0 - 14, W / 2 - 2, b.y0 + b.s + 14), right = inkCount(W / 2 + 2, b.y0 - 14, b.x0 + b.s, b.y0 + b.s + 14);
    if (right < 150 || right < left * 0.45) { KidsGame.sound.wrong(); KidsGame.toast('Falta dibujar el otro lado 👉', 1800); KidsGame.say('Falta dibujar la otra mitad'); return; }
  }
  KidsGame.sound.ok(); KidsGame.addStar(3); roundN++;
  KidsGame.levelDone(4);
  KidsGame.celebrate({ msg: expert.kind === 'prompt' ? '¡Qué imaginación!' : '¡Está completo!', sub: expert.kind === 'prompt' ? '🗣️ ' + expert.p.t : HALVES[expert.key].e + ' ' + HALVES[expert.key].n,
    onNext: function () { startExpert(false); }, onAgain: function () { roundN--; startExpert(true); } });
}
function finishFree() {
  var f = inkFraction();
  if (f < 0.01) { KidsGame.sound.wrong(); KidsGame.toast('Dibuja algo primero ✏️'); KidsGame.say('Dibuja algo primero'); return; }
  KidsGame.sound.ok(); KidsGame.addStar(nivel);
  KidsGame.levelDone(nivel);
  KidsGame.celebrate({ msg: '¡Qué bonito!', sub: '🖼️ Tu dibujo está listo', onAgain: function () { clearCanvas(); KidsGame.sound.pop(); } });
}

// ---------- Herramientas (según nivel) ----------
function selectTool(el) {
  var all = tools.querySelectorAll('.tool.pick');
  for (var k = 0; k < all.length; k++) { all[k].classList.remove('sel'); var g = all[k].querySelector('.glyph'); if (g) { g.style.color = ''; g.style.transform = ''; } }
  if (el) el.classList.add('sel');
}
function selectSize(el) {
  var all = tools.querySelectorAll('.tool.size');
  for (var k = 0; k < all.length; k++) all[k].classList.remove('sel');
  el.classList.add('sel');
}
function mk(cls, html) { var d = document.createElement('div'); d.className = 'tool ' + cls; d.innerHTML = html; tools.appendChild(d); return d; }
function onTap(el, fn) { el.addEventListener('pointerdown', function (e) { e.preventDefault(); fn(); }); }

var confirmBox = document.getElementById('confirm');
document.getElementById('confirmYes').onclick = function () {
  confirmBox.classList.remove('show');
  clearCanvas();
  if (expert && expert.kind === 'half') drawHalf(expert.key);
  KidsGame.sound.pop(); KidsGame.toast('¡Listo! 🗑️');
};
document.getElementById('confirmNo').onclick = function () { confirmBox.classList.remove('show'); KidsGame.sound.tap(); };

var lastColorEl = null;
function buildTools() {
  tools.innerHTML = '';
  // HUD: nivel + botón para cambiar de nivel
  var hud = document.createElement('div'); hud.className = 'hud';
  hud.appendChild(KidsGame.levelBadge(nivel));
  var lb = document.createElement('button'); lb.className = 'btn round purple lvbtn'; lb.textContent = '🎚️'; lb.setAttribute('aria-label', 'Cambiar nivel');
  lb.addEventListener('pointerdown', function (ev) { ev.preventDefault(); ev.stopPropagation(); KidsGame.sound.tap(); pickLevel(); });
  hud.appendChild(lb);
  tools.appendChild(hud);

  var colors = nivel === 1 ? COLORS.slice(0, 6) : COLORS;
  if (colors.indexOf(color) < 0) color = COLORS[1];
  if (nivel === 1) size = SIZES[1];
  if (nivel < 3) { mirror = false; if (mode === 'sticker' || mode === 'rainbow') mode = 'brush'; }
  if (nivel < 2) { rot = 0; if (mode === 'shape') mode = 'brush'; }
  lastColorEl = null;
  colors.forEach(function (c, i) {
    var el = mk('pick color', crayon(c, i)); el.setAttribute('aria-label', 'Color');
    if (c === color) { lastColorEl = el; if (mode === 'brush') el.classList.add('sel'); }
    onTap(el, function () { color = c; lastColorEl = el; if (mode !== 'shape') { mode = 'brush'; selectTool(el); } else { var sh = tools.querySelector('.tool.shape.sel'); if (sh) sh.querySelector('.glyph').style.color = c; } KidsGame.sound.tap(); });
  });
  if (nivel >= 3) {
    var rb = mk('pick rainbow', ''); rb.id = 'rainbow'; if (mode === 'rainbow') rb.classList.add('sel');
    onTap(rb, function () { mode = 'rainbow'; selectTool(rb); KidsGame.sound.pop(); });
  }
  var er = mk('pick', '<span class="emoji">🧽</span>'); er.id = 'eraser'; if (mode === 'eraser') er.classList.add('sel');
  onTap(er, function () { mode = 'eraser'; selectTool(er); KidsGame.sound.tap(); });
  if (nivel >= 2) {
    SIZES.forEach(function (s) {
      var el = mk('size', '<div class="dot" style="width:' + (s + 6) + 'px;height:' + (s + 6) + 'px"></div>'); if (s === size) el.classList.add('sel');
      onTap(el, function () { size = s; if (mode === 'sticker') { mode = 'brush'; selectTool(lastColorEl); } selectSize(el); KidsGame.sound.tap(); });
    });
    // Figuras geométricas (nivel 2+) y rotación (nivel 3+)
    SHAPES.forEach(function (sh) {
      var el = mk('pick shape', '<span class="glyph">' + sh[1] + '</span>'); el.setAttribute('aria-label', 'Figura');
      if (mode === 'shape' && shape === sh[0]) { el.classList.add('sel'); el.querySelector('.glyph').style.color = color; }
      onTap(el, function () { mode = 'shape'; shape = sh[0]; selectTool(el); el.querySelector('.glyph').style.color = color; el.querySelector('.glyph').style.transform = 'rotate(' + rot + 'deg)'; KidsGame.sound.pop(); });
    });
    if (nivel >= 3) {
      var rt = mk('toggle rot', '<span class="glyph" style="transform:rotate(' + rot + 'deg)">▲</span><small>↻</small>'); rt.id = 'rotate'; rt.setAttribute('aria-label', 'Girar');
      onTap(rt, function () {
        rot = (rot + 45) % 360; rt.querySelector('.glyph').style.transform = 'rotate(' + rot + 'deg)';
        var sel = tools.querySelector('.tool.shape.sel .glyph'); if (sel) sel.style.transform = 'rotate(' + rot + 'deg)';
        KidsGame.sound.tap(); KidsGame.toast('Giro ' + rot + '°');
      });
    }
  }
  if (nivel >= 3) {
    STICKERS.forEach(function (st) {
      var el = mk('pick sticker', '<span class="emoji">' + st + '</span>'); if (mode === 'sticker' && st === sticker) el.classList.add('sel');
      onTap(el, function () { mode = 'sticker'; sticker = st; selectTool(el); KidsGame.sound.pop(); });
    });
    var mr = mk('toggle', '<span class="emoji">🪞</span>'); mr.id = 'mirror'; mr.setAttribute('aria-label', 'Espejo'); if (mirror) mr.classList.add('sel');
    onTap(mr, function () { mirror = !mirror; mr.classList.toggle('sel', mirror); KidsGame.sound.pop(); KidsGame.toast(mirror ? 'Espejo 🪞 ✔' : 'Espejo ✖'); });
  }
  var clr = mk('action', '<span class="emoji">🗑️</span>'); clr.id = 'clear';
  onTap(clr, function () { KidsGame.sound.tap(); confirmBox.classList.add('show'); KidsGame.say('¿Borrar todo?'); });
  var sv = mk('action save', '<span class="emoji">📷</span>'); sv.id = 'save';
  onTap(sv, function () {
    KidsGame.sound.ok(); KidsGame.addStar();
    try {
      var url = cv.toDataURL('image/png');
      var w = window.open('', '_blank');
      if (w && w.document) {
        w.document.write('<!DOCTYPE html><html><head><meta charset="utf-8"><title>Mi dibujo</title></head><body style="margin:0;background:#fef6e4;display:flex;align-items:center;justify-content:center;min-height:100vh"><img src="' + url + '" style="max-width:100%;max-height:100vh"></body></html>');
        w.document.close();
      } else {
        var a = document.createElement('a'); a.href = url; a.download = 'mi-dibujo.png'; a.target = '_blank';
        document.body.appendChild(a); a.click(); a.remove();
      }
    } catch (e) {}
    KidsGame.toast('¡Listo! 📷');
  });
  var ok = mk('action done', nivel === 4 ? '✔' : '✨'); ok.id = 'finish'; ok.setAttribute('aria-label', 'Listo');
  onTap(ok, function () { KidsGame.sound.tap(); if (nivel === 4) checkExpert(); else finishFree(); });
  if (!tools.querySelector('.tool.pick.sel') && lastColorEl) { mode = 'brush'; lastColorEl.classList.add('sel'); }
  setTimeout(resize, 50);
}

// ---------- Niveles: herramientas desbloqueadas y retos ----------
function start(n) {
  nivel = n; buildTools();
  if (n === 4) { setTimeout(function () { resize(); startExpert(false); }, 120); }
  else { expert = null; renderTask(); if (n === 3) { mirror = true; var mr = document.getElementById('mirror'); if (mr) mr.classList.add('sel'); KidsGame.say('Espejo: dibuja y se copia al otro lado'); } }
}
function pickLevel() {
  KidsGame.levelPicker({
    labels: { 1: '6 colores', 2: 'Tamaños y figuras', 3: 'Espejo, arcoíris, giro y calcomanías', 4: 'Dibuja lo que te digo y completa el dibujo' },
    onPick: start
  });
}

resize();
setTimeout(resize, 100);
pickLevel();
</script>
