<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<link rel="stylesheet" href="../common.css">
<title>Letras</title>
<style>
  /* Mundo: "La escuelita del bosque" — copas de árboles, troncos y pasto al fondo */
  .game { background:
      radial-gradient(circle at 5% 88%, #3c9440 0 74px, rgba(0,0,0,0) 75px),
      radial-gradient(circle at 15% 78%, #58b84c 0 92px, rgba(0,0,0,0) 93px),
      radial-gradient(circle at 96% 86%, #3c9440 0 84px, rgba(0,0,0,0) 85px),
      radial-gradient(circle at 86% 74%, #5ec150 0 98px, rgba(0,0,0,0) 99px),
      linear-gradient(90deg, #6b3d12, #a3652e 45%, #6b3d12) 15% 100% / 30px 24% no-repeat,
      linear-gradient(90deg, #6b3d12, #a3652e 45%, #6b3d12) 86% 100% / 30px 22% no-repeat,
      linear-gradient(180deg, rgba(255,255,255,0) 0 62%, rgba(90,170,70,.22) 100%); }
  .screen { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; padding: 8px; z-index: 1; }
  /* Maestra Lechuza (hero art) */
  body.jk-hide .jk-streak { display: none; }
  .owl { position: absolute; left: 10px; bottom: 6px; z-index: 2; pointer-events: none; filter: drop-shadow(0 8px 8px rgba(0,0,0,.3)); animation: float 3.6s ease-in-out infinite; }
  .owl svg { display: block; overflow: visible; }
  .owl.cheer { animation: owcheer .7s ease-in-out; }
  @keyframes owcheer { 0%,100% { transform: translateY(0) rotate(0); } 30% { transform: translateY(-26px) rotate(-8deg); } 60% { transform: translateY(-10px) rotate(6deg); } }
  .menu .owl { position: static; margin: 0 0 -10px; animation: float 3.6s ease-in-out infinite; }
  .bubble { position: relative; font-size: min(5vw, 26px); font-weight: 900; color: #1f2f6b; background: linear-gradient(180deg, #fff, #eef2fb); border: 3px solid #fff; border-radius: 26px; padding: 10px 22px;
    box-shadow: 0 6px 0 #c9d2e6, 0 12px 20px rgba(20,40,90,.22), inset 0 2px 0 #fff; text-align: center; animation: pop .4s ease-out; max-width: 92vw; }
  .bubble::after { content: ""; position: absolute; left: 50%; bottom: -14px; width: 24px; height: 24px; margin-left: -12px; background: #eef2fb; transform: rotate(45deg); border-radius: 4px; box-shadow: 4px 4px 0 #c9d2e6; }
  .sign { position: relative; transform: rotate(-2deg); margin-bottom: -6px; padding: 6px 22px; border-radius: 12px; color: #fff3d6; font-size: min(4.6vw, 24px); font-weight: 900; white-space: nowrap; z-index: 2;
    background: linear-gradient(180deg, #b8763a, #8b5222); box-shadow: 0 5px 0 #5c3510, 0 10px 16px rgba(0,0,0,.3), inset 0 2px 0 rgba(255,235,200,.5); text-shadow: 0 2px 0 #5c3510; }
  /* Bloques con carita */
  .choices .block .l { position: relative; z-index: 1; transform: translateY(-14%); font-size: .82em; }
  .face { position: absolute; left: 0; right: 0; bottom: 9%; height: 30%; pointer-events: none; z-index: 1; }
  .face i { position: absolute; top: 0; width: 19%; height: 44%; border-radius: 50%; background: #fff; box-shadow: inset 0 -2px 0 rgba(0,0,0,.12); transform-origin: 50% 50%; }
  .face i::after { content: ""; position: absolute; left: 32%; top: 30%; width: 46%; height: 46%; border-radius: 50%; background: #1f2f6b; }
  .face i:first-child { left: 28%; } .face i:nth-child(2) { right: 28%; }
  .face u { position: absolute; left: 40%; right: 40%; bottom: 4%; height: 38%; border-bottom: 4px solid rgba(40,20,60,.65); border-radius: 0 0 50% 50% / 0 0 100% 100%; }
  .choices .block.ok .face i { height: 16%; top: 14%; border-radius: 50% 50% 0 0; background: #1f2f6b; transform: none !important; }
  .choices .block.ok .face i::after { display: none; }
  .choices .block.ok .face u { left: 32%; right: 32%; height: 50%; border-bottom-width: 6px; }
  .choices .block.bad .face u { border-bottom: 0; border-top: 4px solid rgba(40,20,60,.65); border-radius: 50% 50% 0 0 / 100% 100% 0 0; bottom: -8%; }
  /* Gises de colores (desbloqueables) */
  .chalks { display: flex; gap: 10px; align-items: center; justify-content: center; flex: 0 0 auto; margin-top: 22px; }
  .chalk { width: 64px; height: 64px; border-radius: 50%; border: 3px solid #fff; display: flex; align-items: center; justify-content: center; cursor: pointer; position: relative; font-size: 22px;
    background: linear-gradient(180deg, #fff, #e6ecf8); box-shadow: 0 5px 0 #b9c4dc, 0 8px 12px rgba(0,0,0,.2), inset 0 2px 0 #fff; transition: transform .12s; }
  .chalk i { display: block; width: 14px; height: 40px; border-radius: 7px; background: var(--c, linear-gradient(180deg, #fff, #d9d9d9)); box-shadow: 0 2px 3px rgba(0,0,0,.3), inset -3px 0 0 rgba(0,0,0,.12); transform: rotate(25deg); }
  .chalk.sel { transform: scale(1.12); box-shadow: 0 0 0 4px #ffd166, 0 5px 0 #b9c4dc, 0 10px 16px rgba(0,0,0,.25); }
  .chalk.lock { opacity: .55; } .chalk.lock i { display: none; }
  /* ---- Kit de "juice" (racha, banner de ronda, transiciones) ---- */
  .jk-banner { position: fixed; left: 50%; top: 70px; z-index: 44; transform: translate(-50%,0) scale(.6); opacity: 0; pointer-events: none;
    padding: 8px 28px; border-radius: 40px; font-size: 28px; font-weight: 900; color: #fff; white-space: nowrap; border: 4px solid #fff;
    background: linear-gradient(180deg, #ffb703, #ff8906); box-shadow: 0 7px 0 #b85a00, 0 16px 28px rgba(0,0,0,.3), inset 0 2px 0 rgba(255,255,255,.6);
    text-shadow: 0 3px 0 #b85a00, 0 5px 8px rgba(0,0,0,.3); }
  .jk-banner.in { animation: jkb 1.4s ease-in-out forwards; }
  @keyframes jkb { 0% { transform: translate(-50%,0) scale(.6); opacity: 0 } 14% { transform: translate(-50%,0) scale(1.08); opacity: 1 } 24% { transform: translate(-50%,0) scale(1) } 78% { transform: translate(-50%,0) scale(1); opacity: 1 } 100% { transform: translate(-50%,-30px) scale(.9); opacity: 0 } }
  .jk-streak { position: fixed; top: 78px; right: 240px; z-index: 40; padding: 5px 14px; border-radius: 30px; pointer-events: none;
    background: linear-gradient(180deg,#fff7d6,#ffd166); box-shadow: 0 4px 0 #d9a520, 0 8px 14px rgba(0,0,0,.2), inset 0 1px 0 #fff; font-size: 20px; font-weight: 900; color: #7a4b00;
    opacity: 0; transition: opacity .3s; }
  .jk-streak.on { opacity: 1; }
  .jk-streak.hot { animation: jkhot .45s ease-out; }
  @keyframes jkhot { 0% { transform: scale(1) } 40% { transform: scale(1.3) rotate(-4deg) } 100% { transform: scale(1) } }
  @media (max-width: 820px) { .jk-banner { top: 120px; } .jk-streak { top: 148px; left: 8px; right: auto; } }
  .jk-in { animation: jkin .42s cubic-bezier(.2,.9,.3,1.15) both; }
  .jk-out { animation: jkout .24s ease-in forwards; pointer-events: none; }
  @keyframes jkin { from { transform: translateX(70px) scale(.92); opacity: 0 } to { transform: none; opacity: 1 } }
  @keyframes jkout { to { transform: translateX(-70px) scale(.92); opacity: 0 } }
  .jk-blink { transform-box: fill-box; transform-origin: center; }
  .jk-blink.on { transform: scaleY(.12); }
  .jk-press { animation: jkpress .28s ease-out; }
  @keyframes jkpress { 0% { transform: scale(1) } 35% { transform: scale(.9,1.1) } 70% { transform: scale(1.1,.92) } 100% { transform: scale(1) } }

  /* HUD de nivel: pastilla de cristal con botón 🎚️ */
  .hud { position: absolute; top: 8px; left: 8px; z-index: 3; display: flex; align-items: center; gap: 8px; }
  .hud .btn { font-size: 28px; }
  .tools { position: absolute; top: 8px; right: 8px; z-index: 3; }
  .tools .btn { font-size: 30px; }
  /* Menú de modos */
  .menu { justify-content: center; gap: 18px; }
  .menu > .btn { width: min(88vw, 480px); min-height: 108px; font-size: min(7vw, 34px); gap: 16px; animation: float 3.4s ease-in-out infinite; }
  .menu > .btn:nth-child(3) { animation-delay: -1.7s; }
  .menu > .btn .emoji { font-size: 1.5em; }
  /* Escucha y toca */
  .listen { justify-content: center; gap: min(2vh, 14px); }
  /* Medallón brillante para la imagen protagonista */
  .medal {
    position: relative; width: min(30vh, 40vw, 230px); height: min(30vh, 40vw, 230px); border-radius: 50%;
    display: flex; align-items: center; justify-content: center; cursor: pointer;
    background: radial-gradient(circle at 35% 28%, #ffffff 0%, #fff6d0 32%, #ffd166 70%, #f5a623 100%);
    box-shadow: 0 10px 0 #c97d0b, 0 18px 28px rgba(90,50,0,.3), inset 0 4px 0 rgba(255,255,255,.9), inset 0 -8px 0 rgba(180,110,0,.25), 0 0 0 7px #fff, 0 0 0 11px rgba(255,209,102,.6);
    animation: float 3.6s ease-in-out infinite;
  }
  .medal::before { content: ""; position: absolute; left: 12%; right: 12%; top: 6%; height: 34%; border-radius: 50%; background: linear-gradient(180deg, rgba(255,255,255,.85), rgba(255,255,255,0)); pointer-events: none; }
  .medal::after { content: ""; position: absolute; inset: 0; border-radius: 50%; background: radial-gradient(circle at 50% 88%, rgba(255,255,255,.35), rgba(255,255,255,0) 40%); pointer-events: none; }
  .pic { font-size: min(19vh, 25vw, 145px); filter: drop-shadow(0 8px 6px rgba(90,50,0,.35)); }
  .word { font-size: min(8vh, 10vw, 60px); font-weight: 900; letter-spacing: 1px; white-space: nowrap; color: #fff; text-shadow: 0 3px 0 #1f7fae, 0 6px 10px rgba(0,0,0,.3), -2px -2px 0 #1f7fae, 2px -2px 0 #1f7fae, -2px 2px 0 #1f7fae, 2px 2px 0 #1f7fae; }
  .word b { color: #ffd166; font-size: 1.35em; margin-right: 2px; text-shadow: 0 3px 0 #c97d0b, 0 6px 10px rgba(0,0,0,.3), -2px -2px 0 #c97d0b, 2px -2px 0 #c97d0b, -2px 2px 0 #c97d0b, 2px 2px 0 #c97d0b; }
  .choices { display: flex; gap: min(3vw, 22px); justify-content: center; margin-top: 10px; }
  /* Bloques de abecedario: plástico grueso con bisel, luz arriba-izquierda y sombra */
  .choices .block {
    --a: #ffd0e4; --b: #f582ae; --d: #b8306f;
    position: relative; width: min(27vw, 24vh, 160px); height: min(27vw, 24vh, 160px); border-radius: 22px;
    display: flex; align-items: center; justify-content: center; cursor: pointer;
    font-size: min(15vw, 13vh, 92px); font-weight: 900; color: #fff; line-height: 1;
    background: linear-gradient(135deg, var(--a) 0%, var(--b) 55%, var(--d) 130%);
    box-shadow: 0 9px 0 var(--d), 0 16px 22px rgba(20,40,90,.28), inset 0 3px 0 rgba(255,255,255,.7), inset 3px 0 0 rgba(255,255,255,.35), inset 0 -4px 0 rgba(0,0,0,.15), inset -3px 0 0 rgba(0,0,0,.08);
    text-shadow: 0 3px 0 var(--d), 0 6px 8px rgba(0,0,0,.3), -1px -1px 0 rgba(0,0,0,.15);
    transition: transform .12s, box-shadow .12s; animation: pop .35s ease-out backwards, float 3.2s ease-in-out infinite;
  }
  .choices.four .block { width: min(21vw, 20vh, 140px); height: min(21vw, 20vh, 140px); font-size: min(12vw, 11vh, 82px); }
  .choices.five .block { width: min(17vw, 17vh, 118px); height: min(17vw, 17vh, 118px); font-size: min(10vw, 9vh, 70px); border-radius: 18px; }
  .choices.syl .block { font-size: min(8vw, 7.5vh, 54px); letter-spacing: 1px; }
  /* Pregunta visual: ¿empieza / termina / falta? */
  .ask { display: flex; align-items: center; gap: 8px; font-size: min(4.6vw, 24px); font-weight: 900; color: #1f2f6b; border-radius: 30px; padding: 6px 18px; white-space: nowrap;
    background: linear-gradient(180deg, #ffffff, #eef2fb); border: 3px solid #fff; box-shadow: 0 5px 0 #c9d2e6, 0 10px 16px rgba(20,40,90,.2), inset 0 2px 0 #fff; animation: pop .35s ease-out; }
  .ask .emoji { font-size: 1.3em; }
  .word .gap { display: inline-block; min-width: .7em; color: #ffd166; border-bottom: 6px solid #ffd166; line-height: .9; margin: 0 2px; text-shadow: 0 3px 0 #c97d0b, -2px -2px 0 #c97d0b, 2px -2px 0 #c97d0b, -2px 2px 0 #c97d0b, 2px 2px 0 #c97d0b; }
  .word .gap.now { animation: blinkgap 1s ease-in-out infinite; }
  .word .gap.fill { border-bottom-color: #2fd27a; animation: pop .3s ease-out; }
  @keyframes blinkgap { 0%,100% { border-bottom-color: #ffd166; } 50% { border-bottom-color: #fff; } }
  .tracebox text.cursive { font-family: "Segoe Script", "Comic Sans MS", "Bradley Hand", "Snell Roundhand", cursive; font-style: italic; font-weight: 700; letter-spacing: 4px; }
  .choices .block::before { content: ""; position: absolute; left: 10%; right: 10%; top: 6%; height: 34%; border-radius: 16px 16px 40% 40%; background: linear-gradient(180deg, rgba(255,255,255,.6), rgba(255,255,255,0)); pointer-events: none; }
  .choices .block::after { content: ""; position: absolute; inset: 10%; border-radius: 14px; border: 3px solid rgba(255,255,255,.35); box-shadow: inset 0 2px 4px rgba(0,0,0,.12); pointer-events: none; }
  .choices .block:active { transform: scale(.94) translateY(5px); box-shadow: 0 3px 0 var(--d), 0 6px 10px rgba(20,40,90,.25), inset 0 3px 0 rgba(255,255,255,.6); animation: none; }
  .choices .block.ok { --a: #c6ffd9; --b: #2fd27a; --d: #148a4d; animation: bounce .6s; box-shadow: 0 9px 0 var(--d), 0 16px 22px rgba(20,120,60,.3), 0 0 0 6px rgba(120,255,170,.55), 0 0 30px rgba(120,255,170,.8), inset 0 3px 0 rgba(255,255,255,.7); }
  .choices .block.bad { animation: shake .35s; }
  /* Chispas al acertar */
  .spark { position: fixed; width: 14px; height: 14px; border-radius: 50%; pointer-events: none; z-index: 30; background: radial-gradient(circle, #fff 0 30%, var(--c) 32% 60%, rgba(255,255,255,0) 62%); box-shadow: 0 0 8px var(--c); animation: sparkfly .7s ease-out forwards; }
  @keyframes sparkfly { 0% { transform: translate(0,0) scale(1); opacity: 1; } 100% { transform: translate(var(--dx), var(--dy)) scale(.2); opacity: 0; } }
  /* Traza la letra: pizarrón con marco de madera */
  .trace { gap: 8px; }
  .nav { display: flex; align-items: center; justify-content: center; gap: 12px; width: 100%; flex: 0 0 auto; }
  .hint { flex: 0 1 auto; min-width: 120px; text-align: center; font-size: min(5vw, 30px); font-weight: 900; color: #1f2f6b; border-radius: 30px; padding: 8px 20px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; cursor: pointer;
    background: linear-gradient(180deg, #ffffff, #eef2fb); border: 3px solid #fff; box-shadow: 0 5px 0 #c9d2e6, 0 10px 16px rgba(20,40,90,.2), inset 0 2px 0 #fff; text-shadow: 0 1px 0 #fff; }
  .hint .emoji { font-size: 1.3em; }
  .tracebox {
    position: relative; flex: 1 1 auto; width: 100%; max-width: 960px; min-height: 120px; border-radius: 18px;
    background: radial-gradient(ellipse at 30% 20%, #3f8a6a 0%, #2f6f55 45%, #245c45 100%);
    border: 14px solid transparent; background-clip: padding-box;
    box-shadow: 0 12px 0 #6b3d12, 0 22px 30px rgba(60,30,0,.35);
  }
  .tracebox::before { content: ""; position: absolute; inset: -14px; z-index: -1; border-radius: 18px;
    background-image: repeating-linear-gradient(90deg, rgba(255,255,255,.08) 0 6px, rgba(0,0,0,0) 6px 22px), linear-gradient(180deg, #d59a52 0%, #b8763a 30%, #a3652e 70%, #8b5222 100%);
    box-shadow: inset 0 3px 0 rgba(255,235,200,.5), inset 0 -4px 0 rgba(0,0,0,.25); }
  .tracebox::after { content: ""; position: absolute; inset: 0; border-radius: 6px; pointer-events: none;
    background: linear-gradient(180deg, rgba(255,255,255,.1), rgba(255,255,255,0) 40%);
    box-shadow: inset 0 0 0 3px rgba(0,0,0,.25), inset 0 8px 18px rgba(0,0,0,.35); }
  .tracebox svg { position: absolute; inset: 0; width: 100%; height: 100%; }
  .tracebox text { font-family: inherit; font-weight: 900; stroke-linejoin: round; }
  .tracebox .glow { fill: none; stroke: rgba(255,255,255,.4); stroke-width: 16; filter: url(#chalkglow); }
  .tracebox .dark { fill: rgba(0,0,0,.25); stroke: rgba(0,0,0,.35); stroke-width: 6; }
  .tracebox .lite { fill: rgba(255,255,255,.12); stroke: rgba(255,255,255,.9); stroke-width: 5; stroke-dasharray: 14 10; stroke-linecap: round; }
  .tracebox canvas { position: absolute; inset: 0; width: 100%; height: 100%; touch-action: none; cursor: crosshair; border-radius: 6px; }
  .tray { position: absolute; left: 8%; right: 8%; bottom: -30px; height: 16px; border-radius: 0 0 8px 8px; background: linear-gradient(180deg, #c98b48, #8b5222); box-shadow: 0 5px 0 #5c3510, 0 10px 12px rgba(0,0,0,.3), inset 0 2px 0 rgba(255,255,255,.35); pointer-events: none; }
  .tray::before, .tray::after { content: ""; position: absolute; top: -8px; width: 54px; height: 10px; border-radius: 5px; background: linear-gradient(180deg, #fff, #dcdcdc); box-shadow: 0 2px 3px rgba(0,0,0,.35); }
  .tray::before { left: 6%; } .tray::after { right: 8%; width: 44px; background: linear-gradient(180deg, #ffd6e8, #f582ae); }
  .actions { display: flex; align-items: center; gap: 22px; flex: 0 0 auto; margin-top: 20px; }
  .actions .btn { font-size: 36px; min-width: 90px; }
  .actions .hud { position: static; }
  .actions .hud .btn { font-size: 28px; min-width: 64px; }
</style>
</head>

<script src="../common.js"></script>
<script>
(function () {
  var game = KidsGame.init({ title: 'Letras' });
  /* ---- Kit de "juice": racha, banner de ronda, transición entre rondas, guardado ---- */
  var JK = (function () {
    var streak = 0, pill = null, bannerEl = null;
    function pillEl() { if (!pill) { pill = document.createElement('div'); pill.className = 'jk-streak'; document.body.appendChild(pill); } return pill; }
    function hit(el, txt) {
      streak++; var p = pillEl();
      if (streak >= 2) { p.textContent = '🔥 Racha ' + streak; p.classList.add('on'); p.classList.remove('hot'); void p.offsetWidth; p.classList.add('hot'); }
      var r = el && el.getBoundingClientRect ? el.getBoundingClientRect() : null;
      var x = r ? r.left + r.width / 2 : window.innerWidth / 2, y = r ? r.top + 8 : window.innerHeight / 2;
      if (el) { try { KidsGame.fx.ring(el); } catch (e) {} }
      if (streak % 5 === 0) { KidsGame.addStar(); KidsGame.fx.floatText(x, y, '¡Racha x' + streak + '! ⭐ extra', 'good'); KidsGame.fx.burst(x, y, { n: 22, r: 110, chars: ['⭐', '✨', '🔥', '💫'] }); }
      else if (streak >= 3) { KidsGame.fx.floatText(x, y, '¡Racha x' + streak + '!', 'good'); KidsGame.fx.burst(x, y, { n: 14, chars: ['✨', '⭐'] }); }
      else { KidsGame.fx.floatText(x, y, txt || '+1', 'good'); KidsGame.fx.burst(x, y, { n: 12 }); }
      return streak;
    }
    function miss(el) { streak = 0; if (pill) pill.classList.remove('on'); if (el) KidsGame.fx.shake(el); }
    function reset() { streak = 0; if (pill) pill.classList.remove('on'); }
    // El banner se crea tras pintar la pantalla (sin reflow síncrono) y se reemplaza el nodo para reiniciar la animación
    var bannerT = null;
    function banner(text) {
      clearTimeout(bannerT);
      bannerT = setTimeout(function () {
        if (bannerEl) bannerEl.remove();
        bannerEl = document.createElement('div'); bannerEl.className = 'jk-banner in'; bannerEl.textContent = text; document.body.appendChild(bannerEl);
      }, 90);
    }
    // Parpadeo de ojos sin animación continua: cada ~4 s se cierran 130 ms (clase .jk-blink)
    setInterval(function () {
      var eyes = document.querySelectorAll('.jk-blink'); if (!eyes.length) return;
      for (var i = 0; i < eyes.length; i++) eyes[i].classList.add('on');
      setTimeout(function () { for (var j = 0; j < eyes.length; j++) eyes[j].classList.remove('on'); }, 130);
    }, 4200);
    function swap(el, fn) {
      if (!el || !el.parentNode) { fn(); return; }
      el.classList.remove('jk-in'); el.classList.add('jk-out');
      setTimeout(function () { el.classList.remove('jk-out'); fn(); el.classList.add('jk-in'); setTimeout(function () { el.classList.remove('jk-in'); }, 480); }, 230);
    }
    function press(el) { if (!el) return; el.classList.remove('jk-press'); void el.offsetWidth; el.classList.add('jk-press'); }
    function store(k, d) { try { var v = JSON.parse(localStorage.getItem(k)); return v == null ? d : v; } catch (e) { return d; } }
    function put(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
    return { hit: hit, miss: miss, reset: reset, banner: banner, swap: swap, press: press, store: store, put: put, get streak() { return streak; } };
  })();

  // ---- Hero art: la maestra Lechuza (SVG con degradados y brillo) ----
  function owlSVG(size, id) {
    id = id || 'ow';
    return '<svg viewBox="0 0 124 130" width="' + size + '" height="' + Math.round(size * 130 / 124) + '" aria-hidden="true"><defs>' +
      '<radialGradient id="' + id + 'b" cx="40%" cy="30%" r="75%"><stop offset="0" stop-color="#d49a60"/><stop offset="1" stop-color="#7a4a21"/></radialGradient>' +
      '<radialGradient id="' + id + 'w" cx="50%" cy="40%" r="60%"><stop offset="0" stop-color="#fff8e6"/><stop offset="1" stop-color="#ecc99c"/></radialGradient>' +

  /* ---------- Modo 2: Traza la letra ---------- */
  var idx = 0, strokes = [], canvas, ctx, box, svgText, hint, traceLock = false, strokeN = 0;
  var drawing = false, pid = null, cur = null;
  function startTrace() {
    mode = 'trace'; game.innerHTML = '';
    var s = el('div', 'screen trace');
    var nav = el('div', 'nav');
    var prev = el('button', 'btn round blue prev', '◀'), next = el('button', 'btn round blue next', '▶');
    hint = el('div', 'hint');
    var sw = el('button', 'btn round', '🔊'); sw.setAttribute('aria-label', 'Escucha y toca');
    nav.appendChild(prev); nav.appendChild(hint); nav.appendChild(next); nav.appendChild(sw);
    box = el('div', 'tracebox');
    box.innerHTML = '<svg viewBox="0 0 480 260" preserveAspectRatio="xMidYMid meet">' +
      '<defs><filter id="chalkglow" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="7"/></filter></defs>' +
      '<text class="glow" x="240" y="212" font-size="210" text-anchor="middle">A a</text>' +
      '<text class="dark" x="243" y="216" font-size="210" text-anchor="middle">A a</text>' +
      '<text class="lite" x="240" y="212" font-size="210" text-anchor="middle">A a</text></svg><canvas></canvas><div class="tray"></div>';
    svgText = box.querySelectorAll('text'); canvas = box.querySelector('canvas'); ctx = canvas.getContext('2d');
    var acts = el('div', 'actions');
    var clr = el('button', 'btn yellow', '🧹'), ok = el('button', 'btn green big', '✅');
    var chalks = el('div', 'chalks'); buildChalks(chalks);
    acts.appendChild(hud()); acts.appendChild(clr); acts.appendChild(ok);
    owlEl = el('div', 'owl', owlSVG(Math.min(92, Math.round(window.innerHeight * 0.12)), 'owt')); owlEl.style.left = '4px'; owlEl.style.bottom = 'auto'; owlEl.style.top = '74px';
    s.appendChild(owlEl); document.body.classList.add('jk-hide');
    s.appendChild(nav); s.appendChild(box); s.appendChild(chalks); s.appendChild(acts);
    acts.style.marginTop = '10px';
    game.appendChild(s);

    onTap(prev, function () { if (traceLock) return; KidsGame.sound.tap(); idx = (idx + tracePool().length - 1) % tracePool().length; showLetter(); });
    onTap(next, function () { if (traceLock) return; KidsGame.sound.tap(); idx = (idx + 1) % tracePool().length; showLetter(); });
    onTap(clr, function () { KidsGame.sound.pop(); strokes = []; redraw(); });
    onTap(ok, doneLetter);
    onTap(sw, function () { KidsGame.sound.tap(); startListen(); });
    onTap(hint, function () { KidsGame.sound.tap(); KidsGame.say(level === 4 ? hint.dataset.word : NAMES[tracePool()[idx]] + ', de ' + hint.dataset.word); });

    canvas.addEventListener('pointerdown', function (e) {
      e.preventDefault(); if (drawing) return;
      drawing = true; pid = e.pointerId;
      try { canvas.setPointerCapture(pid); } catch (x) {}
      cur = { c: (strokeN++ * 47) % 360, p: [pos(e)] };
      strokes.push(cur); drawSeg(cur.c, cur.p[0], cur.p[0], 0);
    });
    canvas.addEventListener('pointermove', function (e) {
      if (!drawing || e.pointerId !== pid) return; e.preventDefault();
      var p = pos(e); drawSeg(cur.c, cur.p[cur.p.length - 1], p, cur.p.length); cur.p.push(p);
    });
    function end(e) { if (!drawing || e.pointerId !== pid) return; drawing = false; pid = null; cur = null; }
    canvas.addEventListener('pointerup', end); canvas.addEventListener('pointercancel', end);

    layoutTrace(); showLetter();
  }
  function buildChalks(box) {
    box.innerHTML = ''; var n = chalksUnlocked(); if (chalkIdx >= n) chalkIdx = 0;
    CHALKS.forEach(function (ch, i) {
      var c = el('div', 'chalk' + (i === chalkIdx ? ' sel' : '') + (i >= n ? ' lock' : ''), i >= n ? '🔒' : '<i></i>');
      if (i < n) c.firstChild.style.setProperty('--c', ch.c);
      c.setAttribute('aria-label', 'Gis ' + ch.n);
      onTap(c, function () {
        if (i >= n) { KidsGame.sound.wrong(); KidsGame.toast('Completa un nivel para ganar este gis 🎁', 1600); return; }
        chalkIdx = i; KidsGame.sound.pop(); Array.prototype.forEach.call(box.children, function (x, k) { x.classList.toggle('sel', k === i); }); JK.press(c);
      });
      box.appendChild(c);
    });
  }
  // Nivel 4: se trazan palabras completas (en letra ligada), no letras sueltas
  function tracePool() { return level === 4 ? EXPERT.map(function (w) { return w[1]; }) : letterPool(); }
  // Texto del pizarrón según nivel: 1 = mayúscula, 2 = mayúscula y minúscula, 3 = minúscula, 4 = palabra en cursiva
  function traceText(L) { return level === 1 ? L : level === 2 ? L + ' ' + L.toLowerCase() : level === 3 ? L.toLowerCase() : L.toLowerCase(); }
  function pos(e) { var r = canvas.getBoundingClientRect(); return [(e.clientX - r.left) / r.width, (e.clientY - r.top) / r.height]; }
  // Crayón arcoíris: el tono avanza a lo largo del trazo; borde suave en 3 capas (halo, cuerpo, brillo)
  function drawSeg(hue, a, b, i) {
    var W = canvas.width, H = canvas.height, w = Math.max(14, Math.min(W, H) * 0.06);
    var ch = CHALKS[chalkIdx] || CHALKS[0];
    var h = ch.h != null ? ch.h : (hue + i * 2.5) % 360;
    ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    var ax = a[0] * W, ay = a[1] * H, bx = b[0] * W + 0.01, by = b[1] * H + 0.01;
    ctx.strokeStyle = 'hsla(' + h + ',95%,60%,.35)'; ctx.lineWidth = w * 1.5;
    ctx.beginPath(); ctx.moveTo(ax, ay); ctx.lineTo(bx, by); ctx.stroke();
    ctx.strokeStyle = 'hsl(' + h + ',95%,62%)'; ctx.lineWidth = w;
    ctx.beginPath(); ctx.moveTo(ax, ay); ctx.lineTo(bx, by); ctx.stroke();
    ctx.strokeStyle = 'hsla(' + h + ',100%,88%,.55)'; ctx.lineWidth = w * 0.38;
    ctx.beginPath(); ctx.moveTo(ax - w * 0.12, ay - w * 0.18); ctx.lineTo(bx - w * 0.12, by - w * 0.18); ctx.stroke();
  }
  function redraw() {
    if (!ctx) return;
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    strokes.forEach(function (s) { for (var i = 0; i < s.p.length; i++) drawSeg(s.c, s.p[Math.max(0, i - 1)], s.p[i], i); });
  }
  function layoutTrace() {
    if (!canvas) return;
    var w = box.clientWidth, h = box.clientHeight;
    if (canvas.width !== w || canvas.height !== h) { canvas.width = w; canvas.height = h; }
    redraw();
  }
  function showLetter() {
    var P = tracePool(); if (idx >= P.length) idx = 0;
    var L = P[idx], w = level === 4 ? EXPERT[idx] : (KidsGame.pick(wordsFor(L)) || ['', '']);
    var txt = traceText(L), fs = level === 1 ? 290 : level === 3 ? 250 : 210, y = level === 1 ? 232 : level === 3 ? 196 : 212;
    if (level === 4) { fs = Math.min(190, Math.floor(700 / txt.length)); y = 190; }
    Array.prototype.forEach.call(svgText, function (t, i) { t.textContent = txt; t.setAttribute('font-size', fs); t.setAttribute('y', y + (i === 1 ? 4 : 0)); t.classList.toggle('cursive', level === 4); });
    hint.innerHTML = '<span class="emoji">' + w[0] + '</span> ' + w[1];
    hint.dataset.word = w[1];
    strokes = []; redraw();
    replay(box, 'pop'); JK.banner((level === 4 ? 'Palabra ' : 'Letra ') + (idx + 1) + ' de ' + P.length);
    KidsGame.say(level === 4 ? 'Traza la palabra ' + w[1] : NAMES[L] + ', de ' + w[1]);
  }
  function doneLetter() {
    if (traceLock) return; traceLock = true;
    var P = tracePool(), L = P[idx];
    KidsGame.sound.ok(); KidsGame.addStar(); KidsGame.vibrate(30); KidsGame.confetti(25); sparks(box, '#ffe066'); KidsGame.fx.burstAt(hint, { n: 16, chars: ['⭐', '✨'] }); owlCheer();
    KidsGame.say(level === 4 ? L : NAMES[L]);
    box.classList.remove('pop'); replay(box, 'bounce');
    setTimeout(function () {
      box.classList.remove('bounce'); traceLock = false;
      if (idx === P.length - 1) {
        KidsGame.levelDone(level); unlockChalk();
        KidsGame.celebrate({ sub: level === 4 ? '¡Todas las palabras!' : '¡Todas las letras!',
          onNext: function () { idx = 0; showLetter(); }, onAgain: function () { idx = 0; showLetter(); } });
      } else { idx++; showLetter(); }
    }, 900);
  }

  window.addEventListener('resize', function () { if (mode === 'trace') layoutTrace(); });
  // Expuesto para pruebas
  window.__letras = { setLevel: function (n) { level = n; idx = 0; showMenu(); }, get level() { return level; }, get mode() { return mode; },
    get q() { return { type: qType, word: lastWord && lastWord[1], correct: correct, idx: idx, pool: tracePool().length, vow: vowTask && vowTask.blanks.slice() }; },
    get answer() { return curAnswer; }, get streak() { return JK.streak; }, chalks: chalksUnlocked };
  pickLevel();
})();
</script>
