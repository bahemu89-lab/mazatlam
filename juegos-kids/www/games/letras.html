<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<link rel="stylesheet" href="../common.css">
<title>Letras</title>
<style>
  .screen { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; padding: 8px; }
  /* Menú de modos */
  .menu { justify-content: center; gap: 26px; }
  .menu .btn { width: min(88vw, 480px); min-height: 108px; font-size: min(7vw, 34px); gap: 16px; animation: float 3.4s ease-in-out infinite; }
  .menu .btn:nth-child(2) { animation-delay: -1.7s; }
  .menu .btn .emoji { font-size: 1.5em; }
  .tools { position: absolute; top: 8px; right: 8px; z-index: 3; }
  .tools .btn { font-size: 30px; }
  /* Escucha y toca */
  .listen { justify-content: center; gap: min(2vh, 14px); }
  /* Medallón brillante para la imagen protagonista */
  .medal {
    position: relative; width: min(30vh, 40vw, 230px); height: min(30vh, 40vw, 230px); border-radius: 50%;
    display: flex; align-items: center; justify-content: center; cursor: pointer;
    background: radial-gradient(circle at 35% 28%, #ffffff 0%, #fff6d0 32%, #ffd166 70%, #f5a623 100%);
    box-shadow: 0 10px 0 #c97d0b, 0 18px 28px rgba(90,50,0,.3), inset 0 4px 0 rgba(255,255,255,.9), inset 0 -8px 0 rgba(180,110,0,.25), 0 0 0 7px #fff, 0 0 0 11px rgba(255,209,102,.6);
    animation: float 3.6s ease-in-out infinite;
  }
  .medal::before { content: ""; position: absolute; left: 12%; right: 12%; top: 6%; height: 34%; border-radius: 50%; background: linear-gradient(180deg, rgba(255,255,255,.85), rgba(255,255,255,0)); pointer-events: none; }
  .medal::after { content: ""; position: absolute; inset: 0; border-radius: 50%; background: radial-gradient(circle at 50% 88%, rgba(255,255,255,.35), rgba(255,255,255,0) 40%); pointer-events: none; }
  .pic { font-size: min(19vh, 25vw, 145px); filter: drop-shadow(0 8px 6px rgba(90,50,0,.35)); }
  .word { font-size: min(8vh, 10vw, 60px); font-weight: 900; letter-spacing: 1px; white-space: nowrap; color: #fff; text-shadow: 0 3px 0 #1f7fae, 0 6px 10px rgba(0,0,0,.3), -2px -2px 0 #1f7fae, 2px -2px 0 #1f7fae, -2px 2px 0 #1f7fae, 2px 2px 0 #1f7fae; }
  .word b { color: #ffd166; font-size: 1.35em; margin-right: 2px; text-shadow: 0 3px 0 #c97d0b, 0 6px 10px rgba(0,0,0,.3), -2px -2px 0 #c97d0b, 2px -2px 0 #c97d0b, -2px 2px 0 #c97d0b, 2px 2px 0 #c97d0b; }
  .choices { display: flex; gap: min(3vw, 22px); justify-content: center; margin-top: 10px; }
  /* Bloques de abecedario: plástico grueso con bisel, luz arriba-izquierda y sombra */
  .choices .block {
    --a: #ffd0e4; --b: #f582ae; --d: #b8306f;
    position: relative; width: min(27vw, 24vh, 160px); height: min(27vw, 24vh, 160px); border-radius: 22px;
    display: flex; align-items: center; justify-content: center; cursor: pointer;
    font-size: min(15vw, 13vh, 92px); font-weight: 900; color: #fff;
    background: linear-gradient(135deg, var(--a) 0%, var(--b) 55%, var(--d) 130%);
    box-shadow: 0 9px 0 var(--d), 0 16px 22px rgba(20,40,90,.28), inset 0 3px 0 rgba(255,255,255,.7), inset 3px 0 0 rgba(255,255,255,.35), inset 0 -4px 0 rgba(0,0,0,.15), inset -3px 0 0 rgba(0,0,0,.08);
    text-shadow: 0 3px 0 var(--d), 0 6px 8px rgba(0,0,0,.3), -1px -1px 0 rgba(0,0,0,.15);
    transition: transform .12s, box-shadow .12s; animation: pop .35s ease-out backwards, float 3.2s ease-in-out infinite;
  }
  .choices .block::before { content: ""; position: absolute; left: 10%; right: 10%; top: 6%; height: 34%; border-radius: 16px 16px 40% 40%; background: linear-gradient(180deg, rgba(255,255,255,.6), rgba(255,255,255,0)); pointer-events: none; }
  .choices .block::after { content: ""; position: absolute; inset: 10%; border-radius: 14px; border: 3px solid rgba(255,255,255,.35); box-shadow: inset 0 2px 4px rgba(0,0,0,.12); pointer-events: none; }
  .choices .block:active { transform: scale(.94) translateY(5px); box-shadow: 0 3px 0 var(--d), 0 6px 10px rgba(20,40,90,.25), inset 0 3px 0 rgba(255,255,255,.6); animation: none; }
  .choices .block.ok { --a: #c6ffd9; --b: #2fd27a; --d: #148a4d; animation: bounce .6s; box-shadow: 0 9px 0 var(--d), 0 16px 22px rgba(20,120,60,.3), 0 0 0 6px rgba(120,255,170,.55), 0 0 30px rgba(120,255,170,.8), inset 0 3px 0 rgba(255,255,255,.7); }
  .choices .block.bad { animation: shake .35s; }
  /* Chispas al acertar */
  .spark { position: fixed; width: 14px; height: 14px; border-radius: 50%; pointer-events: none; z-index: 30; background: radial-gradient(circle, #fff 0 30%, var(--c) 32% 60%, rgba(255,255,255,0) 62%); box-shadow: 0 0 8px var(--c); animation: sparkfly .7s ease-out forwards; }
  @keyframes sparkfly { 0% { transform: translate(0,0) scale(1); opacity: 1; } 100% { transform: translate(var(--dx), var(--dy)) scale(.2); opacity: 0; } }
  /* Traza la letra: pizarrón con marco de madera */
  .trace { gap: 8px; }
  .nav { display: flex; align-items: center; justify-content: center; gap: 12px; width: 100%; flex: 0 0 auto; }
  .hint { flex: 0 1 auto; min-width: 120px; text-align: center; font-size: min(5vw, 30px); font-weight: 900; color: #1f2f6b; border-radius: 30px; padding: 8px 20px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; cursor: pointer;
    background: linear-gradient(180deg, #ffffff, #eef2fb); border: 3px solid #fff; box-shadow: 0 5px 0 #c9d2e6, 0 10px 16px rgba(20,40,90,.2), inset 0 2px 0 #fff; text-shadow: 0 1px 0 #fff; }
  .hint .emoji { font-size: 1.3em; }
  .tracebox {
    position: relative; flex: 1 1 auto; width: 100%; max-width: 960px; min-height: 120px; border-radius: 18px;
    background: radial-gradient(ellipse at 30% 20%, #3f8a6a 0%, #2f6f55 45%, #245c45 100%);
    border: 14px solid transparent;
    box-shadow: 0 12px 0 #6b3d12, 0 22px 30px rgba(60,30,0,.35), inset 0 0 0 3px rgba(0,0,0,.25), inset 0 6px 18px rgba(0,0,0,.35), inset 0 -2px 0 rgba(255,255,255,.08);
    background-clip: padding-box;
  }
  .tracebox::before { content: ""; position: absolute; inset: -14px; z-index: -1; border-radius: 18px;
    background: linear-gradient(180deg, #d59a52 0%, #b8763a 30%, #a3652e 70%, #8b5222 100%);
    background-image: repeating-linear-gradient(90deg, rgba(255,255,255,.08) 0 6px, rgba(0,0,0,0) 6px 22px), linear-gradient(180deg, #d59a52 0%, #b8763a 30%, #a3652e 70%, #8b5222 100%);
    box-shadow: inset 0 3px 0 rgba(255,235,200,.5), inset 0 -4px 0 rgba(0,0,0,.25); }
  .tracebox::after { content: ""; position: absolute; left: 0; right: 0; top: 0; height: 40%; border-radius: 6px; pointer-events: none;
    background: linear-gradient(180deg, rgba(255,255,255,.1), rgba(255,255,255,0)); }
  .tracebox svg { position: absolute; inset: 0; width: 100%; height: 100%; }
  .tracebox .glow { font-family: inherit; font-weight: 900; font-size: 210px; fill: none; stroke: rgba(255,255,255,.35); stroke-width: 14; stroke-linejoin: round; filter: url(#chalkglow); }
  .tracebox .dark { font-family: inherit; font-weight: 900; font-size: 210px; fill: rgba(0,0,0,.22); stroke: rgba(0,0,0,.35); stroke-width: 6; stroke-linejoin: round; }
  .tracebox .lite { font-family: inherit; font-weight: 900; font-size: 210px; fill: rgba(255,255,255,.1); stroke: rgba(255,255,255,.85); stroke-width: 5; stroke-dasharray: 14 10; stroke-linejoin: round; stroke-linecap: round; }
  .tracebox canvas { position: absolute; inset: 0; width: 100%; height: 100%; touch-action: none; cursor: crosshair; border-radius: 6px; }
  .tray { position: absolute; left: 8%; right: 8%; bottom: -26px; height: 16px; border-radius: 0 0 8px 8px; background: linear-gradient(180deg, #c98b48, #8b5222); box-shadow: 0 5px 0 #5c3510, 0 10px 12px rgba(0,0,0,.3), inset 0 2px 0 rgba(255,255,255,.35); pointer-events: none; }
  .tray::before, .tray::after { content: ""; position: absolute; top: -8px; width: 54px; height: 10px; border-radius: 5px; background: linear-gradient(180deg, #fff, #dcdcdc); box-shadow: 0 2px 3px rgba(0,0,0,.35); }
  .tray::before { left: 6%; } .tray::after { right: 8%; width: 44px; background: linear-gradient(180deg, #ffd6e8, #f582ae); }
  .actions { display: flex; gap: 22px; flex: 0 0 auto; margin-top: 18px; }
  .actions .btn { font-size: 36px; min-width: 90px; }
</style>
</head>
<body>
<script src="../common.js"></script>
<script>
(function () {
  var game = KidsGame.init({ title: 'Letras' });

  var WORDS = [
    ['🍎','Manzana'],['🐶','Perro'],['🐘','Elefante'],['🌸','Flor'],['🏠','Casa'],['🦁','León'],['🍌','Plátano'],
    ['🐢','Tortuga'],['🌈','Arcoíris'],['🚗','Coche'],['🦋','Mariposa'],['🧀','Queso'],['🐭','Ratón'],['🌞','Sol'],
    ['🐝','Abeja'],['🥚','Huevo'],['🍇','Uvas'],['🦓','Cebra'],['🐟','Pez'],['🍦','Helado'],['🥝','Kiwi'],['🧸','Oso'],
    ['🪁','Papalote'],['🍊','Naranja'],['🦖','Dinosaurio'],['🧃','Jugo'],['🚌','Autobús'],['🐸','Rana'],['🎈','Globo'],
    ['🍓','Fresa'],['🧁','Pastel'],['🐧','Pingüino'],['🐨','Koala'],['🍋','Limón'],['🍉','Sandía'],['🌮','Taco'],
    ['🐴','Yegua'],['🦊','Zorro'],['🍩','Dona'],['🐑','Oveja'],['🐮','Vaca'],['🍄','Hongo'],['🍍','Piña'],
    ['🥕','Zanahoria'],['🌻','Girasol'],['🐙','Pulpo'],['🥛','Leche'],['🎸','Guitarra'],['🦆','Pato'],['🎁','Regalo'],
    ['🐞','Catarina'],['🥑','Aguacate'],['🍞','Pan'],['🐒','Mono'],['🐼','Panda'],['🧩','Rompecabezas'],
    ['🐦','Ñandú'],['🚲','Bicicleta'],['🐋','Ballena'],['🏝️','Isla'],['🧲','Imán'],['🦒','Jirafa'],['🦄','Unicornio'],
    ['🧇','Wafle'],['🎵','Xilófono'],['⛵','Yate'],['👟','Zapato'],['🦉','Búho'],['🐬','Delfín'],
    ['🍬','Dulce'],['🌙','Luna'],['🎹','Órgano'],['⭐','Estrella'],['🦎','Iguana'],['🍅','Jitomate'],
    ['🥥','Coco'],['🦘','Canguro'],['🌵','Nopal'],['🐺','Lobo'],['🧦','Calcetín']
  ];
  var ALPHA = 'ABCDEFGHIJKLMNÑOPQRSTUVWXYZ'.split('');
  var NAMES = { A:'a', B:'be', C:'ce', D:'de', E:'e', F:'efe', G:'ge', H:'hache', I:'i', J:'jota', K:'ka', L:'ele',
    M:'eme', N:'ene', 'Ñ':'eñe', O:'o', P:'pe', Q:'cu', R:'erre', S:'ese', T:'te', U:'u', V:'uve', W:'doble u',
    X:'equis', Y:'i griega', Z:'zeta' };
  var COLORS = ['#f582ae', '#3da9fc', '#2cb67d', '#ffb703', '#7f5af0', '#ff8906'];
  // Paletas de los bloques: [claro, medio, oscuro]
  var BLOCKS = [['#ffd0e4','#f582ae','#b8306f'], ['#bfe6ff','#3da9fc','#1a63a8'], ['#c6ffd9','#2cb67d','#14784a'],
    ['#ffe98a','#ffb703','#c47f00'], ['#d6c8ff','#7f5af0','#5232b3'], ['#ffd2a6','#ff8906','#b85a00']];
  // Chispas que salen del centro de un elemento (máx. 14)
  function sparks(node, color) {
    var r = node.getBoundingClientRect(), cx = r.left + r.width / 2, cy = r.top + r.height / 2;
    for (var i = 0; i < 14; i++) {
      var d = document.createElement('div'); d.className = 'spark';
      var ang = (i / 14) * Math.PI * 2, dist = 70 + Math.random() * 70;
      d.style.left = (cx - 7) + 'px'; d.style.top = (cy - 7) + 'px';
      d.style.setProperty('--c', color || COLORS[i % COLORS.length]);
      d.style.setProperty('--dx', Math.cos(ang) * dist + 'px'); d.style.setProperty('--dy', Math.sin(ang) * dist - 30 + 'px');
      d.style.animationDelay = (Math.random() * 90) + 'ms';
      document.body.appendChild(d);
      (function (el) { setTimeout(function () { el.remove(); }, 900); })(d);
    }
  }

  function el(tag, cls, html) { var e = document.createElement(tag); if (cls) e.className = cls; if (html != null) e.innerHTML = html; return e; }
  function onTap(e, fn) { e.addEventListener('pointerdown', function (ev) { ev.preventDefault(); fn(ev); }); }
  function letterOf(w) { return w[1].charAt(0).toUpperCase(); }
  function wordsFor(L) { return WORDS.filter(function (w) { return letterOf(w) === L; }); }
  function replay(node, cls) { node.classList.remove(cls); void node.offsetWidth; node.classList.add(cls); }
  // Comprobación (usada por pruebas): letras sin palabra
  window.__letrasCheck = function () { return ALPHA.filter(function (L) { return wordsFor(L).length === 0; }); };

  var mode = '';

  /* ---------- Menú ---------- */
  function showMenu() {
    mode = 'menu'; game.innerHTML = '';
    var m = el('div', 'screen menu');
    var b1 = el('button', 'btn big', '<span class="emoji">🔊</span> Escucha y toca');
    var b2 = el('button', 'btn big purple', '<span class="emoji">🔤</span> Traza la letra');
    onTap(b1, function () { KidsGame.sound.tap(); startListen(); });
    onTap(b2, function () { KidsGame.sound.tap(); startTrace(); });
    m.appendChild(b1); m.appendChild(b2); game.appendChild(m);
    KidsGame.say('Letras. Elige un juego');
  }

  /* ---------- Modo 1: Escucha y toca ---------- */
  var pic, word, choices, lastWord = null, correct = 0, lock = false;
  function startListen() {
    mode = 'listen'; game.innerHTML = '';
    var s = el('div', 'screen listen');
    var tools = el('div', 'tools');
    var sw = el('button', 'btn round purple', '🔤'); sw.setAttribute('aria-label', 'Traza la letra');
    onTap(sw, function () { KidsGame.sound.tap(); startTrace(); });
    tools.appendChild(sw);
    var medal = el('div', 'medal');
    pic = el('div', 'pic emoji'); word = el('div', 'word'); choices = el('div', 'choices');
    medal.appendChild(pic);
    onTap(medal, function () { if (lastWord) { KidsGame.sound.tap(); KidsGame.say(lastWord[1]); replay(pic, 'pop'); } });
    s.appendChild(tools); s.appendChild(medal); s.appendChild(word); s.appendChild(choices);
    game.appendChild(s);
    nextListen();
  }
  function nextListen() {
    var w; do { w = KidsGame.pick(WORDS); } while (w === lastWord);
    lastWord = w;
    var L = letterOf(w);
    pic.textContent = w[0]; replay(pic, 'pop');
    word.innerHTML = '<b>' + L + '</b>' + w[1].slice(1);
    var others = KidsGame.shuffle(ALPHA.filter(function (l) { return l !== L; })).slice(0, 2);
    var opts = KidsGame.shuffle([L].concat(others));
    choices.innerHTML = '';
    var pal = KidsGame.shuffle(BLOCKS);
    opts.forEach(function (l, i) {
      var c = el('div', 'block'); c.textContent = l; c.style.animationDelay = (i * 80) + 'ms, ' + (-i * 1.1) + 's';
      c.style.setProperty('--a', pal[i][0]); c.style.setProperty('--b', pal[i][1]); c.style.setProperty('--d', pal[i][2]);
      onTap(c, function () { pickLetter(c, l, L); });
      choices.appendChild(c);
    });
    lock = false;
    KidsGame.say(w[1]);
  }
  function pickLetter(c, l, L) {
    if (lock) return;
    if (l === L) {
      lock = true; c.classList.add('ok'); sparks(c, '#7dffb0');
      KidsGame.sound.ok(); KidsGame.addStar(); KidsGame.vibrate(30);
      replay(pic, 'bounce'); correct++;
      KidsGame.say(NAMES[L] + ' de ' + lastWord[1]);
      setTimeout(function () {
        pic.classList.remove('bounce');
        if (correct % 8 === 0) {
          KidsGame.celebrate({ sub: '¡' + correct + ' palabras!', onNext: nextListen, onAgain: nextListen });
        } else nextListen();
      }, 1000);
    } else {
      KidsGame.sound.wrong(); replay(c, 'bad');
    }
  }

  /* ---------- Modo 2: Traza la letra ---------- */
  var idx = 0, strokes = [], canvas, ctx, box, svgText, hint, traceLock = false, strokeN = 0;
  var drawing = false, pid = null, cur = null;
  function startTrace() {
    mode = 'trace'; game.innerHTML = '';
    var s = el('div', 'screen trace');
    var nav = el('div', 'nav');
    var prev = el('button', 'btn round blue prev', '◀'), next = el('button', 'btn round blue next', '▶');
    hint = el('div', 'hint');
    var sw = el('button', 'btn round', '🔊'); sw.setAttribute('aria-label', 'Escucha y toca');
    nav.appendChild(prev); nav.appendChild(hint); nav.appendChild(next); nav.appendChild(sw);
    box = el('div', 'tracebox');
    box.innerHTML = '<svg viewBox="0 0 480 260" preserveAspectRatio="xMidYMid meet">' +
      '<defs><filter id="chalkglow" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="6"/></filter></defs>' +
      '<text class="glow" x="240" y="212" text-anchor="middle">A a</text>' +
      '<text class="dark" x="243" y="216" text-anchor="middle">A a</text>' +
      '<text class="lite" x="240" y="212" text-anchor="middle">A a</text></svg><canvas></canvas><div class="tray"></div>';
    svgText = box.querySelectorAll('text'); canvas = box.querySelector('canvas'); ctx = canvas.getContext('2d');
    var acts = el('div', 'actions');
    var clr = el('button', 'btn yellow', '🧹'), ok = el('button', 'btn green big', '✅');
    acts.appendChild(clr); acts.appendChild(ok);
    s.appendChild(nav); s.appendChild(box); s.appendChild(acts);
    game.appendChild(s);

    onTap(prev, function () { if (traceLock) return; KidsGame.sound.tap(); idx = (idx + ALPHA.length - 1) % ALPHA.length; showLetter(); });
    onTap(next, function () { if (traceLock) return; KidsGame.sound.tap(); idx = (idx + 1) % ALPHA.length; showLetter(); });
    onTap(clr, function () { KidsGame.sound.pop(); strokes = []; redraw(); });
    onTap(ok, doneLetter);
    onTap(sw, function () { KidsGame.sound.tap(); startListen(); });
    onTap(hint, function () { KidsGame.sound.tap(); KidsGame.say(NAMES[ALPHA[idx]] + ', de ' + hint.dataset.word); });

    canvas.addEventListener('pointerdown', function (e) {
      e.preventDefault(); if (drawing) return;
      drawing = true; pid = e.pointerId;
      try { canvas.setPointerCapture(pid); } catch (x) {}
      cur = { c: (strokeN++ * 47) % 360, p: [pos(e)] };
      strokes.push(cur); drawSeg(cur.c, cur.p[0], cur.p[0], 0);
    });
    canvas.addEventListener('pointermove', function (e) {
      if (!drawing || e.pointerId !== pid) return; e.preventDefault();
      var p = pos(e); drawSeg(cur.c, cur.p[cur.p.length - 1], p, cur.p.length); cur.p.push(p);
    });
    function end(e) { if (!drawing || e.pointerId !== pid) return; drawing = false; pid = null; cur = null; }
    canvas.addEventListener('pointerup', end); canvas.addEventListener('pointercancel', end);

    layoutTrace(); showLetter();
  }
  function pos(e) { var r = canvas.getBoundingClientRect(); return [(e.clientX - r.left) / r.width, (e.clientY - r.top) / r.height]; }
  // Crayón arcoíris: el tono avanza a lo largo del trazo; borde suave en 3 capas (halo, cuerpo, brillo)
  function drawSeg(hue, a, b, i) {
    var W = canvas.width, H = canvas.height, w = Math.max(14, Math.min(W, H) * 0.06);
    var h = (hue + i * 2.5) % 360;
    ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    var ax = a[0] * W, ay = a[1] * H, bx = b[0] * W + 0.01, by = b[1] * H + 0.01;
    ctx.strokeStyle = 'hsla(' + h + ',95%,60%,.35)'; ctx.lineWidth = w * 1.5;
    ctx.beginPath(); ctx.moveTo(ax, ay); ctx.lineTo(bx, by); ctx.stroke();
    ctx.strokeStyle = 'hsl(' + h + ',95%,62%)'; ctx.lineWidth = w;
    ctx.beginPath(); ctx.moveTo(ax, ay); ctx.lineTo(bx, by); ctx.stroke();
    ctx.strokeStyle = 'hsla(' + h + ',100%,88%,.55)'; ctx.lineWidth = w * 0.38;
    ctx.beginPath(); ctx.moveTo(ax - w * 0.12, ay - w * 0.18); ctx.lineTo(bx - w * 0.12, by - w * 0.18); ctx.stroke();
  }
  function redraw() {
    if (!ctx) return;
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    strokes.forEach(function (s) { for (var i = 0; i < s.p.length; i++) drawSeg(s.c, s.p[Math.max(0, i - 1)], s.p[i], i); });
  }
  function layoutTrace() {
    if (!canvas) return;
    var w = box.clientWidth, h = box.clientHeight;
    if (canvas.width !== w || canvas.height !== h) { canvas.width = w; canvas.height = h; }
    redraw();
  }
  function showLetter() {
    var L = ALPHA[idx], w = KidsGame.pick(wordsFor(L)) || ['', ''];
    Array.prototype.forEach.call(svgText, function (t) { t.textContent = L + ' ' + L.toLowerCase(); });
    hint.innerHTML = '<span class="emoji">' + w[0] + '</span> ' + w[1];
    hint.dataset.word = w[1];
    strokes = []; redraw();
    replay(box, 'pop');
    KidsGame.say(NAMES[L] + ', de ' + w[1]);
  }
  function doneLetter() {
    if (traceLock) return; traceLock = true;
    var L = ALPHA[idx];
    KidsGame.sound.ok(); KidsGame.addStar(); KidsGame.vibrate(30); KidsGame.confetti(25); sparks(box, '#ffe066');
    KidsGame.say(NAMES[L]);
    box.classList.remove('pop'); replay(box, 'bounce');
    setTimeout(function () {
      box.classList.remove('bounce'); traceLock = false;
      if (idx === ALPHA.length - 1) {
        KidsGame.celebrate({ sub: '¡Todas las letras!',
          onNext: function () { idx = 0; showLetter(); }, onAgain: function () { idx = 0; showLetter(); } });
      } else { idx++; showLetter(); }
    }, 900);
  }

  window.addEventListener('resize', function () { if (mode === 'trace') layoutTrace(); });
  showMenu();
})();
</script>
</body>
</html>
