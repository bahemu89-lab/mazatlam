<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<link rel="stylesheet" href="../common.css">
<title>Simón dice colores</title>
<style>
  /* Cielo nocturno: degradado azul profundo, estrellas que titilan y luna */
  .game {
    display: flex; flex-direction: column; align-items: center;
    background:
      radial-gradient(circle at 86% 12%, #fff9d8 0 22px, rgba(255,249,216,.45) 30px, rgba(255,249,216,0) 78px),
      radial-gradient(ellipse 90% 55% at 50% 112%, #2a4aa8 0, rgba(42,74,168,0) 65%),
      linear-gradient(180deg, #070f33 0%, #0f1d5e 55%, #1a2f7e 100%);
  }
  .game::before, .game::after {
    content: ""; position: absolute; inset: 0; pointer-events: none; z-index: 0;
    background-image:
      radial-gradient(1.6px 1.6px at 22px 34px, #fff 60%, rgba(255,255,255,0) 62%),
      radial-gradient(1.2px 1.2px at 88px 96px, rgba(255,255,255,.85) 60%, rgba(255,255,255,0) 62%),
      radial-gradient(1px 1px at 150px 26px, rgba(255,255,255,.7) 60%, rgba(255,255,255,0) 62%),
      radial-gradient(2px 2px at 190px 140px, #fff 60%, rgba(255,255,255,0) 62%),
      radial-gradient(1.3px 1.3px at 60px 170px, rgba(255,255,255,.8) 60%, rgba(255,255,255,0) 62%);
    background-size: 230px 200px;
    animation: twinkle 3.2s ease-in-out infinite alternate;
  }
  .game::after { background-position: 110px 70px; background-size: 290px 240px; animation-delay: -1.7s; opacity: .8; }
  @keyframes twinkle { 0% { opacity: .45 } 100% { opacity: 1 } }
  .status {
    flex: 0 0 auto; display: flex; align-items: center; justify-content: center; gap: 12px; flex-wrap: wrap;
    padding: 10px 12px 6px; font-size: 30px; min-height: 64px; width: 100%; position: relative; z-index: 2;
  }
  .status .ind {
    background: linear-gradient(180deg, #ffffff, #e8eefc); border: 3px solid #fff; border-radius: 30px; padding: 6px 22px;
    color: #1f2f6b; font-weight: 900; text-shadow: 0 1px 0 #fff;
    box-shadow: 0 5px 0 #b9c4dc, 0 10px 18px rgba(0,0,0,.45), inset 0 2px 0 #fff; transition: background .2s, box-shadow .2s;
  }
  .status .ind.watch { background: linear-gradient(180deg, #fff6c2, #ffd23f); color: #7a4b00; box-shadow: 0 5px 0 #c99a00, 0 10px 18px rgba(0,0,0,.45), 0 0 22px rgba(255,210,63,.55), inset 0 2px 0 #fff; }
  .status .ind.you { background: linear-gradient(180deg, #e2ffe9, #7be495); color: #14603a; box-shadow: 0 5px 0 #2e9c55, 0 10px 18px rgba(0,0,0,.45), 0 0 22px rgba(123,228,149,.55), inset 0 2px 0 #fff; }
  .status .hud { display: flex; align-items: center; gap: 8px; }
  .status .kg-level-badge { font-size: 18px; padding: 6px 14px; white-space: nowrap; }
  .status .lvbtn { width: 56px; height: 56px; min-width: 56px; min-height: 56px; padding: 0; font-size: 26px; }
  .dots { display: flex; gap: 7px; flex-wrap: wrap; justify-content: center; }
  .dot { width: 18px; height: 18px; border-radius: 50%; background: radial-gradient(circle at 35% 30%, #ffffff, #cbd5e5 55%, #8593ad); box-shadow: 0 2px 3px rgba(0,0,0,.55), inset 0 -2px 3px rgba(0,0,0,.2); transition: transform .15s, background .15s; }
  .dot.on { background: radial-gradient(circle at 35% 30%, #fff6c8, #ffc21a 55%, #c47f00); box-shadow: 0 0 10px rgba(255,213,74,.9), 0 2px 3px rgba(0,0,0,.5); transform: scale(1.2); }
  .dot.big { background: radial-gradient(circle at 35% 30%, #d9ffe4, #2cb67d 55%, #14784a); }
  .stage { flex: 1 1 auto; min-height: 0; width: 100%; display: flex; align-items: center; justify-content: center; padding: 8px; position: relative; z-index: 1; }
  /* Placa oscura con aro dorado detrás de las 4 gemas + medallón central */
  .grid {
    display: grid; grid-template-columns: 1fr 1fr; grid-template-rows: 1fr 1fr; gap: min(3vw, 18px);
    width: 300px; height: 300px; position: relative; z-index: 0;
  }
  .grid::before {
    content: ""; position: absolute; inset: -6%; border-radius: 15%; z-index: -1;
    background: radial-gradient(circle at 50% 35%, #2c3f8f 0, #16225c 55%, #0b1240 100%);
    box-shadow: 0 0 0 6px #f6d77a, 0 0 0 10px #a8801f, 0 16px 0 #050a2a, 0 30px 44px rgba(0,0,0,.65), inset 0 4px 10px rgba(255,255,255,.18), inset 0 -10px 18px rgba(0,0,0,.45);
  }
  .medal {
    position: absolute; left: 50%; top: 50%; width: 22%; height: 22%; transform: translate(-50%,-50%); border-radius: 50%; z-index: 3; pointer-events: none;
    background: radial-gradient(circle at 35% 30%, #fff9dc 0, #ffd54a 42%, #dc9a10 80%, #b57708 100%);
    box-shadow: 0 0 0 4px #fff2b8, 0 0 0 7px #a8801f, 0 6px 0 #7f5809, 0 12px 20px rgba(0,0,0,.55), inset 0 -6px 10px rgba(120,70,0,.3), inset 0 3px 0 rgba(255,255,255,.8);
    display: flex; align-items: center; justify-content: center; font-size: 30px; font-size: min(7vmin, 40px);
    animation: medal 3s ease-in-out infinite;
  }
  @keyframes medal { 0%,100% { transform: translate(-50%,-50%) scale(1) } 50% { transform: translate(-50%,-50%) scale(1.06) } }
  .pad {
    --c: #ff4d4d; --d: #8f1f1f; --g: rgba(255,77,77,.85);
    border-radius: 26px; border: 4px solid rgba(0,0,0,.38); position: relative; overflow: hidden;
    background:
      radial-gradient(circle at 32% 26%, rgba(255,255,255,.62) 0, rgba(255,255,255,.2) 22%, rgba(255,255,255,0) 48%),
      linear-gradient(160deg, rgba(255,255,255,.2), rgba(0,0,0,0) 45%, rgba(0,0,0,.3) 100%),
      var(--c);
    box-shadow: 0 9px 0 var(--d), 0 18px 26px rgba(0,0,0,.6), inset 0 3px 0 rgba(255,255,255,.5), inset 0 -10px 16px rgba(0,0,0,.3);
    display: flex; align-items: center; justify-content: center; cursor: pointer; min-width: 64px; min-height: 64px;
    filter: brightness(.82) saturate(.92); transition: transform .1s, filter .1s, box-shadow .1s, background-color .2s; touch-action: none;
  }
  .pad::after { content: ""; position: absolute; left: 8%; right: 8%; top: 4%; height: 38%; border-radius: 22px; pointer-events: none; background: linear-gradient(180deg, rgba(255,255,255,.45), rgba(255,255,255,0)); }
  .pad .emoji { font-size: 80px; font-size: min(18vw, 110px, 16vh); pointer-events: none; animation: float 3.4s ease-in-out infinite; transition: opacity .25s; }
  .pad:nth-child(2) .emoji { animation-delay: -.9s; } .pad:nth-child(3) .emoji { animation-delay: -1.8s; } .pad:nth-child(4) .emoji { animation-delay: -2.6s; }
  .pad.lit { filter: brightness(1.28) saturate(1.25); transform: scale(1.06); box-shadow: 0 0 0 5px #fff, 0 0 44px 12px var(--g), 0 9px 0 var(--d), 0 18px 26px rgba(0,0,0,.6), inset 0 3px 0 rgba(255,255,255,.7); z-index: 2; }
  .pad.bad { animation: shake .35s; filter: brightness(.6); }
  .pads-off .pad { cursor: default; }
  .pads-off .pad:not(.lit) { opacity: .92; }
  .pad.r { --c: #ff4d4d; --d: #8f1f1f; --g: rgba(255,90,90,.9); }
  .pad.g { --c: #2cb67d; --d: #135e3f; --g: rgba(70,220,150,.9); }
  .pad.b { --c: #3da9fc; --d: #1a5a9c; --g: rgba(90,180,255,.9); }
  .pad.y { --c: #ffd23f; --d: #9c7300; --g: rgba(255,220,90,.9); }
  /* Nivel 3: mientras ella juega, las gemas se apagan (solo cuenta la posición) */
  .blind .pad:not(.lit) { --c: #6b7594; --d: #353c52; }
  .blind .pad:not(.lit) .emoji { opacity: 0; }
  .blind .pad:not(.lit)::before { content: "?"; position: absolute; left: 50%; top: 50%; transform: translate(-50%,-50%); font-size: min(14vw, 90px, 13vh); font-weight: 900; color: rgba(255,255,255,.45); text-shadow: 0 2px 0 rgba(0,0,0,.25); }
  /* Chispas al acertar */
  .sp { position: absolute; pointer-events: none; font-size: 26px; line-height: 1; z-index: 20; transform: translate(-50%,-50%); text-shadow: 0 0 8px #fff, 0 2px 3px rgba(0,0,0,.3); animation: spfly .7s ease-out forwards; }
  @keyframes spfly { 0%{ transform: translate(-50%,-50%) scale(.3) rotate(0deg); opacity: 1 } 100%{ transform: translate(calc(-50% + var(--dx)), calc(-50% + var(--dy))) scale(1.3) rotate(160deg); opacity: 0 } }
  @keyframes wig { 0%,100%{transform:rotate(0)} 25%{transform:rotate(-6deg)} 75%{transform:rotate(6deg)} }
  .stage.wiggle .grid { animation: wig .35s; }
</style>
</head>
<body>
<div class="game">
  <div class="status"><div class="ind" id="ind">👀 Mira</div><div class="dots" id="dots"></div><div class="hud" id="hud"></div></div>
  <div class="stage" id="stage"><div class="grid" id="grid"><div class="medal"><span class="emoji">⭐</span></div></div></div>
</div>
<script src="../common.js"></script>
<script>
var game = KidsGame.init({ title: 'Simón dice colores' });

var PADS = [
  { cls: 'r', emoji: '🐞', freq: 329.63, name: 'rojo' },
  { cls: 'g', emoji: '🐸', freq: 261.63, name: 'verde' },
  { cls: 'b', emoji: '🐟', freq: 220.00, name: 'azul' },
  { cls: 'y', emoji: '🐥', freq: 164.81, name: 'amarillo' }
];
// Niveles: largo inicial, meta intermedia, máximo, velocidad base y si se ocultan los colores al jugar
var DIFF = {
  1: { start: 1, goal: 3, max: 5,  base: 700, min: 420, blind: false },
  2: { start: 2, goal: 5, max: 8,  base: 600, min: 360, blind: false },
  3: { start: 3, goal: 6, max: 12, base: 520, min: 300, blind: true }
};
var nivel = 1, cfg = DIFF[1];
var MAX = cfg.max, GOAL = cfg.goal;
var grid = document.getElementById('grid'), ind = document.getElementById('ind'), dots = document.getElementById('dots'), stage = document.getElementById('stage'), hud = document.getElementById('hud');
var medal = grid.querySelector('.medal');
var pads = [];
PADS.forEach(function (p, i) {
  var d = document.createElement('div');
  d.className = 'pad ' + p.cls; d.innerHTML = '<span class="emoji">' + p.emoji + '</span>';
  d.setAttribute('data-i', i);
  d.addEventListener('pointerdown', function (e) { e.preventDefault(); onPad(i); });
  grid.insertBefore(d, medal); pads.push(d);
});

function fit() {
  var side = Math.max(200, Math.min(stage.clientWidth - 16, stage.clientHeight - 16, 640));
  side = Math.round(side * 0.88); // deja sitio a la placa con aro dorado
  grid.style.width = side + 'px'; grid.style.height = side + 'px';
}
window.addEventListener('resize', function () { setTimeout(fit, 50); });
fit();

function burst(el, n) {
  if (stage.querySelectorAll('.sp').length > 32) return;
  var r = el.getBoundingClientRect(), sr = stage.getBoundingClientRect();
  var x = r.left + r.width / 2 - sr.left, y = r.top + r.height / 2 - sr.top;
  var colors = ['#fff', '#ffe14d', '#ff7eb6', '#7be495', '#7dd0ff'];
  for (var k = 0; k < (n || 8); k++) {
    var s = document.createElement('span'); s.className = 'sp'; s.textContent = k % 2 ? '✦' : '★';
    var a = Math.random() * Math.PI * 2, d = 40 + Math.random() * 70;
    s.style.left = x + 'px'; s.style.top = y + 'px'; s.style.color = colors[k % colors.length];
    s.style.setProperty('--dx', Math.cos(a) * d + 'px'); s.style.setProperty('--dy', Math.sin(a) * d + 'px');
    s.style.animationDuration = (.5 + Math.random() * .35) + 's';
    stage.appendChild(s);
    (function (e) { setTimeout(function () { e.remove(); }, 1000); })(s);
  }
}

var seq = [], turn = 'idle', pos = 0, mistakes = 0, timers = [], litTimer = {};
function later(fn, ms) { timers.push(setTimeout(fn, ms)); }
function clearTimers() { timers.forEach(clearTimeout); timers = []; }

function light(i, ms) {
  var p = pads[i];
  clearTimeout(litTimer[i]); p.classList.remove('lit'); void p.offsetWidth; p.classList.add('lit');
  KidsGame.sound.note(PADS[i].freq);
  litTimer[i] = setTimeout(function () { p.classList.remove('lit'); }, ms || 350);
}
function setInd(state) {
  ind.className = 'ind ' + state;
  ind.textContent = state === 'watch' ? '👀 Mira' : (state === 'you' ? '👆 Tu turno' : '🌟');
}
function setBlind(on) { grid.classList.toggle('blind', !!(cfg.blind && on)); }
function drawDots() {
  dots.innerHTML = '';
  for (var i = 0; i < seq.length; i++) {
    var d = document.createElement('div'); d.className = 'dot' + (i < pos ? ' on' : '');
    dots.appendChild(d);
  }
}
function speed() { return Math.max(cfg.min, cfg.base - seq.length * 40); }

function showSequence() {
  clearTimers();
  turn = 'show'; pos = 0; drawDots(); setBlind(false);
  grid.classList.add('pads-off');
  setInd('watch'); KidsGame.say('Mira');
  var gap = speed();
  seq.forEach(function (idx, k) {
    later(function () { light(idx, gap * 0.7); }, 600 + k * gap);
  });
  later(function () {
    turn = 'player'; grid.classList.remove('pads-off'); setBlind(true);
    setInd('you'); KidsGame.say('Tu turno');
  }, 600 + seq.length * gap + 150);
}
function nextRound() {
  seq.push(KidsGame.rand(4)); mistakes = 0;
  showSequence();
}
function restart() { seq = []; for (var k = 1; k < cfg.start; k++) seq.push(KidsGame.rand(4)); nextRound(); }

function onPad(i) {
  if (turn !== 'player') { return; }
  light(i, 300);
  if (i === seq[pos]) {
    pos++; drawDots(); burst(pads[i], 6);
    if (pos >= seq.length) {
      turn = 'wait'; KidsGame.addStar(); setInd('star'); setBlind(false); burst(medal, 14);
      later(function () { KidsGame.sound.ok(); }, 250);
      if (seq.length === GOAL || seq.length >= MAX) {
        later(function () {
          var done = seq.length >= MAX;
          KidsGame.celebrate({
            msg: done ? '¡Campeona!' : '¡Muy bien!',
            sub: done ? '¡Recordaste ' + MAX + ' colores!' : 'Recordaste ' + seq.length + ' colores',
            stars: done ? 3 : 2,
            onNext: done ? restart : nextRound,
            onAgain: restart
          });
        }, 900);
      } else {
        later(nextRound, 1100);
      }
    }
  } else {
    turn = 'wait'; mistakes++; setBlind(false);
    KidsGame.sound.wrong(); KidsGame.vibrate(60);
    pads[i].classList.remove('bad'); void pads[i].offsetWidth; pads[i].classList.add('bad');
    stage.classList.remove('wiggle'); void stage.offsetWidth; stage.classList.add('wiggle');
    ind.textContent = '🙈 Otra vez';
    if (mistakes >= 3 && seq.length > 1) {
      seq.pop(); mistakes = 0;
      later(function () { KidsGame.toast('Más fácil 😊'); }, 400);
    }
    later(showSequence, 1200);
  }
}
// estado para pruebas
window.__simon = function () { return { seq: seq.slice(), turn: turn, pos: pos, mistakes: mistakes, nivel: nivel }; };

// ---------- Niveles ----------
function buildHud() {
  hud.innerHTML = '';
  hud.appendChild(KidsGame.levelBadge(nivel));
  var b = document.createElement('button'); b.className = 'btn round purple lvbtn'; b.textContent = '🎚️'; b.setAttribute('aria-label', 'Cambiar nivel');
  b.addEventListener('pointerdown', function (ev) { ev.preventDefault(); ev.stopPropagation(); KidsGame.sound.tap(); pickLevel(); });
  hud.appendChild(b);
}
function start(n) {
  nivel = n; cfg = DIFF[n]; MAX = cfg.max; GOAL = cfg.goal;
  buildHud(); fit();
  later(restart, 400);
}
function pickLevel() {
  clearTimers(); turn = 'idle'; seq = []; pos = 0; drawDots(); setBlind(false);
  grid.classList.add('pads-off'); setInd('watch');
  KidsGame.levelPicker({ onPick: start });
}

pickLevel();
</script>
</body>
</html>
