<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<link rel="stylesheet" href="../common.css">
<title>Simón dice colores</title>
<style>
  /* ===== Mundo: "La cueva de las gemas" — roca violeta, cristales que brillan y un dragón guardián ===== */
  .game {
    display: flex; flex-direction: column; align-items: center;
    background:
      radial-gradient(ellipse 60% 40% at 50% 100%, rgba(120,90,255,.35), rgba(120,90,255,0) 70%),
      radial-gradient(ellipse 30% 60% at 0% 50%, #1a0f3d 0, rgba(26,15,61,0) 70%),
      radial-gradient(ellipse 30% 60% at 100% 50%, #1a0f3d 0, rgba(26,15,61,0) 70%),
      linear-gradient(180deg, #120a2e 0%, #251552 55%, #3b2578 100%);
  }
  /* estalactitas (capa estática) */
  .game::before {
    content: ""; position: absolute; left: 0; right: 0; top: 0; height: 70px; pointer-events: none; z-index: 0;
    background:
      radial-gradient(ellipse 26px 62px at 50% 0, #2a1a5e 0 55%, rgba(0,0,0,0) 57%) 0 0 / 70px 70px repeat-x,
      radial-gradient(ellipse 18px 44px at 50% 0, #1b1040 0 55%, rgba(0,0,0,0) 57%) 35px 0 / 70px 70px repeat-x,
      linear-gradient(180deg, rgba(0,0,0,.35), rgba(0,0,0,0));
  }
  /* cristales del suelo (capa estática) */
  .game::after {
    content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 120px; pointer-events: none; z-index: 0; opacity: .9;
    background:
      radial-gradient(ellipse 60px 26px at 8% 100%, rgba(120,220,255,.45), rgba(120,220,255,0) 70%),
      radial-gradient(ellipse 70px 30px at 92% 100%, rgba(255,120,220,.4), rgba(255,120,220,0) 70%),
      radial-gradient(ellipse 50px 22px at 30% 100%, rgba(140,255,170,.35), rgba(140,255,170,0) 70%),
      radial-gradient(ellipse 50px 22px at 70% 100%, rgba(255,220,120,.35), rgba(255,220,120,0) 70%);
  }
  .crystal { position: absolute; bottom: -4px; z-index: 0; pointer-events: none; width: 70px; height: 90px; }
  .mote { position: absolute; width: 8px; height: 8px; border-radius: 50%; background: #fff; opacity: 0; z-index: 0; pointer-events: none; animation: mote 7s ease-in-out infinite; }
  @keyframes mote { 0% { transform: translateY(0) scale(.6); opacity: 0; } 20% { opacity: .7; } 80% { opacity: .5; } 100% { transform: translateY(-90px) scale(1.1); opacity: 0; } }
  .status {
    flex: 0 0 auto; display: flex; align-items: center; justify-content: center; gap: 12px; flex-wrap: wrap;
    padding: 10px 12px 4px; font-size: 30px; min-height: 64px; width: 100%; position: relative; z-index: 2;
  }
  .status .ind {
    background: linear-gradient(180deg, #ffffff, #e8eefc); border: 3px solid #fff; border-radius: 30px; padding: 6px 22px;
    color: #1f2f6b; font-weight: 900; text-shadow: 0 1px 0 #fff;
    box-shadow: 0 5px 0 #b9c4dc, 0 10px 18px rgba(0,0,0,.45), inset 0 2px 0 #fff; transition: background .2s, box-shadow .2s;
  }
  .status .ind.watch { background: linear-gradient(180deg, #fff6c2, #ffd23f); color: #7a4b00; box-shadow: 0 5px 0 #c99a00, 0 10px 18px rgba(0,0,0,.45), inset 0 2px 0 #fff; }
  .status .ind.you { background: linear-gradient(180deg, #e2ffe9, #7be495); color: #14603a; box-shadow: 0 5px 0 #2e9c55, 0 10px 18px rgba(0,0,0,.45), inset 0 2px 0 #fff; }
  .status .ind.rev { background: linear-gradient(180deg, #ffd9ef, #ff7eb6); color: #7a1b4a; box-shadow: 0 5px 0 #b8306f, 0 10px 18px rgba(0,0,0,.45), inset 0 2px 0 #fff; }
  .status .ind.ear { background: linear-gradient(180deg, #e2d9ff, #b39cff); color: #3a2380; box-shadow: 0 5px 0 #5232b3, 0 10px 18px rgba(0,0,0,.45), inset 0 2px 0 #fff; }
  .status .hud { display: flex; align-items: center; gap: 8px; }
  .status .kg-level-badge { font-size: 18px; padding: 6px 14px; white-space: nowrap; }
  .status .lvbtn { width: 56px; height: 56px; min-width: 56px; min-height: 56px; padding: 0; font-size: 26px; }
  .dots { display: flex; gap: 7px; flex-wrap: wrap; justify-content: center; }
  .dot { width: 18px; height: 18px; border-radius: 50%; background: radial-gradient(circle at 35% 30%, #ffffff, #cbd5e5 55%, #8593ad); box-shadow: 0 2px 3px rgba(0,0,0,.55), inset 0 -2px 3px rgba(0,0,0,.2); transition: transform .15s, background .15s; }
  .dot.on { background: radial-gradient(circle at 35% 30%, #fff6c8, #ffc21a 55%, #c47f00); box-shadow: 0 0 10px rgba(255,213,74,.9), 0 2px 3px rgba(0,0,0,.5); transform: scale(1.2); }
  .dots.rev { flex-direction: row-reverse; }
  .stage { flex: 1 1 auto; min-height: 0; width: 100%; display: flex; align-items: center; justify-content: center; padding: 8px 8px 14px; position: relative; z-index: 1; }
  .wrap { position: relative; flex: 0 0 auto; transition: transform .35s cubic-bezier(.2,1.3,.4,1), opacity .3s; }
  .wrap.out { transform: scale(.92); opacity: 0; }
  /* Dragón guardián: asoma por encima de la placa y sus ojos siguen la gema que brilla */
  .dragon { position: absolute; left: 50%; z-index: 0; pointer-events: none; overflow: visible; transform: translateX(-50%); transform-origin: 50% 50%; }
  .dragon .pupils { transition: transform .18s ease-out; }
  .dragon .lid { transform: scaleY(0); transform-origin: 50% 0; transform-box: fill-box; transition: transform .2s; }
  .dragon.ear .lid { transform: scaleY(1); }
  .dragon .mouth-happy, .dragon .mouth-oops { opacity: 0; transition: opacity .2s; }
  .dragon .mouth-smile { transition: opacity .2s; }
  .dragon.happy .mouth-smile, .dragon.oops .mouth-smile { opacity: 0; }
  .dragon.happy .mouth-happy { opacity: 1; }
  .dragon.oops .mouth-oops { opacity: 1; }
  .dragon .brows { transition: transform .2s; transform-box: fill-box; transform-origin: 50% 50%; }
  .dragon.oops .brows { transform: translateY(6px) rotate(0); }
  .dragon .head { animation: drbreath 3.6s ease-in-out infinite; transform-origin: 50% 90%; transform-box: fill-box; }
  @keyframes drbreath { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-5px); } }
  .dragon.happy .head { animation: drnod .5s ease-in-out 2; }
  @keyframes drnod { 0%,100% { transform: translateY(0) rotate(0); } 50% { transform: translateY(6px) rotate(-3deg); } }
  .dragon.oops .head { animation: drshake .4s ease-in-out; }
  @keyframes drshake { 0%,100% { transform: rotate(0); } 25% { transform: rotate(-5deg); } 75% { transform: rotate(5deg); } }
  .dragon .wing { transform-box: fill-box; animation: wing 3.6s ease-in-out infinite; }
  .dragon .wing.l { transform-origin: 100% 100%; } .dragon .wing.r { transform-origin: 0 100%; }
  @keyframes wing { 0%,100% { transform: rotate(0); } 50% { transform: rotate(-6deg); } }
  .dragon .wing.r { animation-name: wingr; } @keyframes wingr { 0%,100% { transform: rotate(0); } 50% { transform: rotate(6deg); } }
  /* Placa de piedra con aro dorado */
  .grid {
    display: grid; grid-template-columns: 1fr 1fr; grid-template-rows: 1fr 1fr; gap: min(3vw, 18px);
    width: 300px; height: 300px; position: relative; z-index: 1;
  }
  .grid::before {
    content: ""; position: absolute; inset: -6%; border-radius: 15%; z-index: -1;
    background:
      radial-gradient(ellipse 50% 30% at 50% 0%, rgba(255,255,255,.14), rgba(255,255,255,0) 70%),
      radial-gradient(circle at 50% 35%, #3a2a6b 0, #22174d 55%, #140d38 100%);
    box-shadow: 0 0 0 6px #f6d77a, 0 0 0 10px #a8801f, 0 16px 0 #0a0620, 0 30px 44px rgba(0,0,0,.65), inset 0 4px 10px rgba(255,255,255,.14), inset 0 -10px 18px rgba(0,0,0,.45);
  }
  .medal {
    position: absolute; left: 50%; top: 50%; width: 22%; height: 22%; transform: translate(-50%,-50%); border-radius: 50%; z-index: 3; pointer-events: none;
    background: radial-gradient(circle at 35% 30%, #fff9dc 0, #ffd54a 42%, #dc9a10 80%, #b57708 100%);
    box-shadow: 0 0 0 4px #fff2b8, 0 0 0 7px #a8801f, 0 6px 0 #7f5809, 0 12px 20px rgba(0,0,0,.55), inset 0 -6px 10px rgba(120,70,0,.3), inset 0 3px 0 rgba(255,255,255,.8);
    display: flex; align-items: center; justify-content: center; font-size: min(7vmin, 40px);
    animation: medal 3s ease-in-out infinite;
  }
  @keyframes medal { 0%,100% { transform: translate(-50%,-50%) scale(1) } 50% { transform: translate(-50%,-50%) scale(1.06) } }
  /* Gema: SVG facetado dentro de un engaste de piedra */
  .pad {
    --c: #ff4d4d; --l: #ffb3b3; --d: #8f1f1f;
    border-radius: 26px; position: relative; overflow: visible; cursor: pointer; min-width: 64px; min-height: 64px; touch-action: none;
    background: radial-gradient(ellipse 70% 40% at 50% 0%, rgba(255,255,255,.1), rgba(255,255,255,0) 70%), linear-gradient(180deg, #2b1f5c 0%, #1a1240 100%);
    box-shadow: 0 7px 0 #0b0624, 0 14px 22px rgba(0,0,0,.55), inset 0 2px 0 rgba(255,255,255,.14), inset 0 -8px 14px rgba(0,0,0,.4);
    display: flex; align-items: center; justify-content: center;
    transition: transform .12s cubic-bezier(.2,1.6,.4,1);
  }
  .pad svg { width: 78%; height: 78%; overflow: visible; transition: transform .14s cubic-bezier(.2,1.6,.4,1), opacity .25s; animation: gemfloat 3.4s ease-in-out infinite; }
  .pad:nth-child(2) svg { animation-delay: -.9s; } .pad:nth-child(3) svg { animation-delay: -1.8s; } .pad:nth-child(4) svg { animation-delay: -2.6s; } .pad:nth-child(5) svg { animation-delay: -1.3s; }
  @keyframes gemfloat { 0%,100% { transform: translateY(0) rotate(-2deg); } 50% { transform: translateY(-5px) rotate(2deg); } }
  .pad .glow { position: absolute; inset: -14%; border-radius: 40%; pointer-events: none; opacity: 0; transition: opacity .18s;
    background: radial-gradient(circle at 50% 50%, var(--l) 0, var(--c) 30%, rgba(255,255,255,0) 72%); }
  .pad .shine { opacity: 0; transition: opacity .15s; }
  .pad.lit { transform: scale(1.08); z-index: 2; }
  .pad.lit .glow { opacity: .95; }
  .pad.lit .shine { opacity: .45; }
  .pad.lit svg { transform: scale(1.12); animation: none; }
  .pad.press svg { animation: squash .3s cubic-bezier(.2,1.6,.4,1); }
  @keyframes squash { 0% { transform: scale(1.18,.84); } 60% { transform: scale(.94,1.1); } 100% { transform: scale(1); } }
  .pad.bad { animation: shake .35s; }
  .pads-off .pad { cursor: default; }
  .grid.five { grid-template-columns: 1fr 1fr 1fr; grid-template-rows: 1fr 1fr; }
  .grid.five .medal { position: static; transform: none; grid-column: 3; grid-row: 2; align-self: center; justify-self: center; animation: medal5 3s ease-in-out infinite; }
  @keyframes medal5 { 0%,100% { transform: scale(1) } 50% { transform: scale(1.06) } }
  /* Ronda "solo escucha": las gemas no se encienden */
  .ear .pads-off .pad.lit { transform: none; }
  .ear .pads-off .pad.lit .glow, .ear .pads-off .pad.lit .shine { opacity: 0; }
  .ear .pads-off .pad.lit svg { transform: none; }
  /* Nivel 3: a ciegas */
  .blind .pad:not(.lit) svg { opacity: 0; }
  .blind .pad:not(.lit)::before { content: "?"; position: absolute; left: 50%; top: 50%; transform: translate(-50%,-50%); font-size: min(14vw, 90px, 13vh); font-weight: 900; color: rgba(255,255,255,.4); text-shadow: 0 2px 0 rgba(0,0,0,.25); }
  @keyframes wig { 0%,100%{transform:rotate(0)} 25%{transform:rotate(-5deg)} 75%{transform:rotate(5deg)} }
  .wrap.wiggle .grid { animation: wig .35s; }
  /* Banner de ronda */
  .banner { position: absolute; left: 50%; top: 40%; z-index: 12; pointer-events: none; padding: 10px 32px; border-radius: 40px; white-space: nowrap;
    font-size: 34px; font-weight: 900; color: #fff; text-shadow: 0 2px 0 #b8306f, 0 4px 8px rgba(0,0,0,.3);
    background: linear-gradient(180deg, #ff9ccb, #f0569a); border: 3px solid #fff; box-shadow: 0 6px 0 #b8306f, 0 14px 24px rgba(0,0,0,.35), inset 0 2px 0 rgba(255,255,255,.6);
    transform: translate(-50%,-50%) scale(.5); opacity: 0; transition: transform .35s cubic-bezier(.2,1.5,.4,1), opacity .25s; }
  .banner.show { transform: translate(-50%,-50%) scale(1); opacity: 1; }
  .banner.gold { background: linear-gradient(180deg, #ffe98a, #ffb703); color: #6a3f00; text-shadow: 0 1px 0 rgba(255,255,255,.6); box-shadow: 0 6px 0 #c47f00, 0 14px 24px rgba(0,0,0,.35); }
  .gembtn { width: 56px; height: 56px; min-width: 56px; min-height: 56px; padding: 0; font-size: 24px; }
  @media (max-width: 700px) { .status { font-size: 24px; gap: 8px; } .status .ind { padding: 6px 16px; } }
</style>
</head>
<body>
<div class="game">
  <div class="status"><div class="ind" id="ind">👀 Mira</div><div class="dots" id="dots"></div><div class="hud" id="hud"></div></div>
  <div class="stage" id="stage"><div class="wrap" id="wrap"><div class="dragon" id="dragon"></div><div class="grid" id="grid"><div class="medal"><span class="emoji">⭐</span></div></div></div></div>
  <div class="banner" id="banner"></div>
</div>
<script src="../common.js"></script>
<script>
var game = KidsGame.init({ title: 'Simón dice colores' });

// ---------- Arte: gemas y dragón en SVG ----------
function gemSVG(i) {
  var g = 'gm' + i;
  return '<svg viewBox="0 0 100 100" aria-hidden="true"><defs>' +
    '<linearGradient id="' + g + 'a" x1="0" y1="0" x2="1" y2="1"><stop offset="0" style="stop-color:var(--l)"/><stop offset=".5" style="stop-color:var(--c)"/><stop offset="1" style="stop-color:var(--d)"/></linearGradient>' +
    '<linearGradient id="' + g + 'b" x1="0" y1="0" x2="0" y2="1"><stop offset="0" style="stop-color:#fff;stop-opacity:.85"/><stop offset="1" style="stop-color:#fff;stop-opacity:0"/></linearGradient></defs>' +
    '<ellipse cx="50" cy="94" rx="30" ry="5" fill="rgba(0,0,0,.35)"/>' +
    '<polygon points="50,4 86,26 86,70 50,96 14,70 14,26" fill="url(#' + g + 'a)" stroke="rgba(0,0,0,.35)" stroke-width="2" stroke-linejoin="round"/>' +
    '<polygon points="50,4 86,26 50,34 14,26" style="fill:var(--l)" opacity=".55"/>' +
    '<polygon points="14,26 50,34 50,96 14,70" style="fill:var(--d)" opacity=".35"/>' +
    '<polygon points="86,26 86,70 50,96 50,34" style="fill:var(--d)" opacity=".15"/>' +
    '<polygon points="50,34 68,48 50,62 32,48" fill="#fff" opacity=".22"/>' +
    '<polygon points="50,4 62,22 50,34 38,22" fill="url(#' + g + 'b)"/>' +
    '<circle cx="34" cy="24" r="4" fill="#fff" opacity=".9"/><circle cx="68" cy="60" r="2.5" fill="#fff" opacity=".7"/>' +
    '<polygon class="shine" points="50,4 86,26 86,70 50,96 14,70 14,26" fill="#fff" opacity="0"/></svg>';
}
function dragonSVG() {
  return '<svg viewBox="0 0 320 170" width="100%" height="100%" aria-hidden="true"><defs>' +
    '<radialGradient id="drb" cx="40%" cy="35%" r="75%"><stop offset="0" stop-color="#9ef0a8"/><stop offset=".6" stop-color="#3fb964"/><stop offset="1" stop-color="#1f7a44"/></radialGradient>' +
    '<linearGradient id="drw" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#b48cff"/><stop offset="1" stop-color="#6a3fd6"/></linearGradient>' +
    '<radialGradient id="drbelly" cx="50%" cy="30%" r="70%"><stop offset="0" stop-color="#fff6c2"/><stop offset="1" stop-color="#ffd166"/></radialGradient></defs>' +
    '<path class="wing l" d="M110 110 Q 40 40 20 95 Q 60 80 70 118 Z" fill="url(#drw)" stroke="#4a2aa8" stroke-width="3" stroke-linejoin="round"/>' +
    '<path class="wing r" d="M210 110 Q 280 40 300 95 Q 260 80 250 118 Z" fill="url(#drw)" stroke="#4a2aa8" stroke-width="3" stroke-linejoin="round"/>' +
    '<g class="head">' +
    '<path d="M118 60 L 100 18 L 134 44 Z M202 60 L 220 18 L 186 44 Z" fill="#ffd166" stroke="#c98a12" stroke-width="3" stroke-linejoin="round"/>' +
    '<ellipse cx="160" cy="92" rx="78" ry="62" fill="url(#drb)" stroke="#1f7a44" stroke-width="3"/>' +
    '<ellipse cx="160" cy="126" rx="48" ry="30" fill="url(#drbelly)"/>' +
    '<ellipse cx="160" cy="118" rx="38" ry="4" fill="rgba(0,0,0,.08)"/><ellipse cx="160" cy="132" rx="30" ry="4" fill="rgba(0,0,0,.08)"/>' +
    '<circle cx="128" cy="82" r="20" fill="#fff"/><circle cx="192" cy="82" r="20" fill="#fff"/>' +
    '<g class="pupils"><circle cx="130" cy="84" r="10" fill="#1f2f6b"/><circle cx="194" cy="84" r="10" fill="#1f2f6b"/><circle cx="134" cy="79" r="3.5" fill="#fff"/><circle cx="198" cy="79" r="3.5" fill="#fff"/></g>' +
    '<path class="lid" d="M108 82 A20 20 0 0 1 148 82 Z" fill="#3fb964"/><path class="lid" d="M172 82 A20 20 0 0 1 212 82 Z" fill="#3fb964"/>' +
    '<g class="brows"><path d="M110 58 Q 128 50 146 58" stroke="#1f7a44" stroke-width="5" fill="none" stroke-linecap="round"/><path d="M174 58 Q 192 50 210 58" stroke="#1f7a44" stroke-width="5" fill="none" stroke-linecap="round"/></g>' +
    '<circle cx="150" cy="108" r="3.5" fill="#1f7a44"/><circle cx="170" cy="108" r="3.5" fill="#1f7a44"/>' +
    '<path class="mouth-smile" d="M138 122 Q 160 138 182 122" stroke="#1f7a44" stroke-width="4" fill="none" stroke-linecap="round"/>' +
    '<path class="mouth-happy" d="M136 120 Q 160 150 184 120 Z" fill="#9c2f5a"/><path class="mouth-happy" d="M146 121 L 152 130 M174 121 L 168 130" stroke="#fff" stroke-width="4" stroke-linecap="round"/>' +
    '<path class="mouth-oops" d="M142 130 Q 160 118 178 130" stroke="#1f7a44" stroke-width="4" fill="none" stroke-linecap="round"/>' +
    '<circle cx="104" cy="104" r="8" fill="#ff8aa8" opacity=".55"/><circle cx="216" cy="104" r="8" fill="#ff8aa8" opacity=".55"/>' +
    '</g>' +
    '<path d="M86 150 q 8 -22 24 -8 q 6 -16 20 -4 q 4 18 -14 24 Z" fill="#3fb964" stroke="#1f7a44" stroke-width="3" stroke-linejoin="round"/>' +
    '<path d="M234 150 q -8 -22 -24 -8 q -6 -16 -20 -4 q -4 18 14 24 Z" fill="#3fb964" stroke="#1f7a44" stroke-width="3" stroke-linejoin="round"/>' +
    '</svg>';
}
function crystalSVG(c1, c2) {
  return '<svg viewBox="0 0 70 90" width="100%" height="100%" aria-hidden="true"><polygon points="14,90 4,50 20,20 30,90" fill="' + c1 + '" opacity=".85"/><polygon points="26,90 22,40 40,4 54,44 50,90" fill="' + c2 + '" opacity=".9"/><polygon points="48,90 50,56 64,38 70,90" fill="' + c1 + '" opacity=".8"/><polygon points="22,40 40,4 42,44" fill="#fff" opacity=".35"/></svg>';
}

// ---------- Gemas: 5 colores base y paletas desbloqueables ----------
var PADS = [
  { freq: 329.63, name: 'rojo' }, { freq: 261.63, name: 'verde' }, { freq: 220.00, name: 'azul' }, { freq: 164.81, name: 'amarillo' }, { freq: 392.00, name: 'morado' }
];
var PALETTES = [
  { id: 'clasico', n: 'Gemas clásicas', unlock: 0, c: [['#ff6b6b', '#ffc1c1', '#9c1f1f'], ['#3fd68a', '#b8ffd8', '#157a46'], ['#4fb3ff', '#c5e6ff', '#1a4f9c'], ['#ffd54a', '#fff2b8', '#a6730a'], ['#a985ff', '#ddd0ff', '#4b2ba8']] },
  { id: 'hielo', n: 'Gemas de hielo', unlock: 1, c: [['#ff9fcf', '#ffe0f0', '#b04a86'], ['#8af5e0', '#dbfff8', '#1f8f7c'], ['#8ecbff', '#e2f2ff', '#2f6fb3'], ['#f7f3c8', '#ffffff', '#b9ab52'], ['#c7b3ff', '#efe8ff', '#6a4fc2']] },
  { id: 'fuego', n: 'Gemas de fuego', unlock: 2, c: [['#ff4d2e', '#ffb59e', '#8f1500'], ['#ffb400', '#ffe29a', '#9c5f00'], ['#ff2f7a', '#ffb3cf', '#8c0f3d'], ['#ffe14d', '#fff7b8', '#a68a00'], ['#ff7a1f', '#ffd0a8', '#9c3c00']] },
  { id: 'arcoiris', n: 'Gemas arcoíris', unlock: 3, c: [['#ff5f9e', '#ffd1e4', '#a8205e'], ['#5fe0ff', '#d1f6ff', '#1f7fa8'], ['#8dff6b', '#dbffd1', '#3d9c22'], ['#ffd45f', '#fff1c8', '#a8801f'], ['#c46bff', '#ebd1ff', '#6f1fa8']] }
];
var gemSel = 'clasico';
try { gemSel = JSON.parse(localStorage.getItem('kg-simon-gemas') || '{}').sel || 'clasico'; } catch (e) {}
function doneLevels() { try { return JSON.parse(localStorage.getItem('kg-done') || '{}').simon || {}; } catch (e) { return {}; } }
function unlockedPalettes() { var d = doneLevels(); return PALETTES.filter(function (p) { return !p.unlock || d[p.unlock]; }); }
function applyPalette() {
  var p = null; PALETTES.forEach(function (x) { if (x.id === gemSel) p = x; });
  if (!p || unlockedPalettes().indexOf(p) < 0) { p = PALETTES[0]; gemSel = p.id; }
  pads.forEach(function (el, i) { el.style.setProperty('--c', p.c[i][0]); el.style.setProperty('--l', p.c[i][1]); el.style.setProperty('--d', p.c[i][2]); });
  try { localStorage.setItem('kg-simon-gemas', JSON.stringify({ sel: gemSel })); } catch (e) {}
}
function cyclePalette() {
  var u = unlockedPalettes(), k = 0; u.forEach(function (p, i) { if (p.id === gemSel) k = i; });
  if (u.length < 2) { KidsGame.toast('💎 Completa el nivel 1 para más gemas', 1600); KidsGame.sound.tap(); return; }
  gemSel = u[(k + 1) % u.length].id; applyPalette(); KidsGame.sound.pop(); KidsGame.toast('💎 ' + u[(k + 1) % u.length].n, 1200);
  pads.forEach(function (el) { KidsGame.fx.burstAt(el, { n: 5, chars: ['✨'] }); });
}

// Niveles: largo inicial, meta intermedia, máximo, velocidad base, si se ocultan los colores al jugar y cuántas gemas
var DIFF = {
  1: { start: 1, goal: 3, max: 5,  base: 700, min: 420, blind: false, pads: 4 },
  2: { start: 2, goal: 6, max: 9,  base: 560, min: 340, blind: false, pads: 4 },
  3: { start: 3, goal: 6, max: 10, base: 480, min: 280, blind: true,  pads: 4 },
  4: { start: 3, goal: 7, max: 14, base: 460, min: 260, blind: true,  pads: 5, expert: true }
};
var LABELS = { 1: 'Hasta 5 colores', 2: 'Hasta 9, más rápido', 3: 'Hasta 10, a ciegas', 4: '5 gemas, al revés, oído' };
var nivel = 1, cfg = DIFF[1];
var MAX = cfg.max, GOAL = cfg.goal, NPADS = 4, roundType = 'normal', expected = [];
var grid = document.getElementById('grid'), ind = document.getElementById('ind'), dots = document.getElementById('dots'), stage = document.getElementById('stage'), hud = document.getElementById('hud');
var wrap = document.getElementById('wrap'), dragonEl = document.getElementById('dragon'), bannerEl = document.getElementById('banner');
var medal = grid.querySelector('.medal');
var pads = [];
PADS.forEach(function (p, i) {
  var d = document.createElement('div');
  d.className = 'pad'; d.innerHTML = '<div class="glow"></div>' + gemSVG(i);
  d.setAttribute('data-i', i);
  d.addEventListener('pointerdown', function (e) { e.preventDefault(); onPad(i); });
  if (i >= 4) d.style.display = 'none';
  grid.insertBefore(d, medal); pads.push(d);
});
applyPalette();
dragonEl.innerHTML = dragonSVG();
var pupils = dragonEl.querySelector('.pupils');
// decoración: cristales y motas de luz
(function () {
  var cs = [['#7dd0ff', '#b9e8ff', '2%'], ['#ff8ad6', '#ffc2ea', '88%'], ['#8af0a8', '#c8ffd8', '18%'], ['#ffd45f', '#ffeeb0', '74%']];
  cs.forEach(function (c, i) { var d = document.createElement('div'); d.className = 'crystal'; d.style.left = c[2]; d.style.width = (56 + i * 8) + 'px'; d.style.height = (70 + i * 10) + 'px'; d.innerHTML = crystalSVG(c[0], c[1]); game.appendChild(d); });
  for (var i = 0; i < 7; i++) { var m = document.createElement('div'); m.className = 'mote'; m.style.left = (5 + i * 14) + '%'; m.style.top = (30 + (i % 3) * 20) + '%'; m.style.animationDelay = (-i * 1.1) + 's'; game.appendChild(m); }
})();

function fit() {
  var W = stage.clientWidth - 16, H = stage.clientHeight - 24, land = W > H * 1.15;
  // En horizontal el dragón se asoma por el lado izquierdo de la placa; en vertical, por arriba
  var gw, gh;
  if (NPADS === 5) {
    var w = Math.min((W - 20) / (land ? 1.5 : 1.14), 760), h = Math.min(land ? H / 1.14 : H / 1.55, 520);
    var cell = Math.max(64, Math.min((w - 36) / 3, (h - 18) / 2));
    gw = Math.round(cell * 3 + 36); gh = Math.round(cell * 2 + 18);
    medal.style.width = medal.style.height = Math.round(cell * 0.55) + 'px';
  } else {
    var side = Math.max(200, Math.min(land ? (W - 20) / 1.6 : W / 1.14, land ? H / 1.14 : H / 1.6, 640));
    gw = gh = Math.round(side); medal.style.width = medal.style.height = '';
  }
  grid.style.width = gw + 'px'; grid.style.height = gh + 'px';
  var dw = land ? Math.min(gh * 0.9, 380) : Math.min(gw * 0.95, 420), dh = dw * 170 / 320;
  dragonEl.style.width = dw + 'px'; dragonEl.style.height = dh + 'px';
  if (land) {
    dragonEl.style.left = (-dw * 0.78) + 'px'; dragonEl.style.top = (gh * 0.5 - dh * 0.5) + 'px'; dragonEl.style.transform = 'rotate(-8deg)';
    wrap.style.marginTop = '0'; wrap.style.marginLeft = (dw * 0.6) + 'px';
  } else {
    dragonEl.style.left = '50%'; dragonEl.style.top = (-dh + gh * 0.03) + 'px'; dragonEl.style.transform = 'translateX(-50%)';
    wrap.style.marginTop = (dh * 0.92) + 'px'; wrap.style.marginLeft = '0';
  }
}
window.addEventListener('resize', function () { setTimeout(fit, 50); });
fit();

// El dragón mira hacia una gema (o al centro)
var lookT = null;
function lookAt(el) {
  clearTimeout(lookT);
  if (!el) { pupils.setAttribute('transform', 'translate(0 0)'); return; }
  var e = dragonEl.getBoundingClientRect(), p = el.getBoundingClientRect();
  var ex = e.left + e.width / 2, ey = e.top + e.height * 0.5;
  var dx = (p.left + p.width / 2) - ex, dy = (p.top + p.height / 2) - ey;
  var len = Math.sqrt(dx * dx + dy * dy) || 1, r = 7;
  pupils.setAttribute('transform', 'translate(' + (dx / len * r).toFixed(1) + ' ' + (dy / len * r * 0.8).toFixed(1) + ')');
  lookT = setTimeout(function () { pupils.setAttribute('transform', 'translate(0 0)'); }, 900);
}
function dragonMood(m, ms) {
  dragonEl.classList.remove('happy', 'oops'); if (m) { void dragonEl.offsetWidth; dragonEl.classList.add(m); }
  if (m) setTimeout(function () { dragonEl.classList.remove(m); }, ms || 1200);
}
var bannerT = null;
function banner(txt, gold, ms) {
  clearTimeout(bannerT); bannerEl.textContent = txt; bannerEl.className = 'banner show' + (gold ? ' gold' : '');
  bannerT = setTimeout(function () { bannerEl.classList.remove('show'); }, ms || 1100);
}

var seq = [], turn = 'idle', pos = 0, mistakes = 0, timers = [], litTimer = {}, streak = 0, handShown = false, hand = null;
function later(fn, ms) { timers.push(setTimeout(fn, ms)); }
function clearTimers() { timers.forEach(clearTimeout); timers = []; }

function light(i, ms, press) {
  var p = pads[i];
  clearTimeout(litTimer[i]); p.classList.remove('lit', 'press'); void p.offsetWidth; p.classList.add('lit'); if (press) p.classList.add('press');
  KidsGame.sound.note(PADS[i].freq);
  if (cfg.expert) later(function () { KidsGame.sound.note(PADS[i].freq * (i % 2 ? 1.25 : 1.5)); }, 140);
  if (roundType !== 'ear' || turn !== 'show') lookAt(p);
  litTimer[i] = setTimeout(function () { p.classList.remove('lit', 'press'); }, ms || 350);
}
function setInd(state) {
  ind.className = 'ind ' + state;
  ind.textContent = state === 'watch' ? (roundType === 'ear' ? '🎧 Solo escucha' : '👀 Mira') :
    (state === 'you' ? (roundType === 'rev' ? '🔁 ¡Al revés!' : '👆 Tu turno') : '🌟');
}
function setBlind(on) { grid.classList.toggle('blind', !!(cfg.blind && on && roundType === 'normal')); }
function drawDots() {
  dots.innerHTML = ''; dots.classList.toggle('rev', roundType === 'rev');
  for (var i = 0; i < seq.length; i++) {
    var d = document.createElement('div'); d.className = 'dot' + (i < pos ? ' on' : '');
    dots.appendChild(d);
  }
}
function pickRoundType() {
  if (!cfg.expert) return 'normal';
  if (seq.length >= 6 && seq.length % 2 === 0) return 'ear';
  if (seq.length >= 4 && seq.length % 2 === 1) return 'rev';
  return 'normal';
}
function speed() { return Math.max(cfg.min, cfg.base - seq.length * 40); }

function showSequence() {
  clearTimers();
  roundType = pickRoundType(); expected = roundType === 'rev' ? seq.slice().reverse() : seq.slice();
  turn = 'show'; pos = 0; drawDots(); setBlind(false);
  grid.classList.add('pads-off'); stage.classList.toggle('ear', roundType === 'ear'); dragonEl.classList.toggle('ear', roundType === 'ear');
  setInd('watch');
  banner(roundType === 'ear' ? '🎧 Solo escucha' : roundType === 'rev' ? '🔁 ¡Al revés!' : 'Ronda ' + seq.length + ' de ' + MAX, false, 1000);
  KidsGame.say(roundType === 'ear' ? 'Solo escucha' : 'Mira');
  var gap = speed(), t0 = 1200;
  seq.forEach(function (idx, k) {
    later(function () { light(idx, gap * 0.7); }, t0 + k * gap);
  });
  later(function () {
    turn = 'player'; grid.classList.remove('pads-off'); stage.classList.remove('ear'); dragonEl.classList.remove('ear'); setBlind(true); lookAt(null);
    setInd('you'); KidsGame.say(roundType === 'rev' ? '¡Al revés! Repítela de atrás para adelante' : 'Tu turno');
    if (nivel === 1 && !handShown) { handShown = true; hand = KidsGame.hand({ el: pads[expected[0]] }); }
  }, t0 + seq.length * gap + 150);
}
function nextRound() {
  seq.push(KidsGame.rand(NPADS)); mistakes = 0;
  showSequence();
}
function restart() { seq = []; for (var k = 1; k < cfg.start; k++) seq.push(KidsGame.rand(NPADS)); nextRound(); }

function onPad(i) {
  if (turn !== 'player') { return; }
  light(i, 300, true);
  if (i === expected[pos]) {
    pos++; drawDots(); KidsGame.fx.burstAt(pads[i], { n: 8, r: 60 });
    if (pos >= seq.length) {
      turn = 'wait'; KidsGame.addStar(); setInd('star'); setBlind(false);
      KidsGame.fx.ring(medal); KidsGame.fx.burstAt(medal, { n: 14, chars: ['⭐', '✨', '💎'] });
      var mr = medal.getBoundingClientRect(); KidsGame.fx.floatText(mr.left + mr.width / 2, mr.top, '+1', 'good');
      dragonMood('happy', 1300);
      streak++;
      if (streak >= 3) later(function () { KidsGame.fx.floatText(mr.left + mr.width / 2, mr.top - 50, '¡Racha x' + streak + '!'); }, 350);
      if (streak % 5 === 0) later(function () { KidsGame.addStar(); banner('⭐ ¡Bonus de racha!', true, 1200); KidsGame.sound.win(); }, 700);
      later(function () { KidsGame.sound.ok(); }, 250);
      if (seq.length === GOAL || seq.length >= MAX) {
        later(function () {
          var done = seq.length >= MAX, before = unlockedPalettes().length;
          KidsGame.levelDone(nivel);
          var after = unlockedPalettes();
          if (after.length > before) KidsGame.toast('💎 ¡Nuevas ' + after[after.length - 1].n.toLowerCase() + '! Toca 💎', 2600);
          KidsGame.celebrate({
            msg: done ? '¡Campeona!' : '¡Muy bien!',
            sub: done ? '¡Recordaste ' + MAX + ' colores!' : 'Recordaste ' + seq.length + ' colores',
            stars: done ? 3 : 2,
            onNext: done ? restart : nextRound,
            onAgain: restart
          });
        }, 900);
      } else {
        later(nextRound, 1100);
      }
    }
  } else {
    turn = 'wait'; mistakes++; streak = 0; setBlind(false);
    KidsGame.sound.wrong(); KidsGame.vibrate(60);
    pads[i].classList.remove('bad'); void pads[i].offsetWidth; pads[i].classList.add('bad');
    wrap.classList.remove('wiggle'); void wrap.offsetWidth; wrap.classList.add('wiggle');
    dragonMood('oops', 1000);
    ind.textContent = '🙈 Otra vez';
    if (mistakes >= 3 && seq.length > 1) {
      seq.pop(); mistakes = 0;
      later(function () { KidsGame.toast('Más fácil 😊'); }, 400);
    }
    later(showSequence, 1200);
  }
}
// estado para pruebas
window.__simon = function () { return { seq: seq.slice(), expected: expected.slice(), roundType: roundType, turn: turn, pos: pos, mistakes: mistakes, nivel: nivel, pads: NPADS, max: MAX, goal: GOAL, streak: streak, gems: gemSel }; };

// ---------- Niveles ----------
function buildHud() {
  hud.innerHTML = '';
  hud.appendChild(KidsGame.levelBadge(nivel));
  var gb = document.createElement('button'); gb.className = 'btn round blue gembtn'; gb.textContent = '💎'; gb.setAttribute('aria-label', 'Cambiar gemas');
  gb.addEventListener('pointerdown', function (ev) { ev.preventDefault(); ev.stopPropagation(); cyclePalette(); });
  hud.appendChild(gb);
  var b = document.createElement('button'); b.className = 'btn round purple lvbtn'; b.textContent = '🎚️'; b.setAttribute('aria-label', 'Cambiar nivel');
  b.addEventListener('pointerdown', function (ev) { ev.preventDefault(); ev.stopPropagation(); KidsGame.sound.tap(); pickLevel(); });
  hud.appendChild(b);
}
function start(n) {
  nivel = n; cfg = DIFF[n]; MAX = cfg.max; GOAL = cfg.goal; NPADS = cfg.pads; streak = 0; handShown = false;
  grid.classList.toggle('five', NPADS === 5);
  pads.forEach(function (p, i) { p.style.display = i < NPADS ? '' : 'none'; });
  buildHud(); fit(); applyPalette();
  wrap.classList.remove('out');
  later(restart, 500);
}
function pickLevel() {
  clearTimers(); turn = 'idle'; seq = []; pos = 0; roundType = 'normal'; drawDots(); setBlind(false);
  if (hand) { hand.stop(); hand = null; }
  grid.classList.add('pads-off'); stage.classList.remove('ear'); dragonEl.classList.remove('ear'); setInd('watch'); wrap.classList.add('out');
  KidsGame.levelPicker({
    labels: LABELS, music: 'calma',
    art: '<svg viewBox="60 10 200 150" width="64" height="48">' + dragonSVG().replace(/^<svg[^>]*>/, '').replace(/<\/svg>$/, '') + '</svg>',
    howto: [{ icon: '👀', text: 'Mira qué gemas brillan' }, { icon: '👆', text: 'Tócalas en el mismo orden' }, { icon: '🐉', text: 'El dragón te cuida las gemas' }],
    onPick: function (n) { KidsGame.music.stop(); start(n); }
  });
}

pickLevel();
</script>
</body>
