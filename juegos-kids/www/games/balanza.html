<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<link rel="stylesheet" href="../common.css">
<title>La balanza</title>
<style>
  /* ===== El laboratorio: pared de azulejos, repisa con pociones, mesa de trabajo y el ratón científico ===== */
  .game {
    display: flex; flex-direction: column; align-items: center; padding: 8px 12px 10px; gap: 8px;
    background:
      radial-gradient(ellipse 70% 45% at 50% 0%, rgba(255,255,255,.6), rgba(255,255,255,0) 70%),
      repeating-linear-gradient(90deg, rgba(255,255,255,.55) 0 2px, rgba(0,0,0,0) 2px 64px),
      repeating-linear-gradient(0deg, rgba(255,255,255,.55) 0 2px, rgba(0,0,0,0) 2px 64px),
      linear-gradient(180deg, #d9f3ff 0%, #bfe6f5 60%, #a9d8ea 100%);
  }
  .game::before {
    content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 24%; pointer-events: none; z-index: 0;
    background:
      radial-gradient(ellipse 80% 30% at 50% 0%, rgba(255,255,255,.35), rgba(255,255,255,0) 70%),
      repeating-linear-gradient(90deg, rgba(0,0,0,0) 0 140px, rgba(0,0,0,.08) 140px 144px),
      linear-gradient(180deg, #4f6d8a 0%, #35506a 12%, #2a4158 100%);
    box-shadow: 0 -8px 20px rgba(20,40,80,.3);
  }
  .game::after {
    content: ""; position: absolute; left: 0; right: 0; bottom: 20%; height: 10px; pointer-events: none; z-index: 0;
    background: linear-gradient(180deg, #9fb3c8, #6d8199); box-shadow: 0 4px 6px rgba(20,40,80,.3);
  }
  .hud { position: relative; z-index: 2; flex: 0 0 auto; display: flex; align-items: center; gap: 12px; padding: 6px 10px 6px 14px; border-radius: 40px; }
  .dots { display: flex; gap: 6px; }
  .dots span { width: 16px; height: 16px; border-radius: 50%; background: linear-gradient(180deg, #e8ecf5, #c9d2e6); box-shadow: inset 0 2px 3px rgba(0,0,0,.18); transition: transform .2s, background .2s; }
  .dots span.on { background: radial-gradient(circle at 35% 30%, #fff3a8, #ffb703 70%); box-shadow: 0 2px 0 #c47f00, 0 3px 6px rgba(0,0,0,.25), inset 0 1px 0 #fff; transform: scale(1.15); }
  .hud .btn.round, .instr .btn.round { width: 64px; height: 64px; font-size: 28px; }
  /* Repisa de pociones: una por nivel completado (desbloqueable) */
  .vit { display: flex; gap: 4px; padding: 4px 8px 6px; border-radius: 14px; background: linear-gradient(180deg, #e3f1ff, #c9dff2); box-shadow: inset 0 2px 4px rgba(20,40,80,.15), 0 3px 0 #6d8199; }
  .vit span { width: 34px; height: 34px; display: flex; align-items: center; justify-content: center; font-size: 24px; border-radius: 8px; background: rgba(255,255,255,.75); }
  .vit span.off { opacity: .35; font-size: 16px; }
  .vit span.new { animation: pop .5s ease-out; }
  .vit span.on { animation: bubble 2.6s ease-in-out infinite; }
  @keyframes bubble { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-3px); } }
  .instr { position: relative; z-index: 2; flex: 0 0 auto; display: flex; align-items: center; gap: 12px; padding: 4px 10px 4px 10px; border-radius: 40px; max-width: 100%; }
  .instr .txt { font-size: clamp(17px, 2.6vw, 26px); font-weight: 900; color: #2a4158; text-shadow: 0 2px 0 #fff, 0 3px 6px rgba(0,0,0,.12); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .instr .mouse { width: 64px; height: 64px; flex: 0 0 auto; filter: drop-shadow(0 4px 4px rgba(0,0,0,.3)); cursor: pointer; }
  .mouse .ms-eyes { transform-origin: 60px 56px; animation: msblink 4.4s infinite; }
  @keyframes msblink { 0%, 93%, 100% { transform: scaleY(1); } 96% { transform: scaleY(.1); } }
  .mouse .ms-head { transform-origin: 60px 80px; animation: mstilt 3.6s ease-in-out infinite; }
  @keyframes mstilt { 0%, 100% { transform: rotate(-3deg); } 50% { transform: rotate(3deg); } }
  .mouse.cheer { animation: mscheer .5s ease-out; }
  @keyframes mscheer { 0%, 100% { transform: scale(1); } 40% { transform: scale(1.15, .9); } 70% { transform: scale(.95, 1.08) translateY(-5px); } }

  .rules { position: relative; z-index: 2; flex: 0 0 auto; display: flex; gap: 14px; align-items: center; justify-content: center; }
  .rules:empty { display: none; }
  .rule { padding: 6px 16px; border-radius: 20px; font-size: clamp(22px, 3.2vw, 32px); font-weight: 900; color: #1f2f6b; gap: 6px; animation: pop .4s ease-out backwards; }
  .rule .emoji { font-size: 1.1em; }
  .rule .eq { color: #f0569a; margin: 0 4px; }
  .rule .q { color: #7f5af0; }
  .rule.ask { background: linear-gradient(180deg, #fff6d0, #ffd54a); border-color: #fff; box-shadow: 0 6px 0 #c47f00, 0 12px 20px rgba(20,40,90,.22), inset 0 2px 0 #fff; }

  .stage { position: relative; z-index: 1; flex: 1 1 auto; width: 100%; min-height: 0; display: flex; align-items: center; justify-content: center; }
  .stage svg { width: 100%; height: 100%; overflow: visible; }
  /* Transición entre rondas (solo transform/opacity) */
  .rules, .stage, .bottom { transition: transform .3s cubic-bezier(.3,1.3,.5,1), opacity .28s; }
  .rules.out, .stage.out, .bottom.out { transform: translateX(-8%) scale(.94); opacity: 0; }
  .rules.in, .stage.in, .bottom.in { transform: translateX(8%) scale(.94); opacity: 0; transition: none; }
  #beam { transform-origin: 320px 80px; transition: transform .8s cubic-bezier(.3,1.5,.5,1); }
  .hang { transition: transform .8s cubic-bezier(.3,1.5,.5,1); }
  .hang .glow { opacity: 0; transition: opacity .3s; }
  .hang.hot .glow { opacity: .8; }
  .hang.win .glow { opacity: 1; }
  .hang.tappable { cursor: pointer; }
  .hang.bad { animation: shake .4s; }
  .hang .item { font-family: "Noto Color Emoji", "Apple Color Emoji", "Segoe UI Emoji", sans-serif; cursor: pointer; }
  .hang .item.pop { animation: none; }
  .wbadge text { font-family: var(--font); font-weight: 900; fill: #fff; font-size: 17px; }
  .qmark { font-family: var(--font); font-weight: 900; font-size: 64px; fill: #7f5af0; animation: qpulse 1.3s ease-in-out infinite; transform-origin: center; transform-box: fill-box; }
  @keyframes qpulse { 0%,100% { transform: scale(1); } 50% { transform: scale(1.12); } }
  #sideL, #sideR { font-family: var(--font); font-weight: 900; font-size: 22px; fill: #fff; stroke: #2a4158; stroke-width: 1; paint-order: stroke; opacity: 0; transition: opacity .3s; }
  svg.tapmode #sideL, svg.tapmode #sideR { opacity: 1; }

  .bottom { position: relative; z-index: 2; flex: 0 0 auto; width: 100%; display: flex; justify-content: center; }
  .tray {
    position: relative; min-height: 96px; max-width: 760px; width: 100%; padding: 8px 14px; border-radius: 30px;
    display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 2px 4px;
    background:
      radial-gradient(ellipse 80% 40% at 50% 0%, rgba(255,255,255,.6), rgba(255,255,255,0) 70%),
      linear-gradient(180deg, #ffffff 0%, #eef2fb 100%);
    border: 3px solid #fff;
    box-shadow: 0 8px 0 #c9d2e6, 0 16px 28px rgba(20,40,90,.22), inset 0 2px 0 #fff, inset 0 -5px 0 rgba(0,0,0,.05);
  }
  .obj { position: relative; width: 68px; height: 68px; display: flex; align-items: center; justify-content: center; cursor: grab; touch-action: none; animation: wob 3s ease-in-out infinite; }
  @keyframes wob { 0%,100% { transform: translateY(0) rotate(-3deg); } 50% { transform: translateY(-4px) rotate(3deg); } }
  .obj .emoji { font-size: 46px; filter: drop-shadow(0 5px 4px rgba(0,0,0,.3)); transition: transform .12s; }
  .obj.lifted { opacity: .25; }
  .obj .w { position: absolute; right: 2px; top: 0; min-width: 24px; height: 24px; line-height: 24px; padding: 0 5px; border-radius: 12px; text-align: center; font-size: 15px; font-weight: 900; color: #fff;
    background: linear-gradient(180deg, #ff9ccb, #f0569a); box-shadow: 0 2px 0 #b8306f, 0 3px 6px rgba(0,0,0,.3); }
  .ghost { position: fixed; z-index: 60; pointer-events: none; font-size: 60px; line-height: 1; transform: translate(-50%, -60%) scale(1.15); filter: drop-shadow(0 12px 10px rgba(0,0,0,.35)); font-family: "Noto Color Emoji", "Apple Color Emoji", "Segoe UI Emoji", sans-serif; }
  .nums { position: relative; display: flex; gap: clamp(14px, 3vw, 30px); padding: 10px 22px; border-radius: 34px; }
  .num {
    --a: #7dd0ff; --b: #2f95e8; --d: #1a63a8; --n: 86px;
    position: relative; width: var(--n); height: var(--n); border-radius: 26%; display: flex; align-items: center; justify-content: center; cursor: pointer;
    font-size: calc(var(--n) * .55); font-weight: 900; color: #fff; text-shadow: 0 3px 0 var(--d), 0 6px 10px rgba(0,0,0,.3);
    background: radial-gradient(circle at 35% 25%, rgba(255,255,255,.55), rgba(255,255,255,0) 45%), linear-gradient(180deg, var(--a), var(--b));
    border: 3px solid rgba(255,255,255,.85);
    box-shadow: 0 8px 0 var(--d), 0 16px 24px rgba(20,40,80,.3), inset 0 2px 0 rgba(255,255,255,.7), inset 0 -5px 0 rgba(0,0,0,.1);
    transition: transform .12s, box-shadow .12s; animation: pop .4s ease-out backwards;
  }
  .num::before { content: ""; position: absolute; left: 8%; right: 8%; top: 4%; height: 36%; border-radius: 18% 18% 50% 50%; background: linear-gradient(180deg, rgba(255,255,255,.65), rgba(255,255,255,0)); pointer-events: none; }
  .num:active { transform: translateY(6px); box-shadow: 0 2px 0 var(--d), 0 6px 10px rgba(0,0,0,.3); }
  .num.c1 { --a: #ff9ccb; --b: #f0569a; --d: #b8306f; }
  .num.c3 { --a: #b39cff; --b: #7f5af0; --d: #5232b3; }
  .num.bad { animation: shake .4s; }
  .num.ok { --a: #8ef0b0; --b: #24b36c; --d: #14784a; transform: scale(1.12); box-shadow: 0 8px 0 var(--d), 0 16px 24px rgba(0,60,40,.35), 0 0 0 6px #ffe98a, 0 0 36px 8px rgba(255,233,138,.9); animation: none; }
  .num.dim { opacity: .4; transform: scale(.9); animation: none; }
  /* Banner de ronda */
  .rbanner { position: absolute; left: 50%; top: 42%; z-index: 30; transform: translate(-50%, -50%) scale(.5); opacity: 0; pointer-events: none;
    padding: 10px 36px; border-radius: 40px; font-size: clamp(26px, 4.5vw, 44px); font-weight: 900; color: #fff; white-space: nowrap;
    background: linear-gradient(180deg, #7dd0ff, #2f95e8); text-shadow: 0 3px 0 #1a63a8, 0 6px 10px rgba(0,0,0,.3);
    box-shadow: 0 8px 0 #1a63a8, 0 16px 26px rgba(0,0,0,.35), inset 0 2px 0 rgba(255,255,255,.6);
    transition: transform .35s cubic-bezier(.3,1.5,.5,1), opacity .3s; }
  .rbanner.show { transform: translate(-50%, -50%) scale(1); opacity: 1; }
  @media (max-height: 700px) { .obj { width: 60px; height: 60px; } .obj .emoji { font-size: 40px; } .tray { min-height: 80px; } }
  @media (max-width: 700px) { .hud { gap: 8px; } .vit span { width: 28px; height: 28px; font-size: 20px; } .instr .mouse { width: 56px; height: 56px; } }
</style>
</head>
<body>
<script src="../common.js"></script>
<script>
var game = KidsGame.init({ title: 'La balanza' });
(function () {
  var ROUNDS = 6;
  var NAMES = { '🍎': 'manzanas', '🍐': 'peras', '🍒': 'cerezas', '🐘': 'elefantes', '🐰': 'conejos', '🍓': 'fresas', '🍪': 'galletas', '🐱': 'gatos', '🐶': 'perros', '🦁': 'leones', '🐭': 'ratones', '🐻': 'osos', '🧱': 'ladrillos', '🍊': 'naranjas', '🍋': 'limones', '🐸': 'ranas', '🐥': 'pollitos', '🍇': 'uvas', '🧀': 'quesos', '🥕': 'zanahorias', '🐢': 'tortugas', '🐮': 'vacas' };
  var SING = { '🍎': 'una manzana', '🍐': 'una pera', '🍒': 'una cereza', '🐘': 'un elefante', '🐰': 'un conejo', '🍓': 'una fresa', '🍪': 'una galleta', '🐱': 'un gato', '🐶': 'un perro', '🦁': 'un león', '🐭': 'un ratón', '🐻': 'un oso', '🧱': 'un ladrillo', '🍊': 'una naranja', '🍋': 'un limón', '🐸': 'una rana', '🐥': 'un pollito', '🍇': 'una uva', '🧀': 'un queso', '🥕': 'una zanahoria', '🐢': 'una tortuga', '🐮': 'una vaca' };
  var FRUITS = ['🍎', '🍐', '🍒', '🍓', '🍪', '🍊', '🍋', '🍇', '🥕'];
  var ANIMALS = ['🐘', '🐰', '🐱', '🐶', '🦁', '🐭', '🐻', '🐸', '🐥', '🐢', '🐮'];
  var BIG = ['🐘', '🐻', '🦁', '🐮'], SMALL = ['🐰', '🐭', '🐥', '🐸'];
  var LABELS = { 1: 'Iguala', 2: '¿Qué pesa más?', 3: 'Incógnitas', 4: 'Dos pasos' };
  var HOWTO = [{ icon: '👆', text: 'Arrastra cosas al plato vacío' }, { icon: '⚖️', text: 'Cuando pesa igual, la balanza queda derecha' }, { icon: '🐭', text: 'El ratón científico te ayuda' }];
  // Repisa de pociones: una por nivel completado (cosmético, guardado en localStorage)
  var DECOS = [['verde', '🧪', 'la poción verde'], ['matraz', '⚗️', 'el matraz burbujeante'], ['micro', '🔬', 'el microscopio'], ['adn', '🧬', 'el ADN dorado']];

  var nivel = 0, round = 0, lock = false, running = false, cur = null, streak = 0, handShown = false;
  var hud, dots, instrTxt, instr, rules, stage, svg, beam, hangL, hangR, itemsL, itemsR, bottom, banner, vit, sayText = '';

  function el(tag, cls, html) { var d = document.createElement(tag); if (cls) d.className = cls; if (html != null) d.innerHTML = html; return d; }
  function sv(tag, attrs) { var e = document.createElementNS('http://www.w3.org/2000/svg', tag); for (var k in attrs) e.setAttribute(k, attrs[k]); return e; }
  function readJSON(k, def) { try { return JSON.parse(localStorage.getItem(k)) || def; } catch (e) { return def; } }
  function writeJSON(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }

  // ---- Hero art: el ratón científico (SVG con parpadeo, bata, gogles y matraz) ----
  function mouseSVG(size) {
    return '<svg class="mouse" viewBox="0 0 120 120" width="' + size + '" height="' + size + '" aria-hidden="true"><defs>' +
      '<radialGradient id="msf" cx=".4" cy=".35" r=".8"><stop offset="0" stop-color="#e3e6ef"/><stop offset="1" stop-color="#8d93a8"/></radialGradient>' +
      '<linearGradient id="msc" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#d8e0ee"/></linearGradient>' +
      '<radialGradient id="msg" cx=".4" cy=".35" r=".8"><stop offset="0" stop-color="#d8f6ff"/><stop offset="1" stop-color="#3da9fc"/></radialGradient></defs>' +
      '<ellipse cx="60" cy="113" rx="36" ry="6" fill="rgba(0,0,0,.2)"/>' +
      '<path d="M30 112 Q30 78 60 78 Q90 78 90 112Z" fill="url(#msc)" stroke="#9aa5b8" stroke-width="2"/><path d="M60 82 L60 112" stroke="#9aa5b8" stroke-width="2"/><circle cx="60" cy="94" r="2" fill="#9aa5b8"/><circle cx="60" cy="104" r="2" fill="#9aa5b8"/>' +
      '<path d="M48 80 L60 94 L72 80" fill="none" stroke="#9aa5b8" stroke-width="2"/><rect x="66" y="90" width="11" height="12" rx="2" fill="#eef2fb" stroke="#9aa5b8" stroke-width="1.5"/><rect x="70" y="85" width="4" height="9" rx="1" fill="#2cb67d"/>' +
      '<path d="M94 106 L102 86 L110 86 L118 106 Z" fill="#c6ffd9" stroke="#14784a" stroke-width="2" stroke-linejoin="round"/><path d="M98 99 L114 99 L118 106 L94 106Z" fill="#2cb67d"/><circle cx="106" cy="94" r="2" fill="#fff" opacity=".8"/><circle cx="110" cy="80" r="2.5" fill="#8ef0b0"/><circle cx="104" cy="74" r="1.8" fill="#8ef0b0"/>' +
      '<g class="ms-head">' +
      '<circle cx="28" cy="38" r="16" fill="url(#msf)" stroke="#5f6678" stroke-width="2"/><circle cx="92" cy="38" r="16" fill="url(#msf)" stroke="#5f6678" stroke-width="2"/><circle cx="28" cy="38" r="9" fill="#ffb3c6"/><circle cx="92" cy="38" r="9" fill="#ffb3c6"/>' +
      '<ellipse cx="60" cy="60" rx="32" ry="27" fill="url(#msf)" stroke="#5f6678" stroke-width="2"/>' +
      '<g class="ms-eyes"><ellipse cx="48" cy="58" rx="5" ry="6" fill="#2b2b2b"/><ellipse cx="72" cy="58" rx="5" ry="6" fill="#2b2b2b"/><circle cx="50" cy="56" r="1.8" fill="#fff"/><circle cx="74" cy="56" r="1.8" fill="#fff"/></g>' +
      '<ellipse cx="60" cy="71" rx="6" ry="4.5" fill="#ff8aa8" stroke="#b8306f" stroke-width="1.5"/>' +
      '<path d="M40 72 L26 70 M40 75 L27 78 M80 72 L94 70 M80 75 L93 78" stroke="#5f6678" stroke-width="1.5" stroke-linecap="round"/>' +
      '<path class="ms-mouth" d="M54 78 Q60 83 66 78" stroke="#5f6678" stroke-width="2" fill="none" stroke-linecap="round"/>' +
      '<path d="M30 42 Q60 30 90 42" fill="none" stroke="#3f4759" stroke-width="4"/><circle cx="46" cy="39" r="9" fill="url(#msg)" stroke="#3f4759" stroke-width="3"/><circle cx="74" cy="39" r="9" fill="url(#msg)" stroke="#3f4759" stroke-width="3"/><circle cx="43" cy="36" r="2.5" fill="#fff" opacity=".9"/><circle cx="71" cy="36" r="2.5" fill="#fff" opacity=".9"/>' +
      '</g></svg>';
  }
  function mouseCheer() { var m = instr && instr.querySelector('.mouse'); if (m) { m.classList.remove('cheer'); void m.offsetWidth; m.classList.add('cheer'); } }

  function build() {
    game.innerHTML = '';
    hud = el('div', 'hud panel');
    hud.appendChild(KidsGame.levelBadge(nivel));
    dots = el('div', 'dots');
    for (var i = 0; i < ROUNDS; i++) dots.appendChild(document.createElement('span'));
    hud.appendChild(dots);
    vit = el('div', 'vit'); renderVit(); hud.appendChild(vit);
    var lb = el('button', 'btn round yellow', '🎚️'); lb.setAttribute('aria-label', 'Nivel');
    lb.addEventListener('pointerdown', function (ev) { ev.preventDefault(); KidsGame.sound.tap(); showPicker(); });
    hud.appendChild(lb);
    game.appendChild(hud);

    instr = el('div', 'instr panel', mouseSVG(64) + '<span class="txt"></span>');
    instrTxt = instr.querySelector('.txt');
    instr.querySelector('.mouse').addEventListener('pointerdown', function (ev) { ev.preventDefault(); KidsGame.sound.pop(); mouseCheer(); KidsGame.say(sayText); });
    var sp = el('button', 'btn round blue', '🔊');
    sp.addEventListener('pointerdown', function (ev) { ev.preventDefault(); KidsGame.sound.tap(); KidsGame.say(sayText); });
    instr.appendChild(sp);
    game.appendChild(instr);

    rules = el('div', 'rules'); game.appendChild(rules);

    stage = el('div', 'stage');
    stage.innerHTML =
      '<svg viewBox="0 0 640 380" preserveAspectRatio="xMidYMid meet">' +
      '<defs>' +
      '<linearGradient id="gBeam" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff0b0"/><stop offset=".45" stop-color="#f0b429"/><stop offset="1" stop-color="#a86a0a"/></linearGradient>' +
      '<linearGradient id="gPost" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#5a6479"/><stop offset=".35" stop-color="#e6ebf5"/><stop offset=".6" stop-color="#9aa5b8"/><stop offset="1" stop-color="#4b5468"/></linearGradient>' +
      '<linearGradient id="gBase" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#c9d2e6"/><stop offset=".5" stop-color="#7d889e"/><stop offset="1" stop-color="#3f4759"/></linearGradient>' +
      '<linearGradient id="gDish" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f7f9ff"/><stop offset=".5" stop-color="#b9c3d6"/><stop offset="1" stop-color="#5f6c86"/></linearGradient>' +
      '<radialGradient id="gKnob" cx=".35" cy=".3" r=".75"><stop offset="0" stop-color="#fff8d0"/><stop offset=".5" stop-color="#ffcc44"/><stop offset="1" stop-color="#a86a0a"/></radialGradient>' +
      '<radialGradient id="gBadge" cx=".35" cy=".3" r=".8"><stop offset="0" stop-color="#ffb3d6"/><stop offset=".6" stop-color="#f0569a"/><stop offset="1" stop-color="#b8306f"/></radialGradient>' +
      '<radialGradient id="gGlow" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#ffe98a" stop-opacity=".9"/><stop offset="1" stop-color="#ffe98a" stop-opacity="0"/></radialGradient>' +
      '</defs>' +
      '<ellipse cx="320" cy="356" rx="170" ry="14" fill="rgba(20,40,80,.3)"/>' +
      '<path d="M235,352 L405,352 Q412,352 408,344 L380,306 Q376,300 368,300 L272,300 Q264,300 260,306 L232,344 Q228,352 235,352 Z" fill="rgba(20,40,80,.3)"/>' +
      '<path d="M235,348 L405,348 Q412,348 408,340 L380,302 Q376,296 368,296 L272,296 Q264,296 260,302 L232,340 Q228,348 235,348 Z" fill="url(#gBase)"/>' +
      '<path d="M272,300 L368,300 L380,318 L260,318 Z" fill="rgba(255,255,255,.35)"/>' +
      '<rect x="305" y="85" width="30" height="218" rx="12" fill="url(#gPost)"/>' +
      '<rect x="311" y="90" width="7" height="206" rx="4" fill="rgba(255,255,255,.55)"/>' +
      '<g id="beam"><rect x="100" y="75" width="440" height="22" rx="11" fill="rgba(60,30,0,.25)"/><rect x="100" y="69" width="440" height="22" rx="11" fill="url(#gBeam)"/><rect x="112" y="73" width="416" height="6" rx="3" fill="rgba(255,255,255,.55)"/>' +
      '<circle cx="110" cy="80" r="8" fill="url(#gKnob)"/><circle cx="530" cy="80" r="8" fill="url(#gKnob)"/>' +
      '<path id="ptr" d="M320,62 L328,80 L312,80 Z" fill="#b8306f"/><circle cx="320" cy="80" r="20" fill="url(#gKnob)" stroke="#a86a0a" stroke-width="2"/><ellipse cx="314" cy="73" rx="7" ry="4" fill="rgba(255,255,255,.7)"/></g>' +
      hangHTML('L') + hangHTML('R') +
      '<text id="sideL" x="110" y="262" text-anchor="middle">Izquierda</text><text id="sideR" x="530" y="262" text-anchor="middle">Derecha</text>' +
      '</svg>';
    svg = stage.querySelector('svg'); beam = svg.querySelector('#beam');
    hangL = svg.querySelector('#hangL'); hangR = svg.querySelector('#hangR');
    itemsL = hangL.querySelector('.items'); itemsR = hangR.querySelector('.items');
    hangL.addEventListener('pointerdown', function (ev) { tapSide(ev, 'L'); });
    hangR.addEventListener('pointerdown', function (ev) { tapSide(ev, 'R'); });
    game.appendChild(stage);

    bottom = el('div', 'bottom'); game.appendChild(bottom);
    banner = el('div', 'rbanner'); game.appendChild(banner);
    setAngle(0);
  }
  function hangHTML(s) {
    return '<g id="hang' + s + '" class="hang">' +
      '<ellipse class="glow" cx="0" cy="104" rx="130" ry="40" fill="url(#gGlow)"/>' +
      '<line x1="0" y1="0" x2="-88" y2="100" stroke="#6d7a92" stroke-width="4" stroke-linecap="round"/><line x1="0" y1="0" x2="88" y2="100" stroke="#6d7a92" stroke-width="4" stroke-linecap="round"/>' +
      '<line x1="0" y1="0" x2="-88" y2="100" stroke="rgba(255,255,255,.5)" stroke-width="1.5"/><line x1="0" y1="0" x2="88" y2="100" stroke="rgba(255,255,255,.5)" stroke-width="1.5"/>' +
      '<circle cx="0" cy="0" r="7" fill="url(#gKnob)"/>' +
      '<path d="M-104,106 Q0,166 104,106 Z" fill="rgba(20,40,80,.25)"/>' +
      '<path class="dish" d="M-104,100 Q0,160 104,100 Z" fill="url(#gDish)"/>' +
      '<ellipse cx="0" cy="100" rx="104" ry="11" fill="#e9eef8" stroke="#8c96a8" stroke-width="3"/>' +
      '<ellipse cx="0" cy="98" rx="90" ry="6" fill="rgba(255,255,255,.7)"/>' +
      '<g class="items"></g>' +
      '<rect class="zone" x="-120" y="-10" width="240" height="160" fill="rgba(0,0,0,0)"/>' +
      '</g>';
  }
  function renderVit(newId) {
    var have = readJSON('kg-balanza-lab', []);
    vit.innerHTML = DECOS.map(function (d) { var on = have.indexOf(d[0]) >= 0; return '<span class="' + (on ? (d[0] === newId ? 'new on' : 'on') : 'off') + '" title="' + d[2] + '">' + (on ? d[1] : '🔒') + '</span>'; }).join('');
  }
  function showBanner(txt, ms) { banner.textContent = txt; banner.classList.add('show'); clearTimeout(banner._t); banner._t = setTimeout(function () { banner.classList.remove('show'); }, ms || 1100); }
  // Juice: acierto (partículas, anillo, +1 o racha) y fallo (sacudida suave; la racha se reinicia sin castigo)
  function hit(node) {
    streak++; mouseCheer();
    if (node) {
      var r = node.getBoundingClientRect();
      KidsGame.fx.burstAt(node, { n: 12, chars: streak >= 3 ? ['⭐', '✨', '🧪'] : null }); KidsGame.fx.ring(node);
      KidsGame.fx.floatText(r.left + r.width / 2, r.top, streak >= 3 ? '¡Racha x' + streak + '!' : '+1', 'good');
    }
    if (streak >= 3 && streak % 5 === 0) { KidsGame.addStar(); KidsGame.toast('🔥 ¡Racha x' + streak + '! ⭐ extra', 1400); KidsGame.sound.win(); }
  }
  function miss(node) { streak = 0; if (node) KidsGame.fx.shake(node); }

  function setAngle(a) {
    beam.style.transform = 'rotate(' + a + 'deg)';
    var r = a * Math.PI / 180, d = 210;
    hangL.style.transform = 'translate(' + (320 - d * Math.cos(r)) + 'px,' + (80 - d * Math.sin(r)) + 'px)';
    hangR.style.transform = 'translate(' + (320 + d * Math.cos(r)) + 'px,' + (80 + d * Math.sin(r)) + 'px)';
  }
  function sumW(arr) { var s = 0; for (var i = 0; i < arr.length; i++) s += arr[i].w; return s; }
  function tilt() {
    if (cur.locked) { setAngle(0); return; }
    var diff = sumW(cur.R) - sumW(cur.L);
    setAngle(Math.max(-16, Math.min(16, diff * 4)));
  }

  function renderItems(g, arr, side) {
    g.innerHTML = '';
    var n = arr.length, per = n > 10 ? 6 : 5, rows = Math.ceil(n / per), big = n <= 3;
    var fs = big ? 48 : (n <= 6 ? 38 : 30), gap = fs + 4;
    for (var i = 0; i < n; i++) {
      var row = Math.floor(i / per), inRow = Math.min(per, n - row * per), col = i % per;
      var x = (col - (inRow - 1) / 2) * gap, y = 92 - row * (fs * 0.95);
      var t = sv('text', { x: x, y: y, 'text-anchor': 'middle', 'font-size': fs, 'class': 'item' });
      t.textContent = arr[i].e;
      if (i === n - 1 && arr[i].fresh) { t.style.animation = 'pop .35s ease-out'; t.style.transformOrigin = x + 'px ' + (y - fs / 2) + 'px'; arr[i].fresh = false; }
      (function (idx) { t.addEventListener('pointerdown', function (ev) { ev.stopPropagation(); ev.preventDefault(); removeItem(side, idx); }); })(i);
      g.appendChild(t);
      if (arr[i].showW) {
        var b = sv('g', { 'class': 'wbadge', transform: 'translate(' + (x + fs * 0.42) + ',' + (y - fs * 0.78) + ')' });
        b.innerHTML = '<circle r="13" fill="url(#gBadge)" stroke="#fff" stroke-width="2"/><text y="6" text-anchor="middle">' + arr[i].w + '</text>';
        g.appendChild(b);
      }
    }
    if (arr.length === 0 && cur.qmark && side === 'R') {
      var q = sv('text', { x: 0, y: 80, 'text-anchor': 'middle', 'class': 'qmark' }); q.textContent = '?'; g.appendChild(q);
    }
  }
  function render() { renderItems(itemsL, cur.L, 'L'); renderItems(itemsR, cur.R, 'R'); tilt(); }

  function showPicker() {
    running = false; lock = true;
    if (bottom) { bottom.innerHTML = ''; rules.innerHTML = ''; }
    KidsGame.levelPicker({ key: 'balanza', labels: LABELS, howto: HOWTO, art: mouseSVG(64), music: 'calma', onPick: function (lv) { start(lv); } });
  }
  function start(lv) { nivel = lv; round = 0; running = true; streak = 0; build(); newRound(true); }

  function mk(e, w, showW) { return { e: e, w: w, showW: !!showW }; }
  function rep(e, w, n, showW) { var a = []; for (var i = 0; i < n; i++) a.push(mk(e, w, showW)); return a; }
  function pair(pool) { var s = KidsGame.shuffle(pool); return [s[0], s[1]]; }

  function makeRound() {
    var c = { mode: 'drag', L: [], R: [], tray: null, rules: [], ask: '', opts: null, ans: 0, locked: false, qmark: false, instr: '', say: '' };
    var e, e2, e3, n, r, k, p, q, w;
    if (nivel === 1) {
      e = KidsGame.pick(FRUITS.concat(ANIMALS)); n = 2 + KidsGame.rand(5);
      c.L = rep(e, 1, n); c.tray = { e: e, w: 1, n: Math.max(6, n + 3) };
      c.instr = 'Pon las mismas en el otro plato'; c.say = 'Hay ' + n + ' ' + NAMES[e] + '. Pon las mismas en el otro plato para que quede igual.';
    } else if (nivel === 2) {
      if (round % 2 === 0) {
        c.mode = 'tap'; c.locked = true;
        var two = Math.random() < 0.5; var ps = pair(ANIMALS); e = ps[0]; e2 = ps[1];
        if (two) {
          w = 1 + KidsGame.rand(5); p = 1 + KidsGame.rand(9);
          while (p === 2 * w) p = 1 + KidsGame.rand(9);
          c.L = rep(e, w, 2, true); c.R = [mk(e2, p, true)];
        } else {
          w = 1 + KidsGame.rand(9); p = 1 + KidsGame.rand(9); while (p === w) p = 1 + KidsGame.rand(9);
          c.L = [mk(e, w, true)]; c.R = [mk(e2, p, true)];
        }
        if (Math.random() < 0.5) { var t = c.L; c.L = c.R; c.R = t; }
        c.ans = sumW(c.L) > sumW(c.R) ? 'L' : 'R';
        c.instr = '¿Qué lado pesa más? Tócalo'; c.say = 'Mira los números. ¿Qué lado pesa más? Tócalo.';
      } else {
        e = KidsGame.pick(BIG); w = 2 + KidsGame.rand(5);
        c.L = [mk(e, w, true)]; c.tray = { e: '🧱', w: 1, n: w + 3, showW: true };
        c.instr = 'Pon ladrillos hasta que quede igual'; c.say = SING[e] + ' pesa ' + w + '. Cada ladrillo pesa 1. Pon ladrillos hasta que quede igual.';
      }
    } else if (nivel === 3) {
      if (round % 2 === 0) {
        c.mode = 'choice'; var pf = pair(FRUITS); e = pf[0]; e2 = pf[1]; r = 2 + KidsGame.rand(3);
        c.L = rep(e, r, 2); c.R = rep(e2, 1, 2 * r);
        c.ans = r; c.opts = KidsGame.shuffle([r, r + 1, r === 2 ? 4 : r - 1]);
        c.ask = e + ' <span class="eq">=</span> <span class="q">?</span> ' + e2;
        c.instr = '¿Cuántas ' + NAMES[e2] + ' pesa ' + SING[e] + '?';
        c.say = '2 ' + NAMES[e] + ' pesan igual que ' + (2 * r) + ' ' + NAMES[e2] + '. ¿Cuántas ' + NAMES[e2] + ' pesa ' + SING[e] + '?';
      } else {
        e = KidsGame.pick(BIG); e2 = KidsGame.pick(SMALL); r = 2 + KidsGame.rand(3); k = r === 4 ? 2 : 2 + KidsGame.rand(2);
        c.rules = [[e, 1], [e2, r]];
        c.L = rep(e, r, k); c.tray = { e: e2, w: 1, n: Math.min(14, k * r + 3) };
        c.instr = 'Pon ' + NAMES[e2] + ' hasta que quede igual';
        c.say = SING[e] + ' pesa igual que ' + r + ' ' + NAMES[e2] + '. Hay ' + k + ' ' + NAMES[e] + '. ¿Cuántos ' + NAMES[e2] + ' necesitas para que quede igual?';
      }
    } else {
      var tri = KidsGame.shuffle(FRUITS).slice(0, 3); e = tri[0]; e2 = tri[1]; e3 = tri[2];
      p = 2 + KidsGame.rand(2); q = 2 + KidsGame.rand(3); if (p * q > 12) q = 3;
      c.rules = [[e, 1], [e2, p], [e2, 1], [e3, q]];
      if (round % 2 === 0) {
        c.L = [mk(e, p * q)]; c.tray = { e: e3, w: 1, n: Math.min(15, p * q + 3) };
        c.instr = 'Pon ' + NAMES[e3] + ' hasta que quede igual';
        c.say = SING[e] + ' pesa ' + p + ' ' + NAMES[e2] + '. Y ' + SING[e2] + ' pesa ' + q + ' ' + NAMES[e3] + '. ¿Cuántas ' + NAMES[e3] + ' pesa ' + SING[e] + '? Ponlas en el plato.';
      } else {
        c.mode = 'choice'; c.qmark = true; k = p * q >= 8 ? 1 : 2;
        c.L = rep(e, p * q, k); c.ans = k * p * q;
        var ds = KidsGame.shuffle([c.ans - 2, c.ans + 2, c.ans - 1, c.ans + 1, c.ans + 3].filter(function (v) { return v > 0; })).slice(0, 2);
        c.opts = KidsGame.shuffle(ds.concat([c.ans]));
        c.ask = (k === 2 ? e + e : e) + ' <span class="eq">=</span> <span class="q">?</span> ' + e3;
        c.instr = '¿Cuántas ' + NAMES[e3] + '?';
        c.say = SING[e] + ' pesa ' + p + ' ' + NAMES[e2] + '. Y ' + SING[e2] + ' pesa ' + q + ' ' + NAMES[e3] + '. ¿Cuántas ' + NAMES[e3] + ' pesan ' + (k === 2 ? '2 ' + NAMES[e] : SING[e]) + '?';
      }
    }
    return c;
  }

  // Entre rondas todo sale deslizando y la ronda nueva entra (nunca un cambio seco)
  function newRound(first) {
    if (!running) return;
    var parts = [rules, stage, bottom];
    if (!first) { lock = true; parts.forEach(function (p) { p.classList.add('out'); }); setTimeout(function () { parts.forEach(function (p) { p.classList.remove('out'); }); doRound(); }, 300); }
    else doRound();
  }
  function doRound() {
    if (!running) return;
    cur = makeRound(); lock = false;
    instrTxt.textContent = cur.instr; sayText = cur.say;
    rules.innerHTML = '';
    for (var i = 0; i < cur.rules.length; i += 2) {
      var a = cur.rules[i], b = cur.rules[i + 1];
      var rc = el('div', 'rule card', '<span class="emoji">' + rp(a[0], a[1]) + '</span><span class="eq">=</span><span class="emoji">' + rp(b[0], b[1]) + '</span>');
      rc.style.animationDelay = (i * 80) + 'ms'; rules.appendChild(rc);
    }
    if (cur.ask) rules.appendChild(el('div', 'rule card ask', cur.ask));
    svg.className.baseVal = cur.mode === 'tap' ? 'tapmode' : '';
    hangL.className.baseVal = 'hang' + (cur.mode === 'tap' ? ' tappable' : ''); hangR.className.baseVal = hangL.className.baseVal;
    bottom.innerHTML = '';
    if (cur.mode === 'choice') {
      var nums = el('div', 'nums panel');
      cur.opts.forEach(function (v, i) {
        var n = el('div', 'num ' + ['c1', 'c2', 'c3'][i], String(v)); n.style.animationDelay = (300 + i * 90) + 'ms';
        n.addEventListener('pointerdown', function (ev) { ev.preventDefault(); choose(n, v); });
        nums.appendChild(n);
      });
      bottom.appendChild(nums);
    } else if (cur.tray) {
      var tray = el('div', 'tray');
      for (var j = 0; j < cur.tray.n; j++) tray.appendChild(makeObj(cur.tray));
      bottom.appendChild(tray);
    }
    render();
    [rules, stage, bottom].forEach(function (p) { p.classList.add('in'); });
    void stage.offsetWidth;
    [rules, stage, bottom].forEach(function (p) { p.classList.remove('in'); });
    showBanner('Ronda ' + (round + 1) + ' de ' + ROUNDS);
    KidsGame.say(sayText);
    // Tutorial: en la primera ronda del nivel 1 la manita arrastra una cosa al plato vacío
    if (nivel === 1 && round === 0 && !handShown) { handShown = true; setTimeout(function () { var o = bottom.querySelector('.obj'); if (running && !lock && o) KidsGame.hand({ from: o, to: hangR }); }, 1000); }
  }
  function rp(e, n) { var s = ''; for (var i = 0; i < n; i++) s += e; return s; }

  function makeObj(t) {
    var o = el('div', 'obj pop', '<span class="emoji">' + t.e + '</span>' + (t.showW ? '<span class="w">' + t.w + '</span>' : ''));
    o.style.animationDelay = (Math.random() * 3) + 's';
    o.addEventListener('pointerdown', function (ev) { startDrag(ev, o, t); });
    return o;
  }
  function startDrag(ev, o, t) {
    if (lock || !running || cur.mode !== 'drag') return;
    ev.preventDefault();
    var g = el('div', 'ghost', t.e); document.body.appendChild(g);
    g.style.left = ev.clientX + 'px'; g.style.top = ev.clientY + 'px';
    o.classList.add('lifted'); KidsGame.sound.tap();
    function mv(e) { g.style.left = e.clientX + 'px'; g.style.top = e.clientY + 'px'; hangR.classList.toggle('hot', overPan(e.clientX, e.clientY)); }
    function up(e) {
      document.removeEventListener('pointermove', mv); document.removeEventListener('pointerup', up); document.removeEventListener('pointercancel', up);
      g.remove(); hangR.classList.remove('hot');
      if (overPan(e.clientX, e.clientY)) { o.remove(); addItem(t); } else o.classList.remove('lifted');
    }
    document.addEventListener('pointermove', mv); document.addEventListener('pointerup', up); document.addEventListener('pointercancel', up);
  }
  function overPan(x, y) {
    var r = hangR.getBoundingClientRect(); var m = 30;
    return x >= r.left - m && x <= r.right + m && y >= r.top - m && y <= r.bottom + m;
  }
  function addItem(t) {
    var it = mk(t.e, t.w, t.showW); it.fresh = true; cur.R.push(it);
    KidsGame.sound.pop(); render(); checkBalance();
  }
  function removeItem(side, idx) {
    if (lock || !running || cur.mode !== 'drag' || side !== 'R') return;
    cur.R.splice(idx, 1);
    var tray = bottom.querySelector('.tray'); if (tray) tray.appendChild(makeObj(cur.tray));
    KidsGame.sound.tap(); render();
  }
  function checkBalance() {
    var wl = sumW(cur.L), wr = sumW(cur.R);
    if (wr === wl) { lock = true; setTimeout(function () { win(); }, 700); }
    else if (wr > wl) { streak = 0; setTimeout(function () { if (!lock) { KidsGame.fx.shake(hangR); KidsGame.say('Se pasó. Quita uno.'); } }, 600); }
  }
  function tapSide(ev, side) {
    if (lock || !running || cur.mode !== 'tap') return;
    ev.preventDefault();
    var h = side === 'L' ? hangL : hangR;
    if (side !== cur.ans) {
      KidsGame.sound.wrong(); KidsGame.vibrate(20); miss(h);
      h.classList.remove('bad'); void h.getBoundingClientRect(); h.classList.add('bad');
      setTimeout(function () { h.classList.remove('bad'); }, 450);
      return;
    }
    lock = true; cur.locked = false; tilt();
    setTimeout(function () { win(); }, 500);
  }
  function choose(n, v) {
    if (lock || !running) return;
    if (v !== cur.ans) {
      KidsGame.sound.wrong(); KidsGame.vibrate(20); miss(n);
      n.classList.remove('bad'); void n.offsetWidth; n.classList.add('bad');
      setTimeout(function () { n.classList.remove('bad'); }, 450);
      return;
    }
    lock = true; n.classList.add('ok');
    var all = bottom.querySelectorAll('.num'); for (var i = 0; i < all.length; i++) if (all[i] !== n) all[i].classList.add('dim');
    if (cur.qmark) { var e3 = cur.rules[3][0]; cur.R = rep(e3, 1, cur.ans); cur.qmark = false; render(); }
    var ask = rules.querySelector('.ask .q'); if (ask) ask.textContent = cur.ans;
    setTimeout(function () { win(); }, 400);
  }

  function win() {
    lock = true;
    hangL.classList.add('win'); hangR.classList.add('win');
    KidsGame.sound.ok(); KidsGame.addStar(); KidsGame.vibrate(30);
    hit(hangR); KidsGame.fx.burstAt(hangL, { n: 10 }); KidsGame.fx.ring(hangL);
    KidsGame.say(KidsGame.pick(['¡Quedó igual!', '¡Equilibrio!', '¡Muy bien!', '¡Eso es!']));
    dots.children[round].classList.add('on'); round++;
    setTimeout(function () { if (!running) return; if (round >= ROUNDS) finish(); else newRound(); }, 1600);
  }
  function finish() {
    running = false;
    KidsGame.levelDone(nivel);
    var sub = '¡' + ROUNDS + ' balanzas equilibradas!';
    // Recompensa cosmética: una poción nueva en la repisa por nivel completado
    var have = readJSON('kg-balanza-lab', []), d = DECOS[nivel - 1];
    if (d && have.indexOf(d[0]) < 0) { have.push(d[0]); writeJSON('kg-balanza-lab', have); renderVit(d[0]); sub += ' · ' + d[1] + ' ¡Ganaste ' + d[2] + '!'; }
    KidsGame.celebrate({
      sub: sub,
      onNext: nivel < 4 ? function () { start(nivel + 1); } : null,
      onAgain: function () { start(nivel); }
    });
  }

  window.__g3 = {
    state: function () { return cur && { mode: cur.mode, L: sumW(cur.L), R: sumW(cur.R), ans: cur.ans, round: round, nivel: nivel, lock: lock, streak: streak }; },
    solve: function () {
      if (!cur || lock) return false;
      if (cur.mode === 'drag') { var need = sumW(cur.L) - sumW(cur.R); for (var i = 0; i < need; i++) { var o = bottom.querySelector('.obj'); if (o) o.remove(); addItem(cur.tray); } return true; }
      if (cur.mode === 'tap') { tapSide({ preventDefault: function () {} }, cur.ans); return true; }
      if (cur.mode === 'choice') { var ns = bottom.querySelectorAll('.num'); for (var j = 0; j < ns.length; j++) if (parseInt(ns[j].textContent, 10) === cur.ans) { choose(ns[j], cur.ans); return true; } }
      return false;
    },
    wrong: function () {
      if (!cur || lock) return false;
      if (cur.mode === 'tap') { tapSide({ preventDefault: function () {} }, cur.ans === 'L' ? 'R' : 'L'); return true; }
      if (cur.mode === 'choice') { var ns = bottom.querySelectorAll('.num'); for (var j = 0; j < ns.length; j++) if (parseInt(ns[j].textContent, 10) !== cur.ans) { choose(ns[j], parseInt(ns[j].textContent, 10)); return true; } }
      if (cur.mode === 'drag') { var o = bottom.querySelector('.obj'); if (o) o.remove(); addItem(cur.tray); return true; }
      return false;
    }
  };
  showPicker();
})();
